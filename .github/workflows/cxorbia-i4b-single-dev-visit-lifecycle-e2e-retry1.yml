            const st=await token(shopperUid),ot=await token(operator.uid);await visitRef.create({id:visitId,visitId,tenantId:r.tenantId,projectId:r.projectId,estado:'disponible',status:'disponible',shopperId:null,shopper:null,hrRowId:null,source:'i4b-synthetic-e2e-retry1',sourceRequestId:r.requestId,synthetic:true,nonHistorical:true,nonHr:true,testFixture:true,version:1,createdAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});ev.counters.syntheticFixtureCreates++;
