name: CXOrbia I4B Single DEV Visit Lifecycle E2E Retry1

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths: [.github/workflows/cxorbia-i4b-single-dev-visit-lifecycle-e2e-retry1.yml]

permissions:
  contents: write

concurrency:
  group: cxorbia-i4b-single-dev-visit-lifecycle-e2e-retry1
  cancel-in-progress: true

env:
  REQUEST_FILE: backend/config/i4b-single-dev-visit-lifecycle-e2e-write-gate-request.json
  SHOPPER_REQUEST: backend/config/i4a-dedicated-test-shopper-create-request.json
  OUT_DIR: .tmp/i4b-single-dev-visit-lifecycle-e2e-retry1
  PRIVATE_DIR: .tmp/i4b-single-dev-visit-lifecycle-private-retry1
  EVIDENCE_FILE: app/docs/evidence/I4B-VISIT-LIFECYCLE-E2E-RETRY1-RUNTIME-OBSERVED.json
  WORKFLOW_FILE: .github/workflows/cxorbia-i4b-single-dev-visit-lifecycle-e2e-retry1.yml

jobs:
  synthetic-lifecycle-e2e-retry1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate exact retry authorization and safe lineage
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$PRIVATE_DIR"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const changed=cp.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(head!==process.env.GITHUB_SHA)throw new Error('HEAD_SHA_MISMATCH');
          if(changed.length!==1||changed[0]!==process.env.WORKFLOW_FILE)throw new Error('WORKFLOW_TRIGGER_COMMIT_SCOPE_INVALID');
          cp.execFileSync('git',['merge-base','--is-ancestor',r.sourceHeadSha,'HEAD']);
          const exact=r.schemaVersion==='cxorbia.i4b.visit-lifecycle-write-gate.v1'&&r.gateId==='NEW_AUTH_REQUIRED_I4B_SINGLE_DEV_VISIT_LIFECYCLE_E2E_WRITE_GATE_RETRY1__HARNESS_SCOPE_FIXED__SYNTHETIC_VISIT_ONLY'&&r.requestId==='cxorbia-i4b-single-dev-visit-lifecycle-e2e-retry1-20260819-01'&&r.sourceHeadSha==='0d188cabf709dc8cc6d215ab9d27d2175331bf69'&&r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&Number(r.pullRequest)===7&&r.firebaseProjectId==='cxorbia-backend-dev'&&r.tenantId==='tya'&&r.projectId==='cinepolis'&&r.enabled===true&&r.consumed===false&&r.status==='authorized_execute_once_retry1_harness_scope_fixed'&&r.authorizedBy==='Paula'&&r.authorizationText==='autorizo pero agiliza'&&r.allowedExecutions===1&&r.executionsConsumed===0&&r.singleConsolidatedGate===true&&r.syntheticVisitOnly===true&&r.historicalShopperAccess===false&&r.realHrVisitMutationAllowed===false&&Number(r.providerCommandCallsMax)===11&&Number(r.providerCommittedCallsMax)===10&&Number(r.providerWritesReportedMax)===30&&r.authCreates===0&&r.authClaimsWrites===0&&r.authPasswordUpdates===0&&r.authPasswordResets===0&&r.authDeletes===0&&r.otherIdentitiesModified===0&&r.hrWrites===0&&r.rulesWrites===0&&r.storageWrites===0&&r.makeCalls===0&&r.geminiCalls===0&&r.paymentWrites===0&&r.hostingDeploys===0&&r.cloudRunDeploys===0&&r.merge===false&&r.production===false&&r.automaticRetryAllowed===false;
          if(!exact)throw new Error('RETRY_AUTHORIZATION_CONTRACT_INVALID');
          console.log(JSON.stringify({decision:'PASS_I4B_RETRY1_AUTHORIZATION_LINEAGE',head,sourceHead:r.sourceHeadSha,gateId:r.gateId}));
          NODE

      - name: Verify canonical source truth and provider source before writes
        run: |
          set -euo pipefail
          SOURCE_HEAD=$(node -p "require('./$REQUEST_FILE').sourceHeadSha")
          git worktree add --detach .tmp/source-truth "$SOURCE_HEAD" >/dev/null
          (cd .tmp/source-truth && CXORBIA_ALLOW_DETACHED_HEAD=1 node tools/verify-cxorbia-source-truth-sync.mjs) > "$OUT_DIR/source-truth.json"
          node -e "const x=require('./$OUT_DIR/source-truth.json');if(x.decision!=='PASS_SOURCE_TRUTH_SYNC')process.exit(1);console.log(x.decision)"
          node tools/verify-cxorbia-i4b-visit-provider-source.mjs > "$OUT_DIR/provider-source.json"
          node -e "const x=require('./$OUT_DIR/provider-source.json');if(x.decision!=='PASS_I4B_VISIT_PROVIDER_SOURCE')process.exit(1);console.log(x.decision)"
          node --input-type=module -e "import {harnessStatus} from './tools/cxorbia-i4b-e2e-harness-v1.mjs';const x=harnessStatus();if(!x.providerPassedExplicitly||x.globalProviderDependency)process.exit(1);console.log(JSON.stringify(x));" > "$OUT_DIR/harness-status.json"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install transient provider dependency
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Prepare DEV credential privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),raw=process.env.EXISTING_DEV_JSON||'';let x;
          try{x=JSON.parse(raw)}catch{}
          if(!(x&&x.type==='service_account'&&x.project_id==='cxorbia-backend-dev'&&x.client_email&&x.private_key))throw new Error('DEV_SERVICE_ACCOUNT_INVALID');
          fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"

