          const save=()=>{fs.mkdirSync(process.env.OUT_DIR,{recursive:true});fs.writeFileSync(process.env.OUT_DIR+'/evidence.json',JSON.stringify(ev,null,2)+'\n');},cmd=(type,entityType,entityId,expectedVersion,payload,role,tag)=>({version:'cxorbia-command-adapter-v1',commandType:type,entityType,entityId,tenantId:r.tenantId,projectId:r.projectId,actor:{actorId:'provider-verified',role,projectIds:[r.projectId],shopperId:role==='shopper'?shopperId:null},expectedVersion,idempotencyKey:`i4b-r1:${r.requestId}:${tag}`,payload,source:'i4b-e2e-retry1-gate',requestedAt:new Date().toISOString(),authorization:{providerEnforcementRequired:true},audit:{reason:'I4B synthetic lifecycle E2E retry1',correlationId:r.requestId}}),ver=async ref=>{const s=await ref.get();if(!s.exists)throw new Error('EXPECTED_ENTITY_MISSING:'+ref.path);return s.data()?.version??'source-current';},token=async uid=>{const custom=await auth.createCustomToken(uid,{i4bSyntheticE2ERetry1:true});const init=await fetch('https://cxorbia-backend-dev.web.app/__/firebase/init.json',{cache:'no-store'}),cfg=init.ok?await init.json():{};if(!cfg.apiKey)throw new Error('FIREBASE_WEB_API_KEY_UNAVAILABLE');const resp=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(cfg.apiKey),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})}),body=await resp.json();if(!resp.ok||!body.idToken)throw new Error('CUSTOM_TOKEN_EXCHANGE_FAILED');return body.idToken;};
