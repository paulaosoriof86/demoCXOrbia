          test "$(jq -r '.status.latestReadyRevisionName // empty' "$VRM185_ADMIN_OUT/runtime.json")" = "$EXPECTED_RUNTIME_REVISION"
          gcloud run revisions describe "$EXPECTED_RUNTIME_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$VRM185_ADMIN_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$VRM185_ADMIN_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
