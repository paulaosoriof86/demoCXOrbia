            curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&v21=$GITHUB_RUN_ID-$i" > "$V21_OUT/hr-meta.json"
            if jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .refreshError==null and .shopperReconciliation.providerAck==true and .visitReconciliation.providerAck==true and .hrWrites==false and .production==false and ((.refreshStartedAt==null) or (.refreshFinishedAt!=null and .refreshFinishedAt>=.refreshStartedAt))' "$V21_OUT/hr-meta.json" >/dev/null; then ok=1; break; fi
            sleep 20
          done
          test "$ok" = 1
          HR_REVISION="$(jq -r '.revision // empty' "$V21_OUT/hr-meta.json")"
          [[ "$HR_REVISION" =~ ^[0-9a-f]{64}$ ]]
          echo "HR_REVISION=$HR_REVISION" >> "$GITHUB_ENV"

      - name: Run exact Paula + Admin live focal proof
        run: |
          set -Eeuo pipefail
          V21_OUT="$V21_OUT" V21_ROOT="$HOSTING_URL" V21_SOURCE="$V21_SOURCE" node tools/qa/cxorbia-i3-v21-paula-remediation-live.mjs | tee "$V21_OUT/browser.log"
          test "$(jq -r '.decision' "$V21_OUT/v21-paula-remediation-live.json")" = "PASS_I3_V21_PAULA_REMEDIATION_LIVE"
          test "$(jq -r '.shopper.sourceRevision' "$V21_OUT/v21-paula-remediation-live.json")" = "$HR_REVISION"
          test "$(jq -r '.admin.sourceRevision' "$V21_OUT/v21-paula-remediation-live.json")" = "$HR_REVISION"

      - name: Seal V21 DEV receipt
        run: |
