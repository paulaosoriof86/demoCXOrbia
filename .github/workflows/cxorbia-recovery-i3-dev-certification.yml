              proofFixture:true,production:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
            };
            await ref.set(create,{merge:false});writes++;
            let snap=await ref.get();
            if(!snap.exists||snap.data().status!=='active'||snap.data().version!==1||snap.data().projectId!=='cinepolis')throw new Error('PERSISTENCE_FAILURE:VRM039_RESOURCE_CREATE_READBACK');

            await db.runTransaction(async tx=>{
              const cur=await tx.get(ref);
              if(!cur.exists)throw new Error('PERSISTENCE_FAILURE:VRM039_RESOURCE_UPDATE_MISSING');
              const d=cur.data()||{};
              tx.set(ref,{...d,n:'VRM039 Resource Proof Updated',version:Number(d.version||0)+1,lastIdempotencyKey:'vrm039.update:'+process.env.GITHUB_RUN_ID,updatedAt:new Date().toISOString()},{merge:false});
            });writes++;
            snap=await ref.get();
            if(snap.data()?.n!=='VRM039 Resource Proof Updated'||snap.data()?.version!==2)throw new Error('PERSISTENCE_FAILURE:VRM039_RESOURCE_UPDATE_READBACK');

            await db.runTransaction(async tx=>{
              const cur=await tx.get(ref);if(!cur.exists)throw new Error('PERSISTENCE_FAILURE:VRM039_RESOURCE_DELETE_MISSING');
              const d=cur.data()||{};
              tx.set(ref,{...d,status:'deleted',version:Number(d.version||0)+1,lastIdempotencyKey:'vrm039.delete:'+process.env.GITHUB_RUN_ID,deletedAt:new Date().toISOString(),updatedAt:new Date().toISOString()},{merge:false});
            });writes++;
            snap=await ref.get();
            if(snap.data()?.status!=='deleted'||snap.data()?.version!==3)throw new Error('PERSISTENCE_FAILURE:VRM039_RESOURCE_SOFT_DELETE_READBACK');
          } finally {
