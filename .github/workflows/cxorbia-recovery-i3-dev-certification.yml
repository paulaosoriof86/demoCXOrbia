name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: 296c8c906e03ad2bf9a06589798f65acd9a94559
  WF: .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  HOSTING: cxorbia-dev
  ROOT: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-dev

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze transport
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          echo "SRC=$RUNNER_TEMP/recovery-source" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WF"
          printf '{"authorizedBy":"Paula","sourceSha":"%s","transportSha":"%s","project":"%s","production":false,"singleLane":true}\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$PROJECT" > "$OUT/authorization.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate existing Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Materialize exact candidate and Gate 6 source tests
        run: |
          set -euo pipefail
          git worktree add --detach "$SRC" "$SOURCE_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"
          cd "$SRC"
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          node --check backend/runtime/hr-live-service/server.mjs
          node --test backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs \
            | tee "$GITHUB_WORKSPACE/$OUT/gate6-unit.tap"
          grep -Fq 'cxorbia-shopper-command-provider-v1.mjs' backend/runtime/hr-live-service/Dockerfile
          printf '{"sourceSha":"%s","sourceTree":"%s","shoppersBlob":"%s","production":false}\n' \
            "$SOURCE_SHA" \
            "$(git rev-parse HEAD^{tree})" \
            "$(git rev-parse HEAD:app/modules/shoppers.js)" \
            > "$GITHUB_WORKSPACE/$OUT/source-visual-lock.json"

      - name: Install Hosting and visual tooling
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Deploy exact candidate to existing Hosting DEV
        id: hosting
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$SRC"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy \
            --config firebase.json \
            --only "hosting:$HOSTING" \
            --project "$PROJECT" \
            --non-interactive

      - name: Hosting byte parity for Gate 6 visual surface
        id: parity
        if: steps.hosting.outcome == 'success'
        run: |
          set -euo pipefail
          for asset in index-backend-dev.html modules/shoppers.js; do
            curl -fsSL --retry 10 --retry-delay 3 -H 'Cache-Control: no-cache' \
              "$ROOT/$asset?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/$(basename "$asset")"
            cmp "$SRC/app/$asset" "$RUNNER_TEMP/$(basename "$asset")"
          done
          printf '{"decision":"PASS_GATE6_VISUAL_BYTE_PARITY","sourceSha":"%s","hostingRoot":"%s","assets":["index-backend-dev.html","modules/shoppers.js"],"production":false}\n' \
            "$SOURCE_SHA" "$ROOT" > "$OUT/hosting-parity.json"

      - name: Read-only staff credential and Shoppers visual proof
        id: visual
        if: steps.hosting.outcome == 'success' && steps.parity.outcome == 'success'
        continue-on-error: true
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
          CXORBIA_C6_ACTION: C6_LIVE_USER_ADMIN_FRONTEND_WIRING_RUNTIME_READONLY_PROOF
          PRIVATE_DIR: ${{ runner.temp }}/private
          CXORBIA_E2E_PRIVATE_CREDENTIALS: ${{ runner.temp }}/private/e2e.json
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/node_modules" "$SRC/node_modules"
          cd "$SRC"
          node tools/qa/cxorbia-c6-existing-users-e2e-credentials.mjs > "$GITHUB_WORKSPACE/$OUT/staff-credential-selection.jsonl"
          rm -f node_modules
          cd "$GITHUB_WORKSPACE"
          cat > "$OUT/visual.mjs" <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const out=process.env.OUT, root=process.env.ROOT;
          const creds=JSON.parse(fs.readFileSync(process.env.CXORBIA_E2E_PRIVATE_CREDENTIALS,'utf8'));
          if(!creds.staff) throw new Error('VISUAL_STAFF_CREDENTIAL_MISSING');
          const token='YES_PAULA_20260801_REAL_USERS_E2E';
          const u=new URL(root+'/index-backend-dev.html');
          u.searchParams.set('cxTechnicalAuthE2E',token);
          u.searchParams.set('cxTechnicalAuthNamespace','staff');
          const browser=await chromium.launch({headless:true});
          try{
            const context=await browser.newContext({viewport:{width:1440,height:1050},serviceWorkers:'block'});
            const page=await context.newPage();
            await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#cxDevEntryAuth',{timeout:30000});
            await page.fill('#cxDevEntryLogin',creds.staff.login);
            await page.fill('#cxDevEntryPassword',creds.staff.password);
            await page.click('#cxDevEntrySubmit');
            await page.waitForFunction(()=>{
              const c=window.CX?.backendAuth?.context?.();
              return c?.authenticated===true&&c?.authNamespace==='staff'&&
                document.getElementById('app')?.classList.contains('on')&&
                Array.isArray(window.CX?.data?._visitas)&&window.CX.data._visitas.length>0;
            },{timeout:90000});
            await page.evaluate(()=>CX.router.nav('shoppers'));
            await page.waitForFunction(()=>document.body.innerText.includes('Shoppers / Auditores')&&document.querySelectorAll('#shBody tr').length>0,{timeout:30000});
            const observed=await page.evaluate(()=>({
              title:document.body.innerText.includes('Shoppers / Auditores'),
              rows:document.querySelectorAll('#shBody tr').length,
              kpis:document.querySelectorAll('#shKpis .kpi').length,
              sourceReady:Array.isArray(window.CX?.data?._visitas)&&window.CX.data._visitas.length>0,
              authNamespace:window.CX?.backendAuth?.context?.().authNamespace||null,
              role:window.CX?.backendAuth?.context?.().role||null
            }));
            if(!observed.title||observed.rows<1||observed.authNamespace!=='staff') throw new Error('VISUAL_SHOPPERS_NOT_RENDERED');
            await page.evaluate(()=>{
              document.querySelectorAll('#shBody tr').forEach(r=>{
                const cells=r.querySelectorAll('td');
                if(cells[0]) cells[0].innerHTML='<b>IDENTIDAD PROTEGIDA</b>';
                if(cells[1]) cells[1].textContent='—';
              });
            });
            await page.locator('#view').screenshot({path:out+'/gate6-shoppers-visual-dev.png'});
            fs.writeFileSync(out+'/visual.json',JSON.stringify({
              decision:'PASS_GATE6_SHOPPERS_VISUAL_PRECERTIFICATION',sourceSha:process.env.SOURCE_SHA,
              hostingRoot:root,observed,piiMaskedInScreenshot:true,backendGate6Certified:false,production:false
            },null,2)+'\n');
            await context.close();
          } finally { await browser.close(); }
          NODE
          ROOT="$ROOT" OUT="$OUT" SOURCE_SHA="$SOURCE_SHA" node "$OUT/visual.mjs"
          rm -rf "$RUNNER_TEMP/private" "$OUT/visual.mjs"

      - name: Setup gcloud for IAM readback
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT }}'

      - name: DEV IAM preflight only
        id: iam
        continue-on-error: true
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          endpoint="https://iam.googleapis.com/v1/projects/$PROJECT/serviceAccounts/$RUNTIME_SA:testIamPermissions"
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"permissions":["iam.serviceAccounts.actAs","iam.serviceAccounts.setIamPolicy"]}' \
            "$endpoint" > "$OUT/iam-permissions.json"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.OUT+'/iam-permissions.json','utf8'));
          const s=new Set(p.permissions||[]);
          const actAs=s.has('iam.serviceAccounts.actAs');
          const setIamPolicy=s.has('iam.serviceAccounts.setIamPolicy');
          fs.writeFileSync(process.env.OUT+'/iam-preflight.json',JSON.stringify({
            decision:actAs?'PASS_ACTAS_PRESENT':'HOLD_EXTERNAL_IAM_REQUIRED',actAs,setIamPolicy,iamWrites:0,production:false
          },null,2)+'\n');
          if(!actAs) process.exit(23);
          NODE

      - name: Install gcloud beta noninteractive
        if: steps.iam.outcome == 'success'
        run: gcloud components install beta --quiet

      - name: Deploy exact source to Cloud Run DEV without build
        id: runtime
        if: steps.iam.outcome == 'success'
        run: |
          set -euo pipefail
          current_sa="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test "$current_sa" = "$RUNTIME_SA"
          cd "$SRC/backend/runtime/hr-live-service"
          npm install --omit=dev --ignore-scripts --package-lock=false >/dev/null 2>&1
          cd "$SRC"
          gcloud beta run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --source "$SRC" \
            --no-build \
            --base-image="us-central1-docker.pkg.dev/serverless-runtimes/google-24-full/runtimes/nodejs24" \
            --command=node \
            --args=backend/runtime/hr-live-service/server.mjs \
            --update-env-vars="CXORBIA_RECOVERY_SOURCE_SHA=$SOURCE_SHA,CXORBIA_ENVIRONMENT=DEV" \
            --quiet
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          rev="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          printf '{"revision":"%s","url":"%s","sourceSha":"%s","buildMode":"cloud_run_source_no_build","production":false}\n' \
            "$rev" "$url" "$SOURCE_SHA" > "$GITHUB_WORKSPACE/$OUT/runtime.json"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Gate 6 runtime and durable identity readback
        id: gate6
        if: steps.runtime.outcome == 'success'
        run: |
          set -euo pipefail
          url='${{ steps.runtime.outputs.url }}'
          curl -fsS --retry 12 --retry-delay 4 "$url/health" > "$OUT/health.json"
          curl -fsS --retry 8 --retry-delay 4 "$url/api/tya/cinepolis/hr-live?format=meta&fresh=1" > "$OUT/meta.json"
          curl -fsS --retry 8 --retry-delay 4 "$url/api/tya/cinepolis/hr-live?fresh=1" > "$RUNNER_TEMP/hr.json"
          cat > "$RUNNER_TEMP/readback.mjs" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          const out=process.env.OUT;
          const health=JSON.parse(fs.readFileSync(out+'/health.json','utf8'));
          const metaRaw=JSON.parse(fs.readFileSync(out+'/meta.json','utf8'));
          const meta=metaRaw.meta||metaRaw;
          const reconciliation=meta.shopperReconciliation;
          if(health.ok!==true||health.production!==false||health.shopperReconciliationReady!==true) throw new Error('G6_HEALTH');
          if(meta.sourceSafe!==true||meta.runtimeRead!==true||meta.production!==false||!reconciliation||reconciliation.ok!==true||
             reconciliation.providerAck!==true||reconciliation.hrWrites!==0||reconciliation.externalWrites!==0||
             reconciliation.fuzzyMatching!==false||String(reconciliation.sourceRevision)!==String(meta.revision)) throw new Error('G6_RECONCILIATION');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/hr.json','utf8'));
          const snapshot=raw.snapshot||raw.data||raw;
          const tenantId=String(snapshot.tenantId||snapshot.tenantConfig?.tenantId||'');
          const projectId=String(snapshot.projectId||snapshot.projectConfig?.projectId||'');
          if(snapshot.sourceSafe!==true||!tenantId||!projectId) throw new Error('G6_SOURCE');
          const ids=new Set([...(snapshot.shoppers||[]),...(snapshot.visits||[])].map(x=>String(x.shopperId||x.id||'')).filter(Boolean));
          initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(),auth=getAuth(),tenant=db.collection('tenants').doc(tenantId);
          const fingerprint=uid=>crypto.createHash('sha256').update('cxorbia-provider-uid-v1\0'+uid).digest('hex');
          let bad=0,duplicates=0;
          for(const id of ids){
            const [profile,cross,members]=await Promise.all([
              tenant.collection('shoppers').doc(id).get(),
              tenant.collection('shopperIdentityCrosswalk').doc(id).get(),
              tenant.collection('users').where('shopperId','==',id).limit(2).get()
            ]);
            if(!profile.exists||!cross.exists||members.size!==1){bad++;if(members.size>1)duplicates++;continue;}
            const member=members.docs[0], user=await auth.getUser(member.id), claims=user.customClaims||{};
            if(String(claims.tenantId)!==tenantId||String(claims.shopperId)!==id||claims.role!=='shopper'||
               claims.authNamespace!=='shopper'||String(cross.data().providerUidFingerprint||'')!==fingerprint(member.id)) bad++;
          }
          if(!ids.size||bad||duplicates||Number(reconciliation.shopperCount)!==ids.size) throw new Error(`G6_DURABLE_BAD_${bad}_DUP_${duplicates}`);
          fs.writeFileSync(out+'/gate6.json',JSON.stringify({
            decision:'PASS_GATE6_HR_SHOPPER_UPSERT_IDEMPOTENT',revision:String(meta.revision),shoppers:ids.size,
            authCreated:Number(reconciliation.authCreated||0),idempotentReplays:Number(reconciliation.idempotentReplays||0),
            duplicates:0,hrWrites:0,production:false,piiExported:false
          },null,2)+'\n');
          NODE
          OUT="$OUT" PROJECT="$PROJECT" node "$RUNNER_TEMP/readback.mjs"
          rm -f "$RUNNER_TEMP/hr.json" "$RUNNER_TEMP/readback.mjs"

      - name: Build sanitized result
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),p=process.env.OUT;
          const read=n=>{try{return JSON.parse(fs.readFileSync(p+'/'+n,'utf8'))}catch{return null}};
          const visual=read('visual.json'),iam=read('iam-preflight.json'),g6=read('gate6.json'),hosting=read('hosting-parity.json');
          let decision='HOLD_RECOVERY_DEV_CERTIFICATION';
          if(g6?.decision==='PASS_GATE6_HR_SHOPPER_UPSERT_IDEMPOTENT'&&visual?.decision==='PASS_GATE6_SHOPPERS_VISUAL_PRECERTIFICATION') decision='PASS_GATE6_RUNTIME_AND_VISUAL';
          else if(iam?.decision==='HOLD_EXTERNAL_IAM_REQUIRED'&&visual?.decision==='PASS_GATE6_SHOPPERS_VISUAL_PRECERTIFICATION') decision='HOLD_EXTERNAL_IAM_REQUIRED_VISUAL_PRECERTIFIED';
          else if(!hosting) decision='HOLD_HOSTING_DEV_VISUAL_PENDING';
          fs.writeFileSync(p+'/result.json',JSON.stringify({
            decision,sourceSha:process.env.SOURCE_SHA,transportSha:process.env.GITHUB_SHA,
            hosting:hosting?.decision||null,visual:visual?.decision||null,iam:iam?.decision||null,gate6:g6?.decision||null,
            nextGate:g6?7:6,production:false,automaticRetry:false
          },null,2)+'\n');
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-dev-cert-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force "$SRC" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private" .firebase

      - name: Enforce only full Gate 6 closure
        if: always()
        run: node -e "const r=require('./$OUT/result.json');if(r.decision!=='PASS_GATE6_RUNTIME_AND_VISUAL')process.exit(1)"
