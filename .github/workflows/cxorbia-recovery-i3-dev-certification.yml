          gh run download 35970916539 --repo "$GITHUB_REPOSITORY" --name "cxorbia-pre-i4-human-semantic-35970916539" --dir "$FOCAL_OUT/prior"
          test "$(jq -r '.decision' "$FOCAL_OUT/prior/runtime.json")" = "PASS_PRE_I4_SEMANTIC_RUNTIME_REUSED_RUN339_EXACT"
