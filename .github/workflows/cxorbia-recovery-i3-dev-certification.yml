name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  SOURCE_SHA: 296c8c906e03ad2bf9a06589798f65acd9a94559
  WF: .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  PROJECT: cxorbia-backend-dev
  RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  OUT: .tmp/recovery-i3-principal

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact Recovery source and transport-only delta
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WF"

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT }}'

      - name: Identify effective principal and permission read-only
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          client="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));process.stdout.write(String(p.client_email||''))")"
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"permissions":["iam.serviceAccounts.actAs"]}' \
            "https://iam.googleapis.com/v1/projects/$PROJECT/serviceAccounts/$RUNTIME_SA:testIamPermissions" > "$OUT/permission.json"
          ACTIVE_ACCOUNT="$active" CLIENT_EMAIL="$client" node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.OUT+'/permission.json','utf8'));
          const active=process.env.ACTIVE_ACCOUNT||'';
          const client=process.env.CLIENT_EMAIL||'';
          const target=process.env.RUNTIME_SA||'';
          const result={
            decision:(active===target&&client===target&&Array.isArray(p.permissions)&&p.permissions.includes('iam.serviceAccounts.actAs'))?'PASS_EFFECTIVE_PRINCIPAL_AND_ACTAS':(active!==target||client!==target?'AUTH_PRINCIPAL_MISMATCH':'ALLOW_PRESENT_BUT_NOT_EFFECTIVE'),
            activeAccount:active,
            credentialClientEmail:client,
            targetRuntimeServiceAccount:target,
            samePrincipal:active===target&&client===target,
            actAs:Array.isArray(p.permissions)&&p.permissions.includes('iam.serviceAccounts.actAs'),
            writes:0,
            production:false
          };
          fs.writeFileSync(process.env.OUT+'/principal.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-principal-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14
