          curl -fsSL --retry 5 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/__c3_truth__/admin/dashboard?c3truth=${GITHUB_RUN_ID}" -o "$C3_OUT/remote/deep.html"
          cmp "$RUNNER_TEMP/app/index-backend-dev.html" "$C3_OUT/remote/deep.html"
          printf '%s\n' "$n" > "$C3_OUT/active-browser-owner-count.txt"

      - name: Seal exhaustive preterminal Module Truth result
        run: |
          set -Eeuo pipefail
          MATRIX_SHA="$(sha256sum "$C3_OUT/module-truth-preterminal.json"|awk '{print $1}')"
          jq -n -S \
            --arg source "$C3_SOURCE" --arg tree "$C3_TREE" --arg matrix "$MATRIX_SHA" \
            --arg hosting "$EXPECTED_HOSTING_VERSION" --arg runtime "$EXPECTED_RUNTIME_REVISION" --arg digest "$EXPECTED_RUNTIME_DIGEST" \
            --arg rules "$(jq -r '.sha256' "$C3_OUT/firestore-live-parity.json")" \
            --argjson owners "$(cat "$C3_OUT/active-browser-owner-count.txt")" \
            '{decision:"PASS_C3_PRETERMINAL_MODULE_TRUTH_20_20_EXACT_DEV",sourceSha:$source,sourceTree:$tree,moduleTruthSha256:$matrix,moduleCount:20,matchModules:20,nonMatchModules:0,pendingFiles:0,activeBrowserOwners:$owners,hostingVersion:$hosting,runtimeRevision:$runtime,runtimeDigest:$digest,firestoreRulesSha256:$rules,allApprovedOwnersLoaded:true,duplicateScripts:0,builds:0,deploys:0,writes:0,production:false}' \
            > "$C3_OUT/result.json"

      - name: Upload C3 preterminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c3-preterminal-module-truth-${{ github.run_id }}
          path: ${{ env.C3_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

