          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN"             "https://firebasehosting.googleapis.com/v1beta1/$HOSTING_VERSION_NAME" > "$VRM044_OUT/hosting-version.json"
          test "$(jq -r '.status // empty' "$VRM044_OUT/hosting-version.json")" = "FINALIZED"
          REMOTE="$VRM044_OUT/read-model-v2.remote.js"
          curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0'             "$HOSTING_URL/adapters/tya-cumulative-read-model-v2.js?vrm044=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$REMOTE"
          test "$(sha256sum "$REMOTE" | awk '{print $1}')" = "$(sha256sum "$SOURCE_DIR/app/adapters/tya-cumulative-read-model-v2.js" | awk '{print $1}')"
