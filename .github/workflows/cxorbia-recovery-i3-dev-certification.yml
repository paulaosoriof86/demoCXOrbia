  pre-i4-vrm039-config-diagnostic:
    name: PRE-I4 VRM-039 project config authority diagnostic — read only
    needs: canonical-candidate-authority
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pre-i4-vrm039-config-diagnostic]') }}
