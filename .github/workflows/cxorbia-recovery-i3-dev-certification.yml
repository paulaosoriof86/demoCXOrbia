name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 0e0b9627bec0ccc2c892a70cd86e9e5f144df870
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  OUT: .tmp/recovery-i3-dev-certification

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact Recovery certification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact product source and certification-only successor
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc tools/hr-source
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              .github/workflows/cxorbia-recovery-i3-dev-certification.yml|tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs) ;;
              *) echo "Unexpected post-source drift: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD)
          grep -q "COPY backend/runtime/cxorbia-finance-command-provider-v1.mjs" backend/runtime/hr-live-service/Dockerfile
          grep -q "createFinanceCommandProvider" backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          grep -q "finance.payment.batch" backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          grep -q "providerAck===true" app/modules/finanzas.js
          grep -q "successUiAllowed===true" app/modules/finanzas.js
          grep -q "providerAck===true" app/modules/operacion-extra.js
          grep -q "successUiAllowed===true" app/modules/operacion-extra.js
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check backend/runtime/cxorbia-finance-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          node --check tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs
          jq -n -S --arg product "$PRODUCT_SOURCE_SHA" --arg qa "$GITHUB_SHA" '{decision:"PASS_I3_PRODUCT_SOURCE_GUARD",productSourceSha:$product,qaHeadSha:$qa,postSourceProductDrift:false,production:false}' > "$OUT/source-guard.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Install focused DEV certification dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest >/dev/null 2>&1

      - name: Capture DEV runtime before candidate materialization
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-before.json"

      - name: Build exact Recovery product source for DEV
        run: |
          set -euo pipefail
          short="${PRODUCT_SOURCE_SHA:0:12}"
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:i3-cert-${short}-${GITHUB_RUN_ID}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          printf '%s\n' "$IMAGE_URI" > "$OUT/image-uri.txt"
          gcloud builds submit . --project "$PROJECT" --config backend/runtime/hr-live-service/cloudbuild.yaml --substitutions "_IMAGE=$IMAGE_URI" --quiet

      - name: Materialize exact candidate to existing Cloud Run DEV
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-after.json"
          revision="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-after.json")"
          created="$(jq -r '.status.latestCreatedRevisionName // empty' "$OUT/runtime-after.json")"
          image="$(jq -r '.spec.template.spec.containers[0].image // empty' "$OUT/runtime-after.json")"
          url="$(jq -r '.status.url // empty' "$OUT/runtime-after.json")"
          test -n "$revision" && test "$revision" = "$created"
          test "$image" = "$IMAGE_URI"
          test -n "$url"
          echo "DEV_REVISION=$revision" >> "$GITHUB_ENV"
          echo "RUNTIME_URL=$url" >> "$GITHUB_ENV"
          curl -fsS --retry 10 --retry-delay 3 "$url/health" > "$OUT/health.json"
          jq -e '.ok==true' "$OUT/health.json" >/dev/null

      - name: Materialize exact candidate to existing Hosting DEV
        run: |
          set -euo pipefail
          npx firebase deploy --config firebase.json --only "hosting:cxorbia-dev" --project "$PROJECT" --non-interactive

      - name: Prove critical Hosting owners equal certified product source
        run: |
          set -euo pipefail
          for pair in \
            'modules/operacion-extra.js app/modules/operacion-extra.js' \
            'modules/finanzas.js app/modules/finanzas.js' \
            'adapters/cxorbia-command-adapter-v1.js app/adapters/cxorbia-command-adapter-v1.js' \
            'adapters/cxorbia-cxdata-command-boundary-v1.js app/adapters/cxorbia-cxdata-command-boundary-v1.js' \
            'adapters/cxorbia-shopper-admin-command-contract-v1.js app/adapters/cxorbia-shopper-admin-command-contract-v1.js'; do
            remote="${pair%% *}"; local="${pair#* }"; out="$OUT/remote-$(basename "$remote")"
            curl -fsSL --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache' "$HOSTING_URL/$remote?i3cert=${GITHUB_RUN_ID}" -o "$out"
            cmp "$local" "$out"
          done
          jq -n -S --arg product "$PRODUCT_SOURCE_SHA" '{decision:"PASS_I3_HOSTING_OWNER_PARITY",productSourceSha:$product,production:false}' > "$OUT/hosting-parity.json"

      - name: Read fresh HR source without writes
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "$OUT/hr-fresh.json" -w '%{http_code}' "$HOSTING_URL/api/tya/cinepolis/hr-live?format=json&fresh=1&i3cert=${GITHUB_RUN_ID}")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync(`${process.env.OUT}/hr-fresh.json`,'utf8'));const s=p?.snapshot||p?.data||p;const rt=p?._runtime||s?._runtime||{};
          if(s?.sourceSafe!==true||rt.refreshError)throw new Error('SOURCE_FAILURE:HR_FRESH_INVALID');
          fs.writeFileSync(`${process.env.OUT}/hr-readback.json`,JSON.stringify({decision:'PASS_I3_HR_FRESH_READBACK',sourceRevision:rt.revision||s.sourceRevision||null,sourceSafe:true,hrWrites:0,production:false},null,2)+'\n');
          NODE

      - name: Execute focal provider ACK persistence and idempotence certification
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" HOSTING_URL="$HOSTING_URL" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" PERIOD_ID="$PERIOD_ID" SOURCE_SHA="$PRODUCT_SOURCE_SHA" node tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs | tee "$OUT/focal-persistence-console.log"
          test "$(jq -r '.decision' "$OUT/shopper-profile-persistence.json")" = 'SHOPPER_PROFILE_PERSISTENCE_PASS'
          test "$(jq -r '.decision' "$OUT/finance-bulk-payment-persistence.json")" = 'FINANCE_BULK_PAYMENT_PERSISTENCE_PASS'
          test "$(jq -r '.decision' "$OUT/synthetic-cleanup.json")" = 'PASS_I3_SYNTHETIC_CLEANUP'

      - name: Final I3 functional closure verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const source=p('source-guard.json'),host=p('hosting-parity.json'),hr=p('hr-readback.json'),profile=p('shopper-profile-persistence.json'),finance=p('finance-bulk-payment-persistence.json'),cleanup=p('synthetic-cleanup.json');
          if(source.decision!=='PASS_I3_PRODUCT_SOURCE_GUARD'||host.decision!=='PASS_I3_HOSTING_OWNER_PARITY'||hr.decision!=='PASS_I3_HR_FRESH_READBACK'||profile.decision!=='SHOPPER_PROFILE_PERSISTENCE_PASS'||finance.decision!=='FINANCE_BULK_PAYMENT_PERSISTENCE_PASS'||cleanup.decision!=='PASS_I3_SYNTHETIC_CLEANUP')throw new Error('I3_CERTIFICATION_INCOMPLETE');
          const result={verdict:'PASS_I3_FUNCTIONAL_CLOSURE',state:'I3_READY_TO_CLOSE',productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,devRuntimeRevision:process.env.DEV_REVISION,shopperProfilePersistence:true,financeBulkPaymentPersistence:true,remoteAck:true,freshPersistenceReadback:true,idempotence:true,syntheticCleanup:true,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized I3 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-dev-certification-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
