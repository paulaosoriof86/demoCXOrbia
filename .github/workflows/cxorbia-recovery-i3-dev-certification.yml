          test "$(jq -r '.sourceTree' "$FOCAL_OUT/prior/source-proof.json")" = "$PRODUCT_TREE"
          jq -n -S --arg priorRun "35970916539" --arg hr "$(jq -r '.sourceRevision' "$FOCAL_OUT/prior/hr-contrast.json")" '{decision:"PASS_PRE_I4_RUN340_PREREQUISITES_BOUND",priorRunId:($priorRun|tonumber),hrRevision:$hr,runtimeDeploysThisRun:0,hostingDeploysThisRun:0,production:false}' > "$FOCAL_OUT/prerequisites.json"

