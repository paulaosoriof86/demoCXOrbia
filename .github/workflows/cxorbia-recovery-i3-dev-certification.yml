name: CXOrbia Recovery I3 DEV Certification
on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - .github/workflows/cxorbia-recovery-i3-gate21-artifact-fingerprint.yml
      - .github/control/**
      - RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json
      - RECOVERY-I3-HUMAN-LIVE-ACCEPTANCE-20260918.mjs
      - CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
      - CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_V274_2026-10-04.json
      - CXORBIA_CANONICAL_MODULE_REGISTRY_2026-09-18.json
      - app/**
      - backend/**
      - tools/**
      - firestore.rules
      - storage.rules
      - firebase.json
      - .firebaserc
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: true
env:
  CANDIDATE_DESCRIPTOR: CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
  FINDINGS_LEDGER: CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_V274_2026-10-04.json
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  HOSTING_SITE: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  LEGAL_ENABLE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED
  LEGAL_ENABLE_VALUE: 'true'
  LEGAL_GATE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE
  LEGAL_GATE_VALUE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME
  I3_HR_CACHE_PIN_NAME: CXORBIA_LIVE_HR_CACHE_MS
  I3_HR_CACHE_PIN_VALUE: '5000'
  OUT: .tmp/recovery-i3-dev-certification
  POST_RUN500_LOCK: CXORBIA_I3_POST_RUN500_FORENSIC_DRIFT_LOCK_2026-09-26.json
  POST_RUN500_LEDGER: CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_V176_2026-09-30.json
jobs:
  canonical-candidate-authority:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
      source_tree: ${{ steps.authority.outputs.source_tree }}
      status: ${{ steps.authority.outputs.status }}
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: step
        id: authority
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/canonical-candidate-authority
          node tools/qa/cxorbia-i3-canonical-candidate-authority-guard.mjs | tee .tmp/canonical-candidate-authority/result.json
          SOURCE="$(jq -r '.productSourceSha' .tmp/canonical-candidate-authority/result.json)"
          TREE="$(jq -r '.productSourceTree' .tmp/canonical-candidate-authority/result.json)"
          STATUS="$(jq -r '.status // empty' "$CANDIDATE_DESCRIPTOR")"
          test -n "$SOURCE"
          test -n "$TREE"
          test -n "$STATUS"
          test "$(jq -r '.status' "$POST_RUN500_LOCK")" = "HOLD"
          test "$(jq -r '.currentState.i3' "$POST_RUN500_LOCK")" = "HOLD"
          HIST_SOURCE="$(jq -r '.canonicalFunctionalCandidate.sourceSha' "$POST_RUN500_LEDGER")"
          HIST_TREE="$(jq -r '.canonicalFunctionalCandidate.sourceTree' "$POST_RUN500_LEDGER")"
          PREDECESSOR="$(jq -r '.predecessorProductSourceSha' "$CANDIDATE_DESCRIPTOR")"
          test "$(git rev-parse "$HIST_SOURCE^{tree}")" = "$HIST_TREE"
          git merge-base --is-ancestor "$HIST_SOURCE" "$PREDECESSOR"
          git merge-base --is-ancestor "$PREDECESSOR" "$SOURCE"
          test "$(jq -r '.findings["VRM-076"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN502"
          test "$(jq -r '.findings["VRM-077"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN507"
          test "$(jq -r '.findings["VRM-078"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN515"
          test "$(jq -r '.findings["VRM-079"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN518"
          test "$(jq -r '.findings["VRM-080"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN525"
          test "$(jq -r '.findings["VRM-081"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN547"
          [[ "$STATUS" == "GO" || "$STATUS" == "READY_FOR_TERMINAL_CERTIFICATION" || "$STATUS" == HOLD_* ]]
          echo "source_sha=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "source_tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
  vrm143-151-source-reproof:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM143_151_SOURCE_REPROOF_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      FOCAL_OUT: .tmp/vrm143-151-source-reproof
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: step
        run: |
          set -Eeuo pipefail
          mkdir -p "$FOCAL_OUT"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(git rev-parse "$FOCAL_SOURCE^{tree}")" = "$FOCAL_TREE"
          git merge-base --is-ancestor "$FOCAL_SOURCE" HEAD
          git diff --quiet "$FOCAL_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          git show "$FOCAL_SOURCE:backend/runtime/hr-live-service/Dockerfile" | grep -Fq 'COPY backend/runtime/cxorbia-commercial-command-provider-v1.mjs ./backend/runtime/cxorbia-commercial-command-provider-v1.mjs'
          git show "$FOCAL_SOURCE:backend/runtime/hr-live-service/Dockerfile" | grep -Fq 'COPY backend/runtime/cxorbia-academy-command-provider-v1.mjs ./backend/runtime/cxorbia-academy-command-provider-v1.mjs'
          jq -n -S --arg source "$FOCAL_SOURCE" --arg tree "$FOCAL_TREE" '{decision:"PASS_VRM143_151_SINGLE_SOURCE",sourceSha:$source,sourceTree:$tree,production:false}' > "$FOCAL_OUT/authority.json"
      - name: step
        run: |
          set -Eeuo pipefail
          node --check app/core/notif.js
          node --check app/modules/midia.js
          node --check app/adapters/tya-canonical-shopper-portal-v2.js
          node --check app/modules/reservas.js
          node --check app/core/automations.js
          node --check app/modules/cert.js
          node --check app/modules/beneficios.js
          node --check app/adapters/cxorbia-cxdata-command-boundary-v1.js
          node --check app/adapters/cxorbia-command-adapter-v1.js
          node --check backend/runtime/hr-live-service/test/cxorbia-command-adapter-idempotency.test.mjs
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs
          node --check backend/runtime/cxorbia-finance-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/certification-runtime.mjs
      - name: step
        run: |
          set -Eeuo pipefail
          node tools/qa/cxorbia-vrm143-151-source-reproof.mjs | tee "$FOCAL_OUT/result.json"
          test "$(jq -r '.decision' "$FOCAL_OUT/result.json")" = "PASS_VRM143_151_FOCAL_SOURCE_REPROOF"
          test "$(jq -r '.findings|length' "$FOCAL_OUT/result.json")" = "9"
          test "$(jq -r '.production' "$FOCAL_OUT/result.json")" = "false"
          test "$(jq -r '.hrWrites' "$FOCAL_OUT/result.json")" = "0"
      - name: step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm143-151-source-reproof-${{ github.run_id }}
          path: .tmp/vrm143-151-source-reproof
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vrm143-151-dev-materialization:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM143_151_DEV_MATERIALIZATION_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      FOCAL_OUT: .tmp/vrm143-151-dev-materialization
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: step
        run: |
          set -Eeuo pipefail
          mkdir -p "$FOCAL_OUT"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(git rev-parse "$FOCAL_SOURCE^{tree}")" = "$FOCAL_TREE"
          git merge-base --is-ancestor "$FOCAL_SOURCE" HEAD
          git diff --quiet "$FOCAL_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          node tools/qa/cxorbia-vrm143-151-source-reproof.mjs | tee "$FOCAL_OUT/source-reproof.json"
          test "$(jq -r '.decision' "$FOCAL_OUT/source-reproof.json")" = "PASS_VRM143_151_FOCAL_SOURCE_REPROOF"
      - name: step
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: step
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: step
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}
      - name: step
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-vrm143-151-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$FOCAL_SOURCE" | tar -x -C "$SOURCE_DIR"
          test -f "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml"
          test -f "$SOURCE_DIR/firebase.json"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:i3-vrm143-151-${FOCAL_SOURCE:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$FOCAL_OUT/image-uri.txt"
          gcloud builds submit "$SOURCE_DIR" --project "$PROJECT" --config "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml" --substitutions "_IMAGE=$IMAGE_URI" --quiet
          jq -n -S --arg source "$FOCAL_SOURCE" --arg tree "$FOCAL_TREE" --arg image "$IMAGE_URI" '{decision:"PASS_VRM143_151_ONE_BUILD",sourceSha:$source,sourceTree:$tree,imageTag:$image,builds:1,production:false}' > "$FOCAL_OUT/build.json"
      - name: step
        run: |
          set -Eeuo pipefail
          IMAGE_URI="$(cat "$FOCAL_OUT/image-uri.txt")"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --min-instances=1 --max-instances=1 --update-env-vars "$LEGAL_ENABLE_NAME=$LEGAL_ENABLE_VALUE,$LEGAL_GATE_NAME=$LEGAL_GATE_VALUE,$I3_HR_CACHE_PIN_NAME=$I3_HR_CACHE_PIN_VALUE" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$FOCAL_OUT/runtime.json"
          DEV_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$FOCAL_OUT/runtime.json")"
          test -n "$DEV_REVISION"
          gcloud run revisions describe "$DEV_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$FOCAL_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$FOCAL_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          RUNTIME_URL="$(jq -r '.status.url // empty' "$FOCAL_OUT/runtime.json")"
          curl -fsS --retry 12 --retry-delay 3 "$RUNTIME_URL/health" > "$FOCAL_OUT/health.json"
          jq -e '.ok==true and .production==false and .hrWrites==false' "$FOCAL_OUT/health.json" >/dev/null
          echo "DEV_REVISION=$DEV_REVISION" >> "$GITHUB_ENV"
          echo "RUNTIME_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "storage,hosting:$FIREBASE_HOSTING_TARGET" --project "$PROJECT" --non-interactive | tee "$GITHUB_WORKSPACE/$FOCAL_OUT/hosting-deploy.log"
          cd "$GITHUB_WORKSPACE"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$FOCAL_OUT/hosting-live-channel.json"
          HOSTING_RELEASE_NAME="$(jq -r '.release.name // empty' "$FOCAL_OUT/hosting-live-channel.json")"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$FOCAL_OUT/hosting-live-channel.json")"
          test -n "$HOSTING_VERSION_NAME"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/$HOSTING_VERSION_NAME" > "$FOCAL_OUT/hosting-version.json"
          test "$(jq -r '.status // empty' "$FOCAL_OUT/hosting-version.json")" = "FINALIZED"
          for p in core/notif.js modules/midia.js adapters/tya-canonical-shopper-portal-v2.js modules/reservas.js core/automations.js modules/cert.js modules/beneficios.js styles/layout.css adapters/cxorbia-cxdata-command-boundary-v1.js; do
            out="$FOCAL_OUT/remote-$(echo "$p" | tr '/' '_')"
            curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/$p?vrm143151=$GITHUB_RUN_ID-$(date +%s%N)" -o "$out"
            test "$(sha256sum "$out" | awk '{print $1}')" = "$(sha256sum "$SOURCE_DIR/app/$p" | awk '{print $1}')"
          done
          echo "HOSTING_RELEASE_NAME=$HOSTING_RELEASE_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_VERSION_NAME=$HOSTING_VERSION_NAME" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 8 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&vrm143151=$GITHUB_RUN_ID" > "$FOCAL_OUT/hr-meta.json"
          HR_REVISION="$(jq -r '.revision // empty' "$FOCAL_OUT/hr-meta.json")"
          [[ "$HR_REVISION" =~ ^[0-9a-f]{64}$ ]]
          test "$HR_REVISION" = "$EXPECTED_HR_REVISION"
          jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .hrWrites==false and .production==false' "$FOCAL_OUT/hr-meta.json" >/dev/null
          echo "HR_REVISION=$HR_REVISION" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          PROJECT_ID="$PROJECT_ID" TENANT_ID="$TENANT_ID" HOSTING_URL="$HOSTING_URL" CERT_RES_SOURCE="$FOCAL_SOURCE" CERT_RES_MAT_OUT="$FOCAL_OUT" node tools/qa/cxorbia-prei4-cert-res-live.mjs | tee "$FOCAL_OUT/cert-res-live-console.log"
          test "$(jq -r '.decision' "$FOCAL_OUT/cert-res-live.json")" = "PASS_PREI4_CERT_RES_CUMULATIVE_DEV_LIVE"
          test "$(jq -r '.cleanup.attempt and .cleanup.recert and .cleanup.bank and .cleanup.resource and .cleanup.binary' "$FOCAL_OUT/cert-res-live.json")" = "true"
      - name: step
        run: |
          set -Eeuo pipefail
          jq -n -S --arg source "$FOCAL_SOURCE" --arg tree "$FOCAL_TREE" --arg runtime "$DEV_REVISION" --arg digest "$RUNTIME_DIGEST" --arg hosting "$HOSTING_VERSION_NAME" --arg hostingRelease "$HOSTING_RELEASE_NAME" --arg hr "$HR_REVISION" '{decision:"PASS_VRM143_151_EXACT_DEV_MATERIALIZATION",sourceSha:$source,sourceTree:$tree,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,hostingRelease:$hostingRelease,hrRevision:$hr,builds:1,runtimeDeploys:1,hostingDeploys:1,hrWrites:0,production:false}' > "$FOCAL_OUT/result.json"
      - name: step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm143-151-dev-materialization-${{ github.run_id }}
          path: .tmp/vrm143-151-dev-materialization
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vrm151-historical-dry-run:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM151_HISTORICAL_DRY_RUN_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      DRY_OUT: .tmp/vrm151-historical-dry-run
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: step
        run: |
          set -Eeuo pipefail
          mkdir -p "$DRY_OUT"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(jq -r '.currentMaterialization.sourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.currentMaterialization.sourceTree' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(jq -r '.currentMaterialization.production' "$CANDIDATE_DESCRIPTOR")" = "false"
          git diff --quiet "$FOCAL_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check tools/qa/cxorbia-vrm151-historical-reconciliation-dry-run.mjs
      - name: step
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
      - name: step
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: step
        run: |
          set -Eeuo pipefail
          set +e
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" node tools/qa/cxorbia-vrm151-historical-reconciliation-dry-run.mjs > "$DRY_OUT/result.json"
          RC=$?
          set -e
          test "$RC" = "0" -o "$RC" = "2"
          DECISION="$(jq -r '.decision' "$DRY_OUT/result.json")"
          [[ "$DECISION" == "PASS_VRM151_HISTORICAL_RECONCILIATION_DRY_RUN" || "$DECISION" == "HOLD_VRM151_HISTORICAL_RECONCILIATION_AMBIGUOUS" ]]
          test "$(jq -r '.writes' "$DRY_OUT/result.json")" = "0"
          test "$(jq -r '.hrWrites' "$DRY_OUT/result.json")" = "0"
          test "$(jq -r '.bankWrites' "$DRY_OUT/result.json")" = "0"
          cat "$DRY_OUT/result.json"
      - name: step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm151-historical-dry-run-${{ github.run_id }}
          path: .tmp/vrm151-historical-dry-run
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vrm151-historical-amount-diagnostic:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM151_HISTORICAL_AMOUNT_DIAGNOSTIC_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      DIAG_OUT: .tmp/vrm151-historical-amount-diagnostic
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: step
        run: |
          set -Eeuo pipefail
          mkdir -p "$DIAG_OUT"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(jq -r '.currentMaterialization.sourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.currentMaterialization.sourceTree' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          git diff --quiet "$FOCAL_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check tools/qa/cxorbia-vrm151-historical-amount-diagnostic.mjs
      - name: step
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
      - name: step
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: step
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" node tools/qa/cxorbia-vrm151-historical-amount-diagnostic.mjs | tee "$DIAG_OUT/result.json"
          test "$(jq -r '.writes' "$DIAG_OUT/result.json")" = "0"
          test "$(jq -r '.hrWrites' "$DIAG_OUT/result.json")" = "0"
          test "$(jq -r '.bankWrites' "$DIAG_OUT/result.json")" = "0"
      - name: step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm151-historical-amount-diagnostic-${{ github.run_id }}
          path: .tmp/vrm151-historical-amount-diagnostic
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vrm151-canonical-owner-diagnostic:
    needs: canonical-candidate-authority
