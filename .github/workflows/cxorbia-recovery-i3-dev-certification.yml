          fs.writeFileSync(p+'/focal.json',JSON.stringify({decision:'PASS_PRE_I4_FOCAL_HUMAN_BROWSER',sourceSha:pre.productSource.sha,hrRevision:'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}));
          fs.writeFileSync(p+'/human.json',JSON.stringify({decision:'PASS_I3_HUMAN_LIVE_ACCEPTANCE',sourceSha:pre.productSource.sha,sourceRevision:'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}));
          fs.writeFileSync(p+'/qa.json',JSON.stringify({decision:'PASS_C3_QA_RESERVATION_CLEANUP',after:0}));
          fs.writeFileSync(p+'/parity.json',JSON.stringify({decision:'PASS_C3_PENDING_OWNER_BYTE_PARITY',mismatches:0}));
          const findings={};
          for(const id of ['VRM-033','VRM-034','VRM-035','VRM-036','VRM-037','VRM-038','VRM-039','VRM-040','VRM-041','VRM-042'])findings[id]={state:id==='VRM-036'||id==='VRM-037'||id==='VRM-039'||id==='VRM-042'?'FIXED_SOURCE_PROVEN_NO_DEPLOY':'PASS_TEST_PROVEN'};
          findings['VRM-076']={severity:'P0',state:'P0_PROVEN_POST_RUN500_FORENSIC',owner:['tools/qa/cxorbia-i3-c3-finalize-module-truth.mjs']};
          fs.writeFileSync(p+'/ledger-open.json',JSON.stringify({findings}));
          findings['VRM-076'].state='FIXED_PROVEN';
          fs.writeFileSync(p+'/ledger-no-receipt.json',JSON.stringify({findings}));
          const receipt=(moduleDomain,ownerPath)=>({decision:'PASS_TEST_OWNER_ACTION',moduleDomain,sourceSha:pre.productSource.sha,sourceTree:pre.productSource.treeSha,runtimeRevision:'runtime-test-1',runtimeDigest:'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',hostingVersion:'sites/test/versions/1',hrRevision:'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',ownerPaths:[ownerPath],actionReal:true,providerAck:true,durableReadback:true,reloadProof:true,noDuplicateRegression:true,production:false});
          findings['VRM-082']={severity:'P0',state:'FIXED_PROVEN',owner:['app/modules/x.js','app/modules/y.js'],terminalEvidence:{ownerSpecificReceipts:[receipt('m0','app/modules/x.js')]}};
          fs.writeFileSync(p+'/ledger-one-domain.json',JSON.stringify({findings}));
          findings['VRM-082'].terminalEvidence.ownerSpecificReceipts.push(receipt('m1','app/modules/y.js'));
          const noHrFlag=JSON.parse(JSON.stringify(findings));
          noHrFlag['VRM-082'].terminalEvidence.ownerSpecificReceipts[1].hrRevision=null;
          fs.writeFileSync(p+'/ledger-null-hr-no-flag.json',JSON.stringify({findings:noHrFlag}));
          const hrIndependent=JSON.parse(JSON.stringify(noHrFlag));
          hrIndependent['VRM-082'].terminalEvidence.ownerSpecificReceipts[1].hrIndependent=true;
          fs.writeFileSync(p+'/ledger-pass.json',JSON.stringify({findings:hrIndependent}));
          const allMatch=JSON.parse(JSON.stringify(pre));
          allMatch.modules=allMatch.modules.map(m=>({...m,classification:'MATCH',pendingTerminalFiles:[]}));
          allMatch.sourceFiles=allMatch.sourceFiles.map(f=>({...f,classification:'MATCH'}));
          fs.writeFileSync(p+'/pre-all-match.json',JSON.stringify(allMatch));
          const staleHistorical=JSON.parse(JSON.stringify(hrIndependent));
          for(const r of staleHistorical['VRM-082'].terminalEvidence.ownerSpecificReceipts)r.sourceSha='3333333333333333333333333333333333333333';
          fs.writeFileSync(p+'/ledger-stale-historical.json',JSON.stringify({findings:staleHistorical}));
          const staleNeeded=JSON.parse(JSON.stringify(hrIndependent));
          staleNeeded['VRM-082'].terminalEvidence.ownerSpecificReceipts[0].sourceSha='3333333333333333333333333333333333333333';
          fs.writeFileSync(p+'/ledger-stale-needed.json',JSON.stringify({findings:staleNeeded}));
