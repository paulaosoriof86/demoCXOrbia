name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: 296c8c906e03ad2bf9a06589798f65acd9a94559
  WF: .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  OUT: .tmp/recovery-i3-dev

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact Recovery source and prior Gate 6
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          echo "SRC=$RUNNER_TEMP/recovery-source" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WF"
          git worktree add --detach "$RUNNER_TEMP/recovery-source" "$SOURCE_SHA"
          printf '{"sourceSha":"%s","transportSha":"%s","gate6":"PASS_LOCKED","currentGate":7,"writes":0,"production":false}\n' "$SOURCE_SHA" "$GITHUB_SHA" > "$OUT/authorization.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT }}'

      - name: Prove exact deployed runtime source
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test "$active" = "$RUNTIME_SA"
          rev="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          gcloud run revisions describe "$rev" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/revision.json"
          REV="$rev" URL="$url" node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.OUT+'/revision.json','utf8'));
          const env=r.spec?.containers?.[0]?.env||[];
          const source=(env.find(x=>x.name==='CXORBIA_RECOVERY_SOURCE_SHA')||{}).value||null;
          if(source!==process.env.SOURCE_SHA) throw new Error('RUNTIME_SOURCE_SHA_MISMATCH_'+source);
          fs.writeFileSync(process.env.OUT+'/runtime.json',JSON.stringify({decision:'PASS_RUNTIME_SOURCE_LOCK',revision:process.env.REV,url:process.env.URL,sourceSha:source,production:false},null,2)+'\n');
          console.log('RUNTIME_URL='+process.env.URL);
          NODE
          echo "RUNTIME_URL=$url" >> "$GITHUB_ENV"

      - name: Static Gate 7 boundary discriminants
        run: |
          set -euo pipefail
          SRC="$SRC" OUT="$OUT" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const src=process.env.SRC,out=process.env.OUT;
          const read=p=>fs.readFileSync(path.join(src,p),'utf8');
          const server=read('backend/runtime/hr-live-service/server.mjs');
          const runtime=read('backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs');
          const provider=read('backend/runtime/cxorbia-operational-command-provider-v1.mjs');
          const index=read('app/index-backend-dev.html');
          const protectedMode=read('app/core/backend-protected-dev-mode.js');
          const boundary=read('app/adapters/cxorbia-cxdata-command-boundary-v1.js');
          const visitas=read('app/modules/visitas.js');
          const result={
            commandRoutesOperational:/return 'operational'/.test(runtime)&&/visit\.assign/.test(provider),
            serverConfiguresOperationalPolicy:/CXORBIA_OPERATIONAL_COMMAND_PROVIDER_POLICY/.test(server),
            entryLoadsCommandHttpTransport:/cxorbia-command-http-transport-v1\.js/.test(index),
            protectedEnablesCommandWrites:/enableCommandWrites\s*:\s*true/.test(protectedMode),
            boundaryBuildsVisitAssign:/D\.assignVisit=function/.test(boundary)&&/'visit\.assign'/.test(boundary),
            adminAssignmentAwaitsAck:/await\s+data\.assignVisit/.test(visitas)&&/ackAware\s*:\s*true/.test(visitas),
            production:false,writes:0
          };
          fs.writeFileSync(out+'/gate7-static.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - name: Probe live operational command provider without valid token
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$OUT/gate7-provider-response.json" -w '%{http_code}' -X POST "$RUNTIME_URL/v1/cxorbia/commands" \
            -H 'Authorization: Bearer recovery-readonly-probe-not-a-valid-token' -H 'Content-Type: application/json' \
            --data '{"version":"cxorbia-command-adapter-v1","commandType":"visit.assign","entityType":"visit","entityId":"probe-no-write","tenantId":"tya","projectId":"probe-project","periodId":"probe-period","expectedVersion":"source-current","idempotencyKey":"recovery-g7-readonly-provider-probe","payload":{"visitId":"probe-no-write","shopperId":"probe-no-write"},"authorization":{"providerEnforcementRequired":true}}')"
          HTTP_CODE="$code" OUT="$OUT" node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.OUT+'/gate7-provider-response.json','utf8'));
          const safe={httpCode:Number(process.env.HTTP_CODE),ok:raw.ok===true,status:raw.status||null,code:raw.code||null,providerKind:raw.providerKind||null,providerAck:raw.providerAck===true,writes:0,production:false};
          fs.writeFileSync(process.env.OUT+'/gate7-provider.json',JSON.stringify(safe,null,2)+'\n');
          console.log(JSON.stringify(safe));
          if(safe.providerAck) throw new Error('READONLY_PROBE_MUST_NOT_COMMIT');
          NODE
          rm -f "$OUT/gate7-provider-response.json"

      - name: Inspect HR available versus durable visit coverage read-only
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 3 "$RUNTIME_URL/api/tya/cinepolis/hr-live" > "$RUNNER_TEMP/hr-g7.json"
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
          cat > "$GITHUB_WORKSPACE/gate7-readonly.mjs" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/hr-g7.json','utf8'));
          const s=raw.snapshot||raw.data||raw;
          const tenantId=String(s.tenantId||s.tenantConfig?.tenantId||'');
          const projectId=String(s.projectId||s.projectConfig?.projectId||'');
          if(!tenantId||!projectId||s.sourceSafe!==true) throw new Error('G7_HR_SCOPE_INVALID');
          const visits=Array.isArray(s.visits)?s.visits:[];
          const available=visits.filter(v=>{
            if(typeof v?.canonicalFacets?.available==='boolean')return v.canonicalFacets.available===true&&v.canonicalFacets.eligibilityBlocked!==true;
            return String(v.estado||v.status||'').toLowerCase()==='disponible'&&!String(v.shopperId||'');
          });
          initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore();
          const snap=await db.collection('tenants').doc(tenantId).collection('projects').doc(projectId).collection('visits').get();
          const durableIds=new Set(snap.docs.map(d=>d.id));
          const durableAvailable=available.filter(v=>durableIds.has(String(v.id||v.visitId||'')));
          const sample=available[0]||null;
          const fp=x=>x?crypto.createHash('sha256').update(String(x)).digest('hex').slice(0,16):null;
          const out={decision:'GATE7_READONLY_DURABLE_COVERAGE',sourceRevision:raw._runtime?.revision||null,tenantPresent:true,projectPresent:true,hrVisits:visits.length,hrAvailable:available.length,durableVisitDocs:snap.size,durableAvailableMatches:durableAvailable.length,sampleAvailableFingerprint:fp(sample&&(sample.id||sample.visitId)),sampleDurableExists:sample?durableIds.has(String(sample.id||sample.visitId||'')):false,writes:0,piiExported:false,production:false};
          fs.writeFileSync(process.env.OUT+'/gate7-durable-coverage.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          NODE
          OUT="$OUT" PROJECT="$PROJECT" node "$GITHUB_WORKSPACE/gate7-readonly.mjs"
          rm -f "$RUNNER_TEMP/hr-g7.json" "$GITHUB_WORKSPACE/gate7-readonly.mjs"

      - name: Classify Gate 7 root cause
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=process.env.OUT,read=n=>JSON.parse(fs.readFileSync(p+'/'+n,'utf8'));
          const st=read('gate7-static.json'),pr=read('gate7-provider.json'),dc=read('gate7-durable-coverage.json');
          const defects=[];
          if(!st.serverConfiguresOperationalPolicy||pr.code==='OPERATIONAL_COMMAND_PROVIDER_NOT_CONFIGURED')defects.push('PROVIDER_FAILURE');
          if(!st.entryLoadsCommandHttpTransport||!st.protectedEnablesCommandWrites||!st.adminAssignmentAwaitsAck)defects.push('FUNCTIONAL_DEFECT');
          if(dc.hrAvailable>0&&dc.durableAvailableMatches===0)defects.push('PERSISTENCE_FAILURE');
          const unique=[...new Set(defects)];
          const result={decision:unique.length?'P0_PROVEN_GATE7_ASSIGNMENT_BOUNDARY':'GATE7_SOURCE_READY_FOR_WRITE_DISCRIMINANT',gate:7,sourceSha:process.env.SOURCE_SHA,classes:unique,static:st,provider:pr,durableCoverage:dc,writes:0,production:false,nextAction:unique.length?'PATCH_ONLY_PROVEN_GATE7_OWNERS':'RUN_CONTROLLED_ASSIGNMENT'};
          fs.writeFileSync(p+'/result.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-dev-cert-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force "$SRC" 2>/dev/null || true
          rm -rf .firebase node_modules