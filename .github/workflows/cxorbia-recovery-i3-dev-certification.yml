name: CXOrbia Recovery I3 DEV Certification
# Control successor: Gate20 explicit canonical HR reconciliation.
# V21 direct reproof trigger: no logic change; canonical workflow only.
# V33 honorarium diagnostic rerun: existing DEV, no deploy.

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - .github/workflows/cxorbia-recovery-i3-gate21-artifact-fingerprint.yml
      - RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json
      - RECOVERY-I3-HUMAN-LIVE-ACCEPTANCE-20260918.mjs
      - ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-19_I3_ADMIN_PLATFORM_PROFILE_P0_FROZEN.md
      - .github/control/RECOVERY-I3-LIVE-FIXTURES-20260920-V4.mjs
      - .github/control/RECOVERY-I3-BROWSER-AUTH-LIFECYCLE-20260919.mjs
      - ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-19_I3_DEEP_FORENSIC_ROOTCAUSE_FROZEN.md
      - CXORBIA_CANONICAL_ROUTE_INVENTORY_2026-09-18.json
      - ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-18_I3_FORENSIC_CONTROL_PLANE_CACHE_ROOTCAUSE_FROZEN.md
      - backend/runtime/hr-live-service/test/cxorbia-i3-project-period-contract.test.mjs
      - tools/qa/cxorbia-gate20-browser-visual-dev.mjs
      - ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-17_I3_MICRO_ITERATIONS_FROZEN.md
      - CXORBIA_I3_MICRO_ITERATION_PLAN_LOCK_2026-09-17.json
      - backend/config/pre-i4-human-entrypoint-dev-deploy-request.json
      - tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs
      - tools/qa/cxorbia-i3-canonical-candidate-authority-guard.mjs
      - CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
      - CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_2026-09-24.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: true

env:
  CANDIDATE_DESCRIPTOR: CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
  FINDINGS_LEDGER: CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_2026-09-24.json
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  HOSTING_SITE: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  LEGAL_ENABLE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED
  LEGAL_ENABLE_VALUE: 'true'
  LEGAL_GATE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE
  LEGAL_GATE_VALUE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME
  I3_HR_CACHE_PIN_NAME: CXORBIA_LIVE_HR_CACHE_MS
  I3_HR_CACHE_PIN_VALUE: '3600000'
  OUT: .tmp/recovery-i3-dev-certification

jobs:
  canonical-candidate-authority:
    name: I3 single canonical candidate authority guard
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
      source_tree: ${{ steps.authority.outputs.source_tree }}
      status: ${{ steps.authority.outputs.status }}
    steps:
      - name: Checkout canonical Recovery control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and prove sole executable candidate
        id: authority
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/canonical-candidate-authority
          node tools/qa/cxorbia-i3-canonical-candidate-authority-guard.mjs | tee .tmp/canonical-candidate-authority/result.json
          SOURCE="$(jq -r '.productSourceSha' .tmp/canonical-candidate-authority/result.json)"
          TREE="$(jq -r '.productSourceTree' .tmp/canonical-candidate-authority/result.json)"
          STATUS="$(jq -r '.status // empty' "$CANDIDATE_DESCRIPTOR")"
          test -n "$SOURCE"
          test -n "$TREE"
          test -n "$STATUS"
          echo "source_sha=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "source_tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

  v52-vrm050-runtime:
    name: I3 V52 — VRM-050 HR refresh timeout runtime-only DEV fix
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM050_RUNTIME_MATERIALIZATION_REQUIRED' && github.event_name == 'push' && contains(github.event.head_commit.message, '[v52-vrm050-runtime]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V52_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      V52_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      V52_OUT: .tmp/i3-v52-vrm050-runtime
      EXPECTED_HOSTING_VERSION: sites/cxorbia-backend-dev/versions/8ff3b75d0b77f11c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove exact focal successor before any build
        run: |
          set -Eeuo pipefail
          mkdir -p "$V52_OUT"
          test "$V52_SOURCE" = "62ee2903fdced52c525d5a028c8c4c725940e4cd"
          test "$V52_TREE" = "e0649d447257745af89efc9845dfb2fb50600cf6"
          test "$(git rev-parse "$V52_SOURCE^{tree}")" = "$V52_TREE"
          test "$(jq -r '.status' "$CANDIDATE_DESCRIPTOR")" = "HOLD_VRM050_RUNTIME_MATERIALIZATION_REQUIRED"
          test "$(git diff --name-only 04432faa32bef0427223fa2c51cb5b809f53e178 "$V52_SOURCE" -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source | wc -l | tr -d ' ')" = "1"
          git diff --name-only 04432faa32bef0427223fa2c51cb5b809f53e178 "$V52_SOURCE" -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source | grep -qx 'tools/hr-source/tya-reapply-canonical-state-r20.mjs'
          node --check tools/hr-source/tya-reapply-canonical-state-r20.mjs
          grep -q 'CXORBIA_HR_PAYLOAD_VM_TIMEOUT_MS' tools/hr-source/tya-reapply-canonical-state-r20.mjs
          grep -q 'Math.min(60000' tools/hr-source/tya-reapply-canonical-state-r20.mjs
          ! grep -q 'timeout:5000' tools/hr-source/tya-reapply-canonical-state-r20.mjs
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-v52-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$V52_SOURCE" | tar -x -C "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          CXORBIA_HR_PAYLOAD_VM_TIMEOUT_MS=30000 node "$SOURCE_DIR/tools/hr-source/tya-reapply-canonical-state-r20.mjs" --input "$SOURCE_DIR/app/data/tya-hr-source-safe-periods.js" --out "$V52_OUT/source-gate-payload.js" --report-dir "$V52_OUT/source-gate-report"
          test -s "$V52_OUT/source-gate-payload.js"

      - name: Authenticate Recovery DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Prove Hosting unchanged before runtime materialization
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$V52_OUT/hosting-before.json"
          test "$(jq -r '.release.version.name // empty' "$V52_OUT/hosting-before.json")" = "$EXPECTED_HOSTING_VERSION"

      - name: Build exact successor runtime once
        run: |
          set -Eeuo pipefail
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:i3-v52-${V52_SOURCE:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$V52_OUT/image-uri.txt"
          gcloud builds submit "$SOURCE_DIR" --project "$PROJECT" --config "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml" --substitutions "_IMAGE=$IMAGE_URI" --quiet

      - name: Deploy exact successor runtime once to Recovery DEV
        run: |
          set -Eeuo pipefail
          IMAGE_URI="$(cat "$V52_OUT/image-uri.txt")"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --min-instances=1 --max-instances=1 --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$V52_OUT/runtime.json"
          REV="$(jq -r '.status.latestReadyRevisionName // empty' "$V52_OUT/runtime.json")"; test -n "$REV"
          gcloud run revisions describe "$REV" --project "$PROJECT" --region "$REGION" --format=json > "$V52_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$V52_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          echo "V52_RUNTIME_REVISION=$REV" >> "$GITHUB_ENV"
          echo "V52_RUNTIME_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Force fresh HR and prove VRM-050 closed
        run: |
          set -Eeuo pipefail
          URL="$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&fresh=1&v52=$GITHUB_RUN_ID"
          ok=0
          for attempt in $(seq 1 8); do
            if curl -fsS --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL&attempt=$attempt" > "$V52_OUT/hr-meta.json"; then
              if jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .shopperReconciliation.providerAck==true and .visitReconciliation.providerAck==true and .hrWrites==false and .production==false and .refreshError==null' "$V52_OUT/hr-meta.json" >/dev/null; then ok=1; break; fi
            fi
            sleep 8
          done
          test "$ok" = "1"
          REVISION="$(jq -r '.revision' "$V52_OUT/hr-meta.json")"; [[ "$REVISION" =~ ^[0-9a-f]{64}$ ]]
          curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=json&v52=$GITHUB_RUN_ID" > "$V52_OUT/hr.json"
          test "$(jq -r '._runtime.revision // .sourceRevision // empty' "$V52_OUT/hr.json")" = "$REVISION"
          curl -fsS "$HOSTING_URL/health?v52=$GITHUB_RUN_ID" > "$V52_OUT/health.json"
          test "$(jq -r '.lastRefreshError == null' "$V52_OUT/health.json")" = "true"

      - name: Prove Hosting still unchanged and seal receipt
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$V52_OUT/hosting-after.json"
          test "$(jq -r '.release.version.name // empty' "$V52_OUT/hosting-after.json")" = "$EXPECTED_HOSTING_VERSION"
          jq -n -S --arg source "$V52_SOURCE" --arg tree "$V52_TREE" --arg runtime "$V52_RUNTIME_REVISION" --arg digest "$V52_RUNTIME_DIGEST" --arg hosting "$EXPECTED_HOSTING_VERSION" --arg hr "$(jq -r '.revision' "$V52_OUT/hr-meta.json")" '{decision:"PASS_I3_V52_VRM050_RUNTIME_REFRESH_REPROOF",sourceSha:$source,sourceTree:$tree,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,hrRevision:$hr,refreshError:null,sourceSafe:true,shopperProviderAck:true,visitProviderAck:true,builds:1,runtimeDeploys:1,hostingDeploys:0,rulesDeploys:0,hrWrites:0,production:false}' > "$V52_OUT/result.json"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-v52-vrm050-runtime-${{ github.run_id }}
          path: ${{ env.V52_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  v53-vrm050-runtime-readback:
    name: I3 V53 — VRM-050 exact runtime readback — no deploy
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM050_RUNTIME_REPROOF_REQUIRED' && github.event_name == 'push' && contains(github.event.head_commit.message, '[v53-vrm050-readback]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V53_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      V53_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      V53_OUT: .tmp/i3-v53-vrm050-readback
      EXPECTED_RUNTIME_REVISION: cxorbia-live-hr-dev-00221-65m
      EXPECTED_RUNTIME_DIGEST: sha256:7b48e7a539a987f03b96c97a32ccb38a9cf32bd95d3e432434bc808ec9685dce
      EXPECTED_HOSTING_VERSION: sites/cxorbia-backend-dev/versions/8ff3b75d0b77f11c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact successor authority
        run: |
          set -Eeuo pipefail
          mkdir -p "$V53_OUT"
          test "$V53_SOURCE" = "62ee2903fdced52c525d5a028c8c4c725940e4cd"
          test "$V53_TREE" = "e0649d447257745af89efc9845dfb2fb50600cf6"
          test "$(git rev-parse "$V53_SOURCE^{tree}")" = "$V53_TREE"
          test "$(jq -r '.status' "$CANDIDATE_DESCRIPTOR")" = "HOLD_VRM050_RUNTIME_REPROOF_REQUIRED"
          grep -q 'CXORBIA_HR_PAYLOAD_VM_TIMEOUT_MS' tools/hr-source/tya-reapply-canonical-state-r20.mjs
          ! grep -q 'timeout:5000' tools/hr-source/tya-reapply-canonical-state-r20.mjs
      - name: Authenticate Recovery DEV read only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}
      - name: Read exact runtime Hosting health and HR without refresh
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$V53_OUT/runtime.json"
          REV="$(jq -r '.status.latestReadyRevisionName // empty' "$V53_OUT/runtime.json")"; test "$REV" = "$EXPECTED_RUNTIME_REVISION"
          SERVICE_URL="$(jq -r '.status.url // empty' "$V53_OUT/runtime.json")"; test -n "$SERVICE_URL"
          gcloud run revisions describe "$REV" --project "$PROJECT" --region "$REGION" --format=json > "$V53_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$V53_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          test "$DIGEST" = "$EXPECTED_RUNTIME_DIGEST"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$V53_OUT/hosting-live.json"
          test "$(jq -r '.release.version.name // empty' "$V53_OUT/hosting-live.json")" = "$EXPECTED_HOSTING_VERSION"

          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          curl -fsS --retry 4 --retry-delay 2 -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/health?v53=$GITHUB_RUN_ID" > "$V53_OUT/health-direct.json"
          jq -e '.ok==true and .bootstrapReady==true and .lastRefreshError==null and .writes==false and .hrWrites==false and .production==false' "$V53_OUT/health-direct.json" >/dev/null

          curl -fsS --retry 4 --retry-delay 2 -H "Authorization: Bearer $ID_TOKEN" -H 'Cache-Control: no-cache, no-store, max-age=0' "$SERVICE_URL/api/tenants/$TENANT_ID/projects/$PROJECT_ID/hr-live?format=meta&v53=$GITHUB_RUN_ID" > "$V53_OUT/hr-meta-direct.json"
          jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .shopperReconciliation.providerAck==true and .visitReconciliation.providerAck==true and .hrWrites==false and .production==false and .refreshError==null' "$V53_OUT/hr-meta-direct.json" >/dev/null
          REVISION="$(jq -r '.revision // empty' "$V53_OUT/hr-meta-direct.json")"; [[ "$REVISION" =~ ^[0-9a-f]{64}$ ]]

          curl -fsS --retry 4 --retry-delay 2 -H "Authorization: Bearer $ID_TOKEN" -H 'Cache-Control: no-cache, no-store, max-age=0' "$SERVICE_URL/api/tenants/$TENANT_ID/projects/$PROJECT_ID/hr-live?format=json&v53=$GITHUB_RUN_ID" > "$V53_OUT/hr-direct.json"
          test "$(jq -r '._runtime.revision // .sourceRevision // empty' "$V53_OUT/hr-direct.json")" = "$REVISION"

          curl -fsS --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&v53=$GITHUB_RUN_ID" > "$V53_OUT/hr-meta-hosting.json"
          jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .refreshError==null' "$V53_OUT/hr-meta-hosting.json" >/dev/null
          test "$(jq -r '.revision // empty' "$V53_OUT/hr-meta-hosting.json")" = "$REVISION"

          jq -n -S --arg source "$V53_SOURCE" --arg tree "$V53_TREE" --arg runtime "$REV" --arg digest "$DIGEST" --arg hosting "$EXPECTED_HOSTING_VERSION" --arg hr "$REVISION" --argjson refreshMs "$(jq -r '.refreshDurationMs // 0' "$V53_OUT/hr-meta-direct.json")" '{decision:"PASS_I3_V53_VRM050_RUNTIME_READBACK",sourceSha:$source,sourceTree:$tree,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,hrRevision:$hr,refreshDurationMs:$refreshMs,refreshError:null,sourceSafe:true,shopperProviderAck:true,visitProviderAck:true,builds:0,deploys:0,writes:0,production:false}' > "$V53_OUT/result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-v53-vrm050-readback-${{ github.run_id }}
          path: ${{ env.V53_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  v59-vrm065-revision-diagnostic:
    name: I3 V59 — VRM-065 HR revision drift forensic readback — no deploy
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM065_REVISION_DRIFT_DIAGNOSTIC_REQUIRED' && github.event_name == 'push' && contains(github.event.head_commit.message, '[v59-vrm065-revision-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V59_OUT: .tmp/i3-v59-vrm065-revision-diagnostic
      V59_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      V59_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      EXPECTED_RUNTIME_REVISION: cxorbia-live-hr-dev-00221-65m
      EXPECTED_RUNTIME_DIGEST: sha256:7b48e7a539a987f03b96c97a32ccb38a9cf32bd95d3e432434bc808ec9685dce
      EXPECTED_HOSTING_VERSION: sites/cxorbia-backend-dev/versions/8ff3b75d0b77f11c
      RUN484_ID: '36252097220'
      RUN484_ARTIFACT: cxorbia-recovery-i3-terminal-diagnostics-36252097220
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove no candidate regression
        run: |
          set -Eeuo pipefail
          mkdir -p "$V59_OUT"
          test "$V59_SOURCE" = "62ee2903fdced52c525d5a028c8c4c725940e4cd"
          test "$V59_TREE" = "e0649d447257745af89efc9845dfb2fb50600cf6"
          test "$(git rev-parse "$V59_SOURCE^{tree}")" = "$V59_TREE"
          git diff --quiet "$V59_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
      - name: Authenticate Recovery DEV read only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}
      - name: Download exact Run484 terminal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          PRIOR="$RUNNER_TEMP/run484"
          rm -rf "$PRIOR"; mkdir -p "$PRIOR"
          gh run download "$RUN484_ID" --repo "$GITHUB_REPOSITORY" --name "$RUN484_ARTIFACT" --dir "$PRIOR"
          test -f "$PRIOR/hr-current-live.json"
          cp "$PRIOR/hr-current-live.json" "$V59_OUT/hr-run484.json"
          test "$(jq -r '._runtime.revision // .sourceRevision // empty' "$V59_OUT/hr-run484.json")" = "5d4acfec98bc52f836dac2e382c906bc54534253717c9239b5d0f20d5f4f3cc7"
      - name: Read exact runtime config and current HR without refresh
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$V59_OUT/runtime-service.json"
          REV="$(jq -r '.status.latestReadyRevisionName // empty' "$V59_OUT/runtime-service.json")"; test "$REV" = "$EXPECTED_RUNTIME_REVISION"
          SERVICE_URL="$(jq -r '.status.url // empty' "$V59_OUT/runtime-service.json")"; test -n "$SERVICE_URL"
          gcloud run revisions describe "$REV" --project "$PROJECT" --region "$REGION" --format=json > "$V59_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$V59_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          test "$DIGEST" = "$EXPECTED_RUNTIME_DIGEST"
          jq '[.spec.containers[0].env[]? | select(.name=="CXORBIA_LIVE_HR_CACHE_MS" or .name=="CXORBIA_HR_PAYLOAD_VM_TIMEOUT_MS" or .name=="CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED")]' "$V59_OUT/runtime-revision.json" > "$V59_OUT/runtime-env.json"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$V59_OUT/hosting-live.json"
          test "$(jq -r '.release.version.name // empty' "$V59_OUT/hosting-live.json")" = "$EXPECTED_HOSTING_VERSION"

          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          for n in 1 2 3; do
            curl -fsS --retry 3 -H "Authorization: Bearer $ID_TOKEN" -H 'Cache-Control: no-cache, no-store, max-age=0' "$SERVICE_URL/api/tenants/$TENANT_ID/projects/$PROJECT_ID/hr-live?format=meta&v59=$GITHUB_RUN_ID&n=$n" > "$V59_OUT/direct-meta-$n.json"
            sleep 8
          done
          curl -fsS --retry 3 -H "Authorization: Bearer $ID_TOKEN" -H 'Cache-Control: no-cache, no-store, max-age=0' "$SERVICE_URL/api/tenants/$TENANT_ID/projects/$PROJECT_ID/hr-live?format=json&v59=$GITHUB_RUN_ID" > "$V59_OUT/hr-current-direct.json"
          curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&v59=$GITHUB_RUN_ID" > "$V59_OUT/hosting-meta.json"
          curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=json&v59=$GITHUB_RUN_ID" > "$V59_OUT/hr-current-hosting.json"
      - name: Compare Run484 and current operational content
        run: |
          set -Eeuo pipefail
          V59_OUT="$V59_OUT" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const dir=process.env.V59_OUT;
          const old=JSON.parse(fs.readFileSync(dir+'/hr-run484.json','utf8'));
          const cur=JSON.parse(fs.readFileSync(dir+'/hr-current-direct.json','utf8'));
          const host=JSON.parse(fs.readFileSync(dir+'/hr-current-hosting.json','utf8'));
          const metas=[1,2,3].map(n=>JSON.parse(fs.readFileSync(dir+'/direct-meta-'+n+'.json','utf8')));
          const env=JSON.parse(fs.readFileSync(dir+'/runtime-env.json','utf8'));
          const broad=new Set(['generatedAt','sourceReadAt','sourceSnapshotAt','lastSnapshotAt','tabRegistryObservedAt','observedAt','refreshedAt','loadedAt','updatedAt','cacheAgeMs','refreshStartedAt','refreshFinishedAt','refreshDurationMs']);
          const server=new Set(['generatedAt','lastSnapshotAt','sourceSnapshotAt']);
          const stable=(v,omit)=>{
            if(Array.isArray(v))return v.map(x=>stable(x,omit));
            if(v&&typeof v==='object'){
              const o={};
              for(const k of Object.keys(v).sort()){
                if(k==='_runtime'||omit.has(k))continue;
                o[k]=stable(v[k],omit);
              }
              return o;
            }
            return v;
          };
          const functional=x=>stable({
            tenantId:x.tenantId,projectId:x.projectId,currentProjectId:x.currentProjectId,currentPeriodId:x.currentPeriodId,
            periods:x.periods||[],visits:x.visits||[],shoppers:x.shoppers||[],posts:x.posts||[],
            periodOperationalSummary:x.periodOperationalSummary||[],projectConfig:x.projectConfig||null,tenantConfig:x.tenantConfig||null,source:x.source||null
          },broad);
          const sha=x=>crypto.createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const rev=x=>String(x?._runtime?.revision||x?.sourceRevision||'');
          const diffPaths=(a,b,path='',out=[])=>{
            if(out.length>=200)return out;
            if(JSON.stringify(a)===JSON.stringify(b))return out;
            if(a===null||b===null||typeof a!=='object'||typeof b!=='object'){out.push(path||'$');return out;}
            const keys=[...new Set([...Object.keys(a||{}),...Object.keys(b||{})])].sort();
            for(const k of keys)diffPaths(a?.[k],b?.[k],path?path+'.'+k:k,out);
            return out;
          };
          const oldBroad=stable(old,broad),curBroad=stable(cur,broad);
          const oldServer=stable(old,server),curServer=stable(cur,server);
          const directRevs=metas.map(x=>String(x.revision||''));
          const cacheEnv=(env.find(x=>x.name==='CXORBIA_LIVE_HR_CACHE_MS')||{}).value||null;
          const result={
            schemaVersion:'cxorbia.i3.v59.vrm065.revision-drift-diagnostic.v1',
            decision:'PASS_V59_REVISION_DRIFT_DIAGNOSTIC',
            run484Revision:rev(old),
            currentDirectRevision:rev(cur),
            currentHostingRevision:rev(host),
            directMetaRevisions:directRevs,
            directMetaStable:new Set(directRevs).size===1,
            runtimeCacheMsEnv:cacheEnv,
            broadOperationalDigestRun484:sha(functional(old)),
            broadOperationalDigestCurrent:sha(functional(cur)),
            broadOperationalEqual:sha(functional(old))===sha(functional(cur)),
            broadSnapshotEqual:sha(oldBroad)===sha(curBroad),
            serverNormalizedEqual:sha(oldServer)===sha(curServer),
            broadRemainingDiffPaths:diffPaths(oldBroad,curBroad),
            serverRemainingDiffPaths:diffPaths(oldServer,curServer),
            directHostingFunctionalEqual:sha(functional(cur))===sha(functional(host)),
            counts:{
              run484:{periods:(old.periods||[]).length,visits:(old.visits||[]).length,shoppers:(old.shoppers||[]).length,posts:(old.posts||[]).length},
              current:{periods:(cur.periods||[]).length,visits:(cur.visits||[]).length,shoppers:(cur.shoppers||[]).length,posts:(cur.posts||[]).length}
            },
            builds:0,deploys:0,writes:0,production:false
          };
          result.classification=result.run484Revision!==result.currentDirectRevision
            ?(result.broadOperationalEqual?'METADATA_OR_NON_OPERATIONAL_REVISION_DRIFT':'OPERATIONAL_SOURCE_CHANGE')
            :'NO_CURRENT_REVISION_DRIFT';
          fs.writeFileSync(dir+'/result.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          if(!result.directMetaStable)throw new Error('PROVIDER_FAILURE:V59_DIRECT_REVISION_UNSTABLE_DURING_DIAGNOSTIC');
          if(!result.directHostingFunctionalEqual)throw new Error('RELEASE_COMPOSITION_FAILURE:V59_DIRECT_HOSTING_FUNCTIONAL_MISMATCH');
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-v59-vrm065-revision-diagnostic-${{ github.run_id }}
          path: ${{ env.V59_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

