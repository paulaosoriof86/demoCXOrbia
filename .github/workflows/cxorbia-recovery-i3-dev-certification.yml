name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - tools/qa/cxorbia-gate20-browser-visual-dev.mjs
      - tools/qa/cxorbia-gate20-live-auth-diagnostic.mjs
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PRODUCT_SOURCE_SHA: bd2a519db5ebd08f17d47827997056db795c8c09
  LOCK_GATE19_SHA: e91b4fee2ca8383a992361189261633e3cd72eac
  LOCK_GATE19_RUN_ID: '34302638183'
  PROJECT: cxorbia-backend-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-gate20

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Recovery QA head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact product lock and zero product drift
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git cat-file -e "$LOCK_GATE19_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- tools/qa/cxorbia-gate20-browser-visual-dev.mjs
          git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD | sort > "$OUT/qa-only-delta.txt"
          node --check tools/qa/cxorbia-gate20-live-auth-diagnostic.mjs
          git show "$PRODUCT_SOURCE_SHA:tools/qa/cxorbia-gate20-browser-visual-dev.mjs" > "$OUT/gate20-certified-runner.mjs"
          node --check "$OUT/gate20-certified-runner.mjs"
          node <<'NODE'
          const fs=require('fs'),out=process.env.OUT;
          const g19={decision:'PASS_GATE19_SHOPPER_E2E_LINEAGE',gate:19,lockedEvidence:true,lockedRunId:Number(process.env.LOCK_GATE19_RUN_ID),lockedSourceSha:process.env.LOCK_GATE19_SHA,noProductDrift:true,tenantId:'tya',projectId:'cinepolis',periodId:'cinepolis-2026-09',secureShopperLoginObserved:true,shopperPostulationObserved:true,shopperReloadObserved:true,approvalRemoteAck:true,idempotentReplay:true,currentDurableReadback:true,duplicatePairCount:1,humanLegalAcceptanceReexecuted:false,legalAcceptanceBypass:false,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${out}/gate19-locked.json`,JSON.stringify(g19,null,2)+'\n');
          fs.writeFileSync(`${out}/locked-lineage.json`,JSON.stringify({decision:'PASS_GATE20_PRODUCT_LOCK_NO_DRIFT',lockedGate19RunId:Number(process.env.LOCK_GATE19_RUN_ID),lockedGate19SourceSha:process.env.LOCK_GATE19_SHA,productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,noProductDrift:true,production:false},null,2)+'\n');
          NODE
          echo "PASS_GATE20_PRODUCT_LOCK source=$PRODUCT_SOURCE_SHA qaHead=$GITHUB_SHA productDrift=0"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gate 20 browser dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Read back exact certified visual owners from pilot
        run: |
          set -euo pipefail
          pairs=(
            'app/index-backend-dev.html|index-backend-dev.html|entry'
            'app/app.js|app.js|app'
            'app/styles/layout.css|styles/layout.css|layout'
            'app/styles/theme.css|styles/theme.css|theme'
            'app/core/ui.js|core/ui.js|ui'
            'app/core/router.js|core/router.js|router'
            'app/core/backend-browser-auth.js|core/backend-browser-auth.js|browserauth'
            'app/modules/dashboard.js|modules/dashboard.js|dashboard'
            'app/modules/visitas.js|modules/visitas.js|visitas'
            'app/modules/postulaciones.js|modules/postulaciones.js|postulaciones'
            'app/modules/shoppers.js|modules/shoppers.js|shoppers'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js|adapters/tya-protected-auth-hr-authority-bridge-v2.js|authority'
          )
          : > "$OUT/hosting-owner-hashes.txt"
          for item in "${pairs[@]}"; do
            IFS='|' read -r local remote key <<< "$item"
            git show "$PRODUCT_SOURCE_SHA:$local" > "$OUT/source-$key"
            curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$HOSTING_URL/$remote?gate20live=${GITHUB_RUN_ID}-${key}" -o "$OUT/remote-$key"
            cmp "$OUT/source-$key" "$OUT/remote-$key"
            sha="$(sha256sum "$OUT/source-$key"|awk '{print $1}')"
            printf '%s %s\n' "$key" "$sha" >> "$OUT/hosting-owner-hashes.txt"
            rm -f "$OUT/source-$key" "$OUT/remote-$key"
          done
          printf '{"decision":"PASS_HOSTING_GATE20_VISUAL_OWNER_PARITY","sourceSha":"%s","ownerCount":12,"hostingDeploys":0,"production":false}\n' "$PRODUCT_SOURCE_SHA" > "$OUT/hosting.json"
          echo "PASS_GATE20_OWNER_PARITY owners=12 source=$PRODUCT_SOURCE_SHA"

      - name: Diagnose live authenticated authority state
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-gate20-live-auth-diagnostic.mjs | tee "$OUT/gate20-live-auth-diagnostic.log"
          test -s "$OUT/gate20-live-auth-diagnostic.json"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate20-live-auth-diagnostic.json"

      - name: Execute exact certified Gate 20 browser visual runner
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" SOURCE_SHA="$PRODUCT_SOURCE_SHA" HOSTING_URL="$HOSTING_URL" node "$OUT/gate20-certified-runner.mjs" | tee "$OUT/gate20-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate20-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate20-browser-visual.json"

      - name: Final Gate 20 verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),read=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const g20=read('gate20-browser-visual.json'),hosting=read('hosting.json'),lineage=read('locked-lineage.json'),diag=read('gate20-live-auth-diagnostic.json');
          if(lineage.decision!=='PASS_GATE20_PRODUCT_LOCK_NO_DRIFT'||lineage.noProductDrift!==true||lineage.productSourceSha!==process.env.PRODUCT_SOURCE_SHA)throw new Error('GATE20_PRODUCT_DRIFT');
          if(hosting.decision!=='PASS_HOSTING_GATE20_VISUAL_OWNER_PARITY'||Number(hosting.ownerCount)!==12)throw new Error('GATE20_HOSTING_PARITY_INCOMPLETE');
          if(diag.decision!=='PASS')throw new Error('GATE20_LIVE_AUTHORITY_DIAGNOSTIC_'+diag.decision+'_'+diag.blocker);
          if(g20.decision!=='PASS_GATE20_BROWSER_VISUAL')throw new Error(g20.decision||'GATE20_RESULT_MISSING');
          const pass=g20.loginDesktop===true&&g20.loginMobile===true&&Array.isArray(g20.adminDesktopRoutes)&&g20.adminDesktopRoutes.length===4&&Array.isArray(g20.adminMobileRoutes)&&g20.adminMobileRoutes.length===3&&Number(g20.captureCount)===9&&Array.isArray(g20.pageErrors)&&g20.pageErrors.length===0&&g20.domMarkersExact===true&&g20.hrAuthorityApplied===true&&g20.blockingUnexpectedModal===false&&g20.localStorageTruth===false&&Number(g20.providerWrites)===0&&Number(g20.hrWrites)===0&&g20.production===false;
          if(!pass)throw new Error('GATE20_ACCEPTANCE_INCOMPLETE');
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify({verdict:g20.decision,gate20:'PASS',productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,noProductDrift:true,hostingOwnerParity:true,liveAuthorityDiagnostic:'PASS',tenantId:g20.tenantId,projectId:g20.projectId,periodId:g20.periodId,captureCount:g20.captureCount,providerWrites:0,hrWrites:0,production:false},null,2)+'\n');
          NODE

      - name: Upload sanitized Gate 20 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate20-live-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
