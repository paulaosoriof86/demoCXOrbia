name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - tools/qa/cxorbia-gate13-authorized-identity-kpis-dev.mjs
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ github.sha }}
  LOCK_GATE12_SHA: 2ec4bfd5a19f1f7b417ae905cf9e7d2eb1c9147c
  LOCK_GATE12_RUN_ID: '34178237418'
  PROJECT: cxorbia-backend-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-gate13

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove Gate 13 QA-only delta and locked Gate 12 no product drift
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$LOCK_GATE12_SHA" HEAD
          git cat-file -e "$LOCK_GATE12_SHA^{commit}"
          git diff --name-only "$LOCK_GATE12_SHA" HEAD | sort > "$OUT/current-delta.txt"
          printf '%s\n' \
            '.github/workflows/cxorbia-recovery-i3-dev-certification.yml' \
            'tools/qa/cxorbia-gate13-authorized-identity-kpis-dev.mjs' \
            | sort > "$OUT/expected-delta.txt"
          diff -u "$OUT/expected-delta.txt" "$OUT/current-delta.txt"
          git diff --quiet "$LOCK_GATE12_SHA" HEAD -- app backend firebase.json .firebaserc
          node --check tools/qa/cxorbia-gate13-authorized-identity-kpis-dev.mjs
          git status --porcelain | tee "$OUT/source-status.txt"; test ! -s "$OUT/source-status.txt"
          node <<'NODE'
          const fs=require('fs'),out=process.env.OUT;
          const gate12={decision:'PASS_GATE12_SHOPPER_HISTORY',gate:12,lockedEvidence:true,lockedRunId:Number(process.env.LOCK_GATE12_RUN_ID),lockedSourceSha:process.env.LOCK_GATE12_SHA,noProductDrift:true,tenantId:'tya',projectId:'cinepolis',periodId:'cinepolis-2026-09',authorizedAdmin:true,identityVisible:true,currentPeriodVisible:true,priorPeriodVisible:true,foreignProjectExcluded:true,periodColumnVisible:true,evaluationColumnCertified:true,currentEvaluationVisible:true,priorEvaluationVisible:true,statusesVisible:true,scopedKpiExact:true,localStorageTruth:false,localStoragePoisonExcluded:true,production:false,hrWrites:0};
          fs.writeFileSync(`${out}/gate12-locked.json`,JSON.stringify(gate12,null,2)+'\n');
          fs.writeFileSync(`${out}/locked-lineage.json`,JSON.stringify({decision:'PASS_GATE12_LOCKED_NO_PRODUCT_DRIFT',lockedRunId:Number(process.env.LOCK_GATE12_RUN_ID),lockedSourceSha:process.env.LOCK_GATE12_SHA,currentSourceSha:process.env.SOURCE_SHA,noProductDrift:true,changedFiles:fs.readFileSync(`${out}/current-delta.txt`,'utf8').trim().split(/\n/).filter(Boolean),production:false,hrWrites:0},null,2)+'\n');
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gate 13 read-only dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Read back exact Gate 13 product owners from Hosting DEV
        run: |
          set -euo pipefail
          pairs=(
            'app/modules/shoppers.js|modules/shoppers.js|shoppers'
            'app/core/store.js|core/store.js|store'
            'app/core/backend-browser-auth.js|core/backend-browser-auth.js|auth'
            'app/core/shoppers-store.js|core/shoppers-store.js|shopperstore'
            'app/core/backend-protected-dev-mode.js|core/backend-protected-dev-mode.js|protectedmode'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js|adapters/tya-protected-auth-hr-authority-bridge-v2.js|authority'
            'app/adapters/tya-cumulative-read-model-v2.js|adapters/tya-cumulative-read-model-v2.js|composer'
          )
          : > "$OUT/hosting-owner-hashes.txt"
          for item in "${pairs[@]}"; do
            IFS='|' read -r local remote key <<< "$item"
            curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$HOSTING_URL/$remote?gate13=${GITHUB_RUN_ID}-${key}" -o "$OUT/remote-$key.js"
            cmp "$local" "$OUT/remote-$key.js"
            lsha="$(sha256sum "$local"|awk '{print $1}')"; rsha="$(sha256sum "$OUT/remote-$key.js"|awk '{print $1}')"; test "$lsha" = "$rsha"
            printf '%s %s\n' "$key" "$lsha" >> "$OUT/hosting-owner-hashes.txt"
          done
          printf '{"decision":"PASS_HOSTING_GATE13_OWNER_PARITY","sourceSha":"%s","lockedProductSourceSha":"%s","ownerCount":7,"hostingDeploys":0,"production":false}\n' "$SOURCE_SHA" "$LOCK_GATE12_SHA" > "$OUT/hosting.json"

      - name: Execute real Gate 13 authorized identity and KPI E2E
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" SOURCE_SHA="$SOURCE_SHA" HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-gate13-authorized-identity-kpis-dev.mjs | tee "$OUT/gate13-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate13-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate13-authorized-identity-kpis.json"

      - name: Final Gate 13 verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),read=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const g12=read('gate12-locked.json'),g13=read('gate13-authorized-identity-kpis.json'),hosting=read('hosting.json'),lineage=read('locked-lineage.json');
          if(g12.decision!=='PASS_GATE12_SHOPPER_HISTORY'||g12.lockedEvidence!==true||g12.noProductDrift!==true||Number(g12.lockedRunId)!==Number(process.env.LOCK_GATE12_RUN_ID)||g12.lockedSourceSha!==process.env.LOCK_GATE12_SHA)throw new Error('GATE12_LOCK_INVALID');
          if(lineage.decision!=='PASS_GATE12_LOCKED_NO_PRODUCT_DRIFT'||lineage.noProductDrift!==true)throw new Error('GATE13_PRODUCT_DRIFT');
          if(hosting.decision!=='PASS_HOSTING_GATE13_OWNER_PARITY'||Number(hosting.ownerCount)!==7||Number(hosting.hostingDeploys)!==0)throw new Error('GATE13_HOSTING_PARITY_INCOMPLETE');
          if(g13.decision!=='PASS_GATE13_AUTHORIZED_IDENTITY_KPIS')throw new Error(g13.decision||'GATE13_RESULT_MISSING');
          const pass=g13.authorizedAdmin===true&&g13.backendProviderFirebase===true&&g13.adminCanSeeProtectedData===true&&g13.exactProfileOverlay===true&&g13.identityVisible===true&&g13.sensitiveIdentityVisible===true&&g13.kpisExact===true&&g13.historyVisible===true&&Number(g13.historyRows)>0&&g13.rootProjectScoped===true&&g13.authorityApplied===true&&g13.canonicalShopperStore===true&&g13.localStorageTruth===false&&Number(g13.providerWrites)===0&&Number(g13.hrWrites)===0&&g13.production===false;
          if(!pass)throw new Error('GATE13_ACCEPTANCE_INCOMPLETE');
          const summary={verdict:g13.decision,gate12:'PASS_LOCKED_NO_DRIFT',gate13:'PASS',lockedGate12RunId:Number(process.env.LOCK_GATE12_RUN_ID),lockedGate12SourceSha:process.env.LOCK_GATE12_SHA,sourceSha:process.env.SOURCE_SHA,noProductDrift:true,hostingOwnerParity:true,hostingDeploys:0,tenantId:g13.tenantId,projectId:g13.projectId,periodId:g13.periodId,shopperFingerprint:g13.shopperFingerprint,authorizedAdmin:true,backendProviderFirebase:true,adminCanSeeProtectedData:true,exactProfileOverlay:true,dataLevel:g13.dataLevel,identityVisible:true,sensitiveIdentityVisible:true,kpisExact:true,kpiExpected:g13.kpiExpected,kpiActual:g13.kpiActual,historyVisible:true,historyRows:g13.historyRows,rootProjectScoped:true,authorityApplied:true,canonicalShopperStore:true,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(summary,null,2)+'\n');console.log(JSON.stringify(summary));
          NODE

      - name: Upload sanitized Gate 13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate13-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
