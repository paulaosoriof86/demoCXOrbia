          C3_OUT="$C3_OUT" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const r=JSON.parse(fs.readFileSync(process.env.C3_OUT+'/firestore-ruleset-live.json','utf8'));
          const files=r?.source?.files||[],live=files.find(x=>x.name==='firestore.rules')||files.find(x=>String(x.name||'').endsWith('/firestore.rules'))||files[0];
          const local=fs.readFileSync('firestore.rules','utf8');
