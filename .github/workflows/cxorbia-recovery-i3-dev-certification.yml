          test "$(jq -r '.revision // empty' "$VRM185_ADMIN_OUT/hr-meta.json")" = "$EXPECTED_HR_REVISION"
          echo "EXPECTED_HR_REVISION=$EXPECTED_HR_REVISION" >> "$GITHUB_ENV"
      - name: Admin-only exact identity adjudication through live provider
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" HOSTING_URL="$HOSTING_URL" SOURCE_SHA="$FOCAL_SOURCE" EXPECTED_HR_REVISION="$EXPECTED_HR_REVISION" OUT="$VRM185_ADMIN_OUT" node tools/qa/cxorbia-i3-vrm185-exact-identity-consolidation-write.mjs | tee "$VRM185_ADMIN_OUT/console.log"
          test "$(jq -r '.decision' "$VRM185_ADMIN_OUT/result.json")" = "PASS_VRM185_ADMIN_PROVIDER_ADJUDICATION"
          test "$(jq -r '.providerAck' "$VRM185_ADMIN_OUT/result.json")" = "true"
          test "$(jq -r '.durableReadback' "$VRM185_ADMIN_OUT/result.json")" = "true"
          test "$(jq -r '.fuzzyOrNameMerge' "$VRM185_ADMIN_OUT/result.json")" = "false"
          test "$(jq -r '.shopperPortalAdjudication' "$VRM185_ADMIN_OUT/result.json")" = "false"
          test "$(jq -r '.hrWrites' "$VRM185_ADMIN_OUT/result.json")" = "0"
          test "$(jq -r '.externalWrites' "$VRM185_ADMIN_OUT/result.json")" = "0"
          test "$(jq -r '.production' "$VRM185_ADMIN_OUT/result.json")" = "false"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm185-admin-live-adjudication-${{ github.run_id }}
          path: .tmp/vrm185-admin-live-adjudication
          if-no-files-found: error
          retention-days: 30
