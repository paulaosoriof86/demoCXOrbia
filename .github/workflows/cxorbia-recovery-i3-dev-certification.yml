name: CXOrbia Recovery I3 DEV Certification
# Control successor: Gate20 explicit canonical HR reconciliation.

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - .github/workflows/cxorbia-recovery-i3-gate21-artifact-fingerprint.yml
      - RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json
      - RECOVERY-I3-HUMAN-LIVE-ACCEPTANCE-20260918.mjs
      - CXORBIA_CANONICAL_ROUTE_INVENTORY_2026-09-18.json
      - ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-18_I3_FORENSIC_CONTROL_PLANE_CACHE_ROOTCAUSE_FROZEN.md
      - backend/runtime/hr-live-service/test/cxorbia-i3-project-period-contract.test.mjs
      - tools/qa/cxorbia-gate20-browser-visual-dev.mjs
      - ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-17_I3_MICRO_ITERATIONS_FROZEN.md
      - CXORBIA_I3_MICRO_ITERATION_PLAN_LOCK_2026-09-17.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: true

env:
  I3_CERTIFICATION_SOURCE_SHA: 751d01397bcd85903456e5cb78e3e5ce41161b17
  I3_CERTIFICATION_SOURCE_TREE: 3612496c2cbf4abdaed1404fcf69552817929fcf
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  HOSTING_SITE: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  LEGAL_ENABLE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED
  LEGAL_ENABLE_VALUE: 'true'
  LEGAL_GATE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE
  LEGAL_GATE_VALUE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME
  OUT: .tmp/recovery-i3-dev-certification

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout canonical Recovery control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove single certification source and control-only successor
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          ! grep -Eq 'certification_source_(sha|tree)|I3_CERTIFICATION_SOURCE_(SHA|TREE):' .github/workflows/cxorbia-recovery-i3-gate21-artifact-fingerprint.yml
          git cat-file -e "$I3_CERTIFICATION_SOURCE_SHA^{commit}"
          test "$(git rev-parse "$I3_CERTIFICATION_SOURCE_SHA^{tree}")" = "$I3_CERTIFICATION_SOURCE_TREE"
          git merge-base --is-ancestor "$I3_CERTIFICATION_SOURCE_SHA" HEAD
          git diff --quiet "$I3_CERTIFICATION_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          ! grep -Eq "params\.set\('cxProjectId','cinepolis'\)|/api/tya/cinepolis/hr-live" app/index-backend-dev.html
          ! grep -Eq "defaultProjectId:[^\n]*cinepolis|previewProjectIds:[^\n]*cinepolis" app/core/backend-protected-dev-mode.js
          ! grep -Eq "projects\.includes\('cinepolis'\)|currentProjectId\|\|'cinepolis'|projectId:'cinepolis'" app/adapters/tya-protected-auth-hr-authority-bridge-v2.js
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg tree "$I3_CERTIFICATION_SOURCE_TREE" --arg control "$GITHUB_SHA" \
            '{decision:"PASS_I3_SINGLE_CERTIFICATION_SOURCE_GUARD",i3CertificationSourceSha:$source,i3CertificationSourceTree:$tree,controlHeadSha:$control,productDrift:false,production:false}' \
            > "$OUT/source-guard.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove exhaustive cumulative Phase A module integrity
        run: |
          set -Eeuo pipefail
          MATRIX="RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json"
          test -f "$MATRIX"
          test "$(jq -r '.schemaVersion' "$MATRIX")" = "cxorbia.recovery.module-truth-matrix.v5"
          test "$(jq -r '.productSource.sha' "$MATRIX")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.productSource.treeSha' "$MATRIX")" = "$I3_CERTIFICATION_SOURCE_TREE"
          test "$(jq -r '.phaseAComplete' "$MATRIX")" = "true"
          test "$(jq -r '.allModulesMatch' "$MATRIX")" = "true"
          test "$(jq '[.modules[] | select(.classification != "MATCH")] | length' "$MATRIX")" = "0"
          test "$(jq -r '.entrypointClosure.activeInternalScriptCount' "$MATRIX")" = "125"
          test "$(jq -r '.entrypointClosure.matrixCoveredActiveInternal' "$MATRIX")" = "125"
          test "$(jq '.entrypointClosure.activeInternalOutsideMatrix|length' "$MATRIX")" = "0"
          test "$(jq '.entrypointClosure.duplicateSrc|length' "$MATRIX")" = "0"
          test "$(jq '.entrypointClosure.unknownActiveOverlays|length' "$MATRIX")" = "0"
          test "$(jq -r '.financeClosure.classification' "$MATRIX")" = "MATCH"
          test "$(jq '.financeClosure.activeFiles|length' "$MATRIX")" -ge 1
          MATRIX="$MATRIX" SOURCE="$I3_CERTIFICATION_SOURCE_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync(process.env.MATRIX,'utf8'));
          const source=process.env.SOURCE;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const authoritative=m.sourceFiles.filter(x=>x.phaseAAuthority===true);
          if(!authoritative.length)throw new Error('RELEASE_COMPOSITION_FAILURE:EMPTY_PHASE_A_AUTHORITY');
          const bad=[];
          for(const f of authoritative){
            let actual='',approvedActual='';
            try{actual=git('rev-parse',source+':'+f.path);}catch{actual='MISSING';}
            if(!f.approvedSourceCommit||!f.approvedBlob)bad.push({path:f.path,reason:'APPROVAL_PROVENANCE_MISSING'});
            else{
              try{approvedActual=git('rev-parse',f.approvedSourceCommit+':'+f.path);}catch{approvedActual='MISSING';}
              if(approvedActual!==f.approvedBlob)bad.push({path:f.path,reason:'APPROVED_SOURCE_BLOB_MISMATCH',approvedSourceCommit:f.approvedSourceCommit,expected:f.approvedBlob,actual:approvedActual});
            }
            if(actual!==f.currentBlob||actual!==f.approvedBlob)bad.push({path:f.path,reason:'CURRENT_NOT_APPROVED_BLOB',expected:f.approvedBlob,actual});
          }
          if(bad.length)throw new Error('RELEASE_COMPOSITION_FAILURE:MODULE_BLOB_MISMATCH:'+JSON.stringify(bad));
          const html=git('show',source+':app/index-backend-dev.html');
          const scripts=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/gi)].map(x=>x[1].replace(/^\.\//,''));
          const styles=[...html.matchAll(/<link\b[^>]*\bhref=["']([^"']+\.css(?:\?[^"']*)?)["']/gi)].map(x=>x[1].replace(/^\.\//,'').replace(/\?.*$/,''));
          const dup=scripts.filter((x,i,a)=>a.indexOf(x)!==i);
          if(dup.length)throw new Error('RELEASE_COMPOSITION_FAILURE:DUPLICATE_SCRIPT:'+JSON.stringify([...new Set(dup)]));
          const missing=[];
          for(const f of authoritative){
            const rel=f.path.replace(/^app\//,'');
            if(f.loadTarget==='browser-script'&&!scripts.includes(rel))missing.push(rel);
            if(f.loadTarget==='browser-style'&&!styles.includes(rel))missing.push(rel);
          }
          if(missing.length)throw new Error('RELEASE_COMPOSITION_FAILURE:APPROVED_OWNER_NOT_LOADED:'+JSON.stringify(missing));
          for(const [before,after] of m.loadOrder.checks){
            const a=scripts.indexOf(before),b=scripts.indexOf(after);
            if(a<0||b<0||a>=b)throw new Error('RELEASE_COMPOSITION_FAILURE:LOAD_ORDER:'+before+'->'+after);
          }
          for(const f of m.preservedNonAuthoritySource||[]){
            const rel=f.path.replace(/^app\//,'');
            if(scripts.includes(rel))throw new Error('RELEASE_COMPOSITION_FAILURE:NON_AUTHORITY_LIBRARY_BECAME_ACTIVE:'+rel);
          }
          const overlay=m.loadOrder.preservedSupersededOverlay;
          const oi=scripts.indexOf(overlay.path.replace(/^app\//,''));
          const ci=scripts.indexOf('adapters/tya-c6-domain-consistency-bridge.js');
          if(oi<0||ci<0||oi>=ci)throw new Error('RELEASE_COMPOSITION_FAILURE:SUPERSEDED_OVERLAY_ORDER');
          for(const cfg of [m.releaseConfig?.firebaseJson,m.releaseConfig?.serviceWorker]){
            if(!cfg?.path||!cfg?.approvedSourceCommit||!cfg?.approvedBlob)throw new Error('RELEASE_COMPOSITION_FAILURE:RELEASE_CONFIG_PROVENANCE_MISSING');
            const actual=git('rev-parse',source+':'+cfg.path);
            const approved=git('rev-parse',cfg.approvedSourceCommit+':'+cfg.path);
            if(actual!==cfg.currentBlob||actual!==cfg.approvedBlob||approved!==cfg.approvedBlob)throw new Error('RELEASE_COMPOSITION_FAILURE:RELEASE_CONFIG_BLOB_MISMATCH:'+cfg.path);
          }
          NODE
          cp "$MATRIX" "$OUT/module-truth-matrix.json"
          MODULE_TRUTH_MATRIX_SHA256="$(sha256sum "$OUT/module-truth-matrix.json" | awk '{print $1}')"
          echo "MODULE_TRUTH_MATRIX_SHA256=$MODULE_TRUTH_MATRIX_SHA256" >> "$GITHUB_ENV"
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg tree "$I3_CERTIFICATION_SOURCE_TREE" --arg sha "$MODULE_TRUTH_MATRIX_SHA256" \
            --argjson modules "$(jq '.modules|length' "$MATRIX")" \
            '{decision:"PASS_I3_EXHAUSTIVE_PHASE_A_MODULE_INTEGRITY",sourceSha:$source,sourceTree:$tree,moduleTruthSha256:$sha,moduleCount:$modules,activeInternalScripts:125,activeOutsideMatrix:0,duplicateSrc:0,unknownOverlays:0,allModulesMatch:true,production:false}' \
            > "$OUT/module-integrity-gate.json"

      - name: Prove atomic P0 source contracts before build
        run: |
          set -Eeuo pipefail
          echo "ad262dd0165a7159e62076f67a6339b375ce0760dd6b650abc4ee438b04950af  CXORBIA_CANONICAL_ROUTE_INVENTORY_2026-09-18.json" | sha256sum -c -
          echo "1897093c6de6a9b36cdd0b2b0728ed2ddf0604e509a554c850a01e67e6e50d3a  ADDENDUM_PREVALENTE_RECUPERACION_CXORBIA_2026-09-18_I3_FORENSIC_CONTROL_PLANE_CACHE_ROOTCAUSE_FROZEN.md" | sha256sum -c -
          grep -q "CX_RUNTIME_PREFIXES" app/sw.js
          grep -q "keys.map(k => caches.delete(k))" app/sw.js
          for pattern in '**/*.html' '**/*.js' '**/*.css' '**/*.json' '**/*.webmanifest'; do
            jq -e --arg p "$pattern" '[.hosting.headers[] | select(.source==$p) | .headers[] | select((.key|ascii_downcase)=="cache-control" and (.value|contains("no-store")) and (.value|contains("must-revalidate")))] | length == 1' firebase.json >/dev/null
          done
          ! grep -q "id:'hr-post-'" app/adapters/tya-live-source-inplace-apply.js
          grep -q "preserveDurableVisits" app/core/backend-firebase.js
          ! grep -q "DURABLE_VISIT_AUTHORITY_AMBIGUOUS" app/core/backend-firebase.js
          grep -q "live_hr_visit_id_equals_firestore_doc_id" app/adapters/tya-cumulative-read-model-v2.js
          grep -q "docId:uniqueIndex(protectedVisits" app/adapters/tya-cumulative-read-model-v2.js
          grep -q "hr_exact_crosswalk_precedes_historical_identity_link" app/adapters/cxorbia-provider-identity-link-runtime-v1.js
          grep -q "protectedState:'1'" app/adapters/tya-protected-auth-hr-authority-bridge-v2.js
          grep -q "COPY app/core/shopper-credential-rule.js ./app/core/shopper-credential-rule.js" backend/runtime/hr-live-service/Dockerfile
          grep -q "'reservation.create'" backend/runtime/cxorbia-operational-command-provider-v1.mjs
          grep -q "source:'durable_provider'" app/adapters/tya-canonical-reservations-guard-v2.js
          grep -q "mutationsEnabled:true" app/adapters/tya-canonical-reservations-guard-v2.js
          ! grep -q "fuente canónica pendiente" app/adapters/tya-canonical-reservations-guard-v2.js
          grep -q "const selYear=_periodMatch" app/modules/dashboard.js
          ! grep -q "const selMonth=new Date().getMonth()" app/modules/dashboard.js
          OVERLAY=app/adapters/tya-ab-cumulative-composition-v1.js
          ! grep -Eq "CX\.data\._visitas\s*=|CX\.data\._posts\s*=|CX\.reservas\.[A-Za-z_]+\s*=|CX\.fin(Store)?\.[A-Za-z_]+\s*=" "$OVERLAY"
          test "$(jq '.financeClosure.activeFiles|length' RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json)" -ge 1
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" '{decision:"PASS_I3_ATOMIC_P0_SOURCE_CONTRACT",sourceSha:$source,syntheticPostulations:false,durableVisitAuthority:true,hrCrosswalkPrecedence:true,reservationsDurableProvider:true,dashboardSelectedPeriod:true,financeClosure:true,overlayNoShadow:true,production:false}' > "$OUT/atomic-p0-source-contract.json"

      - name: Install existing focal certification dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          node --test backend/runtime/hr-live-service/test/*.test.mjs | tee "$OUT/runtime-tests.log"

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Prepare exact certification source once
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-i3-certified-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$I3_CERTIFICATION_SOURCE_SHA" | tar -x -C "$SOURCE_DIR"
          test -f "$SOURCE_DIR/firebase.json"
          test -f "$SOURCE_DIR/.firebaserc"
          test -f "$SOURCE_DIR/tools/qa/cxorbia-gate20-browser-visual-dev.mjs"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Build exact certification source once
        run: |
          set -Eeuo pipefail
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:i3-${I3_CERTIFICATION_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$OUT/source-image-uri.txt"
          gcloud builds submit "$SOURCE_DIR" --project "$PROJECT" --config "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml" --substitutions "_IMAGE=$IMAGE_URI" --quiet
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg image "$IMAGE_URI" \
            '{decision:"PASS_I3_ONE_BUILD",i3CertificationSourceSha:$source,imageTag:$image,buildCount:1,production:false}' \
            > "$OUT/source-build.json"

      - name: Deploy exact built image to Recovery DEV runtime
        run: |
          set -Eeuo pipefail
          IMAGE_URI="$(cat "$OUT/source-image-uri.txt")"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-after-source-deploy.json"
          SOURCE_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-after-source-deploy.json")"
          test -n "$SOURCE_REVISION"
          gcloud run revisions describe "$SOURCE_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/source-runtime-revision.json"
          IMAGE_SPEC="$(jq -r '.spec.containers[0].image // empty' "$OUT/source-runtime-revision.json")"
          DIGEST_RAW="$(jq -r '.status.imageDigest // empty' "$OUT/source-runtime-revision.json")"
          if [[ "$DIGEST_RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$DIGEST_RAW"; elif [[ "$DIGEST_RAW" == *@sha256:* ]]; then DIGEST="sha256:${DIGEST_RAW##*@sha256:}"; elif [[ "$IMAGE_SPEC" == *@sha256:* ]]; then DIGEST="sha256:${IMAGE_SPEC##*@sha256:}"; else echo "Immutable image digest unresolved" >&2; exit 1; fi
          IMAGE_REPO="${IMAGE_SPEC%@*}"; [[ "$IMAGE_REPO" != "$IMAGE_SPEC" ]] || IMAGE_REPO="${IMAGE_SPEC%:*}"
          IMMUTABLE_IMAGE="$IMAGE_REPO@$DIGEST"
          RUNTIME_URL="$(jq -r '.status.url // empty' "$OUT/runtime-after-source-deploy.json")"
          curl -fsS --retry 10 --retry-delay 3 "$RUNTIME_URL/health" > "$OUT/health-after-source-deploy.json"
          jq -e '.ok==true and .production==false and .hrWrites==false and .shopperReconciliationReady==true and .visitReconciliationReady==true' "$OUT/health-after-source-deploy.json" >/dev/null
          echo "SOURCE_RUNTIME_REVISION=$SOURCE_REVISION" >> "$GITHUB_ENV"
          echo "SOURCE_RUNTIME_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "SOURCE_IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE" >> "$GITHUB_ENV"

      - name: Materialize existing legal gate as config-only DEV successor
        run: |
          set -Eeuo pipefail
          gcloud run revisions describe "$SOURCE_RUNTIME_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/current-revision.json"
          CUR_ENABLE="$(jq -r --arg n "$LEGAL_ENABLE_NAME" '((.spec.containers[0].env // []) | map(select(.name==$n)) | .[0].value) // empty' "$RUNNER_TEMP/current-revision.json")"
          CUR_GATE="$(jq -r --arg n "$LEGAL_GATE_NAME" '((.spec.containers[0].env // []) | map(select(.name==$n)) | .[0].value) // empty' "$RUNNER_TEMP/current-revision.json")"
          if [[ "$CUR_ENABLE" != "$LEGAL_ENABLE_VALUE" || "$CUR_GATE" != "$LEGAL_GATE_VALUE" ]]; then
            gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$SOURCE_IMMUTABLE_IMAGE" \
              --update-env-vars "$LEGAL_ENABLE_NAME=$LEGAL_ENABLE_VALUE,$LEGAL_GATE_NAME=$LEGAL_GATE_VALUE" --quiet
          fi
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-final.json"
          DEV_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-final.json")"
          gcloud run revisions describe "$DEV_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-final-revision.json"
          FINAL_DIGEST_RAW="$(jq -r '.status.imageDigest // empty' "$OUT/runtime-final-revision.json")"
          if [[ "$FINAL_DIGEST_RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then FINAL_DIGEST="$FINAL_DIGEST_RAW"; elif [[ "$FINAL_DIGEST_RAW" == *@sha256:* ]]; then FINAL_DIGEST="sha256:${FINAL_DIGEST_RAW##*@sha256:}"; else FINAL_DIGEST="$SOURCE_RUNTIME_DIGEST"; fi
          test "$FINAL_DIGEST" = "$SOURCE_RUNTIME_DIGEST"
          echo "DEV_REVISION=$DEV_REVISION" >> "$GITHUB_ENV"
          echo "RUNTIME_DIGEST=$FINAL_DIGEST" >> "$GITHUB_ENV"

      - name: Deploy same exact source archive to Hosting DEV
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$PROJECT" --non-interactive | tee "$GITHUB_WORKSPACE/$OUT/hosting-deploy.log"
          cd "$GITHUB_WORKSPACE"
          pairs=(
            'index-backend-dev.html app/index-backend-dev.html'
            'core/backend-browser-auth.js app/core/backend-browser-auth.js'
            'modules/shoppers.js app/modules/shoppers.js'
            'modules/finanzas.js app/modules/finanzas.js'
            'modules/operacion-extra.js app/modules/operacion-extra.js'
            'adapters/cxorbia-command-adapter-v1.js app/adapters/cxorbia-command-adapter-v1.js'
            'adapters/tya-canonical-shopper-portal-v2.js app/adapters/tya-canonical-shopper-portal-v2.js'
            'adapters/cxorbia-legal-acceptance-durable-contract-v1.js app/adapters/cxorbia-legal-acceptance-durable-contract-v1.js'
            'adapters/tya-protected-auth-hr-authority-bridge-v2.js app/adapters/tya-protected-auth-hr-authority-bridge-v2.js'
            'adapters/tya-c6-unified-human-runtime-v1.js app/adapters/tya-c6-unified-human-runtime-v1.js'
            'sw.js app/sw.js'
          )
          : > "$OUT/hosting-parity.tsv"
          for pair in "${pairs[@]}"; do
            remote_path="${pair%% *}"; local_path="${pair#* }"; remote="$OUT/remote-$(basename "$remote_path")"
            expected="$(sha256sum "$SOURCE_DIR/$local_path"|awk '{print $1}')"; matched=0
            for attempt in $(seq 1 15); do
              curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$HOSTING_URL/$remote_path?i3=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$remote"
              actual="$(sha256sum "$remote"|awk '{print $1}')"
              if [[ "$actual" = "$expected" ]]; then matched=1; break; fi
              sleep 4
            done
            test "$matched" = 1
            printf '%s\t%s\t%s\tMATCH\n' "$remote_path" "$expected" "$actual" >> "$OUT/hosting-parity.tsv"
          done
          jq -Rn --arg source "$I3_CERTIFICATION_SOURCE_SHA" \
            '[inputs|split("\t")|{path:.[0],expectedSha256:.[1],servedSha256:.[2],classification:.[3]}] | {decision:"PASS_I3_SINGLE_SOURCE_HOSTING_PARITY",i3CertificationSourceSha:$source,owners:.,ownerCount:length,production:false}' \
            < "$OUT/hosting-parity.tsv" > "$OUT/hosting-parity.json"

      - name: Capture exact finalized Hosting DEV identity
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$OUT/hosting-live-channel.json"
          HOSTING_RELEASE_NAME="$(jq -r '.release.name // empty' "$OUT/hosting-live-channel.json")"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$OUT/hosting-live-channel.json")"
          HOSTING_RELEASE_TIME="$(jq -r '.release.releaseTime // empty' "$OUT/hosting-live-channel.json")"
          test -n "$HOSTING_RELEASE_NAME"; test -n "$HOSTING_VERSION_NAME"; test -n "$HOSTING_RELEASE_TIME"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            "https://firebasehosting.googleapis.com/v1beta1/$HOSTING_VERSION_NAME" > "$OUT/hosting-version.json"
          test "$(jq -r '.status // empty' "$OUT/hosting-version.json")" = "FINALIZED"
          echo "HOSTING_RELEASE_NAME=$HOSTING_RELEASE_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_VERSION_NAME=$HOSTING_VERSION_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_RELEASE_TIME=$HOSTING_RELEASE_TIME" >> "$GITHUB_ENV"

      - name: Adjudicate proven exact HR aliases before fresh reconciliation
        run: |
          set -Eeuo pipefail
          IDENTITY_TMP="$RUNNER_TEMP/cxorbia-i3-operational-identity-$GITHUB_RUN_ID.json"
          REGISTRY_TMP="$RUNNER_TEMP/cxorbia-i3-tab-registry-$GITHUB_RUN_ID.json"
          trap 'rm -f "$IDENTITY_TMP" "$REGISTRY_TMP"' EXIT
          export FIREBASE_SERVICE_ACCOUNT_JSON="$(cat "$GOOGLE_APPLICATION_CREDENTIALS")"
          export CXORBIA_HR_OPERATIONAL_IDENTITY_OUT="$IDENTITY_TMP"
          export CXORBIA_HR_TAB_REGISTRY="$REGISTRY_TMP"
          export CXORBIA_EXPECTED_CURRENT_PERIOD="2026-09"
          node "$SOURCE_DIR/tools/hr-source/tya-live-provider-registry-identity-dev.mjs" > "$OUT/identity-registry-safe-console.json"
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" OUT="$OUT" IDENTITY_TMP="$IDENTITY_TMP" \
          CROSSWALK="$SOURCE_DIR/app/docs/evidence/VISIT-IDENTITY-CROSSWALK-READONLY-LATEST.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp, getApps } from 'firebase-admin/app';
          import { FieldValue, getFirestore } from 'firebase-admin/firestore';

          const PROJECT=process.env.PROJECT,TENANT=process.env.TENANT_ID,PROJECT_ID=process.env.PROJECT_ID,OUT=process.env.OUT;
          const IDENTITY_TMP=process.env.IDENTITY_TMP,CROSSWALK=process.env.CROSSWALK;
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v:[];
          const sha=v=>crypto.createHash('sha256').update(String(v),'utf8').digest('hex');
          const active=new Set(['active','confirmed','approved','materialized']);
          const trusted=new Set(['provider_exact','tenant_adjudication','platform_created','migrated_exact']);
          const strip=v=>str(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          const part=v=>strip(v).toLowerCase().replace(/[^a-z0-9]+/g,'');
          const credentialLogin=name=>{
            const tokens=str(name).split(/\s+/).filter(Boolean),first=tokens[0]||'',last=tokens.slice(1).join(' ');
            const a=part(first),b=part(last);return a&&b?a+'.'+b:'';
          };
          const flatten=v=>{
            if(v==null)return[];
            if(Array.isArray(v))return v.flatMap(flatten);
            if(typeof v==='object')return Object.values(v).flatMap(flatten);
            return [str(v)];
          };
          const linkTokens=link=>[...new Set([
            link?.sourceIdentityKey,link?.sourceSubjectId,link?.sourceId,link?.sourceKey,
            link?.legacyShopperId,link?.legacyId,link?.externalShopperId,link?.externalId,link?.hrRowId,
            link?.personId,link?.shopperDocId,
            ...flatten(link?.sourceIdentity),...flatten(link?.identity),...flatten(link?.crosswalk),...flatten(link?.profile),
            ...flatten(link?.exactIdentityAnchors),
            ...arr(link?.sourceAliases),...arr(link?.sourceIdentityAliases),...arr(link?.identityAliases),
            ...arr(link?.exactAliases),...arr(link?.aliases)
          ].map(str).filter(Boolean))];
          const applicable=link=>{
            const status=str(link?.status||link?.state).toLowerCase(),authority=str(link?.authorityType||link?.authority?.type).toLowerCase();
            const authorityRef=str(link?.authorityRef||link?.authority?.evidenceRef||link?.authority?.adjudicationId||link?.authority?.providerRef||link?.authority?.commandId||link?.providerAckRef||link?.adjudicationId||link?.commandId||link?.idempotencyKey||link?.id);
            const tenant=str(link?.tenantId||link?.scope?.tenantId),scope=str(link?.projectScope||link?.scope?.projectId||link?.projectId||'*');
            const sourceSystem=str(link?.sourceSystem||link?.sourceNamespace||link?.sourceType||link?.sourceIdentity?.sourceSystem).toLowerCase();
            const canonical=str(link?.canonicalShopperId||link?.canonicalId||link?.shopperId||link?.profileId);
            return tenant===TENANT&&active.has(status)&&trusted.has(authority)&&!!authorityRef&&link?.periodIndependent===true&&!link?.periodKey&&!link?.periodId&&!link?.periodScope&&(scope==='*'||scope.toLowerCase()==='tenant'||scope===PROJECT_ID)&&sourceSystem.includes('hr')&&!!canonical&&linkTokens(link).length>0;
          };
          const canonicalFor=link=>str(link?.canonicalShopperId||link?.canonicalId||link?.shopperId||link?.profileId);

          const overlay=JSON.parse(fs.readFileSync(IDENTITY_TMP,'utf8'));
          if(overlay?.schemaVersion!=='cxorbia.tya-operational-shopper-identity.v2'||overlay?.displayIdentityOnly!==false||overlay?.containsContactData!==true||overlay?.contactDataOptional!==true||overlay?.containsCredentials!==false)throw new Error('SOURCE_FAILURE:IDENTITY_OVERLAY_CONTRACT');
          const groups=new Map();
          for(const row of arr(overlay.identities)){
            const id=str(row?.shopperId),login=credentialLogin(row?.displayName);
            if(!id||!login)continue;
            if(!groups.has(login))groups.set(login,[]);
            groups.get(login).push(id);
          }
          const collisions=[...groups.entries()].map(([login,ids])=>({login,ids:[...new Set(ids)].sort()})).filter(x=>x.ids.length>1);

          const cross=JSON.parse(fs.readFileSync(CROSSWALK,'utf8'));
          const exactBySource=new Map();
          const exactEvidenceBySource=new Map();
          const exactEvidenceConflicts=[];
          const addExact=(source,target,evidence)=>{
            source=str(source);target=str(target);if(!source||!target)return;
            const prior=exactBySource.get(source);
            if(prior&&prior!==target){
              exactEvidenceConflicts.push({
                sourceId:source,
                priorTargetFingerprint:sha(prior).slice(0,24),
                newTargetFingerprint:sha(target).slice(0,24),
                priorEvidence:[...(exactEvidenceBySource.get(source)||new Set())].sort(),
                newEvidence:evidence
              });
              return;
            }
            exactBySource.set(source,target);
            if(!exactEvidenceBySource.has(source))exactEvidenceBySource.set(source,new Set());
            exactEvidenceBySource.get(source).add(evidence);
          };
          for(const row of arr(cross?.crosswalk)){
            if(row?.action==='REUSE_EXISTING_CANONICAL_SHOPPER'&&str(row?.plannedShopperId)&&str(row?.canonicalShopperId)){
              addExact(row.plannedShopperId,row.canonicalShopperId,'visit_identity_crosswalk');
            }
          }
          const mappingHash=str(cross?.mappingHashSha256);
          if(!/^[a-f0-9]{64}$/.test(mappingHash))throw new Error('SOURCE_FAILURE:EXACT_VISIT_CROSSWALK_HASH_INVALID');

          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:PROJECT});
          const db=getFirestore(),tenant=db.collection('tenants').doc(TENANT),linksRef=tenant.collection('shopperIdentityLinks');

          const durableCrossSnap=await tenant.collection('shopperIdentityCrosswalk').get();
          let durableExactAliasEvidence=0;
          for(const doc of durableCrossSnap.docs){
            const row=doc.data()||{};
            const tenantOk=str(row.tenantId||TENANT)===TENANT;
            const sourceType=str(row.sourceType).toLowerCase();
            const identityMode=str(row.identityMode).toLowerCase();
            const projectIds=arr(row.projectIds).map(str).filter(Boolean);
            const projectOk=projectIds.includes(PROJECT_ID);
            const target=str(row.shopperId);
            if(!tenantOk||sourceType!=='hr_external'||!projectOk||!target)continue;
            if(identityMode!=='provider_exact_identity_link')continue;
            for(const token of [...new Set([doc.id,row.sourceStableKey,row.sourceShopperId].map(str).filter(Boolean))]){
              addExact(token,target,'durable_shopper_identity_crosswalk');
              durableExactAliasEvidence++;
            }
          }

          if(exactEvidenceConflicts.length){
            const report={
              schemaVersion:'cxorbia.i3.exact-identity-evidence-conflict.v1',
              generatedAt:new Date().toISOString(),tenantId:TENANT,projectId:PROJECT_ID,
              decision:'HOLD_I3_EXACT_IDENTITY_EVIDENCE_CONFLICT',classification:'MAPPING_FAILURE',
              exactVisitCrosswalkSha256:mappingHash,durableExactAliasEvidence,
              conflicts:exactEvidenceConflicts,
              providerWrites:0,hrWrites:0,authWrites:0,production:false
            };
            fs.writeFileSync(OUT+'/identity-link-adjudication.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report));
            process.exit(2);
          }

          const linkSnap=await linksRef.get();
          const links=linkSnap.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(applicable);
          const tokenTargets=new Map();
          for(const link of links){
            const target=canonicalFor(link);
            for(const token of linkTokens(link)){
              if(!tokenTargets.has(token))tokenTargets.set(token,new Set());
              tokenTargets.get(token).add(target);
            }
          }
          const resolveTrusted=source=>{
            let cur=str(source);const seen=new Set();
            for(let i=0;i<8;i++){
              if(!cur||seen.has(cur))throw new Error('MAPPING_FAILURE:IDENTITY_LINK_CHAIN_CYCLE');
              seen.add(cur);
              const targets=[...(tokenTargets.get(cur)||new Set())];
              if(targets.length>1)throw new Error('MAPPING_FAILURE:IDENTITY_LINK_TOKEN_CONFLICT');
              if(targets.length===0)return cur;
              if(targets[0]===cur)return cur;
              cur=targets[0];
            }
            throw new Error('MAPPING_FAILURE:IDENTITY_LINK_CHAIN_DEPTH');
          };


          // Focal I3 identity-evidence completion: read durable shopper profiles without exporting PII.
          // Only exact persisted aliases, government-document equality, protected-email equality or stable legacy-id equality
          // may resolve a missing HR technical identity. Different government documents prove a distinct identity.
          const flattenProfileToken=value=>{
            const out=[];const walk=v=>{
              if(v==null)return;
              if(Array.isArray(v)){v.forEach(walk);return;}
              if(typeof v==='object'){Object.values(v).forEach(walk);return;}
              const token=str(v);if(token)out.push(token);
            };
            walk(value);return out;
          };
          const profileSnap=await tenant.collection('shoppers').get();
          const profiles=profileSnap.docs.map(d=>({id:d.id,...(d.data()||{})}));
          const profileCanonical=p=>str(p?.canonicalShopperId||p?.shopperId||p?.id);
          const profileAliases=p=>[...new Set([
            ...flattenProfileToken(p?.exactAliases),...flattenProfileToken(p?.identityAliases),...flattenProfileToken(p?.aliases),
            ...flattenProfileToken(p?.sourceAliases),...flattenProfileToken(p?.sourceIdentityAliases),
            ...flattenProfileToken(p?.sourceShopperIds),...flattenProfileToken(p?.legacyLiveShopperIds),
            ...flattenProfileToken(p?.hrShopperIds),...flattenProfileToken(p?.canonicalLegacyIds)
          ].map(str).filter(Boolean))];
          const profileForCanonical=target=>profiles.filter(p=>profileCanonical(p)===str(target));
          const normalizedDocument=p=>str(p?.dpi||p?.documentId).toUpperCase().replace(/[^A-Z0-9]/g,'');
          const normalizedProtectedEmail=p=>{
            const value=str(p?.email).toLowerCase();
            return value&& !value.endsWith('@auth.cxorbia.invalid') ? value : '';
          };
          const stableLegacyId=p=>str(p?.legacyShopperId||p?.legacyId);
          let protectedExactAliasEvidence=0,protectedDistinctIdentityEvidence=0;
          const protectedProfileResolution=(sourceId,groupIds)=>{
            const explicit=profiles.filter(p=>profileCanonical(p)!==sourceId&&profileAliases(p).includes(sourceId));
            const explicitTargets=[...new Set(explicit.map(profileCanonical).filter(Boolean))];
            if(explicitTargets.length===1){
              protectedExactAliasEvidence++;
              const target=explicitTargets[0];
              return {ok:true,target,evidenceType:'protected_profile_authorized_alias',evidenceRef:'profile-alias:'+sha([sourceId,target].join('\0')).slice(0,32)};
            }
            if(explicitTargets.length>1)return {ok:false,reason:'PROTECTED_PROFILE_ALIAS_CONFLICT',identityDisposition:'INSUFFICIENT_EXACT_EVIDENCE'};

            const sourceProfiles=profiles.filter(p=>profileCanonical(p)===sourceId);
            if(sourceProfiles.length>1)return {ok:false,reason:'PROTECTED_SOURCE_PROFILE_AMBIGUOUS',identityDisposition:'INSUFFICIENT_EXACT_EVIDENCE'};
            if(sourceProfiles.length===0)return {ok:false,reason:'EXACT_IDENTITY_EVIDENCE_MISSING',identityDisposition:'INSUFFICIENT_EXACT_EVIDENCE'};
            const sourceProfile=sourceProfiles[0];

            const candidateTargets=[];
            for(const peer of groupIds.filter(x=>x!==sourceId)){
              const direct=[...(tokenTargets.get(peer)||new Set())];
              if(direct.length===1)candidateTargets.push(resolveTrusted(peer));
              else {
                const exact=exactBySource.get(peer);
                if(exact)candidateTargets.push(resolveTrusted(exact));
              }
            }
            const targets=[...new Set(candidateTargets.filter(Boolean))];
            if(targets.length!==1)return {ok:false,reason:targets.length?'PROTECTED_TARGET_AMBIGUOUS':'EXACT_IDENTITY_EVIDENCE_MISSING',identityDisposition:'INSUFFICIENT_EXACT_EVIDENCE'};
            const target=targets[0],targetProfiles=profileForCanonical(target);
            if(targetProfiles.length!==1)return {ok:false,reason:targetProfiles.length?'PROTECTED_TARGET_PROFILE_AMBIGUOUS':'PROTECTED_TARGET_PROFILE_MISSING',identityDisposition:'INSUFFICIENT_EXACT_EVIDENCE'};
            const targetProfile=targetProfiles[0];

            const sourceDoc=normalizedDocument(sourceProfile),targetDoc=normalizedDocument(targetProfile);
            const sourceEmail=normalizedProtectedEmail(sourceProfile),targetEmail=normalizedProtectedEmail(targetProfile);
            const sourceLegacy=stableLegacyId(sourceProfile),targetLegacy=stableLegacyId(targetProfile);

            if(sourceDoc&&targetDoc){
              if(sourceDoc===targetDoc){
                protectedExactAliasEvidence++;
                return {ok:true,target,evidenceType:'protected_profile_document_match',evidenceRef:'profile-document:'+sha([sourceId,target,sourceDoc].join('\0')).slice(0,32)};
              }
              protectedDistinctIdentityEvidence++;
              return {ok:false,reason:'PROTECTED_DOCUMENT_DIVERGENCE',identityDisposition:'PROVEN_DISTINCT_IDENTITY'};
            }
            if(sourceLegacy&&targetLegacy&&sourceLegacy===targetLegacy){
              protectedExactAliasEvidence++;
              return {ok:true,target,evidenceType:'protected_profile_stable_legacy_id_match',evidenceRef:'profile-legacy:'+sha([sourceId,target,sourceLegacy].join('\0')).slice(0,32)};
            }
            if(sourceEmail&&targetEmail&&sourceEmail===targetEmail){
              protectedExactAliasEvidence++;
              return {ok:true,target,evidenceType:'protected_profile_email_match',evidenceRef:'profile-email:'+sha([sourceId,target,sourceEmail].join('\0')).slice(0,32)};
            }
            return {ok:false,reason:'EXACT_IDENTITY_EVIDENCE_MISSING',identityDisposition:'INSUFFICIENT_EXACT_EVIDENCE'};
          };

          const planned=[],blockers=[];
          for(const group of collisions){
            const rows=group.ids.map(sourceId=>{
              const direct=[...(tokenTargets.get(sourceId)||new Set())];
              if(direct.length>1)return {sourceId,reason:'DIRECT_TRUSTED_LINK_CONFLICT'};
              if(direct.length===1)return {sourceId,alreadyLinked:true,target:resolveTrusted(sourceId),exactVisitTarget:exactBySource.get(sourceId)||null};
              const exactVisitTarget=exactBySource.get(sourceId);
              if(!exactVisitTarget){
                const protectedResolution=protectedProfileResolution(sourceId,group.ids);
                if(!protectedResolution.ok)return {sourceId,reason:protectedResolution.reason,identityDisposition:protectedResolution.identityDisposition||'INSUFFICIENT_EXACT_EVIDENCE'};
                return {sourceId,alreadyLinked:false,target:resolveTrusted(protectedResolution.target),exactVisitTarget:null,evidenceType:protectedResolution.evidenceType,evidenceRef:protectedResolution.evidenceRef};
              }
              return {sourceId,alreadyLinked:false,target:resolveTrusted(exactVisitTarget),exactVisitTarget,evidenceType:'exact_visit_identity_crosswalk',evidenceRef:'exact-visit-crosswalk:'+mappingHash};
            });
            const bad=rows.filter(x=>x.reason);
            if(bad.length){blockers.push({credentialFingerprint:sha(group.login).slice(0,24),technicalIds:group.ids,reasons:bad.map(x=>({sourceId:x.sourceId,reason:x.reason,identityDisposition:x.identityDisposition||'INSUFFICIENT_EXACT_EVIDENCE'}))});continue;}
            const targets=[...new Set(rows.map(x=>x.target))];
            if(targets.length!==1){blockers.push({credentialFingerprint:sha(group.login).slice(0,24),technicalIds:group.ids,reasons:[{reason:'EXACT_EVIDENCE_TARGET_DIVERGENCE',targetFingerprints:targets.map(x=>sha(x).slice(0,24))}]});continue;}
            const target=targets[0];
            for(const row of rows.filter(x=>!x.alreadyLinked)){
              planned.push({sourceId:row.sourceId,canonicalShopperId:target,exactVisitCanonicalShopperId:row.exactVisitTarget||null,evidenceType:row.evidenceType||'exact_visit_identity_crosswalk',evidenceRef:row.evidenceRef||('exact-visit-crosswalk:'+mappingHash),credentialFingerprint:sha(group.login).slice(0,24)});
            }
          }

          const base={
            schemaVersion:'cxorbia.i3.exact-credential-collision-adjudication.v1',
            generatedAt:new Date().toISOString(),tenantId:TENANT,projectId:PROJECT_ID,
            identityCount:arr(overlay.identities).length,collisionGroupCount:collisions.length,
            collisionTechnicalIdCount:collisions.reduce((n,x)=>n+x.ids.length,0),
            exactVisitCrosswalkSha256:mappingHash,existingTrustedIdentityLinks:links.length,
            durableExactAliasEvidence,protectedProfileReads:profiles.length,protectedExactAliasEvidence,protectedDistinctIdentityEvidence,
            rawNamesPersisted:false,rawLoginsPersisted:false,rawProtectedAnchorsPersisted:false,hrWrites:0,authWrites:0,production:false
          };
          // Exceptional unresolved identities remain fail-closed per shopper, but do not block the
          // authoritative HR revision for unrelated shoppers. Proven exact aliases are still materialized below.
          const uniquePlan=[...new Map(planned.map(x=>[x.sourceId,x])).values()];
          if(uniquePlan.length){
            await db.runTransaction(async tx=>{
              const refs=uniquePlan.map(p=>({p,id:'irl_i3_'+sha([TENANT,PROJECT_ID,'hr',p.sourceId,p.canonicalShopperId].join('\0')).slice(0,32)}));
              const snaps=await Promise.all(refs.map(x=>tx.get(linksRef.doc(x.id))));
              for(let i=0;i<refs.length;i++){
                const {p,id}=refs[i],snap=snaps[i],ref=linksRef.doc(id);
                if(snap.exists){
                  const prior={id,...(snap.data()||{})};
                  if(!applicable(prior)||canonicalFor(prior)!==p.canonicalShopperId||!linkTokens(prior).includes(p.sourceId))throw new Error('MAPPING_FAILURE:DETERMINISTIC_LINK_ID_CONFLICT');
                  continue;
                }
                tx.set(ref,{
                  schemaVersion:'cxorbia.shopper-identity-link.v1',
                  tenantId:TENANT,projectId:PROJECT_ID,projectScope:PROJECT_ID,
                  canonicalShopperId:p.canonicalShopperId,
                  sourceSystem:'hr',sourceIdentityKey:p.sourceId,sourceIdentityAliases:[p.sourceId],
                  status:'materialized',periodIndependent:true,sourceSafe:true,
                  authorityType:'tenant_adjudication',
                  authorityRef:p.evidenceRef,
                  adjudicationEvidence:p.evidenceType==='exact_visit_identity_crosswalk'
                    ?{type:'exact_visit_identity_crosswalk',mappingHashSha256:mappingHash,exactVisitCanonicalShopperId:p.exactVisitCanonicalShopperId}
                    :{type:p.evidenceType,evidenceRef:p.evidenceRef,protectedReadOnly:true,rawAnchorPersisted:false},
                  createdBy:'cxorbia-recovery-i3-exact-credential-collision-adjudicator-v2',
                  createdAt:FieldValue.serverTimestamp(),updatedAt:FieldValue.serverTimestamp()
                },{merge:false});
              }
            });
          }

          const after=await linksRef.get(),afterLinks=after.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(applicable);
          const afterTargets=new Map();
          for(const link of afterLinks)for(const token of linkTokens(link)){
            if(!afterTargets.has(token))afterTargets.set(token,new Set());
            afterTargets.get(token).add(canonicalFor(link));
          }
          function resolveAfter(source,map){
            let cur=str(source);const seen=new Set();
            for(let i=0;i<8;i++){
              if(!cur||seen.has(cur))throw new Error('MAPPING_FAILURE:READBACK_CHAIN_CYCLE');
              seen.add(cur);const targets=[...(map.get(cur)||new Set())];
              if(targets.length>1)throw new Error('MAPPING_FAILURE:READBACK_LINK_CONFLICT');
              if(!targets.length||targets[0]===cur)return cur;cur=targets[0];
            }
            throw new Error('MAPPING_FAILURE:READBACK_CHAIN_DEPTH');
          }
          const readback=[];
          for(const p of uniquePlan){
            const targets=[...(afterTargets.get(p.sourceId)||new Set())];
            if(targets.length!==1||resolveAfter(targets[0],afterTargets)!==p.canonicalShopperId)throw new Error('PERSISTENCE_FAILURE:IDENTITY_LINK_READBACK_MISMATCH');
            readback.push({sourceId:p.sourceId,canonicalShopperId:p.canonicalShopperId});
          }
          const report={...base,
            decision:blockers.length?'PASS_I3_IDENTITY_REVIEW_QUARANTINED':collisions.length?'PASS_I3_EXACT_IDENTITY_LINKS_MATERIALIZED':'PASS_I3_NO_CREDENTIAL_COLLISIONS',
            classification:blockers.length?'MAPPING_FAILURE':null,
            blocking:false,
            identityReviewRequired:blockers.length>0,
            identityReviewGroupCount:blockers.length,
            providerWrites:uniquePlan.length,plannedWrites:uniquePlan.length,readback,blockers,
            collisionGroups:collisions.map(g=>({credentialFingerprint:sha(g.login).slice(0,24),technicalIds:g.ids}))
          };
          fs.writeFileSync(OUT+'/identity-link-adjudication.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
          decision="$(jq -r '.decision' "$OUT/identity-link-adjudication.json")"
          [[ "$decision" = "PASS_I3_IDENTITY_REVIEW_QUARANTINED" || "$decision" = "PASS_I3_EXACT_IDENTITY_LINKS_MATERIALIZED" || "$decision" = "PASS_I3_NO_CREDENTIAL_COLLISIONS" ]]

      - name: Read fresh authoritative HR source
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 \
            -o "$OUT/hr-fresh.json" -w '%{http_code}' "$HOSTING_URL/api/tya/cinepolis/hr-live?format=json&fresh=1&i3=${GITHUB_RUN_ID}")"
          if [[ "$code" != "200" ]]; then
            echo "HR_FRESH_HTTP_STATUS=$code" >&2
            node -e 'const fs=require("fs");let p={};try{p=JSON.parse(fs.readFileSync(process.env.OUT+"/hr-fresh.json","utf8"))}catch{};const raw=String(p?.message||p?._runtime?.refreshError||p?.data?._runtime?.refreshError||p?.error||"HR_FRESH_NON_200");console.error("HR_FRESH_ERROR="+raw.replace(/[\\r\\n]+/g," ").slice(0,800))' >&2
            exit 1
          fi
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync(process.env.OUT+"/hr-fresh.json","utf8")),s=p?.snapshot||p?.data||p,rt=p?._runtime||s?._runtime||{};if(s?.sourceSafe!==true||rt.refreshError)throw new Error("SOURCE_FAILURE:HR_FRESH_INVALID");fs.writeFileSync(process.env.OUT+"/hr-readback.json",JSON.stringify({decision:"PASS_I3_HR_EXACT_RUNTIME",sourceSafe:true,production:false},null,2)+"\n")'

      - name: Normalize durable active shopper credentials on frozen rule
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" OUT="$OUT" TENANT_ID="$TENANT_ID" SOURCE_DIR="$SOURCE_DIR" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { applicationDefault, initializeApp, getApps } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          const PROJECT=process.env.PROJECT,OUT=process.env.OUT,tenantId=process.env.TENANT_ID,SOURCE_DIR=process.env.SOURCE_DIR;
          const mod=await import(pathToFileURL(path.join(SOURCE_DIR,'backend/runtime/cxorbia-shopper-command-provider-v1.mjs')).href);
          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:PROJECT});
          const provider=mod.createShopperCommandProvider({
            auth:getAuth(),db:getFirestore(),
            policy:{schemaVersion:'cxorbia.shopper-command-provider-policy.v1',enabled:true,allowedTenantIds:[tenantId],allowedProjectIds:[],hrWrites:false,externalWrites:false,fuzzyMatching:false}
          });
          const result=await provider.normalizeDurableCredentials({tenantId});
          if(result?.ok!==true)throw new Error('FUNCTIONAL_DEFECT:DURABLE_CREDENTIAL_SWEEP_FAILED');
          if(result?.credentialRuleVersion!==mod.CREDENTIAL_RULE_VERSION||result?.credentialSweepVersion!==mod.DURABLE_CREDENTIAL_SWEEP_VERSION)throw new Error('FUNCTIONAL_DEFECT:DURABLE_CREDENTIAL_SWEEP_VERSION_MISMATCH');
          if(result?.plaintextPersisted!==false)throw new Error('PERSISTENCE_FAILURE:DURABLE_CREDENTIAL_SECRET_POLICY');
          fs.writeFileSync(OUT+'/durable-credential-sweep.json',JSON.stringify(result,null,2)+'\n');
          NODE
