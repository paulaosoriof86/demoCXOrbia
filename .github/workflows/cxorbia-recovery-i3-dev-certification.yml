          jq -e '.reference.identityCases[] | select(.sourceShopperId=="shopper_gt_0b19085086" and .total==5 and .realized==5)' "$DIAG_OUT/prior/hr-contrast.json" >/dev/null
          jq -e '.reference.identityCases[] | select(.sourceShopperId=="shopper_gt_a55e5b3e9b" and .total==1 and .realized==1)' "$DIAG_OUT/prior/hr-contrast.json" >/dev/null

      - name: Recompose exact all-period identity map read only
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import {applicationDefault,initializeApp,getApps} from 'firebase-admin/app';
          import {getFirestore} from 'firebase-admin/firestore';

          const OUT=process.env.DIAG_OUT;
          const hrRaw=JSON.parse(fs.readFileSync(OUT+'/prior/hr-fresh.json','utf8'));
          const contrast=JSON.parse(fs.readFileSync(OUT+'/prior/hr-contrast.json','utf8'));
          const hrRevision=String(hrRaw?._runtime?.revision||contrast.sourceRevision||'');
          if(!/^[a-f0-9]{64}$/.test(hrRevision))throw new Error('SOURCE_FAILURE:VRM037_COMPOSE_HR_REVISION');

          const ctx={console};ctx.globalThis=ctx;ctx.window=ctx;
          vm.runInNewContext(fs.readFileSync('app/adapters/cxorbia-exact-identity-contract-v1.js','utf8'),ctx,{filename:'cxorbia-exact-identity-contract-v1.js'});
          vm.runInNewContext(fs.readFileSync('app/adapters/tya-cumulative-read-model-v2.js','utf8'),ctx,{filename:'tya-cumulative-read-model-v2.js'});
          const composer=ctx.CX_TYA_CUMULATIVE_READ_MODEL;
          if(!composer?.compose)throw new Error('SOURCE_FAILURE:VRM037_COMPOSER_MISSING');

          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:'cxorbia-backend-dev'});
          const db=getFirestore(),tenant=db.collection('tenants').doc('tya'),project=tenant.collection('projects').doc('cinepolis');
          const rows=async ref=>(await ref.get()).docs.map(d=>({__docId:d.id,id:d.id,...(d.data()||{})}));
          const [profiles,visits,postulations,certifications,liquidations]=await Promise.all([
            rows(tenant.collection('shoppers')),
            rows(project.collection('visits')),
            rows(project.collection('postulations')),
            rows(project.collection('certifications')),
            rows(project.collection('liquidations'))
          ]);

          const periods=Array.isArray(hrRaw.periods)?hrRaw.periods:[];
          const currentKey=String(hrRaw?.source?.currentCalendarPeriodKey||contrast.currentPeriodKey||'');
          const current=periods.find(x=>String(x.key||'')===currentKey)||{};
          const hr={
            projects:periods.map(p=>({id:p.id||('cinepolis-'+p.key),projectId:p.id||('cinepolis-'+p.key),periodKey:p.key,rootProjectId:'cinepolis',name:p.name||p.label||p.key})),
            visits:Array.isArray(hrRaw.visits)?hrRaw.visits:[],
            shoppers:Array.isArray(hrRaw.shoppers)?hrRaw.shoppers:[],
            posts:[],
            currentProjectId:'cinepolis',
            currentPeriodId:String(current.id||contrast.currentPeriodId||'')
          };
          const result=composer.compose({hr,protectedPayload:{visits,shoppers:profiles,postulations,applications:postulations,posts:postulations,certifications,liquidations}});
          const ids=['shopper_gt_0b19085086','shopper_gt_a55e5b3e9b'];
          const expected=new Map((contrast.reference?.identityCases||[]).map(x=>[String(x.sourceShopperId||''),x]));
          const identityMap=result.identityMap||{};
          const canonical=x=>String(identityMap[String(x)]||x||'');
          const cases=ids.map(id=>{
            const e=expected.get(id)||{};
            const can=canonical(id);
            const shopper=(result.shoppers||[]).find(s=>String(s.id||s.shopperId||'')===can)||null;
            const composedVisits=(result.visits||[]).filter(v=>canonical(v.shopperId)===can).map(v=>({
              id:String(v.id||v.visitId||''),hrRowId:String(v.hrRowId||''),periodKey:String(v.periodKey||''),
              rawShopperId:String(v.shopperId||''),canonicalShopperId:canonical(v.shopperId),shopper:String(v.shopper||''),
              protectedVisitId:String(v.__protectedVisitId||''),pendingOverlay:v.__pendingPlatformAssignmentOverlay===true,
              assignmentSource:String(v.assignmentSource||''),assignmentSyncStatus:String(v.assignmentSyncStatus||''),
              assignmentReviewRequired:v.assignmentReviewRequired===true
            }));
            return {
              sourceShopperId:id,expectedName:String(e.name||''),expectedTotal:Number(e.total||0),expectedRealized:Number(e.realized||0),
              canonicalId:can,identityMapValue:String(identityMap[id]||''),shopper:shopper?{
                id:String(shopper.id||shopper.shopperId||''),name:String(shopper.nombre||shopper.name||''),
                legacyLiveShopperIds:Array.isArray(shopper.legacyLiveShopperIds)?shopper.legacyLiveShopperIds.map(String):[],
                exactAliases:Array.isArray(shopper.exactAliases)?shopper.exactAliases.map(String):[]
              }:null,
              composedVisitCount:composedVisits.length,composedVisits
            };
          });
          const a=cases[0],b=cases[1],merged=a.canonicalId===b.canonicalId;
          const resultOut={
            decision:merged?'PASS_PRE_I4_VRM037_042_IDENTITY_MERGE_PROVEN':'HOLD_PRE_I4_VRM037_042_IDENTITY_MERGE_NOT_PROVEN',
            hrRevision,currentPeriodKey:currentKey,protectedCounts:{profiles:profiles.length,visits:visits.length,postulations:postulations.length,certifications:certifications.length,liquidations:liquidations.length},
            identityMap:{[ids[0]]:String(identityMap[ids[0]]||''),[ids[1]]:String(identityMap[ids[1]]||'')},
            identityConflicts:result.diagnostics?.identityConflicts||[],
            cases,
            merged,
            conclusion:merged
              ?'Two distinct HR shopper IDs with independent 5 and 1 visit histories resolve to the same effective canonical identity; this inflates the first shopper history to 6.'
              :'The 5+1 HR identities remain distinct in the exact compositor; another owner must explain the sixth visit.',
            production:false,writes:0,runtimeBuilds:0,runtimeDeploys:0,hostingDeploys:0,rulesDeploys:0
          };
          fs.writeFileSync(OUT+'/identity-history-diagnostic.json',JSON.stringify(resultOut,null,2)+'\n');
          if(!merged)throw new Error('MAPPING_FAILURE:VRM037_042_IDENTITY_MERGE_NOT_PROVEN:'+JSON.stringify({identityMap:resultOut.identityMap,cases:cases.map(x=>({id:x.sourceShopperId,canonicalId:x.canonicalId,count:x.composedVisitCount}))}));
          NODE

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-pre-i4-vrm037-diagnostic-${{ github.run_id }}
          path: ${{ env.DIAG_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0


