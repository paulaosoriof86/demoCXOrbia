name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - tools/qa/cxorbia-gate20-browser-visual-dev.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 0e0b9627bec0ccc2c892a70cd86e9e5f144df870
  LOCKED_GATE20_SOURCE_SHA: bd2a519db5ebd08f17d47827997056db795c8c09
  LOCKED_GATE20_RUN_ID: '34306578074'
  FUNCTIONAL_CERT_RUN_ID: '34732457426'
  FUNCTIONAL_CERT_HEAD_SHA: 7c6a63166c20d0713137c301e103b52c1ac259fb
  FUNCTIONAL_CERT_ARTIFACT_ID: '10310078031'
  FUNCTIONAL_CERT_ARTIFACT_DIGEST: sha256:a48eb87512210a5723347d780e1d3548a7e4e2de9428232229935e78b14f490b
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  OUT: .tmp/recovery-i3-gate20-focal
  EXPECTED_DEV_REVISION: cxorbia-live-hr-dev-00067-jk6
  EXPECTED_DEV_IMAGE: gcr.io/cxorbia-backend-dev/cxorbia-live-hr-dev:i3-cert-0e0b9627bec0-34732201798

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Recovery QA head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove product source frozen and visual drift focal
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git cat-file -e "$LOCKED_GATE20_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc tools/hr-source
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              .github/workflows/cxorbia-recovery-i3-dev-certification.yml|tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs|tools/qa/cxorbia-gate20-browser-visual-dev.mjs) ;;
              *) echo "Unexpected post-source drift: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD)
          git diff --name-only "$LOCKED_GATE20_SOURCE_SHA" "$PRODUCT_SOURCE_SHA" -- app | sort > "$OUT/app-visual-drift.txt"
          cat > "$OUT/expected-app-visual-drift.txt" <<'EOF'
          app/adapters/cxorbia-command-adapter-v1.js
          app/adapters/cxorbia-cxdata-command-boundary-v1.js
          app/adapters/cxorbia-shopper-admin-command-contract-v1.js
          app/modules/finanzas.js
          app/modules/operacion-extra.js
          app/modules/shoppers.js
          EOF
          sed -i 's/^          //' "$OUT/expected-app-visual-drift.txt"
          diff -u "$OUT/expected-app-visual-drift.txt" "$OUT/app-visual-drift.txt"
          node --check tools/qa/cxorbia-gate20-browser-visual-dev.mjs
          jq -n -S --arg product "$PRODUCT_SOURCE_SHA" --arg baseline "$LOCKED_GATE20_SOURCE_SHA" --arg qa "$GITHUB_SHA" '{decision:"PASS_GATE20_FOCAL_SOURCE_GUARD",productSourceSha:$product,lockedGate20SourceSha:$baseline,qaHeadSha:$qa,productDriftAfterCandidate:false,rebuild:false,redeploy:false,production:false}' > "$OUT/source-guard.json"

      - name: Verify locked Gate 20 and functional certification identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCKED_GATE20_RUN_ID" > "$OUT/locked-gate20-run.json"
          jq -e --arg sha "$LOCKED_GATE20_SOURCE_SHA" '.head_sha==$sha and .status=="completed" and .conclusion=="success"' "$OUT/locked-gate20-run.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$FUNCTIONAL_CERT_RUN_ID" > "$OUT/functional-cert-run.json"
          jq -e --arg sha "$FUNCTIONAL_CERT_HEAD_SHA" '.head_sha==$sha and .status=="completed" and .conclusion=="success"' "$OUT/functional-cert-run.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FUNCTIONAL_CERT_ARTIFACT_ID" > "$OUT/functional-cert-artifact.json"
          jq -e --argjson id "$FUNCTIONAL_CERT_ARTIFACT_ID" --argjson run "$FUNCTIONAL_CERT_RUN_ID" --arg sha "$FUNCTIONAL_CERT_HEAD_SHA" --arg digest "$FUNCTIONAL_CERT_ARTIFACT_DIGEST" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run and .workflow_run.head_sha==$sha' "$OUT/functional-cert-artifact.json" >/dev/null
          jq -n -S --argjson run "$LOCKED_GATE20_RUN_ID" --arg sha "$LOCKED_GATE20_SOURCE_SHA" --arg tenant "$TENANT_ID" --arg project "$PROJECT_ID" --arg period "$PERIOD_ID" '{decision:"PASS_LOCKED_GATE20_BASELINE",lockedEvidence:true,lockedRunId:$run,lockedSourceSha:$sha,tenantId:$tenant,projectId:$project,periodId:$period,production:false}' > "$OUT/gate20-locked.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focal visual dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Read back exact certified DEV runtime
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-current.json"
          revision="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-current.json")"
          created="$(jq -r '.status.latestCreatedRevisionName // empty' "$OUT/runtime-current.json")"
          image="$(jq -r '.spec.template.spec.containers[0].image // empty' "$OUT/runtime-current.json")"
          test "$revision" = "$EXPECTED_DEV_REVISION"
          test "$created" = "$EXPECTED_DEV_REVISION"
          test "$image" = "$EXPECTED_DEV_IMAGE"
          jq -n -S --arg revision "$revision" --arg image "$image" '{decision:"PASS_GATE20_CERTIFIED_RUNTIME_READBACK",revision:$revision,image:$image,rebuild:false,redeploy:false,production:false}' > "$OUT/runtime-readback.json"

      - name: Prove current changed owners are served by Hosting DEV
        run: |
          set -euo pipefail
          pairs=(
            'modules/shoppers.js app/modules/shoppers.js'
            'modules/finanzas.js app/modules/finanzas.js'
            'modules/operacion-extra.js app/modules/operacion-extra.js'
            'adapters/cxorbia-command-adapter-v1.js app/adapters/cxorbia-command-adapter-v1.js'
            'adapters/cxorbia-cxdata-command-boundary-v1.js app/adapters/cxorbia-cxdata-command-boundary-v1.js'
            'adapters/cxorbia-shopper-admin-command-contract-v1.js app/adapters/cxorbia-shopper-admin-command-contract-v1.js'
          )
          : > "$OUT/hosting-owner-parity.tsv"
          for pair in "${pairs[@]}"; do
            remote="${pair%% *}"; local="${pair#* }"; out="$OUT/remote-$(basename "$remote")"
            expected="$(sha256sum "$local"|awk '{print $1}')"; matched=0
            for attempt in $(seq 1 12); do
              curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$HOSTING_URL/$remote?gate20f=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$out"
              actual="$(sha256sum "$out"|awk '{print $1}')"
              printf '%s\t%s\t%s\t%s\n' "$remote" "$attempt" "$expected" "$actual" >> "$OUT/hosting-owner-parity.tsv"
              if [ "$actual" = "$expected" ]; then matched=1; break; fi
              sleep 4
            done
            test "$matched" = 1
          done
          jq -n -S --arg product "$PRODUCT_SOURCE_SHA" '{decision:"PASS_GATE20_CHANGED_OWNER_PARITY",productSourceSha:$product,ownerCount:6,hostingDeploys:0,production:false}' > "$OUT/hosting.json"

      - name: Execute focal browser and visual drift revalidation
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" SOURCE_SHA="$PRODUCT_SOURCE_SHA" HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-gate20-browser-visual-dev.mjs | tee "$OUT/gate20-focal-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate20-focal-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate20-browser-visual.json"

      - name: Final Gate 20 closure verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const source=p('source-guard.json'),runtime=p('runtime-readback.json'),hosting=p('hosting.json'),visual=p('gate20-browser-visual.json');
          if(source.decision!=='PASS_GATE20_FOCAL_SOURCE_GUARD'||runtime.decision!=='PASS_GATE20_CERTIFIED_RUNTIME_READBACK'||hosting.decision!=='PASS_GATE20_CHANGED_OWNER_PARITY'||visual.decision!=='PASS_GATE20_FOCAL_VISUAL_DRIFT')throw new Error('GATE20_FOCAL_INCOMPLETE');
          const result={verdict:'PASS_GATE20_CURRENT_CANDIDATE',gate20:'PASS',lockedBaselineRunId:Number(process.env.LOCKED_GATE20_RUN_ID),lockedBaselineSourceSha:process.env.LOCKED_GATE20_SOURCE_SHA,productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,functionalCertificationRunId:Number(process.env.FUNCTIONAL_CERT_RUN_ID),devRuntimeRevision:process.env.EXPECTED_DEV_REVISION,changedSurfaceOwners:visual.changedSurfaceOwners,desktop:true,mobile:true,validatedRoutes:visual.validatedRoutes,captureCount:visual.captureCount,pageErrors:0,maxOverflowX:visual.maxOverflowX,hostingOwnerParity:true,rebuild:false,redeploy:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized Gate 20 focal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate20-focal-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
