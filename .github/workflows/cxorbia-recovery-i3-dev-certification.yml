name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - tools/qa/cxorbia-gate16-bidirectional-ack-idempotency-dev.mjs
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ github.sha }}
  LOCK_GATE15_SHA: f92bb3915695b48fb06a8ed37a2529734f86a6b6
  LOCK_GATE15_RUN_ID: '34184904309'
  LOCK_GATE11_SHA: 887ce3c869d7d52819cf11da9671f6846197f4f7
  LOCK_GATE11_RUN_ID: '34160689278'
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-gate16

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove Gate 16 QA-only delta and locked write-owner lineage
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$LOCK_GATE15_SHA" HEAD
          git merge-base --is-ancestor "$LOCK_GATE11_SHA" HEAD
          git cat-file -e "$LOCK_GATE15_SHA^{commit}"
          git cat-file -e "$LOCK_GATE11_SHA^{commit}"
          git diff --name-only "$LOCK_GATE15_SHA" HEAD | sort > "$OUT/current-delta.txt"
          printf '%s\n' \
            '.github/workflows/cxorbia-recovery-i3-dev-certification.yml' \
            'tools/qa/cxorbia-gate16-bidirectional-ack-idempotency-dev.mjs' \
            | sort > "$OUT/expected-delta.txt"
          diff -u "$OUT/expected-delta.txt" "$OUT/current-delta.txt"
          git diff --quiet "$LOCK_GATE15_SHA" HEAD -- app backend firebase.json .firebaserc
          write_owners=(
            app/adapters/cxorbia-command-adapter-v1.js
            app/adapters/cxorbia-command-http-transport-v1.js
            app/adapters/cxorbia-cxdata-command-boundary-v1.js
            app/adapters/cxorbia-canonical-write-firewall-v1.js
            app/adapters/cxorbia-hr-write-adapter-contract-v1.js
            app/core/backend-protected-dev-mode.js
            backend/runtime/cxorbia-operational-command-provider-v1.mjs
            backend/runtime/cxorbia-shopper-command-provider-v1.mjs
            backend/runtime/cxorbia-project-command-provider-v1.mjs
            backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
            backend/runtime/hr-live-service/server.mjs
          )
          git diff --quiet "$LOCK_GATE11_SHA" HEAD -- "${write_owners[@]}"
          node --check tools/qa/cxorbia-gate16-bidirectional-ack-idempotency-dev.mjs
          node --check app/adapters/cxorbia-command-adapter-v1.js
          node --check app/adapters/cxorbia-command-http-transport-v1.js
          node --check app/adapters/cxorbia-cxdata-command-boundary-v1.js
          node --check app/adapters/cxorbia-canonical-write-firewall-v1.js
          node --check app/adapters/cxorbia-hr-write-adapter-contract-v1.js
          node --check backend/runtime/cxorbia-operational-command-provider-v1.mjs
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check backend/runtime/cxorbia-project-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          grep -Fq "idempotentReplay:true,providerWrites:0" backend/runtime/cxorbia-operational-command-provider-v1.mjs
          grep -Fq "visit.sync.confirm" backend/runtime/cxorbia-operational-command-provider-v1.mjs
          grep -Fq "assignmentSyncStatus:'synced'" backend/runtime/cxorbia-operational-command-provider-v1.mjs
          grep -Fq "idempotencyKey" app/adapters/cxorbia-hr-write-adapter-contract-v1.js
          grep -Fq "result?.providerAck===true" app/adapters/cxorbia-hr-write-adapter-contract-v1.js
          git status --porcelain | tee "$OUT/source-status.txt"; test ! -s "$OUT/source-status.txt"
          node <<'NODE'
          const fs=require('fs'),out=process.env.OUT;
          const gate15={decision:'PASS_GATE15_COUNTRY_CURRENCY_PROJECT_PERIOD',gate:15,lockedEvidence:true,lockedRunId:Number(process.env.LOCK_GATE15_RUN_ID),lockedSourceSha:process.env.LOCK_GATE15_SHA,noProductDrift:true,tenantId:'tya',projectId:'cinepolis',periodId:'cinepolis-2026-09',countryMappingExact:true,currencyMappingExact:true,projectMappingExact:true,visitPeriodMappingExact:true,activeContextExact:true,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          const gate11={decision:'PASS_GATE11_APPROVAL_NO_DUPLICATE',gate:11,lockedEvidence:true,lockedRunId:Number(process.env.LOCK_GATE11_RUN_ID),lockedSourceSha:process.env.LOCK_GATE11_SHA,tenantId:'tya',projectId:'cinepolis',periodId:'cinepolis-2026-09',remoteAck:true,successUiAfterAck:true,idempotentReplay:true,replayProviderWrites:0,duplicatePairCountBefore:1,duplicatePairCountAfter:1,visitAssignedDurably:true,localStorageTruth:false,hrWrites:0,production:false};
          fs.writeFileSync(`${out}/gate15-locked.json`,JSON.stringify(gate15,null,2)+'\n');
          fs.writeFileSync(`${out}/gate11-locked.json`,JSON.stringify(gate11,null,2)+'\n');
          fs.writeFileSync(`${out}/locked-lineage.json`,JSON.stringify({decision:'PASS_GATE16_LOCKED_WRITE_OWNER_NO_DRIFT',lockedGate15RunId:Number(process.env.LOCK_GATE15_RUN_ID),lockedGate15SourceSha:process.env.LOCK_GATE15_SHA,lockedRealWriteRunId:Number(process.env.LOCK_GATE11_RUN_ID),lockedRealWriteSourceSha:process.env.LOCK_GATE11_SHA,currentSourceSha:process.env.SOURCE_SHA,noProductDriftSinceGate15:true,noWriteOwnerDriftSinceGate11:true,changedFiles:fs.readFileSync(`${out}/current-delta.txt`,'utf8').trim().split(/\n/).filter(Boolean),production:false,hrWrites:0},null,2)+'\n');
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gate 16 read-only dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Read back live command runtime and prove write-owner lineage
        run: |
          set -euo pipefail
          current_rev="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')"
          test -n "$current_rev"
          gcloud run revisions describe "$current_rev" --region "$REGION" --project "$PROJECT" --format=json > "$OUT/runtime-revision.json"
          runtime_sha="$(node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.OUT+'/runtime-revision.json','utf8')),c=r?.spec?.containers?.[0]||{},e=Object.fromEntries((c.env||[]).map(x=>[x.name,x.value]));process.stdout.write(String(e.CXORBIA_RECOVERY_SOURCE_SHA||''))")"
          test "${#runtime_sha}" = 40
          git cat-file -e "$runtime_sha^{commit}"
          git merge-base --is-ancestor "$runtime_sha" HEAD
          runtime_write_owners=(
            backend/runtime/cxorbia-operational-command-provider-v1.mjs
            backend/runtime/cxorbia-shopper-command-provider-v1.mjs
            backend/runtime/cxorbia-project-command-provider-v1.mjs
            backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
            backend/runtime/hr-live-service/server.mjs
          )
          git diff --quiet "$LOCK_GATE11_SHA" "$runtime_sha" -- "${runtime_write_owners[@]}"
          RUNTIME_SHA="$runtime_sha" CURRENT_REV="$current_rev" node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(`${process.env.OUT}/runtime-revision.json`,'utf8'));
          const c=r?.spec?.containers?.[0]||{};
          const image=r?.status?.imageDigest||c.image||null;
          const out={decision:'PASS_GATE16_COMMAND_RUNTIME_WRITE_OWNER_LOCK',revision:process.env.CURRENT_REV,sourceSha:process.env.RUNTIME_SHA,imageDigest:image,lockedRealWriteSourceSha:process.env.LOCK_GATE11_SHA,runtimeSourceInRecoveryLineage:true,noWriteOwnerDriftVsGate11:true,revisionNamePinned:false,imageDigestPinned:false,production:false};
          fs.writeFileSync(`${process.env.OUT}/runtime.json`,JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Read back exact Gate 16 browser write boundaries from Hosting DEV
        run: |
          set -euo pipefail
          pairs=(
            'app/adapters/cxorbia-command-adapter-v1.js|adapters/cxorbia-command-adapter-v1.js|command'
            'app/adapters/cxorbia-command-http-transport-v1.js|adapters/cxorbia-command-http-transport-v1.js|transport'
            'app/adapters/cxorbia-cxdata-command-boundary-v1.js|adapters/cxorbia-cxdata-command-boundary-v1.js|boundary'
            'app/adapters/cxorbia-canonical-write-firewall-v1.js|adapters/cxorbia-canonical-write-firewall-v1.js|firewall'
            'app/adapters/cxorbia-hr-write-adapter-contract-v1.js|adapters/cxorbia-hr-write-adapter-contract-v1.js|hrwrite'
            'app/core/backend-protected-dev-mode.js|core/backend-protected-dev-mode.js|protected'
          )
          : > "$OUT/hosting-owner-hashes.txt"
          for item in "${pairs[@]}"; do
            IFS='|' read -r local remote key <<< "$item"
            curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$HOSTING_URL/$remote?gate16=${GITHUB_RUN_ID}-${key}" -o "$OUT/remote-$key.js"
            cmp "$local" "$OUT/remote-$key.js"
            lsha="$(sha256sum "$local"|awk '{print $1}')"; rsha="$(sha256sum "$OUT/remote-$key.js"|awk '{print $1}')"; test "$lsha" = "$rsha"
            printf '%s %s\n' "$key" "$lsha" >> "$OUT/hosting-owner-hashes.txt"
          done
          printf '{"decision":"PASS_HOSTING_GATE16_WRITE_BOUNDARY_PARITY","sourceSha":"%s","lockedProductSourceSha":"%s","ownerCount":6,"hostingDeploys":0,"production":false}\n' "$SOURCE_SHA" "$LOCK_GATE15_SHA" > "$OUT/hosting.json"

      - name: Execute Gate 16 ACK and idempotency certification
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" SOURCE_SHA="$SOURCE_SHA" HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-gate16-bidirectional-ack-idempotency-dev.mjs | tee "$OUT/gate16-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate16-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate16-bidirectional-ack-idempotency.json"

      - name: Final Gate 16 verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),read=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const g15=read('gate15-locked.json'),g11=read('gate11-locked.json'),g16=read('gate16-bidirectional-ack-idempotency.json'),hosting=read('hosting.json'),runtime=read('runtime.json'),lineage=read('locked-lineage.json');
          if(g15.decision!=='PASS_GATE15_COUNTRY_CURRENCY_PROJECT_PERIOD'||g15.lockedEvidence!==true||g15.noProductDrift!==true||Number(g15.lockedRunId)!==Number(process.env.LOCK_GATE15_RUN_ID)||g15.lockedSourceSha!==process.env.LOCK_GATE15_SHA)throw new Error('GATE15_LOCK_INVALID');
          if(g11.decision!=='PASS_GATE11_APPROVAL_NO_DUPLICATE'||g11.lockedEvidence!==true||g11.remoteAck!==true||g11.successUiAfterAck!==true||g11.idempotentReplay!==true||Number(g11.replayProviderWrites)!==0||g11.visitAssignedDurably!==true)throw new Error('GATE11_REAL_WRITE_LOCK_INVALID');
          if(lineage.decision!=='PASS_GATE16_LOCKED_WRITE_OWNER_NO_DRIFT'||lineage.noProductDriftSinceGate15!==true||lineage.noWriteOwnerDriftSinceGate11!==true)throw new Error('GATE16_WRITE_OWNER_DRIFT');
          if(runtime.decision!=='PASS_GATE16_COMMAND_RUNTIME_WRITE_OWNER_LOCK'||runtime.runtimeSourceInRecoveryLineage!==true||runtime.noWriteOwnerDriftVsGate11!==true||!runtime.revision||!/^[a-f0-9]{40}$/.test(String(runtime.sourceSha||''))||!runtime.imageDigest)throw new Error('GATE16_RUNTIME_LINEAGE_INVALID');
          if(hosting.decision!=='PASS_HOSTING_GATE16_WRITE_BOUNDARY_PARITY'||Number(hosting.ownerCount)!==6||Number(hosting.hostingDeploys)!==0)throw new Error('GATE16_HOSTING_PARITY_INCOMPLETE');
          if(g16.decision!=='PASS_GATE16_BIDIRECTIONAL_ACK_IDEMPOTENCY')throw new Error(g16.decision||'GATE16_RESULT_MISSING');
          const pass=g16.lockedRealWriteRemoteAck===true&&g16.lockedRealWriteSuccessUiAfterAck===true&&g16.lockedRealWriteIdempotentReplay===true&&Number(g16.lockedReplayProviderWrites)===0&&g16.commandWritesEnabled===true&&g16.commandSuccessRequiresProviderAck===true&&g16.providerAuthorizationRequired===true&&g16.commandLocalMutation===false&&g16.commandLocalStoragePersistence===false&&g16.transportEndpointConfigured===true&&g16.canonicalBoundaryReady===true&&g16.directLocalWriteAllowed===false&&g16.entryProviderAckRequired===true&&g16.hrWritesEnabled===false&&g16.hrWriteFailClosed===true&&g16.hrWriteBlockedCode==='HR_WRITES_DISABLED'&&g16.hrProviderAck===false&&g16.hrCommitted===false&&g16.hrLocalMutation===false&&g16.localStorageUnchanged===true&&Number(g16.invalidPlatformSyncStates)===0&&Number(g16.invalidSyncedWithoutTimestamp)===0&&g16.localStorageTruth===false&&Number(g16.providerWrites)===0&&Number(g16.hrWrites)===0&&g16.production===false;
          if(!pass)throw new Error('GATE16_ACCEPTANCE_INCOMPLETE');
          const summary={verdict:g16.decision,gate15:'PASS_LOCKED_NO_DRIFT',gate16:'PASS',lockedGate15RunId:Number(process.env.LOCK_GATE15_RUN_ID),lockedGate15SourceSha:process.env.LOCK_GATE15_SHA,lockedRealWriteRunId:Number(process.env.LOCK_GATE11_RUN_ID),lockedRealWriteSourceSha:process.env.LOCK_GATE11_SHA,sourceSha:process.env.SOURCE_SHA,noProductDrift:true,noWriteOwnerDrift:true,cloudRunRevision:runtime.revision,cloudRunSourceSha:runtime.sourceSha,cloudRunImageDigest:runtime.imageDigest,cloudRunWriteOwnerNoDrift:true,hostingWriteBoundaryParity:true,hostingDeploys:0,tenantId:g16.tenantId,projectId:g16.projectId,periodId:g16.periodId,remoteAck:true,successUiAfterAck:true,idempotentReplay:true,replayProviderWrites:0,commandSuccessRequiresProviderAck:true,directLocalWriteAllowed:false,hrWritesEnabled:false,hrWriteFailClosed:true,platformAssignments:g16.platformAssignments,pendingHrAssignments:g16.pendingHrAssignments,syncedAssignments:g16.syncedAssignments,invalidPlatformSyncStates:0,invalidSyncedWithoutTimestamp:0,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(summary,null,2)+'\n');console.log(JSON.stringify(summary));
          NODE

      - name: Upload sanitized Gate 16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate16-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
