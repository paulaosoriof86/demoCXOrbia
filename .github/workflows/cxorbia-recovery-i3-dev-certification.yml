  vrm151-provider-source-reproof:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM151_PROVIDER_SOURCE_REPROOF_REQUIRED' || needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM151_ROUTER_SOURCE_REPROOF_REQUIRED' || needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM151_CANONICAL_OWNER_SOURCE_REPROOF_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      VRM151_OUT: .tmp/vrm151-provider-source-reproof
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: step
        run: |
          set -Eeuo pipefail
          mkdir -p "$VRM151_OUT"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(git rev-parse "$FOCAL_SOURCE^{tree}")" = "$FOCAL_TREE"
          git merge-base --is-ancestor "$FOCAL_SOURCE" HEAD
          git diff --quiet "$FOCAL_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check backend/runtime/cxorbia-finance-command-provider-v1.mjs
      - name: step
        run: |
          set -Eeuo pipefail
          node --test backend/runtime/hr-live-service/test/cxorbia-finance-command-provider-v1.test.mjs | tee "$VRM151_OUT/tests.log"
          grep -Fq "VRM-151 historical reconciliation uses canonical submitted visit" "$VRM151_OUT/tests.log"
          grep -Fq "VRM-151 historical reconciliation records paid status but keeps amount null" "$VRM151_OUT/tests.log"
          grep -Fq "VRM-151 historical reconciliation rejects non-submitted visits" "$VRM151_OUT/tests.log"
          grep -Fq "VRM-151 command runtime routes finance.historical.reconcile to finance provider" "$VRM151_OUT/tests.log"
          grep -Fq "VRM-151 historical reconciliation writes the live visitId canonical owner" "$VRM151_OUT/tests.log"
      - name: step
        run: |
          set -Eeuo pipefail
          node - <<'NODE' | tee "$VRM151_OUT/source-contract.json"
          const fs=require('fs');
          const s=fs.readFileSync('backend/runtime/cxorbia-finance-command-provider-v1.mjs','utf8');
          const a=s.indexOf("if(command.commandType==='finance.historical.reconcile')");
          const b=s.indexOf("if(command.commandType==='finance.movement.create')",a);
          if(a<0||b<=a)throw new Error('VRM151_BRANCH_NOT_FOUND');
          const h=s.slice(a,b);
          const checks={
            submitted:h.includes('FINANCE_HISTORICAL_VISIT_NOT_SUBMITTED'),
            sourceRevision:h.includes('FINANCE_HISTORICAL_HR_REVISION_REQUIRED'),
            reviewRequired:h.includes('historicalPaymentAmountReviewRequired'),
            noFinancialMovements:!h.includes("collection('financialMovements')"),
            noBankWrites:h.includes('bankWrites:0'),
            noHrWrites:h.includes('hrWrites:0'),
            historicalSource:h.includes("source:'historical_reconciliation'")
          };
          if(Object.values(checks).some(v=>!v))throw new Error('VRM151_SOURCE_CONTRACT_FAIL:'+JSON.stringify(checks));
          process.stdout.write(JSON.stringify({decision:'PASS_VRM151_PROVIDER_SOURCE_REPROOF',checks,production:false},null,2)+'\n');
          NODE
      - name: step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm151-provider-source-reproof-${{ github.run_id }}
          path: .tmp/vrm151-provider-source-reproof
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  vrm151-runtime-only-dev-materialization:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM151_RUNTIME_ONLY_DEV_MATERIALIZATION_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      VRM151_MAT_OUT: .tmp/vrm151-runtime-only-materialization
      PRIOR_APP_SOURCE: eb71f4a9e51ad325b27e4b60db2c0bef263f726d
      EXPECTED_HOSTING_VERSION: sites/cxorbia-backend-dev/versions/3c2418df100edab0
    steps:
      - name: step
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: step
        run: |
          set -Eeuo pipefail
          mkdir -p "$VRM151_MAT_OUT"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(git rev-parse "$FOCAL_SOURCE^{tree}")" = "$FOCAL_TREE"
          git merge-base --is-ancestor "$FOCAL_SOURCE" HEAD
          git diff --quiet "$FOCAL_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          git diff --quiet "$PRIOR_APP_SOURCE" "$FOCAL_SOURCE" -- app firebase.json .firebaserc firestore.rules storage.rules
          node --check backend/runtime/cxorbia-finance-command-provider-v1.mjs
          node --test backend/runtime/hr-live-service/test/cxorbia-finance-command-provider-v1.test.mjs | tee "$VRM151_MAT_OUT/source-tests.log"
      - name: step
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
      - name: step
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: step
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}
      - name: step
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-vrm151-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$FOCAL_SOURCE" | tar -x -C "$SOURCE_DIR"
          test -f "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:i3-vrm151-${FOCAL_SOURCE:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$VRM151_MAT_OUT/image-uri.txt"
          gcloud builds submit "$SOURCE_DIR" --project "$PROJECT" --config "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml" --substitutions "_IMAGE=$IMAGE_URI" --quiet
          jq -n -S --arg source "$FOCAL_SOURCE" --arg tree "$FOCAL_TREE" --arg image "$IMAGE_URI" '{decision:"PASS_VRM151_ONE_BUILD",sourceSha:$source,sourceTree:$tree,imageTag:$image,builds:1,production:false}' > "$VRM151_MAT_OUT/build.json"
      - name: step
        run: |
          set -Eeuo pipefail
          IMAGE_URI="$(cat "$VRM151_MAT_OUT/image-uri.txt")"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --min-instances=1 --max-instances=1 --update-env-vars "$LEGAL_ENABLE_NAME=$LEGAL_ENABLE_VALUE,$LEGAL_GATE_NAME=$LEGAL_GATE_VALUE,$I3_HR_CACHE_PIN_NAME=$I3_HR_CACHE_PIN_VALUE" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$VRM151_MAT_OUT/runtime.json"
          DEV_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$VRM151_MAT_OUT/runtime.json")"
          test -n "$DEV_REVISION"
          gcloud run revisions describe "$DEV_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$VRM151_MAT_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$VRM151_MAT_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else echo "runtime digest unresolved" >&2; exit 1; fi
          RUNTIME_URL="$(jq -r '.status.url // empty' "$VRM151_MAT_OUT/runtime.json")"
          curl -fsS --retry 12 --retry-delay 3 "$RUNTIME_URL/health" > "$VRM151_MAT_OUT/health.json"
          jq -e '.ok==true and .production==false and .hrWrites==false' "$VRM151_MAT_OUT/health.json" >/dev/null
          echo "DEV_REVISION=$DEV_REVISION" >> "$GITHUB_ENV"
          echo "RUNTIME_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$VRM151_MAT_OUT/hosting-live-channel.json"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$VRM151_MAT_OUT/hosting-live-channel.json")"
          test "$HOSTING_VERSION_NAME" = "$EXPECTED_HOSTING_VERSION"
          jq -n -S --arg hosting "$HOSTING_VERSION_NAME" '{decision:"PASS_VRM151_HOSTING_REUSED_BYTE_IDENTICAL_APP",hostingVersion:$hosting,hostingDeploys:0,production:false}' > "$VRM151_MAT_OUT/hosting-reuse.json"
      - name: step
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 8 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&vrm151mat=$GITHUB_RUN_ID" > "$VRM151_MAT_OUT/hr-meta.json"
          HR_REVISION="$(jq -r '.revision // empty' "$VRM151_MAT_OUT/hr-meta.json")"
          [[ "$HR_REVISION" =~ ^[0-9a-f]{64}$ ]]
          jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .hrWrites==false and .production==false' "$VRM151_MAT_OUT/hr-meta.json" >/dev/null
          echo "HR_REVISION=$HR_REVISION" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          jq -n -S --arg source "$FOCAL_SOURCE" --arg tree "$FOCAL_TREE" --arg runtime "$DEV_REVISION" --arg digest "$RUNTIME_DIGEST" --arg hosting "$EXPECTED_HOSTING_VERSION" --arg hr "$HR_REVISION" '{decision:"PASS_VRM151_RUNTIME_ONLY_DEV_MATERIALIZATION",sourceSha:$source,sourceTree:$tree,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,hrRevision:$hr,builds:1,runtimeDeploys:1,hostingDeploys:0,hrWrites:0,bankWrites:0,production:false}' > "$VRM151_MAT_OUT/result.json"
      - name: step
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm151-runtime-materialization-${{ github.run_id }}
          path: .tmp/vrm151-runtime-only-materialization
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

