      - name: Revalidate owner-defined shopper credential contract in DEV
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" OUT="$OUT" HOSTING_URL="$HOSTING_URL" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" SOURCE_DIR="$SOURCE_DIR" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          import { applicationDefault, initializeApp, getApps } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          const PROJECT=process.env.PROJECT,OUT=process.env.OUT,HOSTING_URL=String(process.env.HOSTING_URL||'').replace(/\/$/,''),tenantId=process.env.TENANT_ID,projectId=process.env.PROJECT_ID,SOURCE_DIR=process.env.SOURCE_DIR;
          const mod=await import(pathToFileURL(path.join(SOURCE_DIR,'backend/runtime/cxorbia-shopper-command-provider-v1.mjs')).href);
          const RULE=mod.CREDENTIAL_RULE_VERSION,SWEEP=mod.DURABLE_CREDENTIAL_SWEEP_VERSION,PREVIEW='YES_PAULA_20260628_PREVIEW_DEV',PROTECTED='YES_PAULA_20260730_PROTECTED_DEV',FULL='YES_PAULA_20260731_FULL_PROFILE_DEV';
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v:[];
          const docs=async ref=>(await ref.get()).docs.map(d=>({id:d.id,...(d.data()||{})}));
          const internalEmail=login=>crypto.createHash('sha256').update(tenantId+'\0shopper\0'+String(login).toLowerCase(),'utf8').digest('hex').slice(0,48)+'@auth.cxorbia.invalid';
          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:PROJECT});
          const auth=getAuth(),db=getFirestore(),tenant=db.collection('tenants').doc(tenantId);
          const [members,profiles]=await Promise.all([docs(tenant.collection('users')),docs(tenant.collection('shoppers'))]);
          const sweep=JSON.parse(fs.readFileSync(OUT+'/durable-credential-sweep.json','utf8'));
          const reviewIds=new Set(arr(sweep.identityReviewQueue).map(x=>str(x?.shopperId)).filter(Boolean));
          const profileById=new Map(profiles.map(p=>[str(p.shopperId||p.id),p]));
          const targets=members.filter(m=>m.active===true&&str(m.role)==='shopper'&&str(m.authNamespace)==='shopper'&&str(m.shopperId));
          if(!targets.length)throw new Error('AUTH_FAILURE:CREDENTIAL_RULE_NO_ACTIVE_SHOPPERS');
          const mismatches=[];let checked=0,reviewed=0,sample=null;
          for(const m of targets){
            const shopperId=str(m.shopperId);
            if(reviewIds.has(shopperId)){reviewed++;continue;}
            const p=profileById.get(shopperId);if(!p){mismatches.push('profile_missing_not_quarantined');continue;}
            const c=mod.shopperCredentialRule(p);if(!c.ok){mismatches.push('canonical_rule_rejected_not_quarantined');continue;}
            let user;try{user=await auth.getUser(m.id);}catch{mismatches.push('auth_missing_not_quarantined');continue;}
            const expectedEmail=internalEmail(c.login);
            if(str(m.visibleLogin).toLowerCase()!==c.login)mismatches.push('member_login');
            if(str(m.credentialRuleVersion)!==RULE)mismatches.push('member_rule');
            if(str(m.credentialSweepVersion)!==SWEEP)mismatches.push('member_sweep');
            if(str(m.credentialPasswordProofVersion)!==mod.CREDENTIAL_PASSWORD_PROOF_VERSION)mismatches.push('member_password_proof');
            if(str(m.credentialPasswordRuleVersion)!==RULE)mismatches.push('member_password_rule');
            if(str(p.username||p.user||p.visibleLogin).toLowerCase()!==c.login)mismatches.push('profile_login');
            if(str(p.credentialRuleVersion)!==RULE)mismatches.push('profile_rule');
            if(str(p.credentialSweepVersion)!==SWEEP)mismatches.push('profile_sweep');
            if(str(user.email).toLowerCase()!==expectedEmail)mismatches.push('auth_email');
            checked++;
            if(!sample)sample={uid:m.id,shopperId,login:c.login,password:c.password};
          }
          if(checked+reviewed!==targets.length)mismatches.push('population_accounting');
          if(mismatches.length)throw new Error('FUNCTIONAL_DEFECT:CREDENTIAL_RULE_MISMATCH:'+JSON.stringify({checked,reviewed,targetCount:targets.length,mismatches:[...new Set(mismatches)]}));
          if(!sample)throw new Error('AUTH_FAILURE:CREDENTIAL_RULE_SAMPLE_MISSING');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function fetchRetry(url,options={},attempts=5){
            let lastError=null;
            for(let attempt=1;attempt<=attempts;attempt++){
              try{
                const response=await fetch(url,options);
                if(response.ok||response.status<500)return response;
                lastError=new Error('HTTP_'+response.status);
              }catch(error){lastError=error;}
              if(attempt<attempts)await sleep(1000*attempt);
            }
            throw new Error('ENVIRONMENT_FAILURE:AUTH_NETWORK_UNREACHABLE:'+String(lastError?.message||lastError||'unknown').slice(0,120));
          }
          const initResponse=await fetchRetry(HOSTING_URL+'/__/firebase/init.js',{headers:{accept:'application/javascript'}});
          if(!initResponse.ok)throw new Error('ENVIRONMENT_FAILURE:FIREBASE_INIT_HTTP_'+initResponse.status);
          const initText=await initResponse.text();
          const apiKeyMatch=initText.match(/["']?apiKey["']?\s*:\s*["']([^"']+)["']/);
          if(!apiKeyMatch)throw new Error('ENVIRONMENT_FAILURE:FIREBASE_INIT_APIKEY_MISSING');
          const apiKey=apiKeyMatch[1];
          const signInResponse=await fetchRetry(
            'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(apiKey),
            {
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({email:internalEmail(sample.login),password:sample.password,returnSecureToken:true})
            }
          );
          const signInBody=await signInResponse.json().catch(()=>({}));
          if(!signInResponse.ok){
            const code=str(signInBody?.error?.message||'AUTH_SIGNIN_FAILED').split(':')[0].trim().replace(/[^A-Z0-9_\-]/gi,'_').slice(0,80);
            const cls=/INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|USER_DISABLED/i.test(code)?'AUTH_FAILURE':'ENVIRONMENT_FAILURE';
            throw new Error(cls+':IDENTITY_TOOLKIT_'+code);
          }
          const tokenParts=str(signInBody.idToken).split('.');
          if(tokenParts.length<2)throw new Error('AUTH_FAILURE:CREDENTIAL_RULE_ID_TOKEN_MISSING');
          const claims=JSON.parse(Buffer.from(tokenParts[1],'base64url').toString('utf8'));
          const passwordLoginPassed=
            str(signInBody.localId)===sample.uid&&
            str(claims.role)==='shopper'&&
            str(claims.shopperId)===sample.shopperId&&
            str(claims.tenantId)===tenantId&&
            str(claims.authNamespace)==='shopper';
          if(!passwordLoginPassed)throw new Error('AUTH_FAILURE:CREDENTIAL_RULE_PASSWORD_LOGIN_CONTEXT');
          const evidence={decision:'PASS_I3_OWNER_SHOPPER_CREDENTIAL_RULE',credentialRuleVersion:RULE,credentialSweepVersion:SWEEP,passwordProofVersion:mod.CREDENTIAL_PASSWORD_PROOF_VERSION,activeShopperMemberships:targets.length,checked,identityReviewCount:reviewed,profileAndAuthMappingExact:true,passwordProofDurable:true,passwordLoginPassed,plaintextPersisted:false,production:false};
          fs.writeFileSync(OUT+'/credential-rule-readback.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          test "$(jq -r '.decision' "$OUT/credential-rule-readback.json")" = "PASS_I3_OWNER_SHOPPER_CREDENTIAL_RULE"
          test "$(jq -r '.passwordLoginPassed' "$OUT/credential-rule-readback.json")" = "true"

