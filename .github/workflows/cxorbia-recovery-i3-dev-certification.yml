name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - tools/qa/cxorbia-gate15-country-currency-project-period-dev.mjs
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ github.sha }}
  LOCK_GATE14_SHA: b1ac0003675aed4b6e16c7c2121a93fb6d9c5868
  LOCK_GATE14_RUN_ID: '34184599912'
  PROJECT: cxorbia-backend-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-gate15

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove Gate 15 QA-only delta and locked Gate 14 no product drift
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$LOCK_GATE14_SHA" HEAD
          git cat-file -e "$LOCK_GATE14_SHA^{commit}"
          git diff --name-only "$LOCK_GATE14_SHA" HEAD | sort > "$OUT/current-delta.txt"
          printf '%s\n' \
            '.github/workflows/cxorbia-recovery-i3-dev-certification.yml' \
            'tools/qa/cxorbia-gate15-country-currency-project-period-dev.mjs' \
            | sort > "$OUT/expected-delta.txt"
          diff -u "$OUT/expected-delta.txt" "$OUT/current-delta.txt"
          git diff --quiet "$LOCK_GATE14_SHA" HEAD -- app backend firebase.json .firebaserc
          node --check tools/qa/cxorbia-gate15-country-currency-project-period-dev.mjs
          git status --porcelain | tee "$OUT/source-status.txt"; test ! -s "$OUT/source-status.txt"
          node <<'NODE'
          const fs=require('fs'),out=process.env.OUT;
          const gate14={decision:'PASS_GATE14_KPIS_SAME_EXTERNAL_HR_REVISION',gate:14,lockedEvidence:true,lockedRunId:Number(process.env.LOCK_GATE14_RUN_ID),lockedSourceSha:process.env.LOCK_GATE14_SHA,noProductDrift:true,tenantId:'tya',projectId:'cinepolis',periodId:'cinepolis-2026-09',sameRevision:true,kpisExact:true,comparisonIndependentFromBrowserReadModel:true,identityResolution:'exact_technical_crosswalk_only',authorityApplied:true,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${out}/gate14-locked.json`,JSON.stringify(gate14,null,2)+'\n');
          fs.writeFileSync(`${out}/locked-lineage.json`,JSON.stringify({decision:'PASS_GATE14_LOCKED_NO_PRODUCT_DRIFT',lockedRunId:Number(process.env.LOCK_GATE14_RUN_ID),lockedSourceSha:process.env.LOCK_GATE14_SHA,currentSourceSha:process.env.SOURCE_SHA,noProductDrift:true,changedFiles:fs.readFileSync(`${out}/current-delta.txt`,'utf8').trim().split(/\n/).filter(Boolean),production:false,hrWrites:0},null,2)+'\n');
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gate 15 read-only dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Read back exact Gate 15 product owners from Hosting DEV
        run: |
          set -euo pipefail
          pairs=(
            'app/adapters/tya-live-source-inplace-apply.js|adapters/tya-live-source-inplace-apply.js|liveapply'
            'app/core/data.js|core/data.js|data'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js|adapters/tya-protected-auth-hr-authority-bridge-v2.js|authority'
            'app/adapters/tya-cumulative-read-model-v2.js|adapters/tya-cumulative-read-model-v2.js|composer'
          )
          : > "$OUT/hosting-owner-hashes.txt"
          for item in "${pairs[@]}"; do
            IFS='|' read -r local remote key <<< "$item"
            curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$HOSTING_URL/$remote?gate15=${GITHUB_RUN_ID}-${key}" -o "$OUT/remote-$key.js"
            cmp "$local" "$OUT/remote-$key.js"
            lsha="$(sha256sum "$local"|awk '{print $1}')"; rsha="$(sha256sum "$OUT/remote-$key.js"|awk '{print $1}')"; test "$lsha" = "$rsha"
            printf '%s %s\n' "$key" "$lsha" >> "$OUT/hosting-owner-hashes.txt"
          done
          printf '{"decision":"PASS_HOSTING_GATE15_OWNER_PARITY","sourceSha":"%s","lockedProductSourceSha":"%s","ownerCount":4,"hostingDeploys":0,"production":false}\n' "$SOURCE_SHA" "$LOCK_GATE14_SHA" > "$OUT/hosting.json"

      - name: Execute real Gate 15 country currency project period E2E
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" SOURCE_SHA="$SOURCE_SHA" HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-gate15-country-currency-project-period-dev.mjs | tee "$OUT/gate15-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate15-console.log"
          ! grep -E '"password"[[:space:]]*:' "$OUT/gate15-country-currency-project-period.json"

      - name: Final Gate 15 verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),read=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const g14=read('gate14-locked.json'),g15=read('gate15-country-currency-project-period.json'),hosting=read('hosting.json'),lineage=read('locked-lineage.json');
          if(g14.decision!=='PASS_GATE14_KPIS_SAME_EXTERNAL_HR_REVISION'||g14.lockedEvidence!==true||g14.noProductDrift!==true||Number(g14.lockedRunId)!==Number(process.env.LOCK_GATE14_RUN_ID)||g14.lockedSourceSha!==process.env.LOCK_GATE14_SHA)throw new Error('GATE14_LOCK_INVALID');
          if(lineage.decision!=='PASS_GATE14_LOCKED_NO_PRODUCT_DRIFT'||lineage.noProductDrift!==true)throw new Error('GATE15_PRODUCT_DRIFT');
          if(hosting.decision!=='PASS_HOSTING_GATE15_OWNER_PARITY'||Number(hosting.ownerCount)!==4||Number(hosting.hostingDeploys)!==0)throw new Error('GATE15_HOSTING_PARITY_INCOMPLETE');
          if(g15.decision!=='PASS_GATE15_COUNTRY_CURRENCY_PROJECT_PERIOD')throw new Error(g15.decision||'GATE15_RESULT_MISSING');
          const countries=Array.isArray(g15.countries)?[...g15.countries].sort():[];
          const gt=Array.isArray(g15.currencySets?.GT)?g15.currencySets.GT:[],hn=Array.isArray(g15.currencySets?.HN)?g15.currencySets.HN:[];
          const pass=g15.sameRevision===true&&g15.externalRevision===g15.browserRevision&&g15.browserRevision===g15.readbackRevision&&g15.periodMappingExact===true&&g15.countryMappingExact===true&&g15.currencyMappingExact===true&&g15.projectMappingExact===true&&g15.visitPeriodMappingExact===true&&g15.activeContextExact===true&&countries.length===2&&countries[0]==='GT'&&countries[1]==='HN'&&gt.length===1&&gt[0]==='Q'&&hn.length===1&&hn[0]==='L'&&g15.activeProjectId==='cinepolis'&&/^cinepolis-\d{4}-\d{2}$/.test(String(g15.activePeriodId||''))&&g15.externalAuthority==='hr-live-runtime'&&g15.comparisonIndependentFromLocalStorage===true&&g15.authorityApplied===true&&g15.localStorageTruth===false&&Number(g15.providerWrites)===0&&Number(g15.hrWrites)===0&&g15.production===false;
          if(!pass)throw new Error('GATE15_ACCEPTANCE_INCOMPLETE');
          const summary={verdict:g15.decision,gate14:'PASS_LOCKED_NO_DRIFT',gate15:'PASS',lockedGate14RunId:Number(process.env.LOCK_GATE14_RUN_ID),lockedGate14SourceSha:process.env.LOCK_GATE14_SHA,sourceSha:process.env.SOURCE_SHA,noProductDrift:true,hostingOwnerParity:true,hostingDeploys:0,tenantId:g15.tenantId,projectId:g15.projectId,externalRevision:g15.externalRevision,browserRevision:g15.browserRevision,readbackRevision:g15.readbackRevision,sameRevision:true,periodCount:g15.periodCount,visitCount:g15.visitCount,countries,GT_currency:gt[0],HN_currency:hn[0],activeProjectId:g15.activeProjectId,activePeriodId:g15.activePeriodId,activePeriodKey:g15.activePeriodKey,periodMappingExact:true,countryMappingExact:true,currencyMappingExact:true,projectMappingExact:true,visitPeriodMappingExact:true,activeContextExact:true,comparisonIndependentFromLocalStorage:true,authorityApplied:true,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(summary,null,2)+'\n');console.log(JSON.stringify(summary));
          NODE

      - name: Upload sanitized Gate 15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate15-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
