            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>!!window.firebase?.auth&&Array.isArray(window.firebase?.apps)&&window.firebase.apps.length>0,null,{timeout:90000});
            await page.waitForFunction(expectedUid=>String(window.firebase?.auth?.().currentUser?.uid||'')===String(expectedUid),shopper.id,{timeout:90000});
            await page.waitForFunction(()=>typeof window.CX?.backendAuth?.ensureAuthenticated==='function',null,{timeout:90000});
            await page.evaluate(async()=>{await window.CX.backendAuth.ensureAuthenticated();});
            await page.waitForFunction(({tenantId,projectId})=>{const c=window.CX?.backendAuth?.context?.()||{},projects=Array.isArray(c.projectIds)?c.projectIds.map(String):[];return c.authenticated===true&&c.tenantId===tenantId&&c.role==='shopper'&&(projects.length===0||projects.includes(projectId));},{tenantId,projectId},{timeout:120000});
            const before=await page.evaluate(()=>({source:String(window.CX_BACKEND_LAST_STATE?.source||window.CX_BACKEND_DATA_SOURCE||''),backendCounts:window.CX_BACKEND_LAST_STATE?.counts||null,gate:window.CX_C6_HR_AUTHORITY_GATE||null,boot:window.CX_PROTECTED_AUTH_HR_BOOT_RECONCILE||null}));
            await page.waitForFunction(({projectId,periodId})=>{const d=window.CX?.data||{},gate=window.CX_C6_HR_AUTHORITY_GATE||{},source=String(window.CX?.dataSource?.sourceRef||'');return window.CX_PROTECTED_AUTH_HR_AUTHORITY?.applied===true&&gate.ready===true&&gate.blocked===false&&source==='hr-live-all-periods+firestore-authenticated-exact-overlay'&&String(d.currentProjectId||'')===projectId&&String(d.currentPeriodId||'')===periodId&&Array.isArray(d.projects)&&d.projects.length>0&&Array.isArray(d._visitas)&&d._visitas.length>0;},{projectId,periodId},{timeout:120000});
            await page.waitForTimeout(750);
            const after=await page.evaluate(()=>{const d=window.CX?.data||{},body=String(document.body?.innerText||'');return {authority:window.CX_PROTECTED_AUTH_HR_AUTHORITY||null,gate:window.CX_C6_HR_AUTHORITY_GATE||null,boot:window.CX_PROTECTED_AUTH_HR_BOOT_RECONCILE||null,source:String(window.CX?.dataSource?.sourceRef||''),sourceRevision:String(d.previewMeta?.sourceRevision||''),projectId:String(d.currentProjectId||''),periodId:String(d.currentPeriodId||''),periods:Array.isArray(d.projects)?d.projects.length:0,visits:Array.isArray(d._visitas)?d._visitas.length:0,shoppers:Array.isArray(d.shoppers)?d.shoppers.length:0,pendingGateText:body.includes('Validando fuente operacional'),technicalMode:new URLSearchParams(location.search).has('cxTechnicalAuthE2E')};});
            if(errors.length)throw new Error(`VISUAL_DEFECT:HUMAN_LANE_PAGE_ERROR:${errors.join('|').slice(0,600)}`);
            if(after.pendingGateText||after.technicalMode||!after.authority?.applied||after.gate?.ready!==true||after.gate?.blocked===true||after.source!=='hr-live-all-periods+firestore-authenticated-exact-overlay'||after.projectId!==projectId||after.periodId!==periodId||!after.periods||!after.visits||!/^[a-f0-9]{64}$/.test(after.sourceRevision))throw new Error(`FUNCTIONAL_DEFECT:HUMAN_LANE_AUTHORITY_NOT_RELEASED:${JSON.stringify(after)}`);
            fs.mkdirSync(OUT,{recursive:true});await page.screenshot({path:path.join(OUT,'human-lane-authority-release.png'),fullPage:true});
            fs.writeFileSync(path.join(OUT,'human-lane-authority-release.json'),JSON.stringify({decision:'PASS_I3_HUMAN_LANE_AUTHORITY_RELEASE',production:false,readOnly:true,technicalMode:false,humanFullVisual:true,tenantId,projectId,periodId,shopperSelected:true,before,after},null,2)+'\n');
            await ctx.close();
          } finally {await browser.close();}
          NODE
          test "$(jq -r '.decision' "$OUT/human-lane-authority-release.json")" = "PASS_I3_HUMAN_LANE_AUTHORITY_RELEASE"
          test "$(jq -r '.after.pendingGateText' "$OUT/human-lane-authority-release.json")" = "false"
          test "$(jq -r '.after.technicalMode' "$OUT/human-lane-authority-release.json")" = "false"

