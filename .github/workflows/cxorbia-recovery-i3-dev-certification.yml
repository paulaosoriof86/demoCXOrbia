          TREE="2222222222222222222222222222222222222222"
          RUNTIME="runtime-test-1"
          DIGEST="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          HOSTING="sites/test/versions/1"
          HR="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          node <<'NODE'
          const fs=require('fs'),p=process.env.RUNNER_TEMP+'/vrm076';
          const modules=Array.from({length:20},(_,i)=>({domain:'m'+i,owners:i===0?['app/modules/x.js']:i===1?['app/modules/y.js']:[],classification:i<2?'COMPOSED_NOT_DEPLOYED':'MATCH',pendingTerminalFiles:i===0?['app/modules/x.js']:i===1?['app/modules/y.js']:[]}));
          const pre={preTerminalComposition:{decision:'PASS_C3_PRETERMINAL_COMPOSITION'},productSource:{sha:'1111111111111111111111111111111111111111',treeSha:'2222222222222222222222222222222222222222'},sourceFiles:[{path:'app/modules/x.js',domain:'m0',classification:'COMPOSED_NOT_DEPLOYED'},{path:'app/modules/y.js',domain:'m1',classification:'COMPOSED_NOT_DEPLOYED'}],modules};
