      - name: Revalidate real human lane HR authority release
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" OUT="$OUT" HOSTING_URL="$HOSTING_URL" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" PERIOD_ID="$PERIOD_ID" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { applicationDefault, initializeApp, getApps } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          import { chromium } from 'playwright';
          const PROJECT=process.env.PROJECT,OUT=process.env.OUT,HOSTING_URL=String(process.env.HOSTING_URL||'').replace(/\/$/,''),tenantId=process.env.TENANT_ID,projectId=process.env.PROJECT_ID,periodId=process.env.PERIOD_ID;
          const PREVIEW='YES_PAULA_20260628_PREVIEW_DEV',PROTECTED='YES_PAULA_20260730_PROTECTED_DEV',FULL='YES_PAULA_20260731_FULL_PROFILE_DEV';
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v:[];
          const allDocs=async ref=>(await ref.get()).docs.map(d=>({id:d.id,...(d.data()||{})}));
          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:PROJECT});
          const auth=getAuth(),db=getFirestore(),tenant=db.collection('tenants').doc(tenantId);
          const [members,crosswalk]=await Promise.all([allDocs(tenant.collection('users')),allDocs(tenant.collection('shopperIdentityCrosswalk'))]);
          const fresh=JSON.parse(fs.readFileSync(path.join(OUT,'hr-fresh.json'),'utf8')),freshSnapshot=fresh?.snapshot||fresh?.data||fresh;
          const liveIds=new Set(arr(freshSnapshot?.shoppers).map(x=>str(x?.shopperId||x?.id)).filter(Boolean)),liveCanonical=new Set();
          for(const x of crosswalk){
            if(str(x?.sourceType).toLowerCase()!=='hr_external')continue;
            const projects=arr(x?.projectIds).map(str),singleProject=str(x?.projectId);
            if(singleProject&&singleProject!==projectId)continue;
            if(projects.length&&!projects.includes(projectId))continue;
            const tokens=[x?.id,x?.sourceStableKey,x?.sourceShopperId].map(str).filter(Boolean);
            if(tokens.some(t=>liveIds.has(t))&&str(x?.shopperId))liveCanonical.add(str(x.shopperId));
          }
          if(!liveCanonical.size)throw new Error('MAPPING_FAILURE:HUMAN_LANE_LIVE_CROSSWALK_EMPTY');
          let shopper=null;
          const candidates=members.filter(x=>x.active===true&&str(x.authNamespace)==='shopper'&&str(x.role)==='shopper'&&str(x.shopperId)&&liveCanonical.has(str(x.shopperId))&&(arr(x.projectIds).length===0||arr(x.projectIds).map(String).includes(projectId))).sort((a,b)=>str(a.shopperId).localeCompare(str(b.shopperId)));
          for(const m of candidates){try{await auth.getUser(m.id);shopper=m;break;}catch(e){if(str(e?.code)!=='auth/user-not-found')throw e;}}
          if(!shopper)throw new Error('AUTH_FAILURE:HUMAN_LANE_LIVE_SHOPPER_MISSING');
          const browser=await chromium.launch({headless:true});
          try{
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}}),page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(str(e?.message||e)));
            const url=`${HOSTING_URL}/index-backend-dev.html?cxBackendPreview=${PREVIEW}&cxProjectId=${encodeURIComponent(projectId)}&cxProtectedRuntime=${PROTECTED}&cxHumanFullVisual=${FULL}`;
            let authSettled=false,lastNetworkError=null;
            for(let attempt=1;attempt<=5&&!authSettled;attempt++){
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(()=>!!window.firebase?.auth&&Array.isArray(window.firebase?.apps)&&window.firebase.apps.length>0,null,{timeout:90000});
              const attemptToken=await auth.createCustomToken(shopper.id);
              try{
                await page.evaluate(async t=>{const fb=window.firebase;if(!fb?.auth)throw new Error('FIREBASE_SDK_NOT_READY');await fb.auth().setPersistence(fb.auth.Auth.Persistence.LOCAL);await fb.auth().signInWithCustomToken(t);},attemptToken);
              }catch(error){
                const msg=String(error&&error.message||error||'');
                if(!/Execution context was destroyed|navigation|FIREBASE_SDK_NOT_READY|app-compat\/no-app|No Firebase App|auth\/network-request-failed|network AuthError|timeout|interrupted connection|unreachable host/i.test(msg))throw error;
                lastNetworkError=error;
              }
              await page.waitForLoadState('domcontentloaded',{timeout:90000}).catch(()=>{});
              const persistedUid=await page.evaluate(()=>String(window.firebase?.auth?.().currentUser?.uid||'')).catch(()=> '');
              if(persistedUid===String(shopper.id)){authSettled=true;break;}
              if(attempt<5)await page.waitForTimeout(1500*attempt);
            }
            if(!authSettled)throw new Error('ENVIRONMENT_FAILURE:FIREBASE_AUTH_SESSION_NOT_PERSISTED:'+String(lastNetworkError&&lastNetworkError.message||lastNetworkError||'no-current-user'));
