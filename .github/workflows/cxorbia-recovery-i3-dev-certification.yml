          HOSTING_RELEASE_NAME="$(jq -r '.release.name // empty' "$VRM044_OUT/hosting-live-channel.json")"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$VRM044_OUT/hosting-live-channel.json")"
