          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$PROJECT" --non-interactive | tee "$GITHUB_WORKSPACE/$FOCAL_OUT/hosting-deploy.log"
          cd "$GITHUB_WORKSPACE"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$FOCAL_OUT/hosting-live-channel.json"
          HOSTING_RELEASE_NAME="$(jq -r '.release.name // empty' "$FOCAL_OUT/hosting-live-channel.json")"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$FOCAL_OUT/hosting-live-channel.json")"
          test -n "$HOSTING_VERSION_NAME"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/$HOSTING_VERSION_NAME" > "$FOCAL_OUT/hosting-version.json"
          test "$(jq -r '.status // empty' "$FOCAL_OUT/hosting-version.json")" = "FINALIZED"
          for p in core/data.js core/router.js core/tya-phase-a-source-safe-preview.js adapters/tya-live-source-inplace-apply.js adapters/tya-canonical-finance-read-model-v2.js adapters/tya-canonical-shopper-portal-v2.js adapters/tya-protected-auth-hr-authority-bridge-v2.js data/tya-hr-source-safe-periods.js modules/midia.js modules/misvisitas.js modules/visita-detalle.js modules/shoppers.js modules/postulaciones.js modules/beneficios.js modules/cert.js modules/academia.js styles/layout.css; do
            out="$FOCAL_OUT/remote-$(echo "$p" | tr '/' '_')"
            curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/$p?vrm154156=$GITHUB_RUN_ID-$(date +%s%N)" -o "$out"
            test "$(sha256sum "$out" | awk '{print $1}')" = "$(sha256sum "$SOURCE_DIR/app/$p" | awk '{print $1}')"
          done
          echo "HOSTING_RELEASE_NAME=$HOSTING_RELEASE_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_VERSION_NAME=$HOSTING_VERSION_NAME" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 8 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&vrm154156=$GITHUB_RUN_ID" > "$FOCAL_OUT/hr-meta.json"
          HR_REVISION="$(jq -r '.revision // empty' "$FOCAL_OUT/hr-meta.json")"
          [[ "$HR_REVISION" =~ ^[0-9a-f]{64}$ ]]
          jq -e '.ok==true and .revisionStable==true and .sourceSafe==true and .hrWrites==false and .production==false' "$FOCAL_OUT/hr-meta.json" >/dev/null
          curl -fsS --retry 8 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=json&vrm154156=$GITHUB_RUN_ID" > "$FOCAL_OUT/hr-live.json"
          jq -e '.sourceSafe==true and .production==false and (.projectConfig.scenarioDimensions|length)>=2' "$FOCAL_OUT/hr-live.json" >/dev/null
          jq -e '[.visits[]|select((.escenario//"")!="" and (.tipoCombo//"")!="")]|length>0' "$FOCAL_OUT/hr-live.json" >/dev/null
          echo "HR_REVISION=$HR_REVISION" >> "$GITHUB_ENV"
      - name: step
        run: |
          set -Eeuo pipefail
          DECISION="PASS_VRM154_156_EXACT_DEV_MATERIALIZATION"
          if [[ "$ACTIVE_STATUS" == "HOLD_V190_DEV_MATERIALIZATION_REQUIRED" ]]; then DECISION="PASS_V190_EXACT_DEV_MATERIALIZATION"; elif [[ "$ACTIVE_STATUS" == "HOLD_REJECTED_PHASEA_DEV_MATERIALIZATION_REQUIRED" ]]; then DECISION="PASS_REJECTED_PHASEA_EXACT_DEV_MATERIALIZATION"; elif [[ "$ACTIVE_STATUS" == "HOLD_VRM216_SHARED_IDEMPOTENCY_DEV_MATERIALIZATION_REQUIRED" ]]; then DECISION="PASS_VRM216_EXACT_DEV_MATERIALIZATION"; elif [[ "$ACTIVE_STATUS" == "HOLD_VRM217_219_DEV_MATERIALIZATION_REQUIRED" ]]; then DECISION="PASS_VRM217_219_EXACT_DEV_MATERIALIZATION"; elif [[ "$ACTIVE_STATUS" == "HOLD_HUMAN_VISUAL_CHECKPOINT_REQUIRED_BEFORE_FURTHER_PRODUCT_MUTATION" ]]; then DECISION="PASS_HUMAN_VISUAL_CHECKPOINT_EXACT_DEV_MATERIALIZATION"; fi
          jq -n -S --arg decision "$DECISION" --arg source "$FOCAL_SOURCE" --arg tree "$FOCAL_TREE" --arg runtime "$DEV_REVISION" --arg digest "$RUNTIME_DIGEST" --arg hosting "$HOSTING_VERSION_NAME" --arg hostingRelease "$HOSTING_RELEASE_NAME" --arg hr "$HR_REVISION" '{decision:$decision,sourceSha:$source,sourceTree:$tree,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,hostingRelease:$hostingRelease,hrRevision:$hr,builds:1,runtimeDeploys:1,hostingDeploys:1,storageRulesDeploys:0,scenarioDimensionsProven:true,production:false}' > "$FOCAL_OUT/result.json"
