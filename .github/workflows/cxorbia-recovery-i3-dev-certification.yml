          test "$C3_SOURCE" = "$EXPECTED_SOURCE"
          test "$C3_TREE" = "$EXPECTED_TREE"
          test "$(git rev-parse "$C3_SOURCE^{tree}")" = "$C3_TREE"
          test "$(jq -r '.status' "$CANDIDATE_DESCRIPTOR")" = "HOLD_MODULE_TRUTH_REPROOF_REQUIRED"
          LEDGER="$(jq -r '.findingsLedgerPath' "$CANDIDATE_DESCRIPTOR")"
          TEMPLATE="RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json" \
          LEDGER="$LEDGER" SOURCE="$C3_SOURCE" TREE="$C3_TREE" LAST_SERVED="$C3_SOURCE" \
          OUT_FILE="$C3_OUT/module-truth-preterminal.json" \
          node tools/qa/cxorbia-i3-c3-preterminal-module-truth.mjs | tee "$C3_OUT/console.log"
          test "$(jq -r '.preTerminalComposition.decision' "$C3_OUT/module-truth-preterminal.json")" = "PASS_C3_PRETERMINAL_COMPOSITION"
          test "$(jq '.modules|length' "$C3_OUT/module-truth-preterminal.json")" = "20"
          test "$(jq '.preTerminalComposition.matchModules|length' "$C3_OUT/module-truth-preterminal.json")" = "20"
          test "$(jq '.preTerminalComposition.composedNotDeployedModules|length' "$C3_OUT/module-truth-preterminal.json")" = "0"
          test "$(jq '.preTerminalComposition.pendingFileCount' "$C3_OUT/module-truth-preterminal.json")" = "0"
          test "$(jq '[.sourceFiles[]|select(.classification!="MATCH")]|length' "$C3_OUT/module-truth-preterminal.json")" = "0"
          test "$(jq -r '.entrypointClosure.allApprovedOwnersLoaded' "$C3_OUT/module-truth-preterminal.json")" = "true"
          test "$(jq '.entrypointClosure.duplicateSrc|length' "$C3_OUT/module-truth-preterminal.json")" = "0"
          test "$(git diff --name-only "$BACKEND_LINEAGE_SOURCE" "$C3_SOURCE" -- backend firestore.rules storage.rules | wc -l | tr -d ' ')" = "1"
          git diff --name-only "$BACKEND_LINEAGE_SOURCE" "$C3_SOURCE" -- backend firestore.rules storage.rules | grep -qx 'backend/runtime/hr-live-service/server.mjs'
          git archive "$C3_SOURCE" | tar -x -C "$RUNNER_TEMP"
          echo "C3_SOURCE_DIR=$RUNNER_TEMP/app" >> "$GITHUB_ENV"

