          const source=fs.readFileSync('app/core/backend-resources.js','utf8');
          for(const required of [
            "item.targetAll===true||arr(item.visibleRoles).map(str).includes(role())",
            "providerAck:true",
            "RESOURCE_STORAGE_NOT_AUTHORIZED",
            "lastIdempotencyKey"
