          const raw=snap.exists?(snap.data()||{}):{};
          const financeKeys=['countries','currency','currencies','honorario','honorarioRecibe','honRecibe','boleto','comboAmt','modelo'];
          const safePeriods=periodSnap.docs.map(d=>{const x=d.data()||{};return {
            id:d.id,key:x.key||x.periodKey||null,label:x.label||x.name||null,
