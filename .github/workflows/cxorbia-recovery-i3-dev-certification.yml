name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - tools/hr-source/tya-canonical-visit-state-r20.mjs
      - tools/hr-source/tya-reapply-canonical-state-r20.mjs
      - tools/hr-source/tya-canonical-visit-state-r20.test.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 449a447d20fc6db9b208b964242c1b37a6e10199
  PATCH_BASE_SHA: 93f8fb08c1ccec8970d2ff715d3a812e84632834
  LOCK_GATE18_SHA: 17a00b0383e1ad5d91188a6af731c834fb11371e
  LOCK_GATE18_RUN_ID: '34301633306'
  LOCK_GATE18_RUN_ATTEMPT: '2'
  LOCK_GATE19_SHA: e91b4fee2ca8383a992361189261633e3cd72eac
  LOCK_GATE19_RUN_ID: '34302638183'
  LOCK_GATE19_RUN_ATTEMPT: '2'
  LOCK_GATE19_ARTIFACT_ID: '10085471196'
  LOCK_GATE19_ARTIFACT_DIGEST: sha256:7f12d75c4a230018d1877371f99697e7915f7a1fe9f9a1fc8367975c0ba828bb
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  CLOUD_RUN_RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  PERIOD_KEY: 2026-09
  OUT: .tmp/recovery-i3-p0-validation

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Recovery QA head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact Recovery P0 semantic patch and prior gate lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git cat-file -e "$PATCH_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PATCH_BASE_SHA" "$PRODUCT_SOURCE_SHA"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD

          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend tools/hr-source firebase.json .firebaserc
          git diff --name-only "$PATCH_BASE_SHA" "$PRODUCT_SOURCE_SHA" -- app backend tools/hr-source firebase.json .firebaserc | sort > "$OUT/p0-product-delta.txt"
          printf '%s\n' \
            'tools/hr-source/tya-canonical-visit-state-r20.mjs' \
            'tools/hr-source/tya-canonical-visit-state-r20.test.mjs' \
            'tools/hr-source/tya-reapply-canonical-state-r20.mjs' \
            | sort > "$OUT/p0-expected-delta.txt"
          diff -u "$OUT/p0-expected-delta.txt" "$OUT/p0-product-delta.txt"

          node --check tools/hr-source/tya-canonical-visit-state-r20.mjs
          node --check tools/hr-source/tya-reapply-canonical-state-r20.mjs
          node --check tools/hr-source/tya-canonical-visit-state-r20.test.mjs
          node --check backend/runtime/cxorbia-project-command-provider-v1.mjs
          node --check backend/runtime/cxorbia-operational-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/server.mjs
          node --check backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          grep -Fq 'globalThis.CXORBIA_PROJECT_COMMAND_PROVIDER_POLICY=projectPolicy(snapshot)' backend/runtime/hr-live-service/server.mjs
          grep -Fq 'sameOpenReview' backend/runtime/cxorbia-operational-command-provider-v1.mjs
          grep -Fq 'reviewRequired:true,conflict:true' backend/runtime/cxorbia-operational-command-provider-v1.mjs
          if grep -Fq "throw new Error('OPS_VISIT_RECONCILIATION_CONFLICT_REVIEW_REQUIRED')" backend/runtime/cxorbia-operational-command-provider-v1.mjs; then
            echo '::error::P0-A still aborts reconciliation on durable review conflict'
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCK_GATE18_RUN_ID/attempts/$LOCK_GATE18_RUN_ATTEMPT" \
            > "$OUT/gate18-attempt.json"
          jq -e --arg sha "$LOCK_GATE18_SHA" --argjson run "$LOCK_GATE18_RUN_ID" --argjson attempt "$LOCK_GATE18_RUN_ATTEMPT" \
            '.id==$run and .run_attempt==$attempt and .head_sha==$sha and .status=="completed" and .conclusion=="success"' \
            "$OUT/gate18-attempt.json" >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCK_GATE19_RUN_ID/attempts/$LOCK_GATE19_RUN_ATTEMPT" \
            > "$OUT/gate19-attempt.json"
          jq -e --arg sha "$LOCK_GATE19_SHA" --argjson run "$LOCK_GATE19_RUN_ID" --argjson attempt "$LOCK_GATE19_RUN_ATTEMPT" \
            '.id==$run and .run_attempt==$attempt and .head_sha==$sha and .status=="completed" and .conclusion=="success"' \
            "$OUT/gate19-attempt.json" >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOCK_GATE19_ARTIFACT_ID" \
            > "$OUT/gate19-artifact.json"
          jq -e --argjson id "$LOCK_GATE19_ARTIFACT_ID" --argjson run "$LOCK_GATE19_RUN_ID" --arg digest "$LOCK_GATE19_ARTIFACT_DIGEST" \
            '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run' \
            "$OUT/gate19-artifact.json" >/dev/null

          jq -n -S \
            --arg productSourceSha "$PRODUCT_SOURCE_SHA" \
            --arg patchBaseSha "$PATCH_BASE_SHA" \
            --arg qaHeadSha "$GITHUB_SHA" \
            --arg gate18Sha "$LOCK_GATE18_SHA" \
            --argjson gate18Run "$LOCK_GATE18_RUN_ID" \
            --argjson gate18Attempt "$LOCK_GATE18_RUN_ATTEMPT" \
            --arg gate19Sha "$LOCK_GATE19_SHA" \
            --argjson gate19Run "$LOCK_GATE19_RUN_ID" \
            --argjson gate19Attempt "$LOCK_GATE19_RUN_ATTEMPT" \
            --argjson gate19Artifact "$LOCK_GATE19_ARTIFACT_ID" \
            --arg gate19Digest "$LOCK_GATE19_ARTIFACT_DIGEST" \
            '{decision:"PASS_I4_P0_SEMANTIC_PATCH_LINEAGE",productSourceSha:$productSourceSha,patchBaseSha:$patchBaseSha,qaHeadSha:$qaHeadSha,productDelta:["tools/hr-source/tya-canonical-visit-state-r20.mjs","tools/hr-source/tya-canonical-visit-state-r20.test.mjs","tools/hr-source/tya-reapply-canonical-state-r20.mjs"],priorGate18:{sha:$gate18Sha,runId:$gate18Run,attempt:$gate18Attempt,conclusion:"success"},priorGate19:{sha:$gate19Sha,runId:$gate19Run,attempt:$gate19Attempt,artifactId:$gate19Artifact,artifactDigest:$gate19Digest},freshGate18Required:true,freshGate19Required:true,production:false}' \
            > "$OUT/lineage.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focused DEV validation dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null

      - name: Execute runtime and Recovery P0 semantic tests
        run: |
          set -euo pipefail
          node --test backend/runtime/hr-live-service/test/*.test.mjs | tee "$OUT/runtime-tests.log"
          node --test tools/hr-source/tya-canonical-visit-state-r20.test.mjs | tee "$OUT/semantic-tests.log"

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Capture DEV runtime before deploy
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT/cloud-run-before.json"

      - name: Build exact Recovery P0 semantic source image for DEV
        run: |
          set -euo pipefail
          IMAGE_URI="gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:i4-p0-${PRODUCT_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$OUT/image-uri.txt"
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --config backend/runtime/hr-live-service/cloudbuild.yaml \
            --substitutions "_IMAGE=$IMAGE_URI" \
            --quiet

      - name: Deploy exact Recovery P0 semantic image to existing DEV runtime only
        run: |
          set -euo pipefail
          IMAGE_URI="$(cat "$OUT/image-uri.txt")"
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_URI" \
            --service-account "$CLOUD_RUN_RUNTIME_SA" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT/cloud-run-after.json"
          jq -e --arg image "$IMAGE_URI" '.spec.template.spec.containers[0].image==$image' "$OUT/cloud-run-after.json" >/dev/null

      - name: Validate P0-A with fresh authoritative HR reconcile and corrected KPIs
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "$OUT/hr-fresh.json" -w '%{http_code}' "$HOSTING_URL/api/tya/cinepolis/hr-live?format=json&fresh=1&ts=${GITHUB_RUN_ID}")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(`${process.env.OUT}/hr-fresh.json`,'utf8'));
          const rt=p?._runtime||{};
          const vr=rt.visitReconciliation||{};
          if(p?.sourceSafe!==true)throw new Error('P0A_SOURCE_NOT_SAFE');
          if(!String(rt.revision||''))throw new Error('P0A_SOURCE_REVISION_MISSING');
          if(rt.refreshError)throw new Error('P0A_REFRESH_ERROR:'+rt.refreshError);
          if(vr.ok!==true||vr.status!=='committed'||vr.providerAck!==true)throw new Error('P0A_VISIT_RECONCILIATION_NOT_COMMITTED');
          if(String(vr.sourceRevision||'')!==String(rt.revision||''))throw new Error('P0A_REVISION_READBACK_MISMATCH');
          if(Number(vr.reviewRequiredVisits||0)!==Number(vr.conflicts||0))throw new Error('P0A_REVIEW_CONFLICT_ACCOUNTING_MISMATCH');
          const periodKey=process.env.PERIOD_KEY;
          const period=(p.periodOperationalSummary||[]).find(x=>String(x?.periodKey||'')===periodKey);
          if(!period)throw new Error('P0A_CURRENT_PERIOD_SUMMARY_MISSING');
          const visits=(p.visits||[]).filter(v=>String(v?.periodKey||'')===periodKey);
          const pendingRealization=visits.filter(v=>v?.canonicalFacets?.pendingRealization===true||(v?.canonicalFacets?.pendingRealization==null&&v?.canonicalFacets?.scheduled===true&&v?.canonicalFacets?.realized!==true)).length;
          if(Number(period.available)!==Number(period.unassigned))throw new Error(`P0A_UNASSIGNED_NOT_AVAILABLE:${period.unassigned}:${period.available}`);
          if(Number(period.eligibilityBlocked||0)!==0)throw new Error(`P0A_UNASSIGNED_ELIGIBILITY_BLOCKED:${period.eligibilityBlocked}`);
          if(Number(period.scheduled)!==pendingRealization)throw new Error(`P0A_SCHEDULED_KPI_INCLUDES_REALIZED:${period.scheduled}:${pendingRealization}`);
          const out={decision:'PASS_I4_P0_HR_AVAILABILITY_AND_SCHEDULED_KPI',httpStatus:200,sourceRevision:rt.revision,periodKey,visitCount:Number(vr.visitCount||0),createdVisits:Number(vr.createdVisits||0),reviewRequiredVisits:Number(vr.reviewRequiredVisits||0),conflicts:Number(vr.conflicts||0),providerWrites:Number(vr.providerWrites||0),hrWrites:Number(vr.hrWrites||0),currentPeriod:{total:Number(period.total||0),assigned:Number(period.assigned||0),unassigned:Number(period.unassigned||0),available:Number(period.available||0),eligibilityBlocked:Number(period.eligibilityBlocked||0),scheduled:Number(period.scheduled||0),pendingRealization,realized:Number(period.realized||0),questionnaireCompleted:Number(period.questionnaireCompleted||0),submitted:Number(period.submitted||0),byCountry:period.byCountry||{}},refreshError:null,production:false};
          fs.writeFileSync(`${process.env.OUT}/p0a-result.json`,JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          NODE

      - name: Validate P0-B durable project.update ACK readback and replay
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { applicationDefault, getApps, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';

          const project=process.env.GCP_PROJECT_ID,tenantId=process.env.TENANT_ID,projectId=process.env.PROJECT_ID,periodId=process.env.PERIOD_ID;
          const hosting=String(process.env.HOSTING_URL).replace(/\/$/,'');
          const outDir=process.env.OUT;
          const normalizeName=value=>String(value||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
          const sameStrings=(left,right)=>JSON.stringify([...new Set((left||[]).map(String).filter(Boolean))].sort())===JSON.stringify([...new Set((right||[]).map(String).filter(Boolean))].sort());
          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:project});
          const auth=getAuth(),db=getFirestore();
          const memberDocs=(await db.collection('tenants').doc(tenantId).collection('users').get()).docs;
          let actor=null;
          for(const doc of memberDocs){
            const m=doc.data()||{};
            if(m.active!==true||String(m.authNamespace||'')!=='staff'||!['super','admin'].includes(String(m.role||'')))continue;
            if(String(m.role)!=='super'&&!Array.isArray(m.projectIds))continue;
            if(String(m.role)!=='super'&&!m.projectIds.map(String).includes(projectId))continue;
            try{
              const u=await auth.getUser(doc.id),c=u.customClaims||{};
              if(String(c.tenantId||'')===tenantId&&String(c.role||'')===String(m.role||'')&&String(c.authNamespace||'staff')==='staff'){actor={uid:doc.id,role:String(m.role)};break;}
            }catch{}
          }
          if(!actor)throw new Error('P0B_AUTHORIZED_ADMIN_WITH_CLAIMS_MISSING');

          const fresh=JSON.parse(fs.readFileSync(path.join(outDir,'hr-fresh.json'),'utf8'));
          const mapping=JSON.parse(fs.readFileSync('backend/contracts/tya-hr-column-map-r20-v1.json','utf8'));
          const sourceContractText=fs.readFileSync('app/data/tya-hr-source-safe-periods.js','utf8').replace(/^\uFEFF/,'');
          const sourceContractMatch=sourceContractText.match(/window\.CX_TYA_HR_SOURCE_SAFE\s*=\s*([\s\S]*?);\s*$/);
          if(!sourceContractMatch)throw new Error('P0B_SEALED_SOURCE_CONTRACT_PARSE_FAILED');
          const sourceContract=JSON.parse(sourceContractMatch[1]);
          const sourceRevision=String(fresh?._runtime?.revision||'').trim();
          const freshTenant=String(fresh?.tenantId||fresh?.tenantConfig?.tenantId||'').trim();
          const freshProject=String(fresh?.projectId||fresh?.projectConfig?.projectId||'').trim();
          const freshName=String(fresh?.projectName||fresh?.projectConfig?.projectName||'').trim();
          const freshCountries=Array.isArray(fresh?.projectConfig?.countries)?fresh.projectConfig.countries.map(String).filter(Boolean):[];
          const contractTenant=String(sourceContract?.tenantId||sourceContract?.tenantConfig?.tenantId||'').trim();
          const contractProject=String(sourceContract?.projectId||sourceContract?.projectConfig?.projectId||'').trim();
          const contractName=String(sourceContract?.projectName||sourceContract?.projectConfig?.projectName||'').trim();
          const contractCountries=Array.isArray(sourceContract?.projectConfig?.countries)?sourceContract.projectConfig.countries.map(String).filter(Boolean):[];
          const sourceId=String(sourceContract?.projectConfig?.hrSourceId||'').trim();
          const freshSourceType=String(fresh?.source?.type||'').trim();
          const contractSourceType=String(sourceContract?.source?.type||'').trim();
          if(fresh?.sourceSafe!==true||!sourceRevision)throw new Error('P0B_LIVE_HR_REVISION_INVALID');
          if(freshTenant&&freshTenant!==tenantId)throw new Error('P0B_LIVE_TENANT_CONFLICT');
          if(freshProject&&freshProject!==projectId)throw new Error('P0B_LIVE_PROJECT_CONFLICT');
          if(contractTenant!==tenantId||contractProject!==projectId||!contractName||!contractCountries.length||!sourceId)throw new Error('P0B_SEALED_SOURCE_CONTRACT_INVALID');
          if(freshName&&normalizeName(freshName)!==normalizeName(contractName))throw new Error('P0B_LIVE_PROJECT_NAME_CONFLICT');
          if(freshCountries.length&&!sameStrings(freshCountries,contractCountries))throw new Error('P0B_LIVE_COUNTRIES_CONFLICT');
          if(!/^google_sheets(?:_|$)/.test(freshSourceType||contractSourceType))throw new Error('P0B_AUTHORITATIVE_HR_PROVIDER_UNEXPECTED:'+(freshSourceType||contractSourceType));
          if(String(fresh?.source?.columnMapContract||mapping?.contractId||'')!==String(mapping?.contractId||''))throw new Error('P0B_LIVE_MAPPING_CONTRACT_CONFLICT');
          if(String(mapping?.contractId||'')!=='tya-hr-column-map-r20-v1'||String(mapping?.tenantId||'')!==tenantId||String(mapping?.projectId||'')!==projectId)throw new Error('P0B_CANONICAL_MAPPING_CONTRACT_INVALID');
          const authoritativeName=freshName||contractName;
          const authoritativeCountries=freshCountries.length?freshCountries:contractCountries;

          const canonicalSource={mode:'external',providerType:'google_sheets',readPolicy:'external_live',writePolicy:'external_read_only',providerRef:sourceId,mappingRef:String(mapping.contractId)};
          const sourceMatches=value=>Boolean(value)&&String(value.mode||'')===canonicalSource.mode&&String(value.providerType||'')===canonicalSource.providerType&&String(value.readPolicy||'')===canonicalSource.readPolicy&&String(value.writePolicy||'')===canonicalSource.writePolicy&&String(value.providerRef||'')===canonicalSource.providerRef&&String(value.mappingRef||'')===canonicalSource.mappingRef;
          const ref=db.collection('tenants').doc(tenantId).collection('projects').doc(projectId);
          const beforeSnap=await ref.get();
          if(!beforeSnap.exists)throw new Error('P0B_PROJECT_MISSING');
          const before=beforeSnap.data()||{};
          const rawSource=before.operationalSource||before.routeSource||{};
          const safeSource={mode:String(rawSource.mode||''),providerType:String(rawSource.providerType||''),readPolicy:String(rawSource.readPolicy||''),writePolicy:String(rawSource.writePolicy||'')};
          for(const k of ['providerBindingId','integrationSettingId','providerRef','mappingRef'])if(rawSource[k]!=null&&String(rawSource[k]).trim())safeSource[k]=String(rawSource[k]).trim();
          const countries=Array.isArray(before.countries)?before.countries.map(String).filter(Boolean):[];
          const name=String(before.name||'').trim();
          const version=Number(before.version||0);
          if(!sourceMatches(safeSource))throw new Error('P0B_DURABLE_SOURCE_NOT_CANONICAL');
          if(String(before.hrSourceId||'')!==sourceId)throw new Error('P0B_DURABLE_HR_SOURCE_ID_MISMATCH');
          if(normalizeName(before.normalizedName)!==normalizeName(name))throw new Error('P0B_DURABLE_NORMALIZED_NAME_MISSING');
          if(!name||!countries.length||!sameStrings(countries,authoritativeCountries))throw new Error('P0B_CURRENT_PROJECT_CONTRACT_INCOMPLETE');

          const idempotencyKey=`i4-p0-${process.env.PRODUCT_SOURCE_SHA.slice(0,12)}-${process.env.GITHUB_RUN_ID}`;
          const command={commandType:'project.update',tenantId,projectId,periodId,idempotencyKey,expectedVersion:version,payload:{name,countries,operationalSource:safeSource,version,status:before.status||'active',periodId}};
          const initResponse=await fetch(`${hosting}/__/firebase/init.json`,{headers:{'Cache-Control':'no-store'}});
          const initConfig=await initResponse.json().catch(()=>null);
          if(!initResponse.ok||!initConfig?.apiKey||String(initConfig.projectId||'')!==project)throw new Error('P0B_FIREBASE_HOSTING_CONFIG_INVALID');
          const customToken=await auth.createCustomToken(actor.uid);
          const exchangeResponse=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(initConfig.apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:customToken,returnSecureToken:true})});
          const exchangeBody=await exchangeResponse.json().catch(()=>null);
          if(!exchangeResponse.ok||!exchangeBody?.idToken)throw new Error('P0B_FIREBASE_CUSTOM_TOKEN_EXCHANGE_FAILED:'+String(exchangeBody?.error?.message||exchangeResponse.status));
          const idToken=String(exchangeBody.idToken);
          const tokenParts=idToken.split('.');
          if(tokenParts.length!==3)throw new Error('P0B_FIREBASE_ID_TOKEN_MALFORMED');
          const tokenClaims=JSON.parse(Buffer.from(tokenParts[1],'base64url').toString('utf8'));
          if(String(tokenClaims.user_id||tokenClaims.sub||'')!==actor.uid||String(tokenClaims.tenantId||'')!==tenantId||String(tokenClaims.role||'')!==actor.role||String(tokenClaims.authNamespace||'staff')!=='staff')throw new Error('P0B_FIREBASE_ID_TOKEN_CLAIMS_MISMATCH');
          const invoke=async()=>{const r=await fetch(`${hosting}/v1/cxorbia/commands`,{method:'POST',headers:{Authorization:`Bearer ${idToken}`,'Content-Type':'application/json','Idempotency-Key':command.idempotencyKey},body:JSON.stringify(command)});const body=await r.json().catch(()=>null);return {httpStatus:r.status,body};};

          const first=await invoke();
          if(first.httpStatus!==200||first.body?.ok!==true||first.body?.committed!==true||first.body?.providerAck!==true||first.body?.successUiAllowed!==true||Number(first.body?.providerWrites||0)<3||first.body?.idempotentReplay===true)throw new Error('P0B_FIRST_COMMIT_INVALID:'+JSON.stringify({httpStatus:first.httpStatus,code:first.body?.code,status:first.body?.status,providerWrites:first.body?.providerWrites}));
          const afterFirst=(await ref.get()).data()||{};
          if(Number(afterFirst.version)!==version+1)throw new Error('P0B_DURABLE_VERSION_NOT_INCREMENTED');
          if(String(afterFirst.updatedBy||'')!==actor.uid)throw new Error('P0B_DURABLE_ACTOR_READBACK_MISMATCH');
          if(String(afterFirst.name||'')!==name)throw new Error('P0B_DURABLE_NAME_DRIFT');
          if(!sourceMatches(afterFirst.operationalSource))throw new Error('P0B_DURABLE_SOURCE_DRIFT');

          const replay=await invoke();
          if(replay.httpStatus!==200||replay.body?.ok!==true||replay.body?.providerAck!==true||replay.body?.idempotentReplay!==true||Number(replay.body?.providerWrites??-1)!==0)throw new Error('P0B_REPLAY_NOT_IDEMPOTENT:'+JSON.stringify({httpStatus:replay.httpStatus,code:replay.body?.code,status:replay.body?.status,providerWrites:replay.body?.providerWrites,idempotentReplay:replay.body?.idempotentReplay}));
          const afterReplay=(await ref.get()).data()||{};
          if(Number(afterReplay.version)!==version+1)throw new Error('P0B_REPLAY_CHANGED_DURABLE_VERSION');
          if(!sourceMatches(afterReplay.operationalSource))throw new Error('P0B_REPLAY_CHANGED_DURABLE_SOURCE');

          const result={decision:'PASS_I4_P0B_PROJECT_UPDATE_DURABLE_ACK_REPLAY',tenantId,projectId,periodId,actorRole:actor.role,sourceRevision,providerRef:safeSource.providerRef,mappingRef:safeSource.mappingRef,beforeVersion:version,afterVersion:Number(afterFirst.version),firstHttpStatus:first.httpStatus,firstProviderAck:true,firstProviderWrites:Number(first.body.providerWrites),durableReadback:true,replayHttpStatus:replay.httpStatus,idempotentReplay:true,replayProviderWrites:0,authTransport:'firebase_custom_token_exchange',localStorageTruth:false,hrWrites:0,production:false,commandFingerprint:crypto.createHash('sha256').update(idempotencyKey).digest('hex').slice(0,20)};
          fs.writeFileSync(path.join(outDir,'p0b-result.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - name: Final Recovery P0 semantic validation verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const lineage=p('lineage.json'),a=p('p0a-result.json'),b=p('p0b-result.json'),run=p('cloud-run-after.json');
          if(lineage.decision!=='PASS_I4_P0_SEMANTIC_PATCH_LINEAGE')throw new Error('I4_P0_LINEAGE_INVALID');
          if(a.decision!=='PASS_I4_P0_HR_AVAILABILITY_AND_SCHEDULED_KPI'||a.httpStatus!==200||!a.sourceRevision||a.refreshError!==null)throw new Error('I4_P0A_NOT_VALIDATED');
          if(b.decision!=='PASS_I4_P0B_PROJECT_UPDATE_DURABLE_ACK_REPLAY'||b.firstProviderAck!==true||b.durableReadback!==true||b.idempotentReplay!==true||b.replayProviderWrites!==0)throw new Error('I4_P0B_NOT_VALIDATED');
          const revision=run?.status?.latestReadyRevisionName||null;
          const image=run?.spec?.template?.spec?.containers?.[0]?.image||null;
          if(!revision||!image)throw new Error('I4_P0_DEV_DEPLOY_IDENTITY_MISSING');
          const result={verdict:'PASS_I4_P0_SEMANTIC_FIX_DEV_VALIDATED',state:'P0_FIX_VALIDATED_REQUIRES_FRESH_GATE18_GATE19',productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,devRuntimeRevision:revision,devImage:image,p0a:a,p0b:b,priorGate18Locked:true,priorGate19Locked:true,freshGate18Required:true,freshGate19Required:true,hostingDeploys:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({verdict:result.verdict,productSourceSha:result.productSourceSha,devRuntimeRevision:revision,currentPeriod:a.currentPeriod,p0b:b.decision,freshGate18Required:true,freshGate19Required:true,production:false}));
          NODE

      - name: Upload sanitized Recovery P0 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-p0-validation-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
