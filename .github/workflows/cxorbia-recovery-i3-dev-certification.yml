          REV="$(jq -r '.status.latestReadyRevisionName // empty' "$V21_OUT/runtime.json")"
          test "$REV" = "$EXPECTED_RUNTIME_REVISION"
          gcloud run revisions describe "$REV" --project "$PROJECT" --region "$REGION" --format=json > "$V21_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$V21_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          test "$DIGEST" = "$EXPECTED_RUNTIME_DIGEST"
          TOKEN="$(gcloud auth print-access-token)"
