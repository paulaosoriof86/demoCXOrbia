name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
      - backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs
      - backend/runtime/hr-live-service/test/cxorbia-gate8-shopper-credential-enrollment.test.mjs
      - backend/runtime/hr-live-service/test/cxorbia-shopper-admin-repair.test.mjs
      - tools/qa/cxorbia-gate20-browser-visual-dev.mjs
      - tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 35c18ae52d96bdb6946dd3ffd3d58fcb512be71e
  P0_BASE_SHA: b6fa43814e7a25a7f233f9fcfad5f15fcd5cef41
  SHOPPER_RECURRENCE_RUN_ID: '34899285403'
  SHOPPER_RECURRENCE_HEAD_SHA: 056c040352c67e06aee6317af582ff0af4ca5b89
  LOCKED_GATE20_SOURCE_SHA: bd2a519db5ebd08f17d47827997056db795c8c09
  LOCKED_GATE20_RUN_ID: '34306578074'
  LOCKED_GATE20_RUN_ATTEMPT: '1'
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  LEGAL_ENABLE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED
  LEGAL_ENABLE_VALUE: 'true'
  LEGAL_GATE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE
  LEGAL_GATE_VALUE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME
  OUT: .tmp/recovery-i3-dev-certification

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Recovery control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen focal product source and control-only successor
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git cat-file -e "$P0_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          test "$(git rev-parse "$PRODUCT_SOURCE_SHA^")" = "$P0_BASE_SHA"
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          git diff --name-only "$P0_BASE_SHA" "$PRODUCT_SOURCE_SHA" -- app backend firebase.json .firebaserc tools/hr-source | sort > "$OUT/p0-product-delta.txt"
          printf '%s\n' 'backend/runtime/cxorbia-shopper-command-provider-v1.mjs' > "$OUT/p0-expected-delta.txt"
          diff -u "$OUT/p0-expected-delta.txt" "$OUT/p0-product-delta.txt"
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              .github/workflows/cxorbia-recovery-i3-shopper-membership-readonly-probe.yml|.github/workflows/cxorbia-recovery-i3-dev-certification.yml|backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs|backend/runtime/hr-live-service/test/cxorbia-gate8-shopper-credential-enrollment.test.mjs|backend/runtime/hr-live-service/test/cxorbia-shopper-admin-repair.test.mjs) ;;
              *) echo "Unexpected post-product delta: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD)
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs
          node --check tools/qa/cxorbia-gate20-browser-visual-dev.mjs
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" --arg base "$P0_BASE_SHA" --arg qa "$GITHUB_SHA" \
            '{decision:"PASS_I3_FROZEN_PRODUCT_GUARD",productSourceSha:$source,p0BaseSha:$base,qaHeadSha:$qa,productDelta:["backend/runtime/cxorbia-shopper-command-provider-v1.mjs"],qaHarnessDelta:["backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs","backend/runtime/hr-live-service/test/cxorbia-gate8-shopper-credential-enrollment.test.mjs","backend/runtime/hr-live-service/test/cxorbia-shopper-admin-repair.test.mjs"],productDrift:false,production:false}' > "$OUT/source-guard.json"

      - name: Bind shopper recurrence proof and approved Gate 20 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SHOPPER_RECURRENCE_RUN_ID" > "$OUT/shopper-recurrence-run.json"
          jq -e --arg sha "$SHOPPER_RECURRENCE_HEAD_SHA" \
            '.head_sha==$sha and .status=="completed" and .conclusion=="success" and .name=="CXOrbia Recovery I3 Shopper Auth Membership Recurrence Gate"' \
            "$OUT/shopper-recurrence-run.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCKED_GATE20_RUN_ID/attempts/$LOCKED_GATE20_RUN_ATTEMPT" > "$OUT/locked-gate20-run.json"
          jq -e --arg sha "$LOCKED_GATE20_SOURCE_SHA" --argjson attempt "$LOCKED_GATE20_RUN_ATTEMPT" \
            '.head_sha==$sha and .run_attempt==$attempt and .status=="completed" and .conclusion=="success"' "$OUT/locked-gate20-run.json" >/dev/null
          jq -n -S --argjson recurrence "$SHOPPER_RECURRENCE_RUN_ID" --arg recurrenceSha "$SHOPPER_RECURRENCE_HEAD_SHA" \
            --argjson gate20 "$LOCKED_GATE20_RUN_ID" --argjson attempt "$LOCKED_GATE20_RUN_ATTEMPT" --arg gate20Sha "$LOCKED_GATE20_SOURCE_SHA" \
            '{decision:"PASS_I3_LOCKED_EVIDENCE",shopperRecurrence:{runId:$recurrence,headSha:$recurrenceSha,conclusion:"success"},gate20:{runId:$gate20,attempt:$attempt,headSha:$gate20Sha,conclusion:"success"},production:false}' > "$OUT/locked-evidence.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focal DEV dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
          node --test backend/runtime/hr-live-service/test/*.test.mjs | tee "$OUT/runtime-tests.log"

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Build exact approved product source image
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::ENVIRONMENT_FAILURE exact-source-build line=$LINENO rc=$rc"; exit $rc' ERR
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-product-source"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          git archive "$PRODUCT_SOURCE_SHA" | tar -x -C "$SOURCE_DIR"
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:i3-shopper-${PRODUCT_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$OUT/source-image-uri.txt"
          gcloud builds submit "$SOURCE_DIR" \
            --project "$PROJECT" \
            --config "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml" \
            --substitutions "_IMAGE=$IMAGE_URI" \
            --quiet
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" --arg image "$IMAGE_URI" \
            '{decision:"PASS_I3_EXACT_SOURCE_IMAGE_BUILD",productSourceSha:$source,imageTag:$image,buildFromGitArchive:true,production:false}' > "$OUT/source-build.json"

      - name: Deploy exact source image to existing Recovery DEV runtime only
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::ENVIRONMENT_FAILURE exact-source-dev-deploy line=$LINENO rc=$rc"; exit $rc' ERR
          IMAGE_URI="$(cat "$OUT/source-image-uri.txt")"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-before-source-deploy.json"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-after-source-deploy.json"
          SOURCE_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-after-source-deploy.json")"
          CREATED_REVISION="$(jq -r '.status.latestCreatedRevisionName // empty' "$OUT/runtime-after-source-deploy.json")"
          test -n "$SOURCE_REVISION"; test "$SOURCE_REVISION" = "$CREATED_REVISION"
          gcloud run revisions describe "$SOURCE_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/source-runtime-revision.json"
          IMAGE_SPEC="$(jq -r '.spec.containers[0].image // empty' "$OUT/source-runtime-revision.json")"
          DIGEST_RAW="$(jq -r '.status.imageDigest // empty' "$OUT/source-runtime-revision.json")"
          if [[ "$DIGEST_RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$DIGEST_RAW"
          elif [[ "$DIGEST_RAW" == *@sha256:* ]]; then DIGEST="sha256:${DIGEST_RAW##*@sha256:}"
          elif [[ "$IMAGE_SPEC" == *@sha256:* ]]; then DIGEST="sha256:${IMAGE_SPEC##*@sha256:}"
          else echo 'Immutable source image digest unresolved' >&2; exit 1; fi
          IMAGE_REPO="${IMAGE_SPEC%@*}"; [[ "$IMAGE_REPO" != "$IMAGE_SPEC" ]] || IMAGE_REPO="${IMAGE_SPEC%:*}"
          IMMUTABLE_IMAGE="$IMAGE_REPO@$DIGEST"
          RUNTIME_URL="$(jq -r '.status.url // empty' "$OUT/runtime-after-source-deploy.json")"
          test -n "$RUNTIME_URL"
          curl -fsS --retry 10 --retry-delay 3 "$RUNTIME_URL/health" > "$OUT/health-after-source-deploy.json"
          jq -e '.ok==true and .production==false and .hrWrites==false and .shopperReconciliationReady==true and .visitReconciliationReady==true' "$OUT/health-after-source-deploy.json" >/dev/null
          {
            echo "SOURCE_RUNTIME_REVISION=$SOURCE_REVISION"
            echo "SOURCE_RUNTIME_DIGEST=$DIGEST"
            echo "SOURCE_IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE"
          } >> "$GITHUB_ENV"
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" --arg revision "$SOURCE_REVISION" --arg digest "$DIGEST" --arg image "$IMMUTABLE_IMAGE" \
            '{decision:"PASS_I3_EXACT_SOURCE_DEV_RUNTIME",productSourceSha:$source,devRuntimeRevision:$revision,runtimeDigest:$digest,immutableImage:$image,devDeploy:true,hostingDeploy:false,production:false}' > "$OUT/source-runtime-deploy.json"

      - name: Materialize legal human-acceptance gate as config-only DEV successor
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::ENVIRONMENT_FAILURE legal-gate-config-only line=$LINENO rc=$rc"; exit $rc' ERR
          CURRENT_REVISION="$SOURCE_RUNTIME_REVISION"
          CURRENT_DIGEST="$SOURCE_RUNTIME_DIGEST"
          IMMUTABLE_IMAGE="$SOURCE_IMMUTABLE_IMAGE"
          gcloud run revisions describe "$CURRENT_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/current-revision.json"
          CUR_ENABLE="$(jq -r --arg n "$LEGAL_ENABLE_NAME" '((.spec.containers[0].env // []) | map(select(.name==$n)) | .[0].value) // empty' "$RUNNER_TEMP/current-revision.json")"
          CUR_GATE="$(jq -r --arg n "$LEGAL_GATE_NAME" '((.spec.containers[0].env // []) | map(select(.name==$n)) | .[0].value) // empty' "$RUNNER_TEMP/current-revision.json")"
          CONFIG_UPDATED=0
          if [[ "$CUR_ENABLE" != "$LEGAL_ENABLE_VALUE" || "$CUR_GATE" != "$LEGAL_GATE_VALUE" ]]; then
            gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --image "$IMMUTABLE_IMAGE" \
              --update-env-vars "$LEGAL_ENABLE_NAME=$LEGAL_ENABLE_VALUE,$LEGAL_GATE_NAME=$LEGAL_GATE_VALUE" \
              --quiet
            CONFIG_UPDATED=1
          fi
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-final.json"
          FINAL_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-final.json")"
          CREATED_REVISION="$(jq -r '.status.latestCreatedRevisionName // empty' "$OUT/runtime-final.json")"
          test -n "$FINAL_REVISION"; test "$FINAL_REVISION" = "$CREATED_REVISION"
          gcloud run revisions describe "$FINAL_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-final-revision.json"
          FINAL_IMAGE="$(jq -r '.spec.containers[0].image // empty' "$OUT/runtime-final-revision.json")"
          FINAL_DIGEST_RAW="$(jq -r '.status.imageDigest // empty' "$OUT/runtime-final-revision.json")"
          if [[ "$FINAL_DIGEST_RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then FINAL_DIGEST="$FINAL_DIGEST_RAW"
          elif [[ "$FINAL_DIGEST_RAW" == *@sha256:* ]]; then FINAL_DIGEST="sha256:${FINAL_DIGEST_RAW##*@sha256:}"
          elif [[ "$FINAL_IMAGE" == *@sha256:* ]]; then FINAL_DIGEST="sha256:${FINAL_IMAGE##*@sha256:}"
          else echo 'Final runtime digest unresolved' >&2; exit 1; fi
          test "$FINAL_DIGEST" = "$CURRENT_DIGEST"
          AFTER_ENABLE="$(jq -r --arg n "$LEGAL_ENABLE_NAME" '((.spec.containers[0].env // []) | map(select(.name==$n)) | .[0].value) // empty' "$OUT/runtime-final-revision.json")"
          AFTER_GATE="$(jq -r --arg n "$LEGAL_GATE_NAME" '((.spec.containers[0].env // []) | map(select(.name==$n)) | .[0].value) // empty' "$OUT/runtime-final-revision.json")"
          test "$AFTER_ENABLE" = "$LEGAL_ENABLE_VALUE"
          test "$AFTER_GATE" = "$LEGAL_GATE_VALUE"
          RUNTIME_URL="$(jq -r '.status.url // empty' "$OUT/runtime-final.json")"
          curl -fsS --retry 10 --retry-delay 3 "$RUNTIME_URL/health" > "$OUT/health-final.json"
          jq -e '.ok==true and .production==false and .hrWrites==false and .shopperReconciliationReady==true and .visitReconciliationReady==true' "$OUT/health-final.json" >/dev/null
          {
            echo "DEV_REVISION=$FINAL_REVISION"
            echo "RUNTIME_DIGEST=$FINAL_DIGEST"
            echo "IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE"
            echo "CONFIG_UPDATED=$CONFIG_UPDATED"
          } >> "$GITHUB_ENV"
          jq -n -S --arg sourceRevision "$CURRENT_REVISION" --arg finalRevision "$FINAL_REVISION" --arg digest "$FINAL_DIGEST" --arg image "$IMMUTABLE_IMAGE" --argjson updated "$CONFIG_UPDATED" \
            '{decision:"PASS_I3_LEGAL_GATE_CONFIG_ONLY",sourceRuntimeRevision:$sourceRevision,finalRuntimeRevision:$finalRevision,imageDigest:$digest,immutableImage:$image,configRevisionCreated:($updated==1),rebuildAfterCertification:false,hostingDeploy:false,production:false}' > "$OUT/runtime-config-receipt.json"

      - name: Read fresh authoritative HR source on exact runtime
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "$OUT/hr-fresh.json" -w '%{http_code}' "$HOSTING_URL/api/tya/cinepolis/hr-live?format=json&fresh=1&i3=${GITHUB_RUN_ID}")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(`${process.env.OUT}/hr-fresh.json`,'utf8'));
          const s=p?.snapshot||p?.data||p,rt=p?._runtime||s?._runtime||{};
          if(s?.sourceSafe!==true||rt.refreshError)throw new Error('SOURCE_FAILURE:HR_FRESH_INVALID');
          fs.writeFileSync(`${process.env.OUT}/hr-readback.json`,JSON.stringify({decision:'PASS_I3_HR_EXACT_RUNTIME',sourceRevision:rt.revision||s.sourceRevision||null,sourceSafe:true,hrWrites:0,production:false},null,2)+'\n');
          NODE

      - name: Re-certify focal profile and finance persistence
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" HOSTING_URL="$HOSTING_URL" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" PERIOD_ID="$PERIOD_ID" SOURCE_SHA="$PRODUCT_SOURCE_SHA" node tools/qa/cxorbia-i3-profile-finance-persistence-dev.mjs | tee "$OUT/focal-persistence-console.log"
          test "$(jq -r '.decision' "$OUT/shopper-profile-persistence.json")" = 'SHOPPER_PROFILE_PERSISTENCE_PASS'
          test "$(jq -r '.decision' "$OUT/finance-bulk-payment-persistence.json")" = 'FINANCE_BULK_PAYMENT_PERSISTENCE_PASS'
          test "$(jq -r '.decision' "$OUT/synthetic-cleanup.json")" = 'PASS_I3_SYNTHETIC_CLEANUP'

      - name: Detect exact current human legal acceptance without writing
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {applicationDefault,initializeApp,getApps}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v:[];
          const roleApplicable=(role,roles)=>{const s=new Set(arr(roles).map(str).filter(Boolean));return s.size===0||s.has(role)};
          (async()=>{
            if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
            const tenant=getFirestore().collection('tenants').doc(process.env.TENANT_ID);
            const contents=(await tenant.collection('legalContents').get()).docs.map(d=>({id:d.id,...(d.data()||{})})).filter(c=>c.active!==false&&str(c.scopeMode||'tenant')==='tenant'&&str(c.currentVersion)&&/^[a-f0-9]{64}$/.test(str(c.currentDigest).toLowerCase())&&roleApplicable('shopper',c.roleApplicability));
            if(contents.length!==1)throw new Error(`AUTH_FAILURE:CURRENT_LEGAL_CONTENT_COUNT_${contents.length}`);
            const c=contents[0],receipts=(await tenant.collection('legalAcceptances').get()).docs.map(d=>({id:d.id,...(d.data()||{})}));
            const accepted=receipts.filter(r=>str(r.tenantId)===process.env.TENANT_ID&&str(r.scopeMode)==='tenant'&&str(r.role)==='shopper'&&str(r.authNamespace)==='shopper'&&str(r.legalContentId)===str(c.id)&&str(r.legalVersion)===str(c.currentVersion)&&str(r.contentDigest).toLowerCase()===str(c.currentDigest).toLowerCase()&&str(r.status)==='accepted'&&str(r.acceptanceMethod)==='human_ui'&&r.subjectExact===true&&Boolean(r.acceptedAt)&&str(r.actorUid));
            const ready=accepted.length>0;
            fs.writeFileSync(`${process.env.OUT}/legal-human-preflight.json`,JSON.stringify({decision:ready?'PASS_I3_CURRENT_HUMAN_LEGAL_ACCEPTANCE_PRESENT':'HOLD_I3_HUMAN_LEGAL_ACCEPTANCE_REQUIRED',legalContentId:str(c.id),legalVersion:str(c.currentVersion),acceptedReceiptCount:accepted.length,humanUiOnly:true,automaticAcceptance:false,legalAcceptanceBypass:false,providerWrites:0,hrWrites:0,production:false},null,2)+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,`HUMAN_LEGAL_ACCEPTANCE_READY=${ready?'true':'false'}\nCURRENT_LEGAL_VERSION=${str(c.currentVersion)}\n`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Record I3 HOLD awaiting unavoidable human legal acceptance
        if: env.HUMAN_LEGAL_ACCEPTANCE_READY != 'true'
        run: |
          set -euo pipefail
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" --arg revision "$DEV_REVISION" --arg digest "$RUNTIME_DIGEST" --arg version "$CURRENT_LEGAL_VERSION" --argjson recurrence "$SHOPPER_RECURRENCE_RUN_ID" \
            '{verdict:"HOLD_I3_HUMAN_LEGAL_ACCEPTANCE_REQUIRED",state:"HOLD",iteration:"I3",productSourceSha:$source,shopperRecurrenceRunId:$recurrence,devRuntimeRevision:$revision,runtimeDigest:$digest,currentLegalVersion:$version,exactSourceImageBuilt:true,devRuntimeDeployed:true,legalWriteGateReady:true,profilePersistence:true,financePersistence:true,hrFreshReadback:true,humanAcceptancePresent:false,automaticAcceptance:false,legalAcceptanceBypass:false,hostingDeploy:false,production:false}' > "$OUT/result.json"
          echo "HOLD_I3_HUMAN_LEGAL_ACCEPTANCE_REQUIRED legalVersion=$CURRENT_LEGAL_VERSION runtime=$DEV_REVISION"

      - name: Install browser dependency only when human receipt exists
        if: env.HUMAN_LEGAL_ACCEPTANCE_READY == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Prove current changed owners are served by Hosting DEV
        if: env.HUMAN_LEGAL_ACCEPTANCE_READY == 'true'
        run: |
          set -euo pipefail
          pairs=(
            'modules/shoppers.js app/modules/shoppers.js'
            'modules/finanzas.js app/modules/finanzas.js'
            'modules/operacion-extra.js app/modules/operacion-extra.js'
            'adapters/cxorbia-command-adapter-v1.js app/adapters/cxorbia-command-adapter-v1.js'
            'adapters/cxorbia-cxdata-command-boundary-v1.js app/adapters/cxorbia-cxdata-command-boundary-v1.js'
            'adapters/cxorbia-shopper-admin-command-contract-v1.js app/adapters/cxorbia-shopper-admin-command-contract-v1.js'
          )
          for pair in "${pairs[@]}"; do
            remote="${pair%% *}"; local="${pair#* }"; out="$OUT/remote-$(basename "$remote")"; expected="$(sha256sum "$local"|awk '{print $1}')"; matched=0
            for attempt in $(seq 1 12); do
              curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$HOSTING_URL/$remote?gate20=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$out"
              actual="$(sha256sum "$out"|awk '{print $1}')"; if [ "$actual" = "$expected" ]; then matched=1; break; fi; sleep 4
            done
            test "$matched" = 1
          done
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" '{decision:"PASS_GATE20_CHANGED_OWNER_PARITY",productSourceSha:$source,ownerCount:6,hostingDeploys:0,production:false}' > "$OUT/hosting.json"

      - name: Execute focal browser visual drift revalidation
        if: env.HUMAN_LEGAL_ACCEPTANCE_READY == 'true'
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$OUT" SOURCE_SHA="$PRODUCT_SOURCE_SHA" HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-gate20-browser-visual-dev.mjs | tee "$OUT/gate20-focal-console.log"
          test "$(jq -r '.decision' "$OUT/gate20-browser-visual.json")" = 'PASS_GATE20_FOCAL_VISUAL_DRIFT'

      - name: Final I3 functional plus visual closure verdict
        if: env.HUMAN_LEGAL_ACCEPTANCE_READY == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const guard=p('source-guard.json'),locked=p('locked-evidence.json'),sourceRuntime=p('source-runtime-deploy.json'),cfg=p('runtime-config-receipt.json'),hr=p('hr-readback.json'),profile=p('shopper-profile-persistence.json'),finance=p('finance-bulk-payment-persistence.json'),cleanup=p('synthetic-cleanup.json'),legal=p('legal-human-preflight.json'),hosting=p('hosting.json'),visual=p('gate20-browser-visual.json');
          if(guard.decision!=='PASS_I3_FROZEN_PRODUCT_GUARD'||locked.decision!=='PASS_I3_LOCKED_EVIDENCE'||sourceRuntime.decision!=='PASS_I3_EXACT_SOURCE_DEV_RUNTIME'||cfg.decision!=='PASS_I3_LEGAL_GATE_CONFIG_ONLY'||hr.decision!=='PASS_I3_HR_EXACT_RUNTIME'||profile.decision!=='SHOPPER_PROFILE_PERSISTENCE_PASS'||finance.decision!=='FINANCE_BULK_PAYMENT_PERSISTENCE_PASS'||cleanup.decision!=='PASS_I3_SYNTHETIC_CLEANUP'||legal.decision!=='PASS_I3_CURRENT_HUMAN_LEGAL_ACCEPTANCE_PRESENT'||hosting.decision!=='PASS_GATE20_CHANGED_OWNER_PARITY'||visual.decision!=='PASS_GATE20_FOCAL_VISUAL_DRIFT')throw new Error('I3_CURRENT_CANDIDATE_CLOSURE_INCOMPLETE');
          const result={verdict:'PASS_I3_CURRENT_CANDIDATE_FUNCTIONAL_VISUAL',state:'I3_READY_FOR_GATE21',iteration:'I3',productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,shopperRecurrenceRunId:Number(process.env.SHOPPER_RECURRENCE_RUN_ID),devRuntimeRevision:process.env.DEV_REVISION,runtimeDigest:process.env.RUNTIME_DIGEST,currentLegalVersion:process.env.CURRENT_LEGAL_VERSION,exactSourceImageBuilt:true,devRuntimeDeployed:true,legalWriteGateReady:true,humanAcceptancePresent:true,automaticAcceptance:false,legalAcceptanceBypass:false,profilePersistence:true,financePersistence:true,hrFreshReadback:true,gate20:'PASS',desktop:true,mobile:true,rebuildAfterCertification:false,hostingDeploy:false,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized I3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-dev-certification-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
