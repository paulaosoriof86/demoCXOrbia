            sourceKeys:Object.keys(raw).filter(k=>financeKeys.includes(k)).sort(),
            periods:safePeriods,
            writes:0,production:false
          };
          fs.writeFileSync('.tmp/vrm039-config/project-config.json',JSON.stringify(safe,null,2)+'\n');
