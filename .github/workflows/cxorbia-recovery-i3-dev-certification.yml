          test "$DIGEST" = "$EXPECTED_RUNTIME_DIGEST"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$V41_OUT/hosting-live-channel.json"
          test "$(jq -r '.release.version.name // empty' "$V41_OUT/hosting-live-channel.json")" = "$EXPECTED_HOSTING_VERSION"
      - name: Run second-review cumulative live reproof
        run: |
          set -Eeuo pipefail
          V41_OUT="$V41_OUT" V41_ROOT="$V41_ROOT" node tools/qa/cxorbia-i3-v41-second-review-live-reproof.mjs | tee "$V41_OUT/live.log"
          test "$(jq -r '.decision' "$V41_OUT/second-review-live-reproof.json")" = "PASS_I3_V41_SECOND_REVIEW_CUMULATIVE_REPROOF"
          test "$(jq -r '.durable.currentCount' "$V41_OUT/second-review-live-reproof.json")" = "44"
          test "$(jq -r '.durable.uniqueHrRows' "$V41_OUT/second-review-live-reproof.json")" = "44"
          test "$(jq -r '.shopper.after.historyCount' "$V41_OUT/second-review-live-reproof.json")" = "7"
          test "$(jq -r '.shopper.after.currentCount' "$V41_OUT/second-review-live-reproof.json")" = "0"
          test "$(jq -r '.admin.parity.mismatches | length' "$V41_OUT/second-review-live-reproof.json")" = "0"
      - name: Seal V41 receipt
        run: |
          jq -n -S --arg source "$V41_SOURCE" --arg tree "$V41_TREE" --arg hosting "$EXPECTED_HOSTING_VERSION" --arg runtime "$EXPECTED_RUNTIME_REVISION" --arg digest "$EXPECTED_RUNTIME_DIGEST" --arg hr "$(jq -r '.hrRevision' "$V41_OUT/second-review-live-reproof.json")" '{decision:"PASS_I3_V41_SECOND_REVIEW_CUMULATIVE_REPROOF",sourceSha:$source,sourceTree:$tree,hostingVersion:$hosting,runtimeRevision:$runtime,runtimeDigest:$digest,hrRevision:$hr,builds:0,deploys:0,production:false}' > "$V41_OUT/result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-v41-second-review-${{ github.run_id }}
          path: ${{ env.V41_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: always()
        run: rm -rf node_modules

