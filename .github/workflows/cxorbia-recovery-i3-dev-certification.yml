          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg human "$HUMAN_SHA" --arg probes "$PROBES_SHA" --arg routes "$ROUTE_SHA" '{decision:"PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY",gate:20,mode:"FULL_CANONICAL_SEMANTIC_ACCEPTANCE_DERIVED",sourceSha:$source,fullHumanAcceptanceSha256:$human,functionalProbesSha256:$probes,routeInventorySha256:$routes,expectedRoleRouteEntries:56,production:false}' > "$OUT/gate20-semantic-shopper.json"
          test "$(jq -r '.decision' "$OUT/gate20/gate20-browser-visual.json")" = "PASS_GATE20_FOCAL_VISUAL_DRIFT"
          test "$(jq -r '.decision' "$OUT/gate20-semantic-shopper.json")" = "PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY"

      - name: Package one certification artifact without rebuild
        run: |
          set -Eeuo pipefail
          test ! -e "$SOURCE_DIR/node_modules"
          tar -C "$SOURCE_DIR" -cf "$OUT/cxorbia-i3-certified-source.tar" .
          ARTIFACT_SHA256="$(sha256sum "$OUT/cxorbia-i3-certified-source.tar" | awk '{print $1}')"
          GATE20_SHA256="$(sha256sum "$OUT/gate20/gate20-browser-visual.json" | awk '{print $1}')"
          HUMAN_LANE_SHA256="$(sha256sum "$OUT/human-lane-authority-release.json" | awk '{print $1}')"
          CREDENTIAL_RULE_SHA256="$(sha256sum "$OUT/credential-rule-readback.json" | awk '{print $1}')"
          SEMANTIC_GATE20_SHA256="$(sha256sum "$OUT/gate20-semantic-shopper.json" | awk '{print $1}')"
          ATOMIC_P0_SHA256="$(sha256sum "$OUT/atomic-p0-source-contract.json" | awk '{print $1}')"
          CLIENT_MEMBERSHIP_SHA256="$(sha256sum "$OUT/client-membership/readback.json" | awk '{print $1}')"
          FULL_HUMAN_SHA256="$(sha256sum "$OUT/full-human-acceptance/human-live-acceptance.json" | awk '{print $1}')"
          FUNCTIONAL_PROBES_SHA256="$(sha256sum "$OUT/full-human-acceptance/i3-functional-probes.json" | awk '{print $1}')"
          ROUTE_INVENTORY_SHA256="$(sha256sum "$OUT/canonical-route-inventory.json" | awk '{print $1}')"
          echo "$ARTIFACT_SHA256  cxorbia-i3-certified-source.tar" > "$OUT/cxorbia-i3-certified-source.tar.sha256"
          jq -n -S \
            --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg tree "$I3_CERTIFICATION_SOURCE_TREE" --arg control "$GITHUB_SHA" \
            --arg revision "$DEV_REVISION" --arg digest "$RUNTIME_DIGEST" --arg image "$SOURCE_IMMUTABLE_IMAGE" \
            --arg artifact "$ARTIFACT_SHA256" --arg gate20Sha "$GATE20_SHA256" --arg humanLaneSha "$HUMAN_LANE_SHA256" --arg credentialRuleSha "$CREDENTIAL_RULE_SHA256" --arg semanticGate20Sha "$SEMANTIC_GATE20_SHA256" --arg atomicP0Sha "$ATOMIC_P0_SHA256" --arg clientMembershipSha "$CLIENT_MEMBERSHIP_SHA256" --arg fullHumanSha "$FULL_HUMAN_SHA256" --arg probesSha "$FUNCTIONAL_PROBES_SHA256" --arg routeInventorySha "$ROUTE_INVENTORY_SHA256" \
            --arg hostingRelease "$HOSTING_RELEASE_NAME" --arg hostingVersion "$HOSTING_VERSION_NAME" --arg hostingReleaseTime "$HOSTING_RELEASE_TIME" \
            --arg moduleTruthSha "$MODULE_TRUTH_MATRIX_SHA256" --slurpfile moduleTruth "$OUT/module-truth-matrix.json" \
            '{decision:"PASS_I3_ONE_ARTIFACT_READY_FOR_GATE21",i3CertificationSourceSha:$source,i3CertificationSourceTree:$tree,controlHeadSha:$control,buildCount:1,devRuntimeRevision:$revision,runtimeImageDigest:$digest,immutableRuntimeImage:$image,hostingReleaseName:$hostingRelease,hostingVersionName:$hostingVersion,hostingReleaseTime:$hostingReleaseTime,humanLane:{decision:"PASS_I3_HUMAN_LANE_AUTHORITY_RELEASE",evidenceSha256:$humanLaneSha,technicalMode:false},credentialRule:{decision:"PASS_I3_OWNER_SHOPPER_CREDENTIAL_RULE",version:"tya-shopper-nombre-apellido-v1",evidenceSha256:$credentialRuleSha,passwordLoginPassed:true},atomicP0:{decision:"PASS_I3_ATOMIC_P0_SOURCE_CONTRACT",evidenceSha256:$atomicP0Sha},clientMembership:{decision:"PASS_C6_CLIENT_AUTH_MEMBERSHIP_READBACK",evidenceSha256:$clientMembershipSha,authUserCreates:0,passwordChanges:0},fullHumanAcceptance:{decision:"PASS_I3_HUMAN_LIVE_ACCEPTANCE",evidenceSha256:$fullHumanSha,functionalProbesSha256:$probesSha,routeInventorySha256:$routeInventorySha,expectedRoleRouteEntries:56,beforeArtifact:true},gate20:{decision:"PASS_GATE20_FOCAL_VISUAL_DRIFT",sourceSha:$source,evidenceSha256:$gate20Sha},gate20Semantic:{decision:"PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY",sourceSha:$source,evidenceSha256:$semanticGate20Sha},moduleTruthEvidenceSha256:$moduleTruthSha,moduleTruth:$moduleTruth[0],artifactFile:"cxorbia-i3-certified-source.tar",artifactSha256:$artifact,rebuildAfterCertification:false,production:false}' \
            > "$OUT/i3-certification-manifest.json"
          cp "$OUT/i3-certification-manifest.json" "$OUT/result.json"

      - name: Upload one sanitized I3 certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-single-source-certification-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules

  gate21:
    name: Gate 21 integrity of same certification artifact
    needs: certify
    uses: ./.github/workflows/cxorbia-recovery-i3-gate21-artifact-fingerprint.yml
    secrets: inherit

