name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 53683d0e7bb62e90de3ca4b8063db9e85f5d40ee
  PRE_FIX_SHA: d8c7b2c27445d72e74653cb85fd7b288db122c9e
  P0_B_SHA: 3cf833dbca8028567cd26f59e214eb4fdb3445ee
  LOCK_GATE18_SHA: 17a00b0383e1ad5d91188a6af731c834fb11371e
  LOCK_GATE18_RUN_ID: '34301633306'
  LOCK_GATE18_RUN_ATTEMPT: '2'
  LOCK_GATE19_SHA: e91b4fee2ca8383a992361189261633e3cd72eac
  LOCK_GATE19_RUN_ID: '34302638183'
  LOCK_GATE19_RUN_ATTEMPT: '2'
  LOCK_GATE19_ARTIFACT_ID: '10085471196'
  LOCK_GATE19_ARTIFACT_DIGEST: sha256:7f12d75c4a230018d1877371f99697e7915f7a1fe9f9a1fc8367975c0ba828bb
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  CLOUD_RUN_RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  OUT: .tmp/recovery-i3-p0-validation

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Recovery QA head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact P0 source delta and immutable prior gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git cat-file -e "$PRE_FIX_SHA^{commit}"
          git cat-file -e "$P0_B_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          test "$(git rev-parse "$PRODUCT_SOURCE_SHA^")" = "$P0_B_SHA"
          test "$(git rev-parse "$P0_B_SHA^")" = "$PRE_FIX_SHA"

          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc
          git diff --name-only "$PRE_FIX_SHA" "$PRODUCT_SOURCE_SHA" -- app backend firebase.json .firebaserc | sort > "$OUT/p0-product-delta.txt"
          printf '%s\n' \
            'backend/runtime/cxorbia-operational-command-provider-v1.mjs' \
            'backend/runtime/hr-live-service/server.mjs' \
            | sort > "$OUT/p0-expected-delta.txt"
          diff -u "$OUT/p0-expected-delta.txt" "$OUT/p0-product-delta.txt"

          node --check backend/runtime/cxorbia-project-command-provider-v1.mjs
          node --check backend/runtime/cxorbia-operational-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/server.mjs
          node --check backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          grep -Fq 'globalThis.CXORBIA_PROJECT_COMMAND_PROVIDER_POLICY=projectPolicy(snapshot)' backend/runtime/hr-live-service/server.mjs
          grep -Fq 'sameOpenReview' backend/runtime/cxorbia-operational-command-provider-v1.mjs
          grep -Fq 'reviewRequired:true,conflict:true' backend/runtime/cxorbia-operational-command-provider-v1.mjs
          if grep -Fq "throw new Error('OPS_VISIT_RECONCILIATION_CONFLICT_REVIEW_REQUIRED')" backend/runtime/cxorbia-operational-command-provider-v1.mjs; then
            echo '::error::P0-A still aborts reconciliation on durable review conflict'
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCK_GATE18_RUN_ID/attempts/$LOCK_GATE18_RUN_ATTEMPT" \
            > "$OUT/gate18-attempt.json"
          jq -e --arg sha "$LOCK_GATE18_SHA" --argjson run "$LOCK_GATE18_RUN_ID" --argjson attempt "$LOCK_GATE18_RUN_ATTEMPT" \
            '.id==$run and .run_attempt==$attempt and .head_sha==$sha and .status=="completed" and .conclusion=="success"' \
            "$OUT/gate18-attempt.json" >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCK_GATE19_RUN_ID/attempts/$LOCK_GATE19_RUN_ATTEMPT" \
            > "$OUT/gate19-attempt.json"
          jq -e --arg sha "$LOCK_GATE19_SHA" --argjson run "$LOCK_GATE19_RUN_ID" --argjson attempt "$LOCK_GATE19_RUN_ATTEMPT" \
            '.id==$run and .run_attempt==$attempt and .head_sha==$sha and .status=="completed" and .conclusion=="success"' \
            "$OUT/gate19-attempt.json" >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOCK_GATE19_ARTIFACT_ID" \
            > "$OUT/gate19-artifact.json"
          jq -e --argjson id "$LOCK_GATE19_ARTIFACT_ID" --argjson run "$LOCK_GATE19_RUN_ID" --arg digest "$LOCK_GATE19_ARTIFACT_DIGEST" \
            '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run' \
            "$OUT/gate19-artifact.json" >/dev/null

          jq -n -S \
            --arg productSourceSha "$PRODUCT_SOURCE_SHA" \
            --arg preFixSha "$PRE_FIX_SHA" \
            --arg p0bSha "$P0_B_SHA" \
            --arg qaHeadSha "$GITHUB_SHA" \
            --arg gate18Sha "$LOCK_GATE18_SHA" \
            --argjson gate18Run "$LOCK_GATE18_RUN_ID" \
            --argjson gate18Attempt "$LOCK_GATE18_RUN_ATTEMPT" \
            --arg gate19Sha "$LOCK_GATE19_SHA" \
            --argjson gate19Run "$LOCK_GATE19_RUN_ID" \
            --argjson gate19Attempt "$LOCK_GATE19_RUN_ATTEMPT" \
            --argjson gate19Artifact "$LOCK_GATE19_ARTIFACT_ID" \
            --arg gate19Digest "$LOCK_GATE19_ARTIFACT_DIGEST" \
            '{decision:"PASS_I3_P0_SOURCE_AND_LINEAGE_GUARD",productSourceSha:$productSourceSha,preFixSha:$preFixSha,p0bSha:$p0bSha,qaHeadSha:$qaHeadSha,productDelta:["backend/runtime/cxorbia-operational-command-provider-v1.mjs","backend/runtime/hr-live-service/server.mjs"],gate18:{sha:$gate18Sha,runId:$gate18Run,attempt:$gate18Attempt,conclusion:"success"},gate19:{sha:$gate19Sha,runId:$gate19Run,attempt:$gate19Attempt,artifactId:$gate19Artifact,artifactDigest:$gate19Digest},production:false}' \
            > "$OUT/lineage.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focused DEV validation dependencies
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Execute existing runtime tests
        run: |
          set -euo pipefail
          node --test backend/runtime/hr-live-service/test/*.test.mjs | tee "$OUT/runtime-tests.log"

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Capture DEV runtime before deploy
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT/cloud-run-before.json"

      - name: Build exact P0 source image for DEV
        run: |
          set -euo pipefail
          IMAGE_URI="gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:i3-p0-${PRODUCT_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$OUT/image-uri.txt"
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --config backend/runtime/hr-live-service/cloudbuild.yaml \
            --substitutions "_IMAGE=$IMAGE_URI" \
            --quiet

      - name: Deploy exact P0 image to existing Recovery DEV runtime only
        run: |
          set -euo pipefail
          IMAGE_URI="$(cat "$OUT/image-uri.txt")"
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_URI" \
            --service-account "$CLOUD_RUN_RUNTIME_SA" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT/cloud-run-after.json"
          jq -e --arg image "$IMAGE_URI" '.spec.template.spec.containers[0].image==$image' "$OUT/cloud-run-after.json" >/dev/null

      - name: Validate P0-A with fresh authoritative HR reconcile
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "$OUT/hr-fresh.json" -w '%{http_code}' "$HOSTING_URL/api/tya/cinepolis/hr-live?format=json&fresh=1&ts=${GITHUB_RUN_ID}")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(`${process.env.OUT}/hr-fresh.json`,'utf8'));
          const rt=p?._runtime||{};
          const vr=rt.visitReconciliation||{};
          if(p?.sourceSafe!==true)throw new Error('P0A_SOURCE_NOT_SAFE');
          if(!String(rt.revision||''))throw new Error('P0A_SOURCE_REVISION_MISSING');
          if(rt.refreshError)throw new Error('P0A_REFRESH_ERROR:'+rt.refreshError);
          if(vr.ok!==true||vr.status!=='committed'||vr.providerAck!==true)throw new Error('P0A_VISIT_RECONCILIATION_NOT_COMMITTED');
          if(String(vr.sourceRevision||'')!==String(rt.revision||''))throw new Error('P0A_REVISION_READBACK_MISMATCH');
          if(Number(vr.reviewRequiredVisits||0)!==Number(vr.conflicts||0))throw new Error('P0A_REVIEW_CONFLICT_ACCOUNTING_MISMATCH');
          const out={decision:'PASS_I3_P0A_HR_CONFLICT_DURABLE_NO_ABORT',httpStatus:200,sourceRevision:rt.revision,visitCount:Number(vr.visitCount||0),createdVisits:Number(vr.createdVisits||0),reviewRequiredVisits:Number(vr.reviewRequiredVisits||0),conflicts:Number(vr.conflicts||0),providerWrites:Number(vr.providerWrites||0),hrWrites:Number(vr.hrWrites||0),refreshError:null,production:false};
          fs.writeFileSync(`${process.env.OUT}/p0a-result.json`,JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          NODE

      - name: Validate P0-B durable project.update ACK readback and replay
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { applicationDefault, getApps, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          import { chromium } from 'playwright';

          const project=process.env.GCP_PROJECT_ID,tenantId=process.env.TENANT_ID,projectId=process.env.PROJECT_ID,periodId=process.env.PERIOD_ID;
          const hosting=String(process.env.HOSTING_URL).replace(/\/$/,'');
          const outDir=process.env.OUT;
          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:project});
          const auth=getAuth(),db=getFirestore();
          const memberDocs=(await db.collection('tenants').doc(tenantId).collection('users').get()).docs;
          let actor=null;
          for(const doc of memberDocs){
            const m=doc.data()||{};
            if(m.active!==true||String(m.authNamespace||'')!=='staff'||!['super','admin'].includes(String(m.role||'')))continue;
            if(String(m.role)!=='super'&&!Array.isArray(m.projectIds))continue;
            if(String(m.role)!=='super'&&!m.projectIds.map(String).includes(projectId))continue;
            try{
              const u=await auth.getUser(doc.id),c=u.customClaims||{};
              if(String(c.tenantId||'')===tenantId&&String(c.role||'')===String(m.role||'')&&String(c.authNamespace||'staff')==='staff'){actor={uid:doc.id,role:String(m.role)};break;}
            }catch{}
          }
          if(!actor)throw new Error('P0B_AUTHORIZED_ADMIN_WITH_CLAIMS_MISSING');

          const ref=db.collection('tenants').doc(tenantId).collection('projects').doc(projectId);
          const beforeSnap=await ref.get();
          if(!beforeSnap.exists)throw new Error('P0B_PROJECT_MISSING');
          const before=beforeSnap.data()||{};
          const rawSource=before.operationalSource||before.routeSource||{};
          const safeSource={
            mode:String(rawSource.mode||''),
            providerType:String(rawSource.providerType||''),
            readPolicy:String(rawSource.readPolicy||''),
            writePolicy:String(rawSource.writePolicy||'')
          };
          for(const k of ['providerBindingId','integrationSettingId','providerRef','mappingRef'])if(rawSource[k]!=null&&String(rawSource[k]).trim())safeSource[k]=String(rawSource[k]).trim();
          const countries=Array.isArray(before.countries)?before.countries.map(String).filter(Boolean):[];
          const name=String(before.name||'').trim();
          const version=Number(before.version||0);

          const allowedValueKeys=new Set(['mode','type','providerType','readPolicy','writePolicy','providerBindingId','integrationSettingId','providerRef','mappingRef','hrSourceType','questionnaireSource','sourceType','status','version','id','projectId','tenantId','periodId','routeSource','name','normalizedName']);
          const sanitize=(value,key='')=>{
            if(Array.isArray(value))return key==='countries'?value.map(v=>String(v)): {type:'array',length:value.length};
            if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,sanitize(value[k],k)]));
            if(allowedValueKeys.has(key))return value==null?null:String(value);
            return {type:value===null?'null':typeof value};
          };
          const diagnostic={decision:'DIAG_I3_P0B_DURABLE_PROJECT_SHAPE',tenantId,projectId,periodId,projectKeys:Object.keys(before).sort(),projectShape:sanitize(before),rawSourceShape:sanitize(rawSource),safeSource,countries,namePresent:Boolean(name),version,production:false};
          fs.writeFileSync(path.join(outDir,'p0b-config-diagnostic.json'),JSON.stringify(diagnostic,null,2)+'\n');
          console.log(JSON.stringify(diagnostic));

          if(!name||!countries.length||!safeSource.mode||!safeSource.providerType||!safeSource.readPolicy||!safeSource.writePolicy)throw new Error('P0B_CURRENT_PROJECT_CONTRACT_INCOMPLETE');

          const idempotencyKey=`i3-p0b-${process.env.PRODUCT_SOURCE_SHA.slice(0,12)}-${process.env.GITHUB_RUN_ID}`;
          const command={
            commandType:'project.update',tenantId,projectId,periodId,idempotencyKey,expectedVersion:version,
            payload:{name,countries,operationalSource:safeSource,version,status:before.status||'active',periodId}
          };
          const customToken=await auth.createCustomToken(actor.uid);
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1280,height:800}});
          const page=await ctx.newPage();
          try{
            await page.goto(`${hosting}/index-backend-dev.html?cxProjectId=${encodeURIComponent(projectId)}`,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>Boolean(window.firebase&&window.firebase.auth),{timeout:60000});
            const signed=await page.evaluate(async t=>{const r=await firebase.auth().signInWithCustomToken(t);return Boolean(r?.user);},customToken);
            if(!signed)throw new Error('P0B_FIREBASE_SIGNIN_FAILED');
            const invoke=async()=>page.evaluate(async cmd=>{
              const token=await firebase.auth().currentUser.getIdToken(true);
              const r=await fetch('/v1/cxorbia/commands',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json','Idempotency-Key':cmd.idempotencyKey},body:JSON.stringify(cmd)});
              const body=await r.json().catch(()=>null);
              return {httpStatus:r.status,body};
            },command);

            const first=await invoke();
            if(first.httpStatus!==200||first.body?.ok!==true||first.body?.committed!==true||first.body?.providerAck!==true||first.body?.successUiAllowed!==true||Number(first.body?.providerWrites||0)<3||first.body?.idempotentReplay===true)throw new Error('P0B_FIRST_COMMIT_INVALID:'+JSON.stringify({httpStatus:first.httpStatus,code:first.body?.code,status:first.body?.status,providerWrites:first.body?.providerWrites}));
            const afterFirst=(await ref.get()).data()||{};
            if(Number(afterFirst.version)!==version+1)throw new Error('P0B_DURABLE_VERSION_NOT_INCREMENTED');
            if(String(afterFirst.updatedBy||'')!==actor.uid)throw new Error('P0B_DURABLE_ACTOR_READBACK_MISMATCH');
            if(String(afterFirst.name||'')!==name)throw new Error('P0B_DURABLE_NAME_DRIFT');

            const replay=await invoke();
            if(replay.httpStatus!==200||replay.body?.ok!==true||replay.body?.providerAck!==true||replay.body?.idempotentReplay!==true||Number(replay.body?.providerWrites||-1)!==0)throw new Error('P0B_REPLAY_NOT_IDEMPOTENT:'+JSON.stringify({httpStatus:replay.httpStatus,code:replay.body?.code,status:replay.body?.status,providerWrites:replay.body?.providerWrites,idempotentReplay:replay.body?.idempotentReplay}));
            const afterReplay=(await ref.get()).data()||{};
            if(Number(afterReplay.version)!==version+1)throw new Error('P0B_REPLAY_CHANGED_DURABLE_VERSION');

            const result={decision:'PASS_I3_P0B_PROJECT_UPDATE_DURABLE_ACK_REPLAY',tenantId,projectId,periodId,actorRole:actor.role,beforeVersion:version,afterVersion:Number(afterFirst.version),firstHttpStatus:first.httpStatus,firstProviderAck:true,firstProviderWrites:Number(first.body.providerWrites),durableReadback:true,replayHttpStatus:replay.httpStatus,idempotentReplay:true,replayProviderWrites:0,localStorageTruth:false,hrWrites:0,production:false,commandFingerprint:crypto.createHash('sha256').update(idempotencyKey).digest('hex').slice(0,20)};
            fs.writeFileSync(path.join(outDir,'p0b-result.json'),JSON.stringify(result,null,2)+'\n');
            console.log(JSON.stringify(result));
          } finally {
            await ctx.close();
            await browser.close();
          }
          NODE

      - name: Final I3 P0 validation verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const lineage=p('lineage.json'),a=p('p0a-result.json'),b=p('p0b-result.json'),run=p('cloud-run-after.json');
          if(lineage.decision!=='PASS_I3_P0_SOURCE_AND_LINEAGE_GUARD')throw new Error('I3_P0_LINEAGE_INVALID');
          if(a.decision!=='PASS_I3_P0A_HR_CONFLICT_DURABLE_NO_ABORT'||a.httpStatus!==200||!a.sourceRevision||a.refreshError!==null)throw new Error('I3_P0A_NOT_CERTIFIED');
          if(b.decision!=='PASS_I3_P0B_PROJECT_UPDATE_DURABLE_ACK_REPLAY'||b.firstProviderAck!==true||b.durableReadback!==true||b.idempotentReplay!==true||b.replayProviderWrites!==0)throw new Error('I3_P0B_NOT_CERTIFIED');
          const revision=run?.status?.latestReadyRevisionName||null;
          const image=run?.spec?.template?.spec?.containers?.[0]?.image||null;
          if(!revision||!image)throw new Error('I3_P0_DEV_DEPLOY_IDENTITY_MISSING');
          const result={verdict:'PASS_I3_P0_FIXES_DEV_VALIDATED',state:'FIX_VALIDATED',productSourceSha:process.env.PRODUCT_SOURCE_SHA,qaHeadSha:process.env.GITHUB_SHA,devRuntimeRevision:revision,devImage:image,p0a:a,p0b:b,gate18Locked:true,gate19Locked:true,hostingDeploys:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({verdict:result.verdict,productSourceSha:result.productSourceSha,devRuntimeRevision:revision,p0a:a.decision,p0b:b.decision,production:false}));
          NODE

      - name: Upload sanitized I3 P0 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-p0-validation-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary dependencies
        if: always()
        run: rm -rf node_modules
