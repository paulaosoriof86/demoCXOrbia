          test "$(jq -r '.terminalClosure.decision' "$T/out.json")" = "PASS_C3_TERMINAL_MODULE_TRUTH_20_20"
          test "$(jq '.terminalClosure.ownerSpecificReceipts|length' "$T/out.json")" = "0"
