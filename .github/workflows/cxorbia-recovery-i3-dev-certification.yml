name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: 31c66c49d18aaeb4a85c33dca15b8c137d60f6bd
  SOURCE_TREE: 7445eb6a3c2ad7c6fb2ff4b400ff8ff8bd1bfdd2
  SOURCE_PARENT_SHA: bb9c3cb73860673e87b001e6b2ad1728acf2286e
  WF: .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-gate8-auth-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact functional source and workflow-only transport
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "$SOURCE_SHA^")" = "$SOURCE_PARENT_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WF"
          printf '{"sourceSha":"%s","sourceTree":"%s","transportSha":"%s","gate6":"PASS_LOCKED","gate7":"PASS_LOCKED","gate8":"AUTH_BOUNDARY_DIAGNOSTIC_READONLY","production":false}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_SHA" > "$OUT/authorization.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT }}'

      - name: Prove DEV source unchanged without redeploy
        run: |
          set -euo pipefail
          current_sa="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          rev="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" "https://run.googleapis.com/v2/projects/$PROJECT/locations/$REGION/services/$SERVICE" > "$OUT/cloud-run-v2.json"
          CURRENT_SA="$current_sa" REV="$rev" node <<'NODE'
          const fs=require('fs');
          const v2=JSON.parse(fs.readFileSync(process.env.OUT+'/cloud-run-v2.json','utf8'));
          const env=Object.fromEntries((v2.template?.containers?.[0]?.env||[]).map(x=>[String(x.name||''),String(x.value||'')]));
          const actual=env.CXORBIA_RECOVERY_SOURCE_SHA||'';
          const result={decision:actual===process.env.SOURCE_SHA&&process.env.CURRENT_SA===process.env.RUNTIME_SA?'PASS_GATE8_DEV_SOURCE_UNCHANGED':'RELEASE_COMPOSITION_FAILURE_GATE8_DEV_DRIFT',sourceSha:process.env.SOURCE_SHA,deployedSourceSha:actual,revision:process.env.REV,runtimeServiceAccount:process.env.CURRENT_SA,redeploy:false,production:false};
          fs.writeFileSync(process.env.OUT+'/dev-source.json',JSON.stringify(result,null,2)+'\n');
          if(result.decision!=='PASS_GATE8_DEV_SOURCE_UNCHANGED')process.exit(1);
          NODE

      - name: Install read-only Firebase Admin dependency
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null

      - name: Diagnose Shopper Auth claims profile and protected-history boundary
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {applicationDefault,getApps,initializeApp} from 'firebase-admin/app';
          import {getAuth} from 'firebase-admin/auth';
          import {getFirestore} from 'firebase-admin/firestore';
          if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const auth=getAuth(),db=getFirestore();
          const tenantId='tya',projectId='cinepolis';
          const list=v=>Array.isArray(v)?v.map(String):(typeof v==='string'?v.split(',').map(x=>x.trim()).filter(Boolean):[]);
          const all=[];let token;
          do{const page=await auth.listUsers(1000,token);all.push(...page.users);token=page.pageToken;}while(token);
          const shopperSnap=await db.collection('tenants').doc(tenantId).collection('shoppers').get();
          const shopperIds=new Set(shopperSnap.docs.map(d=>d.id));
          const visitSnap=await db.collection('tenants').doc(tenantId).collection('projects').doc(projectId).collection('visits').get();
          const visitShopperIds=new Set(visitSnap.docs.map(d=>String(d.data()?.shopperId||'').trim()).filter(Boolean));
          const c={totalAuthUsers:all.length,roleShopper:0,namespaceShopper:0,tenantTya:0,projectCinepolis:0,shopperIdPresent:0,fullShopperClaims:0,fullClaimsWithProfile:0,fullClaimsWithProtectedHistory:0,fullClaimsProfileAndHistory:0,disabledFullClaims:0,shopperProfiles:shopperIds.size,protectedVisits:visitSnap.size,protectedVisitShopperIds:visitShopperIds.size};
          for(const u of all){
            const cl=u.customClaims||{};const role=String(cl.role||'').toLowerCase();const ns=String(cl.authNamespace||'').toLowerCase();const sid=String(cl.shopperId||'').trim();
            const roleOk=role==='shopper';const nsOk=(ns||(roleOk?'shopper':'staff'))==='shopper';const tenantOk=cl.tenantId===tenantId||list(cl.tenants).includes(tenantId);const projectOk=cl.projectId===projectId||list(cl.projectIds).includes(projectId);const sidOk=!!sid;
            if(roleOk)c.roleShopper++;if(nsOk&&roleOk)c.namespaceShopper++;if(tenantOk&&roleOk)c.tenantTya++;if(projectOk&&roleOk)c.projectCinepolis++;if(sidOk&&roleOk)c.shopperIdPresent++;
            const full=roleOk&&nsOk&&tenantOk&&projectOk&&sidOk;
            if(full){c.fullShopperClaims++;const profile=shopperIds.has(sid),history=visitShopperIds.has(sid);if(profile)c.fullClaimsWithProfile++;if(history)c.fullClaimsWithProtectedHistory++;if(profile&&history)c.fullClaimsProfileAndHistory++;if(u.disabled)c.disabledFullClaims++;}
          }
          let classification='PASS',decision='PASS_GATE8_AUTH_BOUNDARY_EXISTS';
          if(c.fullShopperClaims===0){classification='AUTH_FAILURE';decision='AUTH_FAILURE_GATE8_NO_VALID_SHOPPER_CLAIMS';}
          else if(c.fullClaimsWithProfile===0){classification='PERSISTENCE_FAILURE';decision='PERSISTENCE_FAILURE_GATE8_CLAIMED_SHOPPERS_HAVE_NO_PROFILE';}
          else if(c.fullClaimsWithProtectedHistory===0){classification='MAPPING_FAILURE';decision='MAPPING_FAILURE_GATE8_CLAIMED_SHOPPERS_NOT_IN_PROTECTED_HISTORY';}
          const result={decision,classification,counts:c,sourceSha:process.env.SOURCE_SHA,authWrites:0,passwordChanges:0,usersCreated:0,claimsChanged:0,firestoreWrites:0,hrWrites:0,redeploy:false,production:false};
          fs.writeFileSync(process.env.OUT+'/gate8-auth-boundary-diagnostic.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate8-auth-diagnostic-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: rm -rf node_modules
