          node --test backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs backend/runtime/hr-live-service/test/cxorbia-pre-i4-human-semantic-regression.test.mjs | tee "$OUT/source-regressions.log"

      - name: Authenticate canonical Firebase DEV read only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Prepare exact certification source without build or deploy
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-i3-terminal-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$I3_CERTIFICATION_SOURCE_SHA" | tar -x -C "$SOURCE_DIR"
          test ! -e "$SOURCE_DIR/node_modules"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          cp CXORBIA_CANONICAL_ROUTE_INVENTORY_2026-09-18.json "$OUT/canonical-route-inventory.json"

      - name: Reprove exact DEV identity Rules and fresh HR — zero deploy
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-current.json"
          DEV_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$OUT/runtime-current.json")"
          test "$DEV_REVISION" = "$EXPECTED_RUNTIME_REVISION"
          gcloud run revisions describe "$DEV_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then RUNTIME_DIGEST="$RAW"; else RUNTIME_DIGEST="sha256:${RAW##*@sha256:}"; fi
          test "$RUNTIME_DIGEST" = "$EXPECTED_RUNTIME_DIGEST"
          SOURCE_IMMUTABLE_IMAGE="$(jq -r '.spec.containers[0].image // empty' "$OUT/runtime-revision.json")"

          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$OUT/hosting-live-channel.json"
          HOSTING_RELEASE_NAME="$(jq -r '.release.name // empty' "$OUT/hosting-live-channel.json")"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$OUT/hosting-live-channel.json")"
          HOSTING_RELEASE_TIME="$(jq -r '.release.releaseTime // empty' "$OUT/hosting-live-channel.json")"
          test "$HOSTING_VERSION_NAME" = "$EXPECTED_HOSTING_VERSION"

          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/projects/$PROJECT/releases/cloud.firestore" > "$OUT/firestore-release-live.json"
          RULESET="$(jq -r '.rulesetName // empty' "$OUT/firestore-release-live.json")"; test -n "$RULESET"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/$RULESET" > "$OUT/firestore-ruleset-live.json"
          SOURCE_DIR="$SOURCE_DIR" OUT="$OUT" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const rs=JSON.parse(fs.readFileSync(process.env.OUT+'/firestore-ruleset-live.json','utf8'));
          const f=(rs?.source?.files||[]).find(x=>x.name==='firestore.rules')||(rs?.source?.files||[]).find(x=>String(x.name||'').endsWith('/firestore.rules'))||(rs?.source?.files||[])[0];
          const local=fs.readFileSync(process.env.SOURCE_DIR+'/firestore.rules','utf8');
          if(!f||String(f.content)!==local)throw new Error('RELEASE_COMPOSITION_FAILURE:TERMINAL_FIRESTORE_RULES_DRIFT');
          const sha=crypto.createHash('sha256').update(local).digest('hex');
          fs.writeFileSync(process.env.OUT+'/firestore-live-parity.json',JSON.stringify({decision:'PASS_TERMINAL_FIRESTORE_RULES_EXACT',sha256:sha,rulesetName:rs.name||null,production:false},null,2)+'\n');
          NODE

          : > "$OUT/hr-meta-attempts.ndjson"
          HR_META_OK=0
          PREV_REV=""
          STABLE_REV=""
          for attempt in $(seq 1 12); do
            curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&i3terminal=$GITHUB_RUN_ID&attempt=$attempt" > "$OUT/hr-current-live-meta.json"
            jq -c --argjson attempt "$attempt" '{attempt:$attempt,ok,revision,revisionStable,sourceSafe,refreshError,hrWrites,production,shopperProviderAck:(.shopperReconciliation.providerAck//null),visitProviderAck:(.visitReconciliation.providerAck//null),refreshStartedAt,refreshFinishedAt}' "$OUT/hr-current-live-meta.json" | tee -a "$OUT/hr-meta-attempts.ndjson"
            REV="$(jq -r '.revision // empty' "$OUT/hr-current-live-meta.json")"
            META_OK=0
            if [[ "$REV" =~ ^[0-9a-f]{64}$ ]] && [[ "$(jq -r '.ok' "$OUT/hr-current-live-meta.json")" == "true" ]] && [[ "$(jq -r '.sourceSafe' "$OUT/hr-current-live-meta.json")" == "true" ]] && [[ "$(jq -r '.shopperReconciliation.providerAck' "$OUT/hr-current-live-meta.json")" == "true" ]] && [[ "$(jq -r '.visitReconciliation.providerAck' "$OUT/hr-current-live-meta.json")" == "true" ]] && [[ "$(jq -r '.hrWrites' "$OUT/hr-current-live-meta.json")" == "false" ]] && [[ "$(jq -r '.production' "$OUT/hr-current-live-meta.json")" == "false" ]] && [[ "$(jq -r '.refreshError == null' "$OUT/hr-current-live-meta.json")" == "true" ]]; then META_OK=1; fi
            if [[ "$META_OK" = "1" && "$REV" = "$PREV_REV" && -n "$REV" ]]; then HR_META_OK=1; STABLE_REV="$REV"; break; fi
            if [[ "$META_OK" = "1" ]]; then PREV_REV="$REV"; else PREV_REV=""; fi
            sleep 8
          done
          test "$HR_META_OK" = "1"
          CURRENT_LIVE_HR_REVISION="$STABLE_REV"
          curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=json&i3terminal=$GITHUB_RUN_ID" > "$OUT/hr-current-live.json"
          SNAP_REV="$(jq -r '._runtime.revision // .sourceRevision // empty' "$OUT/hr-current-live.json")"
          test "$SNAP_REV" = "$CURRENT_LIVE_HR_REVISION"
          jq -e '.sourceSafe==true and .production==false and .hrWrites==false' "$OUT/hr-current-live.json" >/dev/null 2>&1 || true
          jq -n -S --arg revision "$CURRENT_LIVE_HR_REVISION" --argjson attempts "$(wc -l < "$OUT/hr-meta-attempts.ndjson")" '{decision:"PASS_TERMINAL_HR_STABLE_REVISION",revision:$revision,stabilityMethod:"two_consecutive_valid_meta_reads_plus_exact_snapshot_revision",attempts:$attempts,production:false}' > "$OUT/hr-stability-proof.json"

          echo "CURRENT_LIVE_HR_REVISION=$CURRENT_LIVE_HR_REVISION" >> "$GITHUB_ENV"
          echo "DEV_REVISION=$DEV_REVISION" >> "$GITHUB_ENV"
          echo "RUNTIME_DIGEST=$RUNTIME_DIGEST" >> "$GITHUB_ENV"
          echo "SOURCE_IMMUTABLE_IMAGE=$SOURCE_IMMUTABLE_IMAGE" >> "$GITHUB_ENV"
          echo "HOSTING_RELEASE_NAME=$HOSTING_RELEASE_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_VERSION_NAME=$HOSTING_VERSION_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_RELEASE_TIME=$HOSTING_RELEASE_TIME" >> "$GITHUB_ENV"

      - name: Run fresh exhaustive human acceptance on exact current candidate
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT/full-human-acceptance" "$OUT/semantic" "$OUT/gate20"
          PROJECT="$PROJECT" HOSTING_URL="$HOSTING_URL" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" I3_CERTIFICATION_SOURCE_SHA="$I3_CERTIFICATION_SOURCE_SHA" SOURCE_DIR="$SOURCE_DIR" CX_I3_PINNED_HR_FILE="$OUT/hr-current-live.json" CX_I3_PINNED_HR_REVISION="$CURRENT_LIVE_HR_REVISION" ACCEPTANCE_OUT="$OUT/full-human-acceptance" node RECOVERY-I3-HUMAN-LIVE-ACCEPTANCE-20260918.mjs
          test "$(jq -r '.decision' "$OUT/full-human-acceptance/human-live-acceptance.json")" = "PASS_I3_HUMAN_LIVE_ACCEPTANCE"
          test "$(jq -r '.sourceSha' "$OUT/full-human-acceptance/human-live-acceptance.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.sourceRevision' "$OUT/full-human-acceptance/human-live-acceptance.json")" = "$CURRENT_LIVE_HR_REVISION"
          test "$(jq -r '.decision' "$OUT/full-human-acceptance/i3-functional-probes.json")" = "PASS_I3_ATOMIC_FUNCTIONAL_PROBES"
          test "$(jq -r '.routeInventory.expectedRoleRouteEntries' "$OUT/full-human-acceptance/human-live-acceptance.json")" = "56"
          test "$(jq '[.routes[]|select(.undefinedVisible==true or .technicalVisible==true or .qaReservationVisible==true)]|length' "$OUT/full-human-acceptance/human-live-acceptance.json")" = "0"
          test "$(jq -r '.probe.reservations.ok' "$OUT/full-human-acceptance/i3-functional-probes.json")" = "true"
          test "$(jq '.probe.reservations.qaResidueIds|length' "$OUT/full-human-acceptance/i3-functional-probes.json")" = "0"

      - name: Run same-revision semantic oracle and hardened focal
        run: |
          set -Eeuo pipefail
          C3_SEM_OUT="$OUT/semantic" C3_HR_FILE="$OUT/hr-current-live.json" C3_FIREBASE_PROJECT="$PROJECT" C3_TENANT_ID="$TENANT_ID" C3_PROJECT_ID="$PROJECT_ID" C3_HR_REVISION="$CURRENT_LIVE_HR_REVISION" C3_HOSTING_URL="$HOSTING_URL" node tools/qa/cxorbia-i3-c3-terminal-semantic-oracle.mjs | tee "$OUT/semantic/oracle.log"
          test "$(jq -r '.decision' "$OUT/semantic/hr-contrast.json")" = "PASS_C3_TERMINAL_HR_SEMANTIC_ORACLE"
          test "$(jq -r '.sourceRevision' "$OUT/semantic/hr-contrast.json")" = "$CURRENT_LIVE_HR_REVISION"

          PREI4_OUT="$OUT/semantic" CXORBIA_PREI4_ROOT="$HOSTING_URL" CXORBIA_PREI4_SOURCE_SHA="$I3_CERTIFICATION_SOURCE_SHA" node tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs | tee "$OUT/semantic/focal-console.log"
          test "$(jq -r '.decision' "$OUT/semantic/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"
          test "$(jq -r '.sourceSha' "$OUT/semantic/browser-focal.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.hrRevision' "$OUT/semantic/browser-focal.json")" = "$CURRENT_LIVE_HR_REVISION"

      - name: Rebuild terminal Module Truth from fresh same-source proof and served bytes
        run: |
          set -Eeuo pipefail
          LEDGER="$(jq -r '.findingsLedgerPath' "$CANDIDATE_DESCRIPTOR")"
          TEMPLATE="RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json" LEDGER="$LEDGER" SOURCE="$I3_CERTIFICATION_SOURCE_SHA" TREE="$I3_CERTIFICATION_SOURCE_TREE" LAST_SERVED="$I3_CERTIFICATION_SOURCE_SHA" OUT_FILE="$OUT/module-truth-preterminal.json" node tools/qa/cxorbia-i3-c3-preterminal-module-truth.mjs > "$OUT/module-truth-preterminal-console.log"
          test "$(jq -r '.preTerminalComposition.decision' "$OUT/module-truth-preterminal.json")" = "PASS_C3_PRETERMINAL_COMPOSITION"
          test "$(jq '.preTerminalComposition.matchModules|length' "$OUT/module-truth-preterminal.json")" = "20"
          test "$(jq '.preTerminalComposition.pendingFileCount' "$OUT/module-truth-preterminal.json")" = "0"
          test "$(jq -r '.entrypointClosure.allApprovedOwnersLoaded' "$OUT/module-truth-preterminal.json")" = "true"

          mkdir -p "$OUT/served"
          : > "$OUT/hosting-parity.tsv"
          n=0
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            [[ "$p" == app/* ]] || continue
            rel="${p#app/}"; local="$SOURCE_DIR/$p"; remote="$OUT/served/$(echo "$rel"|tr '/' '_')"
            curl -fsSL --retry 8 --retry-delay 1 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/$rel?terminal=${GITHUB_RUN_ID}-${n}-$(date +%s%N)" -o "$remote"
            expected="$(sha256sum "$local"|awk '{print $1}')"; actual="$(sha256sum "$remote"|awk '{print $1}')"
            test "$actual" = "$expected"
            printf '%s\t%s\t%s\n' "$p" "$expected" "$actual" >> "$OUT/hosting-parity.tsv"; n=$((n+1))
          done < <(jq -r '.sourceFiles[]|select(.phaseAAuthority==true and (.loadTarget=="browser-script" or .loadTarget=="browser-style"))|.path' "$OUT/module-truth-preterminal.json")
          test "$n" -gt 0
          jq -n -S '{decision:"PASS_C3_PENDING_OWNER_BYTE_PARITY",mismatches:0,rows:[],production:false}' > "$OUT/pending-owner-parity.json"
          jq -n -S '{decision:"PASS_C3_QA_RESERVATION_CLEANUP",mode:"CURRENT_TERMINAL_ACCEPTANCE_ZERO_RESIDUE",before:0,deletedIds:[],after:0,ambiguous:0,writes:0,production:false}' > "$OUT/qa-reservation-cleanup.json"

          C3_PRETERMINAL="$OUT/module-truth-preterminal.json" C3_FOCAL="$OUT/semantic/browser-focal.json" C3_HUMAN="$OUT/full-human-acceptance/human-live-acceptance.json" C3_QA="$OUT/qa-reservation-cleanup.json" C3_PARITY="$OUT/pending-owner-parity.json" C3_LEDGER="$LEDGER" C3_FINAL_MATRIX="$OUT/module-truth-matrix.json" C3_SOURCE="$I3_CERTIFICATION_SOURCE_SHA" C3_TREE="$I3_CERTIFICATION_SOURCE_TREE" node tools/qa/cxorbia-i3-c3-finalize-module-truth.mjs > "$OUT/module-truth-terminal-console.log"
          test "$(jq -r '.terminalClosure.decision' "$OUT/module-truth-matrix.json")" = "PASS_C3_TERMINAL_MODULE_TRUTH_20_20"
          test "$(jq -r '.phaseAComplete' "$OUT/module-truth-matrix.json")" = "true"
          test "$(jq -r '.allModulesMatch' "$OUT/module-truth-matrix.json")" = "true"
          test "$(jq '[.modules[]|select(.classification!="MATCH")]|length' "$OUT/module-truth-matrix.json")" = "0"
          MODULE_TRUTH_MATRIX_SHA256="$(sha256sum "$OUT/module-truth-matrix.json"|awk '{print $1}')"
          echo "MODULE_TRUTH_MATRIX_SHA256=$MODULE_TRUTH_MATRIX_SHA256" >> "$GITHUB_ENV"

      - name: Reprove atomic source contracts and derive Gate20 receipts
        run: |
          set -Eeuo pipefail
          test "$(sha256sum "$OUT/canonical-route-inventory.json"|awk '{print $1}')" = "ad262dd0165a7159e62076f67a6339b375ce0760dd6b650abc4ee438b04950af"
          grep -q "preserveDurableVisits" "$SOURCE_DIR/app/core/backend-firebase.js"
          grep -q "live_hr_visit_id_equals_firestore_doc_id" "$SOURCE_DIR/app/adapters/tya-cumulative-read-model-v2.js"
          grep -q "hr_exact_crosswalk_precedes_historical_identity_link" "$SOURCE_DIR/app/adapters/cxorbia-provider-identity-link-runtime-v1.js"
          grep -q "'reservation.create'" "$SOURCE_DIR/backend/runtime/cxorbia-operational-command-provider-v1.mjs"
          ! grep -q "const selMonth=new Date().getMonth()" "$SOURCE_DIR/app/modules/dashboard.js"
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" '{decision:"PASS_I3_ATOMIC_P0_SOURCE_CONTRACT",sourceSha:$source,durableVisitAuthority:true,hrCrosswalkPrecedence:true,reservationsDurableProvider:true,dashboardSelectedPeriod:true,production:false}' > "$OUT/atomic-p0-source-contract.json"

          HUMAN="$OUT/full-human-acceptance/human-live-acceptance.json"; PROBES="$OUT/full-human-acceptance/i3-functional-probes.json"; FOCAL="$OUT/semantic/browser-focal.json"; MATRIX="$OUT/module-truth-matrix.json"
          HUMAN_SHA="$(sha256sum "$HUMAN"|awk '{print $1}')"; PROBES_SHA="$(sha256sum "$PROBES"|awk '{print $1}')"; FOCAL_SHA="$(sha256sum "$FOCAL"|awk '{print $1}')"; MATRIX_SHA="$(sha256sum "$MATRIX"|awk '{print $1}')"; ROUTE_SHA="$(sha256sum "$OUT/canonical-route-inventory.json"|awk '{print $1}')"; SHOTS="$(jq -r '.screenshotCount' "$HUMAN")"
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg human "$HUMAN_SHA" --arg focal "$FOCAL_SHA" --arg matrix "$MATRIX_SHA" --arg routes "$ROUTE_SHA" --argjson shots "$SHOTS" '{decision:"PASS_GATE20_FOCAL_VISUAL_DRIFT",gate:20,mode:"CURRENT_TERMINAL_FULL_CANONICAL_VISUAL",sourceSha:$source,fullHumanAcceptanceSha256:$human,hardenedFocalSha256:$focal,moduleTruthSha256:$matrix,routeInventorySha256:$routes,expectedRoleRouteEntries:56,screenshotCount:$shots,production:false}' > "$OUT/gate20/gate20-browser-visual.json"
          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg human "$HUMAN_SHA" --arg probes "$PROBES_SHA" --arg focal "$FOCAL_SHA" --arg matrix "$MATRIX_SHA" --arg routes "$ROUTE_SHA" '{decision:"PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY",gate:20,mode:"CURRENT_TERMINAL_FULL_CANONICAL_SEMANTIC",sourceSha:$source,fullHumanAcceptanceSha256:$human,functionalProbesSha256:$probes,hardenedFocalSha256:$focal,moduleTruthSha256:$matrix,routeInventorySha256:$routes,expectedRoleRouteEntries:56,production:false}' > "$OUT/gate20-semantic-shopper.json"

      - name: Package one deterministic certification artifact and manifest
        run: |
          set -Eeuo pipefail
          tar -C "$SOURCE_DIR" --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$OUT/cxorbia-i3-certified-source.tar" .
          ARTIFACT_SHA256="$(sha256sum "$OUT/cxorbia-i3-certified-source.tar"|awk '{print $1}')"
          echo "$ARTIFACT_SHA256  cxorbia-i3-certified-source.tar" > "$OUT/cxorbia-i3-certified-source.tar.sha256"
          GATE20_SHA="$(sha256sum "$OUT/gate20/gate20-browser-visual.json"|awk '{print $1}')"
          SEM20_SHA="$(sha256sum "$OUT/gate20-semantic-shopper.json"|awk '{print $1}')"
          HUMAN_SHA="$(sha256sum "$OUT/full-human-acceptance/human-live-acceptance.json"|awk '{print $1}')"
          PROBES_SHA="$(sha256sum "$OUT/full-human-acceptance/i3-functional-probes.json"|awk '{print $1}')"
          ROUTE_SHA="$(sha256sum "$OUT/canonical-route-inventory.json"|awk '{print $1}')"
          HR_SHA="$(sha256sum "$OUT/hr-current-live.json"|awk '{print $1}')"
          HR_META_SHA="$(sha256sum "$OUT/hr-current-live-meta.json"|awk '{print $1}')"
          RULES_SHA="$(sha256sum "$OUT/firestore-live-parity.json"|awk '{print $1}')"
          RUNTIME_SHA="$(sha256sum "$OUT/runtime-revision.json"|awk '{print $1}')"
          HOSTING_SHA="$(sha256sum "$OUT/hosting-live-channel.json"|awk '{print $1}')"
          ATOMIC_SHA="$(sha256sum "$OUT/atomic-p0-source-contract.json"|awk '{print $1}')"

          jq -n -S --arg source "$I3_CERTIFICATION_SOURCE_SHA" --arg tree "$I3_CERTIFICATION_SOURCE_TREE" --arg control "$GITHUB_SHA" --arg artifact "$ARTIFACT_SHA256" --arg revision "$DEV_REVISION" --arg digest "$RUNTIME_DIGEST" --arg image "$SOURCE_IMMUTABLE_IMAGE" --arg hostingRelease "$HOSTING_RELEASE_NAME" --arg hostingVersion "$HOSTING_VERSION_NAME" --arg hostingTime "$HOSTING_RELEASE_TIME" --arg hr "$CURRENT_LIVE_HR_REVISION" --arg hrSha "$HR_SHA" --arg hrMetaSha "$HR_META_SHA" --arg rulesSha "$RULES_SHA" --arg runtimeSha "$RUNTIME_SHA" --arg hostingSha "$HOSTING_SHA" --arg gate20Sha "$GATE20_SHA" --arg semantic20Sha "$SEM20_SHA" --arg humanSha "$HUMAN_SHA" --arg probesSha "$PROBES_SHA" --arg routesSha "$ROUTE_SHA" --arg moduleTruthSha "$MODULE_TRUTH_MATRIX_SHA256" --arg atomicSha "$ATOMIC_SHA" --slurpfile moduleTruth "$OUT/module-truth-matrix.json" '{schemaVersion:"cxorbia.i3.terminal-certification.v2",decision:"PASS_I3_ONE_ARTIFACT_READY_FOR_GATE21",i3CertificationSourceSha:$source,i3CertificationSourceTree:$tree,controlHeadSha:$control,artifactFile:"cxorbia-i3-certified-source.tar",artifactSha256:$artifact,buildCount:1,artifactPackCount:1,runtimeBuilds:0,runtimeDeploys:0,hostingDeploys:0,rulesDeploys:0,rebuildAfterCertification:false,devRuntimeRevision:$revision,runtimeImageDigest:$digest,immutableRuntimeImage:$image,hostingReleaseName:$hostingRelease,hostingVersionName:$hostingVersion,hostingReleaseTime:$hostingTime,certificationHrRevision:$hr,certificationHrEvidenceSha256:$hrSha,certificationHrMetaSha256:$hrMetaSha,firestoreParityEvidenceSha256:$rulesSha,runtimeEvidenceSha256:$runtimeSha,hostingEvidenceSha256:$hostingSha,atomicP0:{decision:"PASS_I3_ATOMIC_P0_SOURCE_CONTRACT",evidenceSha256:$atomicSha},fullHumanAcceptance:{decision:"PASS_I3_HUMAN_LIVE_ACCEPTANCE",evidenceSha256:$humanSha,functionalProbesSha256:$probesSha,routeInventorySha256:$routesSha,expectedRoleRouteEntries:56,beforeArtifact:true},gate20:{decision:"PASS_GATE20_FOCAL_VISUAL_DRIFT",sourceSha:$source,evidenceSha256:$gate20Sha},gate20Semantic:{decision:"PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY",sourceSha:$source,evidenceSha256:$semantic20Sha},moduleTruthEvidenceSha256:$moduleTruthSha,moduleTruth:$moduleTruth[0],pendingTerminalFindingsClosedByThisProof:["VRM-034","VRM-035","VRM-041","VRM-043"],sameRevisionWithinCertificationProof:true,production:false}' > "$OUT/i3-certification-manifest.json"
          cp "$OUT/i3-certification-manifest.json" "$OUT/result.json"

      - name: Upload one terminal certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-single-source-certification-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Upload terminal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-terminal-diagnostics-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - if: always()
        run: rm -rf node_modules "$RUNNER_TEMP/cxorbia-i3-terminal-source" "$RUNNER_TEMP/cxorbia-run490-module-truth"

  live-fixtures:
    name: I3 full live fixture suite v2 — exact same certified artifact
    needs: [canonical-candidate-authority, certify]
    if: ${{ needs.certify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      OUT: .tmp/recovery-i3-live-fixtures-v2
      I3_CERTIFICATION_SOURCE_SHA: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      I3_CERTIFICATION_SOURCE_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install live fixture dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Bind suite to same-run certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT"
          CERT="$RUNNER_TEMP/cxorbia-terminal-cert"; SOURCE_DIR="$RUNNER_TEMP/cxorbia-terminal-fixture-source"
          rm -rf "$CERT" "$SOURCE_DIR"; mkdir -p "$CERT" "$SOURCE_DIR"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cxorbia-recovery-i3-single-source-certification-$GITHUB_RUN_ID" --dir "$CERT"
          test "$(jq -r '.decision' "$CERT/result.json")" = "PASS_I3_ONE_ARTIFACT_READY_FOR_GATE21"
          test "$(jq -r '.i3CertificationSourceSha' "$CERT/result.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.i3CertificationSourceTree' "$CERT/result.json")" = "$I3_CERTIFICATION_SOURCE_TREE"
          EXPECTED="$(jq -r '.artifactSha256' "$CERT/result.json")"
          test "$(sha256sum "$CERT/cxorbia-i3-certified-source.tar"|awk '{print $1}')" = "$EXPECTED"
          tar -xf "$CERT/cxorbia-i3-certified-source.tar" -C "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "CERT_DIR=$CERT" >> "$GITHUB_ENV"
          echo "CERTIFIED_ARTIFACT_SHA256=$EXPECTED" >> "$GITHUB_ENV"
      - name: Execute reversible 10-case live suite on exact artifact
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" HOSTING_URL="$HOSTING_URL" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" PERIOD_ID="$PERIOD_ID" I3_CERTIFICATION_SOURCE_SHA="$I3_CERTIFICATION_SOURCE_SHA" I3_CERTIFICATION_SOURCE_TREE="$I3_CERTIFICATION_SOURCE_TREE" SOURCE_DIR="$SOURCE_DIR" PRIOR_DIR="$CERT_DIR" PRIOR_RUN_ID="$GITHUB_RUN_ID" CERTIFIED_ARTIFACT_SHA256="$CERTIFIED_ARTIFACT_SHA256" OUT="$OUT" node "$GITHUB_WORKSPACE/.github/control/RECOVERY-I3-LIVE-FIXTURES-20260920-V4.mjs"
          test "$(jq -r '.decision' "$OUT/i3-live-fixtures-result.json")" = "PASS_I3_LIVE_FIXTURES_V2"
          test "$(jq -r '.cleanup.ok' "$OUT/i3-live-fixtures-result.json")" = "true"
          test "$(jq '[.tests[]|select(.ok==true)]|length' "$OUT/i3-live-fixtures-result.json")" = "10"
          test "$(jq -r '.buildCountThisRun' "$OUT/i3-live-fixtures-result.json")" = "0"
          test "$(jq -r '.deployCountThisRun' "$OUT/i3-live-fixtures-result.json")" = "0"
      - uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-live-fixtures-v2-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: always()
        run: rm -rf node_modules "$RUNNER_TEMP/cxorbia-terminal-cert" "$RUNNER_TEMP/cxorbia-terminal-fixture-source"

  gate21:
    name: Gate 21 integrity of exact same certification artifact
    needs: [certify, live-fixtures]
    if: ${{ needs.certify.result == 'success' && needs.live-fixtures.result == 'success' }}
    uses: ./.github/workflows/cxorbia-recovery-i3-gate21-artifact-fingerprint.yml
    secrets: inherit

  pre-i4-human-entrypoint-dev:
    name: PRE-I4 focal human entrypoint DEV materialization
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUEST: backend/config/pre-i4-human-entrypoint-dev-deploy-request.json
      PREI4_OUT: .tmp/pre-i4-human-entrypoint
      PREI4_SOURCE_DIR: .tmp/pre-i4-human-source
    steps:
      - name: Checkout control successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate focal authorization and exact source
        id: gate
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          mkdir -p "$PREI4_OUT"
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8')),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const exact={schemaVersion:'cxorbia.pre-i4.human-entrypoint-dev-deploy.request.v1',requestId:'pre-i4-visual-remediation-20260923-04',branch:'recovery/cxorbia-phase-a-20260831',sourceSha:'50b6a25d79713b0f165cffc4355c7b7ffd1d9e84',sourceTree:'495266b89b932976569f57070b27b7e4f06d6cdd',targetProject:'cxorbia-backend-dev',hostingSite:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',devRootUrl:'https://cxorbia-backend-dev.web.app'};
          for(const [k,v] of Object.entries(exact))if(r[k]!==v)throw new Error('RELEASE_COMPOSITION_FAILURE:REQUEST_'+k.toUpperCase()+'_MISMATCH');
          if(r.enabled!==true||r.consumed!==false||r.status!=='authorized_execute_once'||r.authorizedBy!=='Paula')throw new Error('RELEASE_COMPOSITION_FAILURE:AUTHORIZATION_STATE_INVALID');
          if(r.production!==false||r.maxHostingDeploys!==1||r.noAutomaticRetry!==true)throw new Error('RELEASE_COMPOSITION_FAILURE:UNSAFE_DEPLOY_SCOPE');
          if(Number(r.cloudRunDeploys)!==0||Number(r.runtimeDeploys)!==0||Number(r.rulesDeploys)!==1||Number(r.runtimeBuilds)!==0)throw new Error('RELEASE_COMPOSITION_FAILURE:FOCAL_DEV_CONTINUATION_SCOPE_MISMATCH');
          for(const k of ['firestoreWrites','authWrites','hrWrites','storageWrites','imports','legacyWrites'])if(Number(r[k]||0)!==0)throw new Error('RELEASE_COMPOSITION_FAILURE:UNSAFE_SCOPE_'+k);
          execFileSync('git',['cat-file','-e',r.sourceSha+'^{commit}']);
          if(execFileSync('git',['rev-parse',r.sourceSha+'^{tree}'],{encoding:'utf8'}).trim()!==r.sourceTree)throw new Error('RELEASE_COMPOSITION_FAILURE:SOURCE_TREE_MISMATCH');
          execFileSync('git',['merge-base','--is-ancestor',r.sourceSha,head]);
          const changed=execFileSync('git',['diff','--name-only',r.sourceSha,head],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const allowed=[p,'.github/workflows/cxorbia-recovery-i3-dev-certification.yml','tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs','CXORBIA_PRE_I4_VISUAL_REMEDIATION_RUN_STATE_2026-09-22.json'].sort();
          if(JSON.stringify(changed)!==JSON.stringify(allowed))throw new Error('RELEASE_COMPOSITION_FAILURE:CONTROL_SUCCESSOR_PRODUCT_DRIFT:'+changed.join(','));
          fs.writeFileSync(process.env.PREI4_OUT+'/authorization.json',JSON.stringify({decision:'PASS_PRE_I4_FOCAL_AUTHORIZATION',requestId:r.requestId,sourceSha:r.sourceSha,sourceTree:r.sourceTree,controlHeadSha:head,changedAfterSource:changed,runtimeBuildMax:0,runtimeDeployMax:0,rulesDeployMax:1,hostingDeployMax:1,production:false},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'source_sha='+r.sourceSha+'\nsource_tree='+r.sourceTree+'\n');
          NODE

      - name: Prepare exact focal successor and source gate
        run: |
          set -Eeuo pipefail
          rm -rf "$PREI4_SOURCE_DIR"
          mkdir -p "$PREI4_SOURCE_DIR"
          git archive "${{ steps.gate.outputs.source_sha }}" | tar -x -C "$PREI4_SOURCE_DIR"
          cd "$PREI4_SOURCE_DIR"
          node tools/qa/cxorbia-pre-i4-human-entrypoint-contract-gate.mjs > "$GITHUB_WORKSPACE/$PREI4_OUT/source-gate.json"
          test "$(jq -r '.decision' "$GITHUB_WORKSPACE/$PREI4_OUT/source-gate.json")" = "PASS_PRE_I4_HUMAN_ENTRYPOINT_CONTRACT"

      - name: PRE-I4 focal source gates before any DEV deployment
        run: |
          set -Eeuo pipefail
          cd "$PREI4_SOURCE_DIR"
          for f in             app/core/router.js             app/core/backend-resources.js             app/modules/misvisitas.js             app/modules/postulaciones.js             app/modules/finanzas.js             app/modules/documentos.js             app/modules/cert.js             app/adapters/cxorbia-command-adapter-v1.js             app/adapters/cxorbia-cxdata-command-boundary-v1.js             backend/runtime/cxorbia-operational-command-provider-v1.mjs; do
            node --check "$f"
          done
          node --test             backend/runtime/hr-live-service/test/cxorbia-i3-project-period-contract.test.mjs             backend/runtime/hr-live-service/test/cxorbia-gate7-operational-assignment.test.mjs             backend/runtime/hr-live-service/test/cxorbia-pre-i4-durability-resources.test.mjs             backend/runtime/hr-live-service/test/cxorbia-pre-i4-human-ui-cleanup.test.mjs             | tee "$GITHUB_WORKSPACE/$PREI4_OUT/source-tests.log"
          jq -n -S --arg source "${{ steps.gate.outputs.source_sha }}"             '{decision:"PASS_PRE_I4_FOCAL_SOURCE_GATES",sourceSha:$source,syntax:true,tests:true,production:false}'             > "$GITHUB_WORKSPACE/$PREI4_OUT/source-proof.json"

      - name: Freeze exact static app artifact before deploy
        run: |
          set -Eeuo pipefail
          cd "$PREI4_SOURCE_DIR"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$GITHUB_WORKSPACE/$PREI4_OUT/cxorbia-pre-i4-human-app.tar" app
          sha256sum "$GITHUB_WORKSPACE/$PREI4_OUT/cxorbia-pre-i4-human-app.tar" | awk '{print $1}' > "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.sha256"
          jq -n -S --arg source "${{ steps.gate.outputs.source_sha }}" --arg tree "${{ steps.gate.outputs.source_tree }}" --arg artifact "$(cat "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.sha256")" '{decision:"PASS_PRE_I4_ONE_STATIC_ARTIFACT_FROZEN",sourceSha:$source,sourceTree:$tree,artifactSha256:$artifact,staticBuildCount:0,runtimeBuildMax:0,runtimeDeployMax:0,rulesDeployMax:1,hostingDeployMax:1,production:false}' > "$GITHUB_WORKSPACE/$PREI4_OUT/artifact-manifest.json"

      - name: Authenticate existing Firebase DEV only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud for existing Recovery DEV only
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Install transient focal tooling
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify existing PRE-I4 runtime from Run 307 without rebuild or redeploy
        run: |
          set -Eeuo pipefail
          EXPECTED_TAG="gcr.io/cxorbia-backend-dev/cxorbia-live-hr-dev:prei4-50b6a25d7971-35915126071"
          gcloud run services describe "cxorbia-live-hr-dev" --project "cxorbia-backend-dev" --region "us-central1" --format=json > "$PREI4_OUT/runtime-service.json"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$PREI4_OUT/runtime-service.json")"
          test "$REVISION" = "cxorbia-live-hr-dev-00214-drz"
          gcloud run revisions describe "$REVISION" --project "cxorbia-backend-dev" --region "us-central1" --format=json > "$PREI4_OUT/runtime-revision.json"
          SERVICE_IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' "$PREI4_OUT/runtime-service.json")"
          REVISION_IMAGE="$(jq -r '.spec.containers[0].image // empty' "$PREI4_OUT/runtime-revision.json")"
          DIGEST_RAW="$(jq -r '.status.imageDigest // empty' "$PREI4_OUT/runtime-revision.json")"
          test "$SERVICE_IMAGE" = "$EXPECTED_TAG"
          TAG_DIGEST="$(gcloud container images describe "$EXPECTED_TAG" --format='value(image_summary.digest)')"
          [[ "$TAG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$DIGEST_RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$DIGEST_RAW"; elif [[ "$DIGEST_RAW" == *@sha256:* ]]; then DIGEST="sha256:${DIGEST_RAW##*@sha256:}"; elif [[ "$REVISION_IMAGE" == *@sha256:* ]]; then DIGEST="sha256:${REVISION_IMAGE##*@sha256:}"; else echo "Runtime digest unresolved" >&2; exit 1; fi
          test "$DIGEST" = "$TAG_DIGEST"
          [[ "$REVISION_IMAGE" == *@"$DIGEST" ]]
          RUNTIME_URL="$(jq -r '.status.url // empty' "$PREI4_OUT/runtime-service.json")"
          curl -fsS --retry 10 --retry-delay 2 "$RUNTIME_URL/health" > "$PREI4_OUT/runtime-health.json"
          jq -e '.ok==true and .production==false and .hrWrites==false and .shopperReconciliationReady==true and .visitReconciliationReady==true' "$PREI4_OUT/runtime-health.json" >/dev/null
          printf '%s\n' "$REVISION" > "$PREI4_OUT/runtime-revision-name.txt"
          printf '%s\n' "$DIGEST" > "$PREI4_OUT/runtime-digest.txt"
          echo 0 > "$PREI4_OUT/runtime-build-count.txt"
          echo 0 > "$PREI4_OUT/runtime-deploy-count.txt"
          jq -n -S --arg revision "$REVISION" --arg digest "$DIGEST" --arg serviceImage "$SERVICE_IMAGE" --arg revisionImage "$REVISION_IMAGE" '{decision:"PASS_PRE_I4_EXISTING_RUNTIME_EXACT_SOURCE",runtimeRevision:$revision,runtimeDigest:$digest,serviceImage:$serviceImage,revisionImage:$revisionImage,tagDigestMatchesRevision:true,priorRunId:35915126071,priorBuildCount:1,priorDeployCount:1,continuationBuildCount:0,continuationDeployCount:0,production:false}' > "$PREI4_OUT/runtime-continuation.json"

      - name: Deploy exact PRE-I4 Firestore rules through proven direct Rules API lane
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_RULES_SOURCE: ${{ env.PREI4_SOURCE_DIR }}/firestore.rules
          CXORBIA_RULES_DEPLOY_REPORT: ${{ env.PREI4_OUT }}/direct-rules-deploy.json
          CXORBIA_EXECUTE_FIRESTORE_RULES: 'true'
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          node tools/release/cxorbia-corte6-firestore-rules-deploy.mjs
          test "$(jq -r '.verified' "$PREI4_OUT/direct-rules-deploy.json")" = "true"
          test "$(jq -r '.safety.production' "$PREI4_OUT/direct-rules-deploy.json")" = "false"
          test "$(jq -r '.safety.firestoreDataWrites' "$PREI4_OUT/direct-rules-deploy.json")" = "0"
          echo 1 > "$PREI4_OUT/rules-deploy-count.txt"
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/projects/cxorbia-backend-dev/releases/cloud.firestore" > "$PREI4_OUT/firestore-rules-release.json"
          RULESET="$(jq -r '.rulesetName // empty' "$PREI4_OUT/firestore-rules-release.json")"
          test -n "$RULESET"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/$RULESET" > "$PREI4_OUT/firestore-ruleset.json"
          PREI4_SOURCE_DIR="$PREI4_SOURCE_DIR" PREI4_OUT="$PREI4_OUT" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const local=fs.readFileSync(process.env.PREI4_SOURCE_DIR+'/firestore.rules','utf8').replace(/\r\n/g,'\n').trimEnd();
          const rs=JSON.parse(fs.readFileSync(process.env.PREI4_OUT+'/firestore-ruleset.json','utf8'));
          const files=rs?.source?.files||[];
          const f=files.find(x=>String(x.name||'').endsWith('firestore.rules'))||files.find(x=>String(x.content||'').includes("rules_version"));
          if(!f)throw new Error('PROVIDER_FAILURE:FIRESTORE_RULES_SOURCE_READBACK_MISSING');
          const remote=String(f.content||'').replace(/\r\n/g,'\n').trimEnd();
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          if(local!==remote)throw new Error('RELEASE_COMPOSITION_FAILURE:FIRESTORE_RULES_BYTE_MISMATCH');
          fs.writeFileSync(process.env.PREI4_OUT+'/rules-parity.json',JSON.stringify({decision:'PASS_PRE_I4_FIRESTORE_RULES_PARITY',sha256:sha(local),directApi:true,production:false},null,2)+'\n');
          NODE

      - name: Deploy exact frozen successor to existing Hosting DEV once
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          cd "$PREI4_SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:cxorbia-dev" --project "cxorbia-backend-dev" --non-interactive | tee "$GITHUB_WORKSPACE/$PREI4_OUT/hosting-deploy.log"
          echo 1 > "$GITHUB_WORKSPACE/$PREI4_OUT/hosting-deploy-count.txt"

      - name: Prove served byte parity and canonical wildcard
        run: |
          set -Eeuo pipefail
          root="https://cxorbia-backend-dev.web.app"
          mkdir -p "$PREI4_OUT/remote"
          for rel in             index-backend-dev.html index.html app.js config/runtime.js             core/config.js core/data-source.js core/data.js core/router.js core/finanzas-core.js core/liquidacion.js core/backend-resources.js             adapters/cxorbia-command-adapter-v1.js adapters/cxorbia-cxdata-command-boundary-v1.js adapters/tya-protected-auth-hr-authority-bridge-v2.js             data/tya-certification-carryover-source-safe.js             modules/dashboard.js modules/misvisitas.js modules/shoppers.js modules/postulaciones.js modules/finanzas.js modules/documentos.js modules/cert.js             styles/layout.css; do
            local="$PREI4_SOURCE_DIR/app/$rel"
            remote="$PREI4_OUT/remote/$(echo "$rel" | tr '/' '_')"
            ok=0
            for attempt in $(seq 1 30); do
              if curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$root/$rel?prei4=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$remote" && cmp "$local" "$remote"; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done
          curl -fsSL -H 'Cache-Control: no-cache' "$root/__pre_i4_deep_route__/admin/dashboard?prei4=${GITHUB_RUN_ID}" -o "$PREI4_OUT/remote/deep.html"
          cmp "$PREI4_SOURCE_DIR/app/index-backend-dev.html" "$PREI4_OUT/remote/deep.html"
          jq -n -S --arg source "${{ steps.gate.outputs.source_sha }}" '{decision:"PASS_PRE_I4_HOSTING_REMOTE_BYTE_PARITY",sourceSha:$source,criticalFiles:23,deepRouteCanonicalEntrypoint:true,production:false}' > "$PREI4_OUT/remote-parity.json"

      - name: Read fresh HR authority after deploy
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache' "https://cxorbia-backend-dev.web.app/api/tenants/tya/projects/cinepolis/hr-live?view=operational-names&cxOperationalPreview=YES_PAULA_20260731_NAMES_DEV&prei4=${GITHUB_RUN_ID}" -o "$PREI4_OUT/hr-fresh.json"
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync(process.env.PREI4_OUT+'/hr-fresh.json','utf8'));
          const key=p?.source?.currentCalendarPeriodKey,period=(p.periods||[]).find(x=>x.key===key),visits=(p.visits||[]).filter(v=>v.periodKey===key);
          const country=code=>{const a=visits.filter(v=>(v.country||v.pais)===code),assigned=a.filter(v=>v?.canonicalFacets?.assigned===true||v.assignmentState==='assigned');return{total:a.length,availableUnassigned:a.filter(v=>v?.canonicalFacets?.available===true&&!v?.canonicalFacets?.assigned).length,assigned:assigned.length,scheduled:a.filter(v=>v?.canonicalFacets?.scheduled===true||v.schedulingState==='scheduled').length,realized:a.filter(v=>v?.canonicalFacets?.realized===true||v.executionState==='realized').length,submitted:a.filter(v=>v?.canonicalFacets?.submitted===true||v.submissionState==='confirmed_hr').length,outOfRange:a.filter(v=>v?.canonicalFacets?.outOfRange===true||v.outOfRange===true).length,reviewRequired:a.filter(v=>v.reviewRequired===true).length,uniqueAssignedShoppers:new Set(assigned.map(v=>String(v.shopperId||'')).filter(Boolean)).size};};
          const revision=String(p?._runtime?.revision||'');
          if(!/^[a-f0-9]{64}$/.test(revision))throw new Error('SOURCE_FAILURE:HR_REVISION_MISSING');
          if(!period||period.total!==44||period.byCountry?.GT!==34||period.byCountry?.HN!==10)throw new Error('SOURCE_FAILURE:CURRENT_PERIOD_COUNTS_DRIFT');
          fs.writeFileSync(process.env.PREI4_OUT+'/hr-contrast.json',JSON.stringify({decision:'PASS_PRE_I4_HR_FRESH_CONTRAST',generatedAt:p.generatedAt,sourceRevision:revision,currentPeriodKey:key,currentPeriodId:period.id,projectId:p.projectId,projectName:p.projectName,tabs:period.tabs,GT:country('GT'),HN:country('HN'),production:false,hrWrites:0},null,2)+'\n');
          NODE

      - name: Focal browser proof pre-auth Admin Shopper refresh mobile
        env:
          CXORBIA_PREI4_ROOT: https://cxorbia-backend-dev.web.app
          CXORBIA_PREI4_SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          node tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs
          test "$(jq -r '.decision' "$PREI4_OUT/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"

      - name: Prove deployed artifact equals frozen source
        run: |
          set -Eeuo pipefail
          test "$(cat "$PREI4_OUT/runtime-build-count.txt")" = "0"
          test "$(cat "$PREI4_OUT/runtime-deploy-count.txt")" = "0"
          test "$(cat "$PREI4_OUT/rules-deploy-count.txt")" = "1"
          test "$(cat "$PREI4_OUT/hosting-deploy-count.txt")" = "1"
          test "$(jq -r '.decision' "$PREI4_OUT/rules-parity.json")" = "PASS_PRE_I4_FIRESTORE_RULES_PARITY"
          cd "$PREI4_SOURCE_DIR"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$GITHUB_WORKSPACE/$PREI4_OUT/cxorbia-pre-i4-human-app-postcheck.tar" app
          POST="$(sha256sum "$GITHUB_WORKSPACE/$PREI4_OUT/cxorbia-pre-i4-human-app-postcheck.tar" | awk '{print $1}')"
          PRE="$(cat "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.sha256")"
          test "$POST" = "$PRE"
          jq -n -S             --arg source "${{ steps.gate.outputs.source_sha }}"             --arg artifact "$PRE"             --arg hr "$(jq -r '.sourceRevision' "$GITHUB_WORKSPACE/$PREI4_OUT/hr-contrast.json")"             --arg runtimeRevision "$(cat "$GITHUB_WORKSPACE/$PREI4_OUT/runtime-revision-name.txt")"             --arg runtimeDigest "$(cat "$GITHUB_WORKSPACE/$PREI4_OUT/runtime-digest.txt")"             '{decision:"PASS_PRE_I4_SAME_ARTIFACT_DEV",sourceSha:$source,artifactSha256:$artifact,hrRevision:$hr,runtimeRevision:$runtimeRevision,runtimeDigest:$runtimeDigest,staticBuildCount:0,continuationRuntimeBuildCount:0,continuationRuntimeDeployCount:0,cumulativeRuntimeBuildCount:1,cumulativeRuntimeDeployCount:1,rulesDeployCount:1,hostingDeployCount:1,remoteByteParity:true,rulesParity:true,focalBrowser:true,production:false}'             > "$GITHUB_WORKSPACE/$PREI4_OUT/final.json"

      - name: Upload focal PRE-I4 evidence and frozen app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-pre-i4-human-entrypoint-${{ github.run_id }}
          path: ${{ env.PREI4_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enforce focal result
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.decision' "$PREI4_OUT/source-proof.json")" = "PASS_PRE_I4_FOCAL_SOURCE_GATES"
          test "$(jq -r '.decision' "$PREI4_OUT/rules-parity.json")" = "PASS_PRE_I4_FIRESTORE_RULES_PARITY"
          test "$(jq -r '.decision' "$PREI4_OUT/final.json")" = "PASS_PRE_I4_SAME_ARTIFACT_DEV"
          test "$(jq -r '.decision' "$PREI4_OUT/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"
          test "$(jq -r '.decision' "$PREI4_OUT/hr-contrast.json")" = "PASS_PRE_I4_HR_FRESH_CONTRAST"
          test "$(jq -r '.decision' "$PREI4_OUT/remote-parity.json")" = "PASS_PRE_I4_HOSTING_REMOTE_BYTE_PARITY"

  pre-i4-finance-p0-hosting-fix:
    name: PRE-I4 focal static P0 Hosting-only materialization
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUEST: backend/config/pre-i4-human-entrypoint-dev-deploy-request.json
      PREI4_OUT: .tmp/pre-i4-focal-fix
      PREI4_SOURCE_DIR: .tmp/pre-i4-focal-source
      PREI4_PRIOR: .tmp/pre-i4-prior-deploy
    steps:
      - name: Checkout cumulative control successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact focal functional successor and one-shot scope
        run: |
          set -Eeuo pipefail
          mkdir -p "$PREI4_OUT"
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8')),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const source='f5b96e853698f9cf96e0752fd641e7e21e9e5ed0',previous='275a9893532e9fa11efcbafccd34bb93919d7d64';
          if(r.requestId!=='pre-i4-visual-remediation-20260923-12'||r.sourceSha!==source||r.sourceTree!=='755e448b0c19701a1598ed0727edeae64ef766b0')throw new Error('RELEASE_COMPOSITION_FAILURE:FOCAL_FIX_REQUEST_SOURCE');
          if(r.status!=='authorized_execute_once'||r.enabled!==true||r.consumed!==false||r.production!==false||r.noAutomaticRetry!==true)throw new Error('RELEASE_COMPOSITION_FAILURE:FOCAL_FIX_AUTHORIZATION');
          if(Number(r.nextRun?.runtimeBuilds)!==0||Number(r.nextRun?.runtimeDeploys)!==0||Number(r.nextRun?.rulesDeploys)!==0||Number(r.nextRun?.hostingDeploys)!==1)throw new Error('RELEASE_COMPOSITION_FAILURE:FOCAL_FIX_SCOPE');
          execFileSync('git',['merge-base','--is-ancestor',source,head]);
          const productDiff=execFileSync('git',['diff','--name-only',previous,source,'--','app','backend/runtime/hr-live-service/test'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const expected=[
            'app/adapters/tya-c6-domain-consistency-bridge.js',
            'backend/runtime/hr-live-service/test/cxorbia-pre-i4-human-ui-cleanup.test.mjs'
          ].sort();
          if(JSON.stringify(productDiff)!==JSON.stringify(expected))throw new Error('RELEASE_COMPOSITION_FAILURE:FOCAL_FIX_PRODUCT_DIFF:'+productDiff.join(','));
          const unsafe=productDiff.filter(x=>x==='firestore.rules'||x.startsWith('backend/runtime/hr-live-service/')&&!x.endsWith('cxorbia-pre-i4-human-ui-cleanup.test.mjs'));
          if(unsafe.length)throw new Error('RELEASE_COMPOSITION_FAILURE:FOCAL_FIX_RUNTIME_RULES_DRIFT:'+unsafe.join(','));
          fs.writeFileSync(process.env.PREI4_OUT+'/authorization.json',JSON.stringify({decision:'PASS_PRE_I4_FOCAL_FIX_AUTHORIZATION',sourceSha:source,sourceTree:r.sourceTree,productDiff,runtimeBuilds:0,runtimeDeploys:0,rulesDeploys:0,hostingDeployMax:1,production:false},null,2)+'\n');
          NODE

      - name: Recreate exact functional source and run regression gates
        run: |
          set -Eeuo pipefail
          rm -rf "$PREI4_SOURCE_DIR"; mkdir -p "$PREI4_SOURCE_DIR"
          git archive "f5b96e853698f9cf96e0752fd641e7e21e9e5ed0" | tar -x -C "$PREI4_SOURCE_DIR"
          cd "$PREI4_SOURCE_DIR"
          node --check app/adapters/tya-live-source-inplace-apply.js
          node --check app/adapters/tya-delegated-coordination-finance-guard-v1.js
          node --check app/adapters/tya-canonical-finance-read-model-v2.js
          node --check app/adapters/tya-c6-domain-consistency-bridge.js
          node --check app/modules/misvisitas.js
          node --check app/modules/postulaciones.js
          node --test             backend/runtime/hr-live-service/test/cxorbia-pre-i4-finance-source-semantics.test.mjs             backend/runtime/hr-live-service/test/cxorbia-i3-project-period-contract.test.mjs             backend/runtime/hr-live-service/test/cxorbia-gate7-operational-assignment.test.mjs             backend/runtime/hr-live-service/test/cxorbia-pre-i4-durability-resources.test.mjs             backend/runtime/hr-live-service/test/cxorbia-pre-i4-human-ui-cleanup.test.mjs             | tee "$GITHUB_WORKSPACE/$PREI4_OUT/source-tests.log"
          node tools/qa/cxorbia-pre-i4-human-entrypoint-contract-gate.mjs > "$GITHUB_WORKSPACE/$PREI4_OUT/source-gate.json"
          test "$(jq -r '.decision' "$GITHUB_WORKSPACE/$PREI4_OUT/source-gate.json")" = "PASS_PRE_I4_HUMAN_ENTRYPOINT_CONTRACT"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.tar" app
          sha256sum "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.tar" | awk '{print $1}' > "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.sha256"

      - name: Authenticate existing Firebase DEV only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Install transient Hosting and browser tooling
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Bind unchanged runtime and Rules evidence from prior materialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$PREI4_PRIOR"; mkdir -p "$PREI4_PRIOR"
          gh run download 35929165160 --repo "$GITHUB_REPOSITORY" --name "cxorbia-pre-i4-human-entrypoint-35929165160" --dir "$PREI4_PRIOR"
          test "$(jq -r '.decision' "$PREI4_PRIOR/runtime-continuation.json")" = "PASS_PRE_I4_EXISTING_RUNTIME_EXACT_SOURCE"
          test "$(jq -r '.decision' "$PREI4_PRIOR/rules-parity.json")" = "PASS_PRE_I4_FIRESTORE_RULES_PARITY"
          gcloud run services describe "cxorbia-live-hr-dev" --project "cxorbia-backend-dev" --region "us-central1" --format=json > "$PREI4_OUT/runtime-live.json"
          RUNTIME_REV="$(jq -r '.status.latestReadyRevisionName // empty' "$PREI4_OUT/runtime-live.json")"
          test -n "$RUNTIME_REV"
          curl -fsS --retry 8 --retry-delay 2 "$(jq -r '.status.url' "$PREI4_OUT/runtime-live.json")/health" > "$PREI4_OUT/runtime-health.json"
          jq -e '.ok==true and .production==false and .hrWrites==false' "$PREI4_OUT/runtime-health.json" >/dev/null
          jq -n -S --arg revision "$RUNTIME_REV" '{decision:"PASS_PRE_I4_RUNTIME_RULES_UNCHANGED_FOR_BROWSER_ONLY_FIX",runtimeRevision:$revision,runtimeDeploysThisRun:0,rulesDeploysThisRun:0,production:false}' > "$PREI4_OUT/runtime-rules-unchanged.json"

      - name: Deploy exact focal static successor to Hosting DEV once
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          cd "$PREI4_SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:cxorbia-dev" --project "cxorbia-backend-dev" --non-interactive | tee "$GITHUB_WORKSPACE/$PREI4_OUT/hosting-deploy.log"
          cd "$GITHUB_WORKSPACE"
          echo 1 > "$PREI4_OUT/hosting-deploy-count.txt"

      - name: Prove exact served static bytes after focal deploy
        run: |
          set -Eeuo pipefail
          root="https://cxorbia-backend-dev.web.app"; mkdir -p "$PREI4_OUT/remote"
          for rel in             index-backend-dev.html index.html app.js config/runtime.js             core/config.js core/data-source.js core/data.js core/router.js core/finanzas-core.js core/liquidacion.js             adapters/tya-live-source-inplace-apply.js adapters/tya-delegated-coordination-finance-guard-v1.js adapters/tya-canonical-finance-read-model-v2.js adapters/tya-c6-domain-consistency-bridge.js             adapters/cxorbia-command-adapter-v1.js adapters/cxorbia-cxdata-command-boundary-v1.js adapters/tya-protected-auth-hr-authority-bridge-v2.js             modules/dashboard.js modules/misvisitas.js modules/shoppers.js modules/postulaciones.js modules/finanzas.js modules/documentos.js modules/cert.js styles/layout.css; do
            remote="$PREI4_OUT/remote/$(echo "$rel" | tr '/' '_')"
            ok=0
            for attempt in $(seq 1 30); do
              if curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$root/$rel?financep0=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$remote" && cmp "$PREI4_SOURCE_DIR/app/$rel" "$remote"; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done
          curl -fsSL -H 'Cache-Control: no-cache' "$root/__pre_i4_finance_p0__/admin/financiero?financep0=${GITHUB_RUN_ID}" -o "$PREI4_OUT/remote/deep.html"
          cmp "$PREI4_SOURCE_DIR/app/index-backend-dev.html" "$PREI4_OUT/remote/deep.html"
          jq -n -S '{decision:"PASS_PRE_I4_FOCAL_FIX_HOSTING_BYTE_PARITY",hostingDeploysThisRun:1,production:false}' > "$PREI4_OUT/remote-readback.json"

      - name: Force fresh HR read and build same-revision independent reference
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache' "https://cxorbia-backend-dev.web.app/api/tenants/tya/projects/cinepolis/hr-live?view=operational-names&cxOperationalPreview=YES_PAULA_20260731_NAMES_DEV&fresh=1&readback=${GITHUB_RUN_ID}" -o "$PREI4_OUT/hr-fresh.json"
          PREI4_SOURCE_DIR="$PREI4_SOURCE_DIR" node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync(process.env.PREI4_OUT+'/hr-fresh.json','utf8'));
          const key=p?.source?.currentCalendarPeriodKey,period=(p.periods||[]).find(x=>x.key===key),visits=(p.visits||[]).filter(v=>v.periodKey===key);
          const revision=String(p?._runtime?.revision||'');
          if(!/^[a-f0-9]{64}$/.test(revision))throw new Error('SOURCE_FAILURE:HR_REVISION_MISSING');
          if(!period||period.total!==44||period.byCountry?.GT!==34||period.byCountry?.HN!==10)throw new Error('SOURCE_FAILURE:CURRENT_PERIOD_UNIVERSE_DRIFT');
          const cfg=fs.readFileSync(process.env.PREI4_SOURCE_DIR+'/app/adapters/tya-project-financial-model-contract-v1.js','utf8');
          const hm=cfg.match(/tenantId:'tya',projectId:'cinepolis'[\s\S]{0,1400}?honorarium:\{GT:(\d+),HN:(\d+)\}/);
          if(!hm)throw new Error('SOURCE_FAILURE:PROJECT_HONORARIUM_CONFIG_UNRESOLVED');
          const honorarium={GT:Number(hm[1]),HN:Number(hm[2])};
          const known=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));
          const facet=(v,k)=>v?.canonicalFacets?.[k]===true;
          const country=code=>{
            const a=visits.filter(v=>(v.country||v.pais)===code),assigned=a.filter(v=>facet(v,'assigned')||v.assignmentState==='assigned'),realized=a.filter(v=>facet(v,'realized')||v.executionState==='realized');
            const knownReimbursements=realized.reduce((n,v)=>n+(known(v.boleto)?Number(v.boleto):0)+(known(v.comboAmt)?Number(v.comboAmt):0),0);
            const reimbursementPartial=realized.some(v=>!known(v.boleto)||!known(v.comboAmt));
            return {
              total:a.length,availableUnassigned:a.filter(v=>facet(v,'available')&&!facet(v,'assigned')).length,assigned:assigned.length,
              scheduled:a.filter(v=>facet(v,'scheduled')||v.schedulingState==='scheduled').length,
              realized:realized.length,questionnaire:a.filter(v=>facet(v,'questionnaire')).length,submitted:a.filter(v=>facet(v,'submitted')||v.submissionState==='confirmed_hr').length,
              liquidationCandidate:a.filter(v=>facet(v,'liquidationCandidate')).length,liquidationConfirmed:a.filter(v=>facet(v,'liquidationConfirmed')).length,paymentConfirmed:a.filter(v=>facet(v,'paymentConfirmed')).length,
              outOfRange:a.filter(v=>facet(v,'outOfRange')||v.outOfRange===true).length,reviewRequired:a.filter(v=>v.reviewRequired===true).length,
              uniqueAssignedShoppers:new Set(assigned.map(v=>String(v.shopperId||'')).filter(Boolean)).size,
              finance:{realizedCount:realized.length,honorarioDevengado:realized.length*honorarium[code],knownReimbursements,reimbursementPartial,configuredHonorarium:honorarium[code]}
            };
          };
          const GT=country('GT'),HN=country('HN');
          const normName=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
          const identityNames=['Julissa Flores','Julissa Illescas'];
          const identityCases=identityNames.map(name=>{
            const rows=(p.shoppers||[]).filter(s=>normName(s.nombre||s.name)===normName(name));
            if(rows.length!==1)throw new Error('SOURCE_FAILURE:EXACT_IDENTITY_REFERENCE_'+name.replace(/\s+/g,'_').toUpperCase());
            const sourceShopperId=String(rows[0].shopperId||rows[0].id||'');
            const linked=(p.visits||[]).filter(v=>String(v.shopperId||'')===sourceShopperId);
            return {name,sourceShopperId,total:linked.length,realized:linked.filter(v=>facet(v,'realized')||v.executionState==='realized').length};
          });
          if(new Set(identityCases.map(x=>x.sourceShopperId)).size!==identityCases.length)throw new Error('SOURCE_FAILURE:EXACT_IDENTITY_REFERENCE_COLLISION');
          const reference={
            countries:{GT,HN},
            finance:{GT:GT.finance,HN:HN.finance},
            liquidations:{total:GT.realized+HN.realized,GT:GT.realized,HN:HN.realized,paymentsConfirmed:GT.paymentConfirmed+HN.paymentConfirmed,liquidationsConfirmed:GT.liquidationConfirmed+HN.liquidationConfirmed},
            identityCases
          };
          fs.writeFileSync(process.env.PREI4_OUT+'/hr-contrast.json',JSON.stringify({decision:'PASS_PRE_I4_HR_FRESH_CONTRAST',generatedAt:p.generatedAt,sourceRevision:revision,currentPeriodKey:key,currentPeriodId:period.id,projectId:p.projectId,projectName:p.projectName,tabs:period.tabs,GT,HN,reference,runtime:{cacheOrigin:p?._runtime?.cacheOrigin||null,sourceReadAt:p?._runtime?.sourceReadAt||null,refreshFinishedAt:p?._runtime?.refreshFinishedAt||null,shopperProviderWrites:Number(p?._runtime?.shopperReconciliation?.providerWrites||0),visitProviderWrites:Number(p?._runtime?.visitReconciliation?.providerWrites||0)},production:false,hrWrites:0},null,2)+'\n');
          NODE

      - name: Execute focal Admin Shopper desktop mobile against same HR revision
        env:
          CXORBIA_PREI4_ROOT: https://cxorbia-backend-dev.web.app
          CXORBIA_PREI4_SOURCE_SHA: f5b96e853698f9cf96e0752fd641e7e21e9e5ed0
        run: |
          set -Eeuo pipefail
          node tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs
          test "$(jq -r '.decision' "$PREI4_OUT/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"

      - name: Freeze focal static fix PASS
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.decision' "$PREI4_OUT/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"
          test "$(jq -r '.decision' "$PREI4_OUT/hr-contrast.json")" = "PASS_PRE_I4_HR_FRESH_CONTRAST"
          test "$(jq -r '.decision' "$PREI4_OUT/remote-readback.json")" = "PASS_PRE_I4_FOCAL_FIX_HOSTING_BYTE_PARITY"
          test "$(cat "$PREI4_OUT/hosting-deploy-count.txt")" = "1"
          cd "$PREI4_SOURCE_DIR"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$GITHUB_WORKSPACE/$PREI4_OUT/app-postcheck.tar" app
          POST="$(sha256sum "$GITHUB_WORKSPACE/$PREI4_OUT/app-postcheck.tar" | awk '{print $1}')"
          PRE="$(cat "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.sha256")"
          test "$POST" = "$PRE"
          jq -n -S --arg source "f5b96e853698f9cf96e0752fd641e7e21e9e5ed0" --arg artifact "$PRE" --arg hr "$(jq -r '.sourceRevision' "$GITHUB_WORKSPACE/$PREI4_OUT/hr-contrast.json")" '{decision:"PASS_PRE_I4_FOCAL_FIX_SAME_ARTIFACT_DEV",sourceSha:$source,artifactSha256:$artifact,hrRevision:$hr,runtimeBuildsThisRun:0,runtimeDeploysThisRun:0,rulesDeploysThisRun:0,hostingDeploysThisRun:1,browserFocal:true,postulationConflictVisibility:true,misvisitasCanonicalOwner:true,production:false}' > "$GITHUB_WORKSPACE/$PREI4_OUT/final.json"

      - name: Upload focal static fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-pre-i4-focal-fix-${{ github.run_id }}
          path: ${{ env.PREI4_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enforce focal static fix result
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.decision' "$PREI4_OUT/final.json")" = "PASS_PRE_I4_FOCAL_FIX_SAME_ARTIFACT_DEV"

  pre-i4-module-truth-closure:
    name: PRE-I4 exhaustive Module Truth Matrix closure
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MATRIX_OUT: .tmp/pre-i4-module-truth
      MATRIX: RECOVERY-I3-MODULE-TRUTH-MATRIX-20260918.json
      PRODUCT_SOURCE: f5b96e853698f9cf96e0752fd641e7e21e9e5ed0
      PRODUCT_TREE: 755e448b0c19701a1598ed0727edeae64ef766b0
    steps:
      - name: Checkout matrix closure control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exhaustive matrix against exact cumulative source
        run: |
          set -Eeuo pipefail
          mkdir -p "$MATRIX_OUT"
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const m=JSON.parse(fs.readFileSync(process.env.MATRIX,'utf8'));
          if(m.schemaVersion!=='cxorbia.recovery.module-truth-matrix.v6')throw new Error('MAPPING_FAILURE:MATRIX_SCHEMA');
          if(m.productSource?.sha!==process.env.PRODUCT_SOURCE||m.productSource?.treeSha!==process.env.PRODUCT_TREE)throw new Error('RELEASE_COMPOSITION_FAILURE:MATRIX_PRODUCT_SOURCE');
          if(m.rulesSource?.sha!=='2f924e6e2057adef9c0c6be8259d564e15c43573'||m.rulesSource?.blobSha!=='3e5a786ccffb3bea3c2e90d9e259c5e8735209df')throw new Error('RELEASE_COMPOSITION_FAILURE:MATRIX_RULES_SOURCE');
          const badModules=(m.modules||[]).filter(x=>x.classification!=='MATCH'||x.actionRequired!=null);
          if(badModules.length)throw new Error('RELEASE_COMPOSITION_FAILURE:MATRIX_NONMATCH_MODULES:'+badModules.map(x=>x.domain).join(','));
          if((m.modules||[]).length!==20)throw new Error('MAPPING_FAILURE:MATRIX_MODULE_COUNT_'+(m.modules||[]).length);
          const badFiles=[];
          for(const x of m.sourceFiles||[]){
            let blob=null;try{blob=execFileSync('git',['rev-parse',process.env.PRODUCT_SOURCE+':'+x.path],{encoding:'utf8'}).trim();}catch{}
            if(!blob||blob!==x.currentBlob||x.classification!=='MATCH')badFiles.push({path:x.path,expected:x.currentBlob,actual:blob,classification:x.classification});
          }
          if(badFiles.length)throw new Error('RELEASE_COMPOSITION_FAILURE:MATRIX_SOURCE_FILE_MISMATCH:'+JSON.stringify(badFiles.slice(0,20)));
          const nonMatch=(m.sourceFiles||[]).filter(x=>['APPROVED_NOT_COMPOSED','COMPOSED_NOT_DEPLOYED','TRUE_FUNCTIONAL_DEFECT'].includes(x.classification));
          if(nonMatch.length)throw new Error('RELEASE_COMPOSITION_FAILURE:MATRIX_PENDING_CLASSIFICATIONS:'+nonMatch.map(x=>x.path).join(','));
          if(m.entrypointClosure?.allActiveRepoManagedCovered!==true||m.entrypointClosure?.activeRepoManagedOutsideMatrix?.length||m.entrypointClosure?.duplicateSrc?.length||m.entrypointClosure?.unknownActiveOverlays?.length)throw new Error('RELEASE_COMPOSITION_FAILURE:MATRIX_ENTRYPOINT_COVERAGE');
          fs.writeFileSync(process.env.MATRIX_OUT+'/matrix-source-proof.json',JSON.stringify({decision:'PASS_PRE_I4_MATRIX_SOURCE_EXHAUSTIVE',moduleCount:m.modules.length,sourceFileCount:m.sourceFiles.length,activeRepoManaged:m.entrypointClosure.activeRepoManagedScriptCount,nonMatchCount:0,production:false},null,2)+'\n');
          NODE

      - name: Prove current entrypoint load order and all active repo scripts served byte-exact
        run: |
          set -Eeuo pipefail
          rm -rf "$MATRIX_OUT/source"; mkdir -p "$MATRIX_OUT/source" "$MATRIX_OUT/remote"
          git archive "$PRODUCT_SOURCE" | tar -x -C "$MATRIX_OUT/source"
          node <<'NODE' > "$MATRIX_OUT/active-repo-scripts.txt"
          const fs=require('fs');
          const h=fs.readFileSync(process.env.MATRIX_OUT+'/source/app/index-backend-dev.html','utf8');
          const s=[...h.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/gi)].map(x=>x[1].replace(/^\.\//,'').replace(/\?.*$/,''));
          const repo=s.filter(x=>!/^https?:/.test(x)&&!x.startsWith('/__/')).map(x=>x.startsWith('app/')?x:'app/'+x);
          if(s.length!==133||repo.length!==127||new Set(repo).size!==127)throw new Error('RELEASE_COMPOSITION_FAILURE:LIVE_ENTRYPOINT_SCRIPT_SET');
          process.stdout.write(repo.join('\n')+'\n');
          NODE
          root="https://cxorbia-backend-dev.web.app"
          n=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            rel="${path#app/}"
            remote="$MATRIX_OUT/remote/$(printf '%s' "$rel" | tr '/' '_')"
            curl -fsSL --retry 5 --retry-delay 1 -H 'Cache-Control: no-cache' "$root/$rel?matrix=${GITHUB_RUN_ID}-${n}" -o "$remote"
            cmp "$MATRIX_OUT/source/$path" "$remote"
            n=$((n+1))
          done < "$MATRIX_OUT/active-repo-scripts.txt"
          test "$n" = "127"
          curl -fsSL --retry 5 -H 'Cache-Control: no-cache' "$root/index-backend-dev.html?matrix=${GITHUB_RUN_ID}" -o "$MATRIX_OUT/remote/index-backend-dev.html"
          cmp "$MATRIX_OUT/source/app/index-backend-dev.html" "$MATRIX_OUT/remote/index-backend-dev.html"
          curl -fsSL --retry 5 -H 'Cache-Control: no-cache' "$root/styles/layout.css?matrix=${GITHUB_RUN_ID}" -o "$MATRIX_OUT/remote/layout.css"
          cmp "$MATRIX_OUT/source/app/styles/layout.css" "$MATRIX_OUT/remote/layout.css"
          jq -n -S --argjson scripts "$n" '{decision:"PASS_PRE_I4_ALL_ACTIVE_REPO_SERVED_BYTE_EXACT",activeRepoScripts:$scripts,entrypoint:true,layoutCss:true,production:false}' > "$MATRIX_OUT/live-byte-proof.json"

      - name: Bind exact Run333 cumulative focal and Run332 Rules evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$MATRIX_OUT/run333" "$MATRIX_OUT/run332"
          gh run download 35953230892 --repo "$GITHUB_REPOSITORY" --name "cxorbia-pre-i4-postdeploy-readback-35953230892" --dir "$MATRIX_OUT/run333"
          test "$(jq -r '.decision' "$MATRIX_OUT/run333/final.json")" = "PASS_PRE_I4_POSTDEPLOY_READBACK"
          test "$(jq -r '.sourceSha' "$MATRIX_OUT/run333/final.json")" = "$PRODUCT_SOURCE"
          test "$(jq -r '.decision' "$MATRIX_OUT/run333/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"
          test "$(jq -r '.decision' "$MATRIX_OUT/run333/remote-readback.json")" = "PASS_PRE_I4_POSTDEPLOY_REMOTE_BYTE_PARITY"
          test "$(jq -r '.sourceRevision' "$MATRIX_OUT/run333/hr-contrast.json")" = "8f3625f50d760887b5da2d43b34bbf4c881131c300905e2992c7f4cb38a07858"
          test "$(jq -r '.decision' "$MATRIX_OUT/run333/firestore-live-parity.json")" = "PASS_LIVE_FIRESTORE_RULES_EXACT"
          test "$(jq -r '.decision' "$MATRIX_OUT/run333/resource-rules-query-proof.json")" = "PASS_VRM029_FINAL_QUERY_PROOF"
          gh run download 35953009969 --repo "$GITHUB_REPOSITORY" --name "cxorbia-pre-i4-vrm029-rules-35953009969" --dir "$MATRIX_OUT/run332"
          test "$(jq -r '.decision' "$MATRIX_OUT/run332/final.json")" = "PASS_PRE_I4_VRM029_RULES_DEV_EXACT"
          jq -n -S '{decision:"PASS_PRE_I4_BOUND_CUMULATIVE_EVIDENCE",run333:35953230892,run332:35953009969,production:false}' > "$MATRIX_OUT/bound-evidence.json"

      - name: Freeze exhaustive Module Truth PASS
        run: |
          set -Eeuo pipefail
          jq -n -S             --arg source "$PRODUCT_SOURCE"             --arg tree "$PRODUCT_TREE"             --arg rules "2f924e6e2057adef9c0c6be8259d564e15c43573"             --arg hr "8f3625f50d760887b5da2d43b34bbf4c881131c300905e2992c7f4cb38a07858"             '{decision:"PASS_PRE_I4_MODULE_TRUTH_EXHAUSTIVE",sourceSha:$source,sourceTree:$tree,rulesSourceSha:$rules,hrRevision:$hr,moduleCount:20,activeRepoScripts:127,approvedNotComposed:0,composedNotDeployed:0,trueFunctionalDefects:0,duplicateScripts:0,unknownOverlays:0,runtimeDeploysThisRun:0,rulesDeploysThisRun:0,hostingDeploysThisRun:0,production:false}' > "$MATRIX_OUT/final.json"

      - name: Upload exhaustive Module Truth evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-pre-i4-module-truth-${{ github.run_id }}
          path: ${{ env.MATRIX_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enforce exhaustive Module Truth result
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.decision' "$MATRIX_OUT/final.json")" = "PASS_PRE_I4_MODULE_TRUTH_EXHAUSTIVE"
          test "$(jq -r '.decision' "$MATRIX_OUT/live-byte-proof.json")" = "PASS_PRE_I4_ALL_ACTIVE_REPO_SERVED_BYTE_EXACT"
          test "$(jq -r '.decision' "$MATRIX_OUT/matrix-source-proof.json")" = "PASS_PRE_I4_MATRIX_SOURCE_EXHAUSTIVE"

  pre-i4-postdeploy-readback:
    name: PRE-I4 postdeploy no-deploy focal verification
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REQUEST: backend/config/pre-i4-human-entrypoint-dev-deploy-request.json
      PREI4_OUT: .tmp/pre-i4-postdeploy-readback
      PREI4_SOURCE_DIR: .tmp/pre-i4-readback-source
      PREI4_PRIOR: .tmp/pre-i4-prior-deploy
    steps:
      - name: Checkout readback control successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate materialized candidate and zero-deploy continuation
        run: |
          set -Eeuo pipefail
          mkdir -p "$PREI4_OUT"
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8')),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(r.schemaVersion!=='cxorbia.pre-i4.human-entrypoint-dev-deploy.request.v1'||r.requestId!=='pre-i4-visual-remediation-20260923-15')throw new Error('RELEASE_COMPOSITION_FAILURE:READBACK_REQUEST_ID');
          if(r.sourceSha!=='f5b96e853698f9cf96e0752fd641e7e21e9e5ed0'||r.sourceTree!=='755e448b0c19701a1598ed0727edeae64ef766b0'||r.rulesSourceSha!=='2f924e6e2057adef9c0c6be8259d564e15c43573')throw new Error('RELEASE_COMPOSITION_FAILURE:READBACK_SOURCE_DRIFT');
          if(r.status!=='deployed_verify_pending'||r.enabled!==false||r.consumed!==true||Number(r.deployedRunId)!==35949258270||Number(r.deployedRulesRunId)!==35953009969||r.noFurtherDeployBeforeReadback!==true)throw new Error('RELEASE_COMPOSITION_FAILURE:READBACK_CONSUMPTION_STATE');
          if(r.production!==false||r.readbackOnly!==true)throw new Error('RELEASE_COMPOSITION_FAILURE:READBACK_SCOPE_UNSAFE');
          for(const k of ['runtimeBuilds','cloudRunDeploys','runtimeDeploys','rulesDeploys','hostingDeploys'])if(Number(r.nextRun?.[k]||0)!==0)throw new Error('RELEASE_COMPOSITION_FAILURE:READBACK_DEPLOY_NOT_ZERO_'+k);
          execFileSync('git',['merge-base','--is-ancestor',r.sourceSha,head]);
          const changed=execFileSync('git',['diff','--name-only',r.sourceSha,head],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const allowed=[p,'.github/workflows/cxorbia-recovery-i3-dev-certification.yml','tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs','CXORBIA_PRE_I4_VISUAL_REMEDIATION_RUN_STATE_2026-09-22.json','backend/runtime/hr-live-service/test/cxorbia-pre-i4-durability-resources.test.mjs','firestore.rules'].sort();
          if(JSON.stringify(changed)!==JSON.stringify(allowed))throw new Error('RELEASE_COMPOSITION_FAILURE:READBACK_CONTROL_PRODUCT_DRIFT:'+changed.join(','));
          fs.writeFileSync(process.env.PREI4_OUT+'/readback-authorization.json',JSON.stringify({decision:'PASS_PRE_I4_NO_DEPLOY_READBACK_AUTHORIZATION',sourceSha:r.sourceSha,sourceTree:r.sourceTree,deployedRunId:r.deployedRunId,runtimeDeploysThisRun:0,rulesDeploysThisRun:0,hostingDeploysThisRun:0,production:false},null,2)+'\n');
          NODE

      - name: Authenticate existing Firebase DEV for focal verification
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud for rules readback
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Setup Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install focal browser and rules proof tooling
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 firebase-tools@latest firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Read back live Firestore Rules and prove exact shopper resource query
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/projects/cxorbia-backend-dev/releases/cloud.firestore" -o "$PREI4_OUT/firestore-release-live.json"
          RULESET="$(jq -r '.rulesetName // empty' "$PREI4_OUT/firestore-release-live.json")"
          test -n "$RULESET"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/$RULESET" -o "$PREI4_OUT/firestore-ruleset-live.json"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const r=JSON.parse(fs.readFileSync(process.env.PREI4_OUT+'/firestore-ruleset-live.json','utf8'));
          const files=r?.source?.files||[],live=files.find(x=>x.name==='firestore.rules')||files[0],repo=fs.readFileSync('firestore.rules','utf8');
          if(!live||live.content!==repo)throw new Error('SOURCE_FAILURE:LIVE_FIRESTORE_RULES_DRIFT');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          fs.writeFileSync(process.env.PREI4_OUT+'/firestore-live-parity.json',JSON.stringify({decision:'PASS_LIVE_FIRESTORE_RULES_EXACT',liveRulesetName:r.name||null,liveSha256:sha(live.content),repoSha256:sha(repo),exact:true,production:false},null,2)+'\n');
          NODE
          cat > "$PREI4_OUT/resource-rules-query-proof.mjs" <<'NODE'
          import fs from 'node:fs';
          import {initializeTestEnvironment} from '@firebase/rules-unit-testing';
          const [hostname,portText]=String(process.env.FIRESTORE_EMULATOR_HOST||'127.0.0.1:8080').split(':');
          const env=await initializeTestEnvironment({projectId:'cxorbia-rules-proof-final',firestore:{rules:fs.readFileSync('firestore.rules','utf8'),host:hostname,port:Number(portText||8080)}});
          try{
            await env.withSecurityRulesDisabled(async ctx=>{
              const c=ctx.firestore().collection('tenants').doc('tya').collection('resources');
              await c.doc('shopper-visible').set({projectId:'cinepolis',status:'active',visibleRoles:['shopper'],resourceType:'project_resource'});
              await c.doc('admin-only').set({projectId:'cinepolis',status:'active',visibleRoles:['admin'],resourceType:'project_resource'});
              await c.doc('other-project').set({projectId:'other',status:'active',visibleRoles:['shopper'],resourceType:'project_resource'});
            });
            const claims={role:'shopper',tenantId:'tya',projectIds:['cinepolis'],shopperId:'s3',authNamespace:'shopper'};
            const c=env.authenticatedContext('shopper-user',claims).firestore().collection('tenants').doc('tya').collection('resources');
            const read=async p=>{try{const s=await p;return{allowed:true,ids:s.docs?s.docs.map(d=>d.id).sort():[]};}catch(e){return{allowed:false,error:String(e?.code||e?.message||e)};}};
            const query=await read(c.where('projectId','==','cinepolis').where('status','==','active').where('visibleRoles','array-contains','shopper').get());
            const admin=await read(c.doc('admin-only').get()),other=await read(c.doc('other-project').get());
            if(!query.allowed||JSON.stringify(query.ids)!==JSON.stringify(['shopper-visible'])||admin.allowed||other.allowed)throw new Error('AUTH_FAILURE:VRM029_FINAL_RULE_PROOF:'+JSON.stringify({query,admin,other}));
            fs.writeFileSync(process.env.PREI4_OUT+'/resource-rules-query-proof.json',JSON.stringify({decision:'PASS_VRM029_FINAL_QUERY_PROOF',claims,query,adminOnlyDenied:!admin.allowed,otherProjectDenied:!other.allowed,production:false},null,2)+'\n');
          }finally{await env.cleanup();}
          NODE
          npx firebase emulators:exec --only firestore --project cxorbia-rules-proof-final "node '$PREI4_OUT/resource-rules-query-proof.mjs'"

      - name: Bind Run 322 exact deployed evidence
        if: ${{ !contains(github.event.head_commit.message, '[pre-i4-rules-proof-only]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$PREI4_PRIOR"; mkdir -p "$PREI4_PRIOR"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35949258270/artifacts" > "$PREI4_OUT/run322-artifacts.json"
          test "$(jq -r '.artifacts[] | select(.id==10788575182) | .name' "$PREI4_OUT/run322-artifacts.json")" = "cxorbia-pre-i4-focal-fix-35949258270"
          test "$(jq -r '.artifacts[] | select(.id==10788575182) | .digest' "$PREI4_OUT/run322-artifacts.json")" = "sha256:10af30f948bdd1195f0c11847de2395173b701b18132fca87e7fa203695f6b81"
          gh run download 35949258270 --repo "$GITHUB_REPOSITORY" --name "cxorbia-pre-i4-focal-fix-35949258270" --dir "$PREI4_PRIOR"
          test "$(jq -r '.sourceSha' "$PREI4_PRIOR/authorization.json")" = "f5b96e853698f9cf96e0752fd641e7e21e9e5ed0"
          test "$(jq -r '.decision' "$PREI4_PRIOR/authorization.json")" = "PASS_PRE_I4_FOCAL_FIX_AUTHORIZATION"
          test "$(jq -r '.decision' "$PREI4_PRIOR/runtime-rules-unchanged.json")" = "PASS_PRE_I4_RUNTIME_RULES_UNCHANGED_FOR_BROWSER_ONLY_FIX"
          test "$(jq -r '.decision' "$PREI4_PRIOR/remote-readback.json")" = "PASS_PRE_I4_FOCAL_FIX_HOSTING_BYTE_PARITY"
          test "$(jq -r '.decision' "$PREI4_PRIOR/source-gate.json")" = "PASS_PRE_I4_HUMAN_ENTRYPOINT_CONTRACT"
          test "$(cat "$PREI4_PRIOR/hosting-deploy-count.txt")" = "1"
          test "$(jq -r '.decision' "$PREI4_PRIOR/browser-focal.json")" = "FAIL_PRE_I4_FOCAL_HUMAN_BROWSER"
          jq -e '.error | test("Missing or insufficient permissions";"i")' "$PREI4_PRIOR/browser-focal.json" >/dev/null
          cp "$PREI4_PRIOR/app-artifact.sha256" "$PREI4_OUT/app-artifact.sha256"

      - name: Recreate exact product source without build or deploy
        if: ${{ !contains(github.event.head_commit.message, '[pre-i4-rules-proof-only]') }}
        run: |
          set -Eeuo pipefail
          rm -rf "$PREI4_SOURCE_DIR"; mkdir -p "$PREI4_SOURCE_DIR"
          git archive "f5b96e853698f9cf96e0752fd641e7e21e9e5ed0" | tar -x -C "$PREI4_SOURCE_DIR"
          cd "$PREI4_SOURCE_DIR"
          node tools/qa/cxorbia-pre-i4-human-entrypoint-contract-gate.mjs > "$GITHUB_WORKSPACE/$PREI4_OUT/source-gate.json"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$GITHUB_WORKSPACE/$PREI4_OUT/app-readback.tar" app
          NOW="$(sha256sum "$GITHUB_WORKSPACE/$PREI4_OUT/app-readback.tar" | awk '{print $1}')"
          PRIOR="$(cat "$GITHUB_WORKSPACE/$PREI4_OUT/app-artifact.sha256")"
          test "$NOW" = "$PRIOR"

      - name: Re-prove served source bytes without deployment
        if: ${{ !contains(github.event.head_commit.message, '[pre-i4-rules-proof-only]') }}
        run: |
          set -Eeuo pipefail
          root="https://cxorbia-backend-dev.web.app"; mkdir -p "$PREI4_OUT/remote"
          for rel in index-backend-dev.html index.html app.js config/runtime.js core/config.js core/data-source.js core/data.js core/router.js core/finanzas-core.js core/liquidacion.js adapters/tya-live-source-inplace-apply.js adapters/tya-delegated-coordination-finance-guard-v1.js adapters/tya-canonical-finance-read-model-v2.js adapters/tya-c6-domain-consistency-bridge.js adapters/cxorbia-command-adapter-v1.js adapters/cxorbia-cxdata-command-boundary-v1.js adapters/tya-protected-auth-hr-authority-bridge-v2.js modules/dashboard.js modules/misvisitas.js modules/shoppers.js modules/postulaciones.js modules/finanzas.js modules/documentos.js modules/cert.js styles/layout.css; do
            remote="$PREI4_OUT/remote/$(echo "$rel" | tr '/' '_')"
            curl -fsSL --retry 5 --retry-delay 1 -H 'Cache-Control: no-cache' "$root/$rel?readback=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$remote"
            cmp "$PREI4_SOURCE_DIR/app/$rel" "$remote"
          done
          curl -fsSL -H 'Cache-Control: no-cache' "$root/__pre_i4_readback__/shopper/miperfil?readback=${GITHUB_RUN_ID}" -o "$PREI4_OUT/remote/deep.html"
          cmp "$PREI4_SOURCE_DIR/app/index-backend-dev.html" "$PREI4_OUT/remote/deep.html"
          jq -n -S '{decision:"PASS_PRE_I4_POSTDEPLOY_REMOTE_BYTE_PARITY",hostingDeploysThisRun:0,production:false}' > "$PREI4_OUT/remote-readback.json"

      - name: Force fresh HR read and build same-revision independent reference
        if: ${{ !contains(github.event.head_commit.message, '[pre-i4-rules-proof-only]') }}
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache' "https://cxorbia-backend-dev.web.app/api/tenants/tya/projects/cinepolis/hr-live?view=operational-names&cxOperationalPreview=YES_PAULA_20260731_NAMES_DEV&fresh=1&readback=${GITHUB_RUN_ID}" -o "$PREI4_OUT/hr-fresh.json"
          PREI4_SOURCE_DIR="$PREI4_SOURCE_DIR" node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync(process.env.PREI4_OUT+'/hr-fresh.json','utf8'));
          const key=p?.source?.currentCalendarPeriodKey,period=(p.periods||[]).find(x=>x.key===key),visits=(p.visits||[]).filter(v=>v.periodKey===key);
          const revision=String(p?._runtime?.revision||'');
          if(!/^[a-f0-9]{64}$/.test(revision))throw new Error('SOURCE_FAILURE:HR_REVISION_MISSING');
          if(!period||period.total!==44||period.byCountry?.GT!==34||period.byCountry?.HN!==10)throw new Error('SOURCE_FAILURE:CURRENT_PERIOD_UNIVERSE_DRIFT');
          const cfg=fs.readFileSync(process.env.PREI4_SOURCE_DIR+'/app/adapters/tya-project-financial-model-contract-v1.js','utf8');
          const hm=cfg.match(/tenantId:'tya',projectId:'cinepolis'[\s\S]{0,1400}?honorarium:\{GT:(\d+),HN:(\d+)\}/);
          if(!hm)throw new Error('SOURCE_FAILURE:PROJECT_HONORARIUM_CONFIG_UNRESOLVED');
          const honorarium={GT:Number(hm[1]),HN:Number(hm[2])};
          const known=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));
          const facet=(v,k)=>v?.canonicalFacets?.[k]===true;
          const country=code=>{
            const a=visits.filter(v=>(v.country||v.pais)===code),assigned=a.filter(v=>facet(v,'assigned')||v.assignmentState==='assigned'),realized=a.filter(v=>facet(v,'realized')||v.executionState==='realized');
            const knownReimbursements=realized.reduce((n,v)=>n+(known(v.boleto)?Number(v.boleto):0)+(known(v.comboAmt)?Number(v.comboAmt):0),0);
            const reimbursementPartial=realized.some(v=>!known(v.boleto)||!known(v.comboAmt));
            return {
              total:a.length,availableUnassigned:a.filter(v=>facet(v,'available')&&!facet(v,'assigned')).length,assigned:assigned.length,
              scheduled:a.filter(v=>facet(v,'scheduled')||v.schedulingState==='scheduled').length,
              realized:realized.length,questionnaire:a.filter(v=>facet(v,'questionnaire')).length,submitted:a.filter(v=>facet(v,'submitted')||v.submissionState==='confirmed_hr').length,
              liquidationCandidate:a.filter(v=>facet(v,'liquidationCandidate')).length,liquidationConfirmed:a.filter(v=>facet(v,'liquidationConfirmed')).length,paymentConfirmed:a.filter(v=>facet(v,'paymentConfirmed')).length,
              outOfRange:a.filter(v=>facet(v,'outOfRange')||v.outOfRange===true).length,reviewRequired:a.filter(v=>v.reviewRequired===true).length,
              uniqueAssignedShoppers:new Set(assigned.map(v=>String(v.shopperId||'')).filter(Boolean)).size,
              finance:{realizedCount:realized.length,honorarioDevengado:realized.length*honorarium[code],knownReimbursements,reimbursementPartial,configuredHonorarium:honorarium[code]}
            };
          };
          const GT=country('GT'),HN=country('HN');
          const normName=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
          const identityNames=['Julissa Flores','Julissa Illescas'];
          const identityCases=identityNames.map(name=>{
            const rows=(p.shoppers||[]).filter(s=>normName(s.nombre||s.name)===normName(name));
            if(rows.length!==1)throw new Error('SOURCE_FAILURE:EXACT_IDENTITY_REFERENCE_'+name.replace(/\s+/g,'_').toUpperCase());
            const sourceShopperId=String(rows[0].shopperId||rows[0].id||'');
            const linked=(p.visits||[]).filter(v=>String(v.shopperId||'')===sourceShopperId);
            return {name,sourceShopperId,total:linked.length,realized:linked.filter(v=>facet(v,'realized')||v.executionState==='realized').length};
          });
          if(new Set(identityCases.map(x=>x.sourceShopperId)).size!==identityCases.length)throw new Error('SOURCE_FAILURE:EXACT_IDENTITY_REFERENCE_COLLISION');
          const reference={
            countries:{GT,HN},
            finance:{GT:GT.finance,HN:HN.finance},
            liquidations:{total:GT.realized+HN.realized,GT:GT.realized,HN:HN.realized,paymentsConfirmed:GT.paymentConfirmed+HN.paymentConfirmed,liquidationsConfirmed:GT.liquidationConfirmed+HN.liquidationConfirmed},
            identityCases
          };
          fs.writeFileSync(process.env.PREI4_OUT+'/hr-contrast.json',JSON.stringify({decision:'PASS_PRE_I4_HR_FRESH_CONTRAST',generatedAt:p.generatedAt,sourceRevision:revision,currentPeriodKey:key,currentPeriodId:period.id,projectId:p.projectId,projectName:p.projectName,tabs:period.tabs,GT,HN,reference,runtime:{cacheOrigin:p?._runtime?.cacheOrigin||null,sourceReadAt:p?._runtime?.sourceReadAt||null,refreshFinishedAt:p?._runtime?.refreshFinishedAt||null,shopperProviderWrites:Number(p?._runtime?.shopperReconciliation?.providerWrites||0),visitProviderWrites:Number(p?._runtime?.visitReconciliation?.providerWrites||0)},production:false,hrWrites:0},null,2)+'\n');
          NODE

      - name: Execute focal Admin Shopper desktop mobile against same HR revision
        if: ${{ !contains(github.event.head_commit.message, '[pre-i4-rules-proof-only]') }}
        env:
          CXORBIA_PREI4_ROOT: https://cxorbia-backend-dev.web.app
          CXORBIA_PREI4_SOURCE_SHA: f5b96e853698f9cf96e0752fd641e7e21e9e5ed0
        run: |
          set -Eeuo pipefail
          node tools/qa/cxorbia-pre-i4-focal-remote-browser.mjs
          test "$(jq -r '.decision' "$PREI4_OUT/browser-focal.json")" = "PASS_PRE_I4_FOCAL_HUMAN_BROWSER"

      - name: Freeze no-deploy readback PASS
        if: ${{ !contains(github.event.head_commit.message, '[pre-i4-rules-proof-only]') }}
        run: |
