name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

env:
  SOURCE_SHA: 296c8c906e03ad2bf9a06589798f65acd9a94559
  WF: .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  PROJECT: cxorbia-backend-dev
  RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  OUT: .tmp/recovery-i3-iam

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact Recovery source and transport-only delta
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WF"
          printf '{"authorizedBy":"Paula","sourceSha":"%s","transportSha":"%s","production":false,"writes":0}\n' "$SOURCE_SHA" "$GITHUB_SHA" > "$OUT/authorization.json"

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT }}'

      - name: Test exact IAM surfaces read-only
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"permissions":["iam.serviceAccounts.actAs","iam.serviceAccounts.setIamPolicy"]}' \
            "https://iam.googleapis.com/v1/projects/$PROJECT/serviceAccounts/$RUNTIME_SA:testIamPermissions" > "$OUT/service-account-permissions.json"
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"permissions":["resourcemanager.projects.setIamPolicy","resourcemanager.projects.getIamPolicy"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT:testIamPermissions" > "$OUT/project-permissions.json"
          node <<'NODE'
          const fs=require('fs'),p=process.env.OUT;
          const sa=new Set((JSON.parse(fs.readFileSync(p+'/service-account-permissions.json','utf8')).permissions)||[]);
          const pr=new Set((JSON.parse(fs.readFileSync(p+'/project-permissions.json','utf8')).permissions)||[]);
          const result={
            decision:sa.has('iam.serviceAccounts.actAs')?'PASS_ACTAS_PRESENT':(sa.has('iam.serviceAccounts.setIamPolicy')||pr.has('resourcemanager.projects.setIamPolicy')?'IAM_SELF_REPAIR_PATH_EXISTS':'HOLD_EXTERNAL_IAM_REQUIRED'),
            serviceAccount:{actAs:sa.has('iam.serviceAccounts.actAs'),setIamPolicy:sa.has('iam.serviceAccounts.setIamPolicy')},
            project:{getIamPolicy:pr.has('resourcemanager.projects.getIamPolicy'),setIamPolicy:pr.has('resourcemanager.projects.setIamPolicy')},
            iamWrites:0,production:false
          };
          fs.writeFileSync(p+'/iam-surface.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-iam-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14
