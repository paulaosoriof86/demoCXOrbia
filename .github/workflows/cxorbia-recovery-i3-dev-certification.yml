        run: |
          set -Eeuo pipefail
          git diff --quiet "${{ needs.canonical-candidate-authority.outputs.source_sha }}" "$GITHUB_SHA" -- app backend || {
            echo "Product drift exists after descriptor source; diagnostic remains read-only but does not promote it." >&2
          }

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate DEV read only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Install transient Firestore reader
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Read independent project configuration
        run: |
          set -Eeuo pipefail
