          ! grep -q 'localStorage, Firestore ni HR' "$SOURCE_DIR/app/adapters/tya-canonical-shopper-portal-v2.js"
          jq -n -S --arg source "$V21_SOURCE" --arg tree "$V21_TREE" '{decision:"PASS_I3_V21_SOURCE_GATES",sourceSha:$source,sourceTree:$tree,production:false}' > "$V21_OUT/source-gates.json"

      - name: Install DEV tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Authenticate canonical Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
