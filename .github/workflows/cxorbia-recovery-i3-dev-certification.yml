          test "$(jq -r '.normalizedShopperCount' "$SWEEP_OUT/sweep/result.json")" = "78"
          test "$(jq -r '.replay.normalizedShopperCount' "$SWEEP_OUT/sweep/result.json")" = "0"
          test "$(jq -r '.replay.authWrites' "$SWEEP_OUT/sweep/result.json")" = "0"
          test "$(jq -r '.replay.firestoreWrites' "$SWEEP_OUT/sweep/result.json")" = "0"
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" HOSTING_URL="$HOSTING_URL" EXPECTED_HR_REVISION="$HR" VRM217_OUT="$SWEEP_OUT/post" node tools/qa/cxorbia-i3-vrm217-219-population-root-diagnostic.mjs | tee "$SWEEP_OUT/post/console.log"
          test "$(jq -r '.credentials.normalizeCandidates' "$SWEEP_OUT/post/result.json")" = "0"
          test "$(jq -r '.credentials.currentHrReconcileCandidates' "$SWEEP_OUT/post/result.json")" = "0"
          test "$(jq -r '.credentials.durableSweepCandidates' "$SWEEP_OUT/post/result.json")" = "0"
          test "$(jq -r '.identity.exactAliasActivePrincipals' "$SWEEP_OUT/post/result.json")" = "1"
          test "$(jq -r '.identity.holds' "$SWEEP_OUT/post/result.json")" = "17"
          test "$(jq -r '.hrAssignments.unresolved' "$SWEEP_OUT/post/result.json")" = "1"
          test "$(jq -r '.repairPlan.authoritativeAliasRemap.eligible' "$SWEEP_OUT/post/result.json")" = "279"
          test "$(jq -r '.writes' "$SWEEP_OUT/post/result.json")" = "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm217-durable-credential-sweep-${{ github.run_id }}
          path: .tmp/i3-vrm217-sweep
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  vrm219-exact-alias-remap:
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_VRM219_REMAINING_EXACT_ALIAS_REMAP_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      FOCAL_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      FOCAL_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      VRM219_OUT: .tmp/i3-vrm219-remap
      VRM219_INPUT: .tmp/i3-vrm219-input
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preflight exact Run1079 artifact and bounded repair owner
        run: |
          set -Eeuo pipefail
          mkdir -p "$VRM219_OUT" "$VRM219_INPUT"
          test "$(jq -r '.status' "$CANDIDATE_DESCRIPTOR")" = "HOLD_VRM219_REMAINING_EXACT_ALIAS_REMAP_REQUIRED"
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(git rev-parse "$FOCAL_SOURCE^{tree}")" = "$FOCAL_TREE"
          test "$(jq -r '.currentMaterialization.sourceSha' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_SOURCE"
          test "$(jq -r '.currentMaterialization.sourceTree' "$CANDIDATE_DESCRIPTOR")" = "$FOCAL_TREE"
          test "$(jq -r '.currentMaterialization.runId' "$CANDIDATE_DESCRIPTOR")" = "37189599265"
          test "$(jq -r '.currentMaterialization.artifactId' "$CANDIDATE_DESCRIPTOR")" = "11297569172"
          node --check tools/qa/cxorbia-i3-vrm219-exact-alias-remap.mjs
          node --check tools/qa/cxorbia-i3-vrm217-219-population-root-diagnostic.mjs
      - name: Download exact trusted Run1083 population mapping
        uses: actions/download-artifact@v4
        with:
          name: cxorbia-vrm217-219-population-root-37190025557
          path: .tmp/i3-vrm219-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37190025557
      - name: Verify trusted mapping artifact
        run: |
          set -Eeuo pipefail
          test -f "$VRM219_INPUT/result.json"
          test "$(jq -r '.decision' "$VRM219_INPUT/result.json")" = "PASS_VRM217_219_POPULATION_ROOT_DIAGNOSTIC"
          test "$(jq -r '.credentials.normalizeCandidates' "$VRM219_INPUT/result.json")" = "0"
          test "$(jq -r '.credentials.currentHrReconcileCandidates' "$VRM219_INPUT/result.json")" = "0"
          test "$(jq -r '.credentials.durableSweepCandidates' "$VRM219_INPUT/result.json")" = "0"
          test "$(jq -r '.identity.exactAliasActivePrincipals' "$VRM219_INPUT/result.json")" = "1"
          test "$(jq -r '.identity.mappingConflicts' "$VRM219_INPUT/result.json")" = "0"
          test "$(jq -r '.hrAssignments.unresolved' "$VRM219_INPUT/result.json")" = "1"
          test "$(jq -r '.residualEvidence.aliasVsDeclaredCanonical.aliasProfile != null' "$VRM219_INPUT/result.json")" = "true"
          test "$(jq -r '.residualEvidence.aliasVsDeclaredCanonical.canonicalProfile == null' "$VRM219_INPUT/result.json")" = "true"
          test "$(jq -r '.residualEvidence.aliasVsDeclaredCanonical.links[0].authorityType' "$VRM219_INPUT/result.json")" = "tenant_adjudication"
          test "$(jq -r '.operationalAliasReferences.liquidations' "$VRM219_INPUT/result.json")" = "4"
          test "$(jq -r '.visits.ambiguousAuthorityGroups' "$VRM219_INPUT/result.json")" = "0"
      - name: Install bounded repair dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}
      - name: Verify unchanged DEV materialization and HR
        run: |
          set -Eeuo pipefail
          EXPECTED_RUNTIME="$(jq -r '.currentMaterialization.runtimeRevision' "$CANDIDATE_DESCRIPTOR")"
          EXPECTED_DIGEST="$(jq -r '.currentMaterialization.runtimeDigest' "$CANDIDATE_DESCRIPTOR")"
          EXPECTED_HOSTING="$(jq -r '.currentMaterialization.hostingVersion' "$CANDIDATE_DESCRIPTOR")"
          EXPECTED_HR="$(jq -r '.currentMaterialization.hrRevision' "$CANDIDATE_DESCRIPTOR")"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$VRM219_OUT/runtime.json"
          test "$(jq -r '.status.latestReadyRevisionName' "$VRM219_OUT/runtime.json")" = "$EXPECTED_RUNTIME"
          gcloud run revisions describe "$EXPECTED_RUNTIME" --project "$PROJECT" --region "$REGION" --format=json > "$VRM219_OUT/revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$VRM219_OUT/revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          test "$DIGEST" = "$EXPECTED_DIGEST"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$VRM219_OUT/hosting.json"
          test "$(jq -r '.release.version.name' "$VRM219_OUT/hosting.json")" = "$EXPECTED_HOSTING"
          curl -fsS --retry 8 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/api/$TENANT_ID/$PROJECT_ID/hr-live?format=meta&vrm219=$GITHUB_RUN_ID" > "$VRM219_OUT/hr-meta.json"
          test "$(jq -r '.revision' "$VRM219_OUT/hr-meta.json")" = "$EXPECTED_HR"
          echo "EXPECTED_HR=$EXPECTED_HR" >> "$GITHUB_ENV"
      - name: Execute bounded exact-alias remap only
        run: |
          set -Eeuo pipefail
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" HOSTING_URL="$HOSTING_URL" EXPECTED_HR_REVISION="$EXPECTED_HR" VRM219_DIAGNOSTIC="$VRM219_INPUT/result.json" VRM219_OUT="$VRM219_OUT" node tools/qa/cxorbia-i3-vrm219-exact-alias-remap.mjs | tee "$VRM219_OUT/console.log"
          test "$(jq -r '.decision' "$VRM219_OUT/result.json")" = "PASS_VRM219_EXACT_ALIAS_REPAIR"
          test "$(jq -r '.groups' "$VRM219_OUT/result.json")" = "1"
          test "$(jq -r '.aliases' "$VRM219_OUT/result.json")" = "1"
          test "$(jq -r '.replays' "$VRM219_OUT/result.json")" = "1"
          test "$(jq -r '.hrWrites' "$VRM219_OUT/result.json")" = "0"
          test "$(jq -r '.externalWrites' "$VRM219_OUT/result.json")" = "0"
          test "$(jq -r '.production' "$VRM219_OUT/result.json")" = "false"
      - name: Read-only population post-readback
        run: |
          set -Eeuo pipefail
          mkdir -p "$VRM219_OUT/post"
          PROJECT="$PROJECT" TENANT_ID="$TENANT_ID" PROJECT_ID="$PROJECT_ID" HOSTING_URL="$HOSTING_URL" EXPECTED_HR_REVISION="$EXPECTED_HR" VRM217_OUT="$VRM219_OUT/post" node tools/qa/cxorbia-i3-vrm217-219-population-root-diagnostic.mjs | tee "$VRM219_OUT/post/console.log"
          test "$(jq -r '.decision' "$VRM219_OUT/post/result.json")" = "PASS_VRM217_219_POPULATION_ROOT_DIAGNOSTIC"
          test "$(jq -r '.credentials.normalizeCandidates' "$VRM219_OUT/post/result.json")" = "0"
          test "$(jq -r '.credentials.currentHrReconcileCandidates' "$VRM219_OUT/post/result.json")" = "0"
          test "$(jq -r '.credentials.durableSweepCandidates' "$VRM219_OUT/post/result.json")" = "0"
          test "$(jq -r '.identity.exactAliasActivePrincipals' "$VRM219_OUT/post/result.json")" = "0"
          test "$(jq -r '.identity.mappingConflicts' "$VRM219_OUT/post/result.json")" = "0"
          test "$(jq -r '.hrAssignments.unresolved' "$VRM219_OUT/post/result.json")" = "1"
          test "$(jq -r '.residualEvidence.aliasVsDeclaredCanonical.canonicalProfile != null' "$VRM219_OUT/post/result.json")" = "true"
          test "$(jq -r '.operationalAliasReferences.liquidations' "$VRM219_OUT/post/result.json")" = "0"
          test "$(jq -r '.visits.ambiguousAuthorityGroups' "$VRM219_OUT/post/result.json")" = "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-vrm219-exact-alias-remap-${{ github.run_id }}
          path: .tmp/i3-vrm219-remap
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
