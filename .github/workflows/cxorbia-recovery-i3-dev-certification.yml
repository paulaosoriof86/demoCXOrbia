          test "$(jq -r '.terminalClosure.decision' "$T/out.json")" = "PASS_C3_TERMINAL_MODULE_TRUTH_20_20"
          test "$(jq -r '.modules[]|select(.domain=="m0")|.preTerminalClassification' "$T/out.json")" = "COMPOSED_NOT_DEPLOYED"
          test "$(jq -r '.modules[]|select(.domain=="m1")|.preTerminalClassification' "$T/out.json")" = "COMPOSED_NOT_DEPLOYED"
          test "$(jq -r '.modules[]|select(.domain=="m0")|.ownerSpecificReceiptFindingIds[0]' "$T/out.json")" = "VRM-082"
          test "$(jq -r '.modules[]|select(.domain=="m1")|.ownerSpecificReceiptFindingIds[0]' "$T/out.json")" = "VRM-082"
          test "$(jq '[.modules[]|select(.classification!="MATCH")]|length' "$T/out.json")" = "0"
          jq -n -S --arg source "$GITHUB_SHA" '{decision:"PASS_I3_VRM087_FINALIZER_RECEIPT_SCOPE_SELFTEST",controlSourceSha:$source,openP0Rejected:true,missingReceiptRejected:true,multiDomainReceiptRequired:true,hrIndependentNullAccepted:true,nullHrWithoutIndependenceRejected:true,staleRequiredReceiptRejected:true,staleHistoricalReceiptIgnoredWhenNoPromotionNeeded:true,wrongPromotionPrevented:true,ownerReceiptPromotionProven:true,builds:0,deploys:0,writes:0,production:false}' > "$T/result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-vrm076-finalizer-${{ github.run_id }}
          path: ${{ runner.temp }}/vrm076
          if-no-files-found: error
          retention-days: 30
