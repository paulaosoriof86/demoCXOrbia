          test "$(jq -r '.decision' "$V21_OUT/v21-paula-remediation-live.json")" = "PASS_I3_V21_PAULA_REMEDIATION_LIVE"
          test "$(jq -r '.shopper.sourceRevision' "$V21_OUT/v21-paula-remediation-live.json")" = "$HR_REVISION"
          test "$(jq -r '.admin.sourceRevision' "$V21_OUT/v21-paula-remediation-live.json")" = "$HR_REVISION"

      - name: Seal readback-only receipt
        run: |
          jq -n -S --arg source "$V21_SOURCE" --arg tree "$V21_TREE" --arg runtime "$EXPECTED_RUNTIME_REVISION" --arg digest "$EXPECTED_RUNTIME_DIGEST" --arg hosting "$EXPECTED_HOSTING_VERSION" --arg hr "$HR_REVISION" '{decision:"PASS_I3_V21_STABLE_READBACK_AND_LIVE_FOCAL",sourceSha:$source,sourceTree:$tree,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,hrRevision:$hr,builds:0,runtimeDeploys:0,hostingDeploys:0,rulesDeploys:0,production:false}' > "$V21_OUT/result.json"

