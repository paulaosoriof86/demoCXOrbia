permissions:
  contents: read
  actions: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: true

env:
  CANDIDATE_DESCRIPTOR: CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
  FINDINGS_LEDGER: CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_2026-09-24.json
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  HOSTING_SITE: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  PERIOD_ID: cinepolis-2026-09
  LEGAL_ENABLE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED
  LEGAL_ENABLE_VALUE: 'true'
  LEGAL_GATE_NAME: CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE
  LEGAL_GATE_VALUE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME
  I3_HR_CACHE_PIN_NAME: CXORBIA_LIVE_HR_CACHE_MS
  I3_HR_CACHE_PIN_VALUE: '3600000'
  OUT: .tmp/recovery-i3-dev-certification
  POST_RUN500_LOCK: CXORBIA_I3_POST_RUN500_FORENSIC_DRIFT_LOCK_2026-09-26.json
  POST_RUN500_LEDGER: CXORBIA_I3_CANONICAL_CUMULATIVE_FINDINGS_LEDGER_FULL_V151_2026-09-30.json

jobs:
  canonical-candidate-authority:
    name: I3 single canonical candidate authority guard
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
      source_tree: ${{ steps.authority.outputs.source_tree }}
      status: ${{ steps.authority.outputs.status }}
    steps:
      - name: Checkout canonical Recovery control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and prove sole executable candidate
        id: authority
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/canonical-candidate-authority
          node tools/qa/cxorbia-i3-canonical-candidate-authority-guard.mjs | tee .tmp/canonical-candidate-authority/result.json
          SOURCE="$(jq -r '.productSourceSha' .tmp/canonical-candidate-authority/result.json)"
          TREE="$(jq -r '.productSourceTree' .tmp/canonical-candidate-authority/result.json)"
          STATUS="$(jq -r '.status // empty' "$CANDIDATE_DESCRIPTOR")"
          test -n "$SOURCE"
          test -n "$TREE"
          test -n "$STATUS"
          test "$(jq -r '.status' "$POST_RUN500_LOCK")" = "HOLD"
          test "$(jq -r '.currentState.i3' "$POST_RUN500_LOCK")" = "HOLD"
          test "$(jq -r '.canonicalFunctionalCandidate.sourceSha' "$POST_RUN500_LEDGER")" = "$SOURCE"
          test "$(jq -r '.canonicalFunctionalCandidate.sourceTree' "$POST_RUN500_LEDGER")" = "$TREE"
          test "$(jq -r '.findings["VRM-076"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN502"
          test "$(jq -r '.findings["VRM-077"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN507"
          test "$(jq -r '.findings["VRM-078"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN515"
          test "$(jq -r '.findings["VRM-079"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN518"
          test "$(jq -r '.findings["VRM-080"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN525"
          test "$(jq -r '.findings["VRM-081"].state' "$POST_RUN500_LEDGER")" = "FIXED_PROVEN_RUN547"
          [[ "$STATUS" == "READY_FOR_TERMINAL_CERTIFICATION" || "$STATUS" == "HOLD_VRM082_NAME_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_VRM082_ALIAS_MATCH_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_VRM083_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_VRM083_DEV_MATERIALIZATION_REQUIRED" || "$STATUS" == "HOLD_VRM083_DEV_MATERIALIZED_REPROOF_REQUIRED" || "$STATUS" == "HOLD_MODULE_TRUTH_REPROOF_REQUIRED" || "$STATUS" == "HOLD_VRM084_HOSTING_MATERIALIZATION_REQUIRED" || "$STATUS" == "HOLD_VRM085_POSTULATION_SYNC_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_VRM086_IDENTITY_ALIAS_CONTROL_REPROOF_REQUIRED" || "$STATUS" == "HOLD_VRM087_FINALIZER_RECEIPT_SCOPE_REPROOF_REQUIRED" || "$STATUS" == "HOLD_VRM088_LIVE_FIXTURE_AVAILABILITY_REPROOF_REQUIRED" || "$STATUS" == "READY_FOR_GATE21_SAME_CERTIFIED_ARTIFACT" || "$STATUS" == "HOLD_PREI4_ADMIN_008_HR_MAPPING_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_008_DEV_RUNTIME_MATERIALIZATION_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_002_POSTULACIONES_RECOVERY_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_002_POSTULACIONES_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_002_SOURCE_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_002_HOSTING_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_003_IDENTITY_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_003_OWNER_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_003_SOURCE_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_CUMULATIVE_REGRESSION_SOURCE_GUARD_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_003_CUMULATIVE_SOURCE_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_003_CUMULATIVE_LIVE_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_003_CUMULATIVE_LIVE_RESUME_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_004_FINANCE_DIAGNOSTIC_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_004_FINANCE_DIAGNOSTIC_RUNNING" || "$STATUS" == "HOLD_PREI4_ADMIN_004_SOURCE_REPROOF_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_004_DEV_MATERIALIZATION_REQUIRED" || "$STATUS" == "HOLD_PREI4_ADMIN_004_CLOSED_REGRESSION_HARNESS_REPROOF_REQUIRED" || "$STATUS" == "GO" ]]
          echo "source_sha=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "source_tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"


  prei4-admin-008-mapping-reproof:
    name: PRE-I4 ADMIN-008 — HN HR mapping focal reproof
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_PREI4_ADMIN_008_HR_MAPPING_REPROOF_REQUIRED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical Recovery control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove exact product source and control-only successor
        env:
          SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
          TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE" = "5c472e089e6d8492b184a7cb24e78816d347c2de"
          test "$TREE" = "8abf63499d3df6ef2a9a8dfa22ca1a080ed67c83"
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          test "$(git diff --name-only "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source | wc -l | tr -d ' ')" = "0"
      - name: Execute PREI4-ADMIN-008 source-safe self-tests
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/prei4-admin-008
          node --check tools/hr-source/tya-build-live-hr-source-safe-r20.mjs
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --mapping-self-test | tee .tmp/prei4-admin-008/mapping-self-test.json
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --assignment-self-test | tee .tmp/prei4-admin-008/assignment-self-test.json
          test "$(jq -r '.decision' .tmp/prei4-admin-008/mapping-self-test.json)" = "PASS_R20_PROJECT_SCOPED_CINEMA_IDENTITY"
          test "$(jq -r '.decision' .tmp/prei4-admin-008/assignment-self-test.json)" = "PASS_R20_SHOPPER_ASSIGNMENT_CLASSIFICATION"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-prei4-admin-008-mapping-reproof-${{ github.run_id }}
          path: .tmp/prei4-admin-008
          if-no-files-found: error
          retention-days: 30
          compression-level: 0


  prei4-admin-008-runtime-materialization:
    name: PRE-I4 ADMIN-008 — fresh HR runtime-only DEV materialization
    needs: canonical-candidate-authority
    if: ${{ needs.canonical-candidate-authority.outputs.status == 'HOLD_PREI4_ADMIN_008_DEV_RUNTIME_MATERIALIZATION_REQUIRED' && github.event_name == 'push' && contains(github.event.head_commit.message, '[prei4-admin-008-runtime]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PREI4_008_SOURCE: ${{ needs.canonical-candidate-authority.outputs.source_sha }}
      PREI4_008_TREE: ${{ needs.canonical-candidate-authority.outputs.source_tree }}
      PREI4_008_OUT: .tmp/prei4-admin-008-runtime
      PREI4_008_ROOT: https://cxorbia-backend-dev.web.app
      PREI4_008_STALE_REVISION: d068b00c62a940f0ad828436ffcf22fbf1dbb43e763ab4e14854102bf5f84a51
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Prove exact focal source and three-owner product delta
        run: |
          set -Eeuo pipefail
          mkdir -p "$PREI4_008_OUT"
          test "$PREI4_008_SOURCE" = "5c472e089e6d8492b184a7cb24e78816d347c2de"
          test "$PREI4_008_TREE" = "8abf63499d3df6ef2a9a8dfa22ca1a080ed67c83"
          test "$(git rev-parse "$PREI4_008_SOURCE^{tree}")" = "$PREI4_008_TREE"
          PRODUCT_DIFF="$(git diff --name-only "09b4e56be96dedbeb89d14f1d190bfc5b8b4f990" "$PREI4_008_SOURCE" -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source | sort)"
          EXPECTED="$(printf '%s\n' 'backend/contracts/tya-cinepolis-cinema-identity-r20-v1.json' 'backend/contracts/tya-hr-column-map-r20-v1.json' 'tools/hr-source/tya-build-live-hr-source-safe-r20.mjs' | sort)"
          test "$PRODUCT_DIFF" = "$EXPECTED"
          git diff --quiet "$PREI4_008_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source
          SOURCE_DIR="$RUNNER_TEMP/cxorbia-prei4-admin008-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$PREI4_008_SOURCE" | tar -x -C "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          node --check tools/hr-source/tya-build-live-hr-source-safe-r20.mjs
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --mapping-self-test | tee "$GITHUB_WORKSPACE/$PREI4_008_OUT/mapping-self-test.json"
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --assignment-self-test | tee "$GITHUB_WORKSPACE/$PREI4_008_OUT/assignment-self-test.json"
          test "$(jq -r '.decision' "$GITHUB_WORKSPACE/$PREI4_008_OUT/mapping-self-test.json")" = "PASS_R20_PROJECT_SCOPED_CINEMA_IDENTITY"
          test "$(jq -r '.decision' "$GITHUB_WORKSPACE/$PREI4_008_OUT/assignment-self-test.json")" = "PASS_R20_SHOPPER_ASSIGNMENT_CLASSIFICATION"
          cd "$GITHUB_WORKSPACE"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Authenticate Recovery DEV only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Capture immutable DEV state before runtime materialization
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$PREI4_008_OUT/hosting-before.json"
          HOSTING_VERSION="$(jq -r '.release.version.name // empty' "$PREI4_008_OUT/hosting-before.json")"; test -n "$HOSTING_VERSION"
          echo "PREI4_008_HOSTING_VERSION=$HOSTING_VERSION" >> "$GITHUB_ENV"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$PREI4_008_OUT/runtime-before.json"

      - name: Build exact PREI4-ADMIN-008 runtime once
        run: |
          set -Eeuo pipefail
          IMAGE_URI="gcr.io/${PROJECT}/${SERVICE}:prei4-admin008-${PREI4_008_SOURCE:0:12}-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$PREI4_008_OUT/image-uri.txt"
          gcloud builds submit "$SOURCE_DIR" --project "$PROJECT" --config "$SOURCE_DIR/backend/runtime/hr-live-service/cloudbuild.yaml" --substitutions "_IMAGE=$IMAGE_URI" --quiet

      - name: Deploy exact runtime once to Recovery DEV
        run: |
          set -Eeuo pipefail
          IMAGE_URI="$(cat "$PREI4_008_OUT/image-uri.txt")"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --min-instances=1 --max-instances=1 --update-env-vars "$LEGAL_ENABLE_NAME=$LEGAL_ENABLE_VALUE,$LEGAL_GATE_NAME=$LEGAL_GATE_VALUE,$I3_HR_CACHE_PIN_NAME=$I3_HR_CACHE_PIN_VALUE" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$PREI4_008_OUT/runtime-after.json"
          REV="$(jq -r '.status.latestReadyRevisionName // empty' "$PREI4_008_OUT/runtime-after.json")"; test -n "$REV"
          gcloud run revisions describe "$REV" --project "$PROJECT" --region "$REGION" --format=json > "$PREI4_008_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$PREI4_008_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          echo "PREI4_008_RUNTIME_REVISION=$REV" >> "$GITHUB_ENV"
          echo "PREI4_008_RUNTIME_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Require one coherent fresh HR revision and exact August September authority
        run: |
          set -Eeuo pipefail
          ok=0
          for i in $(seq 1 18); do
            URL="$PREI4_008_ROOT/api/$TENANT_ID/$PROJECT_ID/hr-live?fresh=1&prei4admin008=$GITHUB_RUN_ID-$i"
            if curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "$URL" > "$PREI4_008_OUT/hr-fresh.json"; then
              if node - "$PREI4_008_OUT/hr-fresh.json" "$PREI4_008_STALE_REVISION" <<'NODE'
          const fs=require('fs');
          const [file,stale]=process.argv.slice(2);
          const d=JSON.parse(fs.readFileSync(file,'utf8'));
          const runtime=d._runtime||{};
          const revision=String(runtime.revision||d.revision||d.sourceRevision||'');
          const refreshError=runtime.refreshError??runtime.lastRefreshError??d.refreshError??d.lastRefreshError??null;
          const summary=Array.isArray(d.periodOperationalSummary)?d.periodOperationalSummary:[];
          const aug=summary.find(x=>String(x.periodKey)==='2026-08');
          const sep=summary.find(x=>String(x.periodKey)==='2026-09');
          const expected={
            aug:{total:44,available:1,assigned:43,unassigned:1,scheduled:0,pendingSchedule:0,realized:43,pendingQuestionnaire:3,questionnaireCompleted:40,pendingSubmission:8,submitted:32,liquidationConfirmed:0,outOfRange:12},
            sep:{total:44,assigned:44,unassigned:0,scheduled:4,pendingSchedule:0,realized:40,pendingQuestionnaire:6,questionnaireCompleted:34,pendingSubmission:7,submitted:27,liquidationConfirmed:0,outOfRange:2,reviewRequired:11}
          };
          function exact(row,want){return row&&Object.entries(want).every(([k,v])=>Number(row[k])===v);}
          const reasons=(d.visits||[]).filter(v=>v.periodKey==='2026-09'&&v.reviewRequired===true).flatMap(v=>v.reviewReasons||[]);
          const septemberSubmittedWithoutQuestionnaire=reasons.filter(x=>x==='submitted_without_questionnaire_date').length;
          const pass=/^[0-9a-f]{64}$/.test(revision)&&revision!==stale&&refreshError==null&&exact(aug,expected.aug)&&exact(sep,expected.sep)&&Number(sep?.byCountry?.GT)===34&&Number(sep?.byCountry?.HN)===10&&Number(sep?.total)===44&&septemberSubmittedWithoutQuestionnaire===11&&d.sourceSafe===true&&d.production===false;
          const receipt={decision:pass?'PASS_PREI4_ADMIN_008_FRESH_HR':'HOLD_PREI4_ADMIN_008_FRESH_HR',revision,staleRevision:stale,refreshError,august:aug||null,september:sep||null,septemberSubmittedWithoutQuestionnaire,sourceSafe:d.sourceSafe===true,production:d.production===true,safeState:d.safeState||null};
          fs.writeFileSync(process.env.PREI4_008_OUT+'/fresh-authority.json',JSON.stringify(receipt,null,2)+'\n');
