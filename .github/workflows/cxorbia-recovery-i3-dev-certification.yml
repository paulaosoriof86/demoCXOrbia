          jq -n -S --arg source "$VRM044_SOURCE" --arg tree "$VRM044_TREE" --arg image "$IMAGE_URI"             '{decision:"PASS_VRM044_ONE_BUILD",sourceSha:$source,sourceTree:$tree,imageTag:$image,buildCount:1,production:false}'             > "$VRM044_OUT/build.json"

