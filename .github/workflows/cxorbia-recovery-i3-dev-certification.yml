name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: 296c8c906e03ad2bf9a06589798f65acd9a94559
  WF: .github/workflows/cxorbia-recovery-i3-dev-certification.yml
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  HOSTING: cxorbia-dev
  ROOT: https://cxorbia-backend-dev.web.app
  OUT: .tmp/recovery-i3-dev

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze transport
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          echo "SRC=$RUNNER_TEMP/recovery-source" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WF"
          printf '{"authorizedBy":"Paula","sourceSha":"%s","transportSha":"%s","project":"%s","production":false,"singleLane":true}\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$PROJECT" > "$OUT/authorization.json"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate existing Firebase DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT }}'

      - name: Install gcloud beta noninteractive
        run: gcloud components install beta --quiet

      - name: Exact source and Gate 6 source tests
        run: |
          set -euo pipefail
          git worktree add --detach "$SRC" "$SOURCE_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"
          cd "$SRC"
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/cxorbia-command-runtime-v1.mjs
          node --check backend/runtime/hr-live-service/server.mjs
          node --test backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs \
            | tee "$GITHUB_WORKSPACE/$OUT/gate6-unit.tap"
          grep -Fq 'cxorbia-shopper-command-provider-v1.mjs' backend/runtime/hr-live-service/Dockerfile

      - name: Deploy exact source to Cloud Run DEV without build
        id: runtime
        run: |
          set -euo pipefail
          current_sa="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test "$current_sa" = "$RUNTIME_SA"
          cd "$SRC/backend/runtime/hr-live-service"
          npm install --omit=dev --ignore-scripts --package-lock=false
          npm ls --all --json > "$GITHUB_WORKSPACE/$OUT/runtime-dependencies.json"
          cd "$SRC"
          source_tree="$(git rev-parse HEAD^{tree})"
          dep_hash="$(find backend/runtime/hr-live-service/node_modules -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf '{"sourceSha":"%s","sourceTree":"%s","dependencyTreeHash":"%s","firebaseAdmin":"13.4.0","node":"24","buildMode":"cloud_run_source_no_build","production":false}\n' \
            "$SOURCE_SHA" "$source_tree" "$dep_hash" > "$GITHUB_WORKSPACE/$OUT/source-package.json"
          gcloud beta run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --source "$SRC" \
            --no-build \
            --base-image="us-central1-docker.pkg.dev/serverless-runtimes/google-24-full/runtimes/nodejs24" \
            --command=node \
            --args=backend/runtime/hr-live-service/server.mjs \
            --update-env-vars="CXORBIA_RECOVERY_SOURCE_SHA=$SOURCE_SHA,CXORBIA_ENVIRONMENT=DEV" \
            --quiet
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          rev="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          after_sa="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test "$after_sa" = "$RUNTIME_SA"
          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" \
            "https://run.googleapis.com/v2/projects/$PROJECT/locations/$REGION/services/$SERVICE" \
            > "$GITHUB_WORKSPACE/$OUT/cloud-run-v2.json"
          OUT="$GITHUB_WORKSPACE/$OUT" SOURCE_SHA="$SOURCE_SHA" REV="$rev" URL="$url" node <<'NODE'
          const fs=require('fs');
          const out=process.env.OUT;
          const v2=JSON.parse(fs.readFileSync(out+'/cloud-run-v2.json','utf8'));
          const c=v2.template?.containers?.[0]||{};
          const source=c.sourceCode?.cloudStorageSource||null;
          if(!source||!source.bucket||!source.object) throw new Error('SOURCE_CODE_READBACK_MISSING');
          const env=Object.fromEntries((c.env||[]).map(x=>[x.name,x.value]));
          if(env.CXORBIA_RECOVERY_SOURCE_SHA!==process.env.SOURCE_SHA) throw new Error('SOURCE_SHA_ENV_READBACK_MISMATCH');
          fs.writeFileSync(out+'/runtime.json',JSON.stringify({
            revision:process.env.REV,url:process.env.URL,sourceSha:process.env.SOURCE_SHA,
            buildMode:'cloud_run_source_no_build',baseImageUri:c.baseImageUri||null,
            sourceCode:{bucket:source.bucket,object:source.object,generation:source.generation||null},
            production:false
          },null,2)+'\n');
          NODE
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Gate 6 runtime and durable identity readback
        run: |
          set -euo pipefail
          url='${{ steps.runtime.outputs.url }}'
          curl -fsS --retry 12 --retry-delay 4 "$url/health" > "$OUT/health.json"
          curl -fsS --retry 8 --retry-delay 4 "$url/api/tya/cinepolis/hr-live?format=meta&fresh=1" > "$OUT/meta.json"
          curl -fsS --retry 8 --retry-delay 4 "$url/api/tya/cinepolis/hr-live?fresh=1" > "$RUNNER_TEMP/hr.json"
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
          cat > "$RUNNER_TEMP/readback.mjs" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';

          const out=process.env.OUT;
          const health=JSON.parse(fs.readFileSync(out+'/health.json','utf8'));
          const metaRaw=JSON.parse(fs.readFileSync(out+'/meta.json','utf8'));
          const meta=metaRaw.meta||metaRaw;
          const reconciliation=meta.shopperReconciliation;
          if(health.ok!==true||health.production!==false||health.shopperReconciliationReady!==true) throw new Error('G6_HEALTH');
          if(meta.sourceSafe!==true||meta.runtimeRead!==true||meta.production!==false||!reconciliation||reconciliation.ok!==true||
             reconciliation.providerAck!==true||reconciliation.hrWrites!==0||reconciliation.externalWrites!==0||
             reconciliation.fuzzyMatching!==false||String(reconciliation.sourceRevision)!==String(meta.revision)) throw new Error('G6_RECONCILIATION');

          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/hr.json','utf8'));
          const snapshot=raw.snapshot||raw.data||raw;
          const tenantId=String(snapshot.tenantId||snapshot.tenantConfig?.tenantId||'');
          const projectId=String(snapshot.projectId||snapshot.projectConfig?.projectId||'');
          if(snapshot.sourceSafe!==true||!tenantId||!projectId) throw new Error('G6_SOURCE');

          const ids=new Set([...(snapshot.shoppers||[]),...(snapshot.visits||[])].map(x=>String(x.shopperId||x.id||'')).filter(Boolean));
          initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(),auth=getAuth(),tenant=db.collection('tenants').doc(tenantId);
          const fingerprint=uid=>crypto.createHash('sha256').update('cxorbia-provider-uid-v1\0'+uid).digest('hex');
          let bad=0,duplicates=0;
          for(const id of ids){
            const [profile,cross,members]=await Promise.all([
              tenant.collection('shoppers').doc(id).get(),
              tenant.collection('shopperIdentityCrosswalk').doc(id).get(),
              tenant.collection('users').where('shopperId','==',id).limit(2).get()
            ]);
            if(!profile.exists||!cross.exists||members.size!==1){bad++;if(members.size>1)duplicates++;continue;}
            const member=members.docs[0], user=await auth.getUser(member.id), claims=user.customClaims||{};
            if(String(claims.tenantId)!==tenantId||String(claims.shopperId)!==id||claims.role!=='shopper'||
               claims.authNamespace!=='shopper'||String(cross.data().providerUidFingerprint||'')!==fingerprint(member.id)) bad++;
          }
          if(!ids.size||bad||duplicates||Number(reconciliation.shopperCount)!==ids.size) throw new Error(`G6_DURABLE_BAD_${bad}_DUP_${duplicates}`);
          fs.writeFileSync(out+'/gate6.json',JSON.stringify({
            decision:'PASS_GATE6_HR_SHOPPER_UPSERT_IDEMPOTENT',
            revision:String(meta.revision),shoppers:ids.size,authCreated:Number(reconciliation.authCreated||0),
            idempotentReplays:Number(reconciliation.idempotentReplays||0),duplicates:0,hrWrites:0,production:false,piiExported:false
          },null,2)+'\n');
          NODE
          OUT="$OUT" PROJECT="$PROJECT" node "$RUNNER_TEMP/readback.mjs"
          rm -f "$RUNNER_TEMP/hr.json" "$RUNNER_TEMP/readback.mjs"

      - name: Exact Hosting DEV and byte parity
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest playwright@1.54.2 >/dev/null 2>&1
          cd "$SRC"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy \
            --config firebase.json --only "hosting:$HOSTING" --project "$PROJECT" --non-interactive
          cd "$GITHUB_WORKSPACE"
          for asset in index-backend-dev.html modules/shoppers.js; do
            curl -fsSL --retry 10 --retry-delay 3 -H 'Cache-Control: no-cache' \
              "$ROOT/$asset?recovery=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/$(basename "$asset")"
            cmp "$SRC/app/$asset" "$RUNNER_TEMP/$(basename "$asset")"
          done
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Gates 7-8 login admin visibility and visual proof
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/node_modules" "$SRC/node_modules"
          export CXORBIA_EXPECTED_PROJECT="$PROJECT"
          export CXORBIA_DEV_ROOT_URL="$ROOT"
          export PRIVATE_DIR="$RUNNER_TEMP/private"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$RUNNER_TEMP/private/e2e.json"
          cd "$SRC"
          node tools/qa/cxorbia-c6-existing-users-e2e-credentials.mjs >/dev/null
          rm -f node_modules
          cd "$GITHUB_WORKSPACE"
          cat > "$OUT/browser.mjs" <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const root=process.env.ROOT;
          const creds=JSON.parse(fs.readFileSync(process.env.CXORBIA_E2E_PRIVATE_CREDENTIALS,'utf8'));
          const out=process.env.OUT;
          const token='YES_PAULA_20260801_REAL_USERS_E2E';
          const entry=namespace=>{
            const u=new URL(root+'/index-backend-dev.html');
            u.searchParams.set('cxTechnicalAuthE2E',token);
            u.searchParams.set('cxTechnicalAuthNamespace',namespace);
            return u.toString();
          };
          async function login(page,namespace,credential){
            await page.goto(entry(namespace),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#cxDevEntryAuth',{timeout:30000});
            await page.fill('#cxDevEntryLogin',credential.login);
            await page.fill('#cxDevEntryPassword',credential.password);
            await page.click('#cxDevEntrySubmit');
            await page.waitForFunction(ns=>{
              const c=window.CX?.backendAuth?.context?.();
              return c?.authenticated===true&&c?.authNamespace===ns&&
                document.getElementById('app')?.classList.contains('on')&&
                Array.isArray(window.CX?.data?._visitas)&&window.CX.data._visitas.length>0&&
                window.CX_PROTECTED_AUTH_HR_AUTHORITY?.applied===true;
            },namespace,{timeout:90000});
            return page.evaluate(()=>window.CX.backendAuth.context());
          }
          const browser=await chromium.launch({headless:true});
          try{
            let context=await browser.newContext({viewport:{width:1440,height:1000},serviceWorkers:'block'});
            let page=await context.newPage();
            const admin=await login(page,'staff',creds.staff);
            await page.evaluate(()=>CX.router.nav('shoppers'));
            await page.waitForFunction(()=>document.body.innerText.includes('Shoppers / Auditores')&&document.querySelectorAll('#shBody tr').length>0);
            const shopperId=String(creds.shopper.canonicalShopperId||creds.shopper.shopperId||'');
            const row=page.locator(`#shBody tr[data-sid="${shopperId}"]`);
            if(!shopperId||await row.count()!==1) throw new Error('G8_TARGET_NOT_VISIBLE');
            await row.click();
            await page.waitForSelector('.cx-modal');
            if(await page.locator('.cx-modal #shKpis .kpi').count()<4) throw new Error('G8_KPI_HISTORY_NOT_VISIBLE');
            await page.evaluate(()=>document.querySelector('.cx-ov')?.remove());
            await page.evaluate(()=>document.querySelectorAll('#shBody tr').forEach(r=>{
              const first=r.querySelector('td'); if(first) first.innerHTML='<b>IDENTIDAD PROTEGIDA</b>';
            }));
            await page.locator('#view').screenshot({path:out+'/gate8-shoppers-dev.png'});
            await context.close();

            context=await browser.newContext({serviceWorkers:'block'});
            page=await context.newPage();
            const shopper=await login(page,'shopper',creds.shopper);
            if(shopper.role!=='shopper'||shopper.authNamespace!=='shopper'||!shopper.shopperId) throw new Error('G7_SHOPPER_LOGIN');
            await context.close();
            fs.writeFileSync(out+'/gates7-8.json',JSON.stringify({
              gate7:'PASS_GATE7_SHOPPER_ACCESS',gate8:'PASS_GATE8_ADMIN_VISIBILITY',
              adminRole:admin.role,production:false,piiExported:false
            },null,2)+'\n');
          } finally {
            await browser.close();
          }
          NODE
          ROOT="$ROOT" OUT="$OUT" node "$OUT/browser.mjs"
          rm -rf "$RUNNER_TEMP/private" "$OUT/browser.mjs"

      - name: Build sanitized result
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),p=process.env.OUT;
          const read=n=>{try{return JSON.parse(fs.readFileSync(p+'/'+n,'utf8'))}catch{return null}};
          const g6=read('gate6.json'),g78=read('gates7-8.json'),runtime=read('runtime.json');
          const pass=g6?.decision==='PASS_GATE6_HR_SHOPPER_UPSERT_IDEMPOTENT'&&
            g78?.gate7==='PASS_GATE7_SHOPPER_ACCESS'&&g78?.gate8==='PASS_GATE8_ADMIN_VISIBILITY';
          fs.writeFileSync(p+'/result.json',JSON.stringify({
            decision:pass?'PASS_RECOVERY_DEV_GATES_6_8':'HOLD_RECOVERY_DEV_CERTIFICATION',
            sourceSha:process.env.SOURCE_SHA,transportSha:process.env.GITHUB_SHA,
            closedGates:pass?[6,7,8]:(g6?[6]:[]),nextGate:pass?9:(g6?7:6),
            runtime,gate6:g6?.decision||null,gate7:g78?.gate7||null,gate8:g78?.gate8||null,
            production:false,automaticRetry:false
          },null,2)+'\n');
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-dev-cert-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force "$SRC" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private" .firebase

      - name: Enforce certification result
        if: always()
        run: node -e "const r=require('./$OUT/result.json');if(r.decision!=='PASS_RECOVERY_DEV_GATES_6_8')process.exit(1)"
