          IMAGE_URI="$(cat "$V21_OUT/image-uri.txt")"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_URI" --min-instances=1 --max-instances=1 --update-env-vars "$LEGAL_ENABLE_NAME=$LEGAL_ENABLE_VALUE,$LEGAL_GATE_NAME=$LEGAL_GATE_VALUE,$I3_HR_CACHE_PIN_NAME=$I3_HR_CACHE_PIN_VALUE" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$V21_OUT/runtime.json"
          DEV_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$V21_OUT/runtime.json")"
          test -n "$DEV_REVISION"
          gcloud run revisions describe "$DEV_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$V21_OUT/runtime-revision.json"
          RAW="$(jq -r '.status.imageDigest // empty' "$V21_OUT/runtime-revision.json")"
          if [[ "$RAW" =~ ^sha256:[0-9a-f]{64}$ ]]; then DIGEST="$RAW"; elif [[ "$RAW" == *@sha256:* ]]; then DIGEST="sha256:${RAW##*@sha256:}"; else exit 1; fi
          echo "DEV_REVISION=$DEV_REVISION" >> "$GITHUB_ENV"
          echo "RUNTIME_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Deploy same exact V21 source once to Hosting DEV
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$PROJECT" --non-interactive | tee "$GITHUB_WORKSPACE/$V21_OUT/hosting-deploy.log"
          cd "$GITHUB_WORKSPACE"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$V21_OUT/hosting-live-channel.json"
          HOSTING_VERSION_NAME="$(jq -r '.release.version.name // empty' "$V21_OUT/hosting-live-channel.json")"
          HOSTING_RELEASE_NAME="$(jq -r '.release.name // empty' "$V21_OUT/hosting-live-channel.json")"
          test -n "$HOSTING_VERSION_NAME"
          echo "HOSTING_VERSION_NAME=$HOSTING_VERSION_NAME" >> "$GITHUB_ENV"
          echo "HOSTING_RELEASE_NAME=$HOSTING_RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Prove remote byte parity for changed static owners
        run: |
          set -Eeuo pipefail
          for p in app/modules/misvisitas.js app/modules/reservas.js app/adapters/tya-canonical-shopper-portal-v2.js app/core/backend-browser-auth.js app/core/liquidacion.js app/modules/finanzas.js app/core/data.js app/core/config.js app/core/router.js app/modules/novedades.js; do
            rel="${p#app/}"; remote="$V21_OUT/$(echo "$rel"|tr '/' '_').remote"
            curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/$rel?v21=$GITHUB_RUN_ID-$(date +%s%N)" -o "$remote"
