name: CXOrbia Recovery I3 DEV Certification

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-dev-certification.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-recovery-i3-dev-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ github.sha }}
  LOCK_GATE16_SHA: 833446cfea089b9807241c06c2e354d605bebc09
  LOCK_GATE16_RUN_ID: '34185937660'
  OUT: .tmp/recovery-i3-gate17

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove Gate 17 workflow-only delta and lock Gate 16
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$LOCK_GATE16_SHA" HEAD
          git cat-file -e "$LOCK_GATE16_SHA^{commit}"
          git diff --name-only "$LOCK_GATE16_SHA" HEAD | sort > "$OUT/current-delta.txt"
          printf '%s\n' '.github/workflows/cxorbia-recovery-i3-dev-certification.yml' > "$OUT/expected-delta.txt"
          diff -u "$OUT/expected-delta.txt" "$OUT/current-delta.txt"
          git diff --quiet "$LOCK_GATE16_SHA" HEAD -- app backend firebase.json .firebaserc
          git status --porcelain | tee "$OUT/source-status.txt"; test ! -s "$OUT/source-status.txt"
          node <<'NODE'
          const fs=require('fs'),out=process.env.OUT;
          const g16={decision:'PASS_GATE16_BIDIRECTIONAL_ACK_IDEMPOTENCY',gate:16,lockedEvidence:true,lockedRunId:Number(process.env.LOCK_GATE16_RUN_ID),lockedSourceSha:process.env.LOCK_GATE16_SHA,noProductDrift:true,tenantId:'tya',projectId:'cinepolis',periodId:'cinepolis-2026-09',remoteAck:true,successUiAfterAck:true,idempotentReplay:true,replayProviderWrites:0,commandSuccessRequiresProviderAck:true,directLocalWriteAllowed:false,hrWritesEnabled:false,hrWriteFailClosed:true,invalidPlatformSyncStates:0,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${out}/gate16-locked.json`,JSON.stringify(g16,null,2)+'\n');
          fs.writeFileSync(`${out}/locked-lineage.json`,JSON.stringify({decision:'PASS_GATE17_LOCKED_GATE16_NO_PRODUCT_DRIFT',lockedRunId:Number(process.env.LOCK_GATE16_RUN_ID),lockedSourceSha:process.env.LOCK_GATE16_SHA,currentSourceSha:process.env.SOURCE_SHA,noProductDrift:true,changedFiles:fs.readFileSync(`${out}/current-delta.txt`,'utf8').trim().split(/\n/).filter(Boolean),production:false},null,2)+'\n');
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Certify candidate syntax surface
        run: |
          set -euo pipefail
          : > "$OUT/syntax-inventory.txt"
          find app/core app/adapters app/modules -maxdepth 1 -type f -name '*.js' -print | sort >> "$OUT/syntax-inventory.txt"
          find backend/runtime -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) -print | sort >> "$OUT/syntax-inventory.txt"
          find backend/runtime/hr-live-service -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) -print | sort >> "$OUT/syntax-inventory.txt"
          sort -u "$OUT/syntax-inventory.txt" -o "$OUT/syntax-inventory.txt"
          test -s "$OUT/syntax-inventory.txt"
          syntax_count=0
          while IFS= read -r f; do
            node --check "$f" >> "$OUT/syntax.log" 2>&1
            syntax_count=$((syntax_count+1))
          done < "$OUT/syntax-inventory.txt"
          test "$syntax_count" -gt 20
          sha256sum $(cat "$OUT/syntax-inventory.txt") | sort > "$OUT/syntax-hashes.txt"
          printf '%s\n' "$syntax_count" > "$OUT/syntax-count.txt"
          printf '{"decision":"PASS_GATE17_SYNTAX","syntaxFiles":%s,"production":false}\n' "$syntax_count" > "$OUT/syntax.json"

      - name: Run reusable functional contract suites
        run: |
          set -euo pipefail
          node --test \
            backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs \
            backend/runtime/hr-live-service/test/cxorbia-gate7-operational-assignment.test.mjs \
            backend/runtime/hr-live-service/test/cxorbia-gate8-shopper-credential-enrollment.test.mjs \
            backend/runtime/hr-live-service/test/cxorbia-gate9-postulation-immediate.test.mjs \
            | tee "$OUT/contract-tests.log"
          grep -Eq 'pass 18|pass[[:space:]]+18' "$OUT/contract-tests.log"
          grep -Eq 'fail 0|fail[[:space:]]+0' "$OUT/contract-tests.log"
          node tools/qa/cxorbia-gate9-postulation-contract.mjs | tee "$OUT/gate9-contract.log"
          grep -Fq 'PASS_GATE9_POSTULATION_CONTRACT' "$OUT/gate9-contract.log"

      - name: Certify frozen cross-cutting contracts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const files={
            command:read('app/adapters/cxorbia-command-adapter-v1.js'),
            transport:read('app/adapters/cxorbia-command-http-transport-v1.js'),
            boundary:read('app/adapters/cxorbia-cxdata-command-boundary-v1.js'),
            firewall:read('app/adapters/cxorbia-canonical-write-firewall-v1.js'),
            hrWrite:read('app/adapters/cxorbia-hr-write-adapter-contract-v1.js'),
            identity:read('app/adapters/cxorbia-exact-identity-contract-v1.js'),
            composer:read('app/adapters/tya-cumulative-read-model-v2.js'),
            live:read('app/adapters/tya-live-source-inplace-apply.js'),
            shoppers:read('app/modules/shoppers.js'),
            data:read('app/core/data.js'),
            operational:read('backend/runtime/cxorbia-operational-command-provider-v1.mjs')
          };
          const checks={
            remoteAckRequired:/successRequiresProviderAck\s*:\s*true/.test(files.command)&&/providerAck/.test(files.transport),
            noLocalWriteTruth:/localMutation\s*:\s*false/.test(files.boundary)&&/directLocalWriteAllowed\s*:\s*false/.test(files.firewall),
            hrWriteIdempotency:/idempotencyKey/.test(files.hrWrite)&&/providerAck===true/.test(files.hrWrite),
            exactIdentityOnly:/FORBIDDEN_MATCH_KEYS/.test(files.identity)&&/ambiguous_exact_technical_anchor/.test(files.identity),
            hrOwnsOperationalState:/hrOwnsOperationalState\s*:\s*true/.test(files.composer)&&/protectedVisitsAppended\s*:\s*0/.test(files.composer),
            projectPeriodSeparated:/currentProjectId/.test(files.data)&&/currentPeriodId/.test(files.data)&&/setCurrentPeriod/.test(files.data)&&/setCurrentProject/.test(files.data),
            gtHnCurrencyScoped:/const currency=\{GT:'Q',HN:'L'\}/.test(files.live)&&/rootProjectId:'cinepolis'/.test(files.live),
            pendingHrExcludedFromAuthoritativeKpi:/__pendingPlatformAssignmentOverlay!==true/.test(files.shoppers),
            explicitSyncConfirmation:/visit\.sync\.confirm/.test(files.operational)&&/assignmentSyncStatus:'synced'/.test(files.operational),
            idempotentReplayZeroWrites:/idempotentReplay:true,providerWrites:0/.test(files.operational)
          };
          const pass=Object.values(checks).every(Boolean);
          const out={decision:pass?'PASS_GATE17_FROZEN_CONTRACTS':'SOURCE_FAILURE',gate:17,checks,production:false,localStorageTruth:false};
          fs.writeFileSync(`${process.env.OUT}/contracts.json`,JSON.stringify(out,null,2)+'\n');
          if(!pass)process.exit(1);
          NODE

      - name: Final Gate 17 verdict
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),read=n=>JSON.parse(fs.readFileSync(`${process.env.OUT}/${n}`,'utf8'));
          const g16=read('gate16-locked.json'),lineage=read('locked-lineage.json'),syntax=read('syntax.json'),contracts=read('contracts.json');
          if(g16.decision!=='PASS_GATE16_BIDIRECTIONAL_ACK_IDEMPOTENCY'||g16.lockedEvidence!==true||g16.noProductDrift!==true||Number(g16.lockedRunId)!==Number(process.env.LOCK_GATE16_RUN_ID)||g16.lockedSourceSha!==process.env.LOCK_GATE16_SHA)throw new Error('GATE16_LOCK_INVALID');
          if(lineage.decision!=='PASS_GATE17_LOCKED_GATE16_NO_PRODUCT_DRIFT'||lineage.noProductDrift!==true)throw new Error('GATE17_PRODUCT_DRIFT');
          if(syntax.decision!=='PASS_GATE17_SYNTAX'||Number(syntax.syntaxFiles)<=20)throw new Error('GATE17_SYNTAX_INCOMPLETE');
          if(contracts.decision!=='PASS_GATE17_FROZEN_CONTRACTS'||!Object.values(contracts.checks||{}).every(Boolean))throw new Error('GATE17_CONTRACTS_INCOMPLETE');
          const summary={verdict:'PASS_GATE17_SYNTAX_CONTRACTS',gate16:'PASS_LOCKED_NO_DRIFT',gate17:'PASS',lockedGate16RunId:Number(process.env.LOCK_GATE16_RUN_ID),lockedGate16SourceSha:process.env.LOCK_GATE16_SHA,sourceSha:process.env.SOURCE_SHA,noProductDrift:true,syntaxFiles:Number(syntax.syntaxFiles),reusableContractTests:18,reusableContractTestsFailed:0,frozenContractsExact:true,localStorageTruth:false,providerWrites:0,hrWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/result.json`,JSON.stringify(summary,null,2)+'\n');console.log(JSON.stringify(summary));
          NODE

      - name: Upload sanitized Gate 17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate17-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14
