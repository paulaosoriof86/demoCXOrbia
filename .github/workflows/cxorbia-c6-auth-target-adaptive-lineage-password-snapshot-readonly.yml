name: CXOrbia C6 Auth Target Adaptive Lineage Password Snapshot Readonly

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'backend/config/c6-auth-target-adaptive-lineage-password-snapshot-readonly-request-v2.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-target-adaptive-lineage-password-snapshot-readonly
  cancel-in-progress: false

jobs:
  adaptive-lineage-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUEST_FILE: backend/config/c6-auth-target-adaptive-lineage-password-snapshot-readonly-request-v2.json
      CONTRACT_FILE: backend/contracts/c6-auth-target-anchor-lineage-provider-minimum-v1.json
      TOOL_FILE: tools/qa/cxorbia-c6-auth-target-adaptive-lineage-password-snapshot-readonly.mjs
      SOURCE_DIR: .tmp/c6-auth-target-adaptive/source
      EXPORT_DIR: .tmp/c6-auth-target-adaptive/export
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate exact one-shot authorization and root-cause contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));const c=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(r.schemaVersion==='cxorbia.c6.auth-target-adaptive-lineage-password-snapshot-readonly.request.v1','SCHEMA');
          ok(r.requestId==='c6-auth-target-adaptive-lineage-password-snapshot-readonly-20260807-02','ID');
          ok(r.enabled===true&&r.consumed===false&&r.allowedExecutions===1&&r.authorizedBy==='Paula','AUTH');
          ok(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_ONLY');
          ok(r.previousSourceAttempt?.runId===31226987446&&r.previousSourceAttempt?.providerReads===0&&r.previousSourceAttempt?.providerWrites===0,'PREVIOUS_SOURCE_FAIL_CLOSE');
          ok(c.rootCauseCircuitBreaker?.credentialCrosswalkRequiredAfterLineage===true&&c.rootCauseCircuitBreaker?.sharedBaseLoginForbiddenAsSoleTargetAnchor===true,'ROOT_CAUSE_GUARD');
          console.log('PASS_C6_ADAPTIVE_REQUEST_ROOT_CAUSE_GATE');
          NODE
      - name: Static readonly gate corrected
        run: |
          set -euo pipefail
          node --check "$TOOL_FILE"
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.TOOL_FILE,'utf8');
          const forbidden=[/auth\.(createUser|updateUser|deleteUser|setCustomUserClaims|importUsers)\s*\(/,/\.doc\s*\([^\n]*\)\s*\.set\s*\(/,/\.doc\s*\([^\n]*\)\s*\.update\s*\(/,/\.doc\s*\([^\n]*\)\s*\.delete\s*\(/,/firebase\s+deploy/i,/gcloud\s+/i];
          for(const re of forbidden)if(re.test(s))throw new Error('FORBIDDEN_WRITE_PATTERN:'+re);
          for(const x of ['queryTargetLinked','credentialEmailMatch','sharedBaseEmailMatch','otherPlanAssociation','LEGACY_SHA256_ROUNDS1_SALTLESS_EXACT','AES-256-GCM'])if(!s.includes(x))throw new Error('MISSING_GUARD:'+x);
          console.log('PASS_C6_AUTH_TARGET_ADAPTIVE_STATIC_ROOT_CAUSE_GATE');
          NODE
      - name: Download frozen source-safe plan artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          gh run download 31104541809 -n cxorbia-c6-equivalent-universe-provider-v22-31104541809 -D "$SOURCE_DIR"
          test -f "$SOURCE_DIR/plan-340-source-safe.json"
      - name: Load canonical DEV credential privately
        env: {EXISTING_DEV_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-target-adaptive-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-target-adaptive-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-target-adaptive-private/credentials.json" >> "$GITHUB_ENV"
      - name: Install pinned Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Execute single provider attempt
        id: assess
        run: |
          set +e
          CXORBIA_SOURCE_PLAN="$SOURCE_DIR/plan-340-source-safe.json" CXORBIA_ADAPTIVE_LINEAGE_OUT="$EXPORT_DIR" node "$TOOL_FILE" "$REQUEST_FILE"
          code=$?; decision=$(head -n 1 "$EXPORT_DIR/decision.txt" 2>/dev/null || echo STOP_RETRY_C6_AUTH_TARGET_ADAPTIVE_NO_DECISION)
          echo "decision=$decision" >> "$GITHUB_OUTPUT"; echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
          exit 0
      - name: Verify source-safe evidence and hard stops
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const e=require('./.tmp/c6-auth-target-adaptive/export/evidence-source-safe.json');
          if(e.safety?.providerWrites!==0||e.safety?.authWrites!==0||e.safety?.firestoreWrites!==0||e.safety?.hrWrites!==0)throw new Error('WRITE_DRIFT');
          if((e.providerRead?.authDirectoryPages||0)>1||(e.providerRead?.hashConfigReads||0)>1||(e.providerRead?.shopperDocumentsRead||0)>340)throw new Error('READ_BUDGET');
          if((e.providerRead?.authDirectoryPages||0)>0&&!e.lineage?.pass)throw new Error('AUTH_BEFORE_LINEAGE');
          if((e.providerRead?.hashConfigReads||0)>0&&e.resolution?.candidateCount!==1)throw new Error('HASHCFG_BEFORE_CANDIDATE');
          const raw=JSON.stringify(e);if(raw.includes('@auth.cxorbia.invalid')||/"uid"\s*:/.test(raw)||/passwordHashBase64|passwordSaltBase64/.test(raw))throw new Error('LEAK');
          if(e.decision?.startsWith('PASS_')&&(!e.snapshot?.created||!e.snapshot?.roundtripVerified||!e.restoration?.exactRollbackReconstructible))throw new Error('PASS_INVARIANT');
          console.log(JSON.stringify({decision:e.decision,lineagePass:Boolean(e.lineage?.pass),basisCount:e.lineage?.corroboratingBasisCount||0,candidateCount:e.resolution?.candidateCount||0,credentialAnchorPresent:Boolean(e.resolution?.credentialAnchorPresent),passwordHashAvailable:Boolean(e.passwordState?.passwordHashAvailable),passwordSaltState:e.passwordState?.passwordSaltState||'UNKNOWN',legacyHashMatches:Boolean(e.passwordState?.legacyHashMatches),exactRollbackReconstructible:Boolean(e.restoration?.exactRollbackReconstructible),snapshotCreated:Boolean(e.snapshot?.created)}));
          NODE
      - name: Upload encrypted snapshot and source-safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-target-adaptive-lineage-password-snapshot-readonly-${{ github.run_id }}
          path: .tmp/c6-auth-target-adaptive/export
          if-no-files-found: error
          retention-days: 14
      - name: Publish observable decision
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', DECISION: '${{ steps.assess.outputs.decision }}'}
        run: |
          set -euo pipefail
          STATE=success; [ '${{ job.status }}' = success ] || STATE=failure
          DESC=$(printf '%s' "${DECISION:-STOP_RETRY_C6_AUTH_TARGET_ADAPTIVE_NO_DECISION}" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-target-adaptive-lineage-password-snapshot-readonly' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/c6-auth-target-adaptive-private
