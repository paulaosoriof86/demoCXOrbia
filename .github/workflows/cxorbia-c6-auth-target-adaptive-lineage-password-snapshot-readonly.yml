name: CXOrbia C6 Auth Target Adaptive Lineage Password Snapshot Readonly

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/c6-auth-target-adaptive-lineage-password-snapshot-readonly-request-v1.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-target-adaptive-lineage-password-snapshot-readonly
  cancel-in-progress: false

jobs:
  adaptive-lineage-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUEST_FILE: backend/config/c6-auth-target-adaptive-lineage-password-snapshot-readonly-request-v1.json
      CONTRACT_FILE: backend/contracts/c6-auth-target-anchor-lineage-provider-minimum-v1.json
      TOOL_FILE: tools/qa/cxorbia-c6-auth-target-adaptive-lineage-password-snapshot-readonly.mjs
      SOURCE_DIR: .tmp/c6-auth-target-adaptive/source
      EXPORT_DIR: .tmp/c6-auth-target-adaptive/export
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact one-shot authorization and root-cause contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));const c=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ensure=(v,m)=>{if(!v)throw new Error(m)};
          ensure(r.schemaVersion==='cxorbia.c6.auth-target-adaptive-lineage-password-snapshot-readonly.request.v1','REQUEST_SCHEMA');
          ensure(r.requestId==='c6-auth-target-adaptive-lineage-password-snapshot-readonly-20260807-01','REQUEST_ID');
          ensure(r.enabled===true&&r.consumed===false&&Number(r.allowedExecutions)===1&&r.authorizedBy==='Paula','REQUEST_AUTH');
          ensure(r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&Number(r.pullRequest)===7&&r.firebaseProjectId==='cxorbia-backend-dev','LANE');
          ensure(r.targetProfileFingerprint==='ac93d90d9e41512acdcd'&&r.contract===process.env.CONTRACT_FILE,'TARGET');
          ensure(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_ONLY_COMMIT_REQUIRED');
          ensure(c.schemaVersion==='cxorbia.c6.auth-target-anchor-lineage-provider-minimum.v1','CONTRACT_SCHEMA');
          ensure(c.rootCauseCircuitBreaker?.credentialCrosswalkRequiredAfterLineage===true&&c.rootCauseCircuitBreaker?.sharedBaseLoginForbiddenAsSoleTargetAnchor===true&&c.rootCauseCircuitBreaker?.currentClaimsForbiddenAsSoleTargetAnchor===true,'ROOT_CAUSE_CIRCUIT_BREAKER_MISSING');
          ensure(c.activationFollowUpRootCause?.currentActivationPrewriteStillRequiresNonemptyHashAndSaltForAll14PasswordChanges===true,'ACTIVATION_STALE_SALT_GUARD_NOT_RECORDED');
          console.log(JSON.stringify({head,parent,changed,authorized:true,rootCauseCircuitBreaker:true}));
          NODE

      - name: Static readonly and no-loop gate
        run: |
          set -euo pipefail
          node --check "$TOOL_FILE"
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.TOOL_FILE,'utf8');
          const forbidden=[/auth\.(createUser|updateUser|deleteUser|setCustomUserClaims|importUsers)\s*\(/,/\.set\s*\(/,/\.update\s*\(/,/\.delete\s*\(/,/firebase\s+deploy/i,/gcloud\s+/i];
          for(const re of forbidden)if(re.test(s))throw new Error('FORBIDDEN_WRITE_PATTERN:'+re);
          for(const x of ['TARGET_PROFILE_FP','TARGET_BASE_FP','TARGET_LOGIN_FP','COLLISION_PEER_FP','queryTargetLinked','credentialEmailMatch','sharedBaseEmailMatch','otherPlanAssociation','passwordHashAvailable','EMPTY_OR_NULL_LEGITIMATE_LEGACY_SHA256','LEGACY_SHA256_ROUNDS1_SALTLESS_EXACT','AES-256-GCM','providerWrites:0','authWrites:0','firestoreWrites:0','hrWrites:0'])if(!s.includes(x))throw new Error('MISSING_ROOT_CAUSE_GUARD:'+x);
          console.log('PASS_C6_AUTH_TARGET_ADAPTIVE_STATIC_ROOT_CAUSE_GATE');
          NODE

      - name: Download frozen source-safe plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          gh run download 31104541809 -n cxorbia-c6-equivalent-universe-provider-v22-31104541809 -D "$SOURCE_DIR"
          test -f "$SOURCE_DIR/plan-340-source-safe.json"

      - name: Load canonical DEV credential privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-target-adaptive-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-target-adaptive-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-target-adaptive-private/credentials.json" >> "$GITHUB_ENV"

      - name: Install pinned Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Execute single adaptive provider attempt
        id: assess
        run: |
          set +e
          CXORBIA_SOURCE_PLAN="$SOURCE_DIR/plan-340-source-safe.json" CXORBIA_ADAPTIVE_LINEAGE_OUT="$EXPORT_DIR" node "$TOOL_FILE" "$REQUEST_FILE"
          code=$?
          decision=$(head -n 1 "$EXPORT_DIR/decision.txt" 2>/dev/null || echo STOP_RETRY_C6_AUTH_TARGET_ADAPTIVE_LINEAGE_PASSWORD_SNAPSHOT_READONLY_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$code" != '0' ] && [ "$code" != '2' ]; then exit "$code"; fi
          exit 0

      - name: Verify source-safe evidence and hard stops
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const e=require('./.tmp/c6-auth-target-adaptive/export/evidence-source-safe.json');
          if(e.target?.profileFingerprint!=='ac93d90d9e41512acdcd')throw new Error('TARGET_DRIFT');
          if(e.safety?.providerWrites!==0||e.safety?.authWrites!==0||e.safety?.firestoreWrites!==0||e.safety?.hrWrites!==0)throw new Error('WRITE_DRIFT');
          if((e.providerRead?.authDirectoryPages||0)>1||(e.providerRead?.hashConfigReads||0)>1||(e.providerRead?.shopperIndexQueries||0)>1||(e.providerRead?.shopperDocumentsRead||0)>340)throw new Error('READ_BUDGET_EXCEEDED');
          if((e.providerRead?.authDirectoryPages||0)>0&&!e.lineage?.pass)throw new Error('AUTH_READ_BEFORE_LINEAGE_PASS');
          if((e.providerRead?.hashConfigReads||0)>0&&e.resolution?.candidateCount!==1)throw new Error('HASH_CONFIG_BEFORE_CANDIDATE_PASS');
          const raw=JSON.stringify(e);
          if(raw.includes('@auth.cxorbia.invalid')||/"uid"\s*:/.test(raw)||/passwordHashBase64|passwordSaltBase64/.test(raw))throw new Error('PII_OR_SECRET_LEAK');
          if(e.decision?.startsWith('PASS_')){
            if(!e.lineage?.pass||e.lineage?.corroboratingBasisCount<2||e.resolution?.candidateCount!==1||e.resolution?.otherPlanRowAssociationCount!==0||e.restoration?.exactRollbackReconstructible!==true||e.snapshot?.created!==true||e.snapshot?.roundtripVerified!==true)throw new Error('PASS_INVARIANT_FAILED');
            if(!fs.existsSync('./.tmp/c6-auth-target-adaptive/export/rollback-one-target.enc.json'))throw new Error('ENCRYPTED_SNAPSHOT_MISSING');
          }
          console.log(JSON.stringify({decision:e.decision,lineagePass:Boolean(e.lineage?.pass),basisCount:e.lineage?.corroboratingBasisCount||0,candidateCount:e.resolution?.candidateCount||0,credentialAnchorPresent:Boolean(e.resolution?.credentialAnchorPresent),passwordHashAvailable:Boolean(e.passwordState?.passwordHashAvailable),passwordSaltState:e.passwordState?.passwordSaltState||'UNKNOWN',legacyHashMatches:Boolean(e.passwordState?.legacyHashMatches),providerHashAlgorithmClass:e.passwordState?.providerHashAlgorithmClass||'UNKNOWN',exactRollbackReconstructible:Boolean(e.restoration?.exactRollbackReconstructible),snapshotCreated:Boolean(e.snapshot?.created),providerWrites:0,authWrites:0}));
          NODE

      - name: Upload encrypted snapshot and source-safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-target-adaptive-lineage-password-snapshot-readonly-${{ github.run_id }}
          path: .tmp/c6-auth-target-adaptive/export
          if-no-files-found: error
          retention-days: 14

      - name: Publish observable decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.assess.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          DESC="${DECISION:-STOP_RETRY_C6_AUTH_TARGET_ADAPTIVE_LINEAGE_PASSWORD_SNAPSHOT_READONLY_NO_DECISION}"
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; fi
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-target-adaptive-lineage-password-snapshot-readonly' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/c6-auth-target-adaptive-private
