name: CXOrbia Corte 6 DEV Entry P0 Hosting

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-cumulative-human-visual-hosting-execute.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-c6-dev-entry-p0-hosting
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  REQUEST: backend/config/corte6-cumulative-human-visual-hosting-request.json
  EXECUTE: backend/config/corte6-cumulative-human-visual-hosting-execute.json
  OUT_DIR: .tmp/c6-dev-entry-p0-hosting
  ROOT_FIX_COMMIT: 1889c7ef080c88c7db6eca56cb26fa2e0ad1466f

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact one-shot authorization
        id: authorization
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          STATE="$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.EXECUTE,'utf8'));
          process.stdout.write(x.enabled===false&&x.consumed===true&&x.status==='consumed_pass'?'false':'true');
          NODE
          )"
          echo "should_run=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "false" ]; then exit 0; fi
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const x=JSON.parse(fs.readFileSync(process.env.EXECUTE,'utf8'));
          if(r.schemaVersion!=='cxorbia.corte6.dev-entry-p0-hosting-request.v3')throw new Error('request_schema_mismatch');
          if(x.schemaVersion!=='cxorbia.corte6.dev-entry-p0-hosting-execute.v3')throw new Error('execute_schema_mismatch');
          for(const o of [r,x]){
            if(o.repository!=='paulaosoriof86/demoCXOrbia'||o.branch!=='docs-tya-v6-v71-audit'||o.firebaseProjectId!=='cxorbia-backend-dev'||o.hostingSite!=='cxorbia-backend-dev'||o.hostingTarget!=='cxorbia-dev'||o.tenantId!=='tya'||o.projectId!=='cinepolis')throw new Error('target_identity_mismatch');
          }
          if(r.scope!=='single_existing_dev_hosting_deploy_for_c6_visual_entry_and_single_product_login_p0'||r.singleHostingDeployMax!==1||r.hostingDeployExecutions!==0)throw new Error('scope_contract_mismatch');
          for(const k of ['canonicalBareEntryRequired','directProductLoginRequired','genericRolePickerForbiddenInProtectedEntry','firebaseSessionReuseRequired','browserSmokeRequired','localBrowserGateRequired','remoteBrowserGateRequired','existingCanonicalRootFixRequired'])if(r[k]!==true)throw new Error('required_gate_missing:'+k);
          if(r.exactIdentityOnly!==true||r.namePhoneEmailDedupeAllowed!==false||!r.entryFixCommit||r.rootFixCommit!==process.env.ROOT_FIX_COMMIT)throw new Error('lineage_contract_mismatch');
          if(r.enabled!==true||r.consumed!==false||r.status!=='authorized_waiting_execute'||r.authorizedBy!=='Paula'||!r.authorizationId||!r.authorizationText)throw new Error('authorization_missing');
          if(x.enabled!==true||x.consumed!==false||x.status!=='execute_authorized_once'||x.requestId!==r.requestId||x.authorizationId!==r.authorizationId||x.entryFixCommit!==r.entryFixCommit||x.rootFixCommit!==r.rootFixCommit)throw new Error('execute_marker_invalid');
          for(const k of ['firestoreWrites','authWrites','authResets','rulesDeploys','cloudRunDeploys','storageWrites','hrWrites','legacyWrites','makeWrites','geminiCalls','paymentsWrites','reservationsWrites','newFirebaseProjects','newHostingSites']){
            if(Number(r[k]||0)!==0||Number(x[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          }
          if(r.merge!==false||r.production!==false||x.merge!==false||x.production!==false)throw new Error('unsafe_scope');
          process.stdout.write(r.entryFixCommit);
          NODE
          ENTRY_FIX_COMMIT="$(node -p "JSON.parse(require('fs').readFileSync(process.env.REQUEST,'utf8')).entryFixCommit")"
          echo "entry_fix_commit=$ENTRY_FIX_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify protected lineage and entry fix
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ROOT_FIX_COMMIT" HEAD
          git merge-base --is-ancestor "${{ steps.authorization.outputs.entry_fix_commit }}" HEAD
          if git diff --name-only "$ROOT_FIX_COMMIT"..HEAD | grep -Eq '^app/(modules|core)/'; then
            echo 'P0: protected frontend/core changed after root-fix lock'
            exit 2
          fi
          grep -q 'id="cxDevEntryCanonicalBootstrap"' app/index-backend-dev.html
          grep -q 'adapters/tya-dev-entry-auth-gate-v1.js' app/index-backend-dev.html
          grep -q 'cxDevEntryAuth' app/adapters/tya-dev-entry-auth-gate-v1.js
          grep -q 'CX.backendAuth.authenticate' app/adapters/tya-dev-entry-auth-gate-v1.js
          grep -q 'credentialsEmbedded:false' app/adapters/tya-dev-entry-auth-gate-v1.js

      - name: Run accumulated static gates
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          node --check app/adapters/tya-dev-entry-auth-gate-v1.js
          node --check tools/qa/tya-c6-dev-entry-auth-gate.mjs
          node --check tools/qa/tya-c6-dev-entry-browser-smoke.mjs
          node tools/qa/tya-c6-domain-consistency-regression-gate.mjs
          node tools/qa/tya-c6-canonical-finance-read-model-gate.mjs
          node tools/qa/tya-c6-shopper-portal-contract-gate.mjs
          node tools/qa/tya-c6-reservations-source-guard-gate.mjs
          node tools/qa/tya-c6-dev-entry-auth-gate.mjs
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json','utf8'));
          if(e.decision!=='PASS_C6_LIVE_HR_ROW_LEVEL_CANONICAL_STATE')throw new Error('live_hr_audit_not_pass');
          if(e.source?.periods!==14||e.source?.visits!==616||e.observedJuly?.total!==44||e.observedJuly?.realized!==40||e.observedJuly?.questionnaireCompleted!==38||e.observedJuly?.submitted!==33||e.observedJuly?.outOfRange!==1)throw new Error('approved_baseline_mismatch');
          if((e.failedAssertions||[]).length||(e.failedGates||[]).length)throw new Error('audit_failures_present');
          NODE

      - name: Install browser gate and Firebase CLI
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-tools@latest playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Local clean-browser gate before deploy
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory app >"$OUT_DIR/local-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index-backend-dev.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/qa/tya-c6-dev-entry-browser-smoke.mjs http://127.0.0.1:4173

      - name: Authenticate existing Google Cloud DEV
        if: steps.authorization.outputs.should_run == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Provider read-only preflight
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 2 "$DEV_ROOT_URL/api/tya/cinepolis/hr-live?format=meta&fresh=1" -o "$OUT_DIR/hr-meta-before.json"
          code="$(curl -sS -o "$OUT_DIR/full-unauthorized-before.json" -w '%{http_code}' "$DEV_ROOT_URL/api/tya/cinepolis/hr-live?view=full-profile&scope=admin")"
          test "$code" = '401'
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/hr-meta-before.json','utf8'));
          const u=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/full-unauthorized-before.json','utf8'));
          if(m.runtimeRead!==true||m.sourceSafe!==true||m.visits!==616||m.tabRegistryAutoDiscovery!==true)throw new Error('live_hr_baseline_not_preserved');
          if(u.error!=='dev_visual_authorization_required')throw new Error('full_visual_gate_not_fail_closed');
          NODE

      - name: Prepare existing Hosting DEV config
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const config={hosting:{target:'cxorbia-dev',public:'app',ignore:['firebase.json','**/.*','**/node_modules/**'],rewrites:[{source:'/api/tya/cinepolis/hr-live',run:{serviceId:'cxorbia-live-hr-dev',region:'us-central1'}},{source:'**',destination:'/index.html'}],headers:[{source:'**',headers:[{key:'Cache-Control',value:'no-store'}]},{source:'**/*.html',headers:[{key:'Content-Type',value:'text/html; charset=utf-8'}]},{source:'**/*.js',headers:[{key:'Content-Type',value:'application/javascript; charset=utf-8'}]},{source:'**/*.css',headers:[{key:'Content-Type',value:'text/css; charset=utf-8'}]},{source:'**/*.json',headers:[{key:'Content-Type',value:'application/json; charset=utf-8'}]}]}};
          fs.writeFileSync(process.env.OUT_DIR+'/firebase.hosting.json',JSON.stringify(config,null,2)+String.fromCharCode(10),'utf8');
          NODE

      - name: Deploy existing Hosting DEV once
        if: steps.authorization.outputs.should_run == 'true'
        id: deploy
        run: |
          set -euo pipefail
          cp "$OUT_DIR/firebase.hosting.json" firebase.c6-entry-p0.json
          npx firebase deploy --config firebase.c6-entry-p0.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$GCP_PROJECT_ID" --non-interactive
          rm -f firebase.c6-entry-p0.json

      - name: Record deploy count immediately
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          node <<'NODE'
          const fs=require('fs');
          const p=process.env.REQUEST;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.hostingDeployExecutions!==0)throw new Error('unexpected_prior_deploy_count');
          r.hostingDeployExecutions=1;
          r.status='hosting_deployed_browser_smoke_pending';
          r.hostingDeployedAt=new Date().toISOString();
          fs.writeFileSync(p,JSON.stringify(r,null,2)+String.fromCharCode(10),'utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REQUEST"
          git commit -m 'gate: record C6 DEV entry P0 Hosting deploy'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Remote exact-assets and browser smoke
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/adapters"
          curl -fsSL --retry 10 --retry-delay 3 "$DEV_ROOT_URL/index-backend-dev.html" -o "$OUT_DIR/index-backend-dev.html"
          curl -fsSL --retry 10 --retry-delay 3 "$DEV_ROOT_URL/adapters/tya-dev-entry-auth-gate-v1.js" -o "$OUT_DIR/adapters/tya-dev-entry-auth-gate-v1.js"
          cmp app/index-backend-dev.html "$OUT_DIR/index-backend-dev.html"
          cmp app/adapters/tya-dev-entry-auth-gate-v1.js "$OUT_DIR/adapters/tya-dev-entry-auth-gate-v1.js"
          node tools/qa/tya-c6-dev-entry-auth-gate.mjs "$OUT_DIR/index-backend-dev.html" "$OUT_DIR/adapters/tya-dev-entry-auth-gate-v1.js"
          node tools/qa/tya-c6-dev-entry-browser-smoke.mjs "$DEV_ROOT_URL"
          curl -fsSL --retry 8 --retry-delay 3 "$DEV_ROOT_URL/api/tya/cinepolis/hr-live?format=meta&fresh=1" -o "$OUT_DIR/hr-meta-after.json"
          code="$(curl -sS -o "$OUT_DIR/full-unauthorized-after.json" -w '%{http_code}' "$DEV_ROOT_URL/api/tya/cinepolis/hr-live?view=full-profile&scope=admin")"
          test "$code" = '401'
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/hr-meta-after.json','utf8'));
          const u=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/full-unauthorized-after.json','utf8'));
          if(m.runtimeRead!==true||m.sourceSafe!==true||m.visits!==616||m.tabRegistryAutoDiscovery!==true)throw new Error('remote_live_hr_not_preserved');
          if(u.error!=='dev_visual_authorization_required')throw new Error('remote_full_visual_gate_not_fail_closed');
          NODE

      - name: Persist PASS evidence and consume authorization
        if: steps.authorization.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          node <<'NODE'
          const fs=require('fs');
          const rp=process.env.REQUEST,xp=process.env.EXECUTE;
          const r=JSON.parse(fs.readFileSync(rp,'utf8'));
          const x=JSON.parse(fs.readFileSync(xp,'utf8'));
          if(r.hostingDeployExecutions!==1)throw new Error('hosting_execution_count_mismatch');
          const e={schemaVersion:'cxorbia.corte6.dev-entry-p0-hosting-evidence.v3',generatedAt:new Date().toISOString(),decision:'PASS_C6_DEV_ENTRY_SINGLE_PRODUCT_LOGIN_EXISTING_HOSTING_REMOTE_BROWSER',authorizationId:r.authorizationId,requestId:r.requestId,rootFixCommit:r.rootFixCommit,entryFixCommit:r.entryFixCommit,projectId:'cxorbia-backend-dev',hostingSite:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',hostingDeployExecutions:1,browser:{bareEntryCanonicalized:true,connectedLocalStoragePreseeded:true,genericRolePickerHidden:true,directProductLoginVisible:true,technicalSecondLoginAbsent:true,blockedDataSourceCardAbsent:true,localCleanBrowserGate:true,remoteCleanBrowserGate:true,firebaseSessionReusePreserved:true,credentialsEmbedded:false},canonical:{domain:true,finance:true,shopperPortal:true,reservationsFailClosed:true,hrVisits616:true,fullVisualGateFailClosed:true},safety:{firestoreWrites:0,authWrites:0,authResets:0,rulesDeploys:0,cloudRunDeploys:0,storageWrites:0,hrWrites:0,legacyWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,reservationsWrites:0,newFirebaseProjects:0,newHostingSites:0,production:false,merge:false}};
          fs.writeFileSync('app/docs/evidence/CORTE6-DEV-ENTRY-P0-HOSTING-LATEST.json',JSON.stringify(e,null,2)+String.fromCharCode(10),'utf8');
          for(const o of [r,x]){o.status='consumed_pass';o.enabled=false;o.consumed=true;o.consumedAt=new Date().toISOString();o.decision=e.decision;o.nextGate='HUMAN_VISUAL_ACCUMULATIVE_C6_FREEZE';}
          fs.writeFileSync(rp,JSON.stringify(r,null,2)+String.fromCharCode(10),'utf8');
          fs.writeFileSync(xp,JSON.stringify(x,null,2)+String.fromCharCode(10),'utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-DEV-ENTRY-P0-HOSTING-LATEST.json "$REQUEST" "$EXECUTE"
          git commit -m 'evidence: C6 DEV entry browser PASS'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success
          DESC='PASS_C6_DEV_ENTRY_BROWSER'
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC='FAIL_C6_DEV_ENTRY_BROWSER'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-dev-entry/$DESC" -f description="$DESC" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf "$OUT_DIR" firebase.c6-entry-p0.json
