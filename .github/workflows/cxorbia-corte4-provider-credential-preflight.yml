name: CXOrbia Corte 4 Provider Credential Preflight

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/workflows/cxorbia-corte4-provider-credential-preflight.yml'
      - '.github/cxorbia-firebase-requests/corte4-provider-credential-preflight.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: cxorbia-corte4-provider-credential-preflight
  cancel-in-progress: true

jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact request and select first structurally valid credential
        id: preflight
        env:
          DEDICATED_CREATOR_JSON: ${{ secrets.CXORBIA_GCP_PROJECT_CREATOR_JSON }}
          ALT_CREATOR_JSON: ${{ secrets.GOOGLE_CLOUD_PROJECT_CREATOR_JSON }}
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte4-provider-preflight
          node <<'NODE'
          const fs=require('fs');
          const p='.github/cxorbia-firebase-requests/corte4-provider-credential-preflight.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const expected={
            schemaVersion:'cxorbia.provider-credential-preflight.v1',
            enabled:true,
            repository:'paulaosoriof86/demoCXOrbia',
            branch:'docs-tya-v6-v71-audit',
            pullRequest:7,
            production:false,
            providerCalls:false,
            providerWrites:false
          };
          for(const [k,v] of Object.entries(expected)) if(r[k]!==v) throw new Error(`request mismatch:${k}`);
          NODE

          node <<'NODE'
          const fs=require('fs');
          const candidates=[
            ['dedicated_project_creator', process.env.DEDICATED_CREATOR_JSON||''],
            ['alternate_project_creator', process.env.ALT_CREATOR_JSON||''],
            ['existing_dev_service_account', process.env.EXISTING_DEV_JSON||'']
          ];
          const inspected=[];
          let selected=null;
          for(const [route,raw] of candidates){
            if(!raw){inspected.push({route,present:false,shapeValid:false});continue;}
            let parsed=null;
            try{parsed=JSON.parse(raw);}catch{}
            const shapeValid=Boolean(parsed&&parsed.type==='service_account'&&parsed.project_id&&parsed.client_email&&parsed.private_key);
            inspected.push({route,present:true,shapeValid});
            if(!selected&&shapeValid) selected={route,raw};
          }
          const report={
            decision:selected?'PASS_PROVIDER_CREDENTIAL_ROUTE_AVAILABLE':'BLOCKED_PROVIDER_CREDENTIAL_ROUTE_UNAVAILABLE_OR_INVALID',
            route:selected?.route||'none',
            credentialAvailable:Boolean(selected),
            credentialShapeValid:Boolean(selected),
            candidateCount:inspected.length,
            presentCandidateCount:inspected.filter(x=>x.present).length,
            invalidPresentCandidateCount:inspected.filter(x=>x.present&&!x.shapeValid).length,
            inspected:inspected.map(x=>({route:x.route,present:x.present,shapeValid:x.shapeValid})),
            providerCalls:false,
            providerWrites:false,
            secretValuesOutput:false,
            production:false
          };
          fs.writeFileSync('.tmp/corte4-provider-preflight/report.source-safe.json',JSON.stringify(report,null,2)+'\n');
          if(selected) fs.writeFileSync('.tmp/corte4-provider-preflight/selected-credential.json',selected.raw,{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`decision=${report.decision}\nroute=${report.route}\navailable=${report.credentialAvailable}\nshape_valid=${report.credentialShapeValid}\ninvalid_present=${report.invalidPresentCandidateCount}\n`);
          console.log(JSON.stringify(report,null,2));
          NODE

          rm -f .tmp/corte4-provider-preflight/selected-credential.json

      - name: Publish status and PR evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report='.tmp/corte4-provider-preflight/report.source-safe.json'
          if [ ! -f "$report" ]; then
            mkdir -p .tmp/corte4-provider-preflight
            echo '{"decision":"BLOCKED_PREFLIGHT_REPORT_MISSING","route":"unknown","credentialAvailable":false,"credentialShapeValid":false,"invalidPresentCandidateCount":0,"providerCalls":false,"providerWrites":false,"secretValuesOutput":false,"production":false}' > "$report"
          fi
          node - "$report" <<'NODE' > .tmp/corte4-provider-preflight/status.env
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const pass=r.decision==='PASS_PROVIDER_CREDENTIAL_ROUTE_AVAILABLE';
          const safeRoute=String(r.route||'unknown').replace(/[^a-z0-9_-]/gi,'_').slice(0,40);
          console.log([
            `STATE=${pass?'success':'error'}`,
            `DECISION=${r.decision}`,
            `ROUTE=${safeRoute}`,
            `AVAILABLE=${r.credentialAvailable}`,
            `SHAPE=${r.credentialShapeValid}`,
            `INVALID_PRESENT=${Number(r.invalidPresentCandidateCount||0)}`,
            `CONTEXT=cxorbia/corte4-provider-route-${safeRoute}-shape-${r.credentialShapeValid?'valid':'invalid'}`
          ].join('\n'));
          NODE
          source .tmp/corte4-provider-preflight/status.env
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f description="Provider credential preflight: $DECISION" >/dev/null
          body=$(cat <<EOF
          ## Corte 4 · preflight de credencial provider

          - Decision: \`$DECISION\`
          - Ruta válida seleccionada: \`$ROUTE\`
          - Credencial válida disponible: \`$AVAILABLE\`
          - Estructura válida: \`$SHAPE\`
          - Candidatas presentes pero inválidas: \`$INVALID_PRESENT\`
          - Provider calls: \`0\`
          - Provider writes: \`0\`
          - Secret values expuestos: \`0\`
          - Producción: \`false\`
          EOF
          )
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-corte4-provider-credential-preflight
          path: .tmp/corte4-provider-preflight
          if-no-files-found: error
          retention-days: 14
