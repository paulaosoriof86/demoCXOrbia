name: CXOrbia Corte 4 Provider Credential Preflight

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/workflows/cxorbia-corte4-provider-credential-preflight.yml'
      - '.github/cxorbia-firebase-requests/corte4-provider-credential-preflight.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: cxorbia-corte4-provider-credential-preflight
  cancel-in-progress: true

jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact request and detect credential route
        id: preflight
        env:
          DEDICATED_CREATOR_JSON: ${{ secrets.CXORBIA_GCP_PROJECT_CREATOR_JSON }}
          ALT_CREATOR_JSON: ${{ secrets.GOOGLE_CLOUD_PROJECT_CREATOR_JSON }}
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte4-provider-preflight
          node <<'NODE'
          const fs=require('fs');
          const p='.github/cxorbia-firebase-requests/corte4-provider-credential-preflight.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const expected={
            schemaVersion:'cxorbia.provider-credential-preflight.v1',
            enabled:true,
            repository:'paulaosoriof86/demoCXOrbia',
            branch:'docs-tya-v6-v71-audit',
            pullRequest:7,
            production:false,
            providerCalls:false,
            providerWrites:false
          };
          for(const [k,v] of Object.entries(expected)) if(r[k]!==v) throw new Error(`request mismatch:${k}`);
          NODE
          route='none'
          credential=''
          if [ -n "$DEDICATED_CREATOR_JSON" ]; then route='dedicated_project_creator'; credential="$DEDICATED_CREATOR_JSON";
          elif [ -n "$ALT_CREATOR_JSON" ]; then route='alternate_project_creator'; credential="$ALT_CREATOR_JSON";
          elif [ -n "$EXISTING_DEV_JSON" ]; then route='existing_dev_service_account'; credential="$EXISTING_DEV_JSON";
          fi
          type_valid=false
          project_id_present=false
          client_email_present=false
          if [ "$route" != 'none' ]; then
            printf '%s' "$credential" > .tmp/corte4-provider-preflight/credential.json
            chmod 600 .tmp/corte4-provider-preflight/credential.json
            node <<'NODE'
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('.tmp/corte4-provider-preflight/credential.json','utf8'));
            fs.writeFileSync('.tmp/corte4-provider-preflight/shape.env',[
              `TYPE_VALID=${c.type==='service_account'}`,
              `PROJECT_ID_PRESENT=${Boolean(c.project_id)}`,
              `CLIENT_EMAIL_PRESENT=${Boolean(c.client_email)}`
            ].join('\n')+'\n');
            NODE
            source .tmp/corte4-provider-preflight/shape.env
            type_valid="$TYPE_VALID"
            project_id_present="$PROJECT_ID_PRESENT"
            client_email_present="$CLIENT_EMAIL_PRESENT"
          fi
          rm -f .tmp/corte4-provider-preflight/credential.json .tmp/corte4-provider-preflight/shape.env
          ROUTE="$route" TYPE_VALID="$type_valid" PROJECT_ID_PRESENT="$project_id_present" CLIENT_EMAIL_PRESENT="$client_email_present" node <<'NODE'
          const fs=require('fs');
          const route=process.env.ROUTE;
          const shapeValid=process.env.TYPE_VALID==='true'&&process.env.PROJECT_ID_PRESENT==='true'&&process.env.CLIENT_EMAIL_PRESENT==='true';
          const available=route!=='none';
          const report={
            decision: available&&shapeValid?'PASS_PROVIDER_CREDENTIAL_ROUTE_AVAILABLE':'BLOCKED_PROVIDER_CREDENTIAL_ROUTE_UNAVAILABLE_OR_INVALID',
            route,
            credentialAvailable:available,
            credentialShapeValid:shapeValid,
            providerCalls:false,
            providerWrites:false,
            secretValuesOutput:false,
            production:false
          };
          fs.writeFileSync('.tmp/corte4-provider-preflight/report.source-safe.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`decision=${report.decision}\nroute=${route}\navailable=${available}\nshape_valid=${shapeValid}\n`);
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Publish status and PR evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report='.tmp/corte4-provider-preflight/report.source-safe.json'
          if [ ! -f "$report" ]; then
            mkdir -p .tmp/corte4-provider-preflight
            echo '{"decision":"BLOCKED_PREFLIGHT_REPORT_MISSING","route":"unknown","credentialAvailable":false,"credentialShapeValid":false,"providerCalls":false,"providerWrites":false,"secretValuesOutput":false,"production":false}' > "$report"
          fi
          node - "$report" <<'NODE' > .tmp/corte4-provider-preflight/status.env
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const pass=r.decision==='PASS_PROVIDER_CREDENTIAL_ROUTE_AVAILABLE';
          console.log([
            `STATE=${pass?'success':'error'}`,
            `DECISION=${r.decision}`,
            `ROUTE=${r.route}`,
            `AVAILABLE=${r.credentialAvailable}`,
            `SHAPE=${r.credentialShapeValid}`
          ].join('\n'));
          NODE
          source .tmp/corte4-provider-preflight/status.env
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='cxorbia/corte4-provider-credential-preflight' \
            -f description="Provider credential preflight: $DECISION" >/dev/null
          body=$(cat <<EOF
          ## Corte 4 · preflight de credencial provider

          - Decision: \`$DECISION\`
          - Ruta disponible: \`$ROUTE\`
          - Credencial presente: \`$AVAILABLE\`
          - Estructura válida: \`$SHAPE\`
          - Provider calls: \`0\`
          - Provider writes: \`0\`
          - Secret values expuestos: \`0\`
          - Producción: \`false\`
          EOF
          )
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-corte4-provider-credential-preflight
          path: .tmp/corte4-provider-preflight
          if-no-files-found: error
          retention-days: 14
