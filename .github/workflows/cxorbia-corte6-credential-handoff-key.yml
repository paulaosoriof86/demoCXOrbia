name: CXOrbia Corte 6 Credential Handoff Key

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-credential-handoff-key-request.json'
      - 'tools/release/cxorbia-corte6-credential-handoff-key-provision.mjs'
      - '.github/workflows/cxorbia-corte6-credential-handoff-key.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-corte6-credential-handoff-key
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate request
        id: gate
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const r=require('./backend/config/corte6-credential-handoff-key-request.json');
          if(r.schemaVersion!=='cxorbia.corte6.credential-handoff-key-request.v1'||r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.firebaseProjectId!=='cxorbia-backend-dev')throw new Error('identity_mismatch');
          for(const k of ['providerWrites','authWrites','firestoreWrites','rulesDeploys','hostingDeploys','storageWrites','hrWrites','legacyWrites'])if(r[k]!==0)throw new Error('unsafe:'+k);
          if(r.production!==false||r.merge!==false||r.piiExported!==false||r.credentialsExported!==false||r.secretsExported!==false)throw new Error('unsafe_scope');
          console.log('execute='+(r.enabled===true&&r.consumed===false&&r.status==='ready'?'true':'false'));
          NODE
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.execute == 'true'
        with:
          node-version: '24'
      - name: Load canonical DEV service account secret
        if: steps.gate.outputs.execute == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-handoff-key-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync('.tmp/c6-handoff-key-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-handoff-key-private/credentials.json" >> "$GITHUB_ENV"
      - name: Generate transport public key and encrypted private material
        id: provision
        if: steps.gate.outputs.execute == 'true'
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
        run: |
          set -euo pipefail
          node --check tools/release/cxorbia-corte6-credential-handoff-key-provision.mjs
          node tools/release/cxorbia-corte6-credential-handoff-key-provision.mjs
          node <<'NODE'
          const fs=require('fs');
          const pub=JSON.parse(fs.readFileSync('backend/secure/corte6-credential-handoff-public.json','utf8'));
          const enc=JSON.parse(fs.readFileSync('backend/secure/corte6-credential-handoff-private.enc.json','utf8'));
          if(pub.projectId!=='cxorbia-backend-dev'||enc.projectId!=='cxorbia-backend-dev'||pub.fingerprintSha256!==enc.fingerprintSha256)throw new Error('key_identity_mismatch');
          if(pub.safety?.containsPrivateKey!==false||enc.safety?.privateKeyEncryptedAtRest!==true)throw new Error('key_safety_mismatch');
          if(JSON.stringify(pub).includes('PRIVATE KEY')||JSON.stringify(enc).includes('PRIVATE KEY'))throw new Error('raw_private_key_leak');
          NODE
      - name: Persist public key, encrypted private material and freeze request
        if: steps.gate.outputs.execute == 'true' && steps.provision.outcome == 'success'
        run: |
          set -euo pipefail
          cp backend/secure/corte6-credential-handoff-public.json /tmp/c6-handoff-public.json
          cp backend/secure/corte6-credential-handoff-private.enc.json /tmp/c6-handoff-private.enc.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p backend/secure
          cp /tmp/c6-handoff-public.json backend/secure/corte6-credential-handoff-public.json
          cp /tmp/c6-handoff-private.enc.json backend/secure/corte6-credential-handoff-private.enc.json
          node <<'NODE'
          const fs=require('fs');const p='backend/config/corte6-credential-handoff-key-request.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.status='consumed_key_ready';r.enabled=false;r.consumed=true;r.consumedAt=new Date().toISOString();r.nextGate='EMBED_PUBLIC_KEY_IN_OFFLINE_LEGACY_CREDENTIAL_TOOL';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/secure/corte6-credential-handoff-public.json backend/secure/corte6-credential-handoff-private.enc.json backend/config/corte6-credential-handoff-key-request.json
          git commit -m 'security: provision Corte 6 encrypted credential handoff key'
          git push origin HEAD:docs-tya-v6-v71-audit
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success;DESC='PASS_C6_CREDENTIAL_HANDOFF_KEY'
          if [ '${{ job.status }}' != 'success' ]; then STATE=error;DESC='FAIL_C6_CREDENTIAL_HANDOFF_KEY'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-credential-handoff/${DESC}" -f description="$DESC" >/dev/null
      - name: Cleanup
        if: always()
        run: rm -rf .tmp/c6-handoff-key-private
