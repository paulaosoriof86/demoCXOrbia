name: CXOrbia I4B Retry1 Authorized Execution On Observable PR Lane
# Authorized synthetic-only Retry1. Observable PR lane; source-truth verifier v9.1; same gate/scope, no expansion.

on:
  pull_request:
    branches: [release/cxorbia-tya-rc-20260630]
    types: [synchronize]
    paths: [.github/workflows/cxorbia-i4b-retry1-readonly-materialization-probe.yml]

permissions:
  contents: write

concurrency:
  group: cxorbia-i4b-single-dev-visit-lifecycle-e2e-retry1
  cancel-in-progress: true

env:
  REQUEST_FILE: backend/config/i4b-single-dev-visit-lifecycle-e2e-write-gate-request.json
  SHOPPER_REQUEST: backend/config/i4a-dedicated-test-shopper-create-request.json
  OUT_DIR: .tmp/i4b-single-dev-visit-lifecycle-e2e-retry1
  PRIVATE_DIR: .tmp/i4b-retry1-private
  EVIDENCE_FILE: app/docs/evidence/I4B-VISIT-LIFECYCLE-E2E-RETRY1-RUNTIME-OBSERVED.json

jobs:
  retry1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate synchronized source truth and exact authorization
        env:
          CXORBIA_ALLOW_DETACHED_HEAD: '1'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$PRIVATE_DIR"
          node tools/verify-cxorbia-source-truth-sync.mjs > "$OUT_DIR/source-truth.json"
          node -e "const x=require('./$OUT_DIR/source-truth.json');if(x.decision!=='PASS_SOURCE_TRUTH_SYNC')process.exit(1);console.log(x.decision)"
          node tools/verify-cxorbia-i4b-visit-provider-source.mjs > "$OUT_DIR/provider-source.json"
          node -e "const x=require('./$OUT_DIR/provider-source.json');if(x.decision!=='PASS_I4B_VISIT_PROVIDER_SOURCE')process.exit(1);console.log(x.decision)"
          node --check tools/cxorbia-i4b-retry1-runtime-executor.mjs
          node --check tools/cxorbia-i4b-retry1-finalize.mjs
          touch "$OUT_DIR/PREPROVIDER_VALIDATED"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare DEV runtime
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
          node -e "const fs=require('fs'),raw=process.env.EXISTING_DEV_JSON||'';let x;try{x=JSON.parse(raw)}catch{};if(!(x&&x.type==='service_account'&&x.project_id==='cxorbia-backend-dev'&&x.client_email&&x.private_key))throw new Error('DEV_SERVICE_ACCOUNT_INVALID');fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"

      - name: Execute authorized synthetic lifecycle
        run: node tools/cxorbia-i4b-retry1-runtime-executor.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i4b-retry1-provider-evidence
          path: .tmp/i4b-single-dev-visit-lifecycle-e2e-retry1/
          if-no-files-found: warn
          retention-days: 14

      - name: Finalize only after pre-provider validation
        if: always()
        run: |
          set -euo pipefail
          node tools/cxorbia-i4b-retry1-finalize.mjs
          git config user.name cxorbia-gate-bot
          git config user.email cxorbia-gate-bot@users.noreply.github.com
          git add "$REQUEST_FILE" "$EVIDENCE_FILE"
          git commit -m "evidence(i4b): consume retry1 and persist lifecycle E2E result"
          git push origin HEAD:docs-tya-v6-v71-audit
