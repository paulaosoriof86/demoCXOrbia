name: CXOrbia Phase A Live Execution Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'app/docs/CHECKPOINT-OPERATIVO-CXORBIA-TYA-VIGENTE.md'
      - 'app/docs/PHASE-A-BLOCK-PROGRESS-TRACKER-TYA-20260704.md'
      - 'app/docs/PHASE-A-PLAN-LOCK-NO-DEVIATION-20260704.md'
      - 'app/docs/SOURCE-LOCK-C6-STAFF-PRIVATE-EXECUTION-HANDOFF-PASS-20260811.md'
      - 'backend/contracts/c6-staff-repair-bootstrap-exact-write-v2.json'
      - '.github/cxorbia-firebase-requests/c6-staff-repair-bootstrap-exact-write-v2.json'
      - 'tools/release/cxorbia-c6-staff-repair-bootstrap-exact-write-v2.mjs'
      - 'backend/contracts/c6-staff-private-execution-handoff-v1.json'
      - 'backend/runtime/private-handoff/c6-staff-private-execution-handoff.mjs'
      - 'backend/contracts/c6-staff-d-technical-login-rebase-v1.json'
      - 'app/adapters/tya-c6-shopper-auth-click-guard-v1.js'
      - 'app/adapters/tya-canonical-finance-read-model-v2.js'
      - 'app/adapters/cxorbia-command-adapter-v1.js'
      - 'app/adapters/cxorbia-shopper-admin-command-contract-v1.js'
      - 'app/adapters/cxorbia-hr-write-adapter-contract-v1.js'
      - 'tools/qa/verify-root-cause-correction-iteration1.mjs'
      - 'tools/qa/verify-phase-a-live-execution-checkpoint.mjs'
      - '.github/workflows/cxorbia-phase-a-live-checkpoint.yml'
  pull_request:
    branches:
      - release/cxorbia-tya-rc-20260630
    paths:
      - 'app/docs/CHECKPOINT-OPERATIVO-CXORBIA-TYA-VIGENTE.md'
      - 'app/docs/PHASE-A-BLOCK-PROGRESS-TRACKER-TYA-20260704.md'
      - 'app/docs/PHASE-A-PLAN-LOCK-NO-DEVIATION-20260704.md'
      - 'app/docs/SOURCE-LOCK-C6-STAFF-PRIVATE-EXECUTION-HANDOFF-PASS-20260811.md'
      - 'backend/contracts/c6-staff-repair-bootstrap-exact-write-v2.json'
      - '.github/cxorbia-firebase-requests/c6-staff-repair-bootstrap-exact-write-v2.json'
      - 'tools/release/cxorbia-c6-staff-repair-bootstrap-exact-write-v2.mjs'
      - 'backend/contracts/c6-staff-private-execution-handoff-v1.json'
      - 'backend/runtime/private-handoff/c6-staff-private-execution-handoff.mjs'
      - 'backend/contracts/c6-staff-d-technical-login-rebase-v1.json'
      - 'app/adapters/tya-c6-shopper-auth-click-guard-v1.js'
      - 'app/adapters/tya-canonical-finance-read-model-v2.js'
      - 'app/adapters/cxorbia-command-adapter-v1.js'
      - 'app/adapters/cxorbia-shopper-admin-command-contract-v1.js'
      - 'app/adapters/cxorbia-hr-write-adapter-contract-v1.js'
      - 'tools/qa/verify-root-cause-correction-iteration1.mjs'
      - 'tools/qa/verify-phase-a-live-execution-checkpoint.mjs'
      - '.github/workflows/cxorbia-phase-a-live-checkpoint.yml'

permissions:
  contents: read

jobs:
  verify-live-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install transient source-check dependency
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Validate Exact Write V2 source syntax
        run: node --check tools/release/cxorbia-c6-staff-repair-bootstrap-exact-write-v2.mjs
      - name: Validate Exact Write V2 source preflight only
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_C6_STAFF_WRITE_REQUEST: .github/cxorbia-firebase-requests/c6-staff-repair-bootstrap-exact-write-v2.json
          CXORBIA_C6_STAFF_WRITE_OUT: .tmp/c6-staff-v2-source-preflight/report.json
        run: node tools/release/cxorbia-c6-staff-repair-bootstrap-exact-write-v2.mjs --source-self-test
      - name: Validate Iteration 1 corrected source syntax
        run: |
          node --check app/adapters/tya-c6-shopper-auth-click-guard-v1.js
          node --check app/adapters/tya-canonical-finance-read-model-v2.js
          node --check app/adapters/cxorbia-command-adapter-v1.js
          node --check app/adapters/cxorbia-shopper-admin-command-contract-v1.js
          node --check app/adapters/cxorbia-hr-write-adapter-contract-v1.js
          node --check tools/qa/verify-root-cause-correction-iteration1.mjs
      - name: Verify Iteration 1 root-cause source contract
        run: node tools/qa/verify-root-cause-correction-iteration1.mjs
      - name: Verify Phase A current operational checkpoint
        run: node tools/qa/verify-phase-a-live-execution-checkpoint.mjs
