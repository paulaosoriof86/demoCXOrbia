name: CXOrbia Phase A Live Execution Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'app/docs/CHECKPOINT-OPERATIVO-CXORBIA-TYA-VIGENTE.md'
      - 'app/docs/PHASE-A-BLOCK-PROGRESS-TRACKER-TYA-20260704.md'
      - 'app/docs/PHASE-A-PLAN-LOCK-NO-DEVIATION-20260704.md'
      - 'app/docs/SOURCE-LOCK-C6-STAFF-PRIVATE-EXECUTION-HANDOFF-PASS-20260811.md'
      - 'backend/contracts/c6-staff-repair-bootstrap-exact-write-v2.json'
      - '.github/cxorbia-firebase-requests/c6-staff-repair-bootstrap-exact-write-v2.json'
      - 'tools/qa/verify-phase-a-live-execution-checkpoint.mjs'
      - '.github/workflows/cxorbia-phase-a-live-checkpoint.yml'
  pull_request:
    branches:
      - release/cxorbia-tya-rc-20260630
    paths:
      - 'app/docs/CHECKPOINT-OPERATIVO-CXORBIA-TYA-VIGENTE.md'
      - 'app/docs/PHASE-A-BLOCK-PROGRESS-TRACKER-TYA-20260704.md'
      - 'app/docs/PHASE-A-PLAN-LOCK-NO-DEVIATION-20260704.md'
      - 'app/docs/SOURCE-LOCK-C6-STAFF-PRIVATE-EXECUTION-HANDOFF-PASS-20260811.md'
      - 'backend/contracts/c6-staff-repair-bootstrap-exact-write-v2.json'
      - '.github/cxorbia-firebase-requests/c6-staff-repair-bootstrap-exact-write-v2.json'
      - 'tools/qa/verify-phase-a-live-execution-checkpoint.mjs'
      - '.github/workflows/cxorbia-phase-a-live-checkpoint.yml'

permissions:
  contents: read

jobs:
  verify-live-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Phase A current operational checkpoint
        run: node tools/qa/verify-phase-a-live-execution-checkpoint.mjs
