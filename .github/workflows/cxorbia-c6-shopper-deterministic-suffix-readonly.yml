name: CXOrbia C6 Shopper Crosswalk Root Fix Source Only

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - backend/config/corte6-shopper-deterministic-suffix-readonly-request.json

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-c6-shopper-crosswalk-rootfix-source-only-known-lane
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/corte6-shopper-deterministic-suffix-readonly-request.json
  TARGET_FILE: tools/qa/cxorbia-c6-shopper-deterministic-suffix-readonly.mjs
  PATCHER_FILE: tools/qa/cxorbia-c6-shopper-deterministic-suffix-crosswalk-rootfix-source-only.mjs
  EVIDENCE_FILE: app/docs/evidence/CORTE6-SHOPPER-DETERMINISTIC-SUFFIX-CROSSWALK-ROOTFIX-SOURCE-STATIC-PASS-LATEST.json

jobs:
  source-only-rootfix:
    name: Apply crosswalk root fix and stop before provider reads
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: docs-tya-v6-v71-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read request state
        id: request
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`enabled=${x.enabled===true?'true':'false'}\n`);
          NODE

      - name: Validate exact one-shot source-only authorization
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ensure=(condition,code)=>{if(!condition)throw new Error(code);};
          ensure(x.schemaVersion==='cxorbia.c6.shopper-deterministic-suffix-crosswalk-rootfix-source-only-request.v1','request_schema_invalid');
          ensure(x.repository==='paulaosoriof86/demoCXOrbia'&&x.branch==='docs-tya-v6-v71-audit'&&Number(x.pullRequest)===7,'repository_lane_invalid');
          ensure(x.enabled===true&&x.consumed===false&&x.status==='authorized_execute_once'&&x.authorizedBy==='Paula','authorization_state_invalid');
          ensure(x.targetHeadSha===parent&&head!==parent,'target_head_invalid');
          ensure(changed.length===1&&changed[0]===process.env.REQUEST_FILE,'request_commit_scope_invalid:'+changed.join(','));
          ensure(Number(x.allowedExecutions)===1&&x.providerReads===false&&x.providerWrites===false,'source_only_scope_invalid');
          ensure(x.mode==='source_only_crosswalk_rootfix','mode_invalid');
          ensure(x.expectedStableCredentialsMapped===101&&x.expectedStableCredentialsUnmapped===8,'stable_crosswalk_reference_invalid');
          ensure(x.expectedPlanRows===340&&JSON.stringify(x.suffixLengths)===JSON.stringify([4,6,8]),'plan_or_suffix_contract_invalid');
          for(const key of ['dataWrites','deploy','merge','production','firestoreWrites','authWrites','passwordChanges','passwordResets','membershipWrites','rulesWrites','storageWrites','hrWrites','make','gemini','payments']){
            ensure(x.safeState?.[key]===false,'unsafe_scope_'+key);
          }
          NODE

      - name: Apply exact source root fix
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node "$PATCHER_FILE" --apply

      - name: Install transient static dependency
        if: steps.request.outputs.enabled == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0

      - name: Execute source and static gates
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node --check "$TARGET_FILE"
          node --check "$PATCHER_FILE"
          node "$PATCHER_FILE" --verify
          node "$TARGET_FILE" --self-test
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync(process.env.TARGET_FILE,'utf8');
          const required=[
            'const STABLE_CREDENTIALS_MAPPED = 101;',
            'const STABLE_CREDENTIALS_UNMAPPED = 8;',
            'propagateLinkedSourceTechKeys(relationIndex, source, shopperId);',
            'const credentialCrosswalkParity =',
            'credentialCrosswalkParity &&',
            'credential_crosswalk_drift:',
            'PASS_CREDENTIAL_CROSSWALK_TECH_KEY_PROPAGATION',
            'PASS_CREDENTIAL_CROSSWALK_PARITY_HARD_STOP'
          ];
          const missing=required.filter(token=>!source.includes(token));
          if(missing.length)throw new Error('static_gate_missing:'+missing.join('|'));
          if(!source.includes('planRows.push({')||!source.includes('suffixLength: row.suffixLength'))throw new Error('plan_or_suffix_schema_missing');
          NODE

      - name: Materialize sanitized evidence and consume request
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const source=fs.readFileSync(process.env.TARGET_FILE,'utf8');
          const generatedAt=new Date().toISOString();
          const evidence={
            schemaVersion:'cxorbia.c6.shopper-deterministic-suffix-crosswalk-rootfix-source-static.v1',
            generatedAt,
            decision:'PASS_C6_DETERMINISTIC_SUFFIX_CROSSWALK_ROOTFIX_SOURCE_STATIC',
            repository:x.repository,
            branch:x.branch,
            pullRequest:x.pullRequest,
            requestId:x.requestId,
            requestCommitSha:process.env.GITHUB_SHA,
            targetHeadSha:x.targetHeadSha,
            sourceSha256:crypto.createHash('sha256').update(source,'utf8').digest('hex'),
            rootFix:{
              linkedSourceTechKeysPropagated:true,
              linkedSourceBasisPreserved:true,
              stableCredentialsMapped:101,
              stableCredentialsUnmapped:8,
              credentialDriftHardStop:true,
              readyRequiresCrosswalkParity:true,
              expectedPlanRows:340,
              suffixLengths:[4,6,8]
            },
            checks:[
              'PASS_NODE_SYNTAX',
              'PASS_LINKED_SOURCE_TECH_KEYS_PROPAGATED',
              'PASS_LINKED_SOURCE_BASIS_PRESERVED',
              'PASS_CREDENTIAL_CROSSWALK_FIXTURE',
              'PASS_STABLE_CREDENTIAL_REFERENCE_101_8',
              'PASS_CREDENTIAL_DRIFT_HARD_STOP',
              'PASS_READY_REQUIRES_CROSSWALK_PARITY',
              'PASS_PLAN_340_SCHEMA_PRESERVED',
              'PASS_SUFFIX_POLICY_4_6_8_PRESERVED',
              'PASS_PROVIDER_READS_ZERO'
            ],
            safety:{providerReads:0,providerWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,membershipWrites:0,firestoreWrites:0,rulesWrites:0,storageWrites:0,hrWrites:0,hostingDeploys:0,cloudRunDeploys:0,makeCalls:0,geminiCalls:0,paymentWrites:0,merge:false,production:false},
            nextGate:'NEW_EXPLICIT_PROVIDER_READONLY_AUTHORIZATION_REQUIRED'
          };
          fs.mkdirSync(path.dirname(process.env.EVIDENCE_FILE),{recursive:true});
          fs.writeFileSync(process.env.EVIDENCE_FILE,JSON.stringify(evidence,null,2)+'\n','utf8');
          x.enabled=false;
          x.consumed=true;
          x.status='consumed_source_static_pass_no_provider_read';
          x.consumedAt=generatedAt;
          x.result={decision:evidence.decision,providerReads:0,providerWrites:0,evidence:process.env.EVIDENCE_FILE};
          fs.writeFileSync(process.env.REQUEST_FILE,JSON.stringify(x,null,2)+'\n','utf8');
          NODE

      - name: Verify exact repository delta
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//')
          for file in "${changed[@]}"; do
            case "$file" in
              "$TARGET_FILE"|"$REQUEST_FILE"|"$EVIDENCE_FILE") ;;
              *) echo "unexpected_repository_delta:$file" >&2; exit 1 ;;
            esac
          done

      - name: Commit source-only root fix directly
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILE" "$REQUEST_FILE" "$EVIDENCE_FILE"
          git diff --cached --check
          git commit -m 'fix(c6): restore deterministic suffix credential crosswalk parity gate'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish observable source-only status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success
          DESC='PASS_C6_CROSSWALK_ROOTFIX_SOURCE_ONLY_NO_PROVIDER_READ'
          if [ '${{ job.status }}' = 'failure' ]; then
            STATE=failure
            DESC='HOLD_C6_CROSSWALK_ROOTFIX_SOURCE_STATIC'
          elif [ '${{ steps.request.outputs.enabled }}' != 'true' ]; then
            DESC='SKIPPED_DISABLED_SOURCE_ONLY_REQUEST'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='cxorbia/c6-shopper-crosswalk-rootfix-source-only/overall' \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
