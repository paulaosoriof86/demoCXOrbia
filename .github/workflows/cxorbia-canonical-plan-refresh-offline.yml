name: CXOrbia Canonical Plan Refresh Offline

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/cxorbia-firebase-requests/canonical-plan-refresh-offline.json'

permissions:
  contents: write
  statuses: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate request
        run: |
          echo validate_request > /tmp/r17n-phase
          set -euo pipefail
          node <<'NODE'
          const r=require('./.github/cxorbia-firebase-requests/canonical-plan-refresh-offline.json');
          if(r.enabled!==true||r.mode!=='OFFLINE_CANONICAL_PLAN_REFRESH'||r.providerCalls!==0||r.writes!==0||r.production!==false||r.merge!==false)process.exit(1);
          NODE

      - name: Validate current no-execute tooling
        run: |
          echo validate_tooling > /tmp/r17n-phase
          set -euo pipefail
          node --check tools/migration/tya-phase-a-build-firestore-materialization-plan.mjs
          node --check tools/reconciliation/tya-r17n-post-legacy-plan-no-execute.mjs
          node --check tools/reconciliation/tya-r17n-final-write-plan-no-execute.mjs
          node -e "JSON.parse(require('fs').readFileSync('backend/contracts/phase-a-firestore-materialization-plan-v1.json','utf8'));"

      - name: Build canonical base plan from current live HR through July
        run: |
          echo build_current_base > /tmp/r17n-phase
          set -euo pipefail
          rm -rf .tmp/canonical-plan-refresh
          mkdir -p .tmp/canonical-plan-refresh app/docs/evidence
          node tools/migration/tya-phase-a-build-firestore-materialization-plan.mjs \
            --hr app/data/tya-hr-source-safe-current-through-july.js \
            --financial app/data/tya-financial-control-source-safe.js \
            --certifications app/data/tya-certification-carryover-source-safe.js \
            --out .tmp/canonical-plan-refresh/base

      - name: Validate current base plan and preserve financial evidence separately
        run: |
          echo validate_current_base > /tmp/r17n-phase
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('.tmp/canonical-plan-refresh/base/firestore-materialization-plan.json','utf8'));
          const ops=base.operations||[], paths=ops.map(o=>o.documentPath), parent='tenants/tya/projects/cinepolis', count=fn=>paths.filter(fn).length;
          const counts={operations:ops.length,tenants:count(p=>p==='tenants/tya'),projects:count(p=>p===parent),hrImports:count(p=>p.startsWith(parent+'/hrImports/')),periods:count(p=>p.startsWith(parent+'/periods/')&&!p.includes('/visits/')&&!p.includes('/liquidations/')),shoppers:count(p=>p.startsWith('tenants/tya/shoppers/')),visits:count(p=>p.includes('/visits/')),liquidations:count(p=>p.includes('/liquidations/')),certifications:count(p=>p.includes('/certifications/')),payments:count(p=>p.includes('/payments/'))};
          if(counts.operations!==1413||counts.tenants!==1||counts.projects!==1||counts.hrImports!==1||counts.periods!==14||counts.shoppers!==208||counts.visits!==616||counts.liquidations!==572||counts.certifications!==0||counts.payments!==0)throw new Error('current_base_plan_counts_unexpected:'+JSON.stringify(counts));
          const fin=JSON.parse(fs.readFileSync('backend/config/phase-a-financial-live-hr-reconciliation-r14c.source-safe.json','utf8'));
          const exact=(fin.liquidationCandidates||[]).filter(x=>x.reviewRequired===false&&String(x.matchStatus||'').includes('exact')).length, review=(fin.liquidationCandidates||[]).filter(x=>x.reviewRequired===true).length;
          if((fin.liquidationCandidates||[]).length!==247||exact!==196||review!==51)throw new Error('financial_overlay_source_counts_drift');
          const report={schemaVersion:'cxorbia.canonical-plan-refresh-offline.v4',generatedAt:new Date().toISOString(),source:'CURRENT_HR_THROUGH_JULY',providerCalls:0,writes:0,production:false,merge:false,basePlanId:base.planId||null,basePlanSha256:base.planSha256||null,counts,financialOverlayEvidence:{rows:247,exactStableVisitLinks:196,reviewRows:51,appliedInThisGate:false,reason:'R14C contract fixed shopper count 210 is stale; preserve financial source evidence for later exact execution by visitId'},canonicalShape:{parentProjectPath:parent,parentProjectPresentInPlan:paths.includes(parent),periodPaths:counts.periods,visitPaths:counts.visits},safety:{writes:false,imports:false,providerCalls:false,pii:false}};
          fs.writeFileSync('app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.md',`# Canonical plan actual source-safe hasta julio\n\n- Operaciones base: ${counts.operations}.\n- Shopper refs HR actuales: ${counts.shoppers}.\n- Visitas: ${counts.visits}.\n- Liquidaciones/control: ${counts.liquidations}.\n- R14C financiero preservado aparte: 196 links exactos / 51 review.\n- Provider calls/writes: 0/0.\n`);
          NODE

      - name: Preserve post-legacy profile and certification plan
        run: |
          echo build_post_legacy > /tmp/r17n-phase
          set -euo pipefail
          node tools/reconciliation/tya-r17n-post-legacy-plan-no-execute.mjs
          node -e "const p=require('./app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.json');if(p.safety?.providerCalls!==0||p.safety?.firestoreWrites!==0||p.safety?.executeAllowed!==false||p.offlineIdempotence?.pass!==true)process.exit(1);"

      - name: Build R17N FINAL current-HR no-execute plan
        run: |
          echo build_final > /tmp/r17n-phase
          set -euo pipefail
          node tools/reconciliation/tya-r17n-final-write-plan-no-execute.mjs
          node <<'NODE'
          const p=require('./app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json');
          if(p.schemaVersion!=='cxorbia.r17n-final-write-plan-no-execute.v2')process.exit(1);
          if(p.safety?.providerCalls!==0||p.safety?.firestoreWrites!==0||p.safety?.executeAllowed!==false||p.offlineIdempotence?.pass!==true)process.exit(1);
          if(p.identityResolution?.totalHrRefs!==208||p.identityResolution?.readyRefs!==208||p.identityResolution?.holdRefs!==0)process.exit(1);
          if(p.identityResolution?.reuseExistingRefs!==201||p.identityResolution?.linkToLegacyProfileCreateRefs!==2||p.identityResolution?.createFromCurrentHrRefs!==5)process.exit(1);
          if(p.groups?.visits?.readyCreate!==616||p.groups?.liquidationControls?.readyCreate!==572||p.exactReadyWrites?.count!==1406)process.exit(1);
          NODE

      - name: Commit evidence on latest head
        run: |
          echo commit_evidence > /tmp/r17n-phase
          set -euo pipefail
          cp app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.json /tmp/plan.json
          cp app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.md /tmp/plan.md
          cp app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.json /tmp/r17n.json
          cp app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.md /tmp/r17n.md
          cp app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json /tmp/r17n-final.json
          cp app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.md /tmp/r17n-final.md
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/plan.json app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.json
          cp /tmp/plan.md app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.md
          cp /tmp/r17n.json app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.json
          cp /tmp/r17n.md app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.md
          cp /tmp/r17n-final.json app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json
          cp /tmp/r17n-final.md app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.* app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.* app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.*
          if ! git diff --cached --quiet;then git commit -m 'evidence: build current-HR R17N final no-execute plan';git push origin HEAD:docs-tya-v6-v71-audit;fi

      - name: Persist sanitized failure phase
        if: failure()
        run: |
          set -euo pipefail
          PHASE=$(cat /tmp/r17n-phase 2>/dev/null || echo unknown)
          printf '{"schemaVersion":"cxorbia.r17n-final-offline-diagnostic.v1","phase":"%s","providerCalls":0,"writes":0,"production":false,"pii":false}\n' "$PHASE" > /tmp/r17n-diagnostic.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/r17n-diagnostic.json app/docs/evidence/R17N-FINAL-OFFLINE-DIAGNOSTIC-LATEST.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/R17N-FINAL-OFFLINE-DIAGNOSTIC-LATEST.json
          if ! git diff --cached --quiet;then git commit -m 'evidence: persist R17N final offline failure phase';git push origin HEAD:docs-tya-v6-v71-audit;fi

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ];then STATE=success;DESC='PASS_R17N_FINAL_CURRENT_HR_NO_EXECUTE';else STATE=error;DESC='HOLD_R17N_FINAL_CURRENT_HR_NO_EXECUTE';fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/canonical-plan-refresh-offline' -f description="$DESC" >/dev/null
