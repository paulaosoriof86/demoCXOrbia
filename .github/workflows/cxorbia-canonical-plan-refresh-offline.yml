name: CXOrbia Canonical Plan Refresh Offline

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/cxorbia-firebase-requests/canonical-plan-refresh-offline.json'

permissions:
  contents: write
  statuses: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate request
        run: |
          node <<'NODE'
          const r=require('./.github/cxorbia-firebase-requests/canonical-plan-refresh-offline.json');
          if(r.enabled!==true||r.mode!=='OFFLINE_CANONICAL_PLAN_REFRESH'||r.providerCalls!==0||r.writes!==0||r.production!==false||r.merge!==false)process.exit(1);
          NODE
      - name: Validate existing materialization tooling
        run: |
          node --check tools/migration/tya-phase-a-build-firestore-materialization-plan.mjs
          node --check tools/migration/tya-r14c-financial-overlay-review-plan-r16d.mjs
          node --check tools/reconciliation/tya-r17n-post-legacy-plan-no-execute.mjs
          node --check tools/reconciliation/tya-r17n-final-write-plan-no-execute.mjs
          node -e "for(const p of ['backend/contracts/phase-a-firestore-materialization-plan-v1.json','backend/contracts/phase-a-r14c-financial-overlay-review-plan-r16d-v1.json'])JSON.parse(require('fs').readFileSync(p,'utf8'));"
      - name: Build canonical base plan from current live HR through July
        run: |
          set -euo pipefail
          rm -rf .tmp/canonical-plan-refresh
          mkdir -p .tmp/canonical-plan-refresh app/docs/evidence
          node tools/migration/tya-phase-a-build-firestore-materialization-plan.mjs \
            --hr app/data/tya-hr-source-safe-current-through-july.js \
            --financial app/data/tya-financial-control-source-safe.js \
            --certifications app/data/tya-certification-carryover-source-safe.js \
            --out .tmp/canonical-plan-refresh/base
      - name: Apply existing R14C overlay/review logic
        run: |
          node tools/migration/tya-r14c-financial-overlay-review-plan-r16d.mjs \
            --plan .tmp/canonical-plan-refresh/base/firestore-materialization-plan.json \
            --financial backend/config/phase-a-financial-live-hr-reconciliation-r14c.source-safe.json \
            --controlled-financial backend/config/phase-a-financial-workbook-source-safe-r14.json \
            --out .tmp/canonical-plan-refresh/r16d
      - name: Publish sanitized current canonical summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('.tmp/canonical-plan-refresh/base/firestore-materialization-plan.json','utf8'));
          const overlay=JSON.parse(fs.readFileSync('.tmp/canonical-plan-refresh/r16d/r14c-financial-overlay-review-plan-r16d.json','utf8'));
          const ops=overlay.operations||base.operations||[],paths=ops.map(o=>o.documentPath),parentProjectPath='tenants/tya/projects/cinepolis',countPath=fn=>paths.filter(fn).length;
          const counts={operations:ops.length,tenants:countPath(p=>p==='tenants/tya'),projects:countPath(p=>p===parentProjectPath),hrImports:countPath(p=>p.startsWith('tenants/tya/hrImports/')),periods:countPath(p=>p.startsWith(parentProjectPath+'/periods/')&&!p.includes('/visits/')&&!p.includes('/liquidations/')),shoppers:countPath(p=>p.startsWith('tenants/tya/shoppers/')),visits:countPath(p=>p.includes('/visits/')),liquidations:countPath(p=>p.includes('/liquidations/')),certifications:countPath(p=>p.includes('/certifications/')),payments:countPath(p=>p.includes('/payments/'))};
          const report={schemaVersion:'cxorbia.canonical-plan-refresh-offline.v3',generatedAt:new Date().toISOString(),source:'CURRENT_HR_THROUGH_JULY',providerCalls:0,writes:0,production:false,merge:false,basePlanId:base.planId||null,basePlanSha256:base.planSha256||null,overlayPlanId:overlay.planId||null,overlayPlanSha256:overlay.planSha256||null,counts,canonicalShape:{parentProjectPath,parentProjectPresentInPlan:paths.includes(parentProjectPath),periodPaths:counts.periods,visitPaths:counts.visits},safety:{writes:false,imports:false,providerCalls:false,pii:false}};
          if(counts.operations!==1413||counts.projects!==1||counts.periods!==14||counts.shoppers!==208||counts.visits!==616||counts.liquidations!==572||counts.certifications!==0||counts.payments!==0)throw new Error('current_canonical_plan_counts_unexpected:'+JSON.stringify(counts));
          fs.writeFileSync('app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.md',`# Canonical plan actual source-safe hasta julio\n\n- Operaciones base: ${counts.operations}.\n- Shoppers HR refs: ${counts.shoppers}.\n- Visitas: ${counts.visits}.\n- Liquidaciones/control: ${counts.liquidations}.\n- Provider calls/writes: 0/0.\n`);
          NODE
      - name: Preserve post-legacy profile/certification plan
        run: |
          set -euo pipefail
          node tools/reconciliation/tya-r17n-post-legacy-plan-no-execute.mjs
          node -e "const p=require('./app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.json');if(p.safety?.providerCalls!==0||p.safety?.firestoreWrites!==0||p.offlineIdempotence?.pass!==true)process.exit(1);"
      - name: Build R17N FINAL current-HR no-execute plan
        run: |
          set -euo pipefail
          node tools/reconciliation/tya-r17n-final-write-plan-no-execute.mjs
          node -e "const p=require('./app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json');if(p.safety?.providerCalls!==0||p.safety?.firestoreWrites!==0||p.safety?.executeAllowed!==false||p.offlineIdempotence?.pass!==true||p.identityResolution?.readyRefs!==208||p.identityResolution?.holdRefs!==0||p.groups?.visits?.readyCreate!==616||p.exactReadyWrites?.count!==1406)process.exit(1);"
      - name: Commit evidence on latest head
        run: |
          set -euo pipefail
          cp app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.json /tmp/plan.json
          cp app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.md /tmp/plan.md
          cp app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.json /tmp/r17n.json
          cp app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.md /tmp/r17n.md
          cp app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json /tmp/r17n-final.json
          cp app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.md /tmp/r17n-final.md
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/plan.json app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.json
          cp /tmp/plan.md app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.md
          cp /tmp/r17n.json app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.json
          cp /tmp/r17n.md app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.md
          cp /tmp/r17n-final.json app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json
          cp /tmp/r17n-final.md app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CANONICAL-PLAN-REFRESH-OFFLINE-LATEST.* app/docs/evidence/R17N-POST-LEGACY-WRITE-PLAN-NO-EXECUTE-LATEST.* app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.*
          if ! git diff --cached --quiet;then git commit -m 'evidence: build current-HR R17N final no-execute plan';git push origin HEAD:docs-tya-v6-v71-audit;fi
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=error;DESC='HOLD_CANONICAL_PLAN_REFRESH_OFFLINE'
          if [ -f app/docs/evidence/R17N-FINAL-WRITE-PLAN-NO-EXECUTE-LATEST.json ];then STATE=success;DESC='PASS_R17N_FINAL_CURRENT_HR_NO_EXECUTE';fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/canonical-plan-refresh-offline' -f description="$DESC" >/dev/null
