name: CXOrbia Recovery I3 Human Shopper HR Probe

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-legal-browser-build-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cxorbia-recovery-i3-human-shopper-hr-probe
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 44ef1d75563eeb23eeaf3997ae112983f8e5e4d1
  PROJECT: cxorbia-backend-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  AFFECTED_SHOPPER_ID: s3
  OUT: .tmp/recovery-i3-human-shopper-hr-probe
  DEPLOY_TREE: /tmp/cxorbia-i3-human-shopper-source

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical Recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact corrected product source
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc
          node --check app/adapters/tya-canonical-shopper-portal-v2.js
          grep -q 'currentAuthenticatedEmail' app/adapters/tya-canonical-shopper-portal-v2.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install read-only probe dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Authenticate Firebase DEV read-only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Prepare exact product source
        run: |
          set -euo pipefail
          rm -rf "$DEPLOY_TREE"
          git worktree add --detach "$DEPLOY_TREE" "$PRODUCT_SOURCE_SHA"
          test "$(git -C "$DEPLOY_TREE" rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"

      - name: Prove corrected source is already served by DEV exactly
        run: |
          set -euo pipefail
          assets=(
            'app/index-backend-dev.html index-backend-dev.html'
            'app/adapters/cxorbia-exact-identity-contract-v1.js adapters/cxorbia-exact-identity-contract-v1.js'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js adapters/tya-protected-auth-hr-authority-bridge-v2.js'
            'app/adapters/tya-canonical-shopper-portal-v2.js adapters/tya-canonical-shopper-portal-v2.js'
            'app/adapters/cxorbia-legal-acceptance-durable-contract-v1.js adapters/cxorbia-legal-acceptance-durable-contract-v1.js'
          )
          : > "$OUT/asset-parity.tsv"
          for pair in "${assets[@]}"; do
            local_path="$DEPLOY_TREE/${pair%% *}"; remote_path="${pair#* }"
            expected="$(sha256sum "$local_path" | awk '{print $1}')"
            remote="$OUT/remote-$(basename "$remote_path")"
            curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$HOSTING_URL/$remote_path?i3focal=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$remote"
            actual="$(sha256sum "$remote" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$remote_path" "$expected" "$actual" "$([ "$expected" = "$actual" ] && echo MATCH || echo MISMATCH)" >> "$OUT/asset-parity.tsv"
            test "$expected" = "$actual"
          done

      - name: Prove real Auth email and Visitas Disponibles in same shopper session
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { initializeApp, applicationDefault, getApps } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          import { chromium } from 'playwright';
          const s=v=>String(v??'').trim(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          if(!getApps().length) initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(),tenant=db.collection('tenants').doc(process.env.TENANT_ID),sid=process.env.AFFECTED_SHOPPER_ID,auth=getAuth();
          const members=await tenant.collection('users').where('shopperId','==',sid).get();
          if(members.size!==1) throw new Error('AFFECTED_SHOPPER_MEMBERSHIP_DRIFT');
          const uid=members.docs[0].id,au=await auth.getUser(uid),email=s(au.email);
          if(!email) throw new Error('AUTH_EMAIL_SOURCE_NOT_PRESENT');
          const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({serviceWorkers:'allow'}),page=await ctx.newPage(),pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(s(e?.message||e)));
          try{
            const host=process.env.HOSTING_URL.replace(/\/$/,''),url=`${host}/index-backend-dev.html?cxBackendPreview=YES_PAULA_20260628_PREVIEW_DEV&cxProjectId=cinepolis&cxProtectedRuntime=YES_PAULA_20260730_PROTECTED_DEV&cxHumanFullVisual=YES_PAULA_20260731_FULL_PROFILE_DEV&i3final=${Date.now()}`;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            const token=await auth.createCustomToken(uid);
            let signed=false,lastError='';
            for(let attempt=1;attempt<=5&&!signed;attempt++){
              try{
                await page.waitForFunction(()=>window.firebase?.apps?.some(a=>a?.name==='[DEFAULT]')&&typeof window.firebase.auth==='function',null,{timeout:30000});
                signed=await page.evaluate(async t=>{try{const a=window.firebase.auth();await a.setPersistence(window.firebase.auth.Auth.Persistence.SESSION);await a.signInWithCustomToken(t);return true;}catch(e){return false;}},token);
              }catch(e){lastError=s(e?.message||e);}
              if(!signed) await sleep(800*attempt);
            }
            if(!signed) throw new Error(`SHOPPER_SIGNIN_PROBE_FAILED_${lastError}`);
            await page.reload({waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(({shopper})=>{const c=window.CX?.backendAuth?.context?.()||{};return c.authenticated===true&&String(c.role||'')==='shopper'&&String(c.shopperId||'')===shopper;},{shopper:sid},{timeout:120000});
            await page.waitForFunction(()=>window.CX_PROTECTED_AUTH_HR_AUTHORITY?.applied===true&&window.CX_PROTECTED_AUTH_HR_BOOT_RECONCILE?.completed===true,null,{timeout:150000});
            const result=await page.evaluate(async expected=>{
              const d=window.CX?.data||{},portal=window.CX_TYA_CANONICAL_SHOPPER_PORTAL||{};
              window.CX?.router?.nav?.('miperfil'); await new Promise(r=>setTimeout(r,250));
              const profileText=String(document.querySelector('#view')?.innerText||''),runtimeEmail=String(portal.currentAuthenticatedEmail?.()||'');
              const profile={authEmailRuntimeMatches:runtimeEmail===expected,emailRendered:profileText.includes(expected),pending:/Validando tu identidad|slice transitorio|Periodos HR:\s*pendiente/i.test(profileText),identityBlocked:/identidad de esta sesión no está vinculada/i.test(profileText)};
              const projects=(window.CX?.router&&typeof window.CX.router.resolveVisibleProjects==='function')?window.CX.router.resolveVisibleProjects('shopper'):(typeof d.projectsFor==='function'?d.projectsFor('shopper'):d.projects||[]);
              const allowed=new Set((projects||[]).map(pr=>d.programKey?d.programKey(pr):pr.id));
              const projByAny=id=>(d.projects||[]).find(x=>x.id===id)||(d.projects||[]).find(x=>(d.programKey?d.programKey(x):x.id)===id);
              const progKeyOf=v=>{const pr=projByAny(v.projectId);return pr?(d.programKey?d.programKey(pr):pr.id):v.projectId;};
              const pool=(d._visitas||[]).filter(v=>(!d.inScope||d.inScope(v.pais))&&allowed.has(progKeyOf(v)));
              const expectedVisits=typeof d.availableVisits==='function'?d.availableVisits(pool):pool.filter(v=>v.estado==='disponible');
              const expectedProjects=new Set(expectedVisits.map(progKeyOf)).size;
              window.CX?.router?.nav?.('visitas'); await new Promise(r=>setTimeout(r,250));
              const view=document.querySelector('#view'),text=String(view?.innerText||''),m=text.match(/(\d+) oportunidades en (\d+) proyecto\(s\) para tu perfil/i),cards=view?.querySelectorAll?.('[data-detail]')?.length||0;
              const available={expectedCount:expectedVisits.length,expectedProjectCount:expectedProjects,renderedCount:m?Number(m[1]):-1,renderedProjectCount:m?Number(m[2]):-1,detailCards:cards,pending:/slice transitorio|Periodos HR:\s*pendiente/i.test(text)};
              return {profile,available,authority:window.CX_PROTECTED_AUTH_HR_AUTHORITY||null};
            },email);
            const a=result.available,p=result.profile;
            const profilePass=p.authEmailRuntimeMatches&&p.emailRendered&&!p.pending&&!p.identityBlocked;
            const visitsPass=a.renderedCount===a.expectedCount&&a.renderedProjectCount===a.expectedProjectCount&&a.detailCards===a.expectedCount&&!a.pending;
            const out={decision:(profilePass&&visitsPass&&pageErrors.length===0)?'PASS_I3_SHOPPER_PROFILE_EMAIL_AND_AVAILABLE_VISITS':'FAIL_I3_SHOPPER_PROFILE_EMAIL_AND_AVAILABLE_VISITS',checks:{profilePass,visitsPass,noPageErrors:pageErrors.length===0},profile:p,available:a,hrAuthority:{applied:result.authority?.applied===true,hrVisits:Number(result.authority?.hrVisits||0),hrShoppers:Number(result.authority?.hrShoppers||0),ownVisits:Number(result.authority?.ownVisits||0)},valuesRedacted:true,writes:{hostingDevDeploys:0,providerWrites:0,firestoreWrites:0,authWrites:0,hrWrites:0,productionWrites:0},production:false};
            fs.writeFileSync(`${process.env.OUT}/final-shopper-profile-availability.json`,JSON.stringify(out,null,2)+'\n');
            console.log(out.decision,JSON.stringify({checks:out.checks,available:out.available,hrAuthority:out.hrAuthority}));
            if(out.decision!=='PASS_I3_SHOPPER_PROFILE_EMAIL_AND_AVAILABLE_VISITS') process.exitCode=1;
          } finally { await ctx.close(); await browser.close(); }
          NODE

      - name: Enforce final shopper focal PASS and zero writes
        run: |
          set -euo pipefail
          jq -e '.decision=="PASS_I3_SHOPPER_PROFILE_EMAIL_AND_AVAILABLE_VISITS" and .checks.profilePass==true and .checks.visitsPass==true and .checks.noPageErrors==true and .production==false and .writes.hostingDevDeploys==0 and .writes.providerWrites==0 and .writes.firestoreWrites==0 and .writes.authWrites==0 and .writes.hrWrites==0 and .writes.productionWrites==0' "$OUT/final-shopper-profile-availability.json" >/dev/null

      - name: Upload focal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-human-shopper-hr-probe-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force "$DEPLOY_TREE" 2>/dev/null || true
          rm -rf .firebase
          rm -f firebase-debug.log
