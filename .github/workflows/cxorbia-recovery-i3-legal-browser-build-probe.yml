name: CXOrbia Recovery I3 Human Shopper HR Probe

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-legal-browser-build-probe.yml
      - tools/qa/cxorbia-i3-shopper-hr-composition-probe.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cxorbia-recovery-i3-human-shopper-hr-probe
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 44ef1d75563eeb23eeaf3997ae112983f8e5e4d1
  PROJECT: cxorbia-backend-dev
  HOSTING_TARGET: cxorbia-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  AFFECTED_SHOPPER_ID: s3
  OUT: .tmp/recovery-i3-human-shopper-hr-probe
  DEPLOY_TREE: /tmp/cxorbia-i3-human-shopper-source

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical Recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact focal product source
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc
          node --check app/adapters/tya-protected-auth-hr-authority-bridge-v2.js
          node --check app/adapters/tya-canonical-shopper-portal-v2.js
          grep -q 'currentAuthenticatedEmail' app/adapters/tya-canonical-shopper-portal-v2.js
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" '{decision:"PASS_I3_AUTH_EMAIL_SOURCE_FREEZE",productSourceSha:$source,production:false}' > "$OUT/source-freeze.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install DEV deployment and probe dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --check tools/qa/cxorbia-i3-shopper-hr-composition-probe.mjs

      - name: Authenticate Firebase DEV only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Prove shopper identity source shapes read-only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { initializeApp, applicationDefault } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          import { getAuth } from 'firebase-admin/auth';
          const s=v=>String(v??'').trim();
          initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(), tenant=db.collection('tenants').doc(process.env.TENANT_ID);
          const snap=await tenant.collection('shoppers').doc(process.env.AFFECTED_SHOPPER_ID).get();
          if(!snap.exists) throw new Error('AFFECTED_SHOPPER_PROFILE_DRIFT');
          const p=snap.data()||{};
          const members=await tenant.collection('users').where('shopperId','==',process.env.AFFECTED_SHOPPER_ID).get();
          if(members.size!==1) throw new Error('AFFECTED_SHOPPER_MEMBERSHIP_DRIFT');
          const memberDoc=members.docs[0], m=memberDoc.data()||{};
          const au=await getAuth().getUser(memberDoc.id);
          const shape={shopperId:process.env.AFFECTED_SHOPPER_ID,profile:{exists:true,namePresent:!!s(p.nombre||p.name||[p.firstName,p.lastName].filter(Boolean).join(' ')),usernamePresent:!!s(p.username||p.user),phonePresent:!!s(p.whatsapp||p.phone),emailPresent:!!s(p.email),certificationPresent:!!s(p.certificationStatus)||p.certified===true||p.certificationPresented===true,cityPresent:!!s(p.ciudad||p.city),countryPresent:!!s(p.pais||p.country),profileCompleteFlag:p.perfilCompleto===true||p.profileComplete===true},membership:{exists:true,active:m.active===true,role:s(m.role),authNamespace:s(m.authNamespace)},auth:{exists:true,emailPresent:!!s(au.email),phonePresent:!!s(au.phoneNumber),displayNamePresent:!!s(au.displayName),disabled:au.disabled===true,providerIds:(au.providerData||[]).map(x=>x.providerId).filter(Boolean).sort()},valuesRedacted:true,firestoreWrites:0,authWrites:0,production:false};
          if(!shape.auth.emailPresent) throw new Error('AUTH_EMAIL_SOURCE_NOT_PRESENT');
          fs.writeFileSync(`${process.env.OUT}/shopper-identity-source-shapes.json`,JSON.stringify(shape,null,2)+'\n');
          console.log('SHOPPER_IDENTITY_SOURCE_SHAPES',JSON.stringify(shape));
          NODE

      - name: Prepare exact product source
        run: |
          set -euo pipefail
          rm -rf "$DEPLOY_TREE"
          git worktree add --detach "$DEPLOY_TREE" "$PRODUCT_SOURCE_SHA"
          test "$(git -C "$DEPLOY_TREE" rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          node --check "$DEPLOY_TREE/app/adapters/tya-canonical-shopper-portal-v2.js"

      - name: Deploy exact corrected source to Hosting DEV once
        run: |
          set -euo pipefail
          cd "$DEPLOY_TREE"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$HOSTING_TARGET" --project "$PROJECT" --non-interactive
          mkdir -p "$GITHUB_WORKSPACE/$OUT"
          jq -n -S --arg source "$PRODUCT_SOURCE_SHA" '{decision:"PASS_I3_AUTH_EMAIL_DEV_DEPLOY",project:"cxorbia-backend-dev",hostingTarget:"cxorbia-dev",productSourceSha:$source,hostingDeploys:1,production:false}' > "$GITHUB_WORKSPACE/$OUT/dev-deploy.json"

      - name: Prove exact DEV asset parity post-deploy
        run: |
          set -euo pipefail
          assets=(
            'app/index-backend-dev.html index-backend-dev.html'
            'app/adapters/cxorbia-exact-identity-contract-v1.js adapters/cxorbia-exact-identity-contract-v1.js'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js adapters/tya-protected-auth-hr-authority-bridge-v2.js'
            'app/adapters/tya-canonical-shopper-portal-v2.js adapters/tya-canonical-shopper-portal-v2.js'
            'app/adapters/cxorbia-legal-acceptance-durable-contract-v1.js adapters/cxorbia-legal-acceptance-durable-contract-v1.js'
          )
          : > "$OUT/asset-parity.tsv"
          for pair in "${assets[@]}"; do
            local_path="$DEPLOY_TREE/${pair%% *}"; remote_path="${pair#* }"
            expected="$(sha256sum "$local_path" | awk '{print $1}')"
            remote="$OUT/remote-$(basename "$remote_path")"
            curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$HOSTING_URL/$remote_path?i3focal=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$remote"
            actual="$(sha256sum "$remote" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$remote_path" "$expected" "$actual" "$([ "$expected" = "$actual" ] && echo MATCH || echo MISMATCH)" >> "$OUT/asset-parity.tsv"
            test "$expected" = "$actual"
          done

      - name: Probe Profile Full and Visitas Disponibles read-only
        run: node tools/qa/cxorbia-i3-shopper-hr-composition-probe.mjs

      - name: Prove exact Auth email is rendered in Mi Perfil
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { initializeApp, applicationDefault, getApps } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          import { chromium } from 'playwright';
          const s=v=>String(v??'').trim(),host=process.env.HOSTING_URL.replace(/\/$/,''),sid=process.env.AFFECTED_SHOPPER_ID;
          if(!getApps().length) initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(),tenant=db.collection('tenants').doc(process.env.TENANT_ID),members=await tenant.collection('users').where('shopperId','==',sid).get();
          if(members.size!==1) throw new Error('AFFECTED_SHOPPER_MEMBERSHIP_DRIFT');
          const uid=members.docs[0].id,auth=getAuth(),au=await auth.getUser(uid),email=s(au.email);
          if(!email) throw new Error('AUTH_EMAIL_SOURCE_NOT_PRESENT');
          const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({serviceWorkers:'allow'}),page=await ctx.newPage();
          try{
            const url=`${host}/index-backend-dev.html?cxBackendPreview=YES_PAULA_20260628_PREVIEW_DEV&cxProjectId=cinepolis&cxProtectedRuntime=YES_PAULA_20260730_PROTECTED_DEV&cxHumanFullVisual=YES_PAULA_20260731_FULL_PROFILE_DEV&i3email=${Date.now()}`;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.firebase?.apps?.some(a=>a?.name==='[DEFAULT]')&&typeof window.firebase.auth==='function',null,{timeout:90000});
            const token=await auth.createCustomToken(uid);
            await page.evaluate(async t=>{const a=firebase.auth();await a.setPersistence(firebase.auth.Auth.Persistence.SESSION);await a.signInWithCustomToken(t);},token);
            await page.reload({waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(({shopper})=>{const c=window.CX?.backendAuth?.context?.()||{};return c.authenticated===true&&String(c.role||'')==='shopper'&&String(c.shopperId||'')===shopper;},{shopper:sid},{timeout:120000});
            await page.waitForFunction(()=>window.CX_PROTECTED_AUTH_HR_AUTHORITY?.applied===true,null,{timeout:120000});
            await page.evaluate(()=>window.CX?.router?.nav?.('miperfil'));
            await page.waitForTimeout(300);
            const result=await page.evaluate(expected=>{const text=String(document.querySelector('#view')?.innerText||''),runtime=String(window.CX_TYA_CANONICAL_SHOPPER_PORTAL?.currentAuthenticatedEmail?.()||'');return {authEmailRuntimeMatches:runtime===expected,emailRendered:text.includes(expected),pending:/Validando tu identidad|slice transitorio|Periodos HR:\s*pendiente/i.test(text),identityBlocked:/identidad de esta sesión no está vinculada/i.test(text)};},email);
            const out={decision:(result.authEmailRuntimeMatches&&result.emailRendered&&!result.pending&&!result.identityBlocked)?'PASS_I3_AUTH_EMAIL_RENDERED':'FAIL_I3_AUTH_EMAIL_RENDERED',checks:result,valuesRedacted:true,firestoreWrites:0,authWrites:0,hrWrites:0,productionWrites:0,production:false};
            fs.writeFileSync(`${process.env.OUT}/auth-email-render.json`,JSON.stringify(out,null,2)+'\n');
            console.log(out.decision,JSON.stringify(out.checks));
            if(out.decision!=='PASS_I3_AUTH_EMAIL_RENDERED') process.exitCode=1;
          } finally { await ctx.close(); await browser.close(); }
          NODE

      - name: Enforce focal PASS and zero operational writes
        run: |
          set -euo pipefail
          jq -e '.decision=="PASS_I3_PROFILE_FULL_AVAILABLE_VISITS" and .checks.availableVisitsExact==true and .production==false and .writes.providerWrites==0 and .writes.firestoreWrites==0 and .writes.authWrites==0 and .writes.hrWrites==0 and .writes.productionWrites==0' "$OUT/affected-shopper-human-lane.json" >/dev/null
          jq -e '.decision=="PASS_I3_AUTH_EMAIL_RENDERED" and .checks.authEmailRuntimeMatches==true and .checks.emailRendered==true and .production==false and .firestoreWrites==0 and .authWrites==0 and .hrWrites==0 and .productionWrites==0' "$OUT/auth-email-render.json" >/dev/null

      - name: Upload focal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-human-shopper-hr-probe-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force "$DEPLOY_TREE" 2>/dev/null || true
          rm -rf .firebase
          rm -f firebase-debug.log
