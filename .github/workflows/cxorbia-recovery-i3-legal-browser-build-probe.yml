name: CXOrbia Recovery I3 Legal Browser Build Probe

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-legal-browser-build-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cxorbia-recovery-i3-legal-browser-build-probe
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 8775b1cccbc4a97e87e7996cf409bc1f490d0ccd
  PROJECT: cxorbia-backend-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  AFFECTED_SHOPPER_ID: s3
  OUT: .tmp/recovery-i3-legal-browser-build-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical Recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze focal source and prove no product drift
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc ':(exclude)app/docs/evidence/RECOVERY-I3-MODULE-TRUTH-MATRIX-20260916.json'
          jq -n -S --arg head "$GITHUB_SHA" --arg source "$PRODUCT_SOURCE_SHA" '{decision:"PASS_I3_LEGAL_BROWSER_PROBE_SOURCE_FREEZE",headSha:$head,productSourceSha:$source,productDrift:false,production:false,writes:0}' > "$OUT/source-freeze.json"

      - name: Prove exact DEV static assets before browser execution
        run: |
          set -euo pipefail
          assets=(
            'app/index-backend-dev.html index-backend-dev.html'
            'app/adapters/cxorbia-command-adapter-v1.js adapters/cxorbia-command-adapter-v1.js'
            'app/adapters/cxorbia-legal-acceptance-durable-contract-v1.js adapters/cxorbia-legal-acceptance-durable-contract-v1.js'
            'app/adapters/cxorbia-legal-runtime-http-v1.js adapters/cxorbia-legal-runtime-http-v1.js'
            'app/adapters/cxorbia-exact-identity-contract-v1.js adapters/cxorbia-exact-identity-contract-v1.js'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js adapters/tya-protected-auth-hr-authority-bridge-v2.js'
            'app/adapters/tya-canonical-shopper-portal-v2.js adapters/tya-canonical-shopper-portal-v2.js'
          )
          : > "$OUT/asset-parity.tsv"
          for pair in "${assets[@]}"; do
            local_path="${pair%% *}"; remote_path="${pair#* }"
            expected="$(sha256sum "$local_path" | awk '{print $1}')"
            remote="$OUT/remote-$(basename "$remote_path")"
            curl -fsSL --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$HOSTING_URL/$remote_path?i3humanbuildprobe=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$remote"
            actual="$(sha256sum "$remote" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$remote_path" "$expected" "$actual" "$([ "$expected" = "$actual" ] && echo MATCH || echo MISMATCH)" >> "$OUT/asset-parity.tsv"
            test "$expected" = "$actual"
          done
          jq -Rn '[inputs|split("\t")|{path:.[0],expectedSha256:.[1],servedSha256:.[2],classification:.[3]}] | {decision:"PASS_I3_LEGAL_DEV_ASSET_PARITY",assets:.,production:false,writes:0}' < "$OUT/asset-parity.tsv" > "$OUT/asset-parity.json"

      - name: Setup Node and fresh Chromium
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install read-only probe dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Authenticate canonical Firebase DEV read-only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Execute exact canonical human-lane legal command build
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const {initializeApp,applicationDefault,getApps}=require('firebase-admin/app');
          const {getAuth}=require('firebase-admin/auth');
          const {getFirestore}=require('firebase-admin/firestore');
          const {chromium}=require('playwright');
          const OUT=process.env.OUT,PROJECT=process.env.PROJECT,TENANT=process.env.TENANT_ID,PROJECT_ID=process.env.PROJECT_ID,HOST=process.env.HOSTING_URL.replace(/\/$/,'');
          const PREVIEW='YES_PAULA_20260628_PREVIEW_DEV';
          const PROTECTED='YES_PAULA_20260730_PROTECTED_DEV';
          const FULL='YES_PAULA_20260731_FULL_PROFILE_DEV';
          const str=v=>String(v??'').trim();
          const write=(n,v)=>fs.writeFileSync(path.join(OUT,n),JSON.stringify(v,null,2)+'\n');
          (async()=>{
            if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:PROJECT});
            const auth=getAuth(),db=getFirestore();
            const docs=(await db.collection('tenants').doc(TENANT).collection('users').get()).docs.map(d=>({id:d.id,...(d.data()||{})}));
            const candidates=docs.filter(x=>x.active===true&&str(x.authNamespace)==='staff'&&['super','admin'].includes(str(x.role))).sort((a,b)=>(str(a.role)==='super'?-1:1));
            let member=null;
            for(const x of candidates){try{await auth.getUser(x.id);member=x;break;}catch(e){if(str(e?.code)!=='auth/user-not-found')throw e;}}
            if(!member)throw new Error('AUTH_FAILURE:LEGAL_HUMAN_PROBE_STAFF_FIXTURE_MISSING');
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({serviceWorkers:'allow'});
            const page=await ctx.newPage();
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(str(e?.message||e)));
            try{
              const url=`${HOST}/index-backend-dev.html?cxBackendPreview=${PREVIEW}&cxProjectId=${encodeURIComponent(PROJECT_ID)}&cxProtectedRuntime=${PROTECTED}&cxHumanFullVisual=${FULL}&i3humanbuildprobe=${Date.now()}`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(()=>window.CX_DEV_ENTRY_CANONICAL?.lane==='authenticated-human-canonical'&&window.CX_DEV_ENTRY_CANONICAL?.fullVisual===true&&window.CX_DEV_ENTRY_CANONICAL?.technicalAuth===false,null,{timeout:90000});
              await page.waitForFunction(()=>window.firebase&&window.firebase.apps&&window.firebase.apps.length>0&&typeof window.firebase.auth==='function',null,{timeout:90000});
              const token=await auth.createCustomToken(member.id);
              await page.evaluate(async t=>{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);await firebase.auth().signInWithCustomToken(t);},token);
              await page.reload({waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(({tenant})=>{const c=window.CX?.backendAuth?.context?.()||{};return c.authenticated===true&&String(c.tenantId||'')===tenant&&window.CX?.legalRuntimeHttp&&window.CX?.legalAcceptanceDurable&&window.CX?.legalAcceptanceProviderBridge&&window.CX?.commandAdapter;},{tenant:TENANT},{timeout:120000});
              const observed=await page.evaluate(async()=>{
                const clean=v=>JSON.parse(JSON.stringify(v??null));
                await CX.legalRuntimeHttp.preload(true);
                const snap=CX.legalAcceptanceProviderBridge.snapshot?.()||null;
                const scope=snap?.scope||null,current=snap?.current||CX.legalRuntimeHttp.current?.()||null;
                const input={scope,current,idempotencyKey:'i3-live-human-build-probe-'+Date.now(),humanConfirmed:true};
                const built=CX.legalAcceptanceDurable.buildHumanAcceptanceCommand(input);
                const actor=CX.legalAcceptanceDurable.currentAuthenticatedActor?.()||{};
                return clean({url:location.pathname+location.search,entry:window.CX_DEV_ENTRY_CANONICAL||null,actor:{authenticated:actor.authenticated===true,tenantId:actor.tenantId||null,role:actor.role||null,authNamespace:actor.authNamespace||null,projectIds:Array.isArray(actor.projectIds)?actor.projectIds:[]},input:{tenantId:scope?.tenantId||null,scopeMode:scope?.scopeMode||null,projectId:scope?.projectId??null,periodId:input.periodId??null,role:scope?.role||null,authNamespace:scope?.authNamespace||null,legalContentId:current?.legalContentId||null,legalVersion:current?.legalVersion||null,contentDigest:current?.contentDigest||null,idempotencyKeyPresent:Boolean(input.idempotencyKey),humanConfirmed:input.humanConfirmed===true},built:{ok:built?.ok===true,status:built?.status||null,code:built?.code||null,errors:Array.isArray(built?.errors)?built.errors:[],command:built?.command?{commandType:built.command.commandType,entityType:built.command.entityType,tenantId:built.command.tenantId,projectId:built.command.projectId,periodId:built.command.periodId,requireProject:built.command.requireProject,requirePeriod:built.command.requirePeriod,expectedVersion:built.command.expectedVersion,actorRole:built.command.actor?.role||null}:null},executedMarkers:{durableRequirePeriodFalse:String(CX.legalAcceptanceDurable.buildHumanAcceptanceCommand).includes('requirePeriod:false'),commandAdapterHonorsRequirePeriodFalse:String(CX.commandAdapter.build).includes('requirePeriod:input.requirePeriod!==false')},legalRuntimeStatus:CX.legalRuntimeHttp.status?.()||null,providerSnapshotLoaded:Boolean(snap),providerWrites:0,legalAcceptanceWrites:0,commandExecuteCalled:false,production:false});
              });
              observed.pageErrors=pageErrors;
              const fail=observed.pageErrors.length||!observed.providerSnapshotLoaded||!observed.actor.authenticated||observed.entry?.lane!=='authenticated-human-canonical'||observed.entry?.fullVisual!==true||observed.entry?.technicalAuth!==false||observed.input.scopeMode!=='tenant'||observed.input.projectId!==null||observed.input.periodId!==null||!observed.built.ok||!observed.built.command||observed.built.command.requireProject!==false||observed.built.command.requirePeriod!==false||observed.built.command.periodId!==null||observed.built.errors.length||!observed.executedMarkers.durableRequirePeriodFalse||!observed.executedMarkers.commandAdapterHonorsRequirePeriodFalse;
              const out={decision:fail?'FAIL_I3_LEGAL_EXACT_HUMAN_BROWSER_BUILD':'PASS_I3_LEGAL_EXACT_HUMAN_BROWSER_BUILD',iteration:'I3',host:HOST,result:observed,providerWrites:0,legalAcceptanceWrites:0,commandExecuteCalls:0,production:false,generatedAt:new Date().toISOString()};
              write('live-browser-build.json',out);
              console.log(out.decision,JSON.stringify({role:observed.actor.role,scopeMode:observed.input.scopeMode,projectId:observed.input.projectId,periodId:observed.input.periodId,errors:observed.built.errors,requirePeriod:observed.built.command?.requirePeriod,lane:observed.entry?.lane}));
              if(fail)process.exitCode=2;
            } finally { await ctx.close(); await browser.close(); }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Probe affected shopper exact human lane end to end
        if: always()
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const {initializeApp,applicationDefault,getApps}=require('firebase-admin/app');
          const {getAuth}=require('firebase-admin/auth');
          const {getFirestore}=require('firebase-admin/firestore');
          const {chromium}=require('playwright');
          const OUT=process.env.OUT,PROJECT=process.env.PROJECT,TENANT=process.env.TENANT_ID,PROJECT_ID=process.env.PROJECT_ID,SHOPPER_ID=process.env.AFFECTED_SHOPPER_ID,HOST=process.env.HOSTING_URL.replace(/\/$/,'');
          const PREVIEW='YES_PAULA_20260628_PREVIEW_DEV',PROTECTED='YES_PAULA_20260730_PROTECTED_DEV',FULL='YES_PAULA_20260731_FULL_PROFILE_DEV';
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v:[];
          const write=v=>fs.writeFileSync(path.join(OUT,'affected-shopper-human-lane.json'),JSON.stringify(v,null,2)+'\n');
          const flags=p=>({username:Boolean(str(p?.username||p?.user)),phone:Boolean(str(p?.whatsapp||p?.phone)),email:Boolean(str(p?.email)),certification:Boolean(str(p?.certificationStatus)||p?.certified===true||p?.certificationPresented===true)});
          (async()=>{
            if(!getApps().length)initializeApp({credential:applicationDefault(),projectId:PROJECT});
            const auth=getAuth(),db=getFirestore(),tenant=db.collection('tenants').doc(TENANT);
            const memberSnap=await tenant.collection('users').where('shopperId','==',SHOPPER_ID).get();
            const members=memberSnap.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(m=>m.active===true&&str(m.role)==='shopper'&&str(m.authNamespace)==='shopper'&&arr(m.projectIds).map(String).includes(PROJECT_ID));
            if(members.length!==1){const out={decision:'AUTH_FAILURE',blocker:'AFFECTED_SHOPPER_MEMBERSHIP_NOT_UNIQUE',shopperId:SHOPPER_ID,membershipCount:members.length,writes:0,production:false};write(out);console.log(JSON.stringify(out));process.exit(2);}
            const member=members[0];
            try{await auth.getUser(member.id);}catch(e){const out={decision:'AUTH_FAILURE',blocker:'AFFECTED_SHOPPER_AUTH_USER_MISSING',shopperId:SHOPPER_ID,code:str(e?.code),writes:0,production:false};write(out);console.log(JSON.stringify(out));process.exit(2);}
            const profileSnap=await tenant.collection('shoppers').doc(SHOPPER_ID).get();
            const rawProfile=profileSnap.exists?(profileSnap.data()||{}):{};
            const rawProfileFlags=flags(rawProfile);
            const legalContents=(await tenant.collection('legalContents').get()).docs.map(d=>({id:d.id,...(d.data()||{})})).filter(c=>c.active!==false&&str(c.scopeMode||'tenant')==='tenant'&&str(c.currentVersion)&&/^[a-f0-9]{64}$/.test(str(c.currentDigest).toLowerCase()));
            const receipts=(await tenant.collection('legalAcceptances').get()).docs.map(d=>({id:d.id,...(d.data()||{})}));
            const current=legalContents.length===1?legalContents[0]:null;
            const legalReceipt=!!current&&receipts.some(r=>str(r.actorUid)===member.id&&str(r.tenantId)===TENANT&&str(r.scopeMode)==='tenant'&&str(r.role)==='shopper'&&str(r.authNamespace)==='shopper'&&str(r.legalContentId)===str(current.id)&&str(r.legalVersion)===str(current.currentVersion)&&str(r.contentDigest).toLowerCase()===str(current.currentDigest).toLowerCase()&&str(r.status)==='accepted'&&str(r.acceptanceMethod)==='human_ui'&&r.subjectExact===true&&Boolean(r.acceptedAt));
            const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({serviceWorkers:'allow'});const page=await ctx.newPage();const pageErrors=[];page.on('pageerror',e=>pageErrors.push(str(e?.message||e)));
            let observed;
            try{
              const url=`${HOST}/index-backend-dev.html?cxBackendPreview=${PREVIEW}&cxProjectId=${encodeURIComponent(PROJECT_ID)}&cxProtectedRuntime=${PROTECTED}&cxHumanFullVisual=${FULL}&i3affectedshopper=${Date.now()}`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(()=>window.CX_DEV_ENTRY_CANONICAL?.lane==='authenticated-human-canonical'&&window.CX_DEV_ENTRY_CANONICAL?.technicalAuth===false,null,{timeout:90000});
              await page.waitForFunction(()=>window.firebase&&window.firebase.apps&&window.firebase.apps.length>0&&typeof window.firebase.auth==='function',null,{timeout:90000});
              const token=await auth.createCustomToken(member.id);await page.evaluate(async t=>{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);await firebase.auth().signInWithCustomToken(t);},token);await page.reload({waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(({tenant,shopper})=>{const c=window.CX?.backendAuth?.context?.()||{};return c.authenticated===true&&String(c.tenantId||'')===tenant&&String(c.role||'')==='shopper'&&String(c.shopperId||'')===shopper;},{tenant:TENANT,shopper:SHOPPER_ID},{timeout:120000});
              const hr=await page.evaluate(async()=>{try{const r=await fetch('/api/tya/cinepolis/hr-live?format=json&fresh=1&i3human='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store','Pragma':'no-cache'}});const p=await r.json().catch(()=>null),s=p?.snapshot||p?.data||p||{},rt=p?._runtime||s?._runtime||{};return {http:r.status,sourceSafe:s?.sourceSafe===true,periods:Array.isArray(s?.periods)?s.periods.length:0,visits:Array.isArray(s?.visits)?s.visits.length:0,shoppers:Array.isArray(s?.shoppers)?s.shoppers.length:0,revision:rt.revision||s.sourceRevision||null,refreshError:rt.refreshError||null};}catch(e){return {http:0,error:String(e?.message||e)};}});
              await page.waitForFunction(()=>window.CX_PROTECTED_AUTH_HR_AUTHORITY?.applied===true||Boolean(window.CX_PROTECTED_AUTH_HR_AUTHORITY?.error)||window.CX_PROTECTED_AUTH_HR_BOOT_RECONCILE?.exhausted===true,null,{timeout:90000}).catch(()=>{});
              observed=await page.evaluate(()=>{const c=window.CX?.backendAuth?.context?.()||{},d=window.CX?.data||{},a=window.CX_PROTECTED_AUTH_HR_AUTHORITY||{},b=window.CX_PROTECTED_AUTH_HR_BOOT_RECONCILE||{},bs=window.CX_BACKEND_LAST_STATE||{},sid=String(c.shopperId||''),p=(typeof d.getShopper==='function'?d.getShopper(sid):null)||((Array.isArray(d.shoppers)?d.shoppers:[]).find(x=>String(x?.id||x?.shopperId||'')===sid))||{},f=v=>Boolean(String(v??'').trim()),facet=v=>typeof d.visitFacets==='function'?d.visitFacets(v):v?.canonicalFacets||{},vs=Array.isArray(d._visitas)?d._visitas:[],own=typeof d.visitsForShopper==='function'?d.visitsForShopper(sid,false):[];return {entry:window.CX_DEV_ENTRY_CANONICAL||null,context:{authenticated:c.authenticated===true,tenantId:c.tenantId||null,role:c.role||null,authNamespace:c.authNamespace||null,shopperId:c.shopperId||null,projectIds:Array.isArray(c.projectIds)?c.projectIds:[]},authority:a,boot:b,backend:{source:bs.source||null,empty:bs.empty,counts:bs.counts||null},data:{sourceMode:d.sourceMode||null,currentProjectId:d.currentProjectId||null,currentPeriodId:d.currentPeriodId||null,periods:Array.isArray(d.projects)?d.projects.length:0,visits:vs.length,shoppers:Array.isArray(d.shoppers)?d.shoppers.length:0,ownVisits:Array.isArray(own)?own.length:0,available:vs.filter(v=>facet(v)?.available===true).length,profileFlags:{username:f(p.username||p.user),phone:f(p.whatsapp||p.phone),email:f(p.email),certification:f(p.certificationStatus)||p.certified===true||p.certificationPresented===true}},legalModalVisible:[...document.querySelectorAll('.cx-modal')].some(x=>/Términos de uso y confidencialidad/i.test(String(x.innerText||''))&&getComputedStyle(x).display!=='none')}};});
              observed.hrFetch=hr;observed.pageErrors=pageErrors;observed.rawProfileFlags=rawProfileFlags;observed.rawProfileExists=profileSnap.exists;observed.legalReceiptPresent=legalReceipt;
            } finally {await ctx.close();await browser.close();}
            let decision='PASS_I3_AFFECTED_SHOPPER_HUMAN_LANE';let blocker=null;
            const c=observed?.context||{},h=observed?.hrFetch||{},a=observed?.authority||{},d=observed?.data||{};
            if(!c.authenticated||c.role!=='shopper'||c.authNamespace!=='shopper'||c.shopperId!==SHOPPER_ID||!arr(c.projectIds).map(String).includes(PROJECT_ID)){decision='AUTH_FAILURE';blocker='AFFECTED_SHOPPER_HUMAN_CONTEXT_INVALID';}
            else if(!legalReceipt){decision='PERSISTENCE_FAILURE';blocker='AFFECTED_SHOPPER_CURRENT_HUMAN_LEGAL_RECEIPT_MISSING';}
            else if(h.http!==200||h.sourceSafe!==true||h.periods<1||h.visits<1){decision='PROVIDER_FAILURE';blocker='AFFECTED_SHOPPER_BROWSER_HR_SOURCE_INVALID';}
            else if(a.applied!==true||d.periods<1||d.visits<1){decision='FUNCTIONAL_DEFECT';blocker='AFFECTED_SHOPPER_HR_AUTHORITY_NOT_COMPOSED';}
            else if((rawProfileFlags.username&&!d.profileFlags.username)||(rawProfileFlags.phone&&!d.profileFlags.phone)||(rawProfileFlags.email&&!d.profileFlags.email)||(rawProfileFlags.certification&&!d.profileFlags.certification)){decision='MAPPING_FAILURE';blocker='AFFECTED_SHOPPER_PROFILE_FIELDS_DROPPED_IN_COMPOSITION';}
            else if(pageErrors.length){decision='FUNCTIONAL_DEFECT';blocker='AFFECTED_SHOPPER_PAGE_ERRORS';}
            const out={decision,blocker,iteration:'I3',shopperFixture:SHOPPER_ID,humanLane:true,technicalAuth:false,observed,writes:0,providerWrites:0,firestoreWrites:0,authWrites:0,hrWrites:0,production:false,generatedAt:new Date().toISOString()};write(out);console.log(decision,blocker||'');if(decision!=='PASS_I3_AFFECTED_SHOPPER_HUMAN_LANE')process.exitCode=2;
          })().catch(error=>{const out={decision:'ENVIRONMENT_FAILURE',blocker:'AFFECTED_SHOPPER_HUMAN_PROBE_EXCEPTION',error:String(error?.message||error),writes:0,production:false,generatedAt:new Date().toISOString()};write(out);console.error(error);process.exitCode=1;});
          NODE

      - name: Classify focal result
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$OUT/live-browser-build.json" ]; then
            jq -e '.providerWrites==0 and .legalAcceptanceWrites==0 and .commandExecuteCalls==0 and .production==false' "$OUT/live-browser-build.json" >/dev/null
          fi
          if [ -f "$OUT/affected-shopper-human-lane.json" ]; then jq -e '.writes==0 and .production==false' "$OUT/affected-shopper-human-lane.json" >/dev/null; fi
          if [ -f "$OUT/asset-parity.json" ]; then jq -e '.production==false and .writes==0' "$OUT/asset-parity.json" >/dev/null; fi

      - name: Upload focal read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-legal-browser-build-probe-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
