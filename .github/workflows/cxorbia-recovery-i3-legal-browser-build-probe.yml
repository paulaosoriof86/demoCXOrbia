name: CXOrbia Recovery I3 Human Shopper HR Probe

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-legal-browser-build-probe.yml
      - tools/qa/cxorbia-i3-shopper-hr-composition-probe.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cxorbia-recovery-i3-human-shopper-hr-probe
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 1f3550d5c1c28e376d86aa178bd3e3015a06b5b2
  PROJECT: cxorbia-backend-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  TENANT_ID: tya
  PROJECT_ID: cinepolis
  AFFECTED_SHOPPER_ID: s3
  OUT: .tmp/recovery-i3-human-shopper-hr-probe
  DEPLOY_TREE: /tmp/cxorbia-i3-human-shopper-source
  PRIOR_DEV_DEPLOY_RUN: '35112567369'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical Recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact focal product source
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "recovery/cxorbia-phase-a-20260831"
          git cat-file -e "$PRODUCT_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc
          node --check app/adapters/tya-protected-auth-hr-authority-bridge-v2.js
          node --check app/adapters/tya-canonical-shopper-portal-v2.js
          grep -q '__sessionShopperProfile' app/adapters/tya-protected-auth-hr-authority-bridge-v2.js
          grep -q '__sessionShopperProfile' app/adapters/tya-canonical-shopper-portal-v2.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install read-only probe dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --check tools/qa/cxorbia-i3-shopper-hr-composition-probe.mjs

      - name: Authenticate Firebase DEV read-only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'

      - name: Prove shopper identity source shapes read-only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { initializeApp, applicationDefault } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          import { getAuth } from 'firebase-admin/auth';
          const s=v=>String(v??'').trim();
          initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(), tenant=db.collection('tenants').doc(process.env.TENANT_ID);
          const snap=await tenant.collection('shoppers').doc(process.env.AFFECTED_SHOPPER_ID).get();
          if(!snap.exists) throw new Error('AFFECTED_SHOPPER_PROFILE_DRIFT');
          const p=snap.data()||{};
          const members=await tenant.collection('users').where('shopperId','==',process.env.AFFECTED_SHOPPER_ID).get();
          if(members.size!==1) throw new Error('AFFECTED_SHOPPER_MEMBERSHIP_DRIFT');
          const memberDoc=members.docs[0], m=memberDoc.data()||{};
          const au=await getAuth().getUser(memberDoc.id);
          const shape={
            shopperId:process.env.AFFECTED_SHOPPER_ID,
            profile:{exists:true,namePresent:!!s(p.nombre||p.name||[p.firstName,p.lastName].filter(Boolean).join(' ')),usernamePresent:!!s(p.username||p.user),phonePresent:!!s(p.whatsapp||p.phone),emailPresent:!!s(p.email),certificationPresent:!!s(p.certificationStatus)||p.certified===true||p.certificationPresented===true,cityPresent:!!s(p.ciudad||p.city),countryPresent:!!s(p.pais||p.country),profileCompleteFlag:p.perfilCompleto===true||p.profileComplete===true,fieldNames:Object.keys(p).sort()},
            membership:{exists:true,active:m.active===true,role:s(m.role),authNamespace:s(m.authNamespace),emailPresent:!!s(m.email),usernamePresent:!!s(m.username||m.user),phonePresent:!!s(m.phone||m.whatsapp),displayNamePresent:!!s(m.displayName||m.name||m.nombre),fieldNames:Object.keys(m).sort()},
            auth:{exists:true,emailPresent:!!s(au.email),phonePresent:!!s(au.phoneNumber),displayNamePresent:!!s(au.displayName),disabled:au.disabled===true,providerIds:(au.providerData||[]).map(x=>x.providerId).filter(Boolean).sort()},
            valuesRedacted:true,firestoreWrites:0,authWrites:0,production:false
          };
          fs.writeFileSync(`${process.env.OUT}/shopper-identity-source-shapes.json`,JSON.stringify(shape,null,2)+'\n');
          console.log('SHOPPER_IDENTITY_SOURCE_SHAPES',JSON.stringify(shape));
          NODE

      - name: Inventory exact canonical profile contact certification sources read-only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { initializeApp, applicationDefault, getApps } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';
          const s=v=>String(v??'').trim();
          if(!getApps().length) initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT});
          const db=getFirestore(),tenant=db.collection('tenants').doc(process.env.TENANT_ID),sid=process.env.AFFECTED_SHOPPER_ID;
          const members=await tenant.collection('users').where('shopperId','==',sid).get();
          if(members.size!==1) throw new Error('AFFECTED_SHOPPER_MEMBERSHIP_DRIFT');
          const uid=members.docs[0].id;
          const cols=await tenant.listCollections();
          const ids=cols.map(c=>c.id).sort();
          const relevant=ids.filter(id=>/(shopper|cert|profile|contact|identity|user)/i.test(id));
          const probes=[];
          const seen=new Set();
          const add=(collection,doc,match)=>{
            const key=`${collection}/${doc.id}`; if(seen.has(key)) return; seen.add(key);
            const d=doc.data()||{};
            probes.push({collection,documentIdMatchesShopper:doc.id===sid,documentIdMatchesUid:doc.id===uid,match,fieldNames:Object.keys(d).sort(),shopperIdPresent:!!s(d.shopperId),uidPresent:!!s(d.uid||d.userId||d.authUid),emailPresent:!!s(d.email),phonePresent:!!s(d.phone||d.whatsapp),usernamePresent:!!s(d.username||d.user),certificationPresent:!!s(d.certificationStatus||d.certificationState||d.status)||d.certified===true||d.certificationPresented===true,projectIdPresent:!!s(d.projectId),periodIdPresent:!!s(d.periodId)});
          };
          for(const id of relevant){
            const c=tenant.collection(id);
            for(const [docId,label] of [[sid,'docId=shopperId'],[uid,'docId=uid']]){const d=await c.doc(docId).get();if(d.exists)add(id,d,label);}
            for(const [field,val] of [['shopperId',sid],['uid',uid],['userId',uid],['authUid',uid]]){
              try{const q=await c.where(field,'==',val).limit(10).get();q.docs.forEach(d=>add(id,d,`${field}=exact`));}catch(e){probes.push({collection:id,query:`${field}=exact`,queryError:s(e?.message||e).slice(0,120)});}
            }
          }
          const out={shopperId:sid,tenantCollectionIds:ids,relevantCollectionIds:relevant,exactMatches:probes,valuesRedacted:true,firestoreWrites:0,authWrites:0,production:false};
          fs.writeFileSync(`${process.env.OUT}/shopper-canonical-source-inventory.json`,JSON.stringify(out,null,2)+'\n');
          console.log('SHOPPER_CANONICAL_SOURCE_INVENTORY',JSON.stringify(out));
          NODE

      - name: Prepare exact product source
        run: |
          set -euo pipefail
          rm -rf "$DEPLOY_TREE"
          git worktree add --detach "$DEPLOY_TREE" "$PRODUCT_SOURCE_SHA"
          test "$(git -C "$DEPLOY_TREE" rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"

      - name: Prove exact DEV asset parity after prior successful deploy
        run: |
          set -euo pipefail
          assets=(
            'app/index-backend-dev.html index-backend-dev.html'
            'app/adapters/cxorbia-exact-identity-contract-v1.js adapters/cxorbia-exact-identity-contract-v1.js'
            'app/adapters/tya-protected-auth-hr-authority-bridge-v2.js adapters/tya-protected-auth-hr-authority-bridge-v2.js'
            'app/adapters/tya-canonical-shopper-portal-v2.js adapters/tya-canonical-shopper-portal-v2.js'
            'app/adapters/cxorbia-legal-acceptance-durable-contract-v1.js adapters/cxorbia-legal-acceptance-durable-contract-v1.js'
          )
          : > "$OUT/asset-parity.tsv"
          for pair in "${assets[@]}"; do
            local_path="$DEPLOY_TREE/${pair%% *}"; remote_path="${pair#* }"
            expected="$(sha256sum "$local_path" | awk '{print $1}')"
            remote="$OUT/remote-$(basename "$remote_path")"
            curl -fsSL --retry 8 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$HOSTING_URL/$remote_path?i3focal=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$remote"
            actual="$(sha256sum "$remote" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$remote_path" "$expected" "$actual" "$([ "$expected" = "$actual" ] && echo MATCH || echo MISMATCH)" >> "$OUT/asset-parity.tsv"
            test "$expected" = "$actual"
          done

      - name: Probe Profile Full and Visitas Disponibles read-only
        run: node tools/qa/cxorbia-i3-shopper-hr-composition-probe.mjs

      - name: Enforce exact focal PASS and zero writes
        run: |
          set -euo pipefail
          jq -e '.decision=="PASS_I3_PROFILE_FULL_AVAILABLE_VISITS" and .checks.profileFullExact==true and .checks.availableVisitsExact==true and .production==false and .writes.hostingDevDeploys==0 and .writes.providerWrites==0 and .writes.firestoreWrites==0 and .writes.authWrites==0 and .writes.hrWrites==0 and .writes.productionWrites==0' "$OUT/affected-shopper-human-lane.json" >/dev/null

      - name: Upload focal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-human-shopper-hr-probe-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force "$DEPLOY_TREE" 2>/dev/null || true
          rm -rf .firebase
          rm -f firebase-debug.log
