name: CXOrbia Live HR Current Reconcile

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - '.github/cxorbia-firebase-requests/live-hr-current-reconcile.json'

permissions:
  contents: write
  statuses: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Validate request
        run: |
          node <<'NODE'
          const r=require('./.github/cxorbia-firebase-requests/live-hr-current-reconcile.json');
          if(r.enabled!==true||r.mode!=='LIVE_HR_READ_ONLY_RECONCILIATION'||r.hrWrites!==0||r.firestoreWrites!==0||r.production!==false||r.merge!==false)process.exit(1);
          NODE

      - name: Install transient provider read tooling
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Build current HR source-safe snapshot read-only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          CXORBIA_HR_SOURCE_SAFE_OUT: .tmp/hr-current/tya-hr-source-safe.js
          CXORBIA_GATE_OUT: .tmp/hr-current/gates
          CXORBIA_HR_EARLIEST_PERIOD: '2025-06'
          CXORBIA_HR_LIVE_MAX_ROW: '140'
          CXORBIA_HR_LIVE_MAX_COL: 'AI'
        run: |
          set -euo pipefail
          mkdir -p .tmp/hr-current/gates app/docs/evidence
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs > .tmp/hr-current/build-output.json

      - name: Enforce or auto-refresh provider tab registry
        env:
          CXORBIA_HR_SOURCE_SAFE_OUT: .tmp/hr-current/tya-hr-source-safe.js
          CXORBIA_HR_TAB_REGISTRY: backend/config/tya-live-hr-tab-registry.source-safe.json
          CXORBIA_HR_TAB_REGISTRY_EVIDENCE: app/docs/evidence/LIVE-HR-TAB-REGISTRY-ENFORCEMENT-LATEST.json
        run: node tools/hr-source/tya-enforce-live-tab-registry.mjs

      - name: Persist sanitized live-HR reconciliation view
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('.tmp/hr-current/tya-hr-source-safe.js','utf8'),ctx={window:{}};vm.createContext(ctx);vm.runInContext(code,ctx);const s=ctx.window.CX_TYA_HR_SOURCE_SAFE;
          if(!s||s.sourceSafe!==true||s.safeState?.writes!==false||s.source?.tabRegistryEnforced!==true)throw new Error('registry_enforced_source_invalid');
          const periods=(s.periods||[]).map(p=>({key:p.key,visits:p.total??p.visits,byCountry:p.countries||p.byCountry}));
          const tabs=(s.tabsRead||[]).map(t=>({title:t.title,country:t.country,periodKey:t.periodKey,rows:t.rows,headerRow:t.headerRow,headerVariant:t.headerVariant}));
          const report={schemaVersion:'cxorbia.live-hr-current-reconcile.v4',generatedAt:new Date().toISOString(),sourceGeneratedAt:s.generatedAt,accessMode:s.source?.accessMode||null,providerMetadataFallbackReason:s.source?.fallbackReason||null,cacheBustApplied:s.source?.cacheBustApplied===true,tabRegistryEnforced:true,tabRegistryMode:s.source?.tabRegistryMode||null,tabRegistryAutoDiscovery:s.source?.tabRegistryAutoDiscovery===true,tabRegistryObservedAt:s.source?.tabRegistryObservedAt||null,phantomTabsRejected:s.source?.phantomTabsRejected||[],counts:s.counts,periods,tabs,august:{GT:(s.visits||[]).filter(v=>v.periodKey==='2026-08'&&(v.country||v.pais)==='GT').length,HN:(s.visits||[]).filter(v=>v.periodKey==='2026-08'&&(v.country||v.pais)==='HN').length},safeState:{hrWrites:0,firestoreWrites:0,authWrites:0,hostingDeploys:0,production:false,merge:false,pii:false}};
          fs.writeFileSync('app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.json',JSON.stringify(report,null,2)+'\n');
          const md=['# CXOrbia — reconciliación HR viva actual','','- Fecha: '+report.generatedAt,'- Access mode: '+report.accessMode,`- Registry mode: ${report.tabRegistryMode||'n/a'}.`,`- Auto-discovery metadata provider: ${report.tabRegistryAutoDiscovery?'sí':'no; fail-closed con último registry provider'}.`,report.providerMetadataFallbackReason?`- Motivo fallback metadata: ${report.providerMetadataFallbackReason}`:'- Metadata provider directa disponible.','- Source-safe: sí; sin PII; writes=0.','',`- Periodos reales detectados: ${report.counts?.periods}`,`- Tabs mensuales reales procesados: ${report.counts?.tabs}`,`- Visitas: ${report.counts?.visits}`,`- Agosto real detectado: GT ${report.august.GT} / HN ${report.august.HN}`,`- Tabs fantasma rechazados: ${(report.phantomTabsRejected||[]).join(', ')||'ninguno'}`,'','## Periodos','',...periods.map(p=>`- ${p.key}: ${p.visits} (GT ${p.byCountry?.GT||0} / HN ${p.byCountry?.HN||0})`),'','## Seguridad','','- No se exporta PII ni workbook crudo.','- No HR/Firestore/Auth/Hosting writes; no producción/merge.',''];
          fs.writeFileSync('app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.md',md.join('\n'));
          NODE

      - name: Build August delta-only provider compare read-only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_CURRENT_SOURCE_SAFE: .tmp/hr-current/tya-hr-source-safe.js
          CXORBIA_COUNTRY_EVIDENCE: app/docs/evidence/LIVE-HR-COUNTRY-TAB-CONSISTENCY-LATEST.json
          CXORBIA_HR_TAB_REGISTRY: backend/config/tya-live-hr-tab-registry.source-safe.json
          CXORBIA_AUGUST_DELTA_PLAN: app/docs/evidence/AUGUST-DELTA-READONLY-PLAN-LATEST.json
        run: node tools/qa/cxorbia-august-delta-readonly-plan.mjs

      - name: Commit sanitized evidence on latest branch head
        run: |
          set -euo pipefail
          cp app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.json /tmp/hr-current.json
          cp app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.md /tmp/hr-current.md
          cp app/docs/evidence/AUGUST-DELTA-READONLY-PLAN-LATEST.json /tmp/august-delta.json
          cp app/docs/evidence/LIVE-HR-TAB-REGISTRY-ENFORCEMENT-LATEST.json /tmp/tab-registry-evidence.json
          cp backend/config/tya-live-hr-tab-registry.source-safe.json /tmp/tab-registry.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence backend/config
          cp /tmp/hr-current.json app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.json
          cp /tmp/hr-current.md app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.md
          cp /tmp/august-delta.json app/docs/evidence/AUGUST-DELTA-READONLY-PLAN-LATEST.json
          cp /tmp/tab-registry-evidence.json app/docs/evidence/LIVE-HR-TAB-REGISTRY-ENFORCEMENT-LATEST.json
          cp /tmp/tab-registry.json backend/config/tya-live-hr-tab-registry.source-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.json app/docs/evidence/LIVE-HR-CURRENT-RECONCILIATION-LATEST.md app/docs/evidence/AUGUST-DELTA-READONLY-PLAN-LATEST.json app/docs/evidence/LIVE-HR-TAB-REGISTRY-ENFORCEMENT-LATEST.json backend/config/tya-live-hr-tab-registry.source-safe.json
          if ! git diff --cached --quiet; then git commit -m 'evidence: reconcile live HR with auto-discovered provider tabs';git push origin HEAD:docs-tya-v6-v71-audit;fi

      - name: Publish status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          STATE=error;DESC='HOLD_LIVE_HR_CURRENT_RECONCILIATION'
          if [ -f app/docs/evidence/AUGUST-DELTA-READONLY-PLAN-LATEST.json ];then
            D=$(node -p "require('./app/docs/evidence/AUGUST-DELTA-READONLY-PLAN-LATEST.json').decision")
            if [ "$D" = 'HOLD_AUGUST_REQUIRED_PROVIDER_TABS_MISSING' ];then STATE=success;DESC='HOLD_AUGUST_PROVIDER_TABS_MISSING_READONLY_CONFIRMED';
            elif [ "$D" = 'PASS_AUGUST_FULL_DELTA_TECH_READY' ];then STATE=success;DESC='PASS_AUGUST_FULL_DELTA_TECH_READY';
            else DESC='HOLD_HR_CURRENT__AUG_DELTA_PLAN';fi
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/live-hr-current-reconcile' -f description="$DESC" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf .tmp/hr-current
