name: CXORBIA_READONLY_POST_GATES_RUNNER

on:
  pull_request:
    branches:
      - release/cxorbia-tya-rc-20260630
    types: [synchronize]
    paths:
      - .github/cxorbia-gate-requests/request.json
      - .github/workflows/cxorbia-readonly-post-gates-runner.yml

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-i3-11c-r3c-hosting-materialization
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST: .github/cxorbia-gate-requests/request.json
  GCP_PROJECT_ID: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  OUT_DIR: .tmp/i3-11c-r3c-hosting-materialization
  DEPLOY_TREE: ${{ runner.temp }}/cxorbia-i3-11c-r3c-authorized-source
  CLAIM_CONTEXT: cxorbia/i3-11c-r3c-hosting/claim

jobs:
  r3c-hosting-only:
    name: R3-C authorized Hosting DEV materialization only
    if: >-
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'docs-tya-v6-v71-audit' &&
      github.event.pull_request.base.ref == 'release/cxorbia-tya-rc-20260630'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read exact R3-C request state
        id: request
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const execute=x.enabled===true&&x.consumed===false&&x.profile==='I3_R3C_DEV_HOSTING_MATERIALIZATION_ONLY';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`execute=${execute?'true':'false'}\n`);
          NODE

      - name: Skip when R3-C request is not active
        if: steps.request.outputs.execute != 'true'
        run: echo 'R3-C request inactive; zero deploys and zero provider writes.'

      - name: Validate exact authorization, trigger and frozen safety
        if: steps.request.outputs.execute == 'true'
        id: gate
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(r.schemaVersion!=='cxorbia.i3.11c.r3c.hosting-materialization.runner-request.v1')throw new Error('request_schema_invalid');
          if(r.gateId!=='I3_11C_DEV_HOSTING_MATERIALIZE_CORRECTED_IDENTITY_RUNTIME_NO_PROVIDER_DATA_WRITES')throw new Error('gate_id_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||Number(r.pullRequest)!==7)throw new Error('lane_invalid');
          if(r.providerProjectId!=='cxorbia-backend-dev'||r.hostingSite!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.devRootUrl!=='https://cxorbia-backend-dev.web.app')throw new Error('target_invalid');
          if(r.enabled!==true||r.consumed!==false||r.status!=='authorized_execute_once'||r.authorizedBy!=='Paula'||r.noAutomaticRetry!==true)throw new Error('authorization_invalid');
          if(changed.length!==1||changed[0]!==process.env.REQUEST)throw new Error('request_only_trigger_invalid:'+changed.join(','));
          if(!/^[a-f0-9]{40}$/.test(String(r.sourceHeadSha||'')))throw new Error('source_head_invalid');
          execFileSync('git',['merge-base','--is-ancestor',r.sourceHeadSha,head]);
          const appDelta=execFileSync('git',['diff','--name-only',r.sourceHeadSha,head,'--','app/'],{encoding:'utf8'}).trim();
          if(appDelta)throw new Error('app_drift_after_authorized_source:'+appDelta.replace(/\s+/g,','));
          if(Number(r.allowedExecutions)!==1||Number(r.maxHostingDeploys)!==1)throw new Error('single_execution_invalid');
          for(const k of ['providerIdentityWrites','firestoreDataWrites','authWrites','rulesDeploys','hrWrites','storageWrites','makeCalls','geminiCalls','paymentWrites','historicalShopperAccess','cloudRunDeploys','staffRuntimeExecutions','passwordChanges','passwordResets','userCreates','userUpdates'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope_'+k);
          if(r.merge!==false||r.production!==false||r.automaticStaffRuntimeRetry!==false)throw new Error('unsafe_scope_boolean');
          const prior=Array.isArray(r.priorTransportCommits)?r.priorTransportCommits:[];
          fs.writeFileSync(process.env.OUT_DIR+'/authorization.json',JSON.stringify({requestId:r.requestId,gateId:r.gateId,sourceHeadSha:r.sourceHeadSha,requestCommitSha:head,priorTransportCommits:prior,authorizedBy:r.authorizedBy,maxHostingDeploys:1,noAutomaticRetry:true,staffRuntimeExecutions:0},null,2)+'\n','utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`source_head=${r.sourceHeadSha}\nprior_commits=${prior.join(',')}\n`);
          NODE

      - name: Claim one logical R3-C execution
        if: steps.request.outputs.execute == 'true'
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra prior <<< '${{ steps.gate.outputs.prior_commits }}'
          for c in "${prior[@]}"; do
            [ -z "$c" ] && continue
            n=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${c}/statuses" --paginate --jq "[.[] | select(.context==\"${CLAIM_CONTEXT}\")] | length")
            if [ "$n" != '0' ]; then echo 'claimed=false' >> "$GITHUB_OUTPUT"; echo "Prior R3-C claim found at $c; duplicate deploy blocked."; exit 0; fi
          done
          current=$(git rev-parse HEAD)
          n=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${current}/statuses" --paginate --jq "[.[] | select(.context==\"${CLAIM_CONTEXT}\")] | length")
          if [ "$n" != '0' ]; then echo 'claimed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${current}" -f state='pending' -f context="$CLAIM_CONTEXT" -f description='CLAIMED_ONE_LOGICAL_R3C_HOSTING_EXECUTION' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Authenticate exact Firebase DEV
        if: steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient Firebase tooling
        if: steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest >/dev/null 2>&1

      - name: Prepare exact authorized source and verify corrected contract
        if: steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          rm -rf "$DEPLOY_TREE"
          git worktree add --detach "$DEPLOY_TREE" '${{ steps.gate.outputs.source_head }}'
          test "$(git -C "$DEPLOY_TREE" rev-parse HEAD)" = '${{ steps.gate.outputs.source_head }}'
          cd "$DEPLOY_TREE"
          node --check app/adapters/cxorbia-provider-identity-link-runtime-v1.js
          node tools/qa/cxorbia-provider-identity-runtime-contract-parity-gate.mjs > "$GITHUB_WORKSPACE/$OUT_DIR/source-parity.json"
          node -e "const p=require(process.env.GITHUB_WORKSPACE+'/'+process.env.OUT_DIR+'/source-parity.json');if(p.decision!=='PASS_PROVIDER_IDENTITY_RUNTIME_CANONICAL_CONTRACT_PARITY'||p.targetMaterializedApplicable!==true||p.exactTechnicalOnly!==true||p.fuzzyMatching!==false||Number(p.providerWrites)!==0)process.exit(1)"
          sha256sum app/adapters/cxorbia-provider-identity-link-runtime-v1.js | awk '{print $1}' > "$GITHUB_WORKSPACE/$OUT_DIR/local-adapter-sha256.txt"

      - name: Deploy exact authorized source to Hosting DEV once
        if: steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_TREE"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$GCP_PROJECT_ID" --non-interactive
          echo 1 > "$GITHUB_WORKSPACE/$OUT_DIR/hosting-deploy-count.txt"

      - name: Verify served adapter exact parity
        if: steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          local_asset="$DEPLOY_TREE/app/adapters/cxorbia-provider-identity-link-runtime-v1.js"
          remote_asset="$OUT_DIR/remote-provider-identity-link-runtime-v1.js"
          ok=0
          for attempt in $(seq 1 40); do
            rm -f "$remote_asset"
            if curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$DEV_ROOT_URL/adapters/cxorbia-provider-identity-link-runtime-v1.js?cxorbia_r3c=${GITHUB_RUN_ID}-${attempt}" -o "$remote_asset" && cmp "$local_asset" "$remote_asset"; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          sha256sum "$remote_asset" | awk '{print $1}' > "$OUT_DIR/remote-adapter-sha256.txt"
          test "$(cat "$OUT_DIR/local-adapter-sha256.txt")" = "$(cat "$OUT_DIR/remote-adapter-sha256.txt")"
          grep -q 'materialized' "$remote_asset"
          grep -q 'tenant_adjudication' "$remote_asset"
          grep -q 'fuzzyMatching:false' "$remote_asset"

      - name: Build sanitized R3-C evidence
        if: always() && steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const read=p=>fs.existsSync(p)?fs.readFileSync(p,'utf8').trim():null;
          const auth=fs.existsSync(process.env.OUT_DIR+'/authorization.json')?JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/authorization.json','utf8')):null;
          const parity=fs.existsSync(process.env.OUT_DIR+'/source-parity.json')?JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/source-parity.json','utf8')):null;
          const deploys=Number(read(process.env.OUT_DIR+'/hosting-deploy-count.txt')||0),localSha=read(process.env.OUT_DIR+'/local-adapter-sha256.txt'),remoteSha=read(process.env.OUT_DIR+'/remote-adapter-sha256.txt');
          const pass=deploys===1&&parity?.decision==='PASS_PROVIDER_IDENTITY_RUNTIME_CANONICAL_CONTRACT_PARITY'&&localSha&&remoteSha&&localSha===remoteSha;
          const out={schemaVersion:'cxorbia.i3.11c.r3c.hosting-materialization.evidence.v1',generatedAt:new Date().toISOString(),decision:pass?'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY':'HOLD_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION',workflowRunId:Number(process.env.GITHUB_RUN_ID),authorization:auth,hostingDeploys:deploys,sourceParity:parity?.decision||null,localAdapterSha256:localSha,remoteAdapterSha256:remoteSha,remoteExactByteParity:!!(localSha&&remoteSha&&localSha===remoteSha),safety:{providerIdentityWrites:0,firestoreDataWrites:0,authWrites:0,rulesDeploys:0,hrWrites:0,storageWrites:0,makeCalls:0,geminiCalls:0,paymentWrites:0,historicalShopperAccess:0,cloudRunDeploys:0,staffRuntimeExecutions:0,passwordChanges:0,passwordResets:0,userCreates:0,userUpdates:0,merge:false,production:false},nextGate:pass?'NEW_AUTH_REQUIRED_I3_11C_STAFF_RUNTIME_CANONICAL_IDENTITY_CLOSE_READONLY_AFTER_HOSTING':'STOP_NO_AUTOMATIC_RETRY'};
          fs.writeFileSync(process.env.OUT_DIR+'/result.json',JSON.stringify(out,null,2)+'\n','utf8');
          NODE

      - name: Upload sanitized R3-C evidence
        if: always() && steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: i3-11c-r3c-hosting-materialization-${{ github.run_id }}
          path: .tmp/i3-11c-r3c-hosting-materialization
          if-no-files-found: error
          retention-days: 14

      - name: Finalize one-shot claim
        if: always() && steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          decision=$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/result.json','utf8'));process.stdout.write(String(x.decision||'HOLD_NO_DECISION'));}catch{process.stdout.write('HOLD_NO_RESULT');}")
          state=success; if [ "$decision" != 'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY' ]; then state=failure; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${current}" -f state="$state" -f context="$CLAIM_CONTEXT" -f description="$(printf '%s' "$decision" | cut -c1-140)" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup ephemeral source/tooling
        if: always()
        run: |
          git worktree remove --force "$DEPLOY_TREE" 2>/dev/null || true
          rm -rf .firebase
          rm -f firebase-debug.log

      - name: Enforce R3-C result
        if: steps.request.outputs.execute == 'true' && steps.claim.outputs.claimed == 'true'
        run: node -e "const r=require('./$OUT_DIR/result.json');if(r.decision!=='PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY')process.exit(1)"
