name: CXOrbia TyA Remaining Shopper Identity Reconciliation Readonly

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/cxorbia-firebase-requests/remaining-shopper-identity-reconciliation-readonly.json'

permissions:
  contents: write
  statuses: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate authorization request
        run: |
          set -euo pipefail
          node <<'NODE'
          const r=require('./.github/cxorbia-firebase-requests/remaining-shopper-identity-reconciliation-readonly.json');
          if(r.enabled!==true) process.exit(1);
          if(r.mode!=='READ_ONLY_REAL_IDENTITY_RECONCILIATION_9_REFS') process.exit(1);
          if(r.legacyProjectId!=='tya-plataforma'||r.canonicalProjectId!=='cxorbia-backend-dev'||r.tenantId!=='tya') process.exit(1);
          if(r.scope!=='9_remaining_shopper_refs+real_identity+certification_linkage') process.exit(1);
          if(r.rawPiiInGitHub!==false||r.nameOnlyAutoMerge!==false) process.exit(1);
          if(r.providerWrites!==0||r.authChanges!==false||r.deploy!==false||r.merge!==false||r.production!==false) process.exit(1);
          NODE

      - name: Load canonical DEV credential for Firestore and HR Sheets read-only
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/remaining-identity-private
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null; try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id&&p.client_email&&p.private_key)) process.exit(1);
          if(p.project_id!=='cxorbia-backend-dev') process.exit(1);
          fs.writeFileSync('.tmp/remaining-identity-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/remaining-identity-private/credentials.json" >> "$GITHUB_ENV"

      - name: Install transient Firebase Admin
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Validate reconciliation script
        run: node --check tools/reconciliation/tya-remaining-shopper-identity-reconciliation-readonly.mjs

      - name: Run authorized real-identity reconciliation in memory only
        run: |
          set +e
          node tools/reconciliation/tya-remaining-shopper-identity-reconciliation-readonly.mjs > /tmp/remaining-identity-run.out 2> /tmp/remaining-identity-run.err
          rc=$?
          if [ "$rc" -ne 0 ]; then
            err=$(grep -E 'Error:|_failed_|_missing|expected_|wrong_|collision' /tmp/remaining-identity-run.err | head -n 1 | tr '\n' ' ' | cut -c1-120)
            printf '%s' "${err:-reconciliation_script_failed}" > /tmp/remaining-identity-failure.txt
            exit "$rc"
          fi
          cat /tmp/remaining-identity-run.out

      - name: Validate sanitized evidence and zero-write contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const r=require('./app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.json');
          const s=r.safety||{};
          if(r.authorizationScope!=='READ_ONLY_REAL_IDENTITY_RECONCILIATION_9_REFS') process.exit(1);
          if(r.sources?.legacy?.projectId!=='tya-plataforma'||r.sources?.canonical?.projectId!=='cxorbia-backend-dev') process.exit(1);
          if(r.sources?.hr?.realIdentityUsedInMemoryOnly!==true||r.sources?.hr?.rawIdentityPersisted!==false) process.exit(1);
          if(r.policy?.realIdentityRequiredInOperationalPlatform!==true||r.policy?.rawPiiInGitHub!==false||r.policy?.nameOnlyAutoMerge!==false) process.exit(1);
          if(r.counts?.total!==9) process.exit(1);
          if(s.legacyWrites!==0||s.firestoreWrites!==0||s.authWrites!==0||s.storageWrites!==0||s.hrWrites!==0||s.deploys!==0||s.merge!==false||s.production!==false) process.exit(1);
          if(s.rawNamesExported!==false||s.rawEmailsExported!==false||s.rawPhonesExported!==false||s.identityDocumentsExported!==false||s.bankDataExported!==false) process.exit(1);
          NODE

      - name: Commit sanitized evidence on latest active branch
        run: |
          set -euo pipefail
          cp app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.json /tmp/remaining-identity.json
          cp app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.md /tmp/remaining-identity.md
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/remaining-identity.json app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.json
          cp /tmp/remaining-identity.md app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.md
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.*
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: reconcile remaining shopper identities readonly'
            git push origin HEAD:docs-tya-v6-v71-audit
          fi

      - name: Persist sanitized failure diagnostic
        if: failure()
        run: |
          set -euo pipefail
          DETAIL='unknown_failure_before_reconciliation_output'
          if [ -f /tmp/remaining-identity-failure.txt ]; then DETAIL=$(cat /tmp/remaining-identity-failure.txt | tr '\n' ' ' | cut -c1-180); fi
          node -e "const fs=require('fs');const detail=process.env.DETAIL||'unknown';fs.writeFileSync('/tmp/remaining-identity-diagnostic.json',JSON.stringify({schemaVersion:'cxorbia.remaining-shopper-identity.diagnostic.v1',generatedAt:new Date().toISOString(),detail,sanitized:true,rawPiiPersisted:false,providerWrites:0},null,2)+'\\n')" \
            DETAIL="$DETAIL"
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/remaining-identity-diagnostic.json app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-DIAGNOSTIC-LATEST.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-DIAGNOSTIC-LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist sanitized remaining identity diagnostic'
            git push origin HEAD:docs-tya-v6-v71-audit
          fi

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=error; DESC='HOLD_REMAINING_SHOPPER_IDENTITY_RECONCILIATION'
          if [ -f app/docs/evidence/REMAINING-SHOPPER-IDENTITY-RECONCILIATION-READONLY-LATEST.json ]; then
            STATE=success; DESC='PASS_REMAINING_SHOPPER_IDENTITY_READONLY'
          elif [ -f /tmp/remaining-identity-failure.txt ]; then
            DETAIL=$(cat /tmp/remaining-identity-failure.txt | tr '\n' ' ' | cut -c1-110)
            DESC="HOLD:${DETAIL}"
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/remaining-shopper-identity-readonly' -f description="$DESC" >/dev/null

      - name: Cleanup private credential and transient PII surfaces
        if: always()
        run: rm -rf .tmp/remaining-identity-private /tmp/remaining-identity-run.err /tmp/remaining-identity-run.out /tmp/remaining-identity-failure.txt /tmp/remaining-identity-diagnostic.json
