name: CXOrbia Phase A Live HR Runtime Predeploy

on:
  workflow_dispatch:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/runtime/hr-live-service/**'
      - 'app/adapters/tya-live-source-refresh-watch-v2.js'
      - 'app/adapters/tya-live-source-inplace-apply.js'
      - 'app/index-backend-dev.html'
      - 'tools/hr-source/tya-live-provider-registry-identity-dev.mjs'
      - 'tools/hr-source/tya-enforce-live-tab-registry.mjs'
      - 'tools/release/tya-source-safe-live-binding-build-r22.mjs'
      - 'tools/qa/tya-live-hr-read-probe-gate.mjs'
      - 'tools/qa/tya-f8-checkpoint-backed-shopper-runtime-readonly.mjs'
      - 'tools/qa/tya-f8-provider-security-quota-readonly.mjs'
      - 'tools/qa/tya-f8-bounded-load-failure-readonly.mjs'
      - 'tools/qa/tya-f8-hosting-adapter-drift-rootcause-readonly.mjs'
      - 'backend/contracts/phase-a-live-hr-runtime-read-v1.json'
      - 'backend/config/cxorbia-f8-provider-transport-execute.json'
      - '.github/workflows/cxorbia-phase-a-live-hr-runtime-predeploy.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-phase-a-live-hr-runtime-predeploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  predeploy:
    name: Validate live endpoint, automatic month discovery and DEV display identity without deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install declared runtime dependency for local predeploy service
        run: |
          set -euo pipefail
          npm install --prefix backend/runtime/hr-live-service --omit=dev --ignore-scripts --package-lock=false

      - name: Validate syntax
        run: |
          set -euo pipefail
          node --check backend/runtime/hr-live-service/server.mjs
          node --check app/adapters/tya-live-source-refresh-watch-v2.js
          node --check app/adapters/tya-live-source-inplace-apply.js
          node --check tools/hr-source/tya-live-provider-registry-identity-dev.mjs
          node --check tools/hr-source/tya-enforce-live-tab-registry.mjs
          node --check tools/release/tya-source-safe-live-binding-build-r22.mjs
          node --check tools/qa/tya-live-hr-read-probe-gate.mjs
          node --check tools/qa/tya-f8-checkpoint-backed-shopper-runtime-readonly.mjs
          node --check tools/qa/tya-f8-provider-security-quota-readonly.mjs
          node --check tools/qa/tya-f8-bounded-load-failure-readonly.mjs
          node --check tools/qa/tya-f8-hosting-adapter-drift-rootcause-readonly.mjs
          node --check tools/release/tya-f8-backup-restore-cutover-one-shot.mjs
          node --check tools/release/tya-f8-backup-restore-cutover-cli.mjs

      - name: Prepare bootstrap with provider metadata auto-discovery
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          CXORBIA_HR_SOURCE_SAFE_OUT: app/data/tya-hr-source-safe-periods.js
          CXORBIA_HR_LIVE_MAX_ROW: '140'
          CXORBIA_HR_LIVE_MAX_COL: AI
          CXORBIA_HR_EARLIEST_PERIOD: '2025-06'
          CXORBIA_GATE_OUT: .tmp/live-runtime-predeploy/source
          CXORBIA_HR_TAB_REGISTRY: .tmp/live-runtime-predeploy/tab-registry.source-safe.json
          CXORBIA_HR_TAB_REGISTRY_EVIDENCE: .tmp/live-runtime-predeploy/tab-registry-evidence.source-safe.json
          CXORBIA_HR_OPERATIONAL_IDENTITY_OUT: .tmp/live-runtime-predeploy/operational-display-identity.dev.json
        run: |
          set -euo pipefail
          mkdir -p .tmp/live-runtime-predeploy
          cp backend/config/tya-live-hr-tab-registry.source-safe.json .tmp/live-runtime-predeploy/tab-registry.source-safe.json
          node tools/hr-source/tya-live-provider-registry-identity-dev.mjs
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs
          node tools/hr-source/tya-enforce-live-tab-registry.mjs
          node tools/hr-source/tya-canonicalize-live-hr-source-safe-r18a.mjs \
            --input app/data/tya-hr-source-safe-periods.js \
            --out app/data/tya-hr-source-safe-periods.js \
            --report-dir .tmp/live-runtime-predeploy/canonical
          node tools/hr-source/tya-reapply-canonical-state-r20.mjs \
            --input app/data/tya-hr-source-safe-periods.js \
            --out app/data/tya-hr-source-safe-periods.js \
            --report-dir .tmp/live-runtime-predeploy/state
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.tmp/live-runtime-predeploy/tab-registry.source-safe.json','utf8'));
          const i=JSON.parse(fs.readFileSync('.tmp/live-runtime-predeploy/operational-display-identity.dev.json','utf8'));
          if(r.autoDiscovery!==true||r.registryMode!=='live_provider_metadata_auto_refresh'||!Array.isArray(r.monthlyTabs)||r.monthlyTabs.length<28)throw new Error('provider_registry_auto_discovery_failed');
          if(i.displayIdentityOnly!==true||!Array.isArray(i.identities)||!i.identities.length||i.containsContactData!==false||i.containsGovernmentId!==false||i.containsBankData!==false||i.containsCredentials!==false)throw new Error('display_identity_scope_invalid');
          console.log(JSON.stringify({decision:'PASS_PROVIDER_REGISTRY_AND_DISPLAY_IDENTITY_PRECHECK',monthlyTabs:r.monthlyTabs.length,identityCount:i.identities.length,requiredAugustTabsPresent:r.requiredAugustTabsPresent,writes:0,production:false}));
          NODE

      - name: Start source-safe live service locally
        env:
          PORT: '4182'
          CXORBIA_LIVE_HR_CACHE_MS: '1000'
          CXORBIA_DEV_OPERATIONAL_NAMES: 'true'
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          CXORBIA_HR_LIVE_MAX_ROW: '140'
          CXORBIA_HR_LIVE_MAX_COL: AI
          CXORBIA_HR_EARLIEST_PERIOD: '2025-06'
        run: |
          set -euo pipefail
          node backend/runtime/hr-live-service/server.mjs > .tmp/live-runtime-predeploy/service.log 2>&1 &
          echo $! > .tmp/live-runtime-predeploy/service.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4182/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat .tmp/live-runtime-predeploy/service.log
          exit 1

      - name: Validate live endpoint freshness, auto-month and display-name-only view
        run: |
          set -euo pipefail
          base='http://127.0.0.1:4182/v1/tenants/tya/projects/cinepolis/hr-live'
          op='view=operational-names&cxOperationalPreview=YES_PAULA_20260731_NAMES_DEV'
          curl -fsS -H 'Cache-Control: no-cache' "$base?format=meta&fresh=1&$op&ts=$(date +%s)" > .tmp/live-runtime-predeploy/meta.json
          curl -fsS -H 'Cache-Control: no-cache' "$base?format=js&$op&ts=$(date +%s)" > .tmp/live-runtime-predeploy/live-source.js
          curl -fsS -H 'Cache-Control: no-cache' "$base?$op&ts=$(date +%s)" > .tmp/live-runtime-predeploy/snapshot.json
          curl -fsS -H 'Cache-Control: no-cache' "$base?ts=$(date +%s)" > .tmp/live-runtime-predeploy/source-safe-default.json
          node - <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('.tmp/live-runtime-predeploy/meta.json','utf8'));
          const snap=JSON.parse(fs.readFileSync('.tmp/live-runtime-predeploy/snapshot.json','utf8'));
          const safe=JSON.parse(fs.readFileSync('.tmp/live-runtime-predeploy/source-safe-default.json','utf8'));
          const js=fs.readFileSync('.tmp/live-runtime-predeploy/live-source.js','utf8');
          if(meta.ok!==true||meta.sourceSafe!==true||meta.runtimeRead!==true||!meta.revision)throw new Error('meta contract failed');
          if(meta.tabRegistryAutoDiscovery!==true||meta.tabRegistryMode!=='live_provider_metadata_auto_refresh')throw new Error('auto month discovery not active');
          if(meta.operationalDisplayIdentityReady!==true||meta.operationalView!==true||meta.operationalDisplayIdentityCount<1)throw new Error('operational display identity not ready');
          if(snap.sourceSafe!==true||snap.operationalIdentityPreview!==true||snap.operationalIdentityScope!=='display_name_only'||!Array.isArray(snap.visits)||!snap.visits.length||!Array.isArray(snap.periods)||!snap.periods.length)throw new Error('operational snapshot contract failed');
          if(!(snap.shoppers||[]).some(s=>s.operationalDisplayName===true&&s.nombre&&s.nombre!=='Shopper protegido'))throw new Error('real display names not projected');
          if((snap.shoppers||[]).some(s=>s.email||s.phone||s.whatsapp||s.dpi||s.banco||s.ctaNum||s.pass))throw new Error('sensitive shopper data leaked');
          if(safe.operationalIdentityPreview===true||(safe.shoppers||[]).some(s=>s.nombre&&s.nombre!=='Shopper protegido'))throw new Error('default source-safe endpoint leaked display identity');
          if(!js.includes('window.CX_TYA_HR_SOURCE_SAFE=')||!js.includes('window.CX_TYA_HR_LIVE_META='))throw new Error('javascript format failed');
          const age=(Date.now()-Date.parse(meta.generatedAt))/1000;
          if(!Number.isFinite(age)||age>600)throw new Error('endpoint source is stale: '+age);
          fs.writeFileSync('.tmp/live-runtime-predeploy/endpoint-pass.json',JSON.stringify({ok:true,decision:'PASS_LIVE_HR_ENDPOINT_AUTO_MONTH_AND_DISPLAY_IDENTITY_DEV',revision:meta.revision,generatedAt:meta.generatedAt,periods:meta.periods,visits:meta.visits,sourceAccessMode:meta.sourceAccessMode,tabRegistryMode:meta.tabRegistryMode,tabRegistryAutoDiscovery:meta.tabRegistryAutoDiscovery,operationalDisplayIdentityCount:meta.operationalDisplayIdentityCount,writes:false,deploy:false,production:false},null,2));
          NODE

      - name: Validate human DEV entrypoint binding
        run: |
          set -euo pipefail
          grep -q 'adapters/tya-live-source-inplace-apply.js' app/index-backend-dev.html
          grep -q 'adapters/tya-live-source-refresh-watch-v2.js' app/index-backend-dev.html
          grep -q 'view=operational-names' app/index-backend-dev.html
          grep -q 'YES_PAULA_20260731_NAMES_DEV' app/index-backend-dev.html

      - name: Validate F8 checkpoint-backed Shopper proof source
        run: |
          set -euo pipefail
          node tools/qa/tya-f8-checkpoint-backed-shopper-runtime-readonly.mjs

      - name: Install F8 read-only browser and provider proof tooling
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate F8 exact historical Shopper against current provider and runtime
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_TENANT_ID: tya
          CXORBIA_PROJECT_ID: cinepolis
          CXORBIA_DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
          CXORBIA_F8_CHECKPOINT_SHOPPER_AUTHORIZED: YES_PAULA_F8_CHECKPOINT_BACKED_SHOPPER_READONLY
          CXORBIA_F8_SHOPPER_OUT: .tmp/f8-checkpoint-shopper-runtime/report.json
        run: |
          set -euo pipefail
          node tools/qa/tya-f8-checkpoint-backed-shopper-runtime-readonly.mjs --execute

      - name: Validate F8 provider IAM secrets and quota readback
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          CXORBIA_GCP_PROJECT_CREATOR_JSON: ${{ secrets.CXORBIA_GCP_PROJECT_CREATOR_JSON }}
          GOOGLE_CLOUD_PROJECT_CREATOR_JSON: ${{ secrets.GOOGLE_CLOUD_PROJECT_CREATOR_JSON }}
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_CLOUD_RUN_REGION: us-central1
          CXORBIA_CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
          CXORBIA_F8_PROVIDER_READONLY_AUTHORIZED: YES_PAULA_F8_PROVIDER_SECURITY_QUOTA_READONLY
          CXORBIA_F8_PROVIDER_SECURITY_OUT: .tmp/f8-provider-security-quota/report.json
        run: |
          set -euo pipefail
          node tools/qa/tya-f8-provider-security-quota-readonly.mjs

      - name: Validate F8 bounded load and fail-closed behavior read-only
        env:
          CXORBIA_F8_ROOT_URL: https://cxorbia-backend-dev.web.app
          CXORBIA_F8_BOUNDED_LOAD_READONLY_AUTHORIZED: CANONICAL_LOCK_F8_READONLY_PRECHECKS_TRUE
          CXORBIA_F8_BOUNDED_LOAD_REQUESTS: '24'
          CXORBIA_F8_BOUNDED_LOAD_CONCURRENCY: '4'
          CXORBIA_F8_BOUNDED_LOAD_TIMEOUT_MS: '12000'
          CXORBIA_F8_BOUNDED_LOAD_OUT: .tmp/f8-bounded-load-failure/report.json
        run: |
          set -euo pipefail
          node tools/qa/tya-f8-bounded-load-failure-readonly.mjs

      - name: Classify F8 Hosting adapter drift read-only
        env:
          CXORBIA_F8_HOSTING_DRIFT_OUT: .tmp/f8-hosting-adapter-drift-rootcause/report.json
        run: |
          set -euo pipefail
          node tools/qa/tya-f8-hosting-adapter-drift-rootcause-readonly.mjs

      - name: Stop local service
        if: always()
        run: |
          if [ -f .tmp/live-runtime-predeploy/service.pid ]; then kill "$(cat .tmp/live-runtime-predeploy/service.pid)" 2>/dev/null || true; fi

      - name: Upload predeploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-live-hr-runtime-predeploy
          path: |
            .tmp/live-runtime-predeploy/endpoint-pass.json
            .tmp/live-runtime-predeploy/tab-registry.source-safe.json
            .tmp/live-runtime-predeploy/tab-registry-evidence.source-safe.json
            .tmp/live-runtime-predeploy/service.log
            .tmp/f8-checkpoint-shopper-runtime/report.json
            .tmp/f8-provider-security-quota/report.json
            .tmp/f8-bounded-load-failure/report.json
            .tmp/f8-hosting-adapter-drift-rootcause/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish predeploy status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATE: ${{ job.status }}
        with:
          script: |
            const state=process.env.JOB_STATE==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'cxorbia/live-hr-runtime-predeploy',description:state==='success'?'Live HR + F8 read-only prechecks/load PASS':'Live HR/F8 read-only predeploy failed'});

  f8-provider-transport:
    name: F8 authorized backup restore cutover one-shot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact F8 execution marker
        id: gate
        run: |
          set -euo pipefail
          marker='backend/config/cxorbia-f8-provider-transport-execute.json'
          echo 'active=false' >> "$GITHUB_OUTPUT"
          test "${GITHUB_RUN_ATTEMPT}" = '1' || { echo 'F8_TRANSPORT_RERUN_FORBIDDEN' >&2; exit 41; }
          test -f "$marker" || exit 0
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fxq "$marker" || exit 0
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = '1' || { echo 'F8_TRANSPORT_TRIGGER_DELTA_NOT_EXACT' >&2; exit 42; }
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p='backend/config/cxorbia-f8-provider-transport-execute.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          if(x.authorizationId!=='PAULA-F8-BACKUP-RESTORE-CUTOVER-20260827-01')throw new Error('F8_TRANSPORT_AUTH_ID_MISMATCH');
          if(x.repository!=='paulaosoriof86/demoCXOrbia'||x.branch!=='docs-tya-v6-v71-audit')throw new Error('F8_TRANSPORT_LANE_MISMATCH');
          if(x.enabled!==true||x.singleUse!==true||x.consumed!==false||x.automaticRetryAllowed!==false)throw new Error('F8_TRANSPORT_SINGLE_USE_CONTRACT_INVALID');
          if(x.expectedParentHead!==parent)throw new Error('F8_TRANSPORT_PARENT_HEAD_MISMATCH');
          if(x.executor!=='tools/release/tya-f8-backup-restore-cutover-cli.mjs')throw new Error('F8_TRANSPORT_EXECUTOR_MISMATCH');
          NODE
          node --check tools/release/tya-f8-backup-restore-cutover-one-shot.mjs
          node --check tools/release/tya-f8-backup-restore-cutover-cli.mjs
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Authenticate existing Google Cloud identity for F8
        if: steps.gate.outputs.active == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
          token_format: access_token
          create_credentials_file: false

      - name: Execute authorized F8 one-shot
        if: steps.gate.outputs.active == 'true'
        env:
          CXORBIA_GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node tools/release/tya-f8-backup-restore-cutover-cli.mjs

      - name: Upload sanitized F8 execution evidence
        if: always() && steps.gate.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-f8-backup-restore-cutover-${{ github.run_id }}
          path: app/docs/evidence/RC15-F8-BACKUP-RESTORE-CUTOVER-EXECUTION-LATEST.json
          if-no-files-found: warn
          retention-days: 14
