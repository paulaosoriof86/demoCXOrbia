name: CXOrbia I3 VRM289 Reports Hosting-only DEV
on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-i3-vrm289-reports-hosting-dev.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: cxorbia-i3-vrm289-reports-hosting-dev
  cancel-in-progress: false
env:
  CANDIDATE_DESCRIPTOR: CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  HOSTING_SITE: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
jobs:
  deploy-vrm289-hosting-dev:
   if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vrm289-hosting-only]') }}
   runs-on: ubuntu-latest
   timeout-minutes: 35
   permissions:
    contents: read
    id-token: write
   env:
    SRC: 92e42a61eace003a1e518ac71bf4309517aa89d9
    TREE: d1f21d2c8ea22f15000924d145d4582eddd8a97b
    EXPECTED_RUNTIME_REV: cxorbia-live-hr-dev-00327-xsc
    FOCAL_DIR: .tmp/i3-vrm289-reports-hosting
    PROD_URL: https://tya-plataforma.web.app
   steps:
   - uses: actions/checkout@v4
     with:
      fetch-depth: 0
   - uses: actions/setup-node@v4
     with:
      node-version: '24'
   - name: Verify frozen source, ownership, and safe report projection
     run: |
      set -Eeuo pipefail
      mkdir -p "$FOCAL_DIR"
      node tools/qa/cxorbia-i3-canonical-candidate-authority-guard.mjs | tee "$FOCAL_DIR/authority.json"
      jq -e --arg source "$SRC" --arg tree "$TREE" '.decision=="PASS_I3_SINGLE_CANONICAL_CANDIDATE_AUTHORITY" and .productSourceSha==$source and .productSourceTree==$tree and .terminalReleaseEligible==false' "$FOCAL_DIR/authority.json"
      test "$(jq -r '.status' "$CANDIDATE_DESCRIPTOR")" = HOLD_I3_VRM289_REPORTS_SOURCE_PROOF_PENDING_DEV
      test "$SRC" = 92e42a61eace003a1e518ac71bf4309517aa89d9
      test "$TREE" = d1f21d2c8ea22f15000924d145d4582eddd8a97b
      test "$(git rev-parse "$SRC^{tree}")" = "$TREE"
      test "$(git rev-parse "$SRC:app/index-backend-dev.html")" = 075b494e084e47759eeeabd7cb82d7600a3c3b8d
      git merge-base --is-ancestor "$SRC" HEAD
      test -z "$(git diff --name-only "$SRC" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source)"
      test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$SRC"
      test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
      test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
      test "$(jq -r '.nextFindingId' "$CANDIDATE_DESCRIPTOR")" = VRM-290
      node tools/qa/cxorbia-i3-vrm289-client-report-projection-wiring.test.mjs
      SOURCE_DIR="$(mktemp -d)"
      git archive "$SRC" | tar -x -C "$SOURCE_DIR"
      echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
      cmp -s "$SOURCE_DIR/app/index-backend-dev.html" app/index-backend-dev.html
   - uses: google-github-actions/auth@v2
     with:
      credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
   - uses: google-github-actions/setup-gcloud@v2
     with:
      project_id: ${{ env.PROJECT }}
   - name: Read-only DEV, Hosting and untouched-production baselines
     run: |
      set -Eeuo pipefail
      gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$FOCAL_DIR/runtime-before.json"
      jq -e --arg rev "$EXPECTED_RUNTIME_REV" '.status.latestReadyRevisionName==$rev and ([.status.traffic[]|select(.revisionName==$rev and .percent==100)]|length)==1' "$FOCAL_DIR/runtime-before.json"
      TOKEN="$(gcloud auth print-access-token)"
      curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$FOCAL_DIR/hosting-before.json"
      jq -e '.release.version.name | length > 0' "$FOCAL_DIR/hosting-before.json"
      curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/" -o "$FOCAL_DIR/production-before.html"
      sha256sum "$FOCAL_DIR/production-before.html" | awk '{print $1}' > "$FOCAL_DIR/production-before.sha256"
   - name: Publish precisely one Hosting-only change to Firebase DEV
     run: |
      set -Eeuo pipefail
      npm install --no-save --ignore-scripts --package-lock=false firebase-tools@14.12.0 >/dev/null 2>&1
      cd "$SOURCE_DIR"
      "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$PROJECT" --non-interactive | tee "$GITHUB_WORKSPACE/$FOCAL_DIR/hosting-deploy.log"
   - name: Read back exact serving bytes and isolation
     run: |
      set -Eeuo pipefail
      gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$FOCAL_DIR/runtime-after.json"
      jq -e --arg rev "$EXPECTED_RUNTIME_REV" '.status.latestReadyRevisionName==$rev and ([.status.traffic[]|select(.revisionName==$rev and .percent==100)]|length)==1' "$FOCAL_DIR/runtime-after.json"
      TOKEN="$(gcloud auth print-access-token)"
      curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$FOCAL_DIR/hosting-after.json"
      BEFORE="$(jq -r '.release.version.name' "$FOCAL_DIR/hosting-before.json")"
      AFTER="$(jq -r '.release.version.name' "$FOCAL_DIR/hosting-after.json")"
      test -n "$AFTER"
      test "$AFTER" != "$BEFORE"
      for FILE in index-backend-dev.html adapters/tya-corte1-report-projection-live.js adapters/tya-live-source-inplace-apply.js modules/cliente-extra.js; do
       OUT="$FOCAL_DIR/served-${FILE//\//-}"
       curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$HOSTING_URL/$FILE?vrm289=$GITHUB_RUN_ID" -o "$OUT"
       cmp -s "$SOURCE_DIR/app/$FILE" "$OUT"
      done
      curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/" -o "$FOCAL_DIR/production-after.html"
      sha256sum "$FOCAL_DIR/production-after.html" | awk '{print $1}' > "$FOCAL_DIR/production-after.sha256"
      cmp -s "$FOCAL_DIR/production-before.sha256" "$FOCAL_DIR/production-after.sha256"
      jq -n -S --arg source "$SRC" --arg tree "$TREE" --arg old "$BEFORE" --arg version "$AFTER" --arg revision "$EXPECTED_RUNTIME_REV" --arg prodSha "$(cat "$FOCAL_DIR/production-after.sha256")" '{decision:"PASS_I3_VRM289_REPORTS_HOSTING_ONLY_DEV_EXACT_BYTES",sourceSha:$source,sourceTree:$tree,previousHostingVersion:$old,hostingVersion:$version,runtimeRevision:$revision,runtimeDeploys:0,hostingDeploys:1,firestoreWrites:0,authWrites:0,productionIndexSha256:$prodSha,productionChanged:false,humanAcceptance:"PENDING",terminalEligible:false}' > "$FOCAL_DIR/result.json"
   - name: Archive focal DEV deployment evidence
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: cxorbia-i3-vrm289-reports-dev-${{ github.run_id }}
      path: .tmp/i3-vrm289-reports-hosting/
      if-no-files-found: warn
      retention-days: 30


