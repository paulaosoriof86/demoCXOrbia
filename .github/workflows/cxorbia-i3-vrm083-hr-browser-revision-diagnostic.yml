name: CXOrbia I3 VRM-083 HR Browser Revision Diagnostic

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - tools/qa/cxorbia-i3-vrm083-hr-browser-revision-diagnostic.mjs
      - .github/workflows/cxorbia-i3-vrm083-hr-browser-revision-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vrm-083-hr-browser-revision-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: cxorbia-backend-dev
      TENANT_ID: tya
      PROJECT_ID: cinepolis
      HOSTING_URL: https://cxorbia-backend-dev.web.app
      VRM083_OUT: .tmp/i3-vrm083
      VRM083_TARGET_UID: cxorbia-dev-shopper-eval01
      PRODUCT_SOURCE_SHA: b168955f405cd82630a8caad04de0b1766b26fc8
      PRODUCT_SOURCE_TREE: 7ee35f25dd6a1c1b6f6a562ed770e9ba80cceeeb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove control-only scope
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "$PRODUCT_SOURCE_SHA^{tree}")" = "$PRODUCT_SOURCE_TREE"
          git diff --quiet "$PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check tools/qa/cxorbia-i3-vrm083-hr-browser-revision-diagnostic.mjs
          mkdir -p "$VRM083_OUT"
      - name: Install read-only browser dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Authenticate canonical Firebase DEV read-only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Prepare exact product source
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/vrm083-source"
          rm -rf "$SOURCE_DIR"; mkdir -p "$SOURCE_DIR"
          git archive "$PRODUCT_SOURCE_SHA" | tar -x -C "$SOURCE_DIR"
          echo "VRM083_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
      - name: Run focal revision coherence diagnostic
        run: |
          set +e
          node tools/qa/cxorbia-i3-vrm083-hr-browser-revision-diagnostic.mjs | tee "$VRM083_OUT/console.log"
          RC=${PIPESTATUS[0]}
          echo "diagnostic_exit_code=$RC" > "$VRM083_OUT/exit.txt"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-vrm083-hr-browser-revision-${{ github.run_id }}
          path: ${{ env.VRM083_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true
