name: CXOrbia I3 D05 QA-Only Positive Lifecycle DEV
on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
permissions:
  contents: read
jobs:
  d05-qa-publish-configure-retire:
    if: ${{ contains(github.event.head_commit.message, '[i3-d05-qa-fixture-positive]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXORBIA_PRODUCT_SOURCE_SHA: 4ba2a96e1f90fba7ba8e981429bce8b4161ebee6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen product and scoped test preflight
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "$CXORBIA_PRODUCT_SOURCE_SHA"
          git diff --quiet "$CXORBIA_PRODUCT_SOURCE_SHA" HEAD -- app backend firestore.rules storage.rules firebase.json .firebaserc
          node --check tools/qa/cxorbia-i3-d05-qa-positive-lifecycle.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Firebase Admin test dependency
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0
      - name: Real DEV backend lifecycle on disposable admin-only QA bank
        env:
          CXORBIA_D05_SA_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
        run: node tools/qa/cxorbia-i3-d05-qa-positive-lifecycle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-d05-qa-positive-lifecycle-${{ github.run_id }}
          path: .tmp/cxorbia-i3-d05-qa-lifecycle/result.json
          if-no-files-found: warn
          retention-days: 30

  d05-qa-ui-review-shopper-read:
    if: ${{ contains(github.event.head_commit.message, '[i3-d05-qa-ui-review-shopper]') || contains(github.event.head_commit.message, '[i3-d06-shopper-read-only]') || contains(github.event.head_commit.message, '[i3-d06-vrm296-reproof]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CXORBIA_PRODUCT_SOURCE_SHA: 4ba2a96e1f90fba7ba8e981429bce8b4161ebee6
      CXORBIA_D06_READ_ONLY: ${{ (contains(github.event.head_commit.message, '[i3-d06-shopper-read-only]') || contains(github.event.head_commit.message, '[i3-d06-vrm296-reproof]')) && '1' || '0' }}
      CXORBIA_D06_VRM296_ONLY: ${{ contains(github.event.head_commit.message, '[i3-d06-vrm296-reproof]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin immutable product and test owner
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "$CXORBIA_PRODUCT_SOURCE_SHA"
          git diff --quiet "$CXORBIA_PRODUCT_SOURCE_SHA" HEAD -- app backend firestore.rules storage.rules firebase.json .firebaserc
          node --check tools/qa/cxorbia-i3-d05-qa-ui-review-shopper-read.mjs
          if [ "$CXORBIA_D06_VRM296_ONLY" = 1 ]; then
            REQUEST=docs/checkpoints/CXORBIA_I3_D06_VRM296_THREE_SHOPPER_READ_ONLY_REPROOF_20261102.json
            jq -e '.schemaVersion=="cxorbia.i3.d06.vrm296-three-shopper-readonly-reproof.20261102.v1"
              and .authorization=="PAULA_EXPLICIT_CERTIFY_MODULES_2026_11_02"
              and .sourceSha=="4ba2a96e1f90fba7ba8e981429bce8b4161ebee6"
              and .limits.realBankWrites==0 and .limits.shopperAttemptWrites==0
              and .limits.qaBankWrites==0 and .limits.devDeploys==0
              and .limits.productionWrites==0 and .limits.production=="DO_NOT_TOUCH"
              and .expectedVrm297=="OPEN"' "$REQUEST" >/dev/null
            test "$(git rev-parse HEAD^)" = "$(jq -r .controlParentSha "$REQUEST")"
            test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(jq -r '.allowedFiles|sort|.[]' "$REQUEST")"
            test "$(git rev-parse "$CXORBIA_PRODUCT_SOURCE_SHA^{tree}")" = "$(jq -r .sourceTree "$REQUEST")"
            test "$(git rev-parse HEAD:tools/qa/cxorbia-i3-d05-qa-ui-review-shopper-read.mjs)" = "$(jq -r .qaScriptBlob "$REQUEST")"
          fi
          echo "CXORBIA_D05_CERT_SOURCE_BLOB=$(git rev-parse "$CXORBIA_PRODUCT_SOURCE_SHA:app/modules/cert.js")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install scoped Admin SDK and browser dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1
          npx --no-install playwright install chromium
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: QA-only versioned Admin UI save and existing Shopper read-only proof
        run: node tools/qa/cxorbia-i3-d05-qa-ui-review-shopper-read.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-d05-qa-ui-review-shopper-${{ github.run_id }}
          path: .tmp/cxorbia-i3-d05-qa-ui-review-shopper/
          if-no-files-found: warn
          retention-days: 30

  d06-shopper-firestore-read-authority-source:
    if: ${{ contains(github.event.head_commit.message, '[i3-d06-rules-source]') || contains(github.event.head_commit.message, '[i3-d06-vrm297-source]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXORBIA_D06_VRM297: ${{ contains(github.event.head_commit.message, '[i3-d06-vrm297-source]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact immutable D06 source and no deployment preflight
        run: |
          set -Eeuo pipefail
          SOURCE="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          if [ "$CXORBIA_D06_VRM297" = 1 ]; then
            test "$SOURCE" = "$(jq -r '.productSource.sha' RECOVERY-I3-MODULE-TRUTH-MATRIX-20261102-V222.json)"
            test "$(jq -r '.productSource.predecessorProductSourceSha' RECOVERY-I3-MODULE-TRUTH-MATRIX-20261102-V222.json)" = 4ba2a96e1f90fba7ba8e981429bce8b4161ebee6
            test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
            test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          else
            test "$SOURCE" = 4ba2a96e1f90fba7ba8e981429bce8b4161ebee6
          fi
          git diff --quiet "$SOURCE" HEAD -- app backend firestore.rules firestore.indexes.json storage.rules firebase.json
          node --check app/core/backend-resources.js
          node --check app/core/backend-certifications.js
          node --check app/modules/cert.js
          node --check backend/runtime/hr-live-service/certification-runtime.mjs
          node --check tools/qa/cxorbia-i3-work-uat-cert-resource-period.test.mjs
          node --check tools/qa/cxorbia-i3-d05-certification-authority-rules.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: D06 source role-and-period routing regressions
        run: |
          node tools/qa/cxorbia-i3-work-uat-cert-resource-period.test.mjs
          if [ "$CXORBIA_D06_VRM297" = 1 ]; then
            node backend/runtime/hr-live-service/test/certification-shopper-projection.test.mjs
            node tools/qa/cxorbia-i3-vrm297-shopper-client-projection.test.mjs
          fi
      - name: Install isolated Firestore Rules Emulator test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false firebase@11.0.0 @firebase/rules-unit-testing@4.0.0 firebase-tools@14.16.0
      - name: Firestore emulator proves exact Shopper read authority and Admin preservation
        env:
          CI: 'true'
        run: npx --no-install firebase emulators:exec --only firestore --project demo-cxorbia-d05-ruleproof 'node tools/qa/cxorbia-i3-d05-certification-authority-rules.test.mjs'
