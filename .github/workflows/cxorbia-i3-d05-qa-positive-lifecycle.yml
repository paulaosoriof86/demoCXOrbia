      - name: Verify Rules Hosting six static assets and production unchanged
        run: |
          set -Eeuo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          PROJECT="$(jq -r .dev.project "$REQUEST")"
          curl -fsS --max-time 45 -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/projects/$PROJECT/releases/cloud.firestore" -o "$OUT/rules-after.json"
          curl -fsS --max-time 45 -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/cxorbia-backend-dev/channels/live" -o "$OUT/hosting-after.json"
          test "$(jq -r .rulesetName "$OUT/rules-after.json")" = "$(jq -r .rulesetName "$OUT/rules-before.json")"
          test "$(jq -r .release.version.name "$OUT/hosting-after.json")" = "$(jq -r .release.version.name "$OUT/hosting-before.json")"
          SRC="$(jq -r .productSource.sha "$REQUEST")"
          for FILE in core/backend-certifications.js core/backend-resources.js modules/cert.js modules/documentos.js core/router.js index-backend-dev.html; do
            SAFE="$(printf '%s' "$FILE" | tr '/' '-')"
            curl -fsS --max-time 45 -H 'Cache-Control: no-cache, no-store' "$DEV_URL/$FILE?vrm298=$GITHUB_RUN_ID" -o "$OUT/served-$SAFE"
            test "$(git hash-object "$OUT/served-$SAFE")" = "$(git rev-parse "$SRC:app/$FILE")"
          done
          curl -fsS --max-time 45 "$PROD_URL/" -o "$OUT/production-after.html"
          sha256sum "$OUT/production-after.html" | awk '{print $1}' > "$OUT/production-after.sha256"
          cmp -s "$OUT/production-before.sha256" "$OUT/production-after.sha256"
          jq -n --arg sha "$SRC" --arg tree "$(jq -r .productSource.tree "$REQUEST")" --arg rev "$REV" --arg digest "$(jq -r '.status.imageDigest // empty' "$OUT/new-revision.json")" --arg rules "$(jq -r .rulesetName "$OUT/rules-after.json")" --arg hosting "$(jq -r .release.version.name "$OUT/hosting-after.json")" '{decision:"PASS_VRM298_PREBUILT_BACKEND_REVISION_SERVING_100_DEV",sourceSha:$sha,sourceTree:$tree,activeRuntimeRevision:$rev,runtimeDigest:$digest,firestoreRuleset:$rules,hostingVersion:$hosting,newBuilds:0,newImageUpdates:0,devTrafficSwitches:1,devRulesDeploys:0,devHostingDeploys:0,realBankWrites:0,shopperAttemptWrites:0,authWrites:0,hrWrites:0,financeWrites:0,productionChanged:false,shopperRoleE2E:"PRESERVED_RUN41478576401_PREVIOUS_SOURCE_PROJECTION_UNCHANGED",domainMatchCount:5,gate20:"HOLD",gate21:"HOLD",production:false}' > "$OUT/result.json"
          jq -e '.decision=="PASS_VRM298_PREBUILT_BACKEND_REVISION_SERVING_100_DEV"
            and .newBuilds==0 and .newImageUpdates==0
            and .devTrafficSwitches==1 and .realBankWrites==0
            and .productionChanged==false and .domainMatchCount==5' "$OUT/result.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-d06-vrm298-existing-revision-traffic-${{ github.run_id }}
          path: .tmp/i3-d06-vrm298-existing-revision-traffic/
          if-no-files-found: warn
          retention-days: 30
