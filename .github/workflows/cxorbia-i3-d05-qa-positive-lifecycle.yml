  d06-vrm298-backend-only-dev:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[i3-d06-vrm298-backend-dev]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
