name: CXOrbia C6 Auth Principal Uniqueness Rootfix Activation DEV

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'backend/config/c6-auth-principal-uniqueness-rootfix-activation-dev-request-v1.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-principal-uniqueness-rootfix-activation-dev
  cancel-in-progress: false

jobs:
  rootfix-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUEST_FILE: backend/config/c6-auth-principal-uniqueness-rootfix-activation-dev-request-v1.json
      FREEZE_FILE: backend/config/c6-shopper-auth-final-freeze-v3.json
      CONTRACT_FILE: backend/contracts/c6-auth-activation-dev-v2.json
      ROOTFIX_TOOL: tools/qa/cxorbia-c6-auth-principal-uniqueness-rootfix-source-only.mjs
      ACTIVATION_TOOL: tools/qa/cxorbia-c6-auth-activation-dev-v2.mjs
      OLD_PLAN_DIR: .tmp/c6-auth-principal-rootfix/old-plan
      SOURCE_OUT: .tmp/c6-auth-principal-rootfix/source-out
      ACTIVATION_OUT: .tmp/c6-auth-principal-rootfix/activation-out
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact macro authorization and request-only commit
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(r.schemaVersion==='cxorbia.c6.auth-principal-uniqueness-rootfix-activation-dev.request.v1','REQUEST_SCHEMA');
          ok(r.requestId==='c6-auth-principal-uniqueness-rootfix-activation-dev-20260807-01','REQUEST_ID');
          ok(r.enabled===true&&r.consumed===false&&r.allowedExecutions===1&&r.authorizedBy==='Paula'&&r.status==='authorized_execute_once_after_source_phase_pass','REQUEST_AUTH');
          ok(r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&r.pullRequest===7&&r.firebaseProjectId==='cxorbia-backend-dev','LANE');
          ok(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_ONLY_COMMIT');
          ok(r.freeze===process.env.FREEZE_FILE&&r.contract===process.env.CONTRACT_FILE,'FILES');
          ok(r.phase1?.providerReads===0&&r.phase1?.providerWrites===0&&r.phase1?.requiredPass==='PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SOURCE_ONLY','PHASE1');
          ok(r.phase2?.providerAttemptsMax===1&&r.phase2?.secondProviderAttempt===false,'PHASE2_ATTEMPT');
          console.log(JSON.stringify({parent,changed,authorized:true,phase1SourceOnly:true,phase2SingleProviderAttempt:true}));
          NODE

      - name: Install pinned Firebase Admin SDK for source self-test and phase 2
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Phase 1 static and hermetic gates
        run: |
          set -euo pipefail
          node --check "$ROOTFIX_TOOL"
          node --check "$ACTIVATION_TOOL"
          node "$ROOTFIX_TOOL" --self-test | tee /tmp/rootfix-selftest.txt
          grep -q 'PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SELFTEST' /tmp/rootfix-selftest.txt
          node "$ACTIVATION_TOOL" --self-test | tee /tmp/activation-selftest.txt
          grep -q 'PASS_C6_AUTH_ACTIVATION_V2_SELFTEST' /tmp/activation-selftest.txt
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.ACTIVATION_TOOL,'utf8');
          const req=['gatherCandidatesTargetSpecific','assertPrincipalOwner','GLOBAL_PRINCIPAL_UID_ALIAS','GLOBAL_PRINCIPAL_CANDIDATE_ALIAS','LEGACY_SHA256_ROUNDS1_SALTLESS_EXACT','PROVIDER_HASH_CONFIG_EXACT','TARGET_ROOTFIX_CANDIDATE_DRIFT','state.writeBoundaryEntered=true'];
          for(const x of req)if(!s.includes(x))throw new Error('MISSING_ROOTFIX_GUARD:'+x);
          if(s.includes('gatherCandidates(profile.id,credentials,names.baseLogin,targetLogin)'))throw new Error('OLD_SHARED_BASELOGIN_SELECTOR_REINTRODUCED');
          const pre=s.indexOf("sourceSafe.prewrite={pass:true");const boundary=s.indexOf('state.writeBoundaryEntered=true');const snapshot=s.indexOf("rollback-snapshot-prewrite.enc.json");
          if(pre<0||boundary<0||snapshot<0||!(snapshot<pre&&pre<boundary))throw new Error('WRITE_BOUNDARY_ORDER_INVALID');
          console.log('PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_STATIC_NO_LOOP_GATE');
          NODE

      - name: Phase 1 download prior frozen final plan from GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OLD_PLAN_DIR" "$SOURCE_OUT"
          gh run download 31213274602 -n cxorbia-c6-auth-activation-dev-31213274602 -D "$OLD_PLAN_DIR"
          test -f "$OLD_PLAN_DIR/final-plan-source-safe.json"

      - name: Phase 1 materialize and validate corrected 340-row plan source-only
        run: |
          set -euo pipefail
          CXORBIA_C6_ROOTFIX_OUT="$SOURCE_OUT" node "$ROOTFIX_TOOL" \
            "$OLD_PLAN_DIR/final-plan-source-safe.json" \
            app/docs/evidence/C6-AUTH-TARGET-ADAPTIVE-LINEAGE-ROOT-CAUSE-CROSS-ROW-PRINCIPAL-ALIAS-STOP-RETRY-20260807.json \
            "$FREEZE_FILE"
          node <<'NODE'
          const fs=require('fs');const e=require('./.tmp/c6-auth-principal-rootfix/source-out/source-phase-evidence.json');const p=require('./.tmp/c6-auth-principal-rootfix/source-out/final-plan-v3-source-safe.json');
          if(e.decision!=='PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SOURCE_ONLY')throw new Error('PHASE1_NOT_PASS');
          if(e.providerReads!==0||e.providerWrites!==0||e.authWrites!==0||e.firestoreWrites!==0||e.hrWrites!==0)throw new Error('PHASE1_PROVIDER_BOUNDARY_CROSSED');
          if(p.plan?.rows!==340||p.plan?.uniqueRows!==340||p.plan?.operationCounts?.CREATE_AUTH!==82||p.plan?.operationCounts?.UPDATE_AUTH!==45||p.plan?.operationCounts?.HOLD!==0||p.plan?.subchangeCounts?.password!==13||p.plan?.sourceSafeRowsDigestSha256!=='7b92fa73946e74ec4058bcdcbcfca25fe90e0504db6b6b22e797fbad066bd749')throw new Error('PHASE1_PLAN_INVARIANT');
          console.log(JSON.stringify({decision:e.decision,rows:e.rows,counts:e.operationCounts,passwordChanges:e.subchangeCounts.password,digest:e.digest,providerReads:0,providerWrites:0}));
          NODE

      - name: Phase 1 PASS marker
        run: echo 'PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SOURCE_ONLY'

      - name: Phase 2 load canonical DEV credential privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-principal-rootfix-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-principal-rootfix-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-principal-rootfix-private/credentials.json" >> "$GITHUB_ENV"

      - name: Phase 2 single PREWRITE plus Auth Activation DEV
        id: activate
        run: |
          set +e
          mkdir -p "$ACTIVATION_OUT"
          CXORBIA_FINAL_PLAN_V3="$SOURCE_OUT/final-plan-v3-source-safe.json" \
          CXORBIA_AUTH_ACTIVATION_V2_EXPORT_DIR="$ACTIVATION_OUT" \
          node "$ACTIVATION_TOOL" "$REQUEST_FILE"
          code=$?
          decision=$(head -n 1 "$ACTIVATION_OUT/decision.txt" 2>/dev/null || echo STOP_RETRY_C6_AUTH_ACTIVATION_DEV_V2_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$code" != '0' ] && [ "$code" != '2' ]; then exit "$code"; fi
          exit 0

      - name: Verify phase 2 terminal evidence and safety
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const e=require('./.tmp/c6-auth-principal-rootfix/activation-out/report-source-safe.json');
          if(e.safety?.firestoreWrites!==0||e.safety?.membershipWrites!==0||e.safety?.hrWrites!==0||e.safety?.rulesWrites!==0||e.safety?.storageWrites!==0||e.safety?.cloudBuilds!==0||e.safety?.cloudRunDeploys!==0||e.safety?.hostingDeploys!==0||e.safety?.merge!==false||e.safety?.production!==false)throw new Error('SAFETY_DRIFT');
          const raw=JSON.stringify(e);if(raw.includes('@auth.cxorbia.invalid')||/"uid"\s*:/.test(raw)||/passwordHash|passwordSalt|"email"\s*:|"shopperId"\s*:/.test(raw))throw new Error('SOURCE_SAFE_LEAK');
          if(e.decision==='PASS_C6_AUTH_ACTIVATION_DEV_V2'){
            if(!e.prewrite?.pass||!e.readback?.pass||!e.rollbackDryRun?.pass||e.safety?.authCreates!==82||e.safety?.authUpdates!==45||e.safety?.duplicateDisables!==1||e.readback?.authUsersAfter!==192||e.rollbackDryRun?.passwordHashRestoreEntries!==13)throw new Error('PASS_INVARIANT');
          }
          if(e.safety?.writeBoundaryEntered===false&&(e.safety?.authCreates!==0||e.safety?.authUpdates!==0||e.safety?.duplicateDisables!==0||e.safety?.providerWriteCalls!==0))throw new Error('PREWRITE_STOP_WITH_WRITES');
          console.log(JSON.stringify({decision:e.decision,prewritePass:Boolean(e.prewrite?.pass),writeBoundaryEntered:Boolean(e.safety?.writeBoundaryEntered),authCreates:e.safety?.authCreates||0,authUpdates:e.safety?.authUpdates||0,duplicateDisables:e.safety?.duplicateDisables||0,readbackPass:Boolean(e.readback?.pass),rollbackDryRunPass:Boolean(e.rollbackDryRun?.pass),providerWrites:e.safety?.providerWriteCalls||0,firestoreWrites:0,hrWrites:0}));
          NODE

      - name: Upload terminal macro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-principal-uniqueness-rootfix-activation-dev-${{ github.run_id }}
          path: |
            .tmp/c6-auth-principal-rootfix/source-out
            .tmp/c6-auth-principal-rootfix/activation-out
          if-no-files-found: warn
          retention-days: 14

      - name: Publish observable decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.activate.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; fi
          DESC=$(printf '%s' "${DECISION:-STOP_RETRY_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_NO_PROVIDER_DECISION}" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-principal-uniqueness-rootfix-activation-dev' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/c6-auth-principal-rootfix-private
