name: CXOrbia I3 VRM286 Admin Read-Only DEV E2E
on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
permissions:
  contents: read
jobs:
  admin-project-period-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-vrm286-admin-readonly]') || contains(github.event.head_commit.message, '[i3-recert-safe-09eed-20261105]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CXORBIA_PRODUCT_SOURCE_SHA: 09eed4f012f9ad04e49d53569aabd86bd4c832a9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin frozen product candidate without deployment
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "$CXORBIA_PRODUCT_SOURCE_SHA"
          git diff --quiet "$CXORBIA_PRODUCT_SOURCE_SHA" HEAD -- app backend firestore.rules storage.rules firebase.json .firebaserc
          node --check tools/qa/cxorbia-i3-vrm286-admin-readonly-live.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install read-only test dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1
          npx --no-install playwright install chromium
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Verify real authenticated Admin UI versus hydrated read model
        run: node tools/qa/cxorbia-i3-vrm286-admin-readonly-live.mjs
      - name: Inspect approved Murga/Vilca profile and Auth login without writes
        run: |
          node --check firebase/auth-dev-tools/cxorbia-i3-two-authorized-name-logins-readonly.mjs
          node firebase/auth-dev-tools/cxorbia-i3-two-authorized-name-logins-readonly.mjs
      - name: Prove current HR revision and safe keeper feasibility for both residual humans
        run: |
          node --check firebase/auth-dev-tools/cxorbia-i3-two-residual-cluster-keeper-preflight-readonly.mjs
          node firebase/auth-dev-tools/cxorbia-i3-two-residual-cluster-keeper-preflight-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-vrm286-admin-readonly-${{ github.run_id }}
          path: |
            .tmp/cxorbia-i3-vrm286-admin-readonly/result.json
            .tmp/cxorbia-i3-two-authorized-name-logins-readonly/result.json
            .tmp/cxorbia-i3-residual-keeper-preflight/result.json
          if-no-files-found: warn
          retention-days: 30

  b14-delegated-credential-readonly-preflight:
    if: ${{ contains(github.event.head_commit.message, '[i3-b14-credential-preflight]') }}
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read DEV Cloud Run credential reference names only
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe cxorbia-live-hr-dev --project cxorbia-backend-dev --region us-central1 --format=json > "$RUNNER_TEMP/cxorbia-service.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cxorbia-service.json','utf8'));
          const c=(s.spec?.template?.spec?.containers||[])[0]||{}, env=c.env||[];
          const names=['CXORBIA_B14_MAKE_API_TOKEN','CXORBIA_B14_MAKE_SCENARIO_ID','CXORBIA_I3_B14_DIRECT_READER_DEV'];
          const p=Object.fromEntries(names.map(name=>[name,{configured:env.some(x=>x.name===name),secretReferenced:env.some(x=>x.name===name&&!!x.valueFrom?.secretKeyRef)}]));
          console.log('B14_DEV_CREDENTIAL_REFERENCE_PREFLIGHT='+JSON.stringify({decision:'READ_ONLY_DEV_REFERENCE_INVENTORY',service:'cxorbia-live-hr-dev',expected:p,production:false,secretValuesInspected:false}));
          NODE
          if gcloud secrets list --project cxorbia-backend-dev --format='value(name)' > "$RUNNER_TEMP/cxorbia-secret-names.txt" 2> "$RUNNER_TEMP/cxorbia-secret-list-error.txt"; then
            echo 'B14_DEV_SECRET_NAMES_API=ACCESS_GRANTED_NAMES_ONLY'
            grep -Ei 'B14|MAKE' "$RUNNER_TEMP/cxorbia-secret-names.txt" | sed -E 's/.*/B14_DEV_MATCHING_SECRET_NAME_PRESENT=true/' | sort -u || :
          else
            echo 'B14_DEV_SECRET_NAMES_API=READ_PERMISSION_UNVERIFIED'
          fi
          rm -f "$RUNNER_TEMP/cxorbia-service.json" "$RUNNER_TEMP/cxorbia-secret-names.txt" "$RUNNER_TEMP/cxorbia-secret-list-error.txt"

  b14-delegated-toolbox-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-b14-toolbox-readonly]') || contains(github.event.head_commit.message, '[i3-b14-original-parity]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      B14_COMPARE_ONLY: ${{ contains(github.event.head_commit.message, '[i3-b14-original-parity]') }}
      B14_MAKE_TOOLBOX_URL: https://eu2.make.com/mcp/server/98b29fbe-fbfe-42f2-aeae-e27998eb60c6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned test clients
        run: npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13.4.0 @modelcontextprotocol/sdk@1.26.0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove scoped Make GT and HN reads with the DEV service identity
        run: node tools/qa/cxorbia-i3-b14-toolbox-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'cxorbia-i3-b14-toolbox-readonly-${{ github.run_id }}'
          path: .tmp/i3-b14-toolbox/result.json
          if-no-files-found: warn
          retention-days: 30

  i3-b11-r23-same-revision-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-b11-r23-readonly]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: { contents: read, id-token: write }
    env:
      PROJECT: cxorbia-backend-dev
      HOSTING_URL: https://cxorbia-backend-dev.web.app
      FOCAL_SOURCE: d72275685d57941f6cfa0fcebc4823287942f786
      EXPECTED_HR_REVISION: 3ab4e64df295282e4b4134070a9feca9631dc69b6bb848e890fb58572903beb8
      PHASEA_LIVE_OUT: .tmp/i3-b11-r23-exact-dev
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Verify unchanged DEV HR revision and existing served source
        run: |
          set -Eeuo pipefail
          node --check tools/qa/cxorbia-i3-r23-independent-hr-kpi-readonly.mjs
          curl -fsS --retry 2 "${HOSTING_URL}/api/tya/cinepolis/hr-live?format=meta" > "$RUNNER_TEMP/b11-hr-meta.json"
          jq -e --arg expected "$EXPECTED_HR_REVISION" '.revision==$expected and .sourceSafe==true and .production==false' "$RUNNER_TEMP/b11-hr-meta.json" >/dev/null
          rm "$RUNNER_TEMP/b11-hr-meta.json"
      - name: Install authenticated DEV browser test dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null
          npx --no-install playwright install chromium >/dev/null
      - name: Execute B11 external HR / Admin KPI same-revision GT and HN
        run: |
          node tools/qa/cxorbia-i3-r23-independent-hr-kpi-readonly.mjs
          jq -e '.decision=="PASS_R23_GT_HN_SAME_EXTERNAL_HR_REVISION"' "$PHASEA_LIVE_OUT/r23/result.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'cxorbia-i3-b11-r23-readonly-${{ github.run_id }}'
          path: |
            .tmp/i3-b11-r23-exact-dev/r23/result.json
            .tmp/i3-b11-r23-exact-dev/r23/GT/r23-external-hr-kpis-same-revision.json
            .tmp/i3-b11-r23-exact-dev/r23/HN/r23-external-hr-kpis-same-revision.json
          if-no-files-found: warn
          retention-days: 30
  i3-b11-stage-current-hr-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-b11-stage-readonly]') || contains(github.event.head_commit.message, '[i3-b11-visits-reports]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: { contents: read, id-token: write }
    env:
      FOCAL_SOURCE: d72275685d57941f6cfa0fcebc4823287942f786
      EXPECTED_HR_REVISION: 3ab4e64df295282e4b4134070a9feca9631dc69b6bb848e890fb58572903beb8
      EXPECTED_PERIOD_ID: cinepolis-2026-11
      B11_CROSS_SURFACE: ${{ contains(github.event.head_commit.message, '[i3-b11-visits-reports]') }}
      B11_STAGE_OUT: .tmp/i3-b11-stage-current-hr
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Read-only B11 Dashboard and MiDia same-source browser proof
        run: |
          set -Eeuo pipefail
          node --check tools/qa/cxorbia-i3-b11-dashboard-stage-readonly.mjs
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null
          npx --no-install playwright install chromium >/dev/null
          node tools/qa/cxorbia-i3-b11-dashboard-stage-readonly.mjs
          if [[ "$B11_CROSS_SURFACE" == true ]]; then
            jq -e '.decision=="PASS_B11_VISITS_KEYS_REPORT_COVERAGE_SAME_REVISION" and (.owners|length)==2 and (.countries|length)==2 and (.coverage|length)==2 and all(.coverage[];.pass) and .production==false' "$B11_STAGE_OUT/result.json" >/dev/null
          else
            jq -e '.decision=="PASS_B11_DASHBOARD_MIDIA_CURRENT_HR_SCOPED_READONLY" and (.owners|length)==2 and (.countries|length)==2 and .midia.passed==true and .production==false' "$B11_STAGE_OUT/result.json" >/dev/null
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'cxorbia-i3-b11-stage-readonly-${{ github.run_id }}'
          path: .tmp/i3-b11-stage-current-hr/result.json
          if-no-files-found: warn
          retention-days: 30
  i3-b14-github-secret-presence:
    if: ${{ contains(github.event.head_commit.message, '[i3-b14-credential-presence]') }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      G1: ${{ secrets.CXORBIA_B14_MAKE_API_TOKEN != '' }}
      G2: ${{ secrets.CXORBIA_MAKE_API_TOKEN != '' }}
      G3: ${{ secrets.MAKE_API_TOKEN != '' }}
      G4: ${{ secrets.MAKE_API_KEY != '' }}
    steps:
      - name: Detect existing Make API credential references without disclosing values
        run: |
          printf 'B14_GITHUB_CREDENTIAL_NAMES_ONLY={"CXORBIA_B14_MAKE_API_TOKEN":"%s","CXORBIA_MAKE_API_TOKEN":"%s","MAKE_API_TOKEN":"%s","MAKE_API_KEY":"%s","secretContentsRead":false,"production":false}\n' "$G1" "$G2" "$G3" "$G4"
  i3-work-period-reload-p0-test:
    if: ${{ contains(github.event.head_commit.message, '[i3-work-period-source-test]') }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Work GT11 GT12 HN06 scoped period and route reload source tests
        run: |
          node --check app/core/router.js
          node --check app/adapters/tya-live-source-inplace-apply.js
          node --test tools/qa/cxorbia-i3-work-period-reload-scoped.test.mjs
  i3-work-c3-import-verification:
    if: ${{ contains(github.event.head_commit.message, '[i3-work-c3-import-qa]') }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Verify Work 28 receipts and 21-domain matrix exact source hashes
        run: node --test tools/qa/cxorbia-i3-work-chrome-c3-evidence.test.mjs
