name: CXOrbia I3 VRM286 Admin Read-Only DEV E2E
on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
permissions:
  contents: read
jobs:
  admin-project-period-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-vrm286-admin-readonly]') || contains(github.event.head_commit.message, '[i3-recert-safe-09eed-20261105]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin frozen product candidate without deployment
        run: |
          set -Eeuo pipefail
          CXORBIA_PRODUCT_SOURCE_SHA="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$CXORBIA_PRODUCT_SOURCE_SHA" = "$(jq -r '.productSourceSha' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)"
          test "$(git rev-parse "$CXORBIA_PRODUCT_SOURCE_SHA^{tree}")" = "$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          git diff --quiet "$CXORBIA_PRODUCT_SOURCE_SHA" HEAD -- app backend firestore.rules storage.rules firebase.json .firebaserc
          echo "CXORBIA_PRODUCT_SOURCE_SHA=$CXORBIA_PRODUCT_SOURCE_SHA" >> "$GITHUB_ENV"
          node --check tools/qa/cxorbia-i3-vrm286-admin-readonly-live.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install read-only test dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1
          npx --no-install playwright install chromium
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Verify real authenticated Admin UI versus hydrated read model
        run: node tools/qa/cxorbia-i3-vrm286-admin-readonly-live.mjs
      - name: Inspect approved Murga/Vilca profile and Auth login without writes
        run: |
          node --check firebase/auth-dev-tools/cxorbia-i3-two-authorized-name-logins-readonly.mjs
          node firebase/auth-dev-tools/cxorbia-i3-two-authorized-name-logins-readonly.mjs
      - name: Prove current HR revision and safe keeper feasibility for both residual humans
        run: |
          node --check firebase/auth-dev-tools/cxorbia-i3-two-residual-cluster-keeper-preflight-readonly.mjs
          node firebase/auth-dev-tools/cxorbia-i3-two-residual-cluster-keeper-preflight-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-vrm286-admin-readonly-${{ github.run_id }}
          path: |
            .tmp/cxorbia-i3-vrm286-admin-readonly/result.json
            .tmp/cxorbia-i3-two-authorized-name-logins-readonly/result.json
            .tmp/cxorbia-i3-residual-keeper-preflight/result.json
          if-no-files-found: warn
          retention-days: 30

  b14-delegated-credential-readonly-preflight:
    if: ${{ contains(github.event.head_commit.message, '[i3-b14-credential-preflight]') }}
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read DEV Cloud Run credential reference names only
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe cxorbia-live-hr-dev --project cxorbia-backend-dev --region us-central1 --format=json > "$RUNNER_TEMP/cxorbia-service.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cxorbia-service.json','utf8'));
          const c=(s.spec?.template?.spec?.containers||[])[0]||{}, env=c.env||[];
          const names=['CXORBIA_B14_MAKE_API_TOKEN','CXORBIA_B14_MAKE_SCENARIO_ID','CXORBIA_I3_B14_DIRECT_READER_DEV'];
          const p=Object.fromEntries(names.map(name=>[name,{configured:env.some(x=>x.name===name),secretReferenced:env.some(x=>x.name===name&&!!x.valueFrom?.secretKeyRef)}]));
          console.log('B14_DEV_CREDENTIAL_REFERENCE_PREFLIGHT='+JSON.stringify({decision:'READ_ONLY_DEV_REFERENCE_INVENTORY',service:'cxorbia-live-hr-dev',expected:p,production:false,secretValuesInspected:false}));
          NODE
          if gcloud secrets list --project cxorbia-backend-dev --format='value(name)' > "$RUNNER_TEMP/cxorbia-secret-names.txt" 2> "$RUNNER_TEMP/cxorbia-secret-list-error.txt"; then
            echo 'B14_DEV_SECRET_NAMES_API=ACCESS_GRANTED_NAMES_ONLY'
            grep -Ei 'B14|MAKE' "$RUNNER_TEMP/cxorbia-secret-names.txt" | sed -E 's/.*/B14_DEV_MATCHING_SECRET_NAME_PRESENT=true/' | sort -u || :
          else
            echo 'B14_DEV_SECRET_NAMES_API=READ_PERMISSION_UNVERIFIED'
          fi
          rm -f "$RUNNER_TEMP/cxorbia-service.json" "$RUNNER_TEMP/cxorbia-secret-names.txt" "$RUNNER_TEMP/cxorbia-secret-list-error.txt"

  b14-delegated-toolbox-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-b14-toolbox-readonly]') || contains(github.event.head_commit.message, '[i3-b14-original-parity]') || contains(github.event.head_commit.message, '[i3-b14-live-original]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      B14_REGISTER_ORIGINAL: ${{ contains(github.event.head_commit.message, '[i3-b14-register-original]') }}
      B14_FRESH_ORIGINAL: ${{ contains(github.event.head_commit.message, '[i3-b14-live-original]') }}
      B14_COMPARE_ONLY: ${{ contains(github.event.head_commit.message, '[i3-b14-original-parity]') }}
      B14_MAKE_TOOLBOX_URL: https://eu2.make.com/mcp/server/98b29fbe-fbfe-42f2-aeae-e27998eb60c6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Run the three canonical HR reader self-tests and focal Work/Graph regressions
        run: |
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --mapping-self-test
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --assignment-self-test
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --provider-auth-self-test
          node --test tools/qa/cxorbia-i3-b14-make-graph-provider.test.mjs tools/qa/cxorbia-i3-work-period-reload-scoped.test.mjs tools/qa/cxorbia-i3-work-chrome-c3-evidence.test.mjs
      - name: Install pinned test clients
        run: npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13.4.0 @modelcontextprotocol/sdk@1.26.0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove scoped Make GT and HN reads with the DEV service identity
        env:
          B14_PRIVATE_BINDINGS: ${{ secrets.CXORBIA_DEV_B14_ORIGINAL_WORKBOOK_BINDINGS }}
        run: node tools/qa/cxorbia-i3-b14-toolbox-readonly.mjs
      - name: Read only DEV project period catalog for original Excel mapping
        run: node tools/qa/cxorbia-i3-f2-excel-period-registry-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'cxorbia-i3-b14-toolbox-readonly-${{ github.run_id }}'
          path: |
            .tmp/i3-b14-toolbox/result.json
            .tmp/i3-f2-period-registry/result.json
          if-no-files-found: warn
          retention-days: 30

  i3-f2-original-period-registry:
    if: ${{ contains(github.event.head_commit.message, '[i3-f2-original-registry]') || contains(github.event.head_commit.message, '[i3-f2-activate-excel-dev]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Register ONLY private original Excel monthly binding metadata, transaction + independent readback
        if: ${{ contains(github.event.head_commit.message, '[i3-f2-original-registry]') }}
        env:
          CXORBIA_F2_REGISTER_GATE: PAULA_DEV_ONLY_ORIGINAL_EXCEL_PERIOD_BINDING_20261122
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 @modelcontextprotocol/sdk@1.26.0 >/dev/null
          node tools/qa/cxorbia-i3-f2-register-original-periods-dev.mjs
      - name: Activate exact original Excel operational selector in DEV only, with remote ACK and rollback
        if: ${{ contains(github.event.head_commit.message, '[i3-f2-activate-excel-dev]') }}
        env:
          CXORBIA_F2_DEV_OPERATIONAL_SWITCH_GATE: PAULA_I3_F2_EXCEL_ORIGINAL_DEV_ONLY_20261123
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null
          node --check tools/qa/cxorbia-i3-f2-activate-operational-excel-dev.mjs
          node tools/qa/cxorbia-i3-f2-activate-operational-excel-dev.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-f2-original-registry-${{ github.run_id }}
          path: |
            .tmp/i3-f2-register-original-periods/result.json
            .tmp/i3-f2-operational-dev/receipt.json
          if-no-files-found: warn
          retention-days: 30

  i3-f2-full-original-operational-preflight:
    if: ${{ contains(github.event.head_commit.message, '[i3-f2-full-original-preflight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify exact source SHA and test syntax
        run: |
          set -Eeuo pipefail
          SOURCE="$(jq -er '.productSourceSha|select(test("^[a-f0-9]{40}$"))' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$SOURCE" = "$(jq -r '.productSource.sha' RECOVERY-I3-MODULE-TRUTH-MATRIX-20261122-V380.json)"
          git merge-base --is-ancestor "$SOURCE" HEAD
          # Diagnostic source-only successor has exactly one owner change beyond
          # the pinned F2 source. This QA is NOT a release or composition PASS.
          delta="$(git diff --name-only "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**')"
          test "$delta" = "backend/runtime/cxorbia-excel-operational-snapshot-v1.mjs"
          test "$(git rev-parse HEAD:backend/runtime/cxorbia-excel-operational-snapshot-v1.mjs)" = "d0697f2a406c5249b0e540307ff76866644e1e72"
          node --check tools/qa/cxorbia-i3-f2-full-original-live-preflight-readonly.mjs
          node --test backend/runtime/hr-live-service/test/cxorbia-excel-operational-source-v1.test.mjs
          echo "CXORBIA_F2_EXACT_SOURCE_SHA=$SOURCE" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read originals through existing Make B14 and compare exact DEV durable visits
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 @modelcontextprotocol/sdk@1.26.0 >/dev/null
          node tools/qa/cxorbia-i3-f2-full-original-live-preflight-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-f2-full-original-preflight-${{ github.run_id }}
          path: .tmp/i3-f2-live-excel-source-preflight/result.json
          if-no-files-found: error
          retention-days: 30

  i3-f2-durable-owner-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-f2-duplicate-owner-readonly]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Inspect durable visit provenance and cross-module references without mutations
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null
          node tools/qa/cxorbia-i3-f2-durable-duplicate-ownership-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-f2-duplicate-owner-${{ github.run_id }}
          path: .tmp/i3-f2-duplicate-durable-ownership/result.json
          if-no-files-found: error
          retention-days: 30

  i3-f2-exact-owner-source-test:
    if: ${{ contains(github.event.head_commit.message, '[i3-f2-match-qa]') }}
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Exact P0 historical original HR row matcher source tests, no provider writes
        run: |
          set -Eeuo pipefail
          node --check backend/runtime/cxorbia-excel-operational-snapshot-v1.mjs
          node --test backend/runtime/hr-live-service/test/cxorbia-excel-operational-source-v1.test.mjs
          node --test backend/runtime/hr-live-service/test/cxorbia-b14-excel-country-binding.test.mjs
          echo "CXORBIA_F2_SOURCE_ONLY_QA=PASS_NO_DEV_DEPLOY" >> "$GITHUB_STEP_SUMMARY"

  i3-b11-r23-same-revision-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-b11-r23-readonly]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: { contents: read, id-token: write }
    env:
      PROJECT: cxorbia-backend-dev
      HOSTING_URL: https://cxorbia-backend-dev.web.app
      FOCAL_SOURCE: d72275685d57941f6cfa0fcebc4823287942f786
      EXPECTED_HR_REVISION: 3ab4e64df295282e4b4134070a9feca9631dc69b6bb848e890fb58572903beb8
      PHASEA_LIVE_OUT: .tmp/i3-b11-r23-exact-dev
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Verify unchanged DEV HR revision and existing served source
        run: |
          set -Eeuo pipefail
          node --check tools/qa/cxorbia-i3-r23-independent-hr-kpi-readonly.mjs
          curl -fsS --retry 2 "${HOSTING_URL}/api/tya/cinepolis/hr-live?format=meta" > "$RUNNER_TEMP/b11-hr-meta.json"
          jq -e --arg expected "$EXPECTED_HR_REVISION" '.revision==$expected and .sourceSafe==true and .production==false' "$RUNNER_TEMP/b11-hr-meta.json" >/dev/null
          rm "$RUNNER_TEMP/b11-hr-meta.json"
      - name: Install authenticated DEV browser test dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null
          npx --no-install playwright install chromium >/dev/null
      - name: Execute B11 external HR / Admin KPI same-revision GT and HN
        run: |
          node tools/qa/cxorbia-i3-r23-independent-hr-kpi-readonly.mjs
          jq -e '.decision=="PASS_R23_GT_HN_SAME_EXTERNAL_HR_REVISION"' "$PHASEA_LIVE_OUT/r23/result.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'cxorbia-i3-b11-r23-readonly-${{ github.run_id }}'
          path: |
            .tmp/i3-b11-r23-exact-dev/r23/result.json
            .tmp/i3-b11-r23-exact-dev/r23/GT/r23-external-hr-kpis-same-revision.json
            .tmp/i3-b11-r23-exact-dev/r23/HN/r23-external-hr-kpis-same-revision.json
          if-no-files-found: warn
          retention-days: 30
  i3-b11-stage-current-hr-readonly:
    if: ${{ contains(github.event.head_commit.message, '[i3-b11-stage-readonly]') || contains(github.event.head_commit.message, '[i3-b11-visits-reports]') || contains(github.event.head_commit.message, '[i3-original-app-ui]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: { contents: read, id-token: write }
    env:
      FOCAL_SOURCE: ${{ contains(github.event.head_commit.message, '[i3-original-app-ui]') && 'DERIVE_FROM_CANONICAL_DESCRIPTOR' || 'd72275685d57941f6cfa0fcebc4823287942f786' }}
      EXPECTED_HR_REVISION: 3ab4e64df295282e4b4134070a9feca9631dc69b6bb848e890fb58572903beb8
      EXPECTED_PERIOD_ID: cinepolis-2026-11
      B14_UI: ${{ contains(github.event.head_commit.message, '[i3-original-app-ui]') }}
      B11_CROSS_SURFACE: ${{ contains(github.event.head_commit.message, '[i3-b11-visits-reports]') }}
      B11_STAGE_OUT: .tmp/i3-b11-stage-current-hr
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Read-only B11 Dashboard and MiDia same-source browser proof
        run: |
          set -Eeuo pipefail
          node --check tools/qa/cxorbia-i3-b11-dashboard-stage-readonly.mjs
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.56.1 >/dev/null
          npx --no-install playwright install chromium >/dev/null
          if [[ "$B14_UI" == true ]]; then
            FOCAL_SOURCE="$(jq -er '.productSourceSha | select(test("^[a-f0-9]{40}$"))' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
            expected_tree="$(jq -er '.productTreeAuthority | select(test("^[a-f0-9]{40}$"))' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
            test "$(git rev-parse "$FOCAL_SOURCE^{tree}")" = "$expected_tree"
            git merge-base --is-ancestor "$FOCAL_SOURCE" HEAD
            export FOCAL_SOURCE
            node tools/qa/cxorbia-i3-original-read-period-ui.mjs
            exit 0
          fi
          node tools/qa/cxorbia-i3-b11-dashboard-stage-readonly.mjs
          if [[ "$B11_CROSS_SURFACE" == true ]]; then
            jq -e '.decision=="PASS_B11_VISITS_KEYS_REPORT_COVERAGE_SAME_REVISION" and (.owners|length)==2 and (.countries|length)==2 and (.coverage|length)==2 and all(.coverage[];.pass) and .production==false' "$B11_STAGE_OUT/result.json" >/dev/null
          else
            jq -e '.decision=="PASS_B11_DASHBOARD_MIDIA_CURRENT_HR_SCOPED_READONLY" and (.owners|length)==2 and (.countries|length)==2 and .midia.passed==true and .production==false' "$B11_STAGE_OUT/result.json" >/dev/null
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'cxorbia-i3-b11-stage-readonly-${{ github.run_id }}'
          path: |
            .tmp/i3-b11-stage-current-hr/result.json
            .tmp/i3-original-browser/
          if-no-files-found: warn
          retention-days: 30
  i3-b14-github-secret-presence:
    if: ${{ contains(github.event.head_commit.message, '[i3-b14-credential-presence]') }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      G1: ${{ secrets.CXORBIA_B14_MAKE_API_TOKEN != '' }}
      G2: ${{ secrets.CXORBIA_MAKE_API_TOKEN != '' }}
      G3: ${{ secrets.MAKE_API_TOKEN != '' }}
      G4: ${{ secrets.MAKE_API_KEY != '' }}
    steps:
      - name: Detect existing Make API credential references without disclosing values
        run: |
          printf 'B14_GITHUB_CREDENTIAL_NAMES_ONLY={"CXORBIA_B14_MAKE_API_TOKEN":"%s","CXORBIA_MAKE_API_TOKEN":"%s","MAKE_API_TOKEN":"%s","MAKE_API_KEY":"%s","secretContentsRead":false,"production":false}\n' "$G1" "$G2" "$G3" "$G4"
  i3-work-period-reload-p0-test:
    if: ${{ contains(github.event.head_commit.message, '[i3-work-period-source-test]') }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Work GT11 GT12 HN06 scoped period and route reload source tests
        run: |
          node --check app/core/router.js
          node --check app/adapters/tya-live-source-inplace-apply.js
          node --test tools/qa/cxorbia-i3-work-period-reload-scoped.test.mjs
  i3-work-c3-import-verification:
    if: ${{ contains(github.event.head_commit.message, '[i3-work-c3-import-qa]') }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Verify Work 28 receipts and 21-domain matrix exact source hashes
        run: node --test tools/qa/cxorbia-i3-work-chrome-c3-evidence.test.mjs

  i3-f2-original-operational-source-qa:
    if: ${{ contains(github.event.head_commit.message, '[i3-f2-source-qa]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Exact source-only P0 identity and no product drift
        run: |
          set -Eeuo pipefail
          SOURCE="$(jq -er '.productSourceSha | select(test("^[a-f0-9]{40}$"))' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          TREE="$(jq -er '.productTreeAuthority | select(test("^[a-f0-9]{40}$"))' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --quiet "$SOURCE" HEAD -- app backend tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          test "$(jq -r '.pendingDevSuccessor.devPublished' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "false"
          for file in backend/runtime/hr-live-service/server.mjs backend/runtime/cxorbia-excel-operational-snapshot-v1.mjs tools/hr-source/tya-build-live-hr-source-safe-r20.mjs backend/runtime/hr-live-service/test/cxorbia-excel-operational-source-v1.test.mjs; do node --check "$file"; done
          echo "I3_F2_SOURCE_SHA=$SOURCE" >> "$GITHUB_ENV"
          echo "I3_F2_SOURCE_TREE=$TREE" >> "$GITHUB_ENV"
      - name: Run existing source and Excel integration regressions, NO data writes
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/i3-f2-source-qa
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null
          node --test backend/runtime/hr-live-service/test/cxorbia-excel-operational-source-v1.test.mjs backend/runtime/hr-live-service/test/cxorbia-b14-excel-country-binding.test.mjs tools/qa/cxorbia-i3-b14-make-graph-provider.test.mjs | tee .tmp/i3-f2-source-qa/focal-tap.log
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --mapping-self-test > .tmp/i3-f2-source-qa/r20-mapping.log
          node tools/hr-source/tya-build-live-hr-source-safe-r20.mjs --assignment-self-test > .tmp/i3-f2-source-qa/r20-assignment.log
          grep -Fq PASS_R20_PROJECT_SCOPED_CINEMA_IDENTITY .tmp/i3-f2-source-qa/r20-mapping.log
          grep -Fq PASS_R20_SHOPPER_ASSIGNMENT_CLASSIFICATION .tmp/i3-f2-source-qa/r20-assignment.log
          jq -n --arg source "$I3_F2_SOURCE_SHA" --arg tree "$I3_F2_SOURCE_TREE" --arg run "$GITHUB_RUN_ID" \
            '{decision:"PASS_F2_ORIGINAL_EXCEL_SOURCE_QA_ONLY",sourceSha:$source,sourceTree:$tree,runId:($run|tonumber),
              scope:"NODE_SYNTHETIC_AND_R20_PARSER_ONLY_NOT_DEV_OR_MODULE_MATCH",
              hrWrites:0,firestoreWrites:0,deploys:0,production:false}' > .tmp/i3-f2-source-qa/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-f2-source-qa-${{ github.run_id }}
          path: .tmp/i3-f2-source-qa
          if-no-files-found: warn
          retention-days: 30
