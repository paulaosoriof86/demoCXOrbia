name: CXOrbia I3 P0 GT-HN DEV One-Shot
on:
  push:
    branches: [recovery/cxorbia-phase-a-20260831]
    paths: [.github/workflows/cxorbia-i3-p0-country-dev-once.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: cxorbia-i3-p0-country-dev-once
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PROJECT: cxorbia-backend-dev
  REGION: us-central1
  SERVICE: cxorbia-live-hr-dev
  HOSTING_URL: https://cxorbia-backend-dev.web.app
  HOSTING_SITE: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  CANDIDATE_DESCRIPTOR: CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json
  HISTORICAL_CONTROL_SHA: d4ba88a70e62b535cf07709eb89c1b56c33a9bf7
  HISTORICAL_PRODUCT_SOURCE: db56b89a1221d26f5cc4466585cda7eaa7360ddd
  HISTORICAL_PRODUCT_TREE: 7b157bdf187ed712256eacfe86c1ff016b40c44e
  PRIOR_DEV_SOURCE: db56b89a1221d26f5cc4466585cda7eaa7360ddd
  PRIOR_DEV_TREE: 7b157bdf187ed712256eacfe86c1ff016b40c44e
  PINNED_SOURCE: 0127d0c0785e37563390fa0a8dc98c8ed56a22b5
  PINNED_TREE: 9c0ec86b9acf894c653aa75a17ca9d9850de3a9f
  EXPECTED_OLD_REVISION: cxorbia-live-hr-dev-00328-r69
  EXPECTED_OLD_HOSTING_VERSION: sites/cxorbia-backend-dev/versions/bb25faef426017d9
  EXPECTED_OLD_AUTH_SHA256: caa74dad682936e3cd5f40bb91bb7104d27eda9aa18fde40f5c1aac9444a38c8
  EXPECTED_OLD_BRIDGE_SHA256: 286a4f572efc8655d6c8a6f865d3bf5ad8d95b57d1e53b6193af445f8ae164a1
  EVIDENCE_DIR: .tmp/i3-p0-country-dev
  PRODUCTION_URL: https://tya-plataforma.web.app
jobs:
  country-source-dev-only:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-HN-SCOPE-DEV-ONCE-V8' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve prior certification and independently test exact P0 country scope source
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$PROJECT" = cxorbia-backend-dev
          test "$SERVICE" = cxorbia-live-hr-dev
          test "$FIREBASE_HOSTING_TARGET" = cxorbia-dev
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          test "$(jq -r '.status' "$CANDIDATE_DESCRIPTOR")" = HOLD_I3_PHASE_A_CROSS_FUNCTIONAL_SHOCK_CONTROL
          test "$(jq -r '.productSourceSha' "$CANDIDATE_DESCRIPTOR")" = "$HISTORICAL_PRODUCT_SOURCE"
          test "$(jq -r '.productTreeAuthority' "$CANDIDATE_DESCRIPTOR")" = "$HISTORICAL_PRODUCT_TREE"
          test "$(git rev-parse "$PINNED_SOURCE^{tree}")" = "$PINNED_TREE"
          test "$(git rev-parse "$PRIOR_DEV_SOURCE^{tree}")" = "$PRIOR_DEV_TREE"
          test "$(git rev-parse "$HISTORICAL_PRODUCT_SOURCE^{tree}")" = "$HISTORICAL_PRODUCT_TREE"
          git merge-base --is-ancestor "$PINNED_SOURCE" HEAD
          git merge-base --is-ancestor "$HISTORICAL_PRODUCT_SOURCE" "$HISTORICAL_CONTROL_SHA"
          git merge-base --is-ancestor "$HISTORICAL_CONTROL_SHA" "$PINNED_SOURCE"
          git merge-base --is-ancestor "$PRIOR_DEV_SOURCE" "$PINNED_SOURCE"
          git diff --quiet "$PINNED_SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'
          # Compare the historical candidate in its unmodified control HEAD;
          # prior DEV P0 fixes are separate evidence, never a retroactive GO.
          git worktree add --detach "$RUNNER_TEMP/i3-historical-control" "$HISTORICAL_CONTROL_SHA" >/dev/null
          (cd "$RUNNER_TEMP/i3-historical-control" && node tools/qa/cxorbia-i3-canonical-candidate-authority-guard.mjs > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/historical-canonical-guard.json")
          jq -e --arg s "$HISTORICAL_PRODUCT_SOURCE" --arg t "$HISTORICAL_PRODUCT_TREE" '.productSourceSha==$s and .productSourceTree==$t' "$EVIDENCE_DIR/historical-canonical-guard.json" >/dev/null
          git diff --name-only "$PRIOR_DEV_SOURCE" "$PINNED_SOURCE" -- app backend firebase.json .firebaserc firestore.rules storage.rules tools/hr-source > "$EVIDENCE_DIR/source-diff.txt"
          test "$(wc -l < "$EVIDENCE_DIR/source-diff.txt")" = 1
          grep -Fxq app/adapters/tya-protected-auth-hr-authority-bridge-v2.js "$EVIDENCE_DIR/source-diff.txt"
          node backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs > "$EVIDENCE_DIR/tests.log"
          grep -Fq 'pass 45' "$EVIDENCE_DIR/tests.log"
          node --test tools/qa/cxorbia-i3-p0-hn-shopper-country-source.test.mjs tools/qa/cxorbia-i3-a05-atomic-session-publication-source.test.mjs tools/qa/cxorbia-i3-vrm280-exact-shopper-session-fallback.test.mjs tools/qa/cxorbia-i3-work-uat-u22-shopper-controls.test.mjs > "$EVIDENCE_DIR/scope-tests.log"
          grep -Fq 'pass 24' "$EVIDENCE_DIR/scope-tests.log"
          node --check app/core/backend-browser-auth.js
          node --check app/adapters/tya-protected-auth-hr-authority-bridge-v2.js
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          grep -Fq 'COPY backend/runtime/cxorbia-shopper-command-provider-v1.mjs' backend/runtime/hr-live-service/Dockerfile
          mkdir -p "$RUNNER_TEMP/i3-country-source"
          git archive "$PINNED_SOURCE" | tar -x -C "$RUNNER_TEMP/i3-country-source"
          echo "EXACT_SOURCE_DIR=$RUNNER_TEMP/i3-country-source" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev
      - name: Fail-closed exact DEV baselines and production read-only
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$EVIDENCE_DIR/runtime-before.json"
          jq -e --arg rev "$EXPECTED_OLD_REVISION" '.status.latestReadyRevisionName==$rev and ([.status.traffic[]|select(.revisionName==$rev and .percent==100)]|length)==1' "$EVIDENCE_DIR/runtime-before.json" >/dev/null
          RUNTIME_URL="$(jq -r '.status.url // empty' "$EVIDENCE_DIR/runtime-before.json")"
          test -n "$RUNTIME_URL"
          curl -fsS --retry 4 --retry-delay 2 "$RUNTIME_URL/health" > "$EVIDENCE_DIR/health-before.json"
          jq -e '.ok==true and .production==false and .hrWrites==false' "$EVIDENCE_DIR/health-before.json" >/dev/null
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$EVIDENCE_DIR/hosting-before.json"
          test "$(jq -r '.release.version.name' "$EVIDENCE_DIR/hosting-before.json")" = "$EXPECTED_OLD_HOSTING_VERSION"
          curl -fsS -H 'Cache-Control: no-cache' "$HOSTING_URL/core/backend-browser-auth.js?i3country=pre-$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/auth-before.js"
          test "$(sha256sum "$EVIDENCE_DIR/auth-before.js" | awk '{print $1}')" = "$EXPECTED_OLD_AUTH_SHA256"
          curl -fsS -H 'Cache-Control: no-cache' "$HOSTING_URL/adapters/tya-protected-auth-hr-authority-bridge-v2.js?i3country=pre-$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/bridge-before.js"
          test "$(sha256sum "$EVIDENCE_DIR/bridge-before.js" | awk '{print $1}')" = "$EXPECTED_OLD_BRIDGE_SHA256"
          for f in index-backend-dev.html core/backend-firebase.js core/router.js modules/dashboard.js modules/shoppers.js modules/misvisitas.js modules/visitas.js modules/finanzas.js modules/postulaciones.js modules/documentos.js modules/cert.js adapters/tya-canonical-shopper-portal-v2.js; do
            curl -fsS -H 'Cache-Control: no-cache' "$HOSTING_URL/$f?i3country=pre-$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/probed-$(basename "$f")"
            cmp -s "$EXACT_SOURCE_DIR/app/$f" "$EVIDENCE_DIR/probed-$(basename "$f")"
          done
          curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_URL/" -o "$EVIDENCE_DIR/production-before.html"
          sha256sum "$EVIDENCE_DIR/production-before.html" | awk '{print $1}' > "$EVIDENCE_DIR/production-before.sha256"
          gcloud run revisions describe "$EXPECTED_OLD_REVISION" --project "$PROJECT" --region "$REGION" --format=json > "$EVIDENCE_DIR/runtime-revision-before.json"
          test -n "$(jq -r '.status.imageDigest // empty' "$EVIDENCE_DIR/runtime-revision-before.json")"
          echo "RUNTIME_URL=$RUNTIME_URL" >> "$GITHUB_ENV"
      - name: One DEV Hosting release from the same pinned source
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@14.12.0 >/dev/null 2>&1
          cd "$EXACT_SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$PROJECT" --non-interactive
      - name: Exact unchanged DEV runtime, Hosting bytes, and unchanged production
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$EVIDENCE_DIR/runtime-after.json"
          NEW_REV="$(jq -r '.status.latestReadyRevisionName // empty' "$EVIDENCE_DIR/runtime-after.json")"
          test "$NEW_REV" = "$EXPECTED_OLD_REVISION"
          jq -e --arg rev "$NEW_REV" '([.status.traffic[]|select(.revisionName==$rev and .percent==100)]|length)==1' "$EVIDENCE_DIR/runtime-after.json" >/dev/null
          gcloud run revisions describe "$NEW_REV" --project "$PROJECT" --region "$REGION" --format=json > "$EVIDENCE_DIR/runtime-revision.json"
          DIGEST="$(jq -r '.status.imageDigest // empty' "$EVIDENCE_DIR/runtime-revision.json")"
          [[ "$DIGEST" == sha256:* || "$DIGEST" == *@sha256:* ]]
          test "$DIGEST" = "$(jq -r '.status.imageDigest' "$EVIDENCE_DIR/runtime-revision-before.json")"
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE/channels/live" > "$EVIDENCE_DIR/hosting-after.json"
          BEFORE="$(jq -r '.release.version.name // empty' "$EVIDENCE_DIR/hosting-before.json")"
          AFTER="$(jq -r '.release.version.name // empty' "$EVIDENCE_DIR/hosting-after.json")"
          test -n "$AFTER"
          test "$AFTER" != "$BEFORE"
          curl -fsS -H 'Cache-Control: no-cache' "$HOSTING_URL/core/backend-browser-auth.js?i3country=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/served-auth.js"
          cmp -s "$EXACT_SOURCE_DIR/app/core/backend-browser-auth.js" "$EVIDENCE_DIR/served-auth.js"
          grep -Fq SHOPPER_COUNTRY_SCOPE_CONFLICT "$EVIDENCE_DIR/served-auth.js"
          curl -fsS -H 'Cache-Control: no-cache' "$HOSTING_URL/adapters/tya-protected-auth-hr-authority-bridge-v2.js?i3country=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/served-bridge.js"
          cmp -s "$EXACT_SOURCE_DIR/app/adapters/tya-protected-auth-hr-authority-bridge-v2.js" "$EVIDENCE_DIR/served-bridge.js"
          grep -Fq 'scopePaises:[shopperReady.country]' "$EVIDENCE_DIR/served-bridge.js"
          curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_URL/" -o "$EVIDENCE_DIR/production-after.html"
          sha256sum "$EVIDENCE_DIR/production-after.html" | awk '{print $1}' > "$EVIDENCE_DIR/production-after.sha256"
          cmp -s "$EVIDENCE_DIR/production-before.sha256" "$EVIDENCE_DIR/production-after.sha256"
          jq -n -S --arg source "$PINNED_SOURCE" --arg tree "$PINNED_TREE" --arg historical "$HISTORICAL_PRODUCT_SOURCE" --arg prior "$PRIOR_DEV_SOURCE" --arg runtime "$NEW_REV" --arg digest "$DIGEST" --arg hosting "$AFTER" '{decision:"PASS_I3_P0_HN_COUNTRY_SCOPE_HOSTING_DEV_ONLY",sourceSha:$source,sourceTree:$tree,historicalDescriptorProductSourceSha:$historical,priorDevSourceSha:$prior,runtimeRevision:$runtime,runtimeDigest:$digest,hostingVersion:$hosting,builds:0,runtimeDeploys:0,hostingDeploys:1,hrWrites:0,authWrites:0,productionDeploys:0,productionChanged:false,adminShopperE2e:"PENDING_INDEPENDENT_BROWSER",gate20:"HOLD",gate21:"HOLD"}' > "$EVIDENCE_DIR/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-p0-country-dev-${{ github.run_id }}
          path: .tmp/i3-p0-country-dev/
          if-no-files-found: warn
          retention-days: 30
