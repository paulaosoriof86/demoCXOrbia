name: CXOrbia I3 Approved F001 DEV Identity Canary Once
on:
  push:
    branches: [recovery/cxorbia-phase-a-20260831]
    paths:
      - .github/workflows/cxorbia-i3-approved-f001-canary-once.yml
      - firebase/auth-dev-tools/cxorbia-i3-approved-f001-canary-once.mjs
permissions:
  contents: read
concurrency:
  group: cxorbia-i3-approved-f001-dev-canary-once
  cancel-in-progress: false
jobs:
  f001-one-exact-provider-canary:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-APPROVED-F001-DEV-CANARY-ONCE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: cxorbia-backend-dev
      GOOGLE_CLOUD_PROJECT: cxorbia-backend-dev
      CX_F001_EXECUTION: PAULA_I3_2026_10_28_APPROVED_F001_DEV_CANARY_ONLY
      CX_F001_APPROVED_DIGEST: ac3e15184316d62aa53942359e857f2c34dec486a2ca41057e529a39f062d872
      CX_F001_CANARY_OUT: .tmp/cxorbia-i3-f001-canary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert frozen Phase A source authority, DEV scope and no LIVE
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = 'recovery/cxorbia-phase-a-20260831'
          test "${GITHUB_EVENT_NAME}" = push
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          SOURCE="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          TREE="$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$SOURCE" = '308c69e3756e3e80577856009901934ce5f52fba'
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          git diff --quiet "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules \
            ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check firebase/auth-dev-tools/cxorbia-i3-approved-f001-canary-once.mjs
      - name: Prove protected provider and project/period contract before any write
        run: |
          set -Eeuo pipefail
          node backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs
          node backend/runtime/hr-live-service/test/cxorbia-i3-project-period-contract.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Install scoped DEV QA dependencies
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          ./firebase/auth-dev-tools/node_modules/.bin/playwright install chromium
      - name: Execute one exact protected F001 adjudication with ACK and independent readback
        run: |
          set -Eeuo pipefail
          node firebase/auth-dev-tools/cxorbia-i3-approved-f001-canary-once.mjs
          jq -e '.decision=="PASS_F001_CANARY_PROVIDER_AND_SHOPPER_UI" and .production==false and
            .providerAck==true and .identityConsolidated==true and .readback==true and
            .shopperUiVerified==true and .hrWrites==0 and .directAuthWrites==0 and
            .directFirestoreWrites==0 and .deployments==0' "$CX_F001_CANARY_OUT/result.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-f001-exact-dev-canary-${{ github.run_id }}
          path: .tmp/cxorbia-i3-f001-canary/result.json
          if-no-files-found: warn
          retention-days: 30
