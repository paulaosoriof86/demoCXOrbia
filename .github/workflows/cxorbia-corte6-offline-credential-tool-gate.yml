name: CXOrbia Corte 6 Offline Credential Tool Gate

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'tools/local/cxorbia-legacy-credential-inventory.html'
      - 'tools/qa/cxorbia-corte6-offline-credential-tool-gate.mjs'
      - '.github/workflows/cxorbia-corte6-offline-credential-tool-gate.yml'

permissions:
  contents: read
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static offline safety gate
        id: gate
        run: |
          set -euo pipefail
          node --check tools/qa/cxorbia-corte6-offline-credential-tool-gate.mjs
          node tools/qa/cxorbia-corte6-offline-credential-tool-gate.mjs
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success
          DESC='PASS_C6_OFFLINE_CREDENTIAL_TOOL'
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC='FAIL_C6_OFFLINE_CREDENTIAL_TOOL'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-offline-credential-tool/${DESC}" -f description="$DESC" >/dev/null
