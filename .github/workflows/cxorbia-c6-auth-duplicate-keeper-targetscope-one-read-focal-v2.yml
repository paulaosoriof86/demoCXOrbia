name: CXOrbia C6 Auth Duplicate Keeper Target-Scope One Read Focal V2

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'backend/config/c6-auth-duplicate-keeper-targetscope-one-read-request-v2.json'

permissions:
  contents: read
  statuses: write

env:
  REQUEST: backend/config/c6-auth-duplicate-keeper-targetscope-one-read-request-v2.json
  TOOL: tools/qa/cxorbia-c6-auth-duplicate-keeper-targetscope-adjudication-readonly-v1.mjs
  REPORT: .tmp/c6-auth-duplicate-keeper-targetscope-v2/report-source-safe.json

jobs:
  one-read-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate one-shot request and source binding
        id: req
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const expectedGroups={
            '1acdcb3782b7cf351056':['6dee7f31c738218ce63a','b561d9c46660715e214f'],
            '2c4d19f2b066835473d3':['aa5cbada6c5388ee1d8b','f8405e17df357c121ccc'],
            '54225792eeb65f6739c0':['ce178298b2df136541d4','19937aedc77af3404bdc'],
            'ae2f920fe6d9ce1fdd82':['ca9e2f644334833ab572','360af509dcdcd1880f04'],
            'fd891812eca020d27ee3':['e1773a24c98d6bbe26c3','50d360f17c1fbdd69770']
          };
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          if(r.schemaVersion!=='cxorbia.c6.auth-duplicate-keeper-targetscope-one-read.request.v2') throw new Error('REQUEST_SCHEMA');
          if(r.enabled!==true||r.consumed!==false||r.allowedExecutions!==1) throw new Error('REQUEST_NOT_EXECUTABLE_ONCE');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.pullRequest!==7) throw new Error('REQUEST_TARGET');
          if(r.targetProjectId!=='cxorbia-backend-dev'||r.tenantId!=='tya'||r.projectId!=='cinepolis') throw new Error('REQUEST_PROVIDER_TARGET');
          if(r.authUsers!==228||r.planDigest!=='c0c31fadb88928f5fc0b8a19248188c8610e13362608f1bae3e267034f893ba4') throw new Error('REQUEST_BASELINE');
          if(r.sourceGateCommit!=='72478e582dd917f287f16d6447b3b5f14b8ad26f'||r.sourceGateRunId!==31441607796||r.sourceGateDecision!=='PASS_C6_AUTH_DUPLICATE_KEEPER_TARGET_SCOPE_SOURCE_ROOTFIX_ZERO_WRITES_ONE_READ_NO_PII') throw new Error('REQUEST_SOURCE_GATE');
          if(r.sourceHeadSha!==process.env.GITHUB_EVENT_BEFORE) throw new Error('REQUEST_PARENT_HEAD_DRIFT');
          if(!same(r.frozenGroups,expectedGroups)) throw new Error('REQUEST_FROZEN_GROUPS_DRIFT');
          if(r.maxProviderReads!==1||r.allowSecondProviderRead!==false) throw new Error('REQUEST_READ_CAP');
          const zero=['authWrites','iamWrites','firestoreReads','firestoreWrites','hrReads','hrWrites','rulesWrites','storageWrites','make','gemini','payments','deploys'];
          for(const k of zero){if(r[k]!==0)throw new Error('REQUEST_ZERO_'+k);}
          if(r.prewrite!==false||r.activation!==false||r.newSmoke!==false||r.merge!==false||r.production!==false||r.reconstructUniverse340!==false) throw new Error('REQUEST_FORBIDDEN_MODE');
          console.log('execute=true');
          console.log('request_id='+r.requestId);
          NODE
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Verify tool syntax before provider
        run: |
          set -euo pipefail
          node --check "$TOOL"
          node "$TOOL" --source-self-test | grep -q 'PASS_C6_AUTH_DUPLICATE_KEEPER_TARGET_SCOPE_SOURCE_SELFTEST'

      - name: Load ephemeral DEV credential
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-duplicate-keeper-targetscope-v2/private
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null; try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key)) throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-duplicate-keeper-targetscope-v2/private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-duplicate-keeper-targetscope-v2/private/credentials.json" >> "$GITHUB_ENV"

      - name: Install transient provider tooling
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Execute exactly one provider list read and focal adjudication
        id: adjudicate
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT")"
          set +e
          node "$TOOL" > "$REPORT"
          RC=$?
          set -e
          echo "tool_rc=$RC" >> "$GITHUB_OUTPUT"
          test -s "$REPORT"

      - name: Verify source-safe terminal report
        id: verify
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(r?.frozenUniverse?.groupCount===5&&r?.frozenUniverse?.candidateCount===10,'REPORT_FROZEN_UNIVERSE');
          ok(r?.provider?.reads===1&&r?.safety?.providerReads===1,'REPORT_PROVIDER_READ_COUNT');
          ok(r?.provider?.writes===0&&r?.safety?.providerWrites===0,'REPORT_PROVIDER_WRITES');
          for(const k of ['authWrites','iamWrites','firestoreReads','firestoreWrites','hrReads','hrWrites','rulesWrites','storageWrites','make','gemini','payments','deploys']) ok(r?.safety?.[k]===0,`REPORT_ZERO_${k}`);
          for(const k of ['prewrite','activation','newSmoke','reconstructUniverse340','merge','production','rawUidExported','rawEmailExported','rawShopperIdExported','rawNameExported','rawClaimsExported','rawCredentialExported','creationTimeUsed','lastSignInTimeUsed','resultOrderUsed']) ok(r?.safety?.[k]===false,`REPORT_FALSE_${k}`);
          const terminal=['PASS_C6_AUTH_DUPLICATE_KEEPER_TARGET_SCOPE_ADJUDICATION','STOP_RETRY_C6_AUTH_DUPLICATE_KEEPER_TARGET_SCOPE_ADJUDICATION'];
          ok(terminal.includes(r.decision),'REPORT_TERMINAL_DECISION');
          console.log('decision='+r.decision);
          console.log('resolved_access_groups='+String(r?.summary?.resolvedAccessGroups??-1));
          console.log('ambiguous_access_groups='+String(r?.summary?.ambiguousAccessGroups??-1));
          console.log('blocked_policy_closed='+String(r?.summary?.blockedPolicyClosed??-1));
          console.log('error_code='+(r?.error?.code||'NONE'));
          console.log('error_fingerprint='+(r?.error?.fingerprint||'NONE'));
          NODE

      - name: Upload source-safe terminal artifact
        if: always() && hashFiles('.tmp/c6-auth-duplicate-keeper-targetscope-v2/report-source-safe.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-duplicate-keeper-targetscope-v2-${{ github.run_id }}
          path: .tmp/c6-auth-duplicate-keeper-targetscope-v2/report-source-safe.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.verify.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=error
          DESC='STOP_RETRY C6 duplicate keeper focal read'
          if [ "$DECISION" = 'PASS_C6_AUTH_DUPLICATE_KEEPER_TARGET_SCOPE_ADJUDICATION' ]; then STATE=success; DESC='PASS C6 duplicate keeper focal read'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='cxorbia/c6-auth-duplicate-keeper-targetscope-one-read-v2' \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Destroy ephemeral credential
        if: always()
        run: rm -rf .tmp/c6-auth-duplicate-keeper-targetscope-v2/private
