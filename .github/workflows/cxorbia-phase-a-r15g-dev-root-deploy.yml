name: CXOrbia Existing Hosting DEV Corte 6 Visual

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/phase-a-hosting-dev-execution-request-v1.json'
      - 'tools/release/cxorbia-existing-hosting-dev-corte6-prepare.mjs'
      - 'tools/qa/cxorbia-corte6-hosting-iam-diagnostic.mjs'
      - '.github/workflows/cxorbia-phase-a-r15g-dev-root-deploy.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-existing-hosting-dev-corte6
  cancel-in-progress: false

jobs:
  hosting-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read reserved one-shot Hosting authorization
        id: req
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const r=require('./backend/config/phase-a-hosting-dev-execution-request-v1.json');
          if(r.schemaVersion!=='cxorbia.c5-existing-hosting-dev-visual.v1') throw new Error('bad_schema');
          if(r.requestId!=='c5-existing-hosting-dev-visual-20260730-01'||r.authorizedBy!=='Paula'||r.authorizationSource!=='current_conversation_2026-07-30') throw new Error('bad_authorization_identity');
          if(r.targetProject!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.existingHostingRootUrl!=='https://cxorbia-backend-dev.web.app') throw new Error('bad_target');
          if(r.singleHostingDeployMax!==1||r.createFirebaseProject!==false||r.createHostingSite!==false||r.firestoreWrites!==0||r.authWrites!==0||r.storageWrites!==0||r.hrWrites!==0||r.legacyWrites!==0||r.paymentsWrites!==0||r.functionsDeploy!==false||r.rulesDeploy!==false||r.merge!==false||r.production!==false) throw new Error('unsafe_scope');
          const execute=r.enabled===true&&r.consumed===false&&r.hostingDeployExecutions===0&&r.status==='ready_after_corte6_auth_rbac_pass';
          const diagnose=r.enabled===false&&r.consumed===false&&r.hostingDeployExecutions===0&&r.status==='diagnostic_hold_after_hosting_deploy_failure';
          console.log('execute='+(execute?'true':'false'));
          console.log('diagnose='+(diagnose?'true':'false'));
          console.log('request_id='+r.requestId);
          NODE

      - name: Load canonical DEV credential
        id: credential
        if: steps.req.outputs.execute == 'true' || steps.req.outputs.diagnose == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte6-hosting-private
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null; try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id&&p.client_email&&p.private_key)) throw new Error('credential_invalid');
          if(p.project_id!=='cxorbia-backend-dev') throw new Error('wrong_service_account_project:'+p.project_id);
          fs.writeFileSync('.tmp/corte6-hosting-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/corte6-hosting-private/credentials.json" >> "$GITHUB_ENV"

      - name: Install transient Firebase Admin
        id: admin_tooling
        if: steps.req.outputs.execute == 'true' || steps.req.outputs.diagnose == 'true'
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Diagnose Hosting IAM and CLI prerequisites read-only
        id: hostingdiag
        if: steps.req.outputs.diagnose == 'true'
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_EXPECTED_SITE: cxorbia-backend-dev
          CXORBIA_HOSTING_IAM_REPORT: app/docs/evidence/CORTE6-HOSTING-IAM-DIAGNOSTIC-LATEST.json
        run: |
          set -euo pipefail
          node --check tools/qa/cxorbia-corte6-hosting-iam-diagnostic.mjs
          node tools/qa/cxorbia-corte6-hosting-iam-diagnostic.mjs
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const r=require('./app/docs/evidence/CORTE6-HOSTING-IAM-DIAGNOSTIC-LATEST.json');
          const p=r.iam?.permissions||{};
          const x=r.providerReads||{};
          const bit=k=>p[k]===true?'1':'0';
          const code=[
            'HG'+bit('firebasehosting.sites.get'),
            'HL'+bit('firebasehosting.sites.list'),
            'HU'+bit('firebasehosting.sites.update'),
            'AKL'+bit('apikeys.keys.list'),
            'AKG'+bit('apikeys.keys.get'),
            'AKS'+bit('apikeys.keys.getKeyString'),
            'SU'+bit('serviceusage.services.use'),
            'SITE'+String(x.hostingSite?.status||0),
            'REL'+String(x.releasesList?.status||0),
            'VER'+String(x.versionsList?.status||0),
            'KEY'+String(x.apiKeysList?.status||0)
          ].join('_');
          console.log('code='+code);
          console.log('diagnosis='+String(r.diagnosis||'UNKNOWN'));
          NODE

      - name: Install transient Firebase CLI
        id: cli_tooling
        if: steps.req.outputs.execute == 'true'
        run: npm install --no-save --ignore-scripts firebase-tools@14.11.2 >/dev/null 2>&1

      - name: Build and preflight exact existing Hosting DEV site
        id: prepare
        if: steps.req.outputs.execute == 'true'
        env:
          CXORBIA_HOSTING_REQUEST: backend/config/phase-a-hosting-dev-execution-request-v1.json
          CXORBIA_HOSTING_OUT_DIR: .tmp/corte6-existing-hosting-dev
        run: |
          set -euo pipefail
          node --check tools/release/cxorbia-existing-hosting-dev-corte6-prepare.mjs
          node tools/release/cxorbia-existing-hosting-dev-corte6-prepare.mjs

      - name: Deploy one time to existing Hosting DEV only
        id: deploy
        if: steps.req.outputs.execute == 'true'
        run: |
          set -euo pipefail
          npx firebase-tools deploy \
            --only hosting:cxorbia-dev \
            --config .tmp/corte6-existing-hosting-dev/firebase.hosting.json \
            --project cxorbia-backend-dev \
            --non-interactive

      - name: Verify remote propagation and protected entrypoint
        id: remote
        if: steps.req.outputs.execute == 'true'
        run: |
          set -euo pipefail
          OUT=.tmp/corte6-existing-hosting-dev
          ROOT='https://cxorbia-backend-dev.web.app'
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$ROOT/corte6-hosting-proof.json?attempt=$attempt&ts=$(date +%s)" > "$OUT/remote-proof.json"; then
              if node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.tmp/corte6-existing-hosting-dev/remote-proof.json','utf8'));
          if(p.schemaVersion!=='cxorbia.corte6-existing-hosting-proof.v1'||p.firebaseProjectId!=='cxorbia-backend-dev'||p.hostingTarget!=='cxorbia-dev'||p.entrypoint!=='index-backend-dev.html'||p.authMode!=='firebase-email-password-interactive-session'||p.readOnly!==true||p.production!==false||p.credentialsEmbedded!==false) process.exit(1);
          NODE
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          curl -fsSL -H 'Cache-Control: no-cache' "$ROOT/core/backend-config.js?ts=$(date +%s)" > "$OUT/remote-backend-config.js"
          curl -fsSL -H 'Cache-Control: no-cache' "$ROOT/core/backend-browser-auth.js?ts=$(date +%s)" > "$OUT/remote-backend-browser-auth.js"
          curl -fsSL -H 'Cache-Control: no-cache' "$ROOT/?cxBackendPreview=YES_PAULA_20260628_PREVIEW_DEV&cxProjectId=cinepolis&ts=$(date +%s)" > "$OUT/remote-entrypoint.html"
          node <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('.tmp/corte6-existing-hosting-dev/remote-backend-config.js','utf8');
          const auth=fs.readFileSync('.tmp/corte6-existing-hosting-dev/remote-backend-browser-auth.js','utf8');
          const html=fs.readFileSync('.tmp/corte6-existing-hosting-dev/remote-entrypoint.html','utf8');
          if(!cfg.includes('projectId: "cxorbia-backend-dev"')||cfg.includes('apiKey: null')||!cfg.includes("defaultProjectId: 'cinepolis'")) throw new Error('remote_backend_config_mismatch');
          if(!auth.includes('signInWithEmailAndPassword')||!auth.includes('Auth.Persistence.SESSION')) throw new Error('remote_interactive_auth_missing');
          if(!html.includes('CXOrbia · Preview Backend DEV')||!html.includes('core/backend-browser-auth.js')) throw new Error('remote_entrypoint_mismatch');
          const proof=JSON.parse(fs.readFileSync('.tmp/corte6-existing-hosting-dev/remote-proof.json','utf8'));
          const report={schemaVersion:'cxorbia.corte6-existing-hosting-dev-deploy.v1',generatedAt:new Date().toISOString(),decision:'PASS_EXISTING_HOSTING_DEV_DEPLOY_REMOTE_STATIC_AUTH_GATE_READY',projectId:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',hostingSite:'cxorbia-backend-dev',rootUrl:'https://cxorbia-backend-dev.web.app',entrypoint:'index-backend-dev.html',sourceCommit:proof.sourceCommit,hostingDeployExecutions:1,remoteProofVerified:true,canonicalBackendConfigVerified:true,interactiveFirebaseAuthGateVerified:true,humanCredentialLoginStillRequired:true,firestoreDataWrites:0,authWrites:0,storageWrites:0,rulesDeploys:0,hrWrites:0,legacyWrites:0,payments:0,merge:false,production:false,piiExported:false,secretsExported:false};
          fs.writeFileSync('.tmp/corte6-existing-hosting-dev/deploy-result.source-safe.json',JSON.stringify(report,null,2)+'\n','utf8');
          NODE

      - name: Freeze one-shot Hosting authorization and commit sanitized evidence
        id: freeze
        if: steps.req.outputs.execute == 'true'
        run: |
          set -euo pipefail
          cp .tmp/corte6-existing-hosting-dev/preflight.source-safe.json /tmp/c6-hosting-preflight.json
          cp .tmp/corte6-existing-hosting-dev/deploy-result.source-safe.json /tmp/c6-hosting-result.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/c6-hosting-preflight.json app/docs/evidence/CORTE6-HOSTING-DEV-PREFLIGHT-LATEST.json
          cp /tmp/c6-hosting-result.json app/docs/evidence/CORTE6-HOSTING-DEV-DEPLOY-LATEST.json
          node <<'NODE'
          const fs=require('fs');
          const p='backend/config/phase-a-hosting-dev-execution-request-v1.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.status='deployed_waiting_human_auth_visual';
          r.enabled=false;
          r.consumed=true;
          r.hostingDeployExecutions=1;
          r.consumedAt=new Date().toISOString();
          r.preflight=Object.assign({},r.preflight,{deployAllowedNow:false,reason:'Corte 6 Auth/RBAC passed and the single existing Hosting DEV redeploy was consumed successfully. Human authenticated visual validation is now the remaining gate.'});
          r.nextGate='HUMAN_AUTHENTICATED_VISUAL_VALIDATION_ADMIN_OPS_CLIENT_SHOPPER__THEN_FREEZE_AND_AUGUST_DELTA';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/config/phase-a-hosting-dev-execution-request-v1.json app/docs/evidence/CORTE6-HOSTING-DEV-PREFLIGHT-LATEST.json app/docs/evidence/CORTE6-HOSTING-DEV-DEPLOY-LATEST.json
          git commit -m 'evidence: consume existing Hosting DEV redeploy after Corte 6'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish Hosting DEV status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success
          DESC='PASS_HOSTING_REQUEST_INACTIVE'
          if [ '${{ steps.req.outputs.execute }}' = 'true' ]; then DESC='PASS_C6_EXISTING_HOSTING_DEV_DEPLOYED';
          elif [ '${{ steps.req.outputs.diagnose }}' = 'true' ] && [ '${{ steps.hostingdiag.outcome }}' = 'success' ]; then DESC='DIAG_C6_HOSTING_${{ steps.hostingdiag.outputs.code }}'; fi
          if [ '${{ job.status }}' != 'success' ]; then
            STATE=error
            DESC='FAIL_C6_HOSTING_UNKNOWN'
            if [ '${{ steps.req.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_REQUEST';
            elif [ '${{ steps.credential.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_CREDENTIAL';
            elif [ '${{ steps.admin_tooling.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_ADMIN_TOOLING';
            elif [ '${{ steps.hostingdiag.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_IAM_DIAG';
            elif [ '${{ steps.cli_tooling.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_CLI_TOOLING';
            elif [ '${{ steps.prepare.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_PREFLIGHT';
            elif [ '${{ steps.deploy.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_DEPLOY';
            elif [ '${{ steps.remote.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_REMOTE';
            elif [ '${{ steps.freeze.outcome }}' = 'failure' ]; then DESC='FAIL_C6_HOSTING_FREEZE'; fi
          fi
          CONTEXT="cxorbia/existing-hosting-dev/${DESC}"
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="$CONTEXT" -f description="$DESC" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/corte6-hosting-private
