name: CXOrbia I3.11C R3-C Hosting DEV

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-i3-11c-r3c-hosting-materialization
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/i3-11-identity-link-runtime-bridge-rules-hosting-dev.json
  OUT_DIR: .tmp/i3-11c-r3c-hosting-materialization
  PRIVATE_DIR: .tmp/i3-11c-r3c-private
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CLAIM_CONTEXT: cxorbia/i3-11c-r3c-hosting/claim
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app

jobs:
  r3c-hosting:
    name: Materialize corrected identity runtime in DEV Hosting once
    if: >-
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'docs-tya-v6-v71-audit' &&
      github.event.pull_request.base.ref == 'release/cxorbia-tya-rc-20260630'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exclude ephemeral evidence
        run: printf '%s\n' '.tmp/' 'node_modules/' 'package-lock.json' 'gha-creds-*.json' >> .git/info/exclude

      - name: Determine exact R3-C request-only event
        id: request
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const requestOnly=changed.length===1&&changed[0]===process.env.REQUEST_FILE;
          const executable=x.enabled===true&&x.consumed===false&&x.status==='authorized_execute_once'&&x.transportNonce==='registered-skip13-pr-request-only-03'&&head===process.env.HEAD_SHA&&requestOnly;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`executable=${executable?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`source_head=${x.sourceHeadSha||''}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`prior_commits=${Array.isArray(x.priorTransportCommits)?x.priorTransportCommits.join(','):''}\n`);
          console.log(JSON.stringify({head,requestOnly,executable,changedCount:changed.length}));
          NODE

      - name: Record non-execution event safely
        if: steps.request.outputs.executable != 'true'
        run: echo 'Not the exact R3-C request-only event; zero Hosting deploys and zero provider data operations.'

      - name: Validate exact R3-C authorization and safety
        if: steps.request.outputs.executable == 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(x.schemaVersion!=='cxorbia.i3.11c.r3c.hosting-materialization.request.v1')throw new Error('request_schema_invalid');
          if(x.gateId!=='I3_11C_DEV_HOSTING_MATERIALIZE_CORRECTED_IDENTITY_RUNTIME_NO_PROVIDER_DATA_WRITES')throw new Error('gate_id_invalid');
          if(x.repository!=='paulaosoriof86/demoCXOrbia'||x.branch!=='docs-tya-v6-v71-audit'||Number(x.pullRequest)!==7)throw new Error('repository_lane_invalid');
          if(x.firebaseProjectId!=='cxorbia-backend-dev'||x.hostingSite!=='cxorbia-backend-dev'||x.hostingTarget!=='cxorbia-dev'||x.devRootUrl!=='https://cxorbia-backend-dev.web.app')throw new Error('provider_target_invalid');
          if(x.enabled!==true||x.consumed!==false||x.status!=='authorized_execute_once'||x.authorizedBy!=='Paula'||x.noAutomaticRetry!==true)throw new Error('authorization_state_invalid');
          if(Number(x.allowedExecutions)!==1||Number(x.maxHostingDeploys)!==1)throw new Error('single_execution_contract_invalid');
          if(!/^[a-f0-9]{40}$/.test(String(x.sourceHeadSha||'')))throw new Error('source_head_invalid');
          execFileSync('git',['merge-base','--is-ancestor',x.sourceHeadSha,head]);
          const appDelta=execFileSync('git',['diff','--name-only',x.sourceHeadSha,head,'--','app/'],{encoding:'utf8'}).trim();
          if(appDelta)throw new Error('app_drift_after_authorized_source:'+appDelta.replace(/\s+/g,','));
          for(const k of ['providerIdentityWrites','firestoreDataWrites','authWrites','rulesDeploys','hrWrites','storageWrites','makeCalls','geminiCalls','paymentWrites','historicalShopperAccess','cloudRunDeploys','staffRuntimeExecutions'])if(Number(x[k]||0)!==0)throw new Error('unsafe_scope_'+k);
          if(x.merge!==false||x.production!==false||x.automaticStaffRuntimeRetry!==false)throw new Error('unsafe_scope_boolean');
          NODE

      - name: Claim one logical execution across all prior transports
        if: steps.request.outputs.executable == 'true'
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra prior <<< '${{ steps.request.outputs.prior_commits }}'
          for c in "${prior[@]}"; do
            [ -z "$c" ] && continue
            n=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${c}/statuses" --paginate --jq "[.[] | select(.context==\"${CLAIM_CONTEXT}\")] | length")
            if [ "$n" != '0' ]; then
              echo 'claimed=false' >> "$GITHUB_OUTPUT"
              echo "Prior R3-C claim exists at $c; duplicate Hosting deploy blocked."
              exit 0
            fi
          done
          n=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses" --paginate --jq "[.[] | select(.context==\"${CLAIM_CONTEXT}\")] | length")
          if [ "$n" != '0' ]; then echo 'claimed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state='pending' -f context="$CLAIM_CONTEXT" -f description='CLAIMED_ONE_LOGICAL_R3C_HOSTING_EXECUTION' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Prepare existing DEV service account privately
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p "$PRIVATE_DIR" "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=${RUNNER_TEMP}/cxorbia-i3-11c-r3c-source" >> "$GITHUB_ENV"

      - name: Install transient Firebase CLI
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest >/dev/null 2>&1

      - name: Prepare exact authorized source and prove corrected contract
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR"
          git worktree add --detach "$SOURCE_DIR" '${{ steps.request.outputs.source_head }}'
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = '${{ steps.request.outputs.source_head }}'
          cd "$SOURCE_DIR"
          node --check app/adapters/cxorbia-provider-identity-link-runtime-v1.js
          node tools/qa/cxorbia-provider-identity-runtime-contract-parity-gate.mjs > "$GITHUB_WORKSPACE/$OUT_DIR/source-parity.json"
          node -e "const p=require(process.env.GITHUB_WORKSPACE+'/'+process.env.OUT_DIR+'/source-parity.json');if(p.decision!=='PASS_PROVIDER_IDENTITY_RUNTIME_CANONICAL_CONTRACT_PARITY'||p.targetMaterializedApplicable!==true||p.exactTechnicalOnly!==true||p.fuzzyMatching!==false||Number(p.providerWrites)!==0)process.exit(1)"
          sha256sum app/adapters/cxorbia-provider-identity-link-runtime-v1.js | awk '{print $1}' > "$GITHUB_WORKSPACE/$OUT_DIR/local-adapter-sha256.txt"

      - name: Deploy exact authorized source to Firebase Hosting DEV once
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        id: deploy
        continue-on-error: true
        run: |
          set +e
          cd "$SOURCE_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only hosting:cxorbia-dev --project cxorbia-backend-dev --non-interactive
          code=$?
          if [ "$code" = '0' ]; then echo 1 > "$GITHUB_WORKSPACE/$OUT_DIR/hosting-deploy-count.txt"; else echo 0 > "$GITHUB_WORKSPACE/$OUT_DIR/hosting-deploy-count.txt"; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify served adapter exact byte and SHA256 parity
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true' && steps.deploy.outputs.exit_code == '0'
        id: parity
        continue-on-error: true
        run: |
          set +e
          local_asset="$SOURCE_DIR/app/adapters/cxorbia-provider-identity-link-runtime-v1.js"
          remote_asset="$OUT_DIR/remote-provider-identity-link-runtime-v1.js"
          ok=0
          for attempt in $(seq 1 40); do
            rm -f "$remote_asset"
            if curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$DEV_ROOT_URL/adapters/cxorbia-provider-identity-link-runtime-v1.js?cxorbia_r3c=${GITHUB_RUN_ID}-${attempt}" -o "$remote_asset" && cmp "$local_asset" "$remote_asset"; then ok=1; break; fi
            sleep 3
          done
          code=1
          if [ "$ok" = '1' ]; then
            sha256sum "$remote_asset" | awk '{print $1}' > "$OUT_DIR/remote-adapter-sha256.txt"
            if [ "$(cat "$OUT_DIR/local-adapter-sha256.txt")" = "$(cat "$OUT_DIR/remote-adapter-sha256.txt")" ] && grep -q 'materialized' "$remote_asset" && grep -q 'tenant_adjudication' "$remote_asset" && grep -q 'fuzzyMatching:false' "$remote_asset"; then code=0; fi
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized R3-C evidence
        if: always() && steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        id: result
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const read=p=>fs.existsSync(p)?fs.readFileSync(p,'utf8').trim():null;
          const parity=fs.existsSync(process.env.OUT_DIR+'/source-parity.json')?JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/source-parity.json','utf8')):null;
          const deploys=Number(read(process.env.OUT_DIR+'/hosting-deploy-count.txt')||0),localSha=read(process.env.OUT_DIR+'/local-adapter-sha256.txt'),remoteSha=read(process.env.OUT_DIR+'/remote-adapter-sha256.txt');
          const pass=deploys===1&&parity?.decision==='PASS_PROVIDER_IDENTITY_RUNTIME_CANONICAL_CONTRACT_PARITY'&&localSha&&remoteSha&&localSha===remoteSha;
          const out={schemaVersion:'cxorbia.i3.11c.r3c.hosting-materialization.evidence.v1',generatedAt:new Date().toISOString(),decision:pass?'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY':'HOLD_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION',workflowRunId:Number(process.env.GITHUB_RUN_ID),requestCommitSha:process.env.HEAD_SHA,sourceHeadSha:process.env.SOURCE_HEAD||null,hostingDeploys:deploys,sourceParity:parity?.decision||null,localAdapterSha256:localSha,remoteAdapterSha256:remoteSha,remoteExactByteParity:!!(localSha&&remoteSha&&localSha===remoteSha),safety:{providerIdentityWrites:0,firestoreDataWrites:0,authWrites:0,rulesDeploys:0,hrWrites:0,storageWrites:0,makeCalls:0,geminiCalls:0,paymentWrites:0,historicalShopperAccess:0,cloudRunDeploys:0,staffRuntimeExecutions:0,passwordChanges:0,passwordResets:0,userCreates:0,userUpdates:0,merge:false,production:false},nextGate:pass?'NEW_AUTH_REQUIRED_I3_11C_STAFF_RUNTIME_CANONICAL_IDENTITY_CLOSE_READONLY_AFTER_HOSTING':'STOP_NO_AUTOMATIC_RETRY'};
          fs.writeFileSync(process.env.OUT_DIR+'/result.json',JSON.stringify(out,null,2)+'\n','utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`decision=${out.decision}\n`);
          NODE
        env:
          SOURCE_HEAD: ${{ steps.request.outputs.source_head }}

      - name: Upload sanitized R3-C evidence
        if: always() && steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: i3-11c-r3c-hosting-materialization-${{ github.run_id }}
          path: .tmp/i3-11c-r3c-hosting-materialization
          if-no-files-found: error
          retention-days: 14

      - name: Publish R3-C overall and finalize one-shot claim
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.result.outputs.decision }}
        run: |
          set -euo pipefail
          if [ '${{ steps.request.outputs.executable }}' != 'true' ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state='success' -f context='cxorbia/i3-11c-r3c-hosting/overall' -f description='SKIPPED_NON_REQUEST_EVENT' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
            exit 0
          fi
          if [ '${{ steps.claim.outputs.claimed }}' != 'true' ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state='success' -f context='cxorbia/i3-11c-r3c-hosting/overall' -f description='SKIPPED_DUPLICATE_EXECUTION_PREVENTED' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
            exit 0
          fi
          state=failure
          [ "${DECISION:-}" = 'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY' ] && state=success
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context='cxorbia/i3-11c-r3c-hosting/overall' -f description="$(printf '%s' "${DECISION:-HOLD_NO_DECISION}" | cut -c1-140)" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context="$CLAIM_CONTEXT" -f description="$(printf '%s' "${DECISION:-HOLD_NO_DECISION}" | cut -c1-140)" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup private material
        if: always()
        run: |
          git worktree remove --force "${SOURCE_DIR:-$RUNNER_TEMP/cxorbia-i3-11c-r3c-source}" 2>/dev/null || true
          rm -rf "$PRIVATE_DIR" node_modules package-lock.json .firebase
          rm -f firebase-debug.log

      - name: Enforce exact R3-C result
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: test '${{ steps.result.outputs.decision }}' = 'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY'
