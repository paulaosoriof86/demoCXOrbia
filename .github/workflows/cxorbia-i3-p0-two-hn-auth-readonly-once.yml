name: CXOrbia I3 P0 Two HN Auth Read-only One-Shot
on:
  push:
    branches: [recovery/cxorbia-phase-a-20260831]
    paths:
      - .github/workflows/cxorbia-i3-p0-two-hn-auth-readonly-once.yml
      - firebase/auth-dev-tools/cxorbia-i3-p0-hn-two-shopper-auth-readonly.mjs
      - firebase/auth-dev-tools/cxorbia-i3-p0-shopper-identity-cohort-readonly.mjs
permissions:
  contents: read
concurrency:
  group: cxorbia-i3-p0-hn-auth-readonly-once
  cancel-in-progress: false
jobs:
  auth-firestore-hr-targeted-readonly:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-HN-TWO-AUTH-READONLY-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact DEV-only and no-source-drift guards
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          git merge-base --is-ancestor db56b89a1221d26f5cc4466585cda7eaa7360ddd HEAD
          git diff --quiet db56b89a1221d26f5cc4466585cda7eaa7360ddd HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules
          node --check firebase/auth-dev-tools/cxorbia-i3-p0-hn-two-shopper-auth-readonly.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Read only two exact DEV authentication principals and current HR
        env:
          CX_DIAG_OUT: .tmp/i3-p0-hn-two-shopper
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node firebase/auth-dev-tools/cxorbia-i3-p0-hn-two-shopper-auth-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-p0-hn-auth-readonly-${{ github.run_id }}
          path: .tmp/i3-p0-hn-two-shopper/
          if-no-files-found: warn
          retention-days: 30

  all-active-shoppers-hr-identity-readonly:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-SHOPPER-IDENTITY-COHORT-READONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: cxorbia-backend-dev
      GOOGLE_CLOUD_PROJECT: cxorbia-backend-dev
      CX_SHOPPER_COHORT_EXECUTION: PAULA_APPROVED_2026-10-28_GENERAL_SHOPPER_IDENTITY_DIAG_READONLY
      CX_SHOPPER_COHORT_OUT: .tmp/i3-shopper-identity-cohort
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: DEV-only frozen-source no-write guard
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = 'recovery/cxorbia-phase-a-20260831'
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          SOURCE="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          TREE="$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$SOURCE" = '308c69e3756e3e80577856009901934ce5f52fba'
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          git diff --quiet "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules \
            ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check firebase/auth-dev-tools/cxorbia-i3-p0-shopper-identity-cohort-readonly.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Read whole active shopper cohort, claims, HR source and exact crosswalks
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node firebase/auth-dev-tools/cxorbia-i3-p0-shopper-identity-cohort-readonly.mjs
          jq -e '.decision=="PASS_DEV_SHOPPER_IDENTITY_COHORT_READONLY" and .production==false and .authWrites==0 and .firestoreWrites==0 and .hrWrites==0 and .merges==0' "$CX_SHOPPER_COHORT_OUT/result.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-p0-shopper-identity-cohort-${{ github.run_id }}
          path: .tmp/i3-shopper-identity-cohort/
          if-no-files-found: warn
          retention-days: 30

  i3-p0-general-shopper-source-qa:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-GENERAL-SHOPPER-SOURCE-QA-ONCE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact G03 source authority and no DEV writes
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = 'recovery/cxorbia-phase-a-20260831'
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          SOURCE="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          TREE="$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$SOURCE" = '308c69e3756e3e80577856009901934ce5f52fba'
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          git diff --quiet "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules \
            ':(exclude)backend/runtime/hr-live-service/test/**'
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs
          node --check backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs
      - name: Focused protected identity provider and shopper regressions
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp/i3-general-shopper-source-qa
          node backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs \
            | tee .tmp/i3-general-shopper-source-qa/provider-tests.log
          grep -F 'ℹ tests 49' .tmp/i3-general-shopper-source-qa/provider-tests.log
          grep -F 'ℹ fail 0' .tmp/i3-general-shopper-source-qa/provider-tests.log
          node --test \
            backend/runtime/hr-live-service/test/cxorbia-b1-transversal-shopper-actions.test.mjs \
            tools/qa/cxorbia-i3-vrm185-global-identity-consolidation-plan.test.mjs \
            tools/qa/cxorbia-i3-p0-hn-shopper-country-source.test.mjs \
            | tee .tmp/i3-general-shopper-source-qa/related-regressions.log
          grep -F 'ℹ fail 0' .tmp/i3-general-shopper-source-qa/related-regressions.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-general-shopper-source-qa-${{ github.run_id }}
          path: .tmp/i3-general-shopper-source-qa/
          if-no-files-found: warn
          retention-days: 30
