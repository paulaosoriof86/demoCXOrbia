name: CXOrbia Live HR Provider Capability Preflight

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/workflows/cxorbia-live-hr-provider-capability-preflight.yml'
      - '.github/cxorbia-firebase-requests/live-hr-provider-capability-preflight.json'

permissions:
  contents: write
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Forensic provider capability audit and G2-B reconciliation read-only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p app/docs/evidence
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'';
          if(!raw)throw new Error('service_account_secret_missing');
          const sa=JSON.parse(raw);
          if(sa.type!=='service_account'||sa.project_id!=='cxorbia-backend-dev')throw new Error('wrong_service_account');
          const project='cxorbia-backend-dev';
          const b64=v=>Buffer.from(v).toString('base64url');
          const hash=v=>v?crypto.createHash('sha256').update(String(v)).digest('hex').slice(0,16):null;
          const now=Math.floor(Date.now()/1000);
          const scopes=['https://www.googleapis.com/auth/cloud-platform','https://www.googleapis.com/auth/spreadsheets.readonly','https://www.googleapis.com/auth/drive.metadata.readonly'].join(' ');
          const unsigned=`${b64(JSON.stringify({alg:'RS256',typ:'JWT'}))}.${b64(JSON.stringify({iss:sa.client_email,scope:scopes,aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+1800}))}`;
          const signer=crypto.createSign('RSA-SHA256');signer.update(unsigned);signer.end();
          const assertion=`${unsigned}.${signer.sign(sa.private_key).toString('base64url')}`;
          async function json(url,options={}){try{const r=await fetch(url,options);let body=null;try{body=await r.json()}catch{}return {status:r.status,ok:r.ok,body};}catch(error){return {status:0,ok:false,body:{error:{message:String(error?.message||error)}}};}}
          async function safePost(url){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',redirect:'manual'});let body=null;try{body=await r.json()}catch{}return {status:r.status,ok:r.ok,error:typeof body?.error==='string'?body.error:null};}catch{return {status:0,ok:false,error:'NETWORK_READ_FAILED'};}}
          const basename=v=>String(v||'').split('/').filter(Boolean).at(-1)||null;
          const validTime=v=>{const n=Date.parse(String(v||''));return Number.isFinite(n)?n:null;};
          const sanitizeRepo=x=>({name:x?.name||null,format:x?.format||null,mode:x?.mode||null,location:String(x?.name||'').split('/locations/')[1]?.split('/')[0]||null});
          const knownArtifactWriteRoles=new Set(['roles/artifactregistry.writer','roles/artifactregistry.repoAdmin','roles/artifactregistry.admin','roles/storage.admin','roles/storage.objectAdmin','roles/cloudbuild.builds.builder']);
          (async()=>{
            const tokenResp=await json('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth2:grant-type:jwt-bearer',assertion})});
            if(!tokenResp.ok||!tokenResp.body?.access_token)throw new Error(`oauth_failed:${tokenResp.status}:${JSON.stringify(tokenResp.body).slice(0,300)}`);
            const token=tokenResp.body.access_token;
            const h={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
            const crm=await json(`https://cloudresourcemanager.googleapis.com/v1/projects/${project}`,{headers:h});
            const projectNumber=String(crm.body?.projectNumber||'');
            async function testPerm(permission){
              const r=await json(`https://cloudresourcemanager.googleapis.com/v1/projects/${project}:testIamPermissions`,{method:'POST',headers:h,body:JSON.stringify({permissions:[permission]})});
              const granted=Boolean(r.ok&&(r.body?.permissions||[]).includes(permission));
              return {permission,httpStatus:r.status,validProbe:r.status!==400,granted,errorStatus:r.body?.error?.status||null};
            }
            const permissionList=['serviceusage.services.get','serviceusage.services.enable','run.services.get','run.services.update','iam.serviceAccounts.actAs','cloudbuild.builds.create','resourcemanager.projects.getIamPolicy','artifactregistry.repositories.get','artifactregistry.repositories.list','artifactregistry.repositories.uploadArtifacts','apikeys.keys.get','apikeys.keys.list','apikeys.keys.lookup','firebasehosting.sites.get','firebasehosting.sites.update','firebasehosting.versions.create','firebasehosting.versions.update','firebasehosting.releases.create'];
            const permissionProbes=[];
            for(const p of permissionList) permissionProbes.push(await testPerm(p));
            const granted=new Set(permissionProbes.filter(x=>x.granted).map(x=>x.permission));
            const invalidPermissionProbes=permissionProbes.filter(x=>!x.validProbe).map(x=>x.permission);

            const iamPolicy=await json(`https://cloudresourcemanager.googleapis.com/v1/projects/${project}:getIamPolicy`,{method:'POST',headers:h,body:'{}'});
            function rolesFor(member){
              if(!member||!iamPolicy.ok)return [];
              const needle=`serviceAccount:${member}`.toLowerCase(),out=[];
              for(const b of iamPolicy.body?.bindings||[])if((b.members||[]).some(m=>String(m).toLowerCase()===needle))out.push(String(b.role||''));
              return out.sort();
            }
            const callerRoles=rolesFor(sa.client_email);

            const cbDefault=await json(`https://cloudbuild.googleapis.com/v1/projects/${project}/locations/global/defaultServiceAccount`,{headers:h});
            const buildSa=String(cbDefault.body?.serviceAccountEmail||cbDefault.body?.serviceAccount||'').replace(/^projects\/[^/]+\/serviceAccounts\//,'')||null;
            const buildSaRoles=rolesFor(buildSa);
            const buildIdentityKind=!buildSa?'UNKNOWN':buildSa===`${projectNumber}-compute@developer.gserviceaccount.com`?'COMPUTE_DEFAULT':buildSa===`${projectNumber}@cloudbuild.gserviceaccount.com`?'LEGACY_CLOUDBUILD':'OTHER';

            const arUs=await json(`https://artifactregistry.googleapis.com/v1/projects/${project}/locations/us/repositories?pageSize=100`,{headers:h});
            const arCentral=await json(`https://artifactregistry.googleapis.com/v1/projects/${project}/locations/us-central1/repositories?pageSize=100`,{headers:h});
            const repos=[...(arUs.body?.repositories||[]),...(arCentral.body?.repositories||[])].map(sanitizeRepo);
            const gcrBackedRepoObserved=repos.some(r=>/\/repositories\/gcr\.io$/i.test(String(r.name||'')));
            const artifactPushLikely=Boolean(buildSa&&buildSaRoles.some(r=>knownArtifactWriteRoles.has(r)));

            const apiKeysList=projectNumber?await json(`https://apikeys.googleapis.com/v2/projects/${projectNumber}/locations/global/keys?pageSize=1`,{headers:h}):{status:0,ok:false,body:null};
            const firebaseCliApiKeyReady=apiKeysList.ok;
            const hostingReleases=await json('https://firebasehosting.googleapis.com/v1beta1/sites/cxorbia-backend-dev/releases?pageSize=5',{headers:h});
            const hostingWritePerms=['firebasehosting.sites.update','firebasehosting.versions.create','firebasehosting.versions.update','firebasehosting.releases.create'];
            const hostingPermProbes=permissionProbes.filter(x=>hostingWritePerms.includes(x.permission));
            const hostingPermsAllGranted=hostingPermProbes.length===hostingWritePerms.length&&hostingPermProbes.every(x=>x.validProbe&&x.granted);
            const callerHostingAdmin=callerRoles.some(r=>['roles/firebasehosting.admin','roles/firebase.admin'].includes(r));
            const hostingRestPermissionReady=hostingPermsAllGranted||callerHostingAdmin;
            const firebaseCliDeployReady=Boolean(firebaseCliApiKeyReady&&hostingRestPermissionReady&&hostingReleases.ok);

            const serviceName=`projects/${projectNumber||project}/services/sheets.googleapis.com`;
            const sheetsService=await json(`https://serviceusage.googleapis.com/v1/${serviceName}`,{headers:h});
            const sheetId='1h307t37LxM1nZNh_9Odt6wHUQhROG6cYbsbMKr48vU4';
            const sheetsDoc=await json(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?includeGridData=false&fields=spreadsheetId,properties(title),sheets(properties(sheetId,title,index))`,{headers:h});
            const drive=await json(`https://www.googleapis.com/drive/v3/files/${sheetId}?fields=id,name,mimeType&supportsAllDrives=true`,{headers:h});
            const titles=(sheetsDoc.body?.sheets||[]).map(s=>s?.properties?.title).filter(Boolean),monthlyTitles=titles.filter(t=>!/^(DASHBOARD|DASHBOARD HN)$/i.test(t));
            const apiEnabled=sheetsService.body?.state==='ENABLED',sheetAccessible=sheetsDoc.ok&&sheetsDoc.body?.spreadsheetId===sheetId;

            const executeSha='0f2000b62844fe56f0167285ebaffe4208af03be',executeAt='2026-08-21T14:31:20Z',baselineRevision='cxorbia-live-hr-dev-00010-n78',commandPath='/api/tenants/tya/projects/cinepolis/g2b-synthetic/commands';
            const cloudRun=await json(`https://run.googleapis.com/v2/projects/${project}/locations/us-central1/services/cxorbia-live-hr-dev`,{headers:h});
            const latestReadyRevision=basename(cloudRun.body?.latestReadyRevision),latestCreatedRevision=basename(cloudRun.body?.latestCreatedRevision),serviceUri=String(cloudRun.body?.uri||'').replace(/\/$/,''),cloudRunUpdateTime=cloudRun.body?.updateTime||null;
            const directProbe=serviceUri?await safePost(serviceUri+commandPath):{status:0,ok:false,error:'CLOUD_RUN_URI_UNAVAILABLE'};
            const hostingProbe=await safePost('https://cxorbia-backend-dev.web.app'+commandPath);
            const releases=Array.isArray(hostingReleases.body?.releases)?hostingReleases.body.releases:[],latestRelease=releases[0]||null,latestReleaseTime=latestRelease?.releaseTime||null,latestReleaseName=latestRelease?.name||null,latestVersionName=latestRelease?.version?.name||null;
            const executeMs=validTime(executeAt),releaseMs=validTime(latestReleaseTime),updateMs=validTime(cloudRunUpdateTime);
            const cloudRunChanged=Boolean(cloudRun.ok&&latestReadyRevision&&latestReadyRevision!==baselineRevision),cloudRunChangedAfterExecute=Boolean(cloudRunChanged&&updateMs!==null&&executeMs!==null&&updateMs>=executeMs);
            const directSourceLive=directProbe.status===401&&directProbe.error==='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED',directSourcePresentGateClosed=directProbe.status===423&&directProbe.error==='G2B_SYNTHETIC_WRITE_GATE_DISABLED',hostingSourceLive=hostingProbe.status===401&&hostingProbe.error==='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED',hostingSourcePresentGateClosed=hostingProbe.status===423&&hostingProbe.error==='G2B_SYNTHETIC_WRITE_GATE_DISABLED';
            const hostingReleaseAfterExecute=Boolean(hostingReleases.ok&&releaseMs!==null&&executeMs!==null&&releaseMs>=executeMs),readsSufficient=cloudRun.ok&&hostingReleases.ok&&directProbe.status>0&&hostingProbe.status>0;
            let classification='HOLD_PROVIDER_RECONCILIATION_INSUFFICIENT_READBACK';
            if(readsSufficient){if(!cloudRunChanged&&!directSourceLive&&!directSourcePresentGateClosed&&!hostingReleaseAfterExecute)classification='A_NO_G2B_PROVIDER_DEPLOY_OBSERVED';else if(cloudRunChanged&&cloudRunChangedAfterExecute&&directSourceLive&&hostingSourceLive&&hostingReleaseAfterExecute)classification='C_G2B_CLOUD_RUN_AND_HOSTING_DEPLOY_MATERIALIZED';else classification='B_G2B_PROVIDER_DEPLOY_PARTIAL_OR_NONTERMINAL';}

            const cloudBuildCallerReady=granted.has('cloudbuild.builds.create');
            const cloudRunUpdateReady=granted.has('run.services.update')&&granted.has('iam.serviceAccounts.actAs');
            const readiness={schemaVersion:'cxorbia.provider-forensic-readiness.v3.1',generatedAt:new Date().toISOString(),decision:'FORENSIC_READONLY_COMPLETE',target:{projectId:project,projectNumber:projectNumber||null},caller:{serviceAccountEmailHash:hash(sa.client_email),iamPolicyHttpStatus:iamPolicy.status,roles:callerRoles,permissionProbes,invalidPermissionProbes},cloudRun:{readable:cloudRun.ok,updateReady:cloudRunUpdateReady,latestReadyRevision,latestCreatedRevision,updateTime:cloudRunUpdateTime},cloudBuild:{callerCanCreate:cloudBuildCallerReady,defaultServiceAccountLookupHttpStatus:cbDefault.status,executionIdentityKnown:Boolean(buildSa),executionIdentityKind:buildIdentityKind,executionServiceAccountHash:hash(buildSa),executionServiceAccountRoles:buildSaRoles,artifactRepositoriesReadHttpStatus:{us:arUs.status,usCentral1:arCentral.status},artifactRepositories:repos,artifactPushLikely,artifactPushAssessment:artifactPushLikely?'LIKELY_READY_FROM_BUILD_IDENTITY_ROLES':'NOT_PROVEN_FROM_CURRENT_IAM_READBACK',gcrBackedRepoObserved},hosting:{releasesReadHttpStatus:hostingReleases.status,latestReleaseName,latestVersionName,latestReleaseTime,apiKeysListHttpStatus:apiKeysList.status,firebaseCliApiKeyReady,hostingRestPermissionReady,hostingRestReadinessBasis:hostingPermsAllGranted?'PERMISSION_PROBES':callerHostingAdmin?'CALLER_HOSTING_ADMIN_ROLE':'NOT_PROVEN',firebaseCliDeployReady,restDeployReadiness:hostingRestPermissionReady&&hostingReleases.ok?'PERMISSIONS_READY_READONLY_PROOF':'NOT_READY_OR_NOT_PROVEN'},hr:{sheetsApiEnabled:apiEnabled,spreadsheetAccessible:sheetAccessible,driveMetadataAccessible:drive.ok,totalTabs:titles.length,monthlyTabs:monthlyTitles.length,latestMonthlyTab:monthlyTitles.at(-1)||null},g2b:{providerDecision:classification,directRouteHttpStatus:directProbe.status,directRouteError:directProbe.error||null,hostingRouteHttpStatus:hostingProbe.status,hostingRouteError:hostingProbe.error||null,providerStillBaseline:classification==='A_NO_G2B_PROVIDER_DEPLOY_OBSERVED'},gates:{firebaseCliDeployReady,hostingRestDeployReadiness:hostingRestPermissionReady&&hostingReleases.ok,cloudBuildCallerReady,cloudBuildExecutionIdentityKnown:Boolean(buildSa),cloudBuildArtifactPushLikelyReady:artifactPushLikely,cloudRunUpdateReady,g2bProviderStillBaseline:classification==='A_NO_G2B_PROVIDER_DEPLOY_OBSERVED'},safety:{providerReads:true,providerWrites:0,cloudBuildExecutions:0,hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,storageWrites:0,hrWrites:0,externalHrWrites:0,paymentWrites:0,makeCalls:0,geminiCalls:0,merge:false,secretsExported:false}};
            fs.writeFileSync('app/docs/evidence/I5-G2B-PROVIDER-FORENSIC-READINESS-LATEST.json',JSON.stringify(readiness,null,2)+'\n');
            const cap={schemaVersion:'cxorbia.live-hr-provider-capability-preflight.v3.1',generatedAt:readiness.generatedAt,decision:apiEnabled&&sheetAccessible?'PASS_SHEETS_API_AND_CANONICAL_HR_READER':'HOLD_PROVIDER_CAPABILITY_OR_HR_READER',target:{projectId:project,projectNumber:projectNumber||null},googleSheetsApi:{httpStatus:sheetsService.status,state:sheetsService.body?.state||null,enabled:apiEnabled},spreadsheetAccess:{httpStatus:sheetsDoc.status,accessible:sheetAccessible,title:sheetsDoc.body?.properties?.title||null,totalTabs:titles.length,monthlyTabs:monthlyTitles.length,latestMonthlyTab:monthlyTitles.at(-1)||null},driveMetadataAccess:{httpStatus:drive.status,accessible:drive.ok&&drive.body?.id===sheetId},iam:{permissionProbes,invalidPermissionProbes,canUpdateCloudRun:cloudRunUpdateReady,canStartCloudBuild:cloudBuildCallerReady},forensicEvidence:'app/docs/evidence/I5-G2B-PROVIDER-FORENSIC-READINESS-LATEST.json',safety:readiness.safety};
            fs.writeFileSync('app/docs/evidence/LIVE-HR-PROVIDER-CAPABILITY-PREFLIGHT-LATEST.json',JSON.stringify(cap,null,2)+'\n');
            const g2b={schemaVersion:'cxorbia.g2b.provider-readonly-reconciliation.v2',generatedAt:readiness.generatedAt,decision:classification,execution:{sha:executeSha,requestedAt:executeAt,automaticRetryAllowed:false},baseline:{cloudRunRevision:baselineRevision},cloudRun:{httpStatus:cloudRun.status,readable:cloudRun.ok,latestReadyRevision,latestCreatedRevision,updateTime:cloudRunUpdateTime,changedFromBaseline:cloudRunChanged,changedAfterExecute:cloudRunChangedAfterExecute},directCloudRunProbe:{httpStatus:directProbe.status,error:directProbe.error||null,expectedUnauthenticatedStatus:401,sourceLive:directSourceLive,sourcePresentButGateClosed:directSourcePresentGateClosed},hosting:{httpStatus:hostingReleases.status,readable:hostingReleases.ok,latestReleaseName,latestVersionName,latestReleaseTime,releaseAfterExecute:hostingReleaseAfterExecute,releasesInspected:releases.length},hostingRouteProbe:{httpStatus:hostingProbe.status,error:hostingProbe.error||null,expectedUnauthenticatedStatus:401,sourceLive:hostingSourceLive,sourcePresentButGateClosed:hostingSourcePresentGateClosed},safety:readiness.safety};
            fs.writeFileSync('app/docs/evidence/I5-G2B-PROVIDER-READONLY-RECONCILIATION-LATEST.json',JSON.stringify(g2b,null,2)+'\n');
            console.log(JSON.stringify({decision:readiness.decision,gates:readiness.gates,invalidPermissionProbes,safety:readiness.safety}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Commit sanitized forensic evidence
        run: |
          set -euo pipefail
          cp app/docs/evidence/LIVE-HR-PROVIDER-CAPABILITY-PREFLIGHT-LATEST.json /tmp/cap.json
          cp app/docs/evidence/I5-G2B-PROVIDER-READONLY-RECONCILIATION-LATEST.json /tmp/g2b-provider.json
          cp app/docs/evidence/I5-G2B-PROVIDER-FORENSIC-READINESS-LATEST.json /tmp/g2b-forensic.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/cap.json app/docs/evidence/LIVE-HR-PROVIDER-CAPABILITY-PREFLIGHT-LATEST.json
          cp /tmp/g2b-provider.json app/docs/evidence/I5-G2B-PROVIDER-READONLY-RECONCILIATION-LATEST.json
          cp /tmp/g2b-forensic.json app/docs/evidence/I5-G2B-PROVIDER-FORENSIC-READINESS-LATEST.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/LIVE-HR-PROVIDER-CAPABILITY-PREFLIGHT-LATEST.json app/docs/evidence/I5-G2B-PROVIDER-READONLY-RECONCILIATION-LATEST.json app/docs/evidence/I5-G2B-PROVIDER-FORENSIC-READINESS-LATEST.json
          if ! git diff --cached --quiet; then git commit -m 'evidence: persist G2B provider forensic readiness'; git push origin HEAD:docs-tya-v6-v71-audit; fi

      - name: Publish forensic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=success;DESC='FORENSIC_G2B_PROVIDER_READONLY_COMPLETE'
          if [ ! -f app/docs/evidence/I5-G2B-PROVIDER-FORENSIC-READINESS-LATEST.json ]; then STATE=error;DESC='HOLD_G2B_PROVIDER_FORENSIC_EVIDENCE_MISSING'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/g2b-provider-forensic-readiness' -f description="$DESC" >/dev/null
