name: CXOrbia Live HR Provider Capability Preflight — Historical M3 Hold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-hold:
    name: Provider preflight held until M4/F3
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm no current provider authority
        run: |
          echo 'HISTORICAL_INERT_M3'
          echo 'No provider read/write/deploy is authorized by this workflow during M3.'
          echo 'M4/F3 read-only revalidation requires the then-current canonical gate and evidence.'
