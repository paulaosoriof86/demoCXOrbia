name: CXOrbia Corte 4 P0 VIS-02 Revalidation

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/cxorbia-firebase-requests/corte4-p0-vis02-revalidate.json'

permissions:
  contents: read
  statuses: write

env:
  CXORBIA_REQUEST_PATH: .github/cxorbia-firebase-requests/corte4-p0-vis02-revalidate.json
  CXORBIA_OUT_DIR: .tmp/corte4-p0-vis02
  CXORBIA_PRIVATE_DIR: .tmp/corte4-p0-vis02-private
  PREPARE_SCRIPT: tools/release/cxorbia-corte4-p0-vis02-hosting-prepare.mjs

jobs:
  p0-vis02-revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Load provider credential
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p "$CXORBIA_PRIVATE_DIR" "$CXORBIA_OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null; try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.client_email&&p.private_key&&p.token_uri)){
            console.error('credential_invalid'); process.exit(1);
          }
          fs.writeFileSync(process.env.CXORBIA_PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${CXORBIA_PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"

      - name: Provider-safe preflight and build
        run: |
          set -euo pipefail
          node "$PREPARE_SCRIPT"
          node -e "const r=require('./$CXORBIA_OUT_DIR/preflight.source-safe.json'); if(r.decision!=='PASS_C4_P0_VIS02_PREFLIGHT_READY_FOR_ONE_DEPLOY') process.exit(1)"

      - name: Install transient Chromium
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.61.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Local empty-backend and role-switch gate
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$CXORBIA_OUT_DIR/site" > "$CXORBIA_OUT_DIR/local-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let browser; const report={ok:false,stage:'local',errors:[],states:{}}; try{
            browser=await chromium.launch({headless:true}); const page=await browser.newPage(); const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e&&e.message||e)));
            await page.goto('http://127.0.0.1:4173/index-backend-dev.html?cxBackendPreview=YES_PAULA_20260628_PREVIEW_DEV&p0vis02=local',{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1200);
            const snap=async()=>page.evaluate(()=>({role:CX.session&&CX.session.role,guard:window.CX_C4_EMPTY_SHELL_GUARD||null,state:window.CX_C4_EMPTY_SHELL_STATE||null,loginHidden:document.getElementById('login')?.classList.contains('hidden'),appOn:document.getElementById('app')?.classList.contains('on'),rail:document.getElementById('rail')?.innerText||'',view:document.getElementById('view')?.innerText||'',bodyRoleShopper:document.body.classList.contains('role-shopper'),counts:{projects:(CX.data?.projects||[]).length,visits:(CX.data?._visitas||[]).length,shoppers:(CX.data?.shoppers||[]).length,posts:(CX.data?._posts||[]).length},source:String(window.CX_BACKEND_DATA_SOURCE||''),fallback:window.CX_BACKEND_LAST_STATE&&window.CX_BACKEND_LAST_STATE.fallbackUsed}));
            report.states.login=await snap();
            await page.evaluate(()=>CX.app.selectRole('admin')); await page.waitForTimeout(350); report.states.admin1=await snap();
            await page.evaluate(()=>CX.app.logout()); await page.waitForTimeout(150); report.states.afterAdminLogout=await snap();
            await page.evaluate(()=>CX.app.selectRole('shopper')); await page.waitForTimeout(250); report.states.shopper=await snap();
            await page.evaluate(()=>CX.app.logout()); await page.waitForTimeout(150); report.states.afterShopperLogout=await snap();
            await page.evaluate(()=>CX.app.selectRole('admin')); await page.waitForTimeout(350); report.states.admin2=await snap();
            const a1=report.states.admin1, sh=report.states.shopper, a2=report.states.admin2, l1=report.states.afterAdminLogout, l2=report.states.afterShopperLogout;
            for(const [name,s] of Object.entries({admin1:a1,shopper:sh,admin2:a2})){
              if(!s.state||s.state.active!==true) report.errors.push(name+'_empty_state_inactive');
              if(s.counts.projects||s.counts.visits||s.counts.shoppers||s.counts.posts) report.errors.push(name+'_counts_nonzero');
              if(!s.view.includes('Sin proyectos disponibles')) report.errors.push(name+'_view_missing_empty_state');
              if(!s.appOn||!s.loginHidden) report.errors.push(name+'_shell_visibility_invalid');
              if(String(s.rail+s.view).includes('Proyecto Retail')||String(s.rail+s.view).includes('Demo comercial')) report.errors.push(name+'_demo_copy_visible');
            }
            if(a1.role!=='admin'||a1.state?.role!=='admin'||!a1.rail.includes('Administración')) report.errors.push('admin1_role_invalid');
            if(sh.role!=='shopper'||sh.state?.role!=='shopper'||!sh.rail.includes('Shopper / Evaluador')) report.errors.push('shopper_role_invalid');
            if(a2.role!=='admin'||a2.state?.role!=='admin'||!a2.rail.includes('Administración')||a2.rail.includes('Shopper / Evaluador')||a2.bodyRoleShopper) report.errors.push('admin2_stale_shopper_shell');
            for(const [name,s] of Object.entries({afterAdminLogout:l1,afterShopperLogout:l2})) if(s.rail.trim()||s.view.trim()) report.errors.push(name+'_stale_dom_not_cleared');
            if(pageErrors.length) report.errors.push('pageerrors:'+pageErrors.join('|').slice(0,300));
            report.ok=report.errors.length===0;
          }catch(e){report.errors.push(String(e&&e.message||e));}finally{if(browser)await browser.close();fs.writeFileSync(process.env.CXORBIA_OUT_DIR+'/local-role-switch.json',JSON.stringify(report,null,2)+'\n');if(!report.ok)process.exitCode=1;}})();
          NODE

      - name: Deploy exactly once to authorized Hosting DEV
        run: |
          set -euo pipefail
          DEPLOYS=0
          npx --yes firebase-tools@14.12.0 deploy --only hosting --project cxorbia-tya-dev-260729-c4 --config "$CXORBIA_OUT_DIR/firebase.corte4-p0-vis02.json" --non-interactive
          DEPLOYS=$((DEPLOYS+1))
          printf '%s\n' "$DEPLOYS" > "$CXORBIA_OUT_DIR/deploy-count.txt"
          test "$DEPLOYS" -eq 1

      - name: Remote browser revalidation
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let browser; const report={ok:false,stage:'remote',errors:[],states:{},url:''}; try{
            browser=await chromium.launch({headless:true}); const page=await browser.newPage(); const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e&&e.message||e)));
            const url=`https://cxorbia-tya-dev-260729-c4.web.app/index-backend-dev.html?cxBackendPreview=YES_PAULA_20260628_PREVIEW_DEV&p0vis02=${process.env.GITHUB_SHA}`; report.url=url;
            let loaded=false; for(let i=0;i<8&&!loaded;i++){try{const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});loaded=!!(r&&r.ok());}catch{} if(!loaded)await page.waitForTimeout(1500);} if(!loaded)throw new Error('remote_page_unavailable');
            await page.waitForTimeout(1400);
            const snap=async()=>page.evaluate(()=>({role:CX.session&&CX.session.role,guard:window.CX_C4_EMPTY_SHELL_GUARD||null,state:window.CX_C4_EMPTY_SHELL_STATE||null,loginHidden:document.getElementById('login')?.classList.contains('hidden'),appOn:document.getElementById('app')?.classList.contains('on'),rail:document.getElementById('rail')?.innerText||'',view:document.getElementById('view')?.innerText||'',bodyRoleShopper:document.body.classList.contains('role-shopper'),counts:{projects:(CX.data?.projects||[]).length,visits:(CX.data?._visitas||[]).length,shoppers:(CX.data?.shoppers||[]).length,posts:(CX.data?._posts||[]).length},source:String(window.CX_BACKEND_DATA_SOURCE||''),fallback:window.CX_BACKEND_LAST_STATE&&window.CX_BACKEND_LAST_STATE.fallbackUsed}));
            report.states.login=await snap();
            await page.evaluate(()=>CX.app.selectRole('admin')); await page.waitForTimeout(450); report.states.admin1=await snap();
            await page.evaluate(()=>CX.app.logout()); await page.waitForTimeout(180); report.states.afterAdminLogout=await snap();
            await page.evaluate(()=>CX.app.selectRole('shopper')); await page.waitForTimeout(300); report.states.shopper=await snap();
            await page.evaluate(()=>CX.app.logout()); await page.waitForTimeout(180); report.states.afterShopperLogout=await snap();
            await page.evaluate(()=>CX.app.selectRole('admin')); await page.waitForTimeout(450); report.states.admin2=await snap();
            const a1=report.states.admin1, sh=report.states.shopper, a2=report.states.admin2, l1=report.states.afterAdminLogout, l2=report.states.afterShopperLogout;
            for(const [name,s] of Object.entries({admin1:a1,shopper:sh,admin2:a2})){
              if(!s.state||s.state.active!==true) report.errors.push(name+'_empty_state_inactive');
              if(s.counts.projects||s.counts.visits||s.counts.shoppers||s.counts.posts) report.errors.push(name+'_counts_nonzero');
              if(!s.view.includes('Sin proyectos disponibles')) report.errors.push(name+'_view_missing_empty_state');
              if(!s.appOn||!s.loginHidden) report.errors.push(name+'_shell_visibility_invalid');
              if(String(s.rail+s.view).includes('Proyecto Retail')||String(s.rail+s.view).includes('Demo comercial')) report.errors.push(name+'_demo_copy_visible');
            }
            if(a1.role!=='admin'||a1.state?.role!=='admin'||!a1.rail.includes('Administración')) report.errors.push('admin1_role_invalid');
            if(sh.role!=='shopper'||sh.state?.role!=='shopper'||!sh.rail.includes('Shopper / Evaluador')) report.errors.push('shopper_role_invalid');
            if(a2.role!=='admin'||a2.state?.role!=='admin'||!a2.rail.includes('Administración')||a2.rail.includes('Shopper / Evaluador')||a2.bodyRoleShopper) report.errors.push('admin2_stale_shopper_shell');
            for(const [name,s] of Object.entries({afterAdminLogout:l1,afterShopperLogout:l2})) if(s.rail.trim()||s.view.trim()) report.errors.push(name+'_stale_dom_not_cleared');
            if(pageErrors.length) report.errors.push('pageerrors:'+pageErrors.join('|').slice(0,300));
            report.ok=report.errors.length===0;
          }catch(e){report.errors.push(String(e&&e.message||e));}finally{if(browser)await browser.close();fs.writeFileSync(process.env.CXORBIA_OUT_DIR+'/remote-role-switch.json',JSON.stringify(report,null,2)+'\n');if(!report.ok)process.exitCode=1;}})();
          NODE

      - name: Publish gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRE="$CXORBIA_OUT_DIR/preflight.source-safe.json"
          LOC="$CXORBIA_OUT_DIR/local-role-switch.json"
          REM="$CXORBIA_OUT_DIR/remote-role-switch.json"
          DEP="$CXORBIA_OUT_DIR/deploy-count.txt"
          OK=yes
          [ -f "$PRE" ] && [ "$(node -p "require('./$PRE').decision")" = 'PASS_C4_P0_VIS02_PREFLIGHT_READY_FOR_ONE_DEPLOY' ] || OK=no
          [ -f "$LOC" ] && [ "$(node -p "require('./$LOC').ok===true?'yes':'no'")" = yes ] || OK=no
          [ -f "$REM" ] && [ "$(node -p "require('./$REM').ok===true?'yes':'no'")" = yes ] || OK=no
          [ -f "$DEP" ] && [ "$(cat "$DEP")" = 1 ] || OK=no
          if [ "$OK" = yes ]; then STATE=success; DESC='PASS_C4_VIS02_EMPTY_BACKEND_AND_ROLE_SWITCH_REMOTE'; else STATE=error; DESC='HOLD_C4_VIS02_REVALIDATION_FAILED'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c4p0vis02-revalidation' -f description="$DESC" >/dev/null
          DSTATE=error; [ -f "$DEP" ] && [ "$(cat "$DEP")" = 1 ] && DSTATE=success
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$DSTATE" -f context='cxorbia/c4p0vis02-deploys1' -f description='Hosting deploy executions must equal 1' >/dev/null

      - name: Cleanup credential and transient site
        if: always()
        run: rm -rf "$CXORBIA_PRIVATE_DIR" "$CXORBIA_OUT_DIR/site" "$CXORBIA_OUT_DIR/firebase.corte4-p0-vis02.json"
