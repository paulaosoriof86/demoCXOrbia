name: CXOrbia RC15 CP119 Legal Gate Containment

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/rc15-cp119-legal-gate-containment-request.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-rc15-cp119-legal-gate-containment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/rc15-cp119-legal-gate-containment-request.json
  OUT_DIR: .tmp/rc15-cp119-legal-gate-containment
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  EXPECTED_BEFORE_REVISION: cxorbia-live-hr-dev-00010-n78
  EXPECTED_OLD_GATE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME

jobs:
  contain-cp119:
    name: Disable historical legal write gate once
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate exact current-conversation containment authorization
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p=process.env.REQUEST_FILE;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=cp.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const expected=['.github/workflows/cxorbia-rc15-cp119-legal-gate-containment.yml',p].sort();
          if(head!==process.env.GITHUB_SHA)throw new Error('trigger_sha_mismatch');
          if(parent!==r.expectedParentHeadSha)throw new Error('parent_head_mismatch:'+parent);
          if(JSON.stringify(changed)!==JSON.stringify(expected))throw new Error('containment_commit_scope_invalid:'+changed.join(','));
          if(r.schemaVersion!=='cxorbia.rc15.cp119.legal-gate-containment.request.v1')throw new Error('request_schema_invalid');
          if(r.requestId!=='rc15-cp119-legal-write-gate-containment-20260821-01'||r.p0Id!=='RC15-CP-119')throw new Error('request_identity_invalid');
          if(r.masterPlanId!=='CXORBIA-MASTER-GO-LIVE-POSTPROD-RC15-V1'||r.masterPlanGitBlobSha!=='48494ebe5fc439aa6d00e6edcf2e78133357e7f3'||r.masterPlanSha256!=='2ddfa91f6ad78ebf08f3dfeefe8b62a695753e3583fc536ce4f015c252d02475')throw new Error('master_plan_identity_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||Number(r.pullRequest)!==7)throw new Error('lane_invalid');
          if(r.authorizedBy!=='Paula'||r.authorizationSource!=='current_conversation_2026-08-21T19:55:00-06:00'||r.explicitCurrentConversationAuthorization!==true)throw new Error('authorization_invalid');
          if(r.enabled!==true||r.consumed!==false||r.status!=='authorized_pending_execute'||r.automaticRetryAllowed!==false)throw new Error('one_shot_state_invalid');
          if(r.firebaseProjectId!=='cxorbia-backend-dev'||r.cloudRunService!=='cxorbia-live-hr-dev'||r.cloudRunRegion!=='us-central1'||r.expectedBeforeRevision!==process.env.EXPECTED_BEFORE_REVISION)throw new Error('target_invalid');
          if(Number(r.maxCloudRunConfigUpdates)!==1||Number(r.cloudRunConfigUpdatesExecuted)!==0)throw new Error('config_update_budget_invalid');
          for(const k of ['cloudBuilds','hostingDeploys','firestoreWrites','authWrites','storageWrites','externalHrWrites','rulesWrites','makeCalls','geminiCalls','paymentWrites','g2bExecutions','businessDataWrites'])if(Number(r[k]||0)!==0)throw new Error('forbidden_budget:'+k);
          const remove=[...(r.removeEnvVars||[])].sort();
          const expectedRemove=['CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED','CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE'].sort();
          if(JSON.stringify(remove)!==JSON.stringify(expectedRemove))throw new Error('remove_env_scope_invalid');
          fs.writeFileSync(process.env.OUT_DIR+'/authorization.json',JSON.stringify({decision:'PASS_RC15_CP119_CURRENT_AUTHORIZATION',head,parent,changed,p0Id:r.p0Id,providerMutation:'ONE_CLOUD_RUN_CONFIG_UPDATE_ONLY'},null,2)+'\n');
          NODE

      - name: Authenticate existing Google Cloud project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Provider pre-readback must prove exact historical gate
        id: preflight
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT_DIR/cloudrun-before.json"
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/cloudrun-before.json','utf8'));
          const rev=String(x.status?.latestReadyRevisionName||'').split('/').at(-1);
          const c=x.spec?.template?.spec?.containers?.[0]||x.spec?.template?.containers?.[0]||{};
          const env=new Map((c.env||[]).map(e=>[e.name,e.value]));
          const image=String(c.image||'');
          const sa=String(x.spec?.template?.spec?.serviceAccountName||x.spec?.template?.serviceAccount||'');
          if(rev!==process.env.EXPECTED_BEFORE_REVISION)throw new Error('provider_drift_revision:'+rev);
          if(env.get('CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED')!=='true')throw new Error('historical_legal_write_enable_not_true');
          if(env.get('CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE')!==process.env.EXPECTED_OLD_GATE)throw new Error('historical_legal_write_gate_mismatch');
          if(!image)throw new Error('cloudrun_image_missing');
          const report={decision:'PASS_RC15_CP119_PROVIDER_PREFLIGHT',revision:rev,image,serviceAccount:sa,legalWriteEnabled:true,legalWriteGate:process.env.EXPECTED_OLD_GATE,providerWrites:0,dataWrites:0};
          fs.writeFileSync(process.env.OUT_DIR+'/preflight.json',JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Remove only the two historical legal acceptance write env vars
        id: contain
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --remove-env-vars "CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED,CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE" \
            --quiet

      - name: Read back containment and prove no collateral runtime config change
        id: readback
        if: always() && steps.preflight.outcome == 'success'
        env:
          CONTAIN_OUTCOME: ${{ steps.contain.outcome }}
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT_DIR/cloudrun-after.json"
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/cloudrun-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/cloudrun-after.json','utf8'));
          const bc=before.spec?.template?.spec?.containers?.[0]||before.spec?.template?.containers?.[0]||{};
          const ac=after.spec?.template?.spec?.containers?.[0]||after.spec?.template?.containers?.[0]||{};
          const bRev=String(before.status?.latestReadyRevisionName||'').split('/').at(-1);
          const aRev=String(after.status?.latestReadyRevisionName||'').split('/').at(-1);
          const canon=e=>(e||[]).filter(x=>!['CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED','CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE'].includes(x.name)).map(x=>JSON.stringify(x)).sort();
          const aNames=new Set((ac.env||[]).map(x=>x.name));
          if(process.env.CONTAIN_OUTCOME!=='success')throw new Error('cloudrun_config_update_failed');
          if(aRev===bRev||!aRev)throw new Error('new_config_revision_not_ready:'+aRev);
          if(String(ac.image||'')!==String(bc.image||''))throw new Error('image_changed');
          const bSa=String(before.spec?.template?.spec?.serviceAccountName||before.spec?.template?.serviceAccount||'');
          const aSa=String(after.spec?.template?.spec?.serviceAccountName||after.spec?.template?.serviceAccount||'');
          if(aSa!==bSa)throw new Error('service_account_changed');
          if(aNames.has('CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED')||aNames.has('CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE'))throw new Error('legal_write_env_still_present');
          if(JSON.stringify(canon(bc.env))!==JSON.stringify(canon(ac.env)))throw new Error('unrelated_env_changed');
          const report={decision:'PASS_RC15_CP119_CLOUD_RUN_CONFIG_CONTAINMENT',beforeRevision:bRev,afterRevision:aRev,imageUnchanged:true,serviceAccountUnchanged:true,removedEnvVars:['CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED','CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE'],otherEnvUnchanged:true,cloudRunConfigUpdatesExecuted:1,cloudBuilds:0,hostingDeploys:0,firestoreWrites:0,authWrites:0,storageWrites:0,externalHrWrites:0,rulesWrites:0,makeCalls:0,geminiCalls:0,paymentWrites:0,g2bExecutions:0};
          fs.writeFileSync(process.env.OUT_DIR+'/provider-readback.json',JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Direct runtime proof must return write-gate-disabled before auth
        id: smoke
        if: steps.readback.outcome == 'success'
        run: |
          set -euo pipefail
          service_url="$(node -e "const x=require('./$OUT_DIR/cloudrun-after.json');process.stdout.write(String(x.status?.url||''))")"
          test -n "$service_url"
          code_direct="$(curl -sS --retry 10 --retry-delay 2 -o "$OUT_DIR/legal-direct-disabled.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"command":{}}' "$service_url/api/tenants/tya/legal/commands")"
          code_hosting="$(curl -sS --retry 10 --retry-delay 2 -o "$OUT_DIR/legal-hosting-disabled.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"command":{}}' "$DEV_ROOT_URL/api/tenants/tya/legal/commands")"
          export CODE_DIRECT="$code_direct" CODE_HOSTING="$code_hosting"
          node <<'NODE'
          const fs=require('fs');
          const direct=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/legal-direct-disabled.json','utf8'));
          const hosting=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/legal-hosting-disabled.json','utf8'));
          if(process.env.CODE_DIRECT!=='423'||direct.error!=='LEGAL_RUNTIME_HUMAN_ACCEPTANCE_WRITE_GATE_DISABLED')throw new Error('direct_write_gate_not_disabled:'+process.env.CODE_DIRECT+':'+JSON.stringify(direct));
          if(process.env.CODE_HOSTING!=='423'||hosting.error!=='LEGAL_RUNTIME_HUMAN_ACCEPTANCE_WRITE_GATE_DISABLED')throw new Error('hosting_write_gate_not_disabled:'+process.env.CODE_HOSTING+':'+JSON.stringify(hosting));
          fs.writeFileSync(process.env.OUT_DIR+'/runtime-proof.json',JSON.stringify({decision:'PASS_RC15_CP119_RUNTIME_WRITE_GATE_DISABLED',directHttpStatus:423,hostingHttpStatus:423,error:'LEGAL_RUNTIME_HUMAN_ACCEPTANCE_WRITE_GATE_DISABLED',authenticatedWriteAttempted:false,dataWrites:0},null,2)+'\n');
          NODE

      - name: Upload sanitized containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc15-cp119-legal-gate-containment-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish containment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          state=failure
          desc='RC15 CP119 containment failed closed'
          if [ "$READBACK_OUTCOME" = 'success' ] && [ "$SMOKE_OUTCOME" = 'success' ]; then
            state=success
            desc='PASS RC15 CP119 legal write gate disabled'
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"cxorbia/rc15-cp119-containment\",\"description\":\"$desc\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Enforce terminal PASS
        if: always()
        run: |
          test '${{ steps.contain.outcome }}' = 'success'
          test '${{ steps.readback.outcome }}' = 'success'
          test '${{ steps.smoke.outcome }}' = 'success'
