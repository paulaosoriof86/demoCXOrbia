name: CXOrbia C6 Auth One Target Resolver Password Snapshot Readonly

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/c6-auth-one-target-resolver-password-snapshot-readonly-request-v3.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-one-target-resolver-password-snapshot-readonly
  cancel-in-progress: false

jobs:
  resolve-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUEST_FILE: backend/config/c6-auth-one-target-resolver-password-snapshot-readonly-request-v3.json
      TOOL_FILE: tools/qa/cxorbia-c6-auth-one-target-resolver-password-snapshot-readonly.mjs
      SOURCE_DIR: .tmp/c6-auth-one-target-resolver-password/source
      EXPORT_DIR: .tmp/c6-auth-one-target-resolver-password/export
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact one-target authorization
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ensure=(v,c)=>{if(!v)throw new Error(c)};
          ensure(r.schemaVersion==='cxorbia.c6.auth-one-target-resolver-password-snapshot-readonly.request.v1','SCHEMA');
          ensure(r.requestId==='c6-auth-one-target-resolver-password-snapshot-readonly-20260807-03','REQUEST_ID');
          ensure(r.authorizedBy==='Paula'&&r.enabled===true&&r.consumed===false&&r.status==='authorized_execute_once_after_source_integration_fixes'&&Number(r.allowedExecutions)===1,'AUTHORIZATION');
          ensure(r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&Number(r.pullRequest)===7&&r.firebaseProjectId==='cxorbia-backend-dev','LANE');
          ensure(r.targetProfileFingerprint==='ac93d90d9e41512acdcd','TARGET');
          ensure(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_SOURCE_LOCK');
          ensure(Array.isArray(r.previousSourceAttempts)&&r.previousSourceAttempts.length===2,'PREVIOUS_ATTEMPTS');
          ensure(r.previousSourceAttempts.every(x=>Number(x.providerReads)===0&&Number(x.providerWrites)===0),'PREVIOUS_ATTEMPT_PROVIDER_SAFETY');
          ensure(Number(r.readBudget?.authDirectoryPagesMax)===1&&Number(r.readBudget?.shopperIndexQueriesMax)===1&&Number(r.readBudget?.shopperDocumentsMax)===340&&Number(r.readBudget?.hashConfigReadsMax)===1,'READ_BUDGET');
          for(const k of ['providerWrites','authWrites','firestoreWrites','hrWrites','rulesWrites','storageWrites','hostingDeploys','cloudRunDeploys','cloudBuilds','makeCalls','geminiCalls','paymentWrites'])ensure(Number(r.safety?.[k])===0,'UNSAFE_'+k);
          ensure(r.safety?.merge===false&&r.safety?.production===false,'RELEASE_SCOPE');
          console.log(JSON.stringify({head,parent,changed,authorized:true,sourceAttemptsFailClosed:2,targetProfileFingerprint:r.targetProfileFingerprint}));
          NODE

      - name: Static readonly gate
        run: |
          set -euo pipefail
          node --check "$TOOL_FILE"
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.TOOL_FILE,'utf8');
          const forbidden=[
            /await\s+auth\.(createUser|updateUser|deleteUser|setCustomUserClaims|importUsers)\s*\(/,
            /\.doc\s*\([^\n]*\)\s*\.set\s*\(/,
            /\.doc\s*\([^\n]*\)\s*\.update\s*\(/,
            /\.doc\s*\([^\n]*\)\s*\.delete\s*\(/,
            /firebase\s+deploy/i,/gcloud\s+/i,/cloud\s+run/i
          ];
          for(const re of forbidden)if(re.test(s))throw new Error('FORBIDDEN_SOURCE_PATTERN:'+re);
          for(const required of ['TARGET_PROFILE_FP','TARGET_AUTH_CANDIDATE_COUNT_','uniquePlanAssociation','passwordHashAvailable','passwordSaltState','fetchHashConfig','LEGACY_SHA256_ROUNDS1_SALTLESS_EXACT','AES-256-GCM','exactRollbackReconstructible','providerWrites:0','authWrites:0','firestoreWrites:0','hrWrites:0'])if(!s.includes(required))throw new Error('MISSING_GUARD:'+required);
          console.log('PASS_C6_ONE_TARGET_RESOLVER_PASSWORD_SNAPSHOT_STATIC_READONLY');
          NODE

      - name: Download frozen source-safe plan artifact from GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          gh run download 31104541809 -n cxorbia-c6-equivalent-universe-provider-v22-31104541809 -D "$SOURCE_DIR"
          test -f "$SOURCE_DIR/plan-340-source-safe.json"

      - name: Load canonical DEV credential privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-one-target-resolver-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-one-target-resolver-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-one-target-resolver-private/credentials.json" >> "$GITHUB_ENV"

      - name: Install pinned Auth SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Execute one-target resolver and password snapshot
        id: assess
        run: |
          set +e
          CXORBIA_SOURCE_PLAN="$SOURCE_DIR/plan-340-source-safe.json" CXORBIA_ONE_TARGET_RESOLVER_OUT="$EXPORT_DIR" node "$TOOL_FILE" "$REQUEST_FILE"
          code=$?
          decision=$(head -n 1 "$EXPORT_DIR/decision.txt" 2>/dev/null || echo STOP_RETRY_C6_AUTH_ONE_TARGET_RESOLVER_PASSWORD_SNAPSHOT_READONLY_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$code" != '0' ] && [ "$code" != '2' ]; then exit "$code"; fi
          exit 0

      - name: Verify source-safe evidence and budgets
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const e=require('./.tmp/c6-auth-one-target-resolver-password/export/evidence-source-safe.json');
          if(e.target?.profileFingerprint!=='ac93d90d9e41512acdcd')throw new Error('TARGET_DRIFT');
          if(e.safety?.providerWrites!==0||e.safety?.authWrites!==0||e.safety?.firestoreWrites!==0||e.safety?.hrWrites!==0)throw new Error('WRITE_SAFETY_DRIFT');
          if((e.providerRead?.authDirectoryPages||0)>1||(e.providerRead?.shopperIndexQueries||0)>1||(e.providerRead?.shopperDocumentsRead||0)>340||(e.providerRead?.hashConfigReads||0)>1)throw new Error('READ_BUDGET_EXCEEDED');
          const raw=JSON.stringify(e);
          if(raw.includes('@auth.cxorbia.invalid'))throw new Error('EMAIL_LEAK');
          if(/"uid"\s*:/.test(raw))throw new Error('UID_LEAK');
          if(/passwordHashBase64|passwordSaltBase64/.test(raw))throw new Error('HASH_OR_SALT_LEAK');
          if(e.decision?.startsWith('PASS_')){
            if(e.resolution?.candidateCount!==1||e.resolution?.uniquePlanAssociation!==true||e.restoration?.exactRollbackReconstructible!==true||e.snapshot?.created!==true||e.snapshot?.roundtripVerified!==true)throw new Error('PASS_INVARIANT_FAILED');
            if(!fs.existsSync('./.tmp/c6-auth-one-target-resolver-password/export/rollback-one-target.enc.json'))throw new Error('ENCRYPTED_SNAPSHOT_MISSING');
          }
          console.log(JSON.stringify({decision:e.decision,candidateCount:e.resolution?.candidateCount||0,uniquePlanAssociation:Boolean(e.resolution?.uniquePlanAssociation),passwordHashAvailable:Boolean(e.passwordState?.passwordHashAvailable),passwordSaltState:e.passwordState?.passwordSaltState||'UNKNOWN',legacyHashMatches:Boolean(e.passwordState?.legacyHashMatches),providerHashAlgorithmClass:e.passwordState?.providerHashAlgorithmClass||'UNKNOWN',exactRollbackReconstructible:Boolean(e.restoration?.exactRollbackReconstructible),snapshotCreated:Boolean(e.snapshot?.created),providerWrites:0,authWrites:0,firestoreWrites:0,hrWrites:0}));
          NODE

      - name: Upload encrypted snapshot and source-safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-one-target-resolver-password-snapshot-readonly-${{ github.run_id }}
          path: .tmp/c6-auth-one-target-resolver-password/export
          if-no-files-found: error
          retention-days: 14

      - name: Publish observable decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.assess.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          DESC="${DECISION:-STOP_RETRY_C6_AUTH_ONE_TARGET_RESOLVER_PASSWORD_SNAPSHOT_READONLY_NO_DECISION}"
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; fi
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-one-target-resolver-password-snapshot-readonly' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/c6-auth-one-target-resolver-private
