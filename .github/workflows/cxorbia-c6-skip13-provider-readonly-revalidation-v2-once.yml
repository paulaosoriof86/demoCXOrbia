name: CXOrbia C6 SKIP13 Provider Readonly Revalidation V2 Once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-c6-skip13-provider-readonly-revalidation-v2-once
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/c6-skip13-auth-access-adjudication-request-v2.json
  CONTRACT_FILE: backend/contracts/c6-skip13-auth-access-adjudication-v2.json
  TOOL_FILE: tools/qa/cxorbia-c6-skip13-auth-access-adjudication-readonly-v2.mjs
  EQUIV_FILE: tools/qa/cxorbia-c6-shopper-equivalent-universe.mjs
  OUT_DIR: .tmp/c6-skip13-auth-access-adjudication-v2
  PRIVATE_DIR: .tmp/c6-skip13-auth-access-adjudication-private-v2
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  adjudicate:
    name: Root-gate and adjudicate SKIP13 read-only v2
    if: >-
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'docs-tya-v6-v71-audit' &&
      github.event.pull_request.base.ref == 'release/cxorbia-tya-rc-20260630'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exclude ephemeral evidence
        run: printf '%s\n' '.tmp/' 'gha-creds-*.json' >> .git/info/exclude

      - name: Static namespace and harness gate
        run: |
          set -euo pipefail
          node --check "$EQUIV_FILE"
          node --check "$TOOL_FILE"
          out="$(node "$EQUIV_FILE" --self-test)"
          test "$out" = 'PASS_C6_EQUIVALENT_UNIVERSE_SOURCE_STATIC'
          test "$(printf '%s\n' "$out" | wc -l | tr -d ' ')" = '1'
          node --input-type=module <<'NODE'
          const chunks=[];
          const original=process.stdout.write.bind(process.stdout);
          process.stdout.write=(chunk,...args)=>{ chunks.push(String(chunk)); return true; };
          process.argv.push('--self-test');
          await import('./tools/qa/cxorbia-c6-shopper-equivalent-universe.mjs');
          process.stdout.write=original;
          if(chunks.join('').trim()) throw new Error('IMPORTED_MODULE_SELFTEST_SIDE_EFFECT_PRESENT');
          NODE
          node "$TOOL_FILE" --self-test > /tmp/skip13-self-test.jsonl
          test "$(wc -l < /tmp/skip13-self-test.jsonl | tr -d ' ')" = '1'
          node <<'NODE'
          const fs=require('fs');
          const contract=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const self=JSON.parse(fs.readFileSync('/tmp/skip13-self-test.jsonl','utf8'));
          const adjud=fs.readFileSync(process.env.TOOL_FILE,'utf8');
          const fp=contract.fingerprintContract||{};
          if(contract.schemaVersion!=='cxorbia.c6.skip13-auth-access-adjudication.contract.v2') throw new Error('CONTRACT_SCHEMA_DRIFT');
          if(fp.profileFingerprintNamespace!=='deterministic-suffix-plan-profile') throw new Error('PROFILE_NAMESPACE_DRIFT');
          if(fp.authCandidateFingerprintNamespace!=='shopper-auth-candidate-v1') throw new Error('AUTH_CANDIDATE_NAMESPACE_DRIFT');
          if(fp.memberProvenanceFingerprintNamespace!=='shopper-collision-member-v1') throw new Error('MEMBER_NAMESPACE_DRIFT');
          if(fp.multiAuthProfileFingerprintNamespace!=='multi-auth-profile-v1') throw new Error('MULTIAUTH_NAMESPACE_DRIFT');
          if(fp.crossNamespaceEqualityAllowed!==false) throw new Error('CROSS_NAMESPACE_EQUALITY_DRIFT');
          const forbidden=fp.forbiddenProfileJoinNamespaces||[];
          if(!forbidden.includes('shopper-collision-member-v1')||!forbidden.includes('multi-auth-profile-v1')) throw new Error('FORBIDDEN_JOIN_DRIFT');
          if(self.decision!=='PASS_C6_SKIP13_FINGERPRINT_NAMESPACE_SELF_TEST') throw new Error('SELFTEST_NOT_PASS');
          if(!adjud.includes('stablePlanProfileFingerprint(doc.id)')) throw new Error('PLANNER_JOIN_MISSING');
          if(adjud.includes('stableMemberFingerprint(doc.id)')) throw new Error('MEMBER_JOIN_PRESENT');
          console.log('PASS_C6_SKIP13_V2_STATIC_ROOT_GATE');
          NODE

      - name: Determine exact v2 request-only event
        id: request
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          let x={};
          if(fs.existsSync(process.env.REQUEST_FILE)) x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const requestOnly=changed.length===1&&changed[0]===process.env.REQUEST_FILE;
          const executable=x.schemaVersion==='cxorbia.c6.skip13-auth-access-adjudication.request.v2'&&x.enabled===true&&x.consumed===false&&x.status==='authorized_execute_once'&&x.targetHeadSha===parent&&head===process.env.HEAD_SHA&&requestOnly;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`executable=${executable?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target=${x.targetHeadSha||''}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`request_id=${x.requestId||''}\n`);
          console.log(JSON.stringify({head,parent,requestOnly,executable,changedCount:changed.length}));
          NODE

      - name: Record source-only non-request event
        if: steps.request.outputs.executable != 'true'
        run: echo 'Source gate PASS; not the exact authorized request-only commit; zero provider reads executed.'

      - name: Claim one logical provider execution
        if: steps.request.outputs.executable == 'true'
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses" --paginate --jq '[.[] | select(.context=="cxorbia/c6-skip13-provider-readonly-v2/claim")] | length')
          if [ "$existing" != '0' ]; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state='pending' -f context='cxorbia/c6-skip13-provider-readonly-v2/claim' \
            -f description='CLAIMED_ONE_PROVIDER_READONLY_EXECUTION_V2' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Validate exact one-shot v2 request
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(x.schemaVersion!=='cxorbia.c6.skip13-auth-access-adjudication.request.v2') throw new Error('REQUEST_SCHEMA_INVALID');
          if(x.requestId!=='c6-skip13-auth-access-adjudication-v2-20260807-01') throw new Error('REQUEST_ID_INVALID');
          if(x.repository!=='paulaosoriof86/demoCXOrbia'||x.branch!=='docs-tya-v6-v71-audit'||Number(x.pullRequest)!==7) throw new Error('LANE_INVALID');
          if(x.enabled!==true||x.consumed!==false||x.status!=='authorized_execute_once'||x.authorizedBy!=='Paula'||Number(x.allowedExecutions)!==1) throw new Error('AUTHORIZATION_INVALID');
          if(x.targetHeadSha!==parent||head!==process.env.HEAD_SHA||changed.length!==1||changed[0]!==process.env.REQUEST_FILE) throw new Error('REQUEST_ONLY_SOURCE_LOCK_INVALID');
          if(x.firebaseProjectId!=='cxorbia-backend-dev'||x.tenantId!=='tya'||x.projectId!=='cinepolis') throw new Error('TARGET_INVALID');
          if(x.contract!==process.env.CONTRACT_FILE) throw new Error('CONTRACT_INVALID');
          if(x.scope?.auth!==true||x.scope?.claims!==true||x.scope?.memberships!==true||x.scope?.profileIdIndex!==true||x.scope?.hr!==false||x.scope?.providerWrites!==false) throw new Error('SCOPE_INVALID');
          if(!Array.isArray(x.profileFingerprints)||x.profileFingerprints.length!==13||new Set(x.profileFingerprints).size!==13||!x.profileFingerprints.includes('7cc28c78de9bfda01d14')) throw new Error('SKIP13_SET_INVALID');
          if(x.blockingProfileFingerprint!=='7cc28c78de9bfda01d14') throw new Error('BLOCKING_PROFILE_INVALID');
          const expected=['4e6d26551d11db444bd0','9b2b7ca1bd72c1301d29'].sort();
          const actual=(x.blockingCandidateFingerprints||[]).slice().sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error('BLOCKING_CANDIDATES_INVALID');
          for(const key of ['authWrites','passwordChanges','passwordResets','membershipWrites','firestoreWrites','rulesWrites','storageWrites','hrWrites','deploy','merge','production','make','gemini','payments']) if(x.safeState?.[key]!==false) throw new Error('UNSAFE_'+key);
          NODE

      - name: Install transient Firebase Admin dependency
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0

      - name: Prepare clean-project credential privately
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p "$PRIVATE_DIR" "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let parsed=null; try{parsed=JSON.parse(raw);}catch{}
          if(!(parsed&&parsed.type==='service_account'&&parsed.project_id==='cxorbia-backend-dev'&&parsed.client_email&&parsed.private_key)) throw new Error('CREDENTIAL_INVALID');
          fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE

      - name: Execute one logical SKIP13 v2 adjudication
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        id: adjudication
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.tmp/c6-skip13-auth-access-adjudication-private-v2/credentials.json
          CXORBIA_TARGET_HEAD: ${{ steps.request.outputs.target }}
        run: |
          set +e
          node "$TOOL_FILE" "$REQUEST_FILE"
          code=$?
          decision=$(head -n 1 "$OUT_DIR/decision.txt" 2>/dev/null || echo HOLD_C6_SKIP13_V2_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture repository delta evidence
        if: always() && steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: |
          mkdir -p "$OUT_DIR/repository-status"
          git status --porcelain=v1 > "$OUT_DIR/repository-status/status.txt"
          git diff --name-status > "$OUT_DIR/repository-status/tracked.txt"
          git ls-files --others --exclude-standard > "$OUT_DIR/repository-status/untracked.txt"

      - name: Upload source-safe evidence
        if: always() && steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-skip13-provider-readonly-v2-${{ github.run_id }}
          path: |
            .tmp/c6-skip13-auth-access-adjudication-v2
            .tmp/cxorbia-readonly-post-gates-runner
          if-no-files-found: error
          retention-days: 14

      - name: Publish observable v2 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.adjudication.outputs.exit_code }}
          DECISION: ${{ steps.adjudication.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          DESC='PASS_C6_SKIP13_V2_SOURCE_GATE_NON_REQUEST'
          if [ '${{ steps.request.outputs.executable }}' = 'true' ] && [ '${{ steps.claim.outputs.claimed }}' != 'true' ]; then
            DESC='SKIPPED_DUPLICATE_EXECUTION_PREVENTED_V2'
          elif [ '${{ steps.request.outputs.executable }}' = 'true' ]; then
            if [ "${EXIT_CODE:-999}" = '0' ]; then DESC="${DECISION:-PASS_C6_SKIP13_V2_COMPLETED}"; else STATE=failure; DESC='HOLD_C6_SKIP13_V2_TECHNICAL_ERROR'; fi
          fi
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" -f context='cxorbia/c6-skip13-provider-readonly-v2/overall' -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Finalize v2 claim status
        if: always() && steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; desc='COMPLETED_ONE_PROVIDER_READONLY_EXECUTION_V2'
          if [ '${{ steps.adjudication.outputs.exit_code }}' != '0' ]; then state=failure; desc='COMPLETED_WITH_TECHNICAL_HOLD_V2'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context='cxorbia/c6-skip13-provider-readonly-v2/claim' -f description="$desc" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup private material
        if: always()
        run: rm -rf "$PRIVATE_DIR"

      - name: Enforce technical execution result
        if: steps.request.outputs.executable == 'true' && steps.claim.outputs.claimed == 'true'
        run: test "${{ steps.adjudication.outputs.exit_code }}" = '0'
