name: CXOrbia I3.11C R3-C DEV Hosting Materialization

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/i3-11-identity-link-runtime-bridge-rules-hosting-dev.json'

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-i3-11c-r3c-dev-hosting-materialization
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST: backend/config/i3-11-identity-link-runtime-bridge-rules-hosting-dev.json
  GCP_PROJECT_ID: cxorbia-backend-dev
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  OUT_DIR: .tmp/i3-11c-r3c-hosting-materialization
  DEPLOY_TREE: ${{ runner.temp }}/cxorbia-i3-11c-r3c-source
  CLAIM_CONTEXT: cxorbia/i3-11c-r3c-hosting/claim

jobs:
  r3c-hosting-materialize:
    name: R3-C one DEV Hosting deploy + remote parity only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact R3-C authorization and source lineage
        id: gate
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(r.schemaVersion!=='cxorbia.i3.11c.r3c.hosting-materialization.request.v1')throw new Error('request_schema_invalid');
          if(r.gateId!=='I3_11C_DEV_HOSTING_MATERIALIZE_CORRECTED_IDENTITY_RUNTIME_NO_PROVIDER_DATA_WRITES')throw new Error('gate_id_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||Number(r.pullRequest)!==7)throw new Error('repository_lane_invalid');
          if(r.firebaseProjectId!=='cxorbia-backend-dev'||r.hostingSite!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.devRootUrl!=='https://cxorbia-backend-dev.web.app')throw new Error('provider_target_invalid');
          if(r.enabled!==true||r.consumed!==false||r.status!=='authorized_execute_once'||r.authorizedBy!=='Paula')throw new Error('authorization_state_invalid');
          if(r.sourceHeadSha!==parent||!r.sourceHeadSha||head===parent)throw new Error('source_head_invalid');
          if(changed.length!==1||changed[0]!==process.env.REQUEST)throw new Error('request_commit_scope_invalid:'+changed.join(','));
          if(Number(r.allowedExecutions)!==1||Number(r.maxHostingDeploys)!==1)throw new Error('single_deploy_contract_invalid');
          for(const key of ['providerIdentityWrites','firestoreDataWrites','authWrites','rulesDeploys','hrWrites','storageWrites','makeCalls','geminiCalls','paymentWrites','historicalShopperAccess','cloudRunDeploys','staffRuntimeExecutions']){
            if(Number(r[key]||0)!==0)throw new Error('unsafe_scope_'+key);
          }
          if(r.merge!==false||r.production!==false||r.noAutomaticRetry!==true||r.automaticStaffRuntimeRetry!==false)throw new Error('unsafe_scope');
          fs.writeFileSync(process.env.OUT_DIR+'/authorization.json',JSON.stringify({requestId:r.requestId,gateId:r.gateId,sourceHeadSha:parent,requestCommitSha:head,authorizedBy:r.authorizedBy,maxHostingDeploys:1,noAutomaticRetry:true,automaticStaffRuntimeRetry:false},null,2)+'\n','utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`source_head=${parent}\nrequest_id=${r.requestId}\n`);
          NODE

      - name: Claim one logical execution
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/statuses" --paginate --jq "[.[] | select(.context==\"${CLAIM_CONTEXT}\")] | length")
          if [ "$existing" != "0" ]; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            echo 'R3-C already claimed; refusing repeat.'
            exit 0
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='pending' -f context="$CLAIM_CONTEXT" \
            -f description='CLAIMED_ONE_LOGICAL_R3C_HOSTING_EXECUTION' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Authenticate exact Firebase DEV
        if: steps.claim.outputs.claimed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient Firebase tooling
        if: steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools@latest >/dev/null 2>&1

      - name: Prepare exact authorized source and prove corrected contract
        if: steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          rm -rf "$DEPLOY_TREE"
          git worktree add --detach "$DEPLOY_TREE" "${{ steps.gate.outputs.source_head }}"
          test "$(git -C "$DEPLOY_TREE" rev-parse HEAD)" = "${{ steps.gate.outputs.source_head }}"
          cd "$DEPLOY_TREE"
          node --check app/adapters/cxorbia-provider-identity-link-runtime-v1.js
          node tools/qa/cxorbia-provider-identity-runtime-contract-parity-gate.mjs > "$GITHUB_WORKSPACE/$OUT_DIR/source-parity.json"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.OUT_DIR+'/source-parity.json','utf8'));
          if(p.decision!=='PASS_PROVIDER_IDENTITY_RUNTIME_CANONICAL_CONTRACT_PARITY'||p.targetMaterializedApplicable!==true||p.exactTechnicalOnly!==true||p.fuzzyMatching!==false||Number(p.providerWrites)!==0)throw new Error('corrected_contract_parity_failed');
          NODE
          sha256sum app/adapters/cxorbia-provider-identity-link-runtime-v1.js | awk '{print $1}' > "$GITHUB_WORKSPACE/$OUT_DIR/local-adapter-sha256.txt"

      - name: Deploy exact authorized source to Hosting DEV once
        if: steps.claim.outputs.claimed == 'true'
        id: deploy
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          cd "$DEPLOY_TREE"
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy \
            --config firebase.json \
            --only "hosting:$FIREBASE_HOSTING_TARGET" \
            --project "$GCP_PROJECT_ID" \
            --non-interactive
          echo 1 > "$GITHUB_WORKSPACE/$OUT_DIR/hosting-deploy-count.txt"

      - name: Verify served adapter exact parity
        if: steps.claim.outputs.claimed == 'true'
        id: parity
        run: |
          set -euo pipefail
          local_asset="$DEPLOY_TREE/app/adapters/cxorbia-provider-identity-link-runtime-v1.js"
          remote_asset="$OUT_DIR/remote-provider-identity-link-runtime-v1.js"
          ok=0
          for attempt in $(seq 1 40); do
            rm -f "$remote_asset"
            if curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' \
              "$DEV_ROOT_URL/adapters/cxorbia-provider-identity-link-runtime-v1.js?cxorbia_r3c=${GITHUB_SHA}-${attempt}" \
              -o "$remote_asset" && cmp "$local_asset" "$remote_asset"; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          sha256sum "$remote_asset" | awk '{print $1}' > "$OUT_DIR/remote-adapter-sha256.txt"
          test "$(cat "$OUT_DIR/local-adapter-sha256.txt")" = "$(cat "$OUT_DIR/remote-adapter-sha256.txt")"
          grep -q 'materialized' "$remote_asset"
          grep -q 'tenant_adjudication' "$remote_asset"
          grep -q 'fuzzyMatching:false' "$remote_asset"
          echo 'remote_parity=true' >> "$GITHUB_OUTPUT"

      - name: Build sanitized R3-C evidence
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.existsSync(p)?fs.readFileSync(p,'utf8').trim():null;
          const auth=fs.existsSync(process.env.OUT_DIR+'/authorization.json')?JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/authorization.json','utf8')):null;
          const parity=fs.existsSync(process.env.OUT_DIR+'/source-parity.json')?JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/source-parity.json','utf8')):null;
          const deploys=Number(read(process.env.OUT_DIR+'/hosting-deploy-count.txt')||0);
          const localSha=read(process.env.OUT_DIR+'/local-adapter-sha256.txt');
          const remoteSha=read(process.env.OUT_DIR+'/remote-adapter-sha256.txt');
          const pass=deploys===1&&parity?.decision==='PASS_PROVIDER_IDENTITY_RUNTIME_CANONICAL_CONTRACT_PARITY'&&localSha&&remoteSha&&localSha===remoteSha;
          const out={schemaVersion:'cxorbia.i3.11c.r3c.hosting-materialization.evidence.v1',generatedAt:new Date().toISOString(),decision:pass?'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY':'HOLD_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION',authorization:auth,hostingDeploys:deploys,sourceParity:parity?.decision||null,localAdapterSha256:localSha,remoteAdapterSha256:remoteSha,remoteExactByteParity:!!(localSha&&remoteSha&&localSha===remoteSha),safety:{providerIdentityWrites:0,firestoreDataWrites:0,authWrites:0,rulesDeploys:0,hrWrites:0,storageWrites:0,makeCalls:0,geminiCalls:0,paymentWrites:0,historicalShopperAccess:0,cloudRunDeploys:0,staffRuntimeExecutions:0,merge:false,production:false},nextGate:pass?'NEW_AUTH_REQUIRED_I3_11C_STAFF_RUNTIME_CANONICAL_IDENTITY_CLOSE_READONLY_AFTER_HOSTING':'STOP_NO_AUTOMATIC_RETRY'};
          fs.writeFileSync(process.env.OUT_DIR+'/result.json',JSON.stringify(out,null,2)+'\n','utf8');
          NODE

      - name: Upload sanitized R3-C evidence
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: i3-11c-r3c-hosting-materialization-${{ github.run_id }}
          path: .tmp/i3-11c-r3c-hosting-materialization
          if-no-files-found: error
          retention-days: 14

      - name: Finalize one-shot claim
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          decision=$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/result.json','utf8'));process.stdout.write(String(x.decision||'HOLD_NO_DECISION'));}catch{process.stdout.write('HOLD_NO_RESULT');}")
          state=success
          if [ "$decision" != 'PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY' ]; then state=failure; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$CLAIM_CONTEXT" \
            -f description="$(printf '%s' "$decision" | cut -c1-140)" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup ephemeral source/tooling
        if: always()
        run: |
          git worktree remove --force "$DEPLOY_TREE" 2>/dev/null || true
          rm -rf .firebase
          rm -f firebase-debug.log

      - name: Enforce R3-C result
        if: steps.claim.outputs.claimed == 'true'
        run: |
          node -e "const r=require('./$OUT_DIR/result.json'); if(r.decision!=='PASS_I3_11C_R3C_DEV_HOSTING_MATERIALIZATION_REMOTE_PARITY') process.exit(1);"
