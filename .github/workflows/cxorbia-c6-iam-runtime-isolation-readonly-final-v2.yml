name: CXOrbia C6 IAM Runtime Isolation Readonly Final V2

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/c6-iam-runtime-isolation-readonly-final-request-v2.json
  OUT_DIR: .tmp/c6-iam-runtime-isolation-readonly-final-v2
  GCP_PROJECT_ID: cxorbia-backend-dev
  TARGET_SA_EMAIL: cxorbia-c6-runner-dev@cxorbia-backend-dev.iam.gserviceaccount.com
  REVIEWER_SA_EMAIL: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  TEMP_ROLE: roles/iam.securityReviewer
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  verify:
    name: Final read-only runtime isolation verification
    if: >-
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'docs-tya-v6-v71-audit' &&
      github.event.pull_request.base.ref == 'release/cxorbia-tya-rc-20260630'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact one-shot request
        id: request
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const p=process.env.REQUEST_FILE;
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const falseKeys=['iamWrites','deploy','providerReads','providerWrites','skip13Execution','authReads','authWrites','hrReads','hrWrites','firestoreReads','firestoreWrites','rulesWrites','storageReads','storageWrites','hostingDeploy','cloudRunDeploy','cloudBuildWrites','merge','production','make','gemini','payments'];
          const ok=
            x.schemaVersion==='cxorbia.c6.iam-runtime-isolation-readonly-final.request.v2' &&
            x.requestId==='c6-iam-runtime-isolation-readonly-final-20260807-01' &&
            x.enabled===true && x.consumed===false && x.status==='authorized_execute_once' &&
            x.authorizedBy==='Paula' && Number(x.allowedExecutions)===1 &&
            x.repository==='paulaosoriof86/demoCXOrbia' && x.branch==='docs-tya-v6-v71-audit' && Number(x.pullRequest)===7 &&
            x.environment==='DEV' && x.providerProject===process.env.GCP_PROJECT_ID &&
            x.targetServiceAccount===process.env.TARGET_SA_EMAIL && x.reviewerServiceAccount===process.env.REVIEWER_SA_EMAIL &&
            x.temporaryRole===process.env.TEMP_ROLE && x.sourceLockMode==='github.event.pull_request.head.sha' &&
            x.expectedParentHeadSha===parent && head===process.env.PR_HEAD_SHA &&
            changed.length===1 && changed[0]===p &&
            x.scope?.describeIdentity===true && x.scope?.listUserManagedKeys===true &&
            x.scope?.readServiceAccountIamPolicy===true && x.scope?.readProjectIamPolicy===true &&
            x.scope?.confirmTemporaryReviewerRolePresent===true && x.scope?.generateFinalFingerprint===true &&
            falseKeys.every(k=>x.safeState?.[k]===false);
          if(!ok) throw new Error('IAM_RUNTIME_ISOLATION_FINAL_REQUEST_INVALID');
          fs.writeFileSync(process.env.OUT_DIR+'/request-source-safe.json',JSON.stringify({requestId:x.requestId,sourceLock:head,parent,changed,target:x.targetServiceAccount,reviewer:x.reviewerServiceAccount,temporaryRole:x.temporaryRole,safeState:x.safeState},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`request_id=${x.requestId}\nsource_lock=${head}\n`);
          NODE

      - name: Claim single final read-only verification
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses" --paginate --jq '[.[] | select(.context=="cxorbia/c6-iam-runtime-isolation-final-v2/claim")] | length')
          if [ "$existing" != '0' ]; then echo 'claimed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state='pending' -f context='cxorbia/c6-iam-runtime-isolation-final-v2/claim' \
            -f description='CLAIMED_SINGLE_FINAL_IAM_READONLY_VERIFICATION' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Stop duplicate before Google Cloud
        if: steps.claim.outputs.claimed != 'true'
        run: exit 2

      - name: Authenticate DEV control-plane identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Verify runtime isolation read-only
        run: |
          set -euo pipefail
          active=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          test "$active" = "$REVIEWER_SA_EMAIL"
          printf '%s\n' "$active" > "$OUT_DIR/active-account.txt"

          gcloud iam service-accounts describe "$TARGET_SA_EMAIL" --project "$GCP_PROJECT_ID" --format=json > "$OUT_DIR/identity.json"
          gcloud iam service-accounts keys list --iam-account "$TARGET_SA_EMAIL" --project "$GCP_PROJECT_ID" --managed-by=user --format=json > "$OUT_DIR/user-managed-keys.json"
          gcloud iam service-accounts get-iam-policy "$TARGET_SA_EMAIL" --project "$GCP_PROJECT_ID" --format=json > "$OUT_DIR/service-account-iam-policy.json"
          gcloud projects get-iam-policy "$GCP_PROJECT_ID" --format=json > "$OUT_DIR/project-iam-policy.json"

          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const out=process.env.OUT_DIR;
          const read=n=>JSON.parse(fs.readFileSync(`${out}/${n}`,'utf8'));
          const identity=read('identity.json');
          const keys=read('user-managed-keys.json');
          const saPolicy=read('service-account-iam-policy.json');
          const projectPolicy=read('project-iam-policy.json');
          const target=process.env.TARGET_SA_EMAIL;
          const reviewer=process.env.REVIEWER_SA_EMAIL;
          const tempRole=process.env.TEMP_ROLE;
          const targetMember=`serviceAccount:${target}`;
          const reviewerMember=`serviceAccount:${reviewer}`;
          const saBindings=Array.isArray(saPolicy.bindings)?saPolicy.bindings:[];
          const targetRoles=(projectPolicy.bindings||[]).filter(b=>(b.members||[]).includes(targetMember)).map(b=>b.role).sort();
          const reviewerTemp=(projectPolicy.bindings||[]).filter(b=>b.role===tempRole && (b.members||[]).includes(reviewerMember));
          const enabled=identity.disabled!==true;
          const pass=identity.email===target && enabled && String(identity.uniqueId||'')!=='' && Array.isArray(keys) && keys.length===0 && saBindings.length===0 && targetRoles.length===0 && reviewerTemp.length===1;
          const fingerprintInput={email:identity.email,uniqueId:String(identity.uniqueId||''),disabled:identity.disabled===true,userManagedKeys:keys,serviceAccountIamPolicy:saBindings,projectRoles:targetRoles};
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(fingerprintInput)).digest('hex');
          const result={schemaVersion:'cxorbia.c6.iam-runtime-isolation-readonly-final.result.v2',decision:pass?'PASS_ISOLATED_RUNTIME_IDENTITY':'STOP_RETRY_RUNTIME_IDENTITY_NOT_ISOLATED',project:process.env.GCP_PROJECT_ID,targetServiceAccount:target,reviewerServiceAccount:reviewer,temporaryRole:tempRole,identity:{exists:true,enabled,uniqueId:String(identity.uniqueId||''),oauth2ClientId:String(identity.oauth2ClientId||'')},checks:{userManagedKeyCount:keys.length,directServiceAccountBindingCount:saBindings.length,projectRoleCount:targetRoles.length,temporaryReviewerBindingCount:reviewerTemp.length},targetProjectRoles:targetRoles,fingerprint:{value:fingerprint,final:pass,status:pass?'FINAL_ISOLATED_IDENTITY':'NOT_FINAL'},safeState:{iamWrites:0,deploys:0,providerReads:0,providerWrites:0,skip13Executed:false,merge:false,production:false},nextRequiredAction:'REMOVE_TEMPORARY_SECURITY_REVIEWER_AND_VERIFY_REVOCATION'};
          fs.writeFileSync(`${out}/verification-result.json`,JSON.stringify(result,null,2)+'\n');
          fs.writeFileSync(`${out}/decision.txt`,result.decision+'\n');
          console.log(JSON.stringify(result,null,2));
          if(!pass) process.exit(23);
          NODE

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-iam-runtime-isolation-readonly-final-v2-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Publish terminal statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; desc='STOP_RETRY_C6_IAM_RUNTIME_ISOLATION_FINAL_V2'
          if [ "$JOB_STATE" = 'success' ]; then state=success; desc='PASS_C6_IAM_RUNTIME_ISOLATION_FINAL_V2'; fi
          for context in cxorbia/c6-iam-runtime-isolation-final-v2/overall cxorbia/c6-iam-runtime-isolation-final-v2/claim; do
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
              -f state="$state" -f context="$context" -f description="$desc" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          done
