name: CXOrbia C6 Live HR Domain Readonly Audit

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-live-domain-readonly-audit-request.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-c6-live-domain-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOT_URL: https://cxorbia-backend-dev.web.app
      OUT: .tmp/c6-live-domain-audit
      REQUEST: backend/config/corte6-live-domain-readonly-audit-request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate read-only request
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          if(r.schemaVersion!=='cxorbia.c6.live-domain-readonly-audit-request.v1'||r.enabled!==true||r.consumed!==false)throw new Error('request_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.environment!=='DEV')throw new Error('target_invalid');
          for(const k of ['hostingDeploys','cloudRunDeploys','firestoreWrites','authWrites','rulesDeploys','storageWrites','hrWrites','makeWrites','geminiCalls','paymentsWrites'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          if(r.merge!==false||r.production!==false)throw new Error('unsafe_scope');
          NODE

      - name: Static canonical domain gate
        run: |
          set -euo pipefail
          node --check app/adapters/tya-cumulative-read-model-v2.js
          node --check app/adapters/tya-live-source-refresh-watch-v2.js
          node --check app/adapters/tya-c6-domain-consistency-bridge.js
          node tools/qa/tya-c6-domain-consistency-regression-gate.mjs > "$OUT/local-gate.json"

      - name: Fetch current live HR source read-only
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 "$ROOT_URL/api/tya/cinepolis/hr-live?view=operational-names&cxOperationalPreview=YES_PAULA_20260731_NAMES_DEV&format=json&fresh=1" -o "$OUT/hr.json"

      - name: Audit every live HR visit and canonical state
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};vm.createContext(sandbox);vm.runInContext(fs.readFileSync('app/adapters/tya-cumulative-read-model-v2.js','utf8'),sandbox);
          const engine=sandbox.window.CX_TYA_CUMULATIVE_READ_MODEL;const raw=JSON.parse(fs.readFileSync(process.env.OUT+'/hr.json','utf8'));const runtime=raw._runtime||{};delete raw._runtime;
          const visits=Array.isArray(raw.visits)?raw.visits:[],periods=Array.isArray(raw.periods)?raw.periods:[],shoppers=Array.isArray(raw.shoppers)?raw.shoppers:[];
          const summary=engine.periodSummary(visits),july=summary.find(x=>x.periodKey==='2026-07');
          const idDup=visits.length-new Set(visits.map(v=>String(v.hrRowId||v.visitId||v.id||''))).size;
          const shopperIds=shoppers.map(s=>String(s.shopperId||s.id||'')).filter(Boolean);
          const shopperIdDup=shopperIds.length-new Set(shopperIds).size;
          const expected={total:44,GT:34,HN:10,realized:40,questionnaireCompleted:38,submitted:33,outOfRange:1};
          const observed={total:july?.total??null,GT:july?.byCountry?.GT??null,HN:july?.byCountry?.HN??null,realized:july?.realized??null,questionnaireCompleted:july?.questionnaireCompleted??null,submitted:july?.submitted??null,outOfRange:july?.outOfRange??null};
          const assertions={periods14:periods.length===14,visits616:visits.length===616,runtimeRead:runtime.runtimeRead===true,sourceSafe:runtime.sourceSafe===true,julyPresent:!!july,julyTotal:observed.total===expected.total,julyGT:observed.GT===expected.GT,julyHN:observed.HN===expected.HN,julyRealized:observed.realized===expected.realized,julyQuestionnaire:observed.questionnaireCompleted===expected.questionnaireCompleted,julySubmitted:observed.submitted===expected.submitted,julyOutOfRange:observed.outOfRange===expected.outOfRange,duplicateVisitKeys:idDup===0,duplicateShopperIds:shopperIdDup===0};
          const failedAssertions=Object.entries(assertions).filter(([,ok])=>!ok).map(([name])=>name);
          const pass=failedAssertions.length===0;
          const evidence={schemaVersion:'cxorbia.c6.live-hr-domain-readonly-audit.v2',generatedAt:new Date().toISOString(),decision:pass?'PASS_C6_LIVE_HR_ROW_LEVEL_CANONICAL_STATE':'FAIL_C6_LIVE_HR_ROW_LEVEL_CANONICAL_STATE',source:{runtimeRead:runtime.runtimeRead===true,sourceSafe:runtime.sourceSafe===true,revision:runtime.revision||null,periods:periods.length,visits:visits.length,shoppers:shoppers.length},expectedFromApprovedHumanBaseline:expected,observedJuly:observed,july,assertions,failedAssertions,safety:{hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,merge:false,production:false}};
          fs.writeFileSync(process.env.OUT+'/evidence.json',JSON.stringify(evidence,null,2)+'\n');fs.writeFileSync(process.env.OUT+'/decision.txt',evidence.decision+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Persist sanitized PASS or FAIL evidence and consume request
        run: |
          set -euo pipefail
          DECISION="$(cat "$OUT/decision.txt")"
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/evidence.json" app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8')),decision=fs.readFileSync(process.env.OUT+'/decision.txt','utf8').trim();
          r.enabled=false;r.consumed=true;r.status=decision.startsWith('PASS_')?'consumed_pass':'consumed_fail';r.consumedAt=new Date().toISOString();r.decision=decision;fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json "$REQUEST"
          git commit -m "evidence: C6 live HR row-level audit ${DECISION}"
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Enforce audit decision
        run: |
          set -euo pipefail
          DECISION="$(cat "$OUT/decision.txt")"
          test "$DECISION" = 'PASS_C6_LIVE_HR_ROW_LEVEL_CANONICAL_STATE'

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success;DESC=PASS_C6_LIVE_HR_DOMAIN_READONLY
          if [ '${{ job.status }}' != 'success' ]; then STATE=error;DESC=FAIL_C6_LIVE_HR_DOMAIN_READONLY; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/c6-live-hr-domain-readonly/$DESC" -f description="$DESC" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf "$OUT"
