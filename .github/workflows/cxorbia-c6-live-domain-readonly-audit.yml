name: CXOrbia C6 Human Login Wrapper Readonly Diagnostic

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-live-domain-readonly-audit-request.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-c6-human-login-wrapper-readonly
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT_URL: https://cxorbia-backend-dev.web.app
      OUT: .tmp/c6-human-login-wrapper
      REQUEST: backend/config/corte6-live-domain-readonly-audit-request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate request and prerequisites
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          if(r.schemaVersion!=='cxorbia.c6.live-domain-readonly-audit-request.v1'||r.enabled!==true||r.consumed!==false)throw new Error('request_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.environment!=='DEV')throw new Error('target_invalid');
          for(const k of ['hostingDeploys','cloudRunDeploys','firestoreWrites','authWrites','rulesDeploys','storageWrites','hrWrites','makeWrites','geminiCalls','paymentsWrites'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          if(r.merge!==false||r.production!==false)throw new Error('unsafe_scope');
          const live=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json','utf8'));
          if(live.decision!=='PASS_C6_LIVE_HR_DYNAMIC_CANONICAL_STATE')throw new Error('live_hr_dynamic_prerequisite_not_pass');
          NODE
          node --check tools/qa/tya-c6-human-login-wrapper-diagnostic.mjs
          node tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs > "$OUT/unified-gate.log" 2>&1

      - name: Install transient browser tooling
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Start local server
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --directory app > "$OUT/local-http.log" 2>&1 &
          echo $! > "$OUT/local-http.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index-backend-dev.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 2

      - name: Execute wrapper diagnostic
        id: diagnostic
        run: |
          set +e
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_LOGIN_DIAGNOSTIC_OUTPUT="$OUT/login-wrapper-diagnostic.json"
          node tools/qa/tya-c6-human-login-wrapper-diagnostic.mjs http://127.0.0.1:4173 > "$OUT/diagnostic.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s "$OUT/login-wrapper-diagnostic.json"
          exit 0

      - name: Persist exact diagnostic
        run: |
          set -euo pipefail
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/login-wrapper-diagnostic.json" app/docs/evidence/CORTE6-HUMAN-LOGIN-WRAPPER-DIAGNOSTIC-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          const e=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-HUMAN-LOGIN-WRAPPER-DIAGNOSTIC-LATEST.json','utf8'));
          r.enabled=false;r.consumed=true;r.status=e.decision.startsWith('PASS_')?'consumed_pass':'consumed_fail';r.consumedAt=new Date().toISOString();r.decision=e.decision;r.nextGate=e.decision.startsWith('PASS_')?'UNIFIED_HUMAN_AUTH_STAFF_SHOPPER':'APPLY_FOCAL_LOGIN_WRAPPER_ROOT_FIX';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-HUMAN-LOGIN-WRAPPER-DIAGNOSTIC-LATEST.json "$REQUEST"
          git commit -m 'evidence: C6 human login wrapper diagnostic'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          STATE=success; DESC=PASS_C6_HUMAN_LOGIN_WRAPPER
          if [ "$EXIT_CODE" != '0' ]; then STATE=error; DESC=FAIL_C6_HUMAN_LOGIN_WRAPPER; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/c6-human-login-wrapper/$DESC" -f description="$DESC" >/dev/null

      - name: Enforce diagnostic
        run: test "${{ steps.diagnostic.outputs.exit_code }}" = '0'

      - name: Cleanup
        if: always()
        run: rm -rf "$OUT"
