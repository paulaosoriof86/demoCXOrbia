name: CXOrbia C6 Existing Hosting DEV Remote Gates

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-live-domain-readonly-audit-request.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-c6-existing-hosting-remote-gates
  cancel-in-progress: false

jobs:
  remote-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: cxorbia-backend-dev
      ROOT_URL: https://cxorbia-backend-dev.web.app
      LIVE_ENDPOINT: /api/tya/cinepolis/hr-live
      REQUEST: backend/config/corte6-live-domain-readonly-audit-request.json
      PRIOR_FAILURE: app/docs/evidence/CORTE6-HOSTING-DEV-DEPLOY-REMOTE-GATES-FAILURE-LATEST.json
      OUT: .tmp/c6-existing-hosting-remote-gates
      PRIVATE_DIR: .tmp/c6-existing-hosting-private
      STAFF_SHOPPER_PRIVATE: .tmp/c6-existing-hosting-private/staff-shopper.json
      CLIENT_PRIVATE: .tmp/c6-existing-hosting-private/client.json
      CLIENT_SNAPSHOT_PRIVATE: .tmp/c6-existing-hosting-private/client-snapshot.json
      COMBINED_PRIVATE: .tmp/c6-existing-hosting-private/all-roles.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate read-only continuation source lock and deployed release evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          echo validate_remote_continuation > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          if(r.schemaVersion!=='cxorbia.c6.live-domain-readonly-audit-request.v1'||r.enabled!==true||r.consumed!==false)throw new Error('request_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.pullRequest!==7||r.environment!=='DEV')throw new Error('target_invalid');
          if(r.scope!=='existing_hosting_dev_remote_cumulative_gates_only')throw new Error('scope_invalid');
          if(r.targetProjectId!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.hostingSite!=='cxorbia-backend-dev')throw new Error('hosting_target_invalid');
          const a=r.authorization||{};
          if(a.paulaExplicitInCurrentConversation!==true||a.continuationAfterSuccessfulDeploy!==true||a.noHostingDeploy!==true)throw new Error('remote_continuation_authorization_missing');
          if(a.noAutomaticSecondDeploy!==true)throw new Error('no_automatic_second_deploy_contract_missing');
          if(Number(r.hostingDeploys)!==0||Number(r.maxHostingDeploys)!==0)throw new Error('remote_only_hosting_contract_invalid');
          for(const k of ['cloudRunDeploys','firestoreWrites','authWrites','rulesDeploys','storageWrites','hrWrites','makeWrites','geminiCalls','paymentsWrites'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          if(r.merge!==false||r.production!==false)throw new Error('unsafe_scope');
          if(!/^[a-f0-9]{40}$/.test(r.sourceLockHead||''))throw new Error('source_lock_invalid');
          cp.execFileSync('git',['cat-file','-e',r.sourceLockHead+'^{commit}']);
          const changed=cp.execFileSync('git',['diff','--name-only',r.sourceLockHead+'..HEAD','--','app'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const runtimeChanged=changed.filter(p=>!p.startsWith('app/docs/'));
          const documentationDrift=changed.filter(p=>p.startsWith('app/docs/'));
          if(runtimeChanged.length)throw new Error('app_runtime_drift:'+runtimeChanged.join(','));
          const criticalRuntimePaths=['index-backend-dev.html','core/backend-browser-auth.js','core/tya-phase-a-source-safe-preview.js','adapters/tya-c6-unified-human-runtime-v1.js','adapters/tya-c6-shopper-auth-click-guard-v1.js','adapters/tya-protected-auth-hr-authority-bridge-v2.js','adapters/tya-cumulative-read-model-v2.js','adapters/tya-c6-domain-consistency-bridge.js','adapters/tya-canonical-shopper-portal-v2.js','adapters/tya-canonical-finance-read-model-v2.js','adapters/tya-project-financial-model-contract-v1.js','adapters/tya-delegated-coordination-finance-guard-v1.js','adapters/tya-canonical-reservations-guard-v2.js','modules/cliente.js','modules/finanzas.js','app.js'];
          const hashes=[];
          for(const rel of criticalRuntimePaths){
            const locked=cp.execFileSync('git',['show',`${r.sourceLockHead}:app/${rel}`]);
            const current=fs.readFileSync(`app/${rel}`);
            const lockedSha=crypto.createHash('sha256').update(locked).digest('hex');
            const currentSha=crypto.createHash('sha256').update(current).digest('hex');
            if(lockedSha!==currentSha)throw new Error('critical_runtime_drift:'+rel);
            hashes.push({path:rel,sha256:currentSha});
          }
          const prior=JSON.parse(fs.readFileSync(process.env.PRIOR_FAILURE,'utf8'));
          if(prior.decision!=='FAIL_C6_REMOTE_GATES_AFTER_SINGLE_DEV_HOSTING_DEPLOY'||prior.failedStage!=='remote_parity'||prior.deploySucceeded!==true||Number(prior.safety?.hostingDeploys||0)!==1)throw new Error('successful_deploy_evidence_missing');
          if(r.deployedRequestId!=='c6-hosting-dev-deploy-remote-gates-20260802-04'||r.deployedTriggerHead!=='405d8d405e2bf69918d0124b61c179171d5c678a')throw new Error('deployed_release_reference_invalid');
          const fb=JSON.parse(fs.readFileSync('firebase.deploy.json','utf8'));
          const rewrites=Array.isArray(fb.hosting?.rewrites)?fb.hosting.rewrites:[];
          const liveIndex=rewrites.findIndex(x=>x?.source==='/api/tya/cinepolis/hr-live'&&x?.run?.serviceId==='cxorbia-live-hr-dev'&&x?.run?.region==='us-central1');
          const spaIndex=rewrites.findIndex(x=>x?.source==='**'&&x?.destination==='/index.html');
          if(fb.hosting?.target!=='cxorbia-dev'||fb.hosting?.public!=='app'||liveIndex<0||spaIndex<0||liveIndex>=spaIndex)throw new Error('deployed_root_config_invalid');
          const auth=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-CLIENT-AUTH-MATERIALIZATION-LATEST.json','utf8'));
          if(auth.decision!=='PASS_C6_CLIENT_AUTH_MATERIALIZED_AND_RUNTIME_VALIDATED'||auth.cumulativeDecision!=='PASS_C6_READONLY_AUTH_RUNTIME_ALL_ROLES')throw new Error('auth_multi_role_pass_missing');
          const domain=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json','utf8'));
          if(domain.decision!=='PASS_C6_LIVE_HR_DYNAMIC_CANONICAL_STATE')throw new Error('domain_pass_missing');
          const lock={schemaVersion:'cxorbia.c6.existing-hosting-remote-gates-source-lock.v2',generatedAt:new Date().toISOString(),sourceLockHead:r.sourceLockHead,triggerHead:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),runtimeSurfaceExact:true,runtimeChangedFiles:runtimeChanged,documentationDriftFiles:documentationDrift,criticalRuntimeManifestSha256:crypto.createHash('sha256').update(JSON.stringify(hashes)).digest('hex'),criticalRuntimeFiles:hashes,deployedRequestId:r.deployedRequestId,deployedTriggerHead:r.deployedTriggerHead,existingHostingReleaseConfirmed:true,hostingDeploysThisRun:0,production:false};
          fs.writeFileSync(process.env.OUT+'/source-lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
          node --check tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs
          node --check tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs
          node --check tools/qa/tya-c6-client-auth-browser-smoke.mjs
          node --check tools/qa/tya-c6-remote-domain-finance-portals-reservations-gate.mjs
          node --check tools/qa/tya-c6-remote-parity-gate.mjs
          node --check tools/qa/tya-c6-remote-finance-model-diagnostic.mjs
          node --check tools/qa/cxorbia-c6-existing-users-e2e-envelope-compat.mjs
          node --check tools/qa/cxorbia-c6-client-auth-materialization.mjs
          node tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs | tee "$OUT/static-gate.log"
          grep -q 'DECISION PASS_C6_UNIFIED_CUMULATIVE_RUNTIME_STATIC_GATE' "$OUT/static-gate.log"

      - name: Authenticate Google DEV read-only
        run: echo google_auth_readonly > "$OUT/stage"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient read-only tooling
        run: |
          set -euo pipefail
          echo install_readonly_tooling > "$OUT/stage"
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify Staff Shopper and Client credentials read-only
        run: |
          set -euo pipefail
          echo credentials_readonly > "$OUT/stage"
          export CXORBIA_EXPECTED_PROJECT="$GCP_PROJECT_ID"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$STAFF_SHOPPER_PRIVATE"
          export CXORBIA_PRIVATE_COMPAT_DIR="$PRIVATE_DIR"
          export OUT_DIR="$OUT"
          node tools/qa/cxorbia-c6-existing-users-e2e-envelope-compat.mjs > "$OUT/staff-shopper-selection.source-safe.json"
          export CXORBIA_CLIENT_AUTH_PRIVATE_SNAPSHOT="$CLIENT_SNAPSHOT_PRIVATE"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$CLIENT_PRIVATE"
          node tools/qa/cxorbia-c6-client-auth-materialization.mjs --mode=snapshot > "$OUT/client-snapshot.source-safe.json"
          node tools/qa/cxorbia-c6-client-auth-materialization.mjs --mode=readback > "$OUT/client-readback.source-safe.json"
          node <<'NODE'
          const fs=require('fs');
          const ss=JSON.parse(fs.readFileSync(process.env.STAFF_SHOPPER_PRIVATE,'utf8'));
          const cl=JSON.parse(fs.readFileSync(process.env.CLIENT_PRIVATE,'utf8'));
          const a=JSON.parse(fs.readFileSync(process.env.OUT+'/staff-shopper-selection.source-safe.json','utf8'));
          const b=JSON.parse(fs.readFileSync(process.env.OUT+'/client-readback.source-safe.json','utf8'));
          if(!ss.staff||!ss.shopper||!cl.client)throw new Error('private_credentials_incomplete');
          if(a.decision!=='PASS_C6_EXISTING_E2E_CREDENTIAL_SELECTION_V6'||b.decision!=='PASS_C6_CLIENT_AUTH_READBACK')throw new Error('credential_readback_not_pass');
          if(Number(a.authWrites||0)!==0||Number(b.authWrites||0)!==0||b.credentialsExposed!==false||b.tokensExposed!==false)throw new Error('credential_safety_invalid');
          fs.writeFileSync(process.env.COMBINED_PRIVATE,JSON.stringify({schemaVersion:'cxorbia.c6.e2e-private-credentials.remote-continuation.v1',staff:ss.staff,shopper:ss.shopper,client:cl.client},null,2)+'\n',{encoding:'utf8',mode:0o600});
          NODE
          chmod 600 "$STAFF_SHOPPER_PRIVATE" "$CLIENT_PRIVATE" "$CLIENT_SNAPSHOT_PRIVATE" "$COMBINED_PRIVATE"

      - name: Verify critical remote parity and live endpoint
        run: |
          set -euo pipefail
          echo remote_parity > "$OUT/stage"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_LIVE_ENDPOINT="$LIVE_ENDPOINT"
          export CXORBIA_REMOTE_PARITY_OUTPUT="$OUT/remote-parity.json"
          node tools/qa/tya-c6-remote-parity-gate.mjs "$ROOT_URL" | tee "$OUT/remote-parity.log"
          grep -q 'DECISION PASS_C6_HOSTING_DEV_REMOTE_PARITY_AND_LIVE_HR' "$OUT/remote-parity.log"

      - name: Execute remote Staff and Shopper gates
        run: |
          set -euo pipefail
          echo remote_staff_shopper > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$COMBINED_PRIVATE"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_HUMAN_GATE_OUTPUT="$OUT/remote-staff-shopper.json"
          node tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs "$ROOT_URL" > "$OUT/remote-staff-shopper.log" 2>&1
          node -e "const x=require('./$OUT/remote-staff-shopper.json');if(!['PASS_C6_UNIFIED_HUMAN_AUTH_RUNTIME','PASS_C6_UNIFIED_HUMAN_AUTH_STAFF_SHOPPER_RUNTIME_CLIENT_ROUTE_READY'].includes(x.decision))process.exit(2)"

      - name: Execute remote Client gate
        run: |
          set -euo pipefail
          echo remote_client > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$COMBINED_PRIVATE"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_CLIENT_GATE_OUTPUT="$OUT/remote-client.json"
          node tools/qa/tya-c6-client-auth-browser-smoke.mjs "$ROOT_URL" > "$OUT/remote-client.log" 2>&1
          node -e "const x=require('./$OUT/remote-client.json');if(x.decision!=='PASS_C6_CLIENT_AUTH_EXISTING_CREDENTIAL_RUNTIME')process.exit(2)"

      - name: Execute remote domain finance portals and reservations gate
        run: |
          set -euo pipefail
          echo remote_semantic > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$COMBINED_PRIVATE"
          export CXORBIA_REMOTE_FINANCE_DIAGNOSTIC_OUTPUT="$OUT/remote-finance-diagnostic.json"
          node tools/qa/tya-c6-remote-finance-model-diagnostic.mjs "$ROOT_URL" > "$OUT/remote-finance-diagnostic.log" 2>&1
          export CXORBIA_REMOTE_SEMANTIC_OUTPUT="$OUT/remote-semantic.json"
          node tools/qa/tya-c6-remote-domain-finance-portals-reservations-gate.mjs "$ROOT_URL" > "$OUT/remote-semantic.log" 2>&1
          node -e "const x=require('./$OUT/remote-semantic.json');if(x.decision!=='PASS_C6_REMOTE_DOMAIN_FINANCE_PORTALS_RESERVATIONS')process.exit(2)"

      - name: Persist cumulative PASS evidence
        run: |
          set -euo pipefail
          echo persist_pass > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const request=read(process.env.REQUEST);
          const evidence={schemaVersion:'cxorbia.c6.hosting-dev-deploy-remote-gates.v4',generatedAt:new Date().toISOString(),decision:'PASS_C6_SINGLE_DEV_HOSTING_DEPLOY_AND_REMOTE_GATES',sourceLock:read(process.env.OUT+'/source-lock.json'),deployment:{environment:'DEV',projectId:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',hostingSite:'cxorbia-backend-dev',deployedRequestId:request.deployedRequestId,deployedTriggerHead:request.deployedTriggerHead,hostingDeploysThisRun:0,hostingDeploysCumulativeAuthorizedSequence:1,cloudRunDeploys:0,existingReleasePreserved:true,liveRewritePreserved:true},parity:read(process.env.OUT+'/remote-parity.json'),staffShopper:read(process.env.OUT+'/remote-staff-shopper.json'),client:read(process.env.OUT+'/remote-client.json'),financeDiagnostic:read(process.env.OUT+'/remote-finance-diagnostic.json'),semantic:read(process.env.OUT+'/remote-semantic.json'),completedGates:['SOURCE_LOCK','STATIC_CUMULATIVE','EXISTING_HOSTING_RELEASE_PROOF','REMOTE_CRITICAL_PARITY','LIVE_HR_REMOTE','REMOTE_STAFF_AUTH','REMOTE_SHOPPER_AUTH','REMOTE_CLIENT_AUTH','THREE_RELOADS','NEW_TAB','REMOTE_DOMAIN','REMOTE_FINANCE','REMOTE_CLIENT_PORTAL','REMOTE_SHOPPER_PORTAL','REMOTE_RESERVATIONS'],safety:{hostingDeploysThisRun:0,hostingDeploysCumulativeAuthorizedSequence:1,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false},nextGate:'HUMAN_VISUAL_VALIDATION_C6_THEN_FREEZE'};
          fs.writeFileSync(process.env.OUT+'/final-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/final-evidence.json" app/docs/evidence/CORTE6-HOSTING-DEV-DEPLOY-REMOTE-GATES-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_pass';r.consumedAt=new Date().toISOString();r.decision='PASS_C6_SINGLE_DEV_HOSTING_DEPLOY_AND_REMOTE_GATES';r.nextGate='HUMAN_VISUAL_VALIDATION_C6_THEN_FREEZE';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-HOSTING-DEV-DEPLOY-REMOTE-GATES-LATEST.json "$REQUEST"
          git commit -m 'evidence: C6 existing Hosting DEV remote gates PASS'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Persist sanitized remote-gate failure evidence
        if: failure()
        run: |
          set -euo pipefail
          stage="$(cat "$OUT/stage" 2>/dev/null || echo unknown)"
          STAGE="$stage" node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const redact=s=>String(s||'').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g,'REDACTED_EMAIL').replace(/(token|password|private[_ -]?key|authorization)\s*[:=]\s*[^\s]+/gi,'$1=REDACTED').replace(/[A-Za-z0-9_-]{80,}/g,'REDACTED_LONG_VALUE');
          const tail=p=>{try{return redact(fs.readFileSync(p,'utf8').split(/\r?\n/).slice(-100).join('\n')).slice(-16000)}catch{return null}};
          const request=read(process.env.REQUEST)||{};
          const evidence={schemaVersion:'cxorbia.c6.existing-hosting-remote-gates-failure.v3',generatedAt:new Date().toISOString(),decision:'FAIL_C6_REMOTE_GATES_AFTER_EXISTING_DEV_HOSTING_DEPLOY',failedStage:String(process.env.STAGE||'unknown'),sourceLock:read(process.env.OUT+'/source-lock.json'),deployment:{deployedRequestId:request.deployedRequestId||null,deployedTriggerHead:request.deployedTriggerHead||null,existingHostingReleasePreserved:true,hostingDeploysThisRun:0,hostingDeploysCumulativeAuthorizedSequence:1},parity:read(process.env.OUT+'/remote-parity.json'),staffShopperDecision:read(process.env.OUT+'/remote-staff-shopper.json')?.decision||null,clientDecision:read(process.env.OUT+'/remote-client.json')?.decision||null,financeDiagnostic:read(process.env.OUT+'/remote-finance-diagnostic.json'),semanticDecision:read(process.env.OUT+'/remote-semantic.json')?.decision||null,remoteParityLogTail:tail(process.env.OUT+'/remote-parity.log'),staffShopperLogTail:tail(process.env.OUT+'/remote-staff-shopper.log'),clientLogTail:tail(process.env.OUT+'/remote-client.log'),financeDiagnosticLogTail:tail(process.env.OUT+'/remote-finance-diagnostic.log'),semanticLogTail:tail(process.env.OUT+'/remote-semantic.log'),safety:{hostingDeploysThisRun:0,hostingDeploysCumulativeAuthorizedSequence:1,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false}};
          fs.writeFileSync(process.env.OUT+'/failure-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/failure-evidence.json" app/docs/evidence/CORTE6-HOSTING-DEV-REMOTE-GATES-CONTINUATION-FAILURE-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_fail';r.consumedAt=new Date().toISOString();r.decision='FAIL_C6_REMOTE_GATES_AFTER_EXISTING_DEV_HOSTING_DEPLOY';r.nextGate='REMOTE_GATE_ROOT_CAUSE_REVIEW_NO_DEPLOY';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-HOSTING-DEV-REMOTE-GATES-CONTINUATION-FAILURE-LATEST.json "$REQUEST"
          git commit -m 'evidence: C6 existing Hosting DEV remote gate continuation failure' || true
          git push origin HEAD:docs-tya-v6-v71-audit || true

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=success; DESC=PASS_C6_EXISTING_HOSTING_REMOTE_GATES
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC=FAIL_C6_EXISTING_HOSTING_REMOTE_GATES; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/c6-existing-hosting-remote-gates" -f description="$DESC" >/dev/null

      - name: Cleanup private material
        if: always()
        run: rm -rf "$PRIVATE_DIR" "$OUT"
