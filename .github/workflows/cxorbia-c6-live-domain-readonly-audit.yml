name: CXOrbia C6 Canonical Head Single Hosting DEV Deploy and Gates

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-live-domain-readonly-audit-request.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-c6-canonical-head-single-hosting-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GCP_PROJECT_ID: cxorbia-backend-dev
      FIREBASE_HOSTING_TARGET: cxorbia-dev
      ROOT_URL: https://cxorbia-backend-dev.web.app
      LIVE_ENDPOINT: /api/tya/cinepolis/hr-live
      DEPLOY_CONFIG: firebase.deploy.json
      REQUEST: backend/config/corte6-live-domain-readonly-audit-request.json
      OUT: .tmp/c6-canonical-head-deploy
      PRIVATE_DIR: .tmp/c6-canonical-head-private
      STAFF_SHOPPER_PRIVATE: .tmp/c6-canonical-head-private/staff-shopper.json
      CLIENT_PRIVATE: .tmp/c6-canonical-head-private/client.json
      CLIENT_SNAPSHOT_PRIVATE: .tmp/c6-canonical-head-private/client-snapshot.json
      COMBINED_PRIVATE: .tmp/c6-canonical-head-private/all-roles.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create exact source lock and run predeploy static gates
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          echo source_lock_and_static_gates > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),path=require('path');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          if(r.schemaVersion!=='cxorbia.c6.live-domain-readonly-audit-request.v1'||r.enabled!==true||r.consumed!==false)throw new Error('request_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.pullRequest!==7||r.environment!=='DEV')throw new Error('target_invalid');
          if(r.scope!=='single_existing_hosting_dev_deploy_and_remote_cumulative_gates')throw new Error('scope_invalid');
          if(r.targetProjectId!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.hostingSite!=='cxorbia-backend-dev')throw new Error('hosting_target_invalid');
          const a=r.authorization||{};
          if(a.authorizedBy!=='Paula'||a.paulaExplicitInCurrentConversation!==true||a.singleHostingDevDeploy!==true)throw new Error('authorization_missing');
          if(a.sourceLockVerificationRequired!==true||a.staticCumulativeRequired!==true||a.shopperNewTabRootFixGateRequired!==true)throw new Error('predeploy_gate_contract_missing');
          if(a.rootResolvedConfigRequired!==true||a.deployConfigPath!=='firebase.deploy.json'||a.noAutomaticSecondDeploy!==true)throw new Error('deploy_contract_missing');
          if(Number(r.hostingDeploys)!==1||Number(r.maxHostingDeploys)!==1)throw new Error('single_deploy_contract_invalid');
          for(const k of ['cloudRunDeploys','firestoreWrites','authWrites','rulesDeploys','storageWrites','hrWrites','makeWrites','geminiCalls','paymentsWrites'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          if(r.merge!==false||r.production!==false)throw new Error('unsafe_scope');
          if(!/^[a-f0-9]{40}$/.test(r.sourceLockHead||''))throw new Error('source_lock_invalid');
          cp.execFileSync('git',['cat-file','-e',r.sourceLockHead+'^{commit}']);
          cp.execFileSync('git',['diff','--quiet',r.sourceLockHead+'..HEAD','--','app','tools/qa','firebase.json','firebase.deploy.json','.firebaserc']);
          const lockedAppTree=cp.execFileSync('git',['rev-parse',r.sourceLockHead+':app'],{encoding:'utf8'}).trim();
          const currentAppTree=cp.execFileSync('git',['rev-parse','HEAD:app'],{encoding:'utf8'}).trim();
          if(lockedAppTree!==currentAppTree)throw new Error('app_tree_lock_mismatch');
          const lockedQaTree=cp.execFileSync('git',['rev-parse',r.sourceLockHead+':tools/qa'],{encoding:'utf8'}).trim();
          const currentQaTree=cp.execFileSync('git',['rev-parse','HEAD:tools/qa'],{encoding:'utf8'}).trim();
          if(lockedQaTree!==currentQaTree)throw new Error('qa_tree_lock_mismatch');
          if(!fs.existsSync(process.env.DEPLOY_CONFIG))throw new Error('root_deploy_config_missing');
          const fb=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const deploy=JSON.parse(fs.readFileSync(process.env.DEPLOY_CONFIG,'utf8'));
          const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          const validateHosting=(h,label)=>{
            if(h?.target!=='cxorbia-dev'||h?.public!=='app')throw new Error(label+'_hosting_target_invalid');
            const rewrites=Array.isArray(h.rewrites)?h.rewrites:[];
            const liveIndex=rewrites.findIndex(x=>x?.source==='/api/tya/cinepolis/hr-live'&&x?.run?.serviceId==='cxorbia-live-hr-dev'&&x?.run?.region==='us-central1');
            const spaIndex=rewrites.findIndex(x=>x?.source==='**'&&x?.destination==='/index.html');
            if(liveIndex<0||spaIndex<0||liveIndex>=spaIndex)throw new Error(label+'_rewrite_order_invalid');
          };
          validateHosting(fb.hosting,'canonical');
          validateHosting(deploy.hosting,'root_deploy');
          if(rc.projects?.default!=='cxorbia-backend-dev'||!rc.targets?.['cxorbia-backend-dev']?.hosting?.['cxorbia-dev']?.includes('cxorbia-backend-dev'))throw new Error('firebaserc_target_invalid');
          const auth=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-CLIENT-AUTH-MATERIALIZATION-LATEST.json','utf8'));
          if(auth.decision!=='PASS_C6_CLIENT_AUTH_MATERIALIZED_AND_RUNTIME_VALIDATED'||auth.cumulativeDecision!=='PASS_C6_READONLY_AUTH_RUNTIME_ALL_ROLES')throw new Error('auth_multi_role_pass_missing');
          const domain=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json','utf8'));
          if(domain.decision!=='PASS_C6_LIVE_HR_DYNAMIC_CANONICAL_STATE')throw new Error('domain_pass_missing');
          function walk(dir,base=''){
            const out=[];
            for(const name of fs.readdirSync(dir).sort()){
              const abs=path.join(dir,name),rel=path.posix.join(base,name),st=fs.statSync(abs);
              if(st.isDirectory())out.push(...walk(abs,rel));else out.push({path:rel,sha256:crypto.createHash('sha256').update(fs.readFileSync(abs)).digest('hex'),bytes:st.size});
            }
            return out;
          }
          const appFiles=walk('app');
          const criticalQa=[
            'tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs',
            'tools/qa/tya-c6-shopper-new-tab-authority-root-fix-gate.mjs',
            'tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs',
            'tools/qa/tya-c6-client-auth-browser-smoke.mjs',
            'tools/qa/tya-c6-remote-parity-gate.mjs',
            'tools/qa/tya-c6-remote-finance-model-diagnostic.mjs',
            'tools/qa/tya-c6-remote-domain-finance-portals-reservations-gate.mjs',
            'tools/qa/cxorbia-c6-existing-users-e2e-envelope-compat.mjs',
            'tools/qa/cxorbia-c6-client-auth-materialization.mjs'
          ].map(p=>({path:p,sha256:crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')}));
          const lock={
            schemaVersion:'cxorbia.c6.canonical-head-source-lock.v1',
            generatedAt:new Date().toISOString(),
            sourceLockHead:r.sourceLockHead,
            triggerHead:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            lockedAppTree,currentAppTree,lockedQaTree,currentQaTree,
            appFiles:appFiles.length,
            appBytes:appFiles.reduce((n,x)=>n+x.bytes,0),
            appManifestSha256:crypto.createHash('sha256').update(JSON.stringify(appFiles)).digest('hex'),
            criticalQa,
            deployConfigPath:process.env.DEPLOY_CONFIG,
            deployConfigSha256:crypto.createHash('sha256').update(fs.readFileSync(process.env.DEPLOY_CONFIG)).digest('hex'),
            runtimeAndQaExact:true,
            hostingDeploysBeforeGate:0,
            providerWrites:0,
            production:false
          };
          fs.writeFileSync(process.env.OUT+'/source-lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
          node --check tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs
          node --check tools/qa/tya-c6-shopper-new-tab-authority-root-fix-gate.mjs
          node --check tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs
          node --check tools/qa/tya-c6-client-auth-browser-smoke.mjs
          node --check tools/qa/tya-c6-remote-parity-gate.mjs
          node --check tools/qa/tya-c6-remote-finance-model-diagnostic.mjs
          node --check tools/qa/tya-c6-remote-domain-finance-portals-reservations-gate.mjs
          node --check tools/qa/cxorbia-c6-existing-users-e2e-envelope-compat.mjs
          node --check tools/qa/cxorbia-c6-client-auth-materialization.mjs
          node tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs | tee "$OUT/static-cumulative.log"
          grep -q 'DECISION PASS_C6_UNIFIED_CUMULATIVE_RUNTIME_STATIC_GATE' "$OUT/static-cumulative.log"
          node tools/qa/tya-c6-shopper-new-tab-authority-root-fix-gate.mjs | tee "$OUT/static-root-fix.log"
          grep -q 'DECISION PASS_C6_SHOPPER_NEW_TAB_AUTHORITY_ROOT_FIX_STATIC_GATE' "$OUT/static-root-fix.log"

      - name: Authenticate Google DEV
        run: echo google_auth > "$OUT/stage"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient DEV gate tooling
        run: |
          set -euo pipefail
          echo install_tooling > "$OUT/stage"
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 playwright@1.54.2 firebase-tools@latest >/dev/null 2>&1
          npx firebase --version | tee "$OUT/firebase-cli-version.txt"
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify existing Staff Shopper and Client credentials read-only
        run: |
          set -euo pipefail
          echo credentials_readonly > "$OUT/stage"
          export CXORBIA_EXPECTED_PROJECT="$GCP_PROJECT_ID"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$STAFF_SHOPPER_PRIVATE"
          export CXORBIA_PRIVATE_COMPAT_DIR="$PRIVATE_DIR"
          export OUT_DIR="$OUT"
          node tools/qa/cxorbia-c6-existing-users-e2e-envelope-compat.mjs > "$OUT/staff-shopper-selection.source-safe.json"
          export CXORBIA_CLIENT_AUTH_PRIVATE_SNAPSHOT="$CLIENT_SNAPSHOT_PRIVATE"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$CLIENT_PRIVATE"
          node tools/qa/cxorbia-c6-client-auth-materialization.mjs --mode=snapshot > "$OUT/client-snapshot.source-safe.json"
          node tools/qa/cxorbia-c6-client-auth-materialization.mjs --mode=readback > "$OUT/client-readback.source-safe.json"
          node <<'NODE'
          const fs=require('fs');
          const ss=JSON.parse(fs.readFileSync(process.env.STAFF_SHOPPER_PRIVATE,'utf8'));
          const cl=JSON.parse(fs.readFileSync(process.env.CLIENT_PRIVATE,'utf8'));
          const a=JSON.parse(fs.readFileSync(process.env.OUT+'/staff-shopper-selection.source-safe.json','utf8'));
          const b=JSON.parse(fs.readFileSync(process.env.OUT+'/client-readback.source-safe.json','utf8'));
          if(!ss.staff||!ss.shopper||!cl.client)throw new Error('private_credentials_incomplete');
          if(a.decision!=='PASS_C6_EXISTING_E2E_CREDENTIAL_SELECTION_V6'||b.decision!=='PASS_C6_CLIENT_AUTH_READBACK')throw new Error('credential_readback_not_pass');
          if(Number(a.authWrites||0)!==0||Number(b.authWrites||0)!==0||b.credentialsExposed!==false||b.tokensExposed!==false)throw new Error('credential_safety_invalid');
          fs.writeFileSync(process.env.COMBINED_PRIVATE,JSON.stringify({schemaVersion:'cxorbia.c6.e2e-private-credentials.canonical-head.v1',staff:ss.staff,shopper:ss.shopper,client:cl.client},null,2)+'\n',{encoding:'utf8',mode:0o600});
          NODE
          chmod 600 "$STAFF_SHOPPER_PRIVATE" "$CLIENT_PRIVATE" "$CLIENT_SNAPSHOT_PRIVATE" "$COMBINED_PRIVATE"

      - name: Execute exactly one Hosting DEV deploy
        run: |
          set -euo pipefail
          echo deploy_hosting_once > "$OUT/stage"
          printf '1\n' > "$OUT/deploy-attempted"
          npx firebase deploy --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$GCP_PROJECT_ID" --config "$DEPLOY_CONFIG" --non-interactive 2>&1 | tee "$OUT/firebase-deploy.log"
          printf '1\n' > "$OUT/deploy-succeeded"
          grep -q 'Deploy complete' "$OUT/firebase-deploy.log"

      - name: Verify remote parity and live HR
        run: |
          set -euo pipefail
          echo remote_parity_hr > "$OUT/stage"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_LIVE_ENDPOINT="$LIVE_ENDPOINT"
          export CXORBIA_REMOTE_PARITY_OUTPUT="$OUT/remote-parity.json"
          node tools/qa/tya-c6-remote-parity-gate.mjs "$ROOT_URL" | tee "$OUT/remote-parity.log"
          grep -q 'DECISION PASS_C6_HOSTING_DEV_REMOTE_PARITY_AND_LIVE_HR' "$OUT/remote-parity.log"

      - name: Execute Staff and Shopper three reloads new tab and own visits gates
        run: |
          set -euo pipefail
          echo remote_staff_shopper > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$COMBINED_PRIVATE"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_HUMAN_GATE_OUTPUT="$OUT/remote-staff-shopper.json"
          node tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs "$ROOT_URL" > "$OUT/remote-staff-shopper.log" 2>&1
          node -e "const x=require('./$OUT/remote-staff-shopper.json');if(!['PASS_C6_UNIFIED_HUMAN_AUTH_RUNTIME','PASS_C6_UNIFIED_HUMAN_AUTH_STAFF_SHOPPER_RUNTIME_CLIENT_ROUTE_READY'].includes(x.decision))process.exit(2);if(x.shopper?.reloadsStable!==true||x.shopper?.newTabStable!==true||Number(x.shopper?.ownVisits||0)<=0)process.exit(3)"

      - name: Execute Client gate
        run: |
          set -euo pipefail
          echo remote_client > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$COMBINED_PRIVATE"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_CLIENT_GATE_OUTPUT="$OUT/remote-client.json"
          node tools/qa/tya-c6-client-auth-browser-smoke.mjs "$ROOT_URL" > "$OUT/remote-client.log" 2>&1
          node -e "const x=require('./$OUT/remote-client.json');if(x.decision!=='PASS_C6_CLIENT_AUTH_EXISTING_CREDENTIAL_RUNTIME')process.exit(2)"

      - name: Execute domain Finance portals and Reservations gates
        run: |
          set -euo pipefail
          echo remote_domain_finance_portals_reservations > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$COMBINED_PRIVATE"
          export CXORBIA_REMOTE_FINANCE_DIAGNOSTIC_OUTPUT="$OUT/remote-finance-diagnostic.json"
          node tools/qa/tya-c6-remote-finance-model-diagnostic.mjs "$ROOT_URL" > "$OUT/remote-finance-diagnostic.log" 2>&1
          export CXORBIA_REMOTE_SEMANTIC_OUTPUT="$OUT/remote-semantic.json"
          node tools/qa/tya-c6-remote-domain-finance-portals-reservations-gate.mjs "$ROOT_URL" > "$OUT/remote-semantic.log" 2>&1
          node -e "const x=require('./$OUT/remote-semantic.json');if(x.decision!=='PASS_C6_REMOTE_DOMAIN_FINANCE_PORTALS_RESERVATIONS')process.exit(2)"

      - name: Persist cumulative PASS evidence and stop for human validation
        run: |
          set -euo pipefail
          echo persist_pass > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const request=read(process.env.REQUEST);
          const evidence={
            schemaVersion:'cxorbia.c6.canonical-head-single-dev-deploy-gates.v1',
            generatedAt:new Date().toISOString(),
            decision:'PASS_C6_CANONICAL_HEAD_SINGLE_DEV_DEPLOY_AND_REMOTE_GATES',
            sourceLock:read(process.env.OUT+'/source-lock.json'),
            requestId:request.requestId,
            deployment:{environment:'DEV',projectId:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',hostingSite:'cxorbia-backend-dev',deployConfigPath:process.env.DEPLOY_CONFIG,hostingDeploysThisRun:1,cloudRunDeploys:0},
            staticGates:{cumulative:'PASS_C6_UNIFIED_CUMULATIVE_RUNTIME_STATIC_GATE',shopperNewTabRootFix:'PASS_C6_SHOPPER_NEW_TAB_AUTHORITY_ROOT_FIX_STATIC_GATE'},
            parity:read(process.env.OUT+'/remote-parity.json'),
            staffShopper:read(process.env.OUT+'/remote-staff-shopper.json'),
            client:read(process.env.OUT+'/remote-client.json'),
            financeDiagnostic:read(process.env.OUT+'/remote-finance-diagnostic.json'),
            semantic:read(process.env.OUT+'/remote-semantic.json'),
            completedGates:['SOURCE_LOCK_69AFC822','STATIC_CUMULATIVE','SHOPPER_NEW_TAB_ROOT_FIX_STATIC','SINGLE_HOSTING_DEV_DEPLOY','REMOTE_CRITICAL_PARITY','LIVE_HR_REMOTE','REMOTE_STAFF','REMOTE_SHOPPER_THREE_RELOADS','REMOTE_SHOPPER_NEW_TAB','REMOTE_SHOPPER_OWN_VISITS','REMOTE_CLIENT','REMOTE_DOMAIN','REMOTE_FINANCE','REMOTE_CLIENT_PORTAL','REMOTE_SHOPPER_PORTAL','REMOTE_RESERVATIONS'],
            safety:{hostingDeploysThisRun:1,automaticSecondDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false},
            nextGate:'HUMAN_VISUAL_VALIDATION_C6_THEN_FREEZE'
          };
          fs.writeFileSync(process.env.OUT+'/final-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/source-lock.json" app/docs/evidence/CORTE6-CANONICAL-HEAD-SOURCE-LOCK-LATEST.json
          cp "$OUT/final-evidence.json" app/docs/evidence/CORTE6-CANONICAL-HEAD-DEV-DEPLOY-GATES-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_pass';r.consumedAt=new Date().toISOString();r.decision='PASS_C6_CANONICAL_HEAD_SINGLE_DEV_DEPLOY_AND_REMOTE_GATES';r.nextGate='HUMAN_VISUAL_VALIDATION_C6_THEN_FREEZE';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CANONICAL-HEAD-SOURCE-LOCK-LATEST.json app/docs/evidence/CORTE6-CANONICAL-HEAD-DEV-DEPLOY-GATES-LATEST.json "$REQUEST"
          git commit -m 'evidence(c6): canonical head DEV deploy and cumulative gates PASS'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Persist sanitized STOP_RETRY failure evidence
        if: failure()
        run: |
          set -euo pipefail
          stage="$(cat "$OUT/stage" 2>/dev/null || echo unknown)"
          attempted="$(cat "$OUT/deploy-attempted" 2>/dev/null || echo 0)"
          succeeded="$(cat "$OUT/deploy-succeeded" 2>/dev/null || echo 0)"
          STAGE="$stage" ATTEMPTED="$attempted" SUCCEEDED="$succeeded" node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const redact=s=>String(s||'').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g,'REDACTED_EMAIL').replace(/(token|password|private[_ -]?key|authorization)\s*[:=]\s*[^\s]+/gi,'$1=REDACTED').replace(/[A-Za-z0-9_-]{80,}/g,'REDACTED_LONG_VALUE');
          const tail=p=>{try{return redact(fs.readFileSync(p,'utf8').split(/\r?\n/).slice(-100).join('\n')).slice(-16000)}catch{return null}};
          const deployed=Number(process.env.SUCCEEDED||0)===1;
          const evidence={
            schemaVersion:'cxorbia.c6.canonical-head-single-dev-deploy-failure.v1',
            generatedAt:new Date().toISOString(),
            decision:deployed?'FAIL_C6_REMOTE_GATES_AFTER_SINGLE_DEV_HOSTING_DEPLOY_STOP_RETRY':'FAIL_C6_PREDEPLOY_OR_HOSTING_DEPLOY_STOP_RETRY',
            failedStage:String(process.env.STAGE||'unknown'),
            sourceLock:read(process.env.OUT+'/source-lock.json'),
            deployAttempted:Number(process.env.ATTEMPTED||0)===1,
            deploySucceeded:deployed,
            staticCumulativeLogTail:tail(process.env.OUT+'/static-cumulative.log'),
            staticRootFixLogTail:tail(process.env.OUT+'/static-root-fix.log'),
            firebaseCliVersion:tail(process.env.OUT+'/firebase-cli-version.txt'),
            deployLogTail:tail(process.env.OUT+'/firebase-deploy.log'),
            firebaseDebugTail:tail('firebase-debug.log'),
            parity:read(process.env.OUT+'/remote-parity.json'),
            staffShopper:read(process.env.OUT+'/remote-staff-shopper.json'),
            client:read(process.env.OUT+'/remote-client.json'),
            financeDiagnostic:read(process.env.OUT+'/remote-finance-diagnostic.json'),
            semantic:read(process.env.OUT+'/remote-semantic.json'),
            stopRetry:true,
            automaticSecondDeployAuthorized:false,
            safety:{hostingDeploysThisRun:deployed?1:0,hostingDeployAttempts:Number(process.env.ATTEMPTED||0),automaticSecondDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false}
          };
          fs.writeFileSync(process.env.OUT+'/failure-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          if [ -f "$OUT/source-lock.json" ]; then cp "$OUT/source-lock.json" app/docs/evidence/CORTE6-CANONICAL-HEAD-SOURCE-LOCK-LATEST.json; fi
          cp "$OUT/failure-evidence.json" app/docs/evidence/CORTE6-CANONICAL-HEAD-DEV-DEPLOY-GATES-FAILURE-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8')),f=JSON.parse(fs.readFileSync(process.env.OUT+'/failure-evidence.json','utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_fail_stop_retry';r.consumedAt=new Date().toISOString();r.decision=f.decision;r.nextGate='ROOT_CAUSE_REVIEW_NO_AUTOMATIC_REDEPLOY';r.stopRetry=true;
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CANONICAL-HEAD-DEV-DEPLOY-GATES-FAILURE-LATEST.json "$REQUEST"
          if [ -f app/docs/evidence/CORTE6-CANONICAL-HEAD-SOURCE-LOCK-LATEST.json ]; then git add app/docs/evidence/CORTE6-CANONICAL-HEAD-SOURCE-LOCK-LATEST.json; fi
          git commit -m 'evidence(c6): canonical head gate failure STOP_RETRY' || true
          git push origin HEAD:docs-tya-v6-v71-audit || true

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=success; DESC=PASS_C6_CANONICAL_HEAD_DEV_GATES
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC=FAIL_C6_CANONICAL_HEAD_STOP_RETRY; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/c6-canonical-head-dev-gates" -f description="$DESC" >/dev/null

      - name: Cleanup private material
        if: always()
        run: rm -rf "$PRIVATE_DIR" "$OUT"
