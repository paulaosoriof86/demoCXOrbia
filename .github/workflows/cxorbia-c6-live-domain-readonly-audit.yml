name: CXOrbia C6 Unified Human Auth Runtime Readonly Diagnostic

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-live-domain-readonly-audit-request.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-c6-unified-human-auth-runtime-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: cxorbia-backend-dev
      ROOT_URL: https://cxorbia-backend-dev.web.app
      OUT: .tmp/c6-unified-human-auth
      PRIVATE_DIR: .tmp/c6-unified-human-auth-private
      PRIVATE_E2E: .tmp/c6-unified-human-auth-private/private-e2e.json
      REQUEST: backend/config/corte6-live-domain-readonly-audit-request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate read-only request
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          echo validate_request > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          if(r.schemaVersion!=='cxorbia.c6.live-domain-readonly-audit-request.v1'||r.enabled!==true||r.consumed!==false)throw new Error('request_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.environment!=='DEV')throw new Error('target_invalid');
          for(const k of ['hostingDeploys','cloudRunDeploys','firestoreWrites','authWrites','rulesDeploys','storageWrites','hrWrites','makeWrites','geminiCalls','paymentsWrites'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          if(r.merge!==false||r.production!==false)throw new Error('unsafe_scope');
          NODE

      - name: Verify static and dynamic HR prerequisites
        run: |
          set -euo pipefail
          echo prerequisites > "$OUT/stage"
          node --check tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs
          node --check tools/qa/cxorbia-c6-existing-users-e2e-credentials.mjs
          node tools/qa/tya-c6-unified-cumulative-runtime-gate.mjs > "$OUT/unified-gate.log" 2>&1
          node <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-LIVE-HR-DOMAIN-READONLY-AUDIT-LATEST.json','utf8'));
          if(live.decision!=='PASS_C6_LIVE_HR_DYNAMIC_CANONICAL_STATE'||live.failedAssertions?.length||live.failedGates?.length||live.periodInvariantFailures?.length)throw new Error('live_hr_dynamic_prerequisite_not_pass');
          const log=fs.readFileSync(process.env.OUT+'/unified-gate.log','utf8');
          if(!log.includes('DECISION PASS_C6_UNIFIED_CUMULATIVE_RUNTIME_STATIC_GATE_WITH_DOCUMENTED_FRONTEND_WARNINGS'))throw new Error('unified_static_gate_not_pass');
          NODE

      - name: Prepare existing DEV identity read-only
        run: echo google_auth_readonly > "$OUT/stage"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient read-only browser tooling
        run: |
          set -euo pipefail
          echo install_browser_tooling > "$OUT/stage"
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Select existing staff and shopper credentials privately
        run: |
          set -euo pipefail
          echo select_existing_credentials > "$OUT/stage"
          export CXORBIA_EXPECTED_PROJECT="$GCP_PROJECT_ID"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$PRIVATE_E2E"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          node tools/qa/cxorbia-c6-existing-users-e2e-credentials.mjs > "$OUT/credential-selection.source-safe.json"
          chmod 600 "$PRIVATE_E2E"
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/credential-selection.source-safe.json','utf8'));
          if(s.decision!=='PASS_C6_EXISTING_E2E_CREDENTIAL_SELECTION'||s.authWrites!==0||s.passwordChanges!==0||s.valuesExported!==false)throw new Error('credential_selection_not_safe_pass');
          NODE

      - name: Start local application server
        run: |
          set -euo pipefail
          echo start_local_server > "$OUT/stage"
          nohup python3 -m http.server 4173 --directory app > "$OUT/local-http.log" 2>&1 &
          echo $! > "$OUT/local-http.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index-backend-dev.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 2

      - name: Run unified human Auth browser diagnostic
        run: |
          set -euo pipefail
          echo unified_human_auth_runtime > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$PRIVATE_E2E"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_HUMAN_GATE_OUTPUT="$OUT/unified-human-auth.source-safe.json"
          set +e
          node tools/qa/tya-c6-unified-human-auth-browser-smoke.mjs http://127.0.0.1:4173 > "$OUT/human-browser.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            node <<'NODE'
            const fs=require('fs');
            const raw=fs.readFileSync(process.env.OUT+'/human-browser.log','utf8');
            const safe=raw.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g,'REDACTED_EMAIL').replace(/(password|token|credential)(\s*[:=]\s*)[^\s,}\]]+/gi,'$1$2REDACTED').slice(-5000);
            fs.writeFileSync(process.env.OUT+'/human-browser-failure.source-safe.json',JSON.stringify({decision:'FAIL_C6_UNIFIED_HUMAN_AUTH_BROWSER_DIAGNOSTIC',errorTail:safe,credentialsExposed:false,tokensExposed:false},null,2)+'\n');
            NODE
            exit "$code"
          fi
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync(process.env.OUT+'/unified-human-auth.source-safe.json','utf8'));
          if(h.decision!=='PASS_C6_UNIFIED_HUMAN_AUTH_STAFF_SHOPPER_RUNTIME_CLIENT_ROUTE_READY'||h.staff?.reloadsStable!==true||h.staff?.newTabStable!==true||h.shopper?.reloadsStable!==true||h.shopper?.newTabStable!==true||h.shopper?.ownVisits<1||h.client?.integratedCredentialRoute!==true||h.credentialsExposed!==false||h.tokensExposed!==false)throw new Error('unified_human_auth_runtime_not_pass');
          NODE

      - name: Persist human runtime result
        run: |
          set -euo pipefail
          echo persist_human_runtime > "$OUT/stage"
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/unified-human-auth.source-safe.json" app/docs/evidence/CORTE6-UNIFIED-HUMAN-AUTH-RUNTIME-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_partial_pass';r.consumedAt=new Date().toISOString();r.decision='PASS_C6_UNIFIED_HUMAN_AUTH_STAFF_SHOPPER_RUNTIME_CLIENT_ROUTE_READY';r.nextGate='CLIENT_AUTH_WITH_EXISTING_CREDENTIAL_THEN_TECHNICAL_E2E';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-UNIFIED-HUMAN-AUTH-RUNTIME-LATEST.json "$REQUEST"
          git commit -m 'evidence: C6 unified human Auth runtime partial PASS'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Persist sanitized diagnostic failure
        if: failure()
        run: |
          set -euo pipefail
          stage="$(cat "$OUT/stage" 2>/dev/null || echo unknown)"
          STAGE="$stage" node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const failure=read(process.env.OUT+'/human-browser-failure.source-safe.json');
          const credential=read(process.env.OUT+'/credential-selection.source-safe.json');
          const evidence={schemaVersion:'cxorbia.c6.unified-human-auth-browser-diagnostic-failure.v2',generatedAt:new Date().toISOString(),decision:'FAIL_C6_UNIFIED_HUMAN_AUTH_BROWSER_DIAGNOSTIC',failedStage:String(process.env.STAGE||'unknown'),credentialSelectionDecision:credential?.decision||null,errorTail:failure?.errorTail||null,safety:{hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false}};
          fs.writeFileSync(process.env.OUT+'/failure-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/failure-evidence.json" app/docs/evidence/CORTE6-UNIFIED-AUTH-RUNTIME-READONLY-FAILURE-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_fail';r.consumedAt=new Date().toISOString();r.decision='FAIL_C6_UNIFIED_HUMAN_AUTH_BROWSER_DIAGNOSTIC';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-UNIFIED-AUTH-RUNTIME-READONLY-FAILURE-LATEST.json "$REQUEST"
          git commit -m 'evidence: C6 unified human Auth diagnostic failure' || true
          git push origin HEAD:docs-tya-v6-v71-audit || true

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=success; DESC=PASS_C6_HUMAN_STAFF_SHOPPER_CLIENT_ROUTE
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC=FAIL_C6_HUMAN_AUTH_DIAGNOSTIC; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/c6-human-auth-runtime/$DESC" -f description="$DESC" >/dev/null

      - name: Cleanup private material
        if: always()
        run: rm -rf "$PRIVATE_DIR" "$OUT"
