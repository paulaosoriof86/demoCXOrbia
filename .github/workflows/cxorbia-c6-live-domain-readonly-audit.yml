name: CXOrbia C6 Existing Client Auth Readonly Gate

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-live-domain-readonly-audit-request.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-c6-existing-client-auth-readonly
  cancel-in-progress: false

jobs:
  client-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: cxorbia-backend-dev
      ROOT_URL: https://cxorbia-backend-dev.web.app
      OUT: .tmp/c6-client-auth
      PRIVATE_DIR: .tmp/c6-client-auth-private
      PRIVATE_E2E: .tmp/c6-client-auth-private/private-e2e.json
      REQUEST: backend/config/corte6-live-domain-readonly-audit-request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate request and completed prerequisites
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          echo validate_prerequisites > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          if(r.schemaVersion!=='cxorbia.c6.live-domain-readonly-audit-request.v1'||r.enabled!==true||r.consumed!==false)throw new Error('request_invalid');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.environment!=='DEV')throw new Error('target_invalid');
          for(const k of ['hostingDeploys','cloudRunDeploys','firestoreWrites','authWrites','rulesDeploys','storageWrites','hrWrites','makeWrites','geminiCalls','paymentsWrites'])if(Number(r[k]||0)!==0)throw new Error('unsafe_scope:'+k);
          if(r.merge!==false||r.production!==false)throw new Error('unsafe_scope');
          const prior=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-UNIFIED-AUTH-RUNTIME-READONLY-LATEST.json','utf8'));
          if(prior.decision!=='HOLD_C6_CLIENT_AUTH_EXISTING_CREDENTIAL_REQUIRED')throw new Error('prior_runtime_hold_not_found');
          const required=['STATIC_CUMULATIVE','LIVE_HR_DYNAMIC','HUMAN_STAFF_AUTH','HUMAN_SHOPPER_AUTH','TECHNICAL_AUTH_ISOLATED','THREE_RELOADS','NEW_TAB','CLIENT_INTEGRATED_ROUTE'];
          if(!required.every(x=>(prior.completedGates||[]).includes(x)))throw new Error('prior_runtime_gates_incomplete');
          if(prior.safety?.authWrites!==0||prior.safety?.passwordChanges!==0||prior.safety?.passwordResets!==0||prior.safety?.hostingDeploys!==0||prior.safety?.production!==false)throw new Error('prior_runtime_safety_invalid');
          NODE
          node --check tools/qa/cxorbia-c6-existing-client-e2e-credential.mjs
          node --check tools/qa/tya-c6-client-auth-browser-smoke.mjs

      - name: Authenticate existing DEV for read-only lookup
        run: echo google_auth_readonly > "$OUT/stage"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient read-only tooling
        run: |
          set -euo pipefail
          echo install_tooling > "$OUT/stage"
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Select existing Client credential without mutation
        run: |
          set -euo pipefail
          echo select_existing_client > "$OUT/stage"
          export CXORBIA_EXPECTED_PROJECT="$GCP_PROJECT_ID"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$PRIVATE_E2E"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          node tools/qa/cxorbia-c6-existing-client-e2e-credential.mjs > "$OUT/client-selection.source-safe.json"
          if [ -f "$PRIVATE_E2E" ]; then chmod 600 "$PRIVATE_E2E"; fi
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/client-selection.source-safe.json','utf8'));
          const allowed=['PASS_C6_EXISTING_CLIENT_CREDENTIAL_SELECTION','HOLD_C6_EXISTING_CLIENT_CREDENTIAL_NOT_FOUND'];
          if(!allowed.includes(s.decision))throw new Error('client_selection_decision_invalid');
          if(Number(s.authWrites||0)!==0||Number(s.passwordChanges||0)!==0||Number(s.passwordResets||0)!==0||s.valuesExported!==false||s.credentialsExposed!==false||s.production!==false)throw new Error('client_selection_safety_invalid');
          NODE

      - name: Start local application server
        run: |
          set -euo pipefail
          echo start_local_server > "$OUT/stage"
          nohup python3 -m http.server 4173 --directory app > "$OUT/local-http.log" 2>&1 &
          echo $! > "$OUT/local-http.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index-backend-dev.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 2

      - name: Execute Client Auth runtime gate or exact HOLD
        run: |
          set -euo pipefail
          echo client_auth_runtime > "$OUT/stage"
          export CXORBIA_E2E_PRIVATE_CREDENTIALS="$PRIVATE_E2E"
          export CXORBIA_DEV_ROOT_URL="$ROOT_URL"
          export CXORBIA_CLIENT_GATE_OUTPUT="$OUT/client-auth.source-safe.json"
          node tools/qa/tya-c6-client-auth-browser-smoke.mjs http://127.0.0.1:4173 > "$OUT/client-auth.log" 2>&1
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/client-selection.source-safe.json','utf8'));
          const c=JSON.parse(fs.readFileSync(process.env.OUT+'/client-auth.source-safe.json','utf8'));
          if(s.decision==='PASS_C6_EXISTING_CLIENT_CREDENTIAL_SELECTION'&&c.decision!=='PASS_C6_CLIENT_AUTH_EXISTING_CREDENTIAL_RUNTIME')throw new Error('client_auth_runtime_expected_pass');
          if(s.decision==='HOLD_C6_EXISTING_CLIENT_CREDENTIAL_NOT_FOUND'&&c.decision!=='HOLD_C6_EXISTING_CLIENT_CREDENTIAL_NOT_FOUND')throw new Error('client_auth_runtime_expected_hold');
          if(Number(c.authWrites||0)!==0||Number(c.passwordChanges||0)!==0||Number(c.passwordResets||0)!==0||c.credentialsExposed!==false||c.tokensExposed!==false||c.hostingDeploys!==0||c.production!==false)throw new Error('client_auth_runtime_safety_invalid');
          NODE

      - name: Persist Client gate evidence and cumulative decision
        run: |
          set -euo pipefail
          echo persist_client_gate > "$OUT/stage"
          node <<'NODE'
          const fs=require('fs');
          const prior=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-UNIFIED-AUTH-RUNTIME-READONLY-LATEST.json','utf8'));
          const selection=JSON.parse(fs.readFileSync(process.env.OUT+'/client-selection.source-safe.json','utf8'));
          const client=JSON.parse(fs.readFileSync(process.env.OUT+'/client-auth.source-safe.json','utf8'));
          const pass=client.decision==='PASS_C6_CLIENT_AUTH_EXISTING_CREDENTIAL_RUNTIME';
          const evidence={
            ...prior,
            schemaVersion:'cxorbia.c6.unified-auth-runtime-readonly.v3',
            generatedAt:new Date().toISOString(),
            decision:pass?'PASS_C6_READONLY_AUTH_RUNTIME_ALL_ROLES':'HOLD_C6_EXISTING_CLIENT_CREDENTIAL_NOT_FOUND',
            completedGates:pass?[...new Set([...(prior.completedGates||[]),'HUMAN_CLIENT_AUTH'])]:prior.completedGates,
            clientCredentialSelection:selection,
            clientAuthRuntime:client,
            remainingGate:pass?null:'CLIENT_CREDENTIAL_MATERIALIZATION_REQUIRES_SEPARATE_AUTHORIZATION',
            blocker:pass?null:'NO_EXISTING_CLIENT_CREDENTIAL_WITH_VALID_CLAIMS_AND_PASSWORD_FOUND',
            blockerClassification:pass?null:'P0_GATE_INCOMPLETE_NO_MUTATION_AUTHORIZED',
            safety:{...(prior.safety||{}),hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false}
          };
          fs.writeFileSync(process.env.OUT+'/cumulative-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          fs.writeFileSync(process.env.OUT+'/decision.txt',evidence.decision+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/client-selection.source-safe.json" app/docs/evidence/CORTE6-EXISTING-CLIENT-CREDENTIAL-SELECTION-LATEST.json
          cp "$OUT/client-auth.source-safe.json" app/docs/evidence/CORTE6-CLIENT-AUTH-RUNTIME-LATEST.json
          cp "$OUT/cumulative-evidence.json" app/docs/evidence/CORTE6-UNIFIED-AUTH-RUNTIME-READONLY-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          const decision=fs.readFileSync(process.env.OUT+'/decision.txt','utf8').trim();
          r.enabled=false;r.consumed=true;r.status=decision.startsWith('PASS_')?'consumed_pass':'consumed_hold';r.consumedAt=new Date().toISOString();r.decision=decision;r.nextGate=decision.startsWith('PASS_')?'UPDATE_CHECKPOINT_AND_REQUEST_FRESH_DEV_DEPLOY_AUTHORIZATION':'CLIENT_CREDENTIAL_MATERIALIZATION_REQUIRES_SEPARATE_AUTHORIZATION';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-EXISTING-CLIENT-CREDENTIAL-SELECTION-LATEST.json app/docs/evidence/CORTE6-CLIENT-AUTH-RUNTIME-LATEST.json app/docs/evidence/CORTE6-UNIFIED-AUTH-RUNTIME-READONLY-LATEST.json "$REQUEST"
          git commit -m "evidence: C6 Client Auth $(cat "$OUT/decision.txt")"
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Persist sanitized failure evidence
        if: failure()
        run: |
          set -euo pipefail
          stage="$(cat "$OUT/stage" 2>/dev/null || echo unknown)"
          STAGE="$stage" node <<'NODE'
          const fs=require('fs');
          const readDecision=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8')).decision||null}catch{return null}};
          const evidence={schemaVersion:'cxorbia.c6.client-auth-readonly-failure.v1',generatedAt:new Date().toISOString(),decision:'FAIL_C6_CLIENT_AUTH_READONLY_GATE',failedStage:String(process.env.STAGE||'unknown'),selectionDecision:readDecision(process.env.OUT+'/client-selection.source-safe.json'),clientRuntimeDecision:readDecision(process.env.OUT+'/client-auth.source-safe.json'),safety:{hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,rulesDeploys:0,storageWrites:0,hrWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,credentialsExposed:false,tokensExposed:false,merge:false,production:false}};
          fs.writeFileSync(process.env.OUT+'/failure-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp "$OUT/failure-evidence.json" app/docs/evidence/CORTE6-CLIENT-AUTH-READONLY-FAILURE-LATEST.json
          node <<'NODE'
          const fs=require('fs'),p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status='consumed_fail';r.consumedAt=new Date().toISOString();r.decision='FAIL_C6_CLIENT_AUTH_READONLY_GATE';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CLIENT-AUTH-READONLY-FAILURE-LATEST.json "$REQUEST"
          git commit -m 'evidence: C6 Client Auth readonly failure' || true
          git push origin HEAD:docs-tya-v6-v71-audit || true

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=success; DESC=C6_CLIENT_AUTH_RESULT_PERSISTED
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC=FAIL_C6_CLIENT_AUTH_READONLY; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/c6-client-auth/$DESC" -f description="$DESC" >/dev/null

      - name: Cleanup private material
        if: always()
        run: rm -rf "$PRIVATE_DIR" "$OUT"
