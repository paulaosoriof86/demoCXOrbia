name: CXOrbia Corte 6 Credential Handoff Dry-Run

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/private-inbox/corte6-credential-bundle.enc.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-corte6-credential-handoff-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate read-only request
        run: |
          set -euo pipefail
          node <<'NODE'
          const r=require('./backend/config/corte6-credential-handoff-dryrun-request.json');
          if(r.schemaVersion!=='cxorbia.corte6.credential-handoff-dryrun-request.v1'||r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.firebaseProjectId!=='cxorbia-backend-dev'||r.tenantId!=='tya'||r.projectId!=='cinepolis')throw new Error('identity_mismatch');
          if(r.enabled!==true||r.status!=='waiting_encrypted_bundle'||r.expectedEnvelopePath!=='backend/private-inbox/corte6-credential-bundle.enc.json')throw new Error('request_not_ready');
          for(const k of ['providerWrites','authWrites','firestoreWrites','rulesDeploys','hostingDeploys','storageWrites','hrWrites','legacyWrites'])if(r[k]!==0)throw new Error('unsafe:'+k);
          if(r.production!==false||r.merge!==false||r.piiExported!==false||r.credentialValuesExported!==false||r.passwordHashesExported!==false||r.secretsExported!==false)throw new Error('unsafe_scope');
          NODE
      - name: Load canonical DEV service account secret
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-handoff-dryrun-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync('.tmp/c6-handoff-dryrun-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-handoff-dryrun-private/credentials.json" >> "$GITHUB_ENV"
      - name: Run decrypt-in-memory provider read-only preflight
        id: dryrun
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_CREDENTIAL_ENVELOPE: backend/private-inbox/corte6-credential-bundle.enc.json
          CXORBIA_CREDENTIAL_DRYRUN_OUT: app/docs/evidence/CORTE6-CREDENTIAL-HANDOFF-DRYRUN-LATEST.json
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node --check tools/qa/cxorbia-corte6-credential-handoff-dryrun.mjs
          node tools/qa/cxorbia-corte6-credential-handoff-dryrun.mjs
      - name: Persist sanitized evidence and freeze read-only request
        if: steps.dryrun.outcome == 'success'
        run: |
          set -euo pipefail
          cp app/docs/evidence/CORTE6-CREDENTIAL-HANDOFF-DRYRUN-LATEST.json /tmp/c6-credential-dryrun.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/c6-credential-dryrun.json app/docs/evidence/CORTE6-CREDENTIAL-HANDOFF-DRYRUN-LATEST.json
          node <<'NODE'
          const fs=require('fs');const p='backend/config/corte6-credential-handoff-dryrun-request.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const e=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-CREDENTIAL-HANDOFF-DRYRUN-LATEST.json','utf8'));
          r.status='consumed_readonly';r.enabled=false;r.consumed=true;r.consumedAt=new Date().toISOString();r.plannedAuthImportMax=e.plannedAuthImportMax;r.decision=e.decision;r.nextGate='EXACT_AUTH_IMPORT_AND_LOGIN_ADAPTER_AUTHORIZATION';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CREDENTIAL-HANDOFF-DRYRUN-LATEST.json backend/config/corte6-credential-handoff-dryrun-request.json
          git commit -m 'evidence: Corte 6 encrypted credential handoff dry-run'
          git push origin HEAD:docs-tya-v6-v71-audit
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success;DESC='PASS_C6_CREDENTIAL_HANDOFF_DRYRUN'
          if [ '${{ job.status }}' != 'success' ]; then STATE=error;DESC='FAIL_C6_CREDENTIAL_HANDOFF_DRYRUN'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-credential-handoff/${DESC}" -f description="$DESC" >/dev/null
      - name: Cleanup
        if: always()
        run: rm -rf .tmp/c6-handoff-dryrun-private
