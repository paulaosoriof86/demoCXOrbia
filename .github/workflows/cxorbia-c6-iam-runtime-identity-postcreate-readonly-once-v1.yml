name: CXOrbia C6 IAM Runtime Identity Postcreate Readonly Once V1

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'backend/config/c6-iam-runtime-identity-postcreate-readonly-request-v1.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-c6-iam-runtime-identity-postcreate-readonly-once-v1
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/c6-iam-runtime-identity-postcreate-readonly-request-v1.json
  OUT_DIR: .tmp/c6-iam-runtime-identity-postcreate-readonly-v1
  GCP_PROJECT_ID: cxorbia-backend-dev
  TARGET_SA_EMAIL: cxorbia-c6-runner-dev@cxorbia-backend-dev.iam.gserviceaccount.com
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  verify:
    name: Verify isolated runtime identity read-only
    if: >-
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'docs-tya-v6-v71-audit' &&
      github.event.pull_request.base.ref == 'release/cxorbia-tya-rc-20260630'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact one-shot read-only request
        id: request
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const p=process.env.REQUEST_FILE;
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const requiredFalse=['iamWrites','deploy','providerReads','providerWrites','skip13Execution','authReads','authWrites','hrReads','hrWrites','firestoreReads','firestoreWrites','rulesWrites','storageReads','storageWrites','hostingDeploy','cloudRunDeploy','cloudBuildWrites','merge','production','make','gemini','payments'];
          const ok=
            x.schemaVersion==='cxorbia.c6.iam-runtime-identity-postcreate-readonly.request.v1' &&
            x.requestId==='c6-iam-runtime-identity-postcreate-readonly-20260806-01' &&
            x.enabled===true && x.consumed===false && x.status==='authorized_execute_once' &&
            x.authorizedBy==='Paula' && Number(x.allowedExecutions)===1 &&
            x.repository==='paulaosoriof86/demoCXOrbia' &&
            x.branch==='docs-tya-v6-v71-audit' && Number(x.pullRequest)===7 &&
            x.environment==='DEV' && x.providerProject==='cxorbia-backend-dev' &&
            x.targetServiceAccount===process.env.TARGET_SA_EMAIL &&
            x.sourceLockMode==='github.event.pull_request.head.sha' &&
            x.expectedParentHeadSha===parent && head===process.env.PR_HEAD_SHA &&
            changed.length===1 && changed[0]===p &&
            x.scope?.describeIdentity===true &&
            x.scope?.listUserManagedKeys===true &&
            x.scope?.readServiceAccountIamPolicy===true &&
            x.scope?.readProjectIamPolicy===true &&
            x.scope?.generateFingerprint===true &&
            requiredFalse.every(k=>x.safeState?.[k]===false);
          if(!ok) throw new Error('IAM_POSTCREATE_READONLY_REQUEST_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`request_id=${x.requestId}\nsource_lock=${head}\nparent_head=${parent}\n`);
          fs.writeFileSync(process.env.OUT_DIR+'/request-source-safe.json',JSON.stringify({requestId:x.requestId,sourceLock:head,parent,changed,target:x.targetServiceAccount,scope:x.scope,safeState:x.safeState},null,2)+'\n');
          NODE

      - name: Claim the single post-creation verification
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses" --paginate --jq '[.[] | select(.context=="cxorbia/c6-iam-runtime-identity-postcreate-readonly-v1/claim")] | length')
          if [ "$existing" != '0' ]; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state='pending' \
            -f context='cxorbia/c6-iam-runtime-identity-postcreate-readonly-v1/claim' \
            -f description='CLAIMED_SINGLE_IAM_POSTCREATE_READONLY_VERIFY' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Stop duplicate before Google Cloud
        if: steps.claim.outputs.claimed != 'true'
        run: exit 2

      - name: Authenticate read-only Google Cloud identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Verify identity keys and bindings read-only
        id: verify
        run: |
          set +e
          mkdir -p "$OUT_DIR"
          describe_rc=0
          user_keys_rc=0
          sa_policy_rc=0
          project_policy_rc=0

          gcloud iam service-accounts describe "$TARGET_SA_EMAIL" \
            --project "$GCP_PROJECT_ID" --format=json \
            > "$OUT_DIR/identity.json" 2> "$OUT_DIR/identity-error.txt" || describe_rc=$?

          gcloud iam service-accounts keys list \
            --iam-account "$TARGET_SA_EMAIL" \
            --project "$GCP_PROJECT_ID" \
            --managed-by=user --format=json \
            > "$OUT_DIR/user-managed-keys.json" 2> "$OUT_DIR/user-managed-keys-error.txt" || user_keys_rc=$?

          gcloud iam service-accounts get-iam-policy "$TARGET_SA_EMAIL" \
            --project "$GCP_PROJECT_ID" --format=json \
            > "$OUT_DIR/service-account-iam-policy.json" 2> "$OUT_DIR/service-account-iam-policy-error.txt" || sa_policy_rc=$?

          gcloud projects get-iam-policy "$GCP_PROJECT_ID" \
            --format=json \
            > "$OUT_DIR/project-iam-policy.json" 2> "$OUT_DIR/project-iam-policy-error.txt" || project_policy_rc=$?

          export describe_rc user_keys_rc sa_policy_rc project_policy_rc
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const out=process.env.OUT_DIR;
          const readJson=(name,fallback)=>{try{return JSON.parse(fs.readFileSync(`${out}/${name}`,'utf8'));}catch{return fallback;}};
          const identity=readJson('identity.json',null);
          const userKeys=readJson('user-managed-keys.json',[]);
          const saPolicy=readJson('service-account-iam-policy.json',null);
          const projectPolicy=readJson('project-iam-policy.json',null);
          const rc={
            describe:Number(process.env.describe_rc||0),
            userKeys:Number(process.env.user_keys_rc||0),
            serviceAccountPolicy:Number(process.env.sa_policy_rc||0),
            projectPolicy:Number(process.env.project_policy_rc||0)
          };
          const target=process.env.TARGET_SA_EMAIL;
          const member=`serviceAccount:${target}`;
          const saBindings=Array.isArray(saPolicy?.bindings)?saPolicy.bindings:[];
          const projectRoles=[];
          for(const binding of (Array.isArray(projectPolicy?.bindings)?projectPolicy.bindings:[])){
            if((binding.members||[]).includes(member)) projectRoles.push(binding.role);
          }
          projectRoles.sort();
          const userManagedKeys=Array.isArray(userKeys)?userKeys:[];
          const existence=!!identity && identity.email===target;
          const enabled=existence && identity.disabled!==true;
          const directBindingsReadable=rc.serviceAccountPolicy===0;
          const projectRolesReadable=rc.projectPolicy===0;
          const directBindingsEmpty=directBindingsReadable && saBindings.length===0;
          const projectRolesEmpty=projectRolesReadable && projectRoles.length===0;
          const noUserManagedKeys=rc.userKeys===0 && userManagedKeys.length===0;
          const fingerprintInput={
            email:identity?.email||target,
            uniqueId:String(identity?.uniqueId||''),
            disabled:identity?.disabled===true,
            userManagedKeys:userManagedKeys.map(k=>({name:k.name||'',keyAlgorithm:k.keyAlgorithm||'',keyOrigin:k.keyOrigin||'',keyType:k.keyType||''})),
            serviceAccountIamPolicy:saBindings,
            projectRoles
          };
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(fingerprintInput)).digest('hex');
          const complete=Object.values(rc).every(v=>v===0);
          const pass=complete && existence && enabled && noUserManagedKeys && directBindingsEmpty && projectRolesEmpty;
          let decision='STOP_RETRY_READBACK_INCOMPLETE';
          if(complete && (!existence || !enabled)) decision='STOP_RETRY_IDENTITY_NOT_ACTIVE';
          else if(complete && !noUserManagedKeys) decision='STOP_RETRY_USER_MANAGED_KEYS_FOUND';
          else if(complete && (!directBindingsEmpty || !projectRolesEmpty)) decision='STOP_RETRY_UNEXPECTED_BINDINGS_OR_ROLES';
          else if(pass) decision='PASS_ISOLATED_RUNTIME_IDENTITY';
          const result={
            schemaVersion:'cxorbia.c6.iam-runtime-identity-postcreate-readonly.result.v1',
            project:process.env.GCP_PROJECT_ID,
            sourceLock:process.env.PR_HEAD_SHA,
            target,
            decision,
            complete,
            checks:{existence,enabled,uniqueId:String(identity?.uniqueId||''),userManagedKeysReadable:rc.userKeys===0,userManagedKeyCount:userManagedKeys.length,noUserManagedKeys,directBindingsReadable,directBindingCount:saBindings.length,directBindingsEmpty,projectRolesReadable,projectRoleCount:projectRoles.length,projectRolesEmpty},
            projectRoles,
            directBindings:saBindings,
            fingerprint,
            readReturnCodes:rc,
            safeState:{iamWrites:0,deploys:0,providerReads:0,providerWrites:0,skip13Executed:false,merge:false,production:false}
          };
          fs.writeFileSync(`${out}/verification-result.json`,JSON.stringify(result,null,2)+'\n');
          fs.writeFileSync(`${out}/decision.txt`,decision+'\n');
          process.stdout.write(JSON.stringify({decision,checks:result.checks,fingerprint,safeState:result.safeState},null,2)+'\n');
          if(!pass) process.exitCode=23;
          NODE
          verify_rc=$?
          exit "$verify_rc"

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-iam-runtime-identity-postcreate-readonly-v1-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Publish terminal statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          desc='STOP_RETRY_C6_IAM_POSTCREATE_READONLY_V1'
          if [ "$JOB_STATE" = 'success' ]; then state=success; desc='PASS_C6_IAM_POSTCREATE_READONLY_V1'; fi
          for context in cxorbia/c6-iam-runtime-identity-postcreate-readonly-v1/overall cxorbia/c6-iam-runtime-identity-postcreate-readonly-v1/claim; do
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
              -f state="$state" -f context="$context" -f description="$desc" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          done
