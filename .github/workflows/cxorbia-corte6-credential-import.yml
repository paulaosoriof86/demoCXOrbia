name: CXOrbia Corte 6 Exact Credential Import

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-credential-import-request.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-corte6-credential-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate request gate
        id: gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='backend/config/corte6-credential-import-request.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.schemaVersion!=='cxorbia.corte6.credential-import-request.v1'||r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.firebaseProjectId!=='cxorbia-backend-dev'||r.tenantId!=='tya'||r.projectId!=='cinepolis') throw new Error('identity_mismatch');
          for(const k of ['passwordResets','deletes','firestoreWrites','rulesDeploys','hostingDeploys','storageWrites','hrWrites','legacyWrites','paymentsWrites','makeWrites','geminiCalls']) if(r[k]!==0) throw new Error('unsafe:'+k);
          if(r.production!==false||r.merge!==false||r.maxAuthImports!==91||r.authWritesMax!==91) throw new Error('unsafe_scope');
          const execute=r.enabled===true&&r.status==='authorized_waiting_execute'&&r.authorizedBy==='Paula'&&typeof r.authorizationText==='string'&&r.authorizationText.length>10&&typeof r.authorizationId==='string'&&r.authorizationId.length>5;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`execute=${execute?'true':'false'}\n`);
          console.log(execute?'AUTHORIZED_EXECUTION_READY':'PREPARED_NOT_AUTHORIZED_NO_PROVIDER_WRITE');
          NODE
      - name: Static source checks
        run: |
          set -euo pipefail
          node --check tools/release/cxorbia-corte6-credential-import.mjs
          node --check app/core/backend-browser-auth.js
          node --check tools/qa/cxorbia-corte6-credential-handoff-dryrun.mjs
          grep -q 'maxAuthImports' backend/config/corte6-credential-import-request.json
          grep -q 'authNamespace' app/core/backend-browser-auth.js
      - name: Load canonical DEV service account
        if: steps.gate.outputs.execute == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-credential-import
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync('.tmp/c6-credential-import/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-credential-import/credentials.json" >> "$GITHUB_ENV"
      - name: Execute exact fail-closed Auth import
        id: execute
        if: steps.gate.outputs.execute == 'true'
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_CREDENTIAL_ENVELOPE: backend/private-inbox/corte6-credential-bundle.enc.json
          CXORBIA_CREDENTIAL_IMPORT_REQUEST: backend/config/corte6-credential-import-request.json
          CXORBIA_CREDENTIAL_IMPORT_OUT: app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node tools/release/cxorbia-corte6-credential-import.mjs
      - name: Persist sanitized evidence and consume authorization
        if: steps.gate.outputs.execute == 'true' && steps.execute.outcome == 'success'
        run: |
          set -euo pipefail
          cp app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json /tmp/c6-credential-import-evidence.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/c6-credential-import-evidence.json app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json
          node <<'NODE'
          const fs=require('fs');const p='backend/config/corte6-credential-import-request.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));const e=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json','utf8'));
          r.status='consumed_pass';r.enabled=false;r.consumed=true;r.consumedAt=new Date().toISOString();r.imported=e.imported;r.readback=e.readback;r.decision=e.decision;r.nextGate='SAME_EXISTING_HOSTING_DEV_LOGIN_FIX_REDEPLOY_ON_SAME_COMBINED_AUTHORIZATION';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json backend/config/corte6-credential-import-request.json
          git commit -m 'evidence: Corte 6 exact legacy Auth import readback'
          git push origin HEAD:docs-tya-v6-v71-audit
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXEC='${{ steps.gate.outputs.execute }}'
          if [ "$EXEC" != 'true' ]; then STATE=success; DESC='PREPARED_C6_CREDENTIAL_IMPORT_NO_EXECUTE';
          elif [ '${{ job.status }}' = 'success' ]; then STATE=success; DESC='PASS_C6_EXACT_CREDENTIAL_IMPORT';
          else STATE=error; DESC='FAIL_C6_EXACT_CREDENTIAL_IMPORT'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-credential-import/${DESC}" -f description="$DESC" >/dev/null
      - name: Cleanup
        if: always()
        run: rm -rf .tmp/c6-credential-import
