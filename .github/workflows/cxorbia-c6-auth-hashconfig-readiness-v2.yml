name: CXOrbia C6 Auth HashConfig Readiness V2

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - '.github/workflows/cxorbia-c6-auth-hashconfig-readiness-v2.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-hashconfig-readiness-v2
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOOL: tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v4.mjs
      READINESS_TOOL: tools/qa/cxorbia-c6-auth-hashconfig-readiness-v2.mjs
      FREEZE_FILE: backend/config/c6-shopper-auth-final-freeze-v4.json
      CONTRACT_FILE: backend/contracts/c6-auth-plan-v4-activation-dev-v1.json
      PRIVATE_DIR: .tmp/c6-auth-hashconfig-readiness-v2/private
      OUT_DIR: .tmp/c6-auth-hashconfig-readiness-v2/out
      PLAN_DIGEST: c0c31fadb88928f5fc0b8a19248188c8610e13362608f1bae3e267034f893ba4
    steps:
      - name: Checkout exact readiness commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Offline readiness pre-gate
        run: |
          set -euo pipefail
          node --check "$TOOL"
          node --check "$READINESS_TOOL"
          node "$TOOL" --source-repair-self-test | tee /tmp/c6-hashconfig-rootfix-selftest.txt
          grep -q 'PASS_C6_AUTH_PLAN_V4_HASHCONFIG_HARNESS_SYNTAX_ROOTFIX_SOURCE_ONLY' /tmp/c6-hashconfig-rootfix-selftest.txt
          node <<'NODE'
          const fs=require('fs');
          const wrapper=fs.readFileSync(process.env.TOOL,'utf8');
          const probe=fs.readFileSync(process.env.READINESS_TOOL,'utf8');
          const freeze=JSON.parse(fs.readFileSync(process.env.FREEZE_FILE,'utf8'));
          const contract=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(wrapper.includes("const newExtraction = 'const body=await response.json(),hashConfig=body?.signIn?.hashConfig;'"),'WRAPPER_RESPONSE_PATH_DRIFT');
          ok(probe.includes("const requiredPermission = 'firebaseauth.configs.getHashConfig';"),'REQUIRED_PERMISSION_DRIFT');
          ok(probe.includes('const hashConfig = body?.signIn?.hashConfig;'),'READINESS_RESPONSE_PATH_DRIFT');
          ok(!probe.includes('setIamPolicy')&&!probe.includes('updateIamPolicy')&&!probe.includes('auth.createUser(')&&!probe.includes('auth.updateUser(')&&!probe.includes('setCustomUserClaims('),'READINESS_WRITE_TOKEN_FOUND');
          ok(freeze.finalPlanV4?.rows===340&&freeze.finalPlanV4?.uniqueRows===340&&freeze.finalPlanV4?.rowsDigestSha256===process.env.PLAN_DIGEST,'FREEZE_DRIFT');
          ok(freeze.finalPlanV4?.operationCounts?.CREATE_AUTH===118&&freeze.finalPlanV4?.operationCounts?.UPDATE_AUTH===9&&freeze.finalPlanV4?.operationCounts?.HOLD===0&&freeze.finalPlanV4?.subchangeCounts?.password===8,'FREEZE_COUNTS_DRIFT');
          ok(contract.inputFreeze?.rowsDigestSha256===process.env.PLAN_DIGEST&&contract.prewrite?.passwordChanges===8,'CONTRACT_DRIFT');
          ok(contract.identityCircuitBreaker?.reopenPlanV3UpdateUniverse===false&&contract.identityCircuitBreaker?.reopenSkip13===false&&contract.identityCircuitBreaker?.reopenMultiAuthAdjudication===false&&contract.identityCircuitBreaker?.reopenAc93Lineage===false,'IDENTITY_CIRCUIT_BREAKER_DRIFT');
          console.log('PASS_C6_AUTH_HASHCONFIG_READINESS_OFFLINE_PREGATE');
          NODE

      - name: Install pinned Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Load exact PREWRITE DEV principal privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p "$PRIVATE_DIR" "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null;
          try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync(`${process.env.PRIVATE_DIR}/credentials.json`,raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"

      - name: Read-only permission and hash material readiness
        id: readiness
        run: |
          set +e
          node "$READINESS_TOOL" > "$OUT_DIR/hashconfig-readiness-source-safe.json"
          code=$?
          decision=$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/hashconfig-readiness-source-safe.json','utf8'));process.stdout.write(r.decision||'STOP_RETRY_C6_AUTH_HASHCONFIG_READINESS')")
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          cat "$OUT_DIR/hashconfig-readiness-source-safe.json"
          exit 0

      - name: Verify source-safe readiness evidence
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p=`${process.env.OUT_DIR}/hashconfig-readiness-source-safe.json`;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(typeof r.principalFp==='string'&&r.principalFp.length===20,'PRINCIPAL_FP_MISSING');
          ok(r.safety?.iamWrites===0&&r.safety?.authWrites===0&&r.safety?.firestoreWrites===0&&r.safety?.hrWrites===0&&r.safety?.rulesWrites===0&&r.safety?.storageWrites===0,'WRITE_DRIFT');
          ok(r.safety?.rawPrincipalExported===false&&r.safety?.rawHashConfigExported===false,'SOURCE_SAFE_DRIFT');
          if(r.decision==='PASS_C6_AUTH_HASHCONFIG_PERMISSION_AND_MATERIAL_READINESS'){
            ok(r.iamTest?.pass===true&&r.iamTest?.permissionGranted===true,'IAM_PERMISSION_NOT_PASS');
            ok(r.configRead?.pass===true&&r.configRead?.signInPresent===true&&r.configRead?.hashConfigPresent===true&&r.configRead?.fieldCount>0,'HASH_CONFIG_MATERIAL_NOT_PASS');
          }
          console.log(JSON.stringify({decision:r.decision,principalFp:r.principalFp,iamTest:r.iamTest,configRead:r.configRead,safety:r.safety,error:r.error||null}));
          NODE

      - name: Upload source-safe readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-hashconfig-readiness-v2-${{ github.run_id }}
          path: .tmp/c6-auth-hashconfig-readiness-v2/out
          if-no-files-found: warn
          retention-days: 14

      - name: Publish readiness decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.readiness.outputs.decision }}
        run: |
          set -euo pipefail
          decision="${DECISION:-STOP_RETRY_C6_AUTH_HASHCONFIG_READINESS}"
          state=failure
          if [ "$decision" = 'PASS_C6_AUTH_HASHCONFIG_PERMISSION_AND_MATERIAL_READINESS' ]; then state=success; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='cxorbia/c6-auth-v4-hashconfig-readiness-v2' -f description="$(printf '%s' "$decision" | cut -c1-140)" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf "$PRIVATE_DIR"

      - name: Enforce readiness PASS
        if: always()
        env:
          DECISION: ${{ steps.readiness.outputs.decision }}
        run: |
          test "${DECISION:-}" = 'PASS_C6_AUTH_HASHCONFIG_PERMISSION_AND_MATERIAL_READINESS' || { echo "STOP_RETRY:${DECISION:-NO_DECISION}"; exit 1; }
