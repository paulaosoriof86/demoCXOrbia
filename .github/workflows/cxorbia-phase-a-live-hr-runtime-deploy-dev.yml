name: CXOrbia Existing Runtime Deploy — I3 Frozen + G2B P0 Recovery

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/i3-legal-v04-runtime-deploy-dev-execute.json'
      - 'backend/config/cxorbia-g2b-p0-writepath-deploy-execute.json'
      - 'backend/config/cxorbia-g2b-p0-writepath-deploy-recovery-execute.json'

permissions:
  contents: write
  statuses: write
  issues: write
  id-token: write

concurrency:
  group: cxorbia-existing-runtime-deploy-single
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  CLOUD_RUN_RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  HOSTING_SITE: cxorbia-backend-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  G2B_ORIGINAL_REQUEST_FILE: backend/config/cxorbia-g2b-p0-writepath-deploy-request.json
  G2B_RECOVERY_REQUEST_FILE: backend/config/cxorbia-g2b-p0-writepath-deploy-recovery-request.json
  G2B_RECOVERY_EXECUTE_FILE: backend/config/cxorbia-g2b-p0-writepath-deploy-recovery-execute.json
  G2B_RECONCILIATION_EVIDENCE: app/docs/evidence/I5-G2B-PROVIDER-READONLY-RECONCILIATION-LATEST.json
  G2B_RECOVERY_EVIDENCE: app/docs/evidence/I5-G2B-P0-WRITEPATH-RECOVERY-LATEST.json
  G2B_OUT_DIR: .tmp/g2b-p0-writepath-recovery
  G2B_SOURCE_DIR: .tmp/g2b-p0-writepath-recovery-source
  G2B_EXPECTED_GATE: PAULA_I5_G2B_P0_WRITEPATH_RECOVERY_REARM
  G2B_RUNTIME_GATE: PAULA_I5_G2B_SYNTHETIC_CANONICAL_WRITE_PATH
  G2B_SYNTH_REQUEST: i5-g2b-live-synthetic-acceptance-20260820-01

jobs:
  frozen-i3-legal-runtime:
    if: contains(github.event.head_commit.added, 'backend/config/i3-legal-v04-runtime-deploy-dev-execute.json') || contains(github.event.head_commit.modified, 'backend/config/i3-legal-v04-runtime-deploy-dev-execute.json')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'I3 legal runtime deploy lane is terminal/frozen.'
          exit 1

  frozen-g2b-original-one-shot:
    if: contains(github.event.head_commit.added, 'backend/config/cxorbia-g2b-p0-writepath-deploy-execute.json') || contains(github.event.head_commit.modified, 'backend/config/cxorbia-g2b-p0-writepath-deploy-execute.json')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Original G2-B one-shot is frozen after A_NO_G2B_PROVIDER_DEPLOY_OBSERVED. Automatic retry is forbidden.'
          exit 1

  recover-g2b-p0-writepath:
    if: contains(github.event.head_commit.added, 'backend/config/cxorbia-g2b-p0-writepath-deploy-recovery-execute.json')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - name: Validate explicit recovery re-arm and exact execute commit
        run: |
          set -euo pipefail
          mkdir -p "$G2B_OUT_DIR"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.G2B_RECOVERY_REQUEST_FILE,'utf8'));
          const x=JSON.parse(fs.readFileSync(process.env.G2B_RECOVERY_EXECUTE_FILE,'utf8'));
          const a=JSON.parse(fs.readFileSync(process.env.G2B_RECONCILIATION_EVIDENCE,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const changed=cp.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(changed.length!==1||changed[0]!==process.env.G2B_RECOVERY_EXECUTE_FILE)throw new Error('recovery_execute_commit_scope_invalid:'+changed.join(','));
          if(r.schemaVersion!=='cxorbia.g2b.p0-writepath-deploy.recovery-request.v1'||x.schemaVersion!=='cxorbia.g2b.p0-writepath-deploy.recovery-execute.v1')throw new Error('recovery_schema_invalid');
          if(r.recoveryId!==x.recoveryId||r.originalRequestId!=='i5-g2b-p0-writepath-deploy-20260820-01'||r.originalExecuteSha!=='c746bdf068edf1322b7c9a5e497ea5aff13e6b58')throw new Error('recovery_lineage_invalid');
          if(a.decision!=='A_NO_G2B_PROVIDER_DEPLOY_OBSERVED'||a.execution?.sha!==r.originalExecuteSha)throw new Error('proven_A_reconciliation_missing');
          for(const o of [r,x]){
            if(o.repository!=='paulaosoriof86/demoCXOrbia'||o.branch!=='docs-tya-v6-v71-audit'||Number(o.pullRequest)!==7)throw new Error('lane_invalid');
            if(o.firebaseProjectId!=='cxorbia-backend-dev'||o.cloudRunService!=='cxorbia-live-hr-dev'||o.cloudRunRegion!=='us-central1'||o.hostingSite!=='cxorbia-backend-dev'||o.hostingTarget!=='cxorbia-dev')throw new Error('target_invalid');
            if(o.authorizationGate!==process.env.G2B_EXPECTED_GATE||o.authorizedBy!=='Paula')throw new Error('recovery_authorization_invalid');
            if(o.enabled!==true||o.consumed!==false||o.automaticRetryAllowed!==false||o.merge!==false)throw new Error('recovery_one_shot_state_invalid');
          }
          if(r.status!=='authorized_recovery_pending_execute'||r.paulaExplicitInCurrentConversation!==true)throw new Error('recovery_not_explicitly_armed');
          if(Number(r.maxExecutionCount)!==1||Number(r.executionCount)!==0||Number(r.cloudBuildExecutionsMax)!==1||Number(r.cloudRunDeployExecutionsMax)!==1||Number(r.hostingDeployExecutionsMax)!==1)throw new Error('recovery_budget_invalid');
          for(const k of ['firestoreWrites','authWrites','storageWrites','externalHrWrites','realDataWrites','realCredentialWrites','realPaymentWrites','rulesWrites','makeCalls','geminiCalls'])if(Number(r[k]||0)!==0)throw new Error('forbidden_budget:'+k);
          if(r.sourceFixHeadSha!=='1d2cfecba0a89b637398d747a628e549d9823c68'||x.sourceFixHeadSha!==r.sourceFixHeadSha)throw new Error('source_fix_lock_invalid');
          cp.execFileSync('git',['cat-file','-e',r.sourceFixHeadSha+'^{commit}']);
          fs.writeFileSync(process.env.G2B_OUT_DIR+'/authorization.json',JSON.stringify({decision:'PASS_G2B_RECOVERY_REARM_AUTHORIZATION',head,recoveryId:r.recoveryId,sourceFixHeadSha:r.sourceFixHeadSha},null,2)+'\n');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate existing Google Cloud project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Install transient readback and Hosting tooling
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest >/dev/null 2>&1

      - name: Provider pre-readback must match proven A baseline
        id: preflight
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$G2B_OUT_DIR/cloudrun-before.json"
          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/sites/${HOSTING_SITE}/releases?pageSize=1" > "$G2B_OUT_DIR/hosting-before.json"
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.G2B_RECOVERY_REQUEST_FILE,'utf8'));const cr=JSON.parse(fs.readFileSync(process.env.G2B_OUT_DIR+'/cloudrun-before.json','utf8'));const h=JSON.parse(fs.readFileSync(process.env.G2B_OUT_DIR+'/hosting-before.json','utf8'));const base=r.providerBaseline||{};const rev=String(cr.status?.latestReadyRevisionName||cr.latestReadyRevision||'').split('/').at(-1);const rel=h.releases?.[0]||{};if(rev!==base.cloudRunRevision)throw new Error('RECOVERY_HOLD_PROVIDER_DRIFT_CLOUD_RUN:'+rev);if(rel.name!==base.hostingReleaseName||rel.version?.name!==base.hostingVersionName||rel.releaseTime!==base.hostingReleaseTime)throw new Error('RECOVERY_HOLD_PROVIDER_DRIFT_HOSTING');fs.writeFileSync(process.env.G2B_OUT_DIR+'/preflight.json',JSON.stringify({decision:'PASS_G2B_RECOVERY_PROVIDER_BASELINE_UNCHANGED',cloudRunRevision:rev,hostingReleaseName:rel.name,hostingVersionName:rel.version?.name,hostingReleaseTime:rel.releaseTime,providerWrites:0},null,2)+'\n');
          NODE
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='cxorbia/g2b-recovery-preflight' -f description='PASS_G2B_RECOVERY_PROVIDER_BASELINE_UNCHANGED' >/dev/null

      - name: Prove zero G2-B synthetic residue before recovery
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');if(sa.project_id!=='cxorbia-backend-dev')throw new Error('wrong_service_account_project');admin.initializeApp({credential:admin.credential.cert(sa),projectId:'cxorbia-backend-dev'});const db=admin.firestore(),auth=admin.auth(),rid=process.env.G2B_SYNTH_REQUEST;async function count(c){return (await c.where('syntheticRequestId','==',rid).get()).size;}(async()=>{const t=db.collection('tenants').doc('tya'),p=t.collection('projects').doc('cinepolis');const counts={visits:await count(p.collection('visits')),postulations:await count(p.collection('postulations')),receipts:await count(t.collection('commandReceipts')),audit:await count(t.collection('entityAuditTrail')),shoppers:await count(t.collection('shoppers'))};let syntheticAuth=0,token;do{const page=await auth.listUsers(1000,token);syntheticAuth+=page.users.filter(u=>u.customClaims?.syntheticRequestId===rid).length;token=page.pageToken;}while(token);if(Object.values(counts).some(Number)||syntheticAuth!==0)throw new Error('recovery_pre_synthetic_residue:'+JSON.stringify({...counts,syntheticAuth}));fs.writeFileSync(process.env.G2B_OUT_DIR+'/provider-data-before.json',JSON.stringify({decision:'PASS_G2B_RECOVERY_ZERO_SYNTHETIC_RESIDUE_BEFORE',counts,syntheticAuth},null,2)+'\n');})();
          NODE

      - name: Prepare exact detached source-fix worktree
        run: |
          set -euo pipefail
          rm -rf "$G2B_SOURCE_DIR"
          git worktree add --detach "$G2B_SOURCE_DIR" 1d2cfecba0a89b637398d747a628e549d9823c68
          test "$(git -C "$G2B_SOURCE_DIR" rev-parse HEAD)" = '1d2cfecba0a89b637398d747a628e549d9823c68'
          node --check "$G2B_SOURCE_DIR/backend/runtime/hr-live-service/g2b-synthetic-runtime.mjs"
          node --check "$G2B_SOURCE_DIR/backend/runtime/hr-live-service/server.mjs"
          grep -q 'g2b-synthetic/commands' "$G2B_SOURCE_DIR/backend/runtime/hr-live-service/server.mjs"
          grep -q 'YES_PAULA_20260820_G2B_SYNTHETIC' "$G2B_SOURCE_DIR/app/adapters/cxorbia-canonical-write-firewall-v1.js"

      - name: Build exact corrected Cloud Run image once
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          IMAGE_URI="gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:g2b-p0-recovery-${GITHUB_RUN_ID}"
          echo "$IMAGE_URI" > "$G2B_OUT_DIR/image-uri.txt"
          (cd "$G2B_SOURCE_DIR" && gcloud builds submit . --project "$GCP_PROJECT_ID" --config backend/runtime/hr-live-service/cloudbuild.yaml --substitutions "_IMAGE=$IMAGE_URI" --quiet)

      - name: Update existing Cloud Run once
        id: cloudrun
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          IMAGE_URI="$(cat "$G2B_OUT_DIR/image-uri.txt")"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE_URI" --service-account "$CLOUD_RUN_RUNTIME_SA" --update-env-vars "CXORBIA_G2B_SYNTHETIC_WRITE_ENABLED=true,CXORBIA_G2B_SYNTHETIC_WRITE_GATE=${G2B_RUNTIME_GATE},CXORBIA_G2B_SYNTHETIC_REQUEST_ID=${G2B_SYNTH_REQUEST}" --quiet

      - name: Read back Cloud Run immediately after mutation attempt
        if: always() && steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$G2B_OUT_DIR/cloudrun-after.json"
          revision="$(node -e "const x=require('./$G2B_OUT_DIR/cloudrun-after.json');process.stdout.write(String(x.status?.latestReadyRevisionName||x.latestReadyRevision||'').split('/').at(-1)||'unknown')")"
          state=error; [ '${{ steps.cloudrun.outcome }}' = 'success' ] && state=success
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='cxorbia/g2b-recovery-cloudrun' -f description="Cloud Run readback: ${revision:0:80}" >/dev/null

      - name: Direct Cloud Run fail-closed smoke
        id: direct_smoke
        if: steps.cloudrun.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          base="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl -fsS --retry 10 --retry-delay 3 "$base/health" > "$G2B_OUT_DIR/health.json"
          code="$(curl -sS -o "$G2B_OUT_DIR/direct-route.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$base/api/tenants/tya/projects/cinepolis/g2b-synthetic/commands")"
          echo "$code" > "$G2B_OUT_DIR/direct-route.code"
          test "$code" = '401'
          node -e "const x=require('./$G2B_OUT_DIR/direct-route.json');if(x.error!=='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED')process.exit(2)"

      - name: Deploy existing Hosting target once only after Cloud Run proof
        id: hosting
        if: steps.cloudrun.outcome == 'success' && steps.direct_smoke.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          (cd "$G2B_SOURCE_DIR" && "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$GCP_PROJECT_ID" --non-interactive)

      - name: Read back Hosting immediately after mutation attempt
        if: always() && steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/sites/${HOSTING_SITE}/releases?pageSize=1" > "$G2B_OUT_DIR/hosting-after.json"
          rel="$(node -e "const x=require('./$G2B_OUT_DIR/hosting-after.json');process.stdout.write(x.releases?.[0]?.name||'unknown')")"
          state=error; [ '${{ steps.hosting.outcome }}' = 'success' ] && state=success
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='cxorbia/g2b-recovery-hosting' -f description="Hosting readback: ${rel:0:90}" >/dev/null

      - name: Hosting route fail-closed smoke
        id: hosting_smoke
        if: steps.hosting.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$G2B_OUT_DIR/hosting-route.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$DEV_ROOT_URL/api/tenants/tya/projects/cinepolis/g2b-synthetic/commands")"
          echo "$code" > "$G2B_OUT_DIR/hosting-route.code"
          test "$code" = '401'
          node -e "const x=require('./$G2B_OUT_DIR/hosting-route.json');if(x.error!=='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED')process.exit(2)"

      - name: Prove recovery created no business or Auth data
        id: provider_data_after
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');if(sa.project_id!=='cxorbia-backend-dev')throw new Error('wrong_service_account_project');if(!admin.apps.length)admin.initializeApp({credential:admin.credential.cert(sa),projectId:'cxorbia-backend-dev'});const db=admin.firestore(),auth=admin.auth(),rid=process.env.G2B_SYNTH_REQUEST;async function count(c){return (await c.where('syntheticRequestId','==',rid).get()).size;}(async()=>{const t=db.collection('tenants').doc('tya'),p=t.collection('projects').doc('cinepolis');const counts={visits:await count(p.collection('visits')),postulations:await count(p.collection('postulations')),receipts:await count(t.collection('commandReceipts')),audit:await count(t.collection('entityAuditTrail')),shoppers:await count(t.collection('shoppers'))};let syntheticAuth=0,token;do{const page=await auth.listUsers(1000,token);syntheticAuth+=page.users.filter(u=>u.customClaims?.syntheticRequestId===rid).length;token=page.pageToken;}while(token);if(Object.values(counts).some(Number)||syntheticAuth!==0)throw new Error('recovery_created_provider_data:'+JSON.stringify({...counts,syntheticAuth}));fs.writeFileSync(process.env.G2B_OUT_DIR+'/provider-data-after.json',JSON.stringify({decision:'PASS_G2B_RECOVERY_ZERO_BUSINESS_AUTH_WRITES',counts,syntheticAuth},null,2)+'\n');})();
          NODE

      - name: Persist terminal recovery classification without retriggering execute
        if: always() && steps.preflight.outcome == 'success'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CLOUDRUN_OUTCOME: ${{ steps.cloudrun.outcome }}
          DIRECT_SMOKE_OUTCOME: ${{ steps.direct_smoke.outcome }}
          HOSTING_OUTCOME: ${{ steps.hosting.outcome }}
          HOSTING_SMOKE_OUTCOME: ${{ steps.hosting_smoke.outcome }}
          PROVIDER_DATA_OUTCOME: ${{ steps.provider_data_after.outcome }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const req=JSON.parse(fs.readFileSync(process.env.G2B_RECOVERY_REQUEST_FILE,'utf8'));const preCr=JSON.parse(fs.readFileSync(process.env.G2B_OUT_DIR+'/cloudrun-before.json','utf8'));const postCr=fs.existsSync(process.env.G2B_OUT_DIR+'/cloudrun-after.json')?JSON.parse(fs.readFileSync(process.env.G2B_OUT_DIR+'/cloudrun-after.json','utf8')):preCr;const preH=JSON.parse(fs.readFileSync(process.env.G2B_OUT_DIR+'/hosting-before.json','utf8'));const postH=fs.existsSync(process.env.G2B_OUT_DIR+'/hosting-after.json')?JSON.parse(fs.readFileSync(process.env.G2B_OUT_DIR+'/hosting-after.json','utf8')):preH;const baseRev=String(preCr.status?.latestReadyRevisionName||preCr.latestReadyRevision||'').split('/').at(-1)||null,postRev=String(postCr.status?.latestReadyRevisionName||postCr.latestReadyRevision||'').split('/').at(-1)||null;const baseRel=preH.releases?.[0]?.name||null,postRel=postH.releases?.[0]?.name||null;const directCode=Number(fs.existsSync(process.env.G2B_OUT_DIR+'/direct-route.code')?fs.readFileSync(process.env.G2B_OUT_DIR+'/direct-route.code','utf8').trim():0),hostingCode=Number(fs.existsSync(process.env.G2B_OUT_DIR+'/hosting-route.code')?fs.readFileSync(process.env.G2B_OUT_DIR+'/hosting-route.code','utf8').trim():0);const crChanged=Boolean(postRev&&baseRev&&postRev!==baseRev),hostingChanged=Boolean(postRel&&baseRel&&postRel!==baseRel);let decision='RECOVERY_NO_PROVIDER_SIDE_EFFECT';if(crChanged&&hostingChanged&&directCode===401&&hostingCode===401&&process.env.PROVIDER_DATA_OUTCOME==='success')decision='RECOVERY_PASS_FULL';else if(crChanged&&!hostingChanged)decision='RECOVERY_PARTIAL_CLOUD_RUN_ONLY';else if(crChanged||hostingChanged)decision='RECOVERY_PARTIAL_OR_NONTERMINAL';const evidence={schemaVersion:'cxorbia.g2b.p0-writepath-deploy.recovery-evidence.v1',generatedAt:new Date().toISOString(),decision,recoveryId:req.recoveryId,originalRequestId:req.originalRequestId,sourceFixHeadSha:req.sourceFixHeadSha,providerBaseline:{cloudRunRevision:baseRev,hostingReleaseName:baseRel},providerAfter:{cloudRunRevision:postRev,hostingReleaseName:postRel},outcomes:{build:process.env.BUILD_OUTCOME,cloudRun:process.env.CLOUDRUN_OUTCOME,directSmoke:process.env.DIRECT_SMOKE_OUTCOME,hosting:process.env.HOSTING_OUTCOME,hostingSmoke:process.env.HOSTING_SMOKE_OUTCOME,providerData:process.env.PROVIDER_DATA_OUTCOME},routeCodes:{direct:directCode,hosting:hostingCode},cloudRunChanged:crChanged,hostingChanged,automaticRetryAllowed:false,firestoreWrites:0,authWrites:0,storageWrites:0,externalHrWrites:0,realDataWrites:0,realCredentialWrites:0,realPaymentWrites:0,rulesWrites:0,makeCalls:0,geminiCalls:0,merge:false,next:decision==='RECOVERY_PASS_FULL'?'G2B_STAGE_AND_TEST_SYNTHETIC_ONLY':'RECOVERY_RECONCILE_AND_REQUIRE_NEW_EXPLICIT_DECISION'};fs.writeFileSync('/tmp/g2b-recovery-evidence.json',JSON.stringify(evidence,null,2)+'\n');fs.writeFileSync('/tmp/g2b-recovery-decision.txt',decision+'\n');
          NODE
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/g2b-recovery-evidence.json "$G2B_RECOVERY_EVIDENCE"
          decision="$(tr -d '\r\n' < /tmp/g2b-recovery-decision.txt)"
          node - "$decision" <<'NODE'
          const fs=require('fs');const decision=process.argv[2],now=new Date().toISOString(),rp=process.env.G2B_RECOVERY_REQUEST_FILE,op=process.env.G2B_ORIGINAL_REQUEST_FILE;const r=JSON.parse(fs.readFileSync(rp,'utf8')),e=JSON.parse(fs.readFileSync(process.env.G2B_RECOVERY_EVIDENCE,'utf8'));r.status=decision.toLowerCase();r.enabled=false;r.consumed=true;r.executionCount=1;r.consumedAt=now;r.decision=decision;r.automaticRetryAllowed=false;r.providerAfter=e.providerAfter;r.next=e.next;fs.writeFileSync(rp,JSON.stringify(r,null,2)+'\n');const o=JSON.parse(fs.readFileSync(op,'utf8'));o.recoveryAttemptConsumed=true;o.recoveryDecision=decision;o.recoveryEvidence=process.env.G2B_RECOVERY_EVIDENCE;o.automaticRetryAllowed=false;if(decision==='RECOVERY_PASS_FULL'){o.status='consumed_pass_p0_writepath_deployed_via_recovery';o.enabled=false;o.consumed=true;o.cloudRunDeployExecutions=1;o.hostingDeployExecutions=1;o.cloudRunRevision=e.providerAfter.cloudRunRevision;o.consumedAt=now;o.decision='PASS_G2B_P0_CANONICAL_WRITE_PATH_CORRECTION_DEPLOYED_VIA_RECOVERY';o.next='G2B_STAGE_AND_TEST_SYNTHETIC_ONLY';}else{o.enabled=false;o.next='RECOVERY_RECONCILE_AND_REQUIRE_NEW_EXPLICIT_DECISION';}fs.writeFileSync(op,JSON.stringify(o,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$G2B_RECOVERY_EVIDENCE" "$G2B_RECOVERY_REQUEST_FILE" "$G2B_ORIGINAL_REQUEST_FILE"
          git commit -m "evidence(g2b): persist recovery ${decision}"
          git pull --rebase origin docs-tya-v6-v71-audit
          git push origin HEAD:docs-tya-v6-v71-audit
          state=error; [ "$decision" = 'RECOVERY_PASS_FULL' ] && state=success
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='cxorbia/g2b-recovery-terminal' -f description="$decision" >/dev/null
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "## G2-B P0 recovery terminal evidence\n\nDecision: \`$decision\`. Automatic retry: \`false\`. Provider business/Auth/HR/payment writes: \`0\`." >/dev/null

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-g2b-p0-recovery-${{ github.run_id }}
          path: .tmp/g2b-p0-writepath-recovery/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce full recovery result
        if: always() && steps.preflight.outcome == 'success'
        run: test "$(cat /tmp/g2b-recovery-decision.txt 2>/dev/null | tr -d '\r\n')" = 'RECOVERY_PASS_FULL'
