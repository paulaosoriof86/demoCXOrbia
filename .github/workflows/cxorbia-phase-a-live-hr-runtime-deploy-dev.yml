name: CXOrbia Existing Runtime — F4 Read-Only Recertification

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/workflows/cxorbia-phase-a-live-hr-runtime-deploy-dev.yml'
      - 'backend/config/cxorbia-f4-g2b-readonly-recertification-authorization.json'

permissions:
  contents: read

concurrency:
  group: cxorbia-f4-g2b-readonly-recertification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  HOSTING_SITE: cxorbia-backend-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  RECERT_AUTH_FILE: backend/config/cxorbia-f4-g2b-readonly-recertification-authorization.json
  F4_LOCK_FILE: backend/config/cxorbia-phase-a-continuity-lock.json
  F4_STOP_EVIDENCE: app/docs/evidence/RC15-F4-G2B-RECOVERY-STOP-LATEST.json
  F4_LEASE_FILE: backend/config/cxorbia-f4-g2b-provider-mutation-lease.json
  OUT_DIR: .tmp/f4-g2b-readonly-recertification
  RECERT_AUTH_ID: F4-G2B-READONLY-RECERTIFICATION-20260826-01
  EXPECTED_CONTROL_HEAD_BEFORE: e8a2b75cdacb6a199aa7a4b9808058e00161208d
  SOURCE_FIX_SHA: 1d2cfecba0a89b637398d747a628e549d9823c68
  EXPECTED_REVISION: cxorbia-live-hr-dev-00012-gw9
  EXPECTED_IMAGE_DIGEST: sha256:4e2cd8cbd8d7b28a2abada2ea5060b58691f5582e871220afe141c4824027970
  G2B_SYNTH_REQUEST: i5-g2b-live-synthetic-acceptance-20260820-01
  EXPECTED_HOSTING_RELEASE_AFTER: '2026-08-27T02:10:00Z'

jobs:
  f4-readonly-recertification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recertification control-plane commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate read-only authorization and consumed F4 boundary
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const j=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const a=j(process.env.RECERT_AUTH_FILE),lock=j(process.env.F4_LOCK_FILE),stop=j(process.env.F4_STOP_EVIDENCE),lease=j(process.env.F4_LEASE_FILE);
          const head=git('rev-parse','HEAD'),parent=git('rev-parse','HEAD^');
          if(parent!==process.env.EXPECTED_CONTROL_HEAD_BEFORE)throw new Error('MECHANISM_P0:recert_parent_head_mismatch:'+parent);
          if(a.authorizationId!==process.env.RECERT_AUTH_ID||a.status!=='AUTHORIZED_CURRENT_CONVERSATION_READ_ONLY'||a.authorizedBy!=='Paula')throw new Error('MECHANISM_P0:recert_authorization_invalid');
          if(a.controlPlaneHeadBefore!==parent||a.repository!=='paulaosoriof86/demoCXOrbia'||a.branch!=='docs-tya-v6-v71-audit')throw new Error('MECHANISM_P0:recert_binding_invalid');
          if(a.scope?.providerMutationAuthorized!==false||a.scope?.cloudBuildAuthorized!==false||a.scope?.cloudRunUpdateAuthorized!==false||a.scope?.hostingDeployAuthorized!==false||a.scope?.leaseIssueAuthorized!==false||a.scope?.leaseReuseAuthorized!==false||a.scope?.authenticatedSyntheticCommandAuthorized!==false)throw new Error('MECHANISM_P0:recert_scope_not_readonly');
          for(const k of ['firestoreWritesAuthorized','authWritesAuthorized','storageWritesAuthorized','externalHrWritesAuthorized','realDataWritesAuthorized','realCredentialWritesAuthorized','paymentWritesAuthorized','rulesWritesAuthorized','makeCallsAuthorized','geminiCallsAuthorized','mergeAuthorized'])if(a.scope?.[k]!==false)throw new Error('MECHANISM_P0:forbidden_scope_'+k);
          if(stop.decision!=='TERMINAL_STOP_MECHANISM_P0_POST_HOSTING_READBACK_NOT_STABILIZED'||stop.recoveryPassFull!==false||stop.productP0Proven!==false)throw new Error('MECHANISM_P0:f4_terminal_stop_binding');
          if(lock.f4ExecutionControl?.status!=='TERMINAL_STOP_MECHANISM_P0_POST_HOSTING_READBACK_NOT_STABILIZED'||lock.f4ExecutionControl?.recoveryPassFull!==false||lock.f4ExecutionControl?.providerMutationAuthorizedNow!==false)throw new Error('MECHANISM_P0:continuity_terminal_state');
          if(lock.nextNow?.action!=='WAITING_EXPLICIT_PLAN_CHANGE_OR_READONLY_RECERTIFICATION_DECISION')throw new Error('MECHANISM_P0:continuity_next_state');
          if(lease.issued!==true||lease.consumed!==true||lease.singleUse!==true||lease.state!=='CONSUMED_MUTATION_STARTED')throw new Error('MECHANISM_P0:consumed_lease_boundary_invalid');
          const changed=git('diff','--name-only','HEAD^','HEAD').split(/\r?\n/).filter(Boolean).sort();
          const expected=['.github/workflows/cxorbia-phase-a-live-hr-runtime-deploy-dev.yml','backend/config/cxorbia-f4-g2b-readonly-recertification-authorization.json'].sort();
          if(JSON.stringify(changed)!==JSON.stringify(expected))throw new Error('MECHANISM_P0:recert_control_plane_delta_invalid:'+changed.join(','));
          fs.writeFileSync(process.env.OUT_DIR+'/authority.json',JSON.stringify({decision:'PASS_F4_READONLY_RECERT_AUTHORITY',head,parent,authorizationId:a.authorizationId,terminalStop:stop.decision,leaseConsumed:true,providerMutationAuthorized:false,changedFiles:changed},null,2)+'\n');
          NODE

      - name: Pin expected source file without deploying
        run: |
          set -euo pipefail
          git show "$SOURCE_FIX_SHA:app/adapters/cxorbia-canonical-write-firewall-v1.js" > "$OUT_DIR/firewall.source.js"
          sha256sum "$OUT_DIR/firewall.source.js" | awk '{print $1}' > "$OUT_DIR/firewall.source.sha256"
          grep -Fq 'YES_PAULA_20260820_G2B_SYNTHETIC' "$OUT_DIR/firewall.source.js"
          grep -Fq 'cxorbia-command-http-transport-v1.js' "$OUT_DIR/firewall.source.js"

      - name: Authenticate existing Google Cloud project read-only execution
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Install transient read-only Firebase SDK
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Recertify Cloud Run, Hosting and synthetic residue read-only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT_DIR/cloud-run.json"
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/cloud-run.json','utf8'));
          const rev=r?.status?.latestReadyRevisionName||'';if(rev!==process.env.EXPECTED_REVISION)throw new Error('MECHANISM_P0:cloud_run_revision_drift:'+rev);
          const image=r?.spec?.template?.spec?.containers?.[0]?.image||'';if(!image.includes(process.env.EXPECTED_IMAGE_DIGEST))throw new Error('MECHANISM_P0:cloud_run_digest_drift:'+image);
          const traffic=(r?.status?.traffic||[]).find(x=>x?.revisionName===process.env.EXPECTED_REVISION);if(Number(traffic?.percent)!==100)throw new Error('MECHANISM_P0:cloud_run_traffic_not_100');
          NODE
          base="$(node -e "const r=require('./$OUT_DIR/cloud-run.json');process.stdout.write(r?.status?.url||'')")"
          test -n "$base"
          curl -fsS --retry 3 --retry-delay 2 "$base/health" > "$OUT_DIR/health.json"
          node <<'NODE'
          const fs=require('fs'),h=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/health.json','utf8'));
          if(h.ok!==true||h.g2bSyntheticCommandSourceReady!==true||h.g2bSyntheticWriteEnabled!==true||h.g2bSyntheticOnly!==true)throw new Error('PRODUCT_P0:g2b_health_not_ready');
          NODE

          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/sites/${HOSTING_SITE}/releases?pageSize=5" > "$OUT_DIR/hosting-releases.json"
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/hosting-releases.json','utf8')),r=x?.releases?.[0];
          if(!r?.name||!r?.version?.name||!r?.releaseTime)throw new Error('MECHANISM_P0:hosting_latest_release_missing');
          if(Date.parse(r.releaseTime)<Date.parse(process.env.EXPECTED_HOSTING_RELEASE_AFTER))throw new Error('MECHANISM_P0:hosting_latest_release_too_old:'+r.releaseTime);
          fs.writeFileSync(process.env.OUT_DIR+'/hosting-latest.json',JSON.stringify({name:r.name,version:r.version.name,releaseTime:r.releaseTime,type:r.type||null},null,2)+'\n');
          NODE

          expected_hash="$(cat "$OUT_DIR/firewall.source.sha256")"
          matched=0
          attempts=0
          for i in $(seq 1 24); do
            attempts="$i"
            url="$DEV_ROOT_URL/adapters/cxorbia-canonical-write-firewall-v1.js?cxF4Recert=${GITHUB_RUN_ID}-${i}"
            if curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url" > "$OUT_DIR/firewall.remote.js"; then
              remote_hash="$(sha256sum "$OUT_DIR/firewall.remote.js" | awk '{print $1}')"
              printf '%s\n' "$remote_hash" > "$OUT_DIR/firewall.remote.sha256"
              if [ "$remote_hash" = "$expected_hash" ] && grep -Fq 'YES_PAULA_20260820_G2B_SYNTHETIC' "$OUT_DIR/firewall.remote.js" && grep -Fq 'cxorbia-command-http-transport-v1.js' "$OUT_DIR/firewall.remote.js"; then
                matched=1
                break
              fi
            fi
            sleep 5
          done
          printf '%s\n' "$attempts" > "$OUT_DIR/hosting-static-attempts.txt"
          test "$matched" = '1' || { echo 'MECHANISM_P0:hosting_static_not_stabilized_after_readonly_polling' >&2; exit 41; }

          code="$(curl -sS -o "$OUT_DIR/g2b-hosting-unauthorized.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$DEV_ROOT_URL/api/tenants/tya/projects/cinepolis/g2b-synthetic/commands")"
          printf '%s\n' "$code" > "$OUT_DIR/g2b-hosting-unauthorized.status"
          test "$code" = '401' || { echo "PRODUCT_P0:hosting_api_fail_closed_status:$code" >&2; exit 42; }
          node <<'NODE'
          const fs=require('fs'),u=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/g2b-hosting-unauthorized.json','utf8'));
          if(u.error!=='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED')throw new Error('PRODUCT_P0:hosting_api_not_fail_closed');
          NODE

          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');if(sa.project_id!==process.env.GCP_PROJECT_ID)throw new Error('MECHANISM_P0:credential_project_mismatch');
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:process.env.GCP_PROJECT_ID});
          const db=admin.firestore(),auth=admin.auth(),rid=process.env.G2B_SYNTH_REQUEST;
          async function count(c){return (await c.where('syntheticRequestId','==',rid).get()).size;}
          (async()=>{
            const tenant=db.collection('tenants').doc('tya'),project=tenant.collection('projects').doc('cinepolis');
            const counts={visits:await count(project.collection('visits')),postulations:await count(project.collection('postulations')),receipts:await count(tenant.collection('commandReceipts')),audit:await count(tenant.collection('entityAuditTrail')),shoppers:await count(tenant.collection('shoppers'))};
            let syntheticAuth=0,pt;do{const page=await auth.listUsers(1000,pt);syntheticAuth+=page.users.filter(u=>u.customClaims?.syntheticRequestId===rid).length;pt=page.pageToken;}while(pt);
            const result={...counts,auth:syntheticAuth};
            fs.writeFileSync(process.env.OUT_DIR+'/synthetic-residue.json',JSON.stringify(result,null,2)+'\n');
            if(Object.values(result).some(Number))throw new Error('PRODUCT_P0:synthetic_residue_nonzero:'+JSON.stringify(result));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(process.env.OUT_DIR+'/'+p,'utf8').trim();
          const latest=JSON.parse(read('hosting-latest.json')),residue=JSON.parse(read('synthetic-residue.json')),health=JSON.parse(read('health.json'));
          const report={schemaVersion:'cxorbia.f4.g2b.readonly-recertification.report.v1',decision:'F4_READONLY_RECERTIFICATION_PASS_FULL',recoveryPassFull:true,classification:null,runId:Number(process.env.GITHUB_RUN_ID),controlPlaneHead:process.env.GITHUB_SHA,sourceFixSha:process.env.SOURCE_FIX_SHA,cloudRunRevision:process.env.EXPECTED_REVISION,imageDigest:process.env.EXPECTED_IMAGE_DIGEST,cloudRunHealth:{ok:health.ok,g2bSyntheticCommandSourceReady:health.g2bSyntheticCommandSourceReady,g2bSyntheticWriteEnabled:health.g2bSyntheticWriteEnabled,g2bSyntheticOnly:health.g2bSyntheticOnly},hosting:{site:process.env.HOSTING_SITE,latestRelease:latest,sourceHash:read('firewall.source.sha256'),remoteHash:read('firewall.remote.sha256'),staticAttempts:Number(read('hosting-static-attempts.txt')),apiUnauthorizedStatus:Number(read('g2b-hosting-unauthorized.status')),apiUnauthorizedError:'G2B_SYNTHETIC_AUTHORIZATION_REQUIRED'},syntheticResidue:residue,providerMutations:0,cloudBuildExecutions:0,cloudRunUpdates:0,hostingDeploys:0,leaseIssued:0,leaseReused:false,authenticatedSyntheticCommands:0,firestoreWrites:0,authWrites:0,storageWrites:0,externalHrWrites:0,realDataWrites:0,realCredentialWrites:0,paymentWrites:0,rulesWrites:0,makeCalls:0,geminiCalls:0,merge:false,next:'F4_RECOVERY_PASS_FULL_READY_FOR_CANONICAL_MATERIALIZATION'};
          fs.writeFileSync(process.env.OUT_DIR+'/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Upload read-only recertification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-f4-g2b-readonly-recertification-${{ github.run_id }}
          path: .tmp/f4-g2b-readonly-recertification/
          if-no-files-found: warn
          retention-days: 14
