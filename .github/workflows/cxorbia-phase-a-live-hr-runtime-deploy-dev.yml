name: CXOrbia I3 Legal V0.4 DEV Runtime Deploy

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/i3-legal-v04-runtime-deploy-dev-execute.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-i3-legal-v04-runtime-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  CLOUD_RUN_RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  HOSTING_SITE: cxorbia-backend-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  REQUEST_FILE: backend/config/i3-legal-v04-runtime-deploy-dev-request.json
  EXECUTE_FILE: backend/config/i3-legal-v04-runtime-deploy-dev-execute.json
  OUT_DIR: .tmp/i3-legal-v04-runtime-dev
  EXPECTED_GATE: PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME
  LEGAL_CONTENT_ID: tya-platform-master-terms
  LEGAL_VERSION: tya-legal-bundle-v0.4-interim-golive-20260816
  LEGAL_DIGEST: 58d16a736495065a7244f8018d95a1faa87eae9a00e36d7ffc65a41edd58f58d

jobs:
  deploy-i3-legal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 2

      - name: Validate exact one-shot authorization
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const x=JSON.parse(fs.readFileSync(process.env.EXECUTE_FILE,'utf8'));
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(r.schemaVersion!=='cxorbia.i3.legal-v04-runtime-deploy-dev.request.v1')throw new Error('request_schema_invalid');
          if(x.schemaVersion!=='cxorbia.i3.legal-v04-runtime-deploy-dev.execute.v1')throw new Error('execute_schema_invalid');
          for(const o of [r,x]){
            if(o.repository!=='paulaosoriof86/demoCXOrbia'||o.branch!=='docs-tya-v6-v71-audit'||Number(o.pullRequest)!==7)throw new Error('repository_lane_invalid');
            if(o.firebaseProjectId!=='cxorbia-backend-dev'||o.cloudRunService!=='cxorbia-live-hr-dev'||o.cloudRunRegion!=='us-central1'||o.hostingSite!=='cxorbia-backend-dev'||o.hostingTarget!=='cxorbia-dev'||o.tenantId!=='tya')throw new Error('target_invalid');
            if(o.authorizationGate!==process.env.EXPECTED_GATE||o.authorizedBy!=='Paula')throw new Error('authorization_invalid');
            if(o.automaticAcceptance!==false||o.humanAcceptanceRequired!==true||o.merge!==false||o.production!==false)throw new Error('safety_contract_invalid');
            for(const k of ['deployFirestoreWrites','authWrites','passwordResets','historicalCredentialAccess','historicalReconciliationWrites','hrWrites','rulesWrites','storageWrites','makeWrites','geminiCalls','paymentWrites'])if(Number(o[k]||0)!==0)throw new Error('forbidden_budget:'+k);
          }
          if(r.requestId!==x.requestId||r.authorizationId!==x.authorizationId)throw new Error('request_execute_mismatch');
          if(r.status!=='authorized_execute_once'||r.enabled!==true||r.consumed!==false||x.enabled!==true||x.consumed!==false)throw new Error('one_shot_state_invalid');
          if(Number(r.singleCloudRunDeployMax)!==1||Number(r.singleHostingDeployMax)!==1||Number(r.cloudRunDeployExecutions)!==0||Number(r.hostingDeployExecutions)!==0)throw new Error('deploy_budget_invalid');
          if(Number(r.futureHumanLegalAcceptanceWriteBudget)!==1||Number(r.legalAcceptanceWritesDuringDeploy)!==0)throw new Error('acceptance_budget_invalid');
          if(r.materializationRequestId!=='i3-legal-v04-dev-20260816-01'||r.materializationConsumed!==true||r.materializationRerunAllowed!==false||r.request08RerunAllowed!==false)throw new Error('frozen_predecessor_invalid');
          if(r.legalContentId!==process.env.LEGAL_CONTENT_ID||r.legalVersion!==process.env.LEGAL_VERSION||r.contentDigest!==process.env.LEGAL_DIGEST)throw new Error('legal_version_pin_invalid');
          if(changed.length!==1||changed[0]!==process.env.EXECUTE_FILE)throw new Error('execute_commit_scope_invalid:'+changed.join(','));
          console.log(JSON.stringify({decision:'PASS_I3_LEGAL_RUNTIME_DEPLOY_AUTHORIZATION',requestId:r.requestId,deployFirestoreWrites:0,futureHumanLegalAcceptanceWriteBudget:1,automaticAcceptance:false}));
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate existing Google Cloud DEV
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Install transient provider and Hosting tooling
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest >/dev/null 2>&1

      - name: Source and provider read-only preflight
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node --check backend/runtime/hr-live-service/server.mjs
          node --check backend/runtime/hr-live-service/legal-runtime.mjs
          node --check backend/runtime/cxorbia-legal-acceptance-provider-v1.mjs
          node --check app/adapters/cxorbia-legal-runtime-http-v1.js
          grep -q "COPY backend/runtime/hr-live-service/legal-runtime.mjs" backend/runtime/hr-live-service/Dockerfile
          grep -q "COPY backend/runtime/cxorbia-legal-acceptance-provider-v1.mjs" backend/runtime/hr-live-service/Dockerfile
          grep -q "PAULA_DEV_DEPLOY_FOR_I3_HUMAN_LEGAL_ACCEPTANCE_RUNTIME" backend/runtime/hr-live-service/legal-runtime.mjs
          grep -q "CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED" backend/runtime/hr-live-service/legal-runtime.mjs
          grep -q "humanConfirmed!==true" backend/runtime/hr-live-service/legal-runtime.mjs
          grep -q "cxorbia-legal-runtime-http-v1.js" app/index-backend-dev.html
          grep -q '"source": "/api/tenants/\*\*"' firebase.json
          grep -q '"destination": "/index-backend-dev.html"' firebase.json
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT_DIR/cloud-run-before.json"
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');
          if(sa.project_id!=='cxorbia-backend-dev')throw new Error('wrong_service_account_project');
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:'cxorbia-backend-dev'});
          const db=admin.firestore();
          (async()=>{
            const contentRef=db.doc(`tenants/tya/legalContents/${process.env.LEGAL_CONTENT_ID}`);
            const versionRef=contentRef.collection('versions').doc(process.env.LEGAL_VERSION);
            const [contentSnap,versionSnap,acceptances]=await Promise.all([contentRef.get(),versionRef.get(),db.collection('tenants').doc('tya').collection('legalAcceptances').get()]);
            if(!contentSnap.exists||!versionSnap.exists)throw new Error('materialized_legal_authority_missing');
            const c=contentSnap.data()||{},v=versionSnap.data()||{};
            if(c.currentVersion!==process.env.LEGAL_VERSION||String(c.currentDigest||'').toLowerCase()!==process.env.LEGAL_DIGEST||String(v.contentDigest||'').toLowerCase()!==process.env.LEGAL_DIGEST)throw new Error('materialized_legal_authority_drift');
            const report={decision:'PASS_I3_LEGAL_V04_PROVIDER_READONLY_PREFLIGHT',acceptanceCountBefore:acceptances.size,legalVersion:process.env.LEGAL_VERSION,contentDigest:process.env.LEGAL_DIGEST,providerWrites:0,authWrites:0,passwordResets:0,production:false};
            fs.writeFileSync(process.env.OUT_DIR+'/provider-before.json',JSON.stringify(report,null,2)+'\n','utf8');
            console.log(JSON.stringify(report));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Build exact DEV Cloud Run image once
        run: |
          set -euo pipefail
          IMAGE_URI="gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:i3-legal-v04-${GITHUB_SHA}"
          echo "$IMAGE_URI" > "$OUT_DIR/image-uri.txt"
          gcloud builds submit . --project "$GCP_PROJECT_ID" --config backend/runtime/hr-live-service/cloudbuild.yaml --substitutions "_IMAGE=$IMAGE_URI" --quiet

      - name: Update existing Cloud Run DEV once and enable human-only receipt gate
        run: |
          set -euo pipefail
          IMAGE_URI="$(cat "$OUT_DIR/image-uri.txt")"
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_URI" \
            --service-account "$CLOUD_RUN_RUNTIME_SA" \
            --update-env-vars "CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_ENABLED=true,CXORBIA_I3_LEGAL_ACCEPTANCE_WRITE_GATE=${EXPECTED_GATE}" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OUT_DIR/cloud-run-after.json"

      - name: Smoke legal runtime directly without accepting
        run: |
          set -euo pipefail
          base="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl -fsS --retry 10 --retry-delay 3 "$base/health" > "$OUT_DIR/health.json"
          code="$(curl -sS -o "$OUT_DIR/legal-unauthorized.json" -w '%{http_code}' "$base/api/tenants/tya/legal/current")"
          test "$code" = '401'
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/health.json','utf8'));
          const u=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/legal-unauthorized.json','utf8'));
          if(h.ok!==true||h.legalRuntimeSourceReady!==true)throw new Error('legal_health_not_ready');
          if(u.error!=='LEGAL_RUNTIME_AUTHORIZATION_REQUIRED')throw new Error('legal_unauthorized_not_fail_closed');
          console.log(JSON.stringify({decision:'PASS_I3_LEGAL_RUNTIME_CLOUD_RUN_REMOTE',legalRuntimeSourceReady:true,unauthorizedFailClosed:true,legalAcceptanceWrites:0,automaticAcceptance:false}));
          NODE

      - name: Deploy existing Hosting DEV once
        run: |
          set -euo pipefail
          npx firebase deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$GCP_PROJECT_ID" --non-interactive

      - name: Smoke protected Hosting DEV without accepting
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 "$DEV_ROOT_URL/" > "$OUT_DIR/dev-root.html"
          grep -q "cxorbia-legal-runtime-http-v1.js" "$OUT_DIR/dev-root.html"
          code="$(curl -sS -o "$OUT_DIR/legal-hosting-unauthorized.json" -w '%{http_code}' "$DEV_ROOT_URL/api/tenants/tya/legal/current")"
          test "$code" = '401'
          node <<'NODE'
          const fs=require('fs');const u=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/legal-hosting-unauthorized.json','utf8'));
          if(u.error!=='LEGAL_RUNTIME_AUTHORIZATION_REQUIRED')throw new Error('hosting_legal_rewrite_not_fail_closed');
          console.log(JSON.stringify({decision:'PASS_I3_LEGAL_RUNTIME_HOSTING_DEV_REMOTE',protectedEntrypoint:true,legalRewrite:true,unauthorizedFailClosed:true,legalAcceptanceWrites:0,automaticAcceptance:false}));
          NODE

      - name: Provider post-readback proves deploy wrote no acceptance
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');
          if(sa.project_id!=='cxorbia-backend-dev')throw new Error('wrong_service_account_project');
          if(!admin.apps.length)admin.initializeApp({credential:admin.credential.cert(sa),projectId:'cxorbia-backend-dev'});
          const db=admin.firestore();
          (async()=>{
            const before=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/provider-before.json','utf8'));
            const contentRef=db.doc(`tenants/tya/legalContents/${process.env.LEGAL_CONTENT_ID}`);
            const versionRef=contentRef.collection('versions').doc(process.env.LEGAL_VERSION);
            const [contentSnap,versionSnap,acceptances]=await Promise.all([contentRef.get(),versionRef.get(),db.collection('tenants').doc('tya').collection('legalAcceptances').get()]);
            const c=contentSnap.data()||{},v=versionSnap.data()||{};
            if(c.currentVersion!==process.env.LEGAL_VERSION||String(c.currentDigest||'').toLowerCase()!==process.env.LEGAL_DIGEST||String(v.contentDigest||'').toLowerCase()!==process.env.LEGAL_DIGEST)throw new Error('legal_authority_changed_during_deploy');
            if(acceptances.size!==before.acceptanceCountBefore)throw new Error(`acceptance_write_during_deploy:${before.acceptanceCountBefore}:${acceptances.size}`);
            const report={decision:'PASS_I3_LEGAL_RUNTIME_DEPLOY_PROVIDER_READBACK',acceptanceCountBefore:before.acceptanceCountBefore,acceptanceCountAfter:acceptances.size,legalAcceptanceWritesDuringDeploy:0,authWrites:0,passwordResets:0,historicalCredentialAccess:0,historicalReconciliationWrites:0,hrWrites:0,rulesWrites:0,storageWrites:0,makeWrites:0,geminiCalls:0,paymentWrites:0,automaticAcceptance:false,production:false};
            fs.writeFileSync(process.env.OUT_DIR+'/provider-after.json',JSON.stringify(report,null,2)+'\n','utf8');
            console.log(JSON.stringify(report));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Consume one-shot deploy request and persist sanitized evidence
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          export REVISION="$revision" SERVICE_URL="$service_url"
          node <<'NODE'
          const fs=require('fs');
          const p=process.env.REQUEST_FILE;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const after=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/provider-after.json','utf8'));
          r.status='consumed_pass_human_acceptance_pending';
          r.enabled=false;r.consumed=true;r.noAutomaticRetry=true;
          r.cloudRunDeployExecutions=1;r.hostingDeployExecutions=1;
          r.cloudRunRevision=process.env.REVISION||null;r.cloudRunUrl=process.env.SERVICE_URL||null;
          r.devRootUrl=process.env.DEV_ROOT_URL;
          r.consumedAt=new Date().toISOString();
          r.decision='PASS_I3_LEGAL_V04_DEV_RUNTIME_AND_HOSTING_DEPLOY_HUMAN_ACCEPTANCE_PENDING';
          r.legalAcceptanceWritesDuringDeploy=0;
          r.acceptanceCountBefore=after.acceptanceCountBefore;
          r.acceptanceCountAfter=after.acceptanceCountAfter;
          r.nextGate='HUMAN_PAULA_LEGAL_ACCEPTANCE_UI_CLICK';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          const evidence={schemaVersion:'cxorbia.i3.legal-v04-runtime-deploy-dev.evidence.v1',requestId:r.requestId,decision:r.decision,targetProject:r.firebaseProjectId,cloudRunService:r.cloudRunService,cloudRunRevision:r.cloudRunRevision,hostingSite:r.hostingSite,devRootUrl:r.devRootUrl,legalContentId:r.legalContentId,legalVersion:r.legalVersion,contentDigest:r.contentDigest,cloudRunDeployExecutions:1,hostingDeployExecutions:1,legalAcceptanceWritesDuringDeploy:0,futureHumanLegalAcceptanceWriteBudget:1,automaticAcceptance:false,humanAcceptanceRequired:true,authWrites:0,passwordResets:0,historicalCredentialAccess:0,historicalReconciliationWrites:0,hrWrites:0,rulesWrites:0,storageWrites:0,makeWrites:0,geminiCalls:0,paymentWrites:0,merge:false,production:false,nextGate:r.nextGate};
          fs.mkdirSync('app/docs/evidence',{recursive:true});
          fs.writeFileSync('app/docs/evidence/ITERATION3-LEGAL-V04-RUNTIME-DEPLOY-DEV-LATEST.json',JSON.stringify(evidence,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REQUEST_FILE" app/docs/evidence/ITERATION3-LEGAL-V04-RUNTIME-DEPLOY-DEV-LATEST.json
          git commit -m 'gate(i3): record V0.4 DEV runtime deploy PASS'
          git push origin HEAD:docs-tya-v6-v71-audit
