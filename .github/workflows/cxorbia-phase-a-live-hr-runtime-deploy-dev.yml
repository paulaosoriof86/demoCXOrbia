name: CXOrbia Existing Runtime Deploy — F4 G2-B One-Shot

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/cxorbia-f4-g2b-recovery-execute.json'
      - '.github/workflows/cxorbia-phase-a-live-hr-runtime-deploy-dev.yml'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-f4-g2b-provider-recovery-single
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GCP_PROJECT_ID: cxorbia-backend-dev
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cxorbia-live-hr-dev
  CLOUD_RUN_RUNTIME_SA: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  FIREBASE_HOSTING_TARGET: cxorbia-dev
  HOSTING_SITE: cxorbia-backend-dev
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
  F4_AUTH_FILE: backend/config/cxorbia-f4-g2b-release-authorization.json
  F4_LEASE_FILE: backend/config/cxorbia-f4-g2b-provider-mutation-lease.json
  F4_EXECUTE_FILE: backend/config/cxorbia-f4-g2b-recovery-execute.json
  F4_LOCK_FILE: backend/config/cxorbia-phase-a-continuity-lock.json
  F3_CONTRACT_FILE: backend/config/cxorbia-provider-promotion-mechanism-v1.json
  F3_EVIDENCE_FILE: app/docs/evidence/RC15-F3-PROVIDER-PROMOTION-MECHANISM-LATEST.json
  F4_OUT_DIR: .tmp/f4-g2b-recovery
  F4_AUTH_ID: F4-G2B-RECOVERY-20260826-01
  F4_LEASE_ID: F4-G2B-PROVIDER-LEASE-20260826-01
  F4_EXECUTION_ID: F4-G2B-RECOVERY-EXECUTE-20260826-01
  SOURCE_FIX_SHA: 1d2cfecba0a89b637398d747a628e549d9823c68
  FUNCTIONAL_SOURCE_SHA: f9802fdd498934a8e7729fa5c7d18341bec1cd71
  EXPECTED_PARENT_HEAD: fdba595ac83bee69f1d4d50cf02ab174ce8d7eda
  EXPECTED_F3_CONTRACT_BLOB: f1c265164b7bc697ecb5cd9b247c334afd76a5f2
  KNOWN_GOOD_REVISION: cxorbia-live-hr-dev-00011-f2f
  G2B_RUNTIME_GATE: PAULA_I5_G2B_SYNTHETIC_CANONICAL_WRITE_PATH
  G2B_SYNTH_REQUEST: i5-g2b-live-synthetic-acceptance-20260820-01
  G2B_PREFIX: CXORBIA_E2E_SYNTH_

jobs:
  f4-g2b-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact F4 trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate structured F4 authority and immutable release tuple
        run: |
          set -euo pipefail
          mkdir -p "$F4_OUT_DIR"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const j=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const a=j(process.env.F4_AUTH_FILE),l=j(process.env.F4_LEASE_FILE),x=j(process.env.F4_EXECUTE_FILE),c=j(process.env.F3_CONTRACT_FILE),e=j(process.env.F3_EVIDENCE_FILE),lock=j(process.env.F4_LOCK_FILE);
          const head=git('rev-parse','HEAD'),parent=git('rev-parse','HEAD^'),blob=git('rev-parse',`HEAD:${process.env.F3_CONTRACT_FILE}`);
          cp.execFileSync('git',['merge-base','--is-ancestor',process.env.EXPECTED_PARENT_HEAD,parent]);
          if(blob!==process.env.EXPECTED_F3_CONTRACT_BLOB)throw new Error('MECHANISM_P0:f3_contract_blob_mismatch:'+blob);
          if(c.id!=='PROVIDER_PROMOTION_MECHANISM_V1'||c.state!=='FROZEN_PENDING_PROVIDER_WRITE_AUTHORIZATION')throw new Error('MECHANISM_P0:f3_contract_identity');
          if(e.decision!=='G2B_PROVIDER_PROMOTION_MECHANISM_PASS'||e.recoveryLaneDecision!=='G2B_RECOVERY_LANE_PASS')throw new Error('MECHANISM_P0:f3_not_pass');
          if(a.authorizationId!==process.env.F4_AUTH_ID||a.status!=='AUTHORIZED_CURRENT_CONVERSATION'||a.authorizedBy!=='Paula'||a.providerMutationAuthorized!==true||a.recoveryAuthorized!==true)throw new Error('MECHANISM_P0:release_authorization_invalid');
          if(l.leaseId!==process.env.F4_LEASE_ID||l.authorizationId!==a.authorizationId||l.issued!==true||l.consumed!==false||l.singleUse!==true||l.state!=='ISSUED_NOT_CONSUMED')throw new Error('MECHANISM_P0:lease_invalid');
          if(x.executionId!==process.env.F4_EXECUTION_ID||x.authorizationId!==a.authorizationId||x.leaseId!==l.leaseId||x.enabled!==true||x.consumed!==false||x.expectedParentHead!==process.env.EXPECTED_PARENT_HEAD)throw new Error('MECHANISM_P0:execute_invalid');
          for(const o of [a,l,x]){
            if(o.repository!=='paulaosoriof86/demoCXOrbia'||o.branch!=='docs-tya-v6-v71-audit')throw new Error('MECHANISM_P0:repo_branch_binding');
            if(o.functionalSourceSha!==process.env.FUNCTIONAL_SOURCE_SHA||o.sourceFixSha!==process.env.SOURCE_FIX_SHA)throw new Error('MECHANISM_P0:source_binding');
            if(o.providerPromotionContractBlobSha!==process.env.EXPECTED_F3_CONTRACT_BLOB)throw new Error('MECHANISM_P0:contract_binding');
          }
          if(a.controlPlaneHeadBefore!==process.env.EXPECTED_PARENT_HEAD)throw new Error('MECHANISM_P0:authorization_head_binding');
          if(a.firebaseProjectId!==process.env.GCP_PROJECT_ID||a.cloudRunRegion!==process.env.GCP_REGION||a.cloudRunService!==process.env.CLOUD_RUN_SERVICE||a.hostingSite!==process.env.HOSTING_SITE||a.hostingTarget!==process.env.FIREBASE_HOSTING_TARGET)throw new Error('MECHANISM_P0:target_binding');
          if(a.budget.cloudBuildMax!==1||a.budget.cloudRunUpdateMax!==1||a.budget.hostingDeployMax!==1||a.budget.automaticRetryMax!==0)throw new Error('MECHANISM_P0:mutation_budget');
          for(const k of ['firestoreWrites','authWrites','storageWrites','externalHrWrites','realDataWrites','realCredentialWrites','paymentWrites','rulesWrites','makeCalls','geminiCalls'])if(Number(a.budget[k])!==0)throw new Error('MECHANISM_P0:forbidden_budget_'+k);
          if(lock.f3ExecutionControl?.status!=='CLOSED_PASS_PROVIDER_PROMOTION_MECHANISM_V1_G2B_RECOVERY_LANE_PASS'||lock.f4ExecutionControl?.status!=='AUTHORIZED_PENDING_EXECUTION')throw new Error('MECHANISM_P0:continuity_lock_state');
          if(lock.f4ExecutionControl?.releaseAuthorizationId!==a.authorizationId||lock.f4ExecutionControl?.providerMutationLeaseId!==l.leaseId||lock.f4ExecutionControl?.providerMutationLeaseIssued!==true||lock.f4ExecutionControl?.providerMutationLeaseConsumed!==false||lock.f4ExecutionControl?.providerMutationAuthorizedNow!==true)throw new Error('MECHANISM_P0:continuity_authority_binding');
          cp.execFileSync('git',['merge-base','--is-ancestor',process.env.FUNCTIONAL_SOURCE_SHA,process.env.SOURCE_FIX_SHA]);
          cp.execFileSync('git',['merge-base','--is-ancestor',process.env.SOURCE_FIX_SHA,parent]);
          const cumulative=git('diff','--name-only',`${process.env.EXPECTED_PARENT_HEAD}..${parent}`).split(/\r?\n/).filter(Boolean).sort();
          const cumulativeAllowed=new Set([
            '.github/workflows/cxorbia-phase-a-live-hr-runtime-deploy-dev.yml','CAMBIOS-BACKEND-RC15-F4-G2B-RECOVERY-20260826.md','PENDIENTES-PROTOTIPO.md','RESUMEN-PARA-CLAUDE.md','app/docs/00-INDICE-FUENTES-VIGENTES-CXORBIA-TYA.md','app/docs/CHECKPOINT-OPERATIVO-CXORBIA-TYA-VIGENTE.md','app/docs/PRODUCTION-REAL-PROGRESS-LOCK-CXORBIA-TYA.md','app/docs/evidence/RC15-F4-G2B-MECHANISM-P0-LANE-INERT-LATEST.json','backend/config/cxorbia-f4-g2b-provider-mutation-lease.json','backend/config/cxorbia-f4-g2b-recovery-execute.json','backend/config/cxorbia-f4-g2b-release-authorization.json','backend/config/cxorbia-phase-a-continuity-lock.json'
          ]);
          const cumulativeUnexpected=cumulative.filter(p=>!cumulativeAllowed.has(p));
          if(cumulativeUnexpected.length)throw new Error('MECHANISM_P0:cumulative_control_plane_drift:'+cumulativeUnexpected.join(','));
          const changed=git('diff','--name-only','HEAD^','HEAD').split(/\r?\n/).filter(Boolean).sort();
          const repairAllowed=new Set(['.github/workflows/cxorbia-phase-a-live-hr-runtime-deploy-dev.yml','CAMBIOS-BACKEND-RC15-F4-G2B-RECOVERY-20260826.md','app/docs/evidence/RC15-F4-G2B-MECHANISM-P0-LANE-INERT-LATEST.json']);
          const repairUnexpected=changed.filter(p=>!repairAllowed.has(p));
          if(!changed.includes('.github/workflows/cxorbia-phase-a-live-hr-runtime-deploy-dev.yml')||repairUnexpected.length)throw new Error('MECHANISM_P0:repair_delta_invalid:'+changed.join(','));
          fs.writeFileSync(process.env.F4_OUT_DIR+'/authority.json',JSON.stringify({decision:'PASS_F4_STRUCTURED_AUTHORITY',head,parent,authorizedHead:process.env.EXPECTED_PARENT_HEAD,contractBlob:blob,authorizationId:a.authorizationId,leaseId:l.leaseId,sourceFixSha:a.sourceFixSha,cumulativeControlPlaneDelta:cumulative,repairDelta:changed,providerWrites:0},null,2)+'\n');
          NODE

      - name: Prepare and validate exact source-fix release tree
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/cxorbia-f4-release "$SOURCE_FIX_SHA"
          cd /tmp/cxorbia-f4-release
          test "$(git rev-parse HEAD)" = "$SOURCE_FIX_SHA"
          node --check backend/runtime/cxorbia-g2b-synthetic-visit-provider-v1.mjs
          node --check backend/runtime/hr-live-service/g2b-synthetic-runtime.mjs
          node --check backend/runtime/hr-live-service/server.mjs
          node --check app/adapters/cxorbia-canonical-write-firewall-v1.js
          grep -q 'CXORBIA_E2E_SYNTH_' backend/runtime/cxorbia-g2b-synthetic-visit-provider-v1.mjs
          grep -q 'realDataWrites:0' backend/runtime/cxorbia-g2b-synthetic-visit-provider-v1.mjs
          grep -q 'externalHrWrites:0' backend/runtime/cxorbia-g2b-synthetic-visit-provider-v1.mjs
          grep -q 'g2b-synthetic/commands' backend/runtime/hr-live-service/server.mjs
          grep -q 'YES_PAULA_20260820_G2B_SYNTHETIC' app/adapters/cxorbia-canonical-write-firewall-v1.js
          grep -q 'cxorbia-command-http-transport-v1.js' app/adapters/cxorbia-canonical-write-firewall-v1.js
          grep -q 'COPY backend/runtime/hr-live-service/g2b-synthetic-runtime.mjs' backend/runtime/hr-live-service/Dockerfile
          grep -q 'COPY backend/runtime/cxorbia-g2b-synthetic-visit-provider-v1.mjs' backend/runtime/hr-live-service/Dockerfile
          grep -q '"source": "/api/tenants/\*\*"' firebase.json
          test -f .firebaserc

      - name: Authenticate existing Google Cloud project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Install transient Firebase tooling
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 firebase-tools@latest >/dev/null 2>&1

      - name: F4 read-only provider preflight and drift gate
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$F4_OUT_DIR/cloud-run-before.json"
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/cloud-run-before.json','utf8'));const rev=x?.status?.latestReadyRevisionName||'';if(rev!==process.env.KNOWN_GOOD_REVISION)throw new Error('MECHANISM_P0:target_revision_mismatch:'+rev);const name=x?.metadata?.name||'';if(name!==process.env.CLOUD_RUN_SERVICE)throw new Error('MECHANISM_P0:service_mismatch:'+name);
          NODE
          base="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$base"
          curl -fsS --retry 3 --retry-delay 2 "$base/health" > "$F4_OUT_DIR/health-before.json"
          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/sites/${HOSTING_SITE}/releases?pageSize=1" > "$F4_OUT_DIR/hosting-before.json"
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');if(sa.project_id!==process.env.GCP_PROJECT_ID)throw new Error('MECHANISM_P0:credential_project_mismatch');admin.initializeApp({credential:admin.credential.cert(sa),projectId:process.env.GCP_PROJECT_ID});const db=admin.firestore(),auth=admin.auth(),rid=process.env.G2B_SYNTH_REQUEST;async function count(c){return (await c.where('syntheticRequestId','==',rid).get()).size;}(async()=>{const tenant=db.collection('tenants').doc('tya'),project=tenant.collection('projects').doc('cinepolis');const counts={visits:await count(project.collection('visits')),postulations:await count(project.collection('postulations')),receipts:await count(tenant.collection('commandReceipts')),audit:await count(tenant.collection('entityAuditTrail')),shoppers:await count(tenant.collection('shoppers'))};let syntheticAuth=0,pt;do{const page=await auth.listUsers(1000,pt);syntheticAuth+=page.users.filter(u=>u.customClaims?.syntheticRequestId===rid).length;pt=page.pageToken;}while(pt);if(Object.values(counts).some(Number)||syntheticAuth!==0)throw new Error('MECHANISM_P0:preflight_synthetic_residue:'+JSON.stringify({...counts,syntheticAuth}));const h=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/health-before.json','utf8'));if(h.ok!==true)throw new Error('EXTERNAL_TRANSPORT_OUTAGE:health_preflight_not_ok');fs.writeFileSync(process.env.F4_OUT_DIR+'/provider-before.json',JSON.stringify({decision:'PASS_F4_PROVIDER_READONLY_PREFLIGHT',revision:process.env.KNOWN_GOOD_REVISION,counts,syntheticAuth,healthOk:true,providerWrites:0,leaseConsumed:false},null,2)+'\n');})();
          NODE

      - name: Consume single-use lease at first provider mutation boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          node <<'NODE'
          const fs=require('fs');const lp=process.env.F4_LEASE_FILE,kp=process.env.F4_LOCK_FILE,l=JSON.parse(fs.readFileSync(lp,'utf8')),k=JSON.parse(fs.readFileSync(kp,'utf8'));if(l.leaseId!==process.env.F4_LEASE_ID||l.issued!==true||l.consumed!==false||l.state!=='ISSUED_NOT_CONSUMED')throw new Error('lease_not_consumable');l.state='CONSUMED_MUTATION_STARTED';l.consumed=true;l.consumedAt=new Date().toISOString();l.consumedByRunId=process.env.GITHUB_RUN_ID;l.consumptionReason='CLOUD_BUILD_START';l.next='F4_PROVIDER_MUTATION_IN_PROGRESS';if(!k.f4ExecutionControl||k.f4ExecutionControl.providerMutationLeaseId!==l.leaseId||k.f4ExecutionControl.providerMutationLeaseConsumed!==false)throw new Error('continuity_lease_drift');k.f4ExecutionControl.status='MUTATION_STARTED_LEASE_CONSUMED';k.f4ExecutionControl.providerMutationLeaseConsumed=true;k.f4ExecutionControl.providerMutationLeaseConsumedAt=l.consumedAt;k.f4ExecutionControl.providerMutationRunId=Number(process.env.GITHUB_RUN_ID);k.f4ExecutionControl.g2bAttempts=1;k.f4ExecutionControl.next='F4_PROVIDER_MUTATION_IN_PROGRESS';k.nextNow.action='F4_G2B_PROVIDER_MUTATION_IN_PROGRESS';k.nextNow.providerMutationLeaseConsumed=true;k.nextNow.manualActionFromPaulaRequired=false;fs.writeFileSync(lp,JSON.stringify(l,null,2)+'\n');fs.writeFileSync(kp,JSON.stringify(k,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$F4_LEASE_FILE" "$F4_LOCK_FILE"
          git commit -m 'state(f4): consume G2-B provider lease at mutation start'
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git rev-parse HEAD > "$F4_OUT_DIR/lease-consumption-commit.txt"

      - name: Cloud Build exact source-fix image once
        run: |
          set -euo pipefail
          IMAGE_URI="gcr.io/${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}:f4-g2b-${SOURCE_FIX_SHA:0:12}-${GITHUB_RUN_ID}"
          printf '%s\n' "$IMAGE_URI" > "$F4_OUT_DIR/image-uri.txt"
          cd /tmp/cxorbia-f4-release
          gcloud builds submit . --project "$GCP_PROJECT_ID" --config backend/runtime/hr-live-service/cloudbuild.yaml --substitutions "_IMAGE=$IMAGE_URI" --quiet
          digest="$(gcloud container images describe "$IMAGE_URI" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$digest"
          printf '%s\n' "$digest" > "$GITHUB_WORKSPACE/$F4_OUT_DIR/image-digest.txt"
          printf '%s@%s\n' "$IMAGE_URI" "$digest" > "$GITHUB_WORKSPACE/$F4_OUT_DIR/image-pinned.txt"

      - name: Update existing Cloud Run once with exact digest and synthetic-only gate
        run: |
          set -euo pipefail
          IMAGE_PINNED="$(cat "$F4_OUT_DIR/image-pinned.txt")"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE_PINNED" --service-account "$CLOUD_RUN_RUNTIME_SA" --update-env-vars "CXORBIA_G2B_SYNTHETIC_WRITE_ENABLED=true,CXORBIA_G2B_SYNTHETIC_WRITE_GATE=${G2B_RUNTIME_GATE},CXORBIA_G2B_SYNTHETIC_REQUEST_ID=${G2B_SYNTH_REQUEST}" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$F4_OUT_DIR/cloud-run-after.json"

      - name: Remote Cloud Run fail-closed smoke without data writes
        run: |
          set -euo pipefail
          base="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl -fsS --retry 10 --retry-delay 3 "$base/health" > "$F4_OUT_DIR/health-after.json"
          code="$(curl -sS -o "$F4_OUT_DIR/g2b-cloudrun-unauthorized.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$base/api/tenants/tya/projects/cinepolis/g2b-synthetic/commands")"
          test "$code" = '401'
          node <<'NODE'
          const fs=require('fs'),h=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/health-after.json','utf8')),u=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/g2b-cloudrun-unauthorized.json','utf8')),r=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/cloud-run-after.json','utf8'));if(h.ok!==true||h.g2bSyntheticCommandSourceReady!==true||h.g2bSyntheticWriteEnabled!==true||h.g2bSyntheticOnly!==true)throw new Error('PRODUCT_P0:g2b_health_not_ready');if(u.error!=='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED')throw new Error('PRODUCT_P0:g2b_unauthorized_not_fail_closed');const digest=fs.readFileSync(process.env.F4_OUT_DIR+'/image-digest.txt','utf8').trim();const image=r?.spec?.template?.spec?.containers?.[0]?.image||'';if(!image.includes(digest))throw new Error('MECHANISM_P0:cloud_run_digest_readback_mismatch:'+image);
          NODE

      - name: Deploy existing Hosting target once from exact source-fix
        run: |
          set -euo pipefail
          cd /tmp/cxorbia-f4-release
          "$GITHUB_WORKSPACE/node_modules/.bin/firebase" deploy --config firebase.json --only "hosting:$FIREBASE_HOSTING_TARGET" --project "$GCP_PROJECT_ID" --non-interactive

      - name: Remote Hosting source and API smoke
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 "$DEV_ROOT_URL/adapters/cxorbia-canonical-write-firewall-v1.js" > "$F4_OUT_DIR/firewall.remote.js"
          grep -q 'YES_PAULA_20260820_G2B_SYNTHETIC' "$F4_OUT_DIR/firewall.remote.js"
          grep -q 'cxorbia-command-http-transport-v1.js' "$F4_OUT_DIR/firewall.remote.js"
          code="$(curl -sS -o "$F4_OUT_DIR/g2b-hosting-unauthorized.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$DEV_ROOT_URL/api/tenants/tya/projects/cinepolis/g2b-synthetic/commands")"
          test "$code" = '401'
          node <<'NODE'
          const fs=require('fs'),u=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/g2b-hosting-unauthorized.json','utf8'));if(u.error!=='G2B_SYNTHETIC_AUTHORIZATION_REQUIRED')throw new Error('PRODUCT_P0:hosting_api_not_fail_closed');
          NODE

      - name: Provider post-readback proves zero business and Auth data writes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsS -H "Authorization: Bearer $token" "https://firebasehosting.googleapis.com/v1beta1/sites/${HOSTING_SITE}/releases?pageSize=1" > "$F4_OUT_DIR/hosting-after.json"
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON||'{}');if(sa.project_id!==process.env.GCP_PROJECT_ID)throw new Error('credential_project_mismatch');if(!admin.apps.length)admin.initializeApp({credential:admin.credential.cert(sa),projectId:process.env.GCP_PROJECT_ID});const db=admin.firestore(),auth=admin.auth(),rid=process.env.G2B_SYNTH_REQUEST;async function count(c){return (await c.where('syntheticRequestId','==',rid).get()).size;}(async()=>{const tenant=db.collection('tenants').doc('tya'),project=tenant.collection('projects').doc('cinepolis');const counts={visits:await count(project.collection('visits')),postulations:await count(project.collection('postulations')),receipts:await count(tenant.collection('commandReceipts')),audit:await count(tenant.collection('entityAuditTrail')),shoppers:await count(tenant.collection('shoppers'))};let syntheticAuth=0,pt;do{const page=await auth.listUsers(1000,pt);syntheticAuth+=page.users.filter(u=>u.customClaims?.syntheticRequestId===rid).length;pt=page.pageToken;}while(pt);if(Object.values(counts).some(Number)||syntheticAuth!==0)throw new Error('PRODUCT_P0:recovery_created_provider_data:'+JSON.stringify({...counts,syntheticAuth}));const r=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/cloud-run-after.json','utf8')),hosting=JSON.parse(fs.readFileSync(process.env.F4_OUT_DIR+'/hosting-after.json','utf8')),digest=fs.readFileSync(process.env.F4_OUT_DIR+'/image-digest.txt','utf8').trim(),leaseCommit=fs.readFileSync(process.env.F4_OUT_DIR+'/lease-consumption-commit.txt','utf8').trim();const revision=r?.status?.latestReadyRevisionName||null,release=hosting?.releases?.[0]?.name||null;if(!revision||!release)throw new Error('MECHANISM_P0:provider_post_readback_incomplete');const report={schemaVersion:'cxorbia.f4.g2b.recovery.evidence.v1',decision:'RECOVERY_PASS_FULL',authorizationId:process.env.F4_AUTH_ID,leaseId:process.env.F4_LEASE_ID,leaseConsumed:true,leaseConsumptionCommit:leaseCommit,sourceFixSha:process.env.SOURCE_FIX_SHA,functionalSourceSha:process.env.FUNCTIONAL_SOURCE_SHA,cloudBuildExecutions:1,cloudRunUpdateExecutions:1,hostingDeployExecutions:1,cloudRunRevision:revision,imageDigest:digest,hostingReleaseName:release,providerDataWritesDuringRecovery:0,authWritesDuringRecovery:0,storageWritesDuringRecovery:0,externalHrWrites:0,realDataWrites:0,realCredentialWrites:0,realPaymentWrites:0,rulesWrites:0,makeCalls:0,geminiCalls:0,merge:false,syntheticResidueAfter:counts,syntheticAuthAfter:syntheticAuth,next:'F5_WAITING_EXPLICIT_SYNTHETIC_ACCEPTANCE_AUTHORIZATION'};fs.writeFileSync(process.env.F4_OUT_DIR+'/report.json',JSON.stringify(report,null,2)+'\n');})();
          NODE

      - name: Upload sanitized F4 recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-f4-g2b-recovery-${{ github.run_id }}
          path: .tmp/f4-g2b-recovery/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish F4 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=error
          desc='F4_G2B_STOP_REVIEW_RUN_EVIDENCE'
          if [ -f "$F4_OUT_DIR/report.json" ] && node -e "const r=require('./$F4_OUT_DIR/report.json');process.exit(r.decision==='RECOVERY_PASS_FULL'?0:1)"; then state=success; desc='F4_G2B_RECOVERY_PASS_FULL'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='cxorbia/f4-g2b-recovery' -f description="$desc" >/dev/null

      - name: Enforce terminal recovery result
        run: node -e "const r=require('./$F4_OUT_DIR/report.json');if(r.decision!=='RECOVERY_PASS_FULL')process.exit(1)"
