name: CXOrbia I4A Visible Shopper Lifecycle Smoke Retry3 Safe Globals

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths: [.github/workflows/cxorbia-i4a-visible-shopper-lifecycle-smoke-retry3.yml]

permissions:
  contents: write

concurrency:
  group: cxorbia-i4a-visible-shopper-lifecycle-smoke-retry3
  cancel-in-progress: false

env:
  REQUEST_FILE: backend/config/i4a-visible-shopper-lifecycle-smoke-retry3-request.json
  CREATE_REQUEST: backend/config/i4a-dedicated-test-shopper-create-request.json
  OUT_DIR: .tmp/i4a-visible-shopper-lifecycle-smoke-retry3
  PRIVATE_DIR: .tmp/i4a-visible-shopper-private-retry3
  EVIDENCE_PATH: app/docs/evidence/I4A-VISIBLE-SMOKE-RETRY3-RUNTIME-OBSERVED.json
  DEV_URL: https://cxorbia-backend-dev.web.app/index-backend-dev.html?cxProjectId=cinepolis&cxI4aSmokeRetry3=1

jobs:
  smoke-retry3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}

      - name: Validate exact authorization lineage
        id: gate
        run: |
          set -euo pipefail; mkdir -p "$OUT_DIR" "$PRIVATE_DIR"; printf '%s\n' '.tmp/' 'node_modules/' >> .git/info/exclude
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),p=process.env.REQUEST_FILE,r=JSON.parse(fs.readFileSync(p));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),base=cp.execFileSync('git',['rev-parse','HEAD^^'],{encoding:'utf8'}).trim(),now=cp.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean),prior=cp.execFileSync('git',['diff','--name-only','HEAD^^','HEAD^'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const expected={schemaVersion:'cxorbia.i4a.visible-shopper-lifecycle-smoke-retry3.request.v1',gateId:'NEW_AUTH_REQUIRED_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3__SAFE_GLOBAL_GUARDS__STABLE_SURFACES',requestId:'cxorbia-i4a-visible-shopper-lifecycle-smoke-retry3-20260819-01',sourceHeadSha:'2b661fd06fd125169fc8531edd0b1f0e7ffcd609',retry2RunId:32282049566,enabled:true,consumed:false,status:'authorized_execute_once',authorizedBy:'Paula',allowedProviderExecutions:1,loginAttemptsMax:1,authPasswordUpdatesMax:1,serviceWorkersBlocked:true,safeWindowGlobalGuardsRequired:true,stableSurfaceSelectorsRequired:true,authCreates:0,authClaimsWrites:0,authDeletes:0,firestoreWrites:0,postulationSubmits:0,certificationSubmits:0,reservationWrites:0,historicalShopperAccess:false,otherIdentitiesModifiedMax:0,hrWrites:0,rulesWrites:0,storageWrites:0,makeCalls:0,geminiCalls:0,paymentWrites:0,hostingDeploys:0,cloudRunDeploys:0,merge:false,production:false,automaticRetryAllowed:false,sourceTruthVerifierRequired:true,resultPublicationIndependent:true};
          for(const [k,v] of Object.entries(expected))if(r[k]!==v)throw new Error('request_mismatch:'+k);if(head!==process.env.GITHUB_SHA||base!==r.sourceHeadSha)throw new Error('lineage_mismatch');if(now.length!==1||now[0]!=='.github/workflows/cxorbia-i4a-visible-shopper-lifecycle-smoke-retry3.yml')throw new Error('workflow_scope');if(prior.length!==1||prior[0]!==p)throw new Error('request_scope');fs.appendFileSync(process.env.GITHUB_OUTPUT,'execute=true\n');console.log('PASS_RETRY3_AUTHORIZATION');
