          (async()=>{const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1440,height:1100},serviceWorkers:'block'}),page=await ctx.newPage();page.on('pageerror',e=>out.pageErrors.push(clean(e)));page.on('console',m=>{if(m.type()==='error')out.consoleErrors.push(clean(m.text()))});try{
            phase='page_ready';await page.goto(process.env.DEV_URL+'&t='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await page.waitForFunction(()=>window.CX&&window.CX.backendAuth&&document.querySelector('#loginForm'),null,{timeout:30000});mark('page_ready');await page.evaluate(()=>{window.__I4A_BACKEND_WRITE_ATTEMPTS=[];try{const db=window.firebase.firestore(),dp=Object.getPrototypeOf(db.doc('__i4a__/x')),cc=Object.getPrototypeOf(db.collection('__i4a__'));for(const k of ['set','update','delete'])if(typeof dp[k]==='function')dp[k]=function(){window.__I4A_BACKEND_WRITE_ATTEMPTS.push('doc.'+k);throw new Error('WRITE_BLOCKED')};if(typeof cc.add==='function')cc.add=function(){window.__I4A_BACKEND_WRITE_ATTEMPTS.push('collection.add');throw new Error('WRITE_BLOCKED')}}catch(_){}});await page.evaluate(()=>window.CX.backendAuth.showForRole('shopper'));await page.locator('#lgUser').fill(cred.login);await page.locator('#lgPass').fill(cred.password);out.loginAttempts=1;await page.locator('#lgSubmit').click();
            phase='auth';await page.waitForFunction(()=>window.firebase?.auth?.().currentUser&&window.CX?.backendAuth?.context?.()?.role==='shopper',null,{timeout:30000});mark('firebase_user');mark('shopper_auth_context');await page.waitForFunction(()=>window.CX_SHOPPER_MEMBERSHIP?.status==='verified',null,{timeout:30000});mark('membership_verified');await page.waitForFunction(()=>document.getElementById('app')?.classList.contains('on')===true&&document.getElementById('login')?.classList.contains('hidden')===true,null,{timeout:45000});mark('app_entered');
            phase='hr_authority';await page.waitForFunction(()=>window.CX_PROTECTED_AUTH_HR_AUTHORITY?.applied===true&&window.CX?.data?.previewMeta?.hrAuthority===true,null,{timeout:70000});mark('hr_authority_ready');out.surfaces.auth=await page.evaluate(()=>({role:window.CX?.backendAuth?.context?.()?.role,membership:window.CX_SHOPPER_MEMBERSHIP?.status||null,hrPeriods:window.CX_PROTECTED_AUTH_HR_AUTHORITY?.periods||0,hrVisits:window.CX_PROTECTED_AUTH_HR_AUTHORITY?.hrVisits||0}));
            const nav=async(id,needle)=>{await page.evaluate(x=>window.CX.router.nav(x),id);await page.waitForFunction(([v,n])=>window.CX?.session?.view===v&&(document.getElementById('view')?.innerText||'').includes(n),[id,needle],{timeout:18000});await page.waitForTimeout(400)};
            phase='documents';await nav('documentos','Recursos del proyecto');const docs=page.locator('button[data-doc]:visible'),dc=await docs.count();let viewer=false;if(dc){await docs.first().evaluate(el=>el.click());await page.locator('#docBack:visible').waitFor({state:'visible',timeout:12000});viewer=true;await page.locator('#docBack:visible').evaluate(el=>el.click())}out.surfaces.documents={routeVisible:true,visibleOpenButtons:dc,viewerVisible:viewer};mark('documents',dc>0&&viewer);
            phase='available_visits_postulation';await nav('visitas','Visitas Disponibles');const det=page.locator('button[data-detail]:visible'),av=await det.count(),viewText=await page.locator('#view').innerText(),empty=viewText.includes('Sin visitas disponibles');let detail=false,post=false,disabled=null;if(av){await det.first().evaluate(el=>el.click());await page.locator('#goPost:visible').waitFor({state:'visible',timeout:12000});detail=post=true;disabled=await page.locator('#goPost:visible').isDisabled();const close=page.locator('[data-x2]:visible');if(await close.count())await close.first().evaluate(el=>el.click())}const own=await page.evaluate(()=>{const sid=window.CX?.backendAuth?.context?.()?.shopperId,rows=(window.CX?.data?._posts||[]).filter(x=>x.shopperId===sid);return{count:rows.length,states:[...new Set(rows.map(x=>x.estado||x.status).filter(Boolean))]}});out.surfaces.availableVisitsPostulation={routeVisible:true,availableDetailControls:av,honestEmpty:empty,detailVisible:detail,postulationControlVisible:post,postulationControlDisabled:disabled,ownPostulationState:own};mark('available_visits_postulation',av?detail&&post:empty);
            phase='notifications';try{await page.evaluate(async()=>{if(window.CX?.backendBulletins?.load)await window.CX.backendBulletins.load()})}catch(_){}await page.locator('#tbBell').evaluate(el=>el.click());await page.locator('#tbBellPanel.show').waitFor({state:'visible',timeout:12000});const n=await page.evaluate(()=>({panelVisible:document.getElementById('tbBellPanel')?.classList.contains('show')===true,visibleRows:document.querySelectorAll('#tbBellPanel [data-nid]').length,honestEmpty:(document.getElementById('tbBellPanel')?.innerText||'').includes('Sin novedades por ahora.'),backendSource:window.CX_BACKEND_BULLETINS_STATUS?.source||null,backendCount:window.CX_BACKEND_BULLETINS_STATUS?.count??null}));out.surfaces.notifications=n;mark('notifications',n.panelVisible&&n.backendSource==='firestore');
            phase='certification';await nav('cert','Certificación');const cert=await page.evaluate(()=>{const t=document.getElementById('view')?.innerText||'';return{visible:t.includes('Certificación'),examVisible:!!document.querySelector('#examGo'),pendingSource:/pendiente de fuente|Todavía no hay un banco de certificación publicado/i.test(t),bankReview:/banco en revisión|no publicado/i.test(t),fakeApprovalVisible:/Aprobado \(demo\)/i.test(t)}});out.surfaces.certification=cert;mark('certification',cert.visible&&(cert.examVisible||cert.pendingSource||cert.bankReview)&&!cert.fakeApprovalVisible);
            out.backendWriteAttemptsObserved=await page.evaluate(()=>window.__I4A_BACKEND_WRITE_ATTEMPTS?.length||0);const req=['page_ready','firebase_user','shopper_auth_context','membership_verified','app_entered','hr_authority_ready','documents','available_visits_postulation','notifications','certification'],pass=req.every(k=>out.checkpoints[k]?.pass===true)&&out.backendWriteAttemptsObserved===0&&out.loginAttempts===1&&out.pageErrors.length===0;out.decision=pass?'PASS_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3_SAFE_GLOBALS':'HOLD_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3_SURFACE_ASSERTION';out.failurePhase=pass?null:phase;out.nextGate=pass?'I4A_VISIBLE_LIFECYCLE_READY_TO_CLOSE':'STOP_NO_AUTOMATIC_RETRY';
          }catch(e){out.backendWriteAttemptsObserved=await page.evaluate(()=>window.__I4A_BACKEND_WRITE_ATTEMPTS?.length||0).catch(()=>0);out.decision='HOLD_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3_PHASE_FAILURE';out.failurePhase=phase;out.error=clean(e);out.nextGate='STOP_NO_AUTOMATIC_RETRY'}finally{await browser.close()}fs.writeFileSync(process.env.OUT_DIR+'/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));})().catch(e=>{out.decision='HOLD_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3_HARNESS_CRASH';out.error=clean(e);fs.writeFileSync(process.env.OUT_DIR+'/result.json',JSON.stringify(out,null,2)+'\n');process.exit(1)});
