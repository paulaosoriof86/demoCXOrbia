      - name: Verify canonical source truth before provider access
        if: steps.gate.outputs.execute == 'true'
        env:
          CXORBIA_ALLOW_DETACHED_HEAD: '1'
        run: |
          node tools/verify-cxorbia-source-truth-sync.mjs > "$OUT_DIR/source-truth.json" || true
          cat "$OUT_DIR/source-truth.json"
          node -e "const x=require('./$OUT_DIR/source-truth.json');if(x.decision!=='PASS_SOURCE_TRUTH_SYNC')process.exit(1)"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.execute == 'true'
        with: {node-version: '24'}

      - name: Install transient dependencies
        if: steps.gate.outputs.execute == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null

      - name: Prepare DEV credential privately
        if: steps.gate.outputs.execute == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          node <<'NODE'
          const fs=require('fs'),raw=process.env.EXISTING_DEV_JSON||'';let x;try{x=JSON.parse(raw)}catch{}if(!(x&&x.type==='service_account'&&x.project_id==='cxorbia-backend-dev'&&x.client_email&&x.private_key))throw new Error('credential_invalid');fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"

      - name: Verify dedicated identity and set ephemeral password
        if: steps.gate.outputs.execute == 'true'
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),admin=require('firebase-admin'),r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE)),cr=JSON.parse(fs.readFileSync(process.env.CREATE_REQUEST)),sha=v=>crypto.createHash('sha256').update(String(v)).digest('hex'),key=sha(cr.requestId).slice(0,24),uid='tya-i4a-'+key,shopperId='shp-i4a-'+key,login='cxorbia.i4a.'+key.slice(0,10),uidFp=u=>sha('cxorbia-provider-uid-v1\0'+u),sidFp=s=>sha('shopper-id\0'+s);
          const sa=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS));admin.initializeApp({credential:admin.credential.cert(sa),projectId:r.firebaseProjectId});const auth=admin.auth(),db=admin.firestore();(async()=>{const u=await auth.getUser(uid),c=u.customClaims||{},refs=[db.collection('tenants').doc('tya').collection('shoppers').doc(shopperId),db.collection('tenants').doc('tya').collection('users').doc(uid),db.collection('tenants').doc('tya').collection('shopperIdentityCrosswalk').doc(shopperId),db.collection('tenants').doc('tya').collection('commandReceipts').doc(sha(cr.requestId).slice(0,40))],sn=await Promise.all(refs.map(x=>x.get())),p=sn[0].data()||{},m=sn[1].data()||{},x=sn[2].data()||{},rec=sn[3].data()||{};const ok=c.tenantId==='tya'&&c.role==='shopper'&&c.authNamespace==='shopper'&&c.shopperId===shopperId&&c.projectIds?.includes('cinepolis')&&c.synthetic===true&&c.nonHistorical===true&&p.synthetic===true&&p.nonHistorical===true&&m.active===true&&m.shopperId===shopperId&&m.providerUidFingerprint===uidFp(uid)&&x.providerUidFingerprint===uidFp(uid)&&x.fuzzyMatching===false&&rec.providerAck===true;if(!ok)throw new Error('identity_not_exact');const password=crypto.randomBytes(30).toString('base64url')+'!Aa7';await auth.updateUser(uid,{password});fs.writeFileSync(process.env.PRIVATE_DIR+'/login.json',JSON.stringify({login,password,shopperId}),{mode:0o600});fs.writeFileSync(process.env.OUT_DIR+'/provider-prelogin.json',JSON.stringify({decision:'PASS_PRELOGIN_RETRY3',uidFingerprint:uidFp(uid),shopperIdFingerprint:sidFp(shopperId),providerReads:1,firestoreReads:4,authPasswordUpdates:1,historicalShopperAccess:false,otherIdentitiesModified:0},null,2));})().catch(e=>{console.error(String(e.message||e));process.exit(1)});
          NODE

      - name: Execute visible lifecycle with safe globals
        if: steps.gate.outputs.execute == 'true'
        run: |
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright'),r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE)),cred=JSON.parse(fs.readFileSync(process.env.PRIVATE_DIR+'/login.json')),pre=JSON.parse(fs.readFileSync(process.env.OUT_DIR+'/provider-prelogin.json'));
