        if: always()
        run: node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync('$OUT_DIR/result.json'));console.log(x.decision);if(x.decision!=='PASS_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3_SAFE_GLOBALS')process.exit(1)"
