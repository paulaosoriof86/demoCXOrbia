      - name: Ensure result
        if: always()
        run: mkdir -p "$OUT_DIR"; if [ ! -f "$OUT_DIR/result.json" ]; then printf '%s\n' '{"schemaVersion":"cxorbia.i4a.visible-shopper-lifecycle-smoke-retry3.evidence.v1","decision":"HOLD_I4A_VISIBLE_DEV_SHOPPER_LIFECYCLE_SMOKE_RETRY3_PRE_BROWSER_FAILURE","workflowRunId":'"${GITHUB_RUN_ID}"'}' > "$OUT_DIR/result.json"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i4a-visible-shopper-lifecycle-smoke-retry3-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/result.json
            ${{ env.OUT_DIR }}/provider-prelogin.json
            ${{ env.OUT_DIR }}/source-truth.json
          retention-days: 14

      - name: Publish result independently
        if: always()
        continue-on-error: true
        run: |
          cp "$OUT_DIR/result.json" /tmp/result.json; git fetch origin docs-tya-v6-v71-audit; git checkout -B publish origin/docs-tya-v6-v71-audit; mkdir -p app/docs/evidence; cp /tmp/result.json "$EVIDENCE_PATH"; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add "$EVIDENCE_PATH"; if git diff --cached --quiet; then exit 0; fi; git commit -m 'evidence(i4a): publish retry3 result'; git push origin HEAD:docs-tya-v6-v71-audit

