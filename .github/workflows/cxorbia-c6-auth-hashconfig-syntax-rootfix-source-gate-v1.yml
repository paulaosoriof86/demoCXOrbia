name: CXOrbia C6 Auth HashConfig Syntax Rootfix Source Gate

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v4.mjs'
      - '.github/workflows/cxorbia-c6-auth-hashconfig-syntax-rootfix-source-gate-v1.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-hashconfig-syntax-rootfix-source-gate-v1
  cancel-in-progress: false

jobs:
  offline-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_TOOL: tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v1.mjs
      TOOL: tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v4.mjs
      FREEZE_FILE: backend/config/c6-shopper-auth-final-freeze-v4.json
      CONTRACT_FILE: backend/contracts/c6-auth-plan-v4-activation-dev-v1.json
      PLAN_DIGEST: c0c31fadb88928f5fc0b8a19248188c8610e13362608f1bae3e267034f893ba4
    steps:
      - name: Checkout exact source gate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Node check and wrapper self-test
        run: |
          set -euo pipefail
          node --check "$TOOL"
          node "$TOOL" --source-repair-self-test | tee /tmp/c6-hashconfig-rootfix-selftest.txt
          grep -q 'PASS_C6_AUTH_PLAN_V4_HASHCONFIG_HARNESS_SYNTAX_ROOTFIX_SOURCE_ONLY' /tmp/c6-hashconfig-rootfix-selftest.txt

      - name: Exact substitution circuit breaker and zero-write gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base=fs.readFileSync(process.env.BASE_TOOL,'utf8');
          const wrapper=fs.readFileSync(process.env.TOOL,'utf8');
          const freeze=JSON.parse(fs.readFileSync(process.env.FREEZE_FILE,'utf8'));
          const contract=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const bad='?mask=hashConfig';
          const oldExtraction='const body=await response.json(),hashConfig=body?.hashConfig||body?.hash_config;';
          const newExtraction='const body=await response.json(),hashConfig=body?.signIn?.hashConfig;';
          ok((base.split(bad).length-1)===1,'BASE_MASK_DRIFT');
          ok((base.split(oldExtraction).length-1)===1,'BASE_EXTRACTION_DRIFT');
          const patched=base.replace(bad,'').replace(oldExtraction,newExtraction);
          ok(!patched.includes(bad),'MASK_NOT_REMOVED');
          ok(!patched.includes(oldExtraction),'ROOT_EXTRACTION_NOT_REMOVED');
          ok(patched.includes(newExtraction),'SIGNIN_HASHCONFIG_PATCH_MISSING');
          ok(patched.includes("admin/v2/projects/${encodeURIComponent(projectId)}/config"),'GET_RESOURCE_DRIFT');
          ok(wrapper.includes("const newExtraction = 'const body=await response.json(),hashConfig=body?.signIn?.hashConfig;'"),'WRAPPER_PATCH_DRIFT');
          ok(freeze.finalPlanV4?.rows===340&&freeze.finalPlanV4?.uniqueRows===340&&freeze.finalPlanV4?.rowsDigestSha256===process.env.PLAN_DIGEST,'FREEZE_DRIFT');
          ok(freeze.finalPlanV4?.operationCounts?.CREATE_AUTH===118&&freeze.finalPlanV4?.operationCounts?.UPDATE_AUTH===9&&freeze.finalPlanV4?.operationCounts?.HOLD===0&&freeze.finalPlanV4?.subchangeCounts?.password===8,'FREEZE_COUNTS_DRIFT');
          ok(contract.inputFreeze?.rowsDigestSha256===process.env.PLAN_DIGEST&&contract.prewrite?.passwordChanges===8,'CONTRACT_DRIFT');
          ok(contract.identityCircuitBreaker?.reopenPlanV3UpdateUniverse===false&&contract.identityCircuitBreaker?.reopenSkip13===false&&contract.identityCircuitBreaker?.reopenMultiAuthAdjudication===false&&contract.identityCircuitBreaker?.reopenAc93Lineage===false,'IDENTITY_CIRCUIT_BREAKER_DRIFT');
          const pre=patched.indexOf('sourceSafe.prewrite={pass:true');
          const boundary=patched.indexOf('state.writeBoundaryEntered=true');
          ok(pre>=0&&boundary>pre,'PREWRITE_BOUNDARY_ORDER');
          for(const token of ['await auth.createUser','await auth.updateUser','await auth.setCustomUserClaims']) ok(patched.indexOf(token)>boundary,`WRITE_BEFORE_BOUNDARY:${token}`);
          const beforeBoundary=patched.slice(0,boundary);
          ok(!beforeBoundary.includes('auth.createUser(')&&!beforeBoundary.includes('auth.updateUser(')&&!beforeBoundary.includes('auth.setCustomUserClaims('),'PROVIDER_WRITE_BEFORE_BOUNDARY');
          console.log('PASS_C6_AUTH_V4_HASHCONFIG_SYNTAX_ROOTFIX_OFFLINE_ZERO_WRITES');
          NODE

      - name: Publish PASS status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state='success' -f context='cxorbia/c6-auth-v4-hashconfig-syntax-rootfix-source' -f description='PASS offline syntax, exact substitution, circuit breaker, zero writes' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
