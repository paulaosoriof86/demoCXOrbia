name: CXOrbia C6 SKIP13 Selftest Harness Source Only Once

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'tools/qa/cxorbia-c6-shopper-equivalent-universe.mjs'
      - '.github/workflows/cxorbia-c6-skip13-selftest-harness-source-only-once.yml'

permissions:
  contents: read

concurrency:
  group: cxorbia-c6-skip13-selftest-harness-source-only-once
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EQUIV_FILE: tools/qa/cxorbia-c6-shopper-equivalent-universe.mjs
  ADJ_FILE: tools/qa/cxorbia-c6-skip13-auth-access-adjudication-readonly-v2.mjs
  CONTRACT_FILE: backend/contracts/c6-skip13-auth-access-adjudication-v2.json
  OUT_DIR: .tmp/c6-skip13-selftest-harness-source-only

jobs:
  gate:
    name: SKIP13 selftest harness source-only gate
    if: github.ref_name == 'docs-tya-v6-v71-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax gates
        run: |
          set -euo pipefail
          node --check "$EQUIV_FILE"
          node --check "$ADJ_FILE"

      - name: Equivalent-universe direct self-test is deterministic
        run: |
          set -euo pipefail
          out="$(node "$EQUIV_FILE" --self-test)"
          test "$out" = 'PASS_C6_EQUIVALENT_UNIVERSE_SOURCE_STATIC'
          test "$(printf '%s\n' "$out" | wc -l | tr -d ' ')" = '1'

      - name: Imported module ignores foreign self-test argv
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const chunks=[];
          const original=process.stdout.write.bind(process.stdout);
          process.stdout.write=(chunk,...args)=>{ chunks.push(String(chunk)); return true; };
          process.argv.push('--self-test');
          await import('./tools/qa/cxorbia-c6-shopper-equivalent-universe.mjs');
          process.stdout.write=original;
          if (chunks.join('').trim()) throw new Error('IMPORTED_MODULE_SELFTEST_SIDE_EFFECT_PRESENT:'+chunks.join('').trim());
          console.log('PASS_C6_EQUIVALENT_UNIVERSE_IMPORT_NO_ARGV_SIDE_EFFECT');
          NODE

      - name: SKIP13 cross-namespace self-test is one JSON line
        run: |
          set -euo pipefail
          node "$ADJ_FILE" --self-test > /tmp/skip13-self-test.jsonl
          test "$(wc -l < /tmp/skip13-self-test.jsonl | tr -d ' ')" = '1'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/skip13-self-test.jsonl','utf8'));
          if(x.decision!=='PASS_C6_SKIP13_FINGERPRINT_NAMESPACE_SELF_TEST') throw new Error('SKIP13_SELF_TEST_NOT_PASS');
          if(x.namespaces?.profileFingerprintNamespace!=='deterministic-suffix-plan-profile') throw new Error('PROFILE_NAMESPACE_DRIFT');
          if(x.namespaces?.authCandidateFingerprintNamespace!=='shopper-auth-candidate-v1') throw new Error('AUTH_CANDIDATE_NAMESPACE_DRIFT');
          const f=x.namespaces?.forbiddenProfileJoinNamespaces||[];
          if(!f.includes('shopper-collision-member-v1')||!f.includes('multi-auth-profile-v1')) throw new Error('FORBIDDEN_JOIN_NAMESPACE_DRIFT');
          console.log('PASS_C6_SKIP13_FINGERPRINT_NAMESPACE_SELF_TEST');
          NODE

      - name: Static contract and adjudicator gate
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const contract=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const adjud=fs.readFileSync(process.env.ADJ_FILE,'utf8');
          const equiv=fs.readFileSync(process.env.EQUIV_FILE,'utf8');
          const fp=contract.fingerprintContract||{};
          const checks={
            contractV2: contract.schemaVersion==='cxorbia.c6.skip13-auth-access-adjudication.contract.v2',
            profileNamespace: fp.profileFingerprintNamespace==='deterministic-suffix-plan-profile',
            candidateNamespace: fp.authCandidateFingerprintNamespace==='shopper-auth-candidate-v1',
            memberNamespace: fp.memberProvenanceFingerprintNamespace==='shopper-collision-member-v1',
            multiAuthNamespace: fp.multiAuthProfileFingerprintNamespace==='multi-auth-profile-v1',
            crossNamespaceForbidden: fp.crossNamespaceEqualityAllowed===false,
            forbiddenJoins: Array.isArray(fp.forbiddenProfileJoinNamespaces)&&fp.forbiddenProfileJoinNamespaces.includes('shopper-collision-member-v1')&&fp.forbiddenProfileJoinNamespaces.includes('multi-auth-profile-v1'),
            plannerJoinExact: adjud.includes('stablePlanProfileFingerprint(doc.id)'),
            noMemberJoin: !adjud.includes('stableMemberFingerprint(doc.id)'),
            equivalentMainGuard: equiv.includes('isMainModule')&&equiv.includes("isMainModule && process.argv.includes('--self-test')"),
            noLegacyGlobalSelfTestGuard: !equiv.includes("if (process.argv.includes('--self-test'))")
          };
          const failed=Object.entries(checks).filter(([,ok])=>!ok).map(([k])=>k);
          const result={
            schemaVersion:'cxorbia.c6.skip13-selftest-harness-source-only.result.v1',
            decision:failed.length?'HOLD_C6_SKIP13_SELFTEST_HARNESS_SOURCE_GATE':'PASS_C6_SKIP13_SELFTEST_HARNESS_SOURCE_GATE',
            head:process.env.GITHUB_SHA,
            checks,
            failed,
            safety:{providerReads:0,authReads:0,claimsReads:0,membershipReads:0,hrReads:0,providerWrites:0,authWrites:0,firestoreWrites:0,deploys:0,merge:false,production:false}
          };
          fs.writeFileSync(process.env.OUT_DIR+'/result.json',JSON.stringify(result,null,2)+'\n');
          if(failed.length) throw new Error('SOURCE_GATE_FAILED:'+failed.join(','));
          console.log(result.decision);
          NODE

      - name: Upload source-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-skip13-selftest-harness-source-only-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 14
