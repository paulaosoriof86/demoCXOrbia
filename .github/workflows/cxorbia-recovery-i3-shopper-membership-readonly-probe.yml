name: CXOrbia Recovery I3 Legacy Profile Provenance Readonly

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-shopper-membership-readonly-probe.yml

permissions:
  contents: read
  statuses: write
  actions: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Aggregate provenance signals for deterministic missing-membership set
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/i3-provenance
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin');
          const PROJECT='cxorbia-backend-dev',TENANT='tya',PROJECT_ID='cinepolis',str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v.map(str).filter(Boolean):[];
          let sa;try{sa=JSON.parse(process.env.EXISTING_DEV_JSON||'');}catch{}if(!(sa&&sa.project_id===PROJECT&&sa.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:PROJECT});const db=admin.firestore(),auth=admin.auth();
          async function allUsers(){const out=[];let token;do{const p=await auth.listUsers(1000,token);out.push(...p.users);token=p.pageToken;}while(token);return out;}
          function principal(u){const c=u.customClaims||{},role=str(c.role).toLowerCase(),ns=str(c.authNamespace||(role==='shopper'?'shopper':'staff')).toLowerCase(),shopperId=str(c.shopperId);return role==='shopper'&&ns==='shopper'&&(str(c.tenantId)===TENANT||arr(c.tenants).includes(TENANT))&&(str(c.projectId)===PROJECT_ID||arr(c.projectIds).includes(PROJECT_ID))&&shopperId?{u,c,shopperId}:null;}
          (async()=>{
            const [users,ms,cs,ps]=await Promise.all([allUsers(),db.collection('tenants').doc(TENANT).collection('users').get(),db.collection('tenants').doc(TENANT).collection('shopperIdentityCrosswalk').get(),db.collection('tenants').doc(TENANT).collection('shoppers').get()]);
            const effective=users.map(principal).filter(Boolean),authByShopper=new Map();for(const p of effective){const a=authByShopper.get(p.shopperId)||[];a.push(p);authByShopper.set(p.shopperId,a);}
            const members=ms.docs.map(d=>({uid:d.id,...(d.data()||{})})).filter(x=>str(x.role)==='shopper'||str(x.authNamespace)==='shopper'),byUid=new Map(members.map(m=>[m.uid,m])),byShopper=new Map();for(const m of members){const a=byShopper.get(str(m.shopperId))||[];a.push(m);byShopper.set(str(m.shopperId),a);}
            const crosses=new Map(cs.docs.map(d=>[d.id,d.data()||{}])),profiles=new Map(ps.docs.map(d=>[d.id,d.data()||{}]));
            const counts={safeSet:0,sourceType_hr_external:0,sourceType_platform:0,sourceType_blank:0,blank_with_hrSourceRevision:0,blank_with_hrManaged:0,blank_with_hrRowId:0,blank_with_sourceSafe:0,blank_with_createdVia:0,blank_with_user:0,blank_hr_signal_union:0,blank_platform_signal_only:0,blank_ambiguous:0};
            for(const p of effective){const same=byShopper.get(p.shopperId)||[],group=authByShopper.get(p.shopperId)||[],profile=profiles.get(p.shopperId);if(byUid.has(p.u.uid)||same.length||crosses.has(p.shopperId)||group.length!==1||!profile)continue;counts.safeSet++;const st=str(profile.sourceType);if(st==='hr_external'){counts.sourceType_hr_external++;continue;}if(st==='platform'){counts.sourceType_platform++;continue;}counts.sourceType_blank++;const hrRev=!!str(profile.hrSourceRevision),hrManaged=profile.hrManaged&&typeof profile.hrManaged==='object'&&Object.keys(profile.hrManaged).length>0,hrRow=!!str(profile.hrRowId||profile.hrManaged?.hrRowId),safe=profile.sourceSafe===true||profile.hrManaged?.sourceSafe===true,created=!!str(profile.createdVia),user=!!str(profile.user);if(hrRev)counts.blank_with_hrSourceRevision++;if(hrManaged)counts.blank_with_hrManaged++;if(hrRow)counts.blank_with_hrRowId++;if(safe)counts.blank_with_sourceSafe++;if(created)counts.blank_with_createdVia++;if(user)counts.blank_with_user++;const hrSignal=hrRev||hrManaged||hrRow||safe,platformSignal=created||user;if(hrSignal)counts.blank_hr_signal_union++;else if(platformSignal)counts.blank_platform_signal_only++;else counts.blank_ambiguous++;}
            const report={decision:'PASS_I3_LEGACY_PROFILE_PROVENANCE_READONLY',generatedAt:new Date().toISOString(),headSha:process.env.GITHUB_SHA,rootCause:'MAPPING_FAILURE_SHOPPER_AUTH_UID_TO_TENANT_MEMBERSHIP',counts,safety:{firestoreWrites:0,authWrites:0,production:false,deploys:0,piiExported:false}};fs.writeFileSync('.tmp/i3-provenance/report.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          })().catch(e=>{console.error('PROVENANCE_READONLY_FAILED:'+String(e?.message||e));process.exit(1);});
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-provenance-${{ github.run_id }}
          path: .tmp/i3-provenance/report.json
          if-no-files-found: warn
          retention-days: 7
