name: CXOrbia Recovery I3 Shopper Auth Membership Recurrence Gate

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - backend/runtime/cxorbia-shopper-command-provider-v1.mjs
      - .github/workflows/cxorbia-recovery-i3-shopper-membership-readonly-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  group: cxorbia-recovery-i3-shopper-auth-membership-recurrence
  cancel-in-progress: false

jobs:
  gate8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check exact provider
        run: |
          set -euo pipefail
          node --check backend/runtime/cxorbia-shopper-command-provider-v1.mjs

      - name: Prove historical Auth reuse and fail-closed recurrence behavior
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createShopperCommandProvider,stableShopperUid,providerUidFingerprint} from './backend/runtime/cxorbia-shopper-command-provider-v1.mjs';

          const TENANT='tya', PROJECT='cinepolis', SHOPPER='shopper-test-1';
          const policy={schemaVersion:'cxorbia.shopper-command-provider-policy.v1',enabled:true,allowedTenantIds:[TENANT],allowedProjectIds:[PROJECT],hrWrites:false,externalWrites:false,fuzzyMatching:false};
          const snapshot={sourceSafe:true,imported:false,firestoreWrites:0,tenantId:TENANT,projectId:PROJECT,shoppers:[{shopperId:SHOPPER,sourceSafe:true,piiProtected:true,nombre:'Synthetic Shopper'}]};
          const canonicalClaims=shopperId=>({tenantId:TENANT,projectIds:[PROJECT],role:'shopper',authNamespace:'shopper',shopperId});
          const notFound=()=>Object.assign(new Error('not found'),{code:'auth/user-not-found'});

          function makeDb(){
            const store=new Map();
            class Ref{
              constructor(path){this.path=path;this.id=path.split('/').at(-1);}
              collection(name){return new Col(`${this.path}/${name}`);}
              async get(){return snap(this.path);}
              async set(data,{merge=false}={}){const prior=store.get(this.path)||{};store.set(this.path,merge?{...prior,...data}:{...data});}
            }
            class Query{
              constructor(path,field,value,limitN=Infinity){this.path=path;this.field=field;this.value=value;this.limitN=limitN;}
              limit(n){return new Query(this.path,this.field,this.value,n);}
              async get(){const prefix=`${this.path}/`,docs=[];for(const [path,data] of store){if(!path.startsWith(prefix)||path.slice(prefix.length).includes('/'))continue;if(data?.[this.field]===this.value)docs.push(docSnap(path,data));if(docs.length>=this.limitN)break;}return{size:docs.length,docs};}
            }
            class Col extends Ref{
              doc(id){return new Ref(`${this.path}/${id}`);}
              where(field,op,value){assert.equal(op,'==');return new Query(this.path,field,value);}
            }
            const docSnap=(path,data)=>({exists:true,id:path.split('/').at(-1),data:()=>structuredClone(data)});
            const snap=path=>store.has(path)?docSnap(path,store.get(path)):({exists:false,id:path.split('/').at(-1),data:()=>undefined});
            const db={
              collection:name=>new Col(name),
              runTransaction:async fn=>fn({get:ref=>ref.get(),set:(ref,data,opts)=>ref.set(data,opts)}),
              _store:store
            };
            return db;
          }

          function makeAuth(initial=[]){
            const users=new Map(initial.map(u=>[u.uid,structuredClone(u)]));
            let createCalls=0,listCalls=0;
            return {
              get createCalls(){return createCalls;},get listCalls(){return listCalls;},_users:users,
              async listUsers(){listCalls++;return{users:[...users.values()].map(u=>structuredClone(u)),pageToken:null};},
              async getUser(uid){if(!users.has(uid))throw notFound();return structuredClone(users.get(uid));},
              async getUserByEmail(email){const u=[...users.values()].find(x=>x.email===email);if(!u)throw notFound();return structuredClone(u);},
              async createUser(input){createCalls++;const u={...input,customClaims:{},providerData:[]};users.set(u.uid,u);return structuredClone(u);},
              async setCustomUserClaims(uid,claims){const u=users.get(uid);if(!u)throw notFound();u.customClaims=structuredClone(claims);},
              async verifyIdToken(){throw new Error('not used');}
            };
          }

          async function reconcile(auth,db){
            const provider=createShopperCommandProvider({auth,db,policy});
            return provider.reconcileSnapshot(snapshot,{sourceRevision:'synthetic-rev-1'});
          }

          {
            const historicalUid='historical-password-uid';
            const auth=makeAuth([{uid:historicalUid,disabled:false,customClaims:canonicalClaims(SHOPPER),providerData:[{providerId:'password'}]}]);
            const db=makeDb();
            const result=await reconcile(auth,db);
            assert.equal(result.authCreated,0);
            assert.equal(auth.createCalls,0);
            assert.equal(auth.listCalls,1);
            const member=db._store.get(`tenants/${TENANT}/users/${historicalUid}`);
            assert.equal(member?.shopperId,SHOPPER);
            assert.equal(member?.providerUidFingerprint,providerUidFingerprint(historicalUid));
            assert.equal(db._store.has(`tenants/${TENANT}/users/${stableShopperUid(TENANT,SHOPPER)}`),false);
          }

          {
            const claims=canonicalClaims(SHOPPER);
            const auth=makeAuth([{uid:'u1',disabled:false,customClaims:claims},{uid:'u2',disabled:false,customClaims:claims}]);
            const db=makeDb();
            await assert.rejects(()=>reconcile(auth,db),/SHOPPER_AUTH_PRINCIPAL_AMBIGUOUS/);
            assert.equal(auth.createCalls,0);
            assert.equal(db._store.size,0);
          }

          {
            const auth=makeAuth([{uid:'disabled-u1',disabled:true,customClaims:canonicalClaims(SHOPPER)}]);
            const db=makeDb();
            await assert.rejects(()=>reconcile(auth,db),/SHOPPER_AUTH_PRINCIPAL_DISABLED/);
            assert.equal(auth.createCalls,0);
            assert.equal(db._store.size,0);
          }

          {
            const auth=makeAuth([]),db=makeDb();
            const result=await reconcile(auth,db);
            const deterministic=stableShopperUid(TENANT,SHOPPER);
            assert.equal(result.authCreated,1);
            assert.equal(auth.createCalls,1);
            assert.equal(auth._users.has(deterministic),true);
            assert.equal(db._store.get(`tenants/${TENANT}/users/${deterministic}`)?.shopperId,SHOPPER);
          }

          console.log(JSON.stringify({decision:'PASS_I3_SHOPPER_AUTH_RECURRENCE_SOURCE',historicalUidReused:true,ambiguousFailsClosed:true,disabledOnlyFailsClosed:true,deterministicOnlyOnTrueAbsence:true,production:false,externalWrites:0}));
          NODE

      - name: Install read-only Firebase dependency
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Read back exact DEV Auth membership crosswalk profile linkage
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),admin=require('firebase-admin');
          const PROJECT='cxorbia-backend-dev',TENANT='tya',PROJECT_ID='cinepolis';
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v:[],uniq=v=>[...new Set(arr(v).map(str).filter(Boolean))].sort();
          const stable=v=>Array.isArray(v)?v.map(stable):(v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v);
          const sha=v=>crypto.createHash('sha256').update(typeof v==='string'?v:JSON.stringify(stable(v)),'utf8').digest('hex');
          const uidFp=uid=>sha('cxorbia-provider-uid-v1\0'+str(uid));
          const canonicalClaims=(shopperId,projectIds)=>({authNamespace:'shopper',projectIds:uniq(projectIds),role:'shopper',shopperId:str(shopperId),tenantId:TENANT});
          const claimsDigest=(shopperId,projectIds)=>sha(canonicalClaims(shopperId,projectIds));
          const same=(a,b)=>JSON.stringify(stable(a))===JSON.stringify(stable(b));
          let sa;try{sa=JSON.parse(process.env.EXISTING_DEV_JSON||'');}catch{}
          if(!(sa&&sa.type==='service_account'&&sa.project_id===PROJECT&&sa.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:PROJECT});
          const auth=admin.auth(),db=admin.firestore();
          async function allUsers(){const out=[];let token;do{const page=await auth.listUsers(1000,token);out.push(...page.users);token=page.pageToken;}while(token);return out;}
          function principal(u){const c=u.customClaims||{},role=str(c.role).toLowerCase(),ns=str(c.authNamespace||(role==='shopper'?'shopper':'')).toLowerCase(),shopperId=str(c.shopperId),projects=uniq([...(arr(c.projectIds)),c.projectId]);const tenantMatch=str(c.tenantId)===TENANT||arr(c.tenants).map(str).includes(TENANT);return role==='shopper'&&ns==='shopper'&&tenantMatch&&projects.includes(PROJECT_ID)&&shopperId?{u,c,shopperId,projects}:null;}
          (async()=>{
            const tenant=db.collection('tenants').doc(TENANT);
            const [users,ms,cs,ps]=await Promise.all([allUsers(),tenant.collection('users').get(),tenant.collection('shopperIdentityCrosswalk').get(),tenant.collection('shoppers').get()]);
            const active=users.map(principal).filter(Boolean).filter(p=>p.u.disabled!==true);
            const groups=new Map();for(const p of active){const a=groups.get(p.shopperId)||[];a.push(p);groups.set(p.shopperId,a);}
            const members=ms.docs.map(d=>({uid:d.id,...(d.data()||{})})).filter(m=>str(m.role)==='shopper'||str(m.authNamespace)==='shopper');
            const byUid=new Map(members.map(m=>[m.uid,m])),byShopper=new Map();for(const m of members){const a=byShopper.get(str(m.shopperId))||[];a.push(m);byShopper.set(str(m.shopperId),a);}
            const crosses=new Map(cs.docs.map(d=>[d.id,d.data()||{}])),profiles=new Map(ps.docs.map(d=>[d.id,d.data()||{}]));
            let exact=0,badMembership=0,badCrosswalk=0,badProfile=0,duplicateMembership=0;
            for(const p of active){
              const m=byUid.get(p.u.uid),c=crosses.get(p.shopperId),sameShopper=byShopper.get(p.shopperId)||[];
              const membershipOk=!!m&&m.active===true&&str(m.tenantId)===TENANT&&str(m.role)==='shopper'&&str(m.authNamespace)==='shopper'&&str(m.shopperId)===p.shopperId&&same(uniq(m.projectIds),p.projects)&&str(m.providerUidFingerprint)===uidFp(p.u.uid)&&str(m.claimsDigest)===claimsDigest(p.shopperId,p.projects);
              const crossOk=!!c&&str(c.tenantId)===TENANT&&str(c.shopperId||p.shopperId)===p.shopperId&&same(uniq(c.projectIds),p.projects)&&str(c.authNamespace)==='shopper'&&str(c.providerUidFingerprint)===uidFp(p.u.uid);
              const profileOk=profiles.has(p.shopperId);
              const uniqueMembership=sameShopper.length===1&&sameShopper[0].uid===p.u.uid;
              if(!membershipOk)badMembership++;if(!crossOk)badCrosswalk++;if(!profileOk)badProfile++;if(!uniqueMembership)duplicateMembership++;
              if(membershipOk&&crossOk&&profileOk&&uniqueMembership)exact++;
            }
            const activeDuplicateShopperIds=[...groups.values()].filter(a=>a.length>1).length;
            const report={decision:'PASS_I3_SHOPPER_AUTH_MEMBERSHIP_DEV_READONLY',headSha:process.env.GITHUB_SHA,activePrincipals:active.length,uniqueShopperIds:groups.size,activeDuplicateShopperIds,exactLinks:exact,badMembership,badCrosswalk,badProfile,duplicateMembership,safety:{firestoreWrites:0,authWrites:0,hrWrites:0,production:false,deploys:0}};
            if(active.length!==425||groups.size!==425||activeDuplicateShopperIds!==0||exact!==425||badMembership||badCrosswalk||badProfile||duplicateMembership)throw new Error('GATE8_DEV_READBACK_FAIL:'+JSON.stringify(report));
            console.log(JSON.stringify(report));
          })().catch(e=>{console.error(String(e?.stack||e));process.exit(1);});
          NODE

      - name: Publish Gate 8 recurrence status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = success ]; then STATE=success; DESC='PASS historical UID reuse + DEV exact 425/425'; else STATE=failure; DESC='FAIL shopper auth membership recurrence gate'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/i3-shopper-auth-membership-recurrence' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
