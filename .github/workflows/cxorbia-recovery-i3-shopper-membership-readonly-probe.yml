name: CXOrbia Recovery I3 Shopper Membership Exact Backfill

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-shopper-membership-readonly-probe.yml

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  group: cxorbia-recovery-i3-shopper-membership-exact-backfill
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install transient Firebase Admin
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Exact DEV membership backfill and immediate readback
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/i3-shopper-membership-backfill
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),admin=require('firebase-admin');
          const PROJECT='cxorbia-backend-dev',TENANT='tya',PROJECT_ID='cinepolis',EXPECTED_SAFE=201;
          const raw=process.env.EXISTING_DEV_JSON||'';let sa=null;try{sa=JSON.parse(raw);}catch{}
          if(!(sa&&sa.type==='service_account'&&sa.project_id===PROJECT&&sa.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:PROJECT});
          const db=admin.firestore(),auth=admin.auth(),str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v.map(str).filter(Boolean):[],uniq=v=>[...new Set(arr(v))].sort();
          const stable=value=>Array.isArray(value)?value.map(stable):(value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(k=>[k,stable(value[k])])):value);
          const sha=v=>crypto.createHash('sha256').update(typeof v==='string'?v:JSON.stringify(stable(v)),'utf8').digest('hex');
          const uidFp=uid=>sha('cxorbia-provider-uid-v1\0'+str(uid));
          const claimsDigest=(shopperId,projectIds)=>sha({authNamespace:'shopper',projectIds:uniq(projectIds),role:'shopper',shopperId:str(shopperId),tenantId:TENANT});
          async function allUsers(){const out=[];let token;do{const p=await auth.listUsers(1000,token);out.push(...p.users);token=p.pageToken;}while(token);return out;}
          function principal(u){const c=u.customClaims||{},role=str(c.role).toLowerCase(),ns=str(c.authNamespace||(role==='shopper'?'shopper':'staff')).toLowerCase(),shopperId=str(c.shopperId);return role==='shopper'&&ns==='shopper'&&(str(c.tenantId)===TENANT||arr(c.tenants).includes(TENANT))&&(str(c.projectId)===PROJECT_ID||arr(c.projectIds).includes(PROJECT_ID))&&shopperId?{u,c,shopperId}:null;}
          async function snapshot(){
            const [users,memberSnap,crossSnap,profileSnap]=await Promise.all([allUsers(),db.collection('tenants').doc(TENANT).collection('users').get(),db.collection('tenants').doc(TENANT).collection('shopperIdentityCrosswalk').get(),db.collection('tenants').doc(TENANT).collection('shoppers').get()]);
            const effective=users.map(principal).filter(Boolean),authByShopper=new Map();for(const p of effective){const a=authByShopper.get(p.shopperId)||[];a.push(p);authByShopper.set(p.shopperId,a);}
            const members=memberSnap.docs.map(d=>({uid:d.id,...(d.data()||{})})).filter(x=>str(x.role)==='shopper'||str(x.authNamespace)==='shopper'),byUid=new Map(members.map(m=>[m.uid,m])),byShopper=new Map();for(const m of members){const s=str(m.shopperId);if(!s)continue;const a=byShopper.get(s)||[];a.push(m);byShopper.set(s,a);}
            const crosses=crossSnap.docs.map(d=>({id:d.id,...(d.data()||{})})),crossByShopper=new Map();for(const c of crosses){const s=str(c.shopperId||c.id);if(!s)continue;const a=crossByShopper.get(s)||[];a.push(c);crossByShopper.set(s,a);}
            const profiles=new Map(profileSnap.docs.map(d=>[d.id,{id:d.id,...(d.data()||{})}]));
            return{users,effective,authByShopper,members,byUid,byShopper,crosses,crossByShopper,profiles,profileCount:profileSnap.size};
          }
          (async()=>{
            const before=await snapshot(),safe=[];
            for(const p of before.effective){
              const same=before.byShopper.get(p.shopperId)||[],crosses=before.crossByShopper.get(p.shopperId)||[],authGroup=before.authByShopper.get(p.shopperId)||[],profile=before.profiles.get(p.shopperId);
              if(!before.byUid.has(p.u.uid)&&same.length===0&&crosses.length===0&&authGroup.length===1&&profile){
                const sourceType=str(profile.sourceType);
                if(sourceType!=='hr_external'&&sourceType!=='platform')throw new Error('UNSUPPORTED_PROFILE_SOURCE_TYPE:'+sourceType);
                safe.push({...p,profile,sourceType});
              }
            }
            if(safe.length!==EXPECTED_SAFE)throw new Error(`PREWRITE_SET_DRIFT:expected_${EXPECTED_SAFE}_observed_${safe.length}`);
            const duplicateIds=[...before.authByShopper.values()].filter(a=>a.length>1).length;
            if(duplicateIds!==6)throw new Error(`PREWRITE_DUPLICATE_SET_DRIFT:expected_6_observed_${duplicateIds}`);
            const batch=db.batch(),at=new Date().toISOString();
            for(const p of safe){
              const projectIds=uniq([...(p.c.projectIds||[]),...(p.profile.projectIds||[]),PROJECT_ID]);
              const membership={active:true,tenantId:TENANT,role:'shopper',authNamespace:'shopper',shopperId:p.shopperId,projectIds,providerUidFingerprint:uidFp(p.u.uid),claimsDigest:claimsDigest(p.shopperId,projectIds),membershipVersion:'cxorbia-shopper-membership-v1',updatedAt:at};
              const crosswalk={tenantId:TENANT,shopperId:p.shopperId,projectIds,authNamespace:'shopper',providerUidFingerprint:uidFp(p.u.uid),sourceStableKey:p.shopperId,identityMode:p.sourceType==='platform'?'stable_platform_shopper_id':'stable_hr_shopper_id',fuzzyMatching:false,sourceType:p.sourceType,updatedAt:at};
              batch.set(db.collection('tenants').doc(TENANT).collection('users').doc(p.u.uid),membership,{merge:true});
              batch.set(db.collection('tenants').doc(TENANT).collection('shopperIdentityCrosswalk').doc(p.shopperId),crosswalk,{merge:true});
            }
            await batch.commit();
            const after=await snapshot();
            let ok=0,missing=0,underOther=0,crossMismatch=0,duplicateMembership=0,scopeMismatch=0;
            for(const p of after.effective){
              const fp=uidFp(p.u.uid),m=after.byUid.get(p.u.uid),same=after.byShopper.get(p.shopperId)||[],crosses=after.crossByShopper.get(p.shopperId)||[];
              if(!m){if(same.length>1)duplicateMembership++;else if(same.length===1)underOther++;else missing++;continue;}
              if(same.length>1){duplicateMembership++;continue;}
              if(str(m.shopperId)!==p.shopperId||str(m.tenantId)!==TENANT||str(m.role)!=='shopper'||str(m.authNamespace)!=='shopper'){scopeMismatch++;continue;}
              if(str(m.providerUidFingerprint)!==fp||crosses.length!==1||str(crosses[0].providerUidFingerprint)!==fp){crossMismatch++;continue;}
              ok++;
            }
            const expectedOk=223+EXPECTED_SAFE;
            if(ok!==expectedOk||missing!==2||underOther!==5||crossMismatch!==0||duplicateMembership!==0||scopeMismatch!==0)throw new Error(`POSTWRITE_READBACK_MISMATCH:ok_${ok}_missing_${missing}_underOther_${underOther}_cross_${crossMismatch}_dupMem_${duplicateMembership}_scope_${scopeMismatch}`);
            const report={schemaVersion:'cxorbia.recovery.i3.shopper-membership-exact-backfill.v1',generatedAt:new Date().toISOString(),headSha:process.env.GITHUB_SHA,decision:'PASS_I3_SHOPPER_MEMBERSHIP_EXACT_BACKFILL',rootCause:'MAPPING_FAILURE_SHOPPER_AUTH_UID_TO_TENANT_MEMBERSHIP',before:{effectiveShopperPrincipals:before.effective.length,membershipDocuments:before.members.length,crosswalkDocuments:before.crosses.length,deterministicSafe:EXPECTED_SAFE,duplicateAuthShopperIds:duplicateIds},write:{membershipWrites:EXPECTED_SAFE,crosswalkWrites:EXPECTED_SAFE,authWrites:0,profileWrites:0,totalFirestoreWrites:EXPECTED_SAFE*2,preservedHistoricalAuthUid:true},after:{effectiveShopperPrincipals:after.effective.length,OK:ok,AUTH_UID_WITHOUT_MEMBERSHIP:missing,MEMBERSHIP_UNDER_OTHER_UID:underOther,CROSSWALK_UID_MISMATCH:crossMismatch,DUPLICATE_MEMBERSHIP:duplicateMembership,OTHER_SCOPE_MISMATCH:scopeMismatch,remainingDuplicateAuthShopperIds:[...after.authByShopper.values()].filter(a=>a.length>1).length},safety:{production:false,hrWrites:0,authWrites:0,profileWrites:0,deploys:0,reimport:false,piiExported:false,secretsExported:false}};
            fs.writeFileSync('.tmp/i3-shopper-membership-backfill/report.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          })().catch(e=>{console.error('EXACT_BACKFILL_FAILED:'+String(e?.message||e).replace(/[^A-Za-z0-9_.:-]+/g,'_').slice(0,220));process.exit(1);});
          NODE
      - name: Upload sanitized repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-shopper-membership-backfill-${{ github.run_id }}
          path: .tmp/i3-shopper-membership-backfill/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish compact repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=error;DESC='EXACT_BACKFILL_FAILED'
          if [ -f .tmp/i3-shopper-membership-backfill/report.json ]; then
            STATE=success
            DESC="$(node - <<'NODE'
          const r=require('./.tmp/i3-shopper-membership-backfill/report.json');process.stdout.write(`PASS writes=${r.write.totalFirestoreWrites} OK=${r.after.OK} remaining=${r.after.AUTH_UID_WITHOUT_MEMBERSHIP+r.after.MEMBERSHIP_UNDER_OTHER_UID} dupAuthIds=${r.after.remainingDuplicateAuthShopperIds}`);
          NODE
          )"
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/i3-shopper-membership-exact-backfill' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
