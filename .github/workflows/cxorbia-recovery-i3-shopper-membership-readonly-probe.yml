name: CXOrbia Recovery I3 Remaining Duplicate Auth Canonicalization Readonly

on:
  push:
    branches:
      - recovery/cxorbia-phase-a-20260831
    paths:
      - .github/workflows/cxorbia-recovery-i3-shopper-membership-readonly-probe.yml

permissions:
  contents: read
  statuses: write
  actions: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Read duplicate Auth provenance and orphan crosswalk only
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/i3-remaining
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),admin=require('firebase-admin');const PROJECT='cxorbia-backend-dev',TENANT='tya',PROJECT_ID='cinepolis';
          const str=v=>String(v??'').trim(),arr=v=>Array.isArray(v)?v.map(str).filter(Boolean):[],sha=v=>crypto.createHash('sha256').update(String(v),'utf8').digest('hex'),uidFp=uid=>sha('cxorbia-provider-uid-v1\0'+str(uid)),stableUid=shopperId=>`cx-sh-${sha(`${TENANT}\0shopper\0${str(shopperId)}`).slice(0,28)}`;
          let sa;try{sa=JSON.parse(process.env.EXISTING_DEV_JSON||'');}catch{}if(!(sa&&sa.project_id===PROJECT&&sa.private_key))throw new Error('DEV_CREDENTIAL_INVALID');admin.initializeApp({credential:admin.credential.cert(sa),projectId:PROJECT});const db=admin.firestore(),auth=admin.auth();
          async function allUsers(){const out=[];let token;do{const p=await auth.listUsers(1000,token);out.push(...p.users);token=p.pageToken;}while(token);return out;}
          function principal(u){const c=u.customClaims||{},role=str(c.role).toLowerCase(),ns=str(c.authNamespace||(role==='shopper'?'shopper':'staff')).toLowerCase(),shopperId=str(c.shopperId);return role==='shopper'&&ns==='shopper'&&(str(c.tenantId)===TENANT||arr(c.tenants).includes(TENANT))&&(str(c.projectId)===PROJECT_ID||arr(c.projectIds).includes(PROJECT_ID))&&shopperId?{u,c,shopperId}:null;}
          (async()=>{const [users,ms,cs,ps]=await Promise.all([allUsers(),db.collection('tenants').doc(TENANT).collection('users').get(),db.collection('tenants').doc(TENANT).collection('shopperIdentityCrosswalk').get(),db.collection('tenants').doc(TENANT).collection('shoppers').get()]);const principals=users.map(principal).filter(Boolean),groups=new Map();for(const p of principals){const a=groups.get(p.shopperId)||[];a.push(p);groups.set(p.shopperId,a);}const memberships=new Map(ms.docs.map(d=>[d.id,d.data()||{}])),crosses=new Map(cs.docs.map(d=>[d.id,d.data()||{}])),profiles=new Map(ps.docs.map(d=>[d.id,d.data()||{}]));const duplicates=[];for(const [shopperId,g] of groups){if(g.length<2)continue;const ordered=[...g].sort((a,b)=>new Date(a.u.metadata?.creationTime||0)-new Date(b.u.metadata?.creationTime||0));duplicates.push({shopperFingerprint:sha('shopper\0'+shopperId).slice(0,16),principalCount:g.length,profileExists:profiles.has(shopperId),crosswalkExists:crosses.has(shopperId),crosswalkMatchesOldest:crosses.has(shopperId)?str(crosses.get(shopperId).providerUidFingerprint)===uidFp(ordered[0].u.uid):false,principals:ordered.map((p,i)=>({rankByCreation:i===0?'OLDEST':'NEWER',uidFingerprint:uidFp(p.u.uid).slice(0,16),createdAt:p.u.metadata?.creationTime||null,lastSignInAt:p.u.metadata?.lastSignInTime||null,lastRefreshAt:p.u.metadata?.lastRefreshTime||null,disabled:p.u.disabled===true,hasPasswordProvider:(p.u.providerData||[]).some(x=>x.providerId==='password'),internalCxorbiaEmail:/@auth\.cxorbia\.invalid$/i.test(str(p.u.email)),uidMatchesDeterministicStable:p.u.uid===stableUid(shopperId),hasMembership:memberships.has(p.u.uid),membershipFingerprintMatches:memberships.has(p.u.uid)?str(memberships.get(p.u.uid).providerUidFingerprint)===uidFp(p.u.uid):false}))});}
          let orphanCrosswalk=0;const orphan=[];for(const p of principals){const m=memberships.get(p.u.uid);if(!m)continue;const c=crosses.get(p.shopperId);if(!c){orphanCrosswalk++;orphan.push({uidFingerprint:uidFp(p.u.uid).slice(0,16),shopperFingerprint:sha('shopper\0'+p.shopperId).slice(0,16),profileExists:profiles.has(p.shopperId),uidMatchesDeterministicStable:p.u.uid===stableUid(p.shopperId),internalCxorbiaEmail:/@auth\.cxorbia\.invalid$/i.test(str(p.u.email))});}}
          const report={decision:'PASS_I3_REMAINING_DUPLICATE_AUTH_CANONICALIZATION_READONLY',generatedAt:new Date().toISOString(),headSha:process.env.GITHUB_SHA,counts:{authUsers:users.length,effectivePrincipals:principals.length,effectiveShopperIds:groups.size,duplicateShopperIds:duplicates.length,membershipDocuments:ms.size,crosswalkDocuments:cs.size,orphanMembershipWithoutCrosswalk:orphanCrosswalk},duplicates,orphan,safety:{firestoreWrites:0,authWrites:0,production:false,deploys:0,piiExported:false,secretsExported:false}};fs.writeFileSync('.tmp/i3-remaining/report.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));})().catch(e=>{console.error('REMAINING_READONLY_FAILED:'+String(e?.message||e));process.exit(1);});
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i3-remaining-${{ github.run_id }}
          path: .tmp/i3-remaining/report.json
          if-no-files-found: warn
          retention-days: 14
