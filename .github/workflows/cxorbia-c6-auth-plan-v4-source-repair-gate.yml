name: CXOrbia C6 Auth Plan V4 HashConfig Source Repair Gate

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v2.mjs'

permissions:
  contents: read
  statuses: write

jobs:
  source-repair-gate:
    runs-on: ubuntu-latest
    env:
      BASE_TOOL: tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v1.mjs
      TOOL: tools/qa/cxorbia-c6-auth-plan-v4-activation-dev-v2.mjs
      CONTRACT_FILE: backend/contracts/c6-auth-plan-v4-activation-dev-v1.json
      FREEZE_FILE: backend/config/c6-shopper-auth-final-freeze-v4.json
      PLAN_DIGEST: c0c31fadb88928f5fc0b8a19248188c8610e13362608f1bae3e267034f893ba4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact source-only repair and zero writes before boundary
        id: gate
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check "$TOOL"
          node "$TOOL" --source-repair-self-test
          node <<'NODE'
          const fs=require('fs');const base=fs.readFileSync(process.env.BASE_TOOL,'utf8');const freeze=JSON.parse(fs.readFileSync(process.env.FREEZE_FILE,'utf8'));const contract=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));const ok=(v,m)=>{if(!v)throw new Error(m)};const bad='?mask=hashConfig';ok((base.split(bad).length-1)===1,'BASE_MASK_OCCURRENCE_DRIFT');const patched=base.replace(bad,'');ok(!patched.includes(bad),'MASK_NOT_REMOVED');ok(patched.includes('admin/v2/projects/${encodeURIComponent(projectId)}/config`'),'GET_RESOURCE_DRIFT');ok(patched.includes('const body=await response.json(),hashConfig=body?.hashConfig||body?.hash_config'),'HASH_EXTRACTION_DRIFT');ok(freeze.finalPlanV4?.rows===340&&freeze.finalPlanV4?.uniqueRows===340&&freeze.finalPlanV4?.rowsDigestSha256===process.env.PLAN_DIGEST,'FREEZE_DRIFT');ok(freeze.finalPlanV4?.operationCounts?.CREATE_AUTH===118&&freeze.finalPlanV4?.operationCounts?.UPDATE_AUTH===9&&freeze.finalPlanV4?.operationCounts?.HOLD===0,'FREEZE_COUNTS');ok(contract.inputFreeze?.rowsDigestSha256===process.env.PLAN_DIGEST&&contract.prewrite?.passwordChanges===8,'CONTRACT_DRIFT');const pre=patched.indexOf('sourceSafe.prewrite={pass:true');const boundary=patched.indexOf('state.writeBoundaryEntered=true');ok(pre>=0&&boundary>pre,'PREWRITE_BOUNDARY_ORDER');const prefix=patched.slice(0,boundary);ok(!prefix.includes('auth.createUser(')&&!prefix.includes('auth.updateUser(')&&!prefix.includes('auth.setCustomUserClaims('),'WRITE_BEFORE_BOUNDARY');console.log('PASS_C6_AUTH_PLAN_V4_HASH_CONFIG_REPAIR_STATIC_ZERO_WRITES');
          NODE
      - name: Publish source repair gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          state=failure; desc='STOP_C6_HASH_CONFIG_SOURCE_REPAIR_GATE'
          if [ "$OUTCOME" = 'success' ]; then state=success; desc='PASS_C6_HASH_CONFIG_SOURCE_REPAIR_STATIC_ZERO_WRITES'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='cxorbia/c6-auth-plan-v4-hashconfig-source-repair' -f description="$desc" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          test "$OUTCOME" = 'success'
