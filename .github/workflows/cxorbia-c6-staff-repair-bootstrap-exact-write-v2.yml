name: CXOrbia C6 Staff Repair Bootstrap Exact Write V2

# STOP_RETRY 2026-08-14 — I3 reached a provider-read-only historical Shopper
# credential hold before any I3 provider write. The full authorized I3 harness is
# preserved in git history at b7be75b49b06d8159155ef0b46122d04fd603ebc.
# It must not execute again without a fresh Paula authorization because the I3
# request explicitly required STOP_RETRY on drift/ambiguity and no automatic retry.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked-stop-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: I3 provider lane parked
        run: |
          echo 'STOP_RETRY_I3_HISTORICAL_SHOPPER_CREDENTIAL_UNAVAILABLE'
          echo 'No provider access, no provider writes, no retry.'
          echo 'Fresh Paula authorization is required before restoring the preserved I3 harness.'
