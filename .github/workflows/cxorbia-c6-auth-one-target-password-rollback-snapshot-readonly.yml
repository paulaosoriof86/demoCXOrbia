name: CXOrbia C6 Auth One Target Password Rollback Snapshot Readonly

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/c6-auth-one-target-password-rollback-snapshot-readonly-request-v1.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-one-target-password-rollback-snapshot-readonly
  cancel-in-progress: false

jobs:
  readonly-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUEST_FILE: backend/config/c6-auth-one-target-password-rollback-snapshot-readonly-request-v1.json
      TOOL_FILE: tools/qa/cxorbia-c6-auth-one-target-password-rollback-snapshot-readonly.mjs
      SOURCE_DIR: .tmp/c6-auth-one-target-password-rollback/source
      EXPORT_DIR: .tmp/c6-auth-one-target-password-rollback/export
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact one-target read-only authorization
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ensure=(v,c)=>{if(!v)throw new Error(c)};
          ensure(r.schemaVersion==='cxorbia.c6.auth-one-target-password-rollback-snapshot-readonly.request.v1','SCHEMA');
          ensure(r.requestId==='c6-auth-one-target-password-rollback-snapshot-readonly-20260807-01','REQUEST_ID');
          ensure(r.authorizedBy==='Paula'&&r.enabled===true&&r.consumed===false&&r.status==='authorized_execute_once'&&Number(r.allowedExecutions)===1,'AUTHORIZATION');
          ensure(r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&Number(r.pullRequest)===7&&r.firebaseProjectId==='cxorbia-backend-dev','LANE');
          ensure(r.targetProfileFingerprint==='ac93d90d9e41512acdcd','TARGET');
          ensure(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_SOURCE_LOCK');
          ensure(Number(r.providerReadBudget?.authDirectoryPagesMax)===1&&Number(r.providerReadBudget?.hashConfigReadsMax)===1,'READ_BUDGET');
          for(const k of ['providerWrites','authWrites','firestoreReads','firestoreWrites','hrReads','hrWrites','rulesWrites','storageWrites','hostingDeploys','cloudRunDeploys','cloudBuilds','makeCalls','geminiCalls','paymentWrites'])ensure(Number(r.safety?.[k])===0,'UNSAFE_'+k);
          ensure(r.safety?.merge===false&&r.safety?.production===false,'RELEASE_SCOPE');
          console.log(JSON.stringify({head,parent,changed,authorized:true,targetProfileFingerprint:r.targetProfileFingerprint}));
          NODE

      - name: Static no-write and no-Firestore-HR gate
        run: |
          set -euo pipefail
          node --check "$TOOL_FILE"
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.TOOL_FILE,'utf8');
          const forbidden=[/admin\.firestore\s*\(/,/\.collection\s*\(/,/await\s+auth\.(createUser|updateUser|deleteUser|setCustomUserClaims|importUsers)\s*\(/,/firebase\s+deploy/i,/gcloud\s+/i,/cloud\s+run/i];
          for(const re of forbidden)if(re.test(s))throw new Error('FORBIDDEN_SOURCE_PATTERN:'+re);
          for(const required of ['TARGET_PROFILE_FP','auth.listUsers(1000)','passwordHashAvailable','passwordSaltState','fetchHashConfig','AES-256-GCM','exactRollbackReconstructible','providerWrites:0','authWrites:0','firestoreReads:0','hrReads:0'])if(!s.includes(required))throw new Error('MISSING_GUARD:'+required);
          console.log('PASS_C6_ONE_TARGET_ROLLBACK_STATIC_READONLY');
          NODE

      - name: Download frozen source-safe plan artifact from GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          gh run download 31104541809 -n cxorbia-c6-equivalent-universe-provider-v22-31104541809 -D "$SOURCE_DIR"
          test -f "$SOURCE_DIR/plan-340-source-safe.json"

      - name: Load canonical DEV credential without logging values
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-one-target-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-one-target-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-one-target-private/credentials.json" >> "$GITHUB_ENV"

      - name: Install pinned Auth SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Execute one-target provider read-only snapshot
        id: assess
        run: |
          set +e
          CXORBIA_SOURCE_PLAN="$SOURCE_DIR/plan-340-source-safe.json" CXORBIA_ONE_TARGET_ROLLBACK_OUT="$EXPORT_DIR" node "$TOOL_FILE" "$REQUEST_FILE"
          code=$?
          decision=$(head -n 1 "$EXPORT_DIR/decision.txt" 2>/dev/null || echo STOP_RETRY_C6_AUTH_ONE_TARGET_PASSWORD_ROLLBACK_SNAPSHOT_READONLY_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$code" != '0' ] && [ "$code" != '2' ]; then exit "$code"; fi
          exit 0

      - name: Verify source-safe evidence and zero writes
        run: |
          set -euo pipefail
          node <<'NODE'
          const e=require('./.tmp/c6-auth-one-target-password-rollback/export/evidence-source-safe.json');
          if(e.target?.profileFingerprint!=='ac93d90d9e41512acdcd')throw new Error('TARGET_DRIFT');
          if(e.safety?.providerWrites!==0||e.safety?.authWrites!==0||e.safety?.firestoreReads!==0||e.safety?.firestoreWrites!==0||e.safety?.hrReads!==0||e.safety?.hrWrites!==0)throw new Error('SAFETY_DRIFT');
          if(e.providerRead?.totalProviderReadCalls>2)throw new Error('PROVIDER_READ_BUDGET_EXCEEDED');
          const raw=JSON.stringify(e);
          if(raw.includes('@auth.cxorbia.invalid'))throw new Error('EMAIL_LEAK');
          if(/"uid"\s*:/.test(raw))throw new Error('UID_LEAK');
          if(/passwordHashBase64|passwordSaltBase64/.test(raw))throw new Error('HASH_OR_SALT_LEAK');
          console.log(JSON.stringify({decision:e.decision,targetRecordsRetained:e.providerRead?.targetRecordsRetained||0,passwordHashAvailable:e.passwordState?.passwordHashAvailable||false,passwordSaltState:e.passwordState?.passwordSaltState||'UNKNOWN',algorithm:e.passwordState?.algorithm||'UNKNOWN',exactRollbackReconstructible:e.restoration?.exactRollbackReconstructible||false,providerWrites:0,authWrites:0,firestoreReads:0,hrReads:0}));
          NODE

      - name: Upload encrypted snapshot and source-safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-one-target-password-rollback-snapshot-readonly-${{ github.run_id }}
          path: .tmp/c6-auth-one-target-password-rollback/export
          if-no-files-found: error
          retention-days: 14

      - name: Publish observable decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.assess.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          DESC="${DECISION:-STOP_RETRY_C6_AUTH_ONE_TARGET_PASSWORD_ROLLBACK_SNAPSHOT_READONLY_NO_DECISION}"
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; fi
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-one-target-password-rollback-snapshot-readonly' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/c6-auth-one-target-private
