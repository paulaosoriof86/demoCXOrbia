name: CXOrbia Corte 4 Verify New Empty Firebase DEV

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/workflows/cxorbia-corte4-verify-new-empty-firebase-dev.yml'
      - '.github/cxorbia-firebase-requests/corte4-verify-new-empty.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: cxorbia-corte4-verify-new-empty-firebase-dev
  cancel-in-progress: true

env:
  CXORBIA_NEW_PROJECT_ID: cxorbia-tya-dev-260729-c4
  CXORBIA_NEW_PROJECT_NAME: CXOrbia TyA DEV Clean Corte 4
  CXORBIA_MIN_CREATE_TIME: '2026-07-29T03:45:00Z'
  CXORBIA_PROVIDER_REQUEST_TIMEOUT_MS: '8000'
  CXORBIA_REQUEST_PATH: .github/cxorbia-firebase-requests/corte4-verify-new-empty.json

jobs:
  verify-new-empty-dev-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact read-only verification request
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p=process.env.CXORBIA_REQUEST_PATH;
          if(!fs.existsSync(p)) throw new Error('Corte 4 verification request missing.');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const exact={
            schemaVersion:'cxorbia.firebase-new-empty-verify-request.v1',
            enabled:true,
            mode:'VERIFY_ONLY',
            repository:'paulaosoriof86/demoCXOrbia',
            branch:'docs-tya-v6-v71-audit',
            pullRequest:7,
            targetProjectId:process.env.CXORBIA_NEW_PROJECT_ID,
            targetDisplayName:process.env.CXORBIA_NEW_PROJECT_NAME,
            production:false,
            providerWrites:false,
            reuseExistingProject:false,
            connectLegacyDatabase:false,
            copyLegacyDatabase:false
          };
          for(const [key,value] of Object.entries(exact)){
            if(r[key]!==value) throw new Error(`Request mismatch: ${key}`);
          }
          console.log('Exact read-only verification request validated.');
          NODE

      - name: Publish verification start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='pending' \
            -f context='cxorbia/corte4-verify-new-empty-firebase' \
            -f description='Read-only Firebase identity and empty-state verification running' >/dev/null

      - name: Select first structurally valid read credential without exposing it
        continue-on-error: true
        env:
          DEDICATED_CREATOR_JSON: ${{ secrets.CXORBIA_GCP_PROJECT_CREATOR_JSON }}
          ALT_CREATOR_JSON: ${{ secrets.GOOGLE_CLOUD_PROJECT_CREATOR_JSON }}
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte4-private .tmp/corte4-verify
          node <<'NODE'
          const fs=require('fs');
          const candidates=[
            ['dedicated_project_creator',process.env.DEDICATED_CREATOR_JSON||''],
            ['alternate_project_creator',process.env.ALT_CREATOR_JSON||''],
            ['existing_dev_service_account',process.env.EXISTING_DEV_JSON||'']
          ];
          const inspected=[];
          let selected=null;
          for(const [route,raw] of candidates){
            if(!raw){inspected.push({route,present:false,shapeValid:false});continue;}
            let parsed=null;
            try{parsed=JSON.parse(raw);}catch{}
            const shapeValid=Boolean(parsed&&parsed.type==='service_account'&&parsed.project_id&&parsed.client_email&&parsed.private_key&&parsed.token_uri);
            inspected.push({route,present:true,shapeValid});
            if(!selected&&shapeValid) selected={route,raw};
          }
          const report={
            route:selected?.route||'none',
            credentialAvailable:Boolean(selected),
            credentialShapeValid:Boolean(selected),
            presentCandidateCount:inspected.filter(x=>x.present).length,
            invalidPresentCandidateCount:inspected.filter(x=>x.present&&!x.shapeValid).length,
            inspected,
            secretValuesOutput:false
          };
          fs.writeFileSync('.tmp/corte4-verify/credential-route.source-safe.json',JSON.stringify(report,null,2)+'\n');
          if(selected) fs.writeFileSync('.tmp/corte4-private/credentials.json',selected.raw,{mode:0o600});
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Run bounded native provider reads
        if: always()
        continue-on-error: true
        env:
          CXORBIA_CONFIRM: VERIFY_NEW_EMPTY_FIREBASE_DEV_READ_ONLY
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.tmp/corte4-private/credentials.json
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte4-verify
          fallback(){
            DECISION="$1" node -e "const fs=require('fs');const r={decision:process.env.DECISION,target:{projectId:process.env.CXORBIA_NEW_PROJECT_ID},summary:{newIdentityConfirmed:false,emptyBaselineVerified:false,unavailableMandatoryCount:1,nonEmptySignalCount:0},safeState:{providerReads:false,providerWrites:false,production:false}};fs.writeFileSync('.tmp/corte4-verify/corte4-new-empty-firebase-verification.source-safe.json',JSON.stringify(r,null,2)+'\\n');"
          }
          if [ ! -s "$GOOGLE_APPLICATION_CREDENTIALS" ]; then fallback BLOCKED_NO_VALID_READ_CREDENTIAL_AVAILABLE; exit 0; fi
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            node tools/release/cxorbia-verify-new-empty-firebase-dev-corte4.mjs --out .tmp/corte4-verify
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            fallback BLOCKED_READONLY_VERIFICATION_PROCESS_TIMEOUT
          elif [ "$code" -ne 0 ] && [ ! -f .tmp/corte4-verify/corte4-new-empty-firebase-verification.source-safe.json ]; then
            fallback BLOCKED_READONLY_VERIFICATION_PROCESS_FAILED
          fi

      - name: Publish sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte4-verify
          report='.tmp/corte4-verify/corte4-new-empty-firebase-verification.source-safe.json'
          route_report='.tmp/corte4-verify/credential-route.source-safe.json'
          if [ ! -f "$report" ]; then
            node -e "const fs=require('fs');const r={decision:'BLOCKED_WORKFLOW_PRECONDITION',target:{projectId:process.env.CXORBIA_NEW_PROJECT_ID},summary:{newIdentityConfirmed:false,emptyBaselineVerified:false,unavailableMandatoryCount:1,nonEmptySignalCount:0},safeState:{providerReads:false,providerWrites:false,production:false}};fs.writeFileSync('.tmp/corte4-verify/corte4-new-empty-firebase-verification.source-safe.json',JSON.stringify(r,null,2)+'\\n');"
          fi
          node - "$report" "$route_report" <<'NODE' > .tmp/corte4-verify/status.env
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const route=fs.existsSync(process.argv[3])?JSON.parse(fs.readFileSync(process.argv[3],'utf8')):{route:'unknown'};
          const pass=r.decision==='NEW_EMPTY_FIREBASE_DEV_VERIFIED_C4';
          const s=r.summary||{};
          const safeRoute=String(route.route||'unknown').replace(/[^a-z0-9_-]/gi,'_').slice(0,36);
          const safeDecision=String(r.decision||'UNKNOWN').replace(/[^A-Z0-9_.-]/gi,'_').slice(0,48);
          const num=v=>Number.isFinite(Number(v))?String(Number(v)):'x';
          const unavailable=Object.entries(r.checks||{}).filter(([,v])=>v&&v.available===false);
          const firstUnavailable=unavailable.length?String(unavailable[0][0]).replace(/[^a-z0-9_-]/gi,'_').slice(0,18):'none';
          const firstError=unavailable.length?String(unavailable[0][1]?.errorCategory||'unknown').replace(/[^a-z0-9_-]/gi,'_').slice(0,18):'none';
          const diagContext=[
            'cxorbia/c4diag',
            `id${s.newIdentityConfirmed?1:0}`,
            `e${s.emptyBaselineVerified?1:0}`,
            `u${num(s.unavailableMandatoryCount)}`,
            `n${num(s.nonEmptySignalCount)}`,
            `a${num(s.appCount)}`,
            `au${num(s.authUserCount)}`,
            `f${num(s.firestoreDatabaseCount)}`,
            `s${num(s.storageBucketCount)}`,
            `h${num(s.hostingSiteCount)}`,
            `x${firstUnavailable}`,
            `r${firstError}`
          ].join('-').slice(0,100);
          console.log([
            `STATE=${pass?'success':'error'}`,
            `DECISION=${safeDecision}`,
            `ROUTE=${safeRoute}`,
            `DESCRIPTION=${pass?'New-empty-Firebase-DEV-verified':'Firebase-identity-or-empty-state-verification-blocked'}`,
            `EMPTY=${Boolean(s.emptyBaselineVerified)}`,
            `NEW_IDENTITY=${Boolean(s.newIdentityConfirmed)}`,
            `UNAVAILABLE=${num(s.unavailableMandatoryCount)}`,
            `NONEMPTY=${num(s.nonEmptySignalCount)}`,
            `APPS=${num(s.appCount)}`,
            `AUTH=${num(s.authUserCount)}`,
            `FIRESTORE=${num(s.firestoreDatabaseCount)}`,
            `STORAGE=${num(s.storageBucketCount)}`,
            `HOSTING=${num(s.hostingSiteCount)}`,
            `FIRST_UNAVAILABLE=${firstUnavailable}`,
            `FIRST_ERROR=${firstError}`,
            `CONTEXT=${diagContext}`
          ].join('\n'));
          NODE
          source .tmp/corte4-verify/status.env
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f description="$DESCRIPTION" >/dev/null
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='cxorbia/corte4-verify-new-empty-firebase' \
            -f description="$DESCRIPTION" >/dev/null
          body=$(cat <<EOF
          ## Corte 4 · verificación read-only de Firebase DEV

          - Decision: \`$DECISION\`
          - Ruta de credencial: \`$ROUTE\`
          - Nueva identidad confirmada: \`$NEW_IDENTITY\`
          - Vacío verificado: \`$EMPTY\`
          - Checks no disponibles: \`$UNAVAILABLE\`
          - Señales no vacías: \`$NONEMPTY\`
          - Apps: \`$APPS\`
          - Auth users: \`$AUTH\`
          - Firestore databases: \`$FIRESTORE\`
          - Storage buckets: \`$STORAGE\`
          - Hosting sites: \`$HOSTING\`
          - Primer check no disponible: \`$FIRST_UNAVAILABLE\`
          - Categoría: \`$FIRST_ERROR\`
          - Provider writes: \`0\`
          - Base existente reutilizada: \`false\`
          - Producción: \`false\`
          EOF
          )
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/corte4-private

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-corte4-verify-new-empty-firebase-dev
          path: .tmp/corte4-verify
          if-no-files-found: error
          retention-days: 14
