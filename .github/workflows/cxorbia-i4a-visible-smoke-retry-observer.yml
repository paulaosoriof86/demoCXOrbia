name: CXOrbia I4A Visible Smoke Retry Observer

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - .github/workflows/cxorbia-i4a-visible-smoke-retry-observer.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: cxorbia-i4a-visible-smoke-retry-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: fd79f36ea15a18d1953c628ca857e3d79f58600f
      EVIDENCE_PATH: app/docs/evidence/I4A-VISIBLE-SMOKE-RETRY-RUNTIME-OBSERVED.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 5

      - name: Wait for exact smoke retry run
        id: wait
        run: |
          set -euo pipefail
          run_id=''
          for i in $(seq 1 72); do
            run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100" --jq '.workflow_runs[] | select(.name == "CXOrbia I4A Visible Shopper Lifecycle Smoke Retry Stabilized") | .id' | head -n1 || true)
            if [ -n "$run_id" ]; then
              status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
              echo "found run ${run_id} status ${status}"
              if [ "$status" = "completed" ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
          test "$status" = "completed"
          conclusion=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Download exact sanitized artifact
        run: |
          set -euo pipefail
          mkdir -p .tmp/i4a-observer
          gh run download "${{ steps.wait.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" -n "i4a-visible-shopper-lifecycle-smoke-retry-${{ steps.wait.outputs.run_id }}" -D .tmp/i4a-observer
          result=$(find .tmp/i4a-observer -name result.json -type f | head -n1)
          test -n "$result"
          node - "$result" <<'NODE'
          const fs=require('fs');const p=process.argv[2],x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.schemaVersion!=='cxorbia.i4a.visible-shopper-lifecycle-smoke-retry.evidence.v1')throw new Error('unexpected_schema');
          const text=JSON.stringify(x);if(/"password"|credentialValues|@auth\.cxorbia\.invalid|cxorbia\.i4a\.[a-f0-9]+/i.test(text))throw new Error('sanitization_guard_failed');
          fs.mkdirSync('app/docs/evidence',{recursive:true});fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(x,null,2)+'\n','utf8');
          console.log(JSON.stringify({decision:x.decision,failurePhase:x.failurePhase||null,run:x.workflowRunId,checkpoints:x.checkpoints,surfaces:x.surfaces},null,2));
          NODE

      - name: Commit observed sanitized result once
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(i4a): observe stabilized visible smoke retry"
          git push origin HEAD:docs-tya-v6-v71-audit
