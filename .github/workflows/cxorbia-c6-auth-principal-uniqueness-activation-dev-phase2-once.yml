name: CXOrbia C6 Auth Principal Uniqueness Activation DEV Phase2 Once

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'backend/config/c6-auth-principal-uniqueness-activation-dev-phase2-request-v1.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-principal-uniqueness-activation-dev-phase2-once
  cancel-in-progress: false

jobs:
  phase2-prewrite-and-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REQUEST_FILE: backend/config/c6-auth-principal-uniqueness-activation-dev-phase2-request-v1.json
      CONTRACT_FILE: backend/contracts/c6-auth-activation-dev-v2.json
      ACTIVATION_TOOL: tools/qa/cxorbia-c6-auth-activation-dev-v2.mjs
      SOURCE_DIR: .tmp/c6-auth-principal-phase2/source
      ACTIVATION_OUT: .tmp/c6-auth-principal-phase2/activation
    steps:
      - name: Checkout exact phase2 request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate phase1 PASS and exact phase2 authorization
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(r.schemaVersion==='cxorbia.c6.auth-principal-uniqueness-rootfix-activation-dev.request.v1','REQUEST_SCHEMA');
          ok(r.requestId==='c6-auth-principal-uniqueness-activation-dev-phase2-20260807-01','REQUEST_ID');
          ok(r.enabled===true&&r.consumed===false&&r.status==='authorized_execute_once_after_source_phase_pass'&&r.allowedExecutions===1&&r.authorizedBy==='Paula','REQUEST_AUTH');
          ok(r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&r.pullRequest===7&&r.firebaseProjectId==='cxorbia-backend-dev','LANE');
          ok(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_ONLY_COMMIT');
          ok(r.contract===process.env.CONTRACT_FILE,'CONTRACT');
          ok(r.phase1Pass?.runId===31234681163&&r.phase1Pass?.jobId===93044913507&&r.phase1Pass?.artifactId===9014970238&&r.phase1Pass?.artifactDigest==='sha256:3a91b60612b67198b1109eaae53deb66720d1614d673e361cc657822f9317395','PHASE1_EVIDENCE');
          ok(r.phase1Pass?.planDigest==='7b92fa73946e74ec4058bcdcbcfca25fe90e0504db6b6b22e797fbad066bd749','PHASE1_DIGEST');
          ok(r.phase2?.providerAttemptsMax===1&&r.phase2?.secondProviderAttempt===false&&r.phase2?.writesOnlyAfterPrewritePass===true,'PHASE2_POLICY');
          console.log('PASS_C6_AUTH_PHASE2_REQUEST_GATE');
          NODE

      - name: Download phase1 canonical plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR" "$ACTIVATION_OUT"
          gh run download 31234681163 -n cxorbia-c6-auth-rootfix-digest-canonicalization-source-only-v2-31234681163 -D "$SOURCE_DIR"
          test -f "$SOURCE_DIR/final-plan-v3-source-safe.json"
          test -f "$SOURCE_DIR/source-phase-evidence.json"
          node <<'NODE'
          const p=require('./.tmp/c6-auth-principal-phase2/source/final-plan-v3-source-safe.json');const e=require('./.tmp/c6-auth-principal-phase2/source/source-phase-evidence.json');
          if(e.decision!=='PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SOURCE_ONLY')throw new Error('SOURCE_PHASE_NOT_PASS');
          if(p.plan?.sourceSafeRowsDigestSha256!=='7b92fa73946e74ec4058bcdcbcfca25fe90e0504db6b6b22e797fbad066bd749')throw new Error('SOURCE_PLAN_DIGEST');
          if(p.plan?.rows!==340||p.plan?.uniqueRows!==340||p.plan?.operationCounts?.CREATE_AUTH!==82||p.plan?.operationCounts?.UPDATE_AUTH!==45||p.plan?.operationCounts?.HOLD!==0||p.plan?.subchangeCounts?.password!==13||p.plan?.expectedAuthUsersAfter!==192)throw new Error('SOURCE_PLAN_INVARIANT');
          console.log('PASS_C6_AUTH_PHASE2_SOURCE_ARTIFACT_GATE');
          NODE

      - name: Install pinned Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Activation v2 static no-loop gate
        run: |
          set -euo pipefail
          node --check "$ACTIVATION_TOOL"
          node "$ACTIVATION_TOOL" --self-test | tee /tmp/activation-selftest.txt
          grep -q 'PASS_C6_AUTH_ACTIVATION_V2_SELFTEST' /tmp/activation-selftest.txt
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.ACTIVATION_TOOL,'utf8');
          for(const x of ['gatherCandidatesTargetSpecific','assertPrincipalOwner','GLOBAL_PRINCIPAL_UID_ALIAS','GLOBAL_PRINCIPAL_CANDIDATE_ALIAS','LEGACY_SHA256_ROUNDS1_SALTLESS_EXACT','PROVIDER_HASH_CONFIG_EXACT','rollback-snapshot-prewrite.enc.json','state.writeBoundaryEntered=true'])if(!s.includes(x))throw new Error('MISSING_GUARD:'+x);
          const snapshot=s.indexOf('rollback-snapshot-prewrite.enc.json');const pre=s.indexOf("sourceSafe.prewrite={pass:true");const boundary=s.indexOf('state.writeBoundaryEntered=true');
          if(snapshot<0||pre<0||boundary<0||!(snapshot<pre&&pre<boundary))throw new Error('WRITE_BOUNDARY_ORDER');
          console.log('PASS_C6_AUTH_PHASE2_STATIC_NO_LOOP_GATE');
          NODE

      - name: Load canonical DEV credential privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-auth-principal-phase2-private
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('DEV_CREDENTIAL_INVALID');
          fs.writeFileSync('.tmp/c6-auth-principal-phase2-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-auth-principal-phase2-private/credentials.json" >> "$GITHUB_ENV"

      - name: Execute single PREWRITE and Auth Activation DEV
        id: activate
        run: |
          set +e
          CXORBIA_FINAL_PLAN_V3="$SOURCE_DIR/final-plan-v3-source-safe.json" \
          CXORBIA_AUTH_ACTIVATION_V2_EXPORT_DIR="$ACTIVATION_OUT" \
          node "$ACTIVATION_TOOL" "$REQUEST_FILE"
          code=$?
          decision=$(head -n 1 "$ACTIVATION_OUT/decision.txt" 2>/dev/null || echo STOP_RETRY_C6_AUTH_ACTIVATION_DEV_V2_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$code" != '0' ] && [ "$code" != '2' ]; then exit "$code"; fi
          exit 0

      - name: Verify terminal evidence and safety
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const e=require('./.tmp/c6-auth-principal-phase2/activation/report-source-safe.json');
          if(e.safety?.firestoreWrites!==0||e.safety?.membershipWrites!==0||e.safety?.hrWrites!==0||e.safety?.rulesWrites!==0||e.safety?.storageWrites!==0||e.safety?.cloudBuilds!==0||e.safety?.cloudRunDeploys!==0||e.safety?.hostingDeploys!==0||e.safety?.merge!==false||e.safety?.production!==false)throw new Error('SAFETY_DRIFT');
          const raw=JSON.stringify(e);if(raw.includes('@auth.cxorbia.invalid')||/"uid"\s*:/.test(raw)||/passwordHash|passwordSalt|"email"\s*:|"shopperId"\s*:/.test(raw))throw new Error('SOURCE_SAFE_LEAK');
          if(e.decision==='PASS_C6_AUTH_ACTIVATION_DEV_V2'){
            if(!e.prewrite?.pass||!e.readback?.pass||!e.rollbackDryRun?.pass)throw new Error('PASS_GATES');
            if(e.safety?.authCreates!==82||e.safety?.authUpdates!==45||e.safety?.duplicateDisables!==1||e.readback?.authUsersAfter!==192||e.rollbackDryRun?.passwordHashRestoreEntries!==13)throw new Error('PASS_COUNTS');
          }
          if(e.safety?.writeBoundaryEntered===false&&(e.safety?.authCreates!==0||e.safety?.authUpdates!==0||e.safety?.duplicateDisables!==0||e.safety?.providerWriteCalls!==0))throw new Error('PREWRITE_STOP_WITH_WRITES');
          console.log(JSON.stringify({decision:e.decision,prewritePass:Boolean(e.prewrite?.pass),writeBoundaryEntered:Boolean(e.safety?.writeBoundaryEntered),authCreates:e.safety?.authCreates||0,authUpdates:e.safety?.authUpdates||0,duplicateDisables:e.safety?.duplicateDisables||0,providerWriteCalls:e.safety?.providerWriteCalls||0,readbackPass:Boolean(e.readback?.pass),rollbackDryRunPass:Boolean(e.rollbackDryRun?.pass),authUsersAfter:e.readback?.authUsersAfter||null}));
          NODE

      - name: Upload terminal activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-principal-uniqueness-activation-dev-phase2-${{ github.run_id }}
          path: .tmp/c6-auth-principal-phase2/activation
          if-no-files-found: error
          retention-days: 14

      - name: Publish observable terminal decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.activate.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          DESC=$(printf '%s' "${DECISION:-STOP_RETRY_C6_AUTH_ACTIVATION_DEV_V2_NO_DECISION}" | cut -c1-140)
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-principal-uniqueness-activation-dev-phase2' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/c6-auth-principal-phase2-private
