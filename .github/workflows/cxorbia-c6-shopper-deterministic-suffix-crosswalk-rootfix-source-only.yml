name: CXOrbia C6 Shopper Deterministic Suffix Crosswalk Root Fix Source Only

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - backend/config/corte6-shopper-deterministic-suffix-crosswalk-rootfix-source-only-request.json

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-c6-shopper-deterministic-suffix-crosswalk-rootfix-source-only
  cancel-in-progress: false

jobs:
  source-only-rootfix:
    runs-on: ubuntu-24.04
    env:
      REQUEST_FILE: backend/config/corte6-shopper-deterministic-suffix-crosswalk-rootfix-source-only-request.json
      TARGET_FILE: tools/qa/cxorbia-c6-shopper-deterministic-suffix-readonly.mjs
      PATCHER_FILE: tools/qa/cxorbia-c6-shopper-deterministic-suffix-crosswalk-rootfix-source-only.mjs
      EVIDENCE_FILE: app/docs/evidence/CORTE6-SHOPPER-DETERMINISTIC-SUFFIX-CROSSWALK-ROOTFIX-SOURCE-STATIC-PASS-LATEST.json
    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read request state
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${request.enabled === true ? 'true' : 'false'}\n`);
          NODE

      - name: Publish skipped consumed status
        if: steps.request.outputs.enabled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='success' \
            -f context='cxorbia/c6-shopper-crosswalk-rootfix-source-only/overall' \
            -f description='SKIPPED_CONSUMED_SOURCE_ONLY_REQUEST' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Validate exact one-shot source-only authorization
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const parent = execFileSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' }).trim();
          const changed = execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          const ensure = (condition, code) => { if (!condition) throw new Error(code); };
          ensure(request.schemaVersion === 'cxorbia.c6.shopper-deterministic-suffix-crosswalk-rootfix-source-only-request.v1', 'request_schema_invalid');
          ensure(request.repository === 'paulaosoriof86/demoCXOrbia' && request.branch === 'docs-tya-v6-v71-audit' && Number(request.pullRequest) === 7, 'lane_invalid');
          ensure(request.enabled === true && request.consumed === false && request.status === 'authorized_execute_once', 'authorization_state_invalid');
          ensure(request.authorizedBy === 'Paula' && Number(request.allowedExecutions) === 1, 'authorization_invalid');
          ensure(request.targetHeadSha === parent && head !== parent, 'target_head_invalid');
          ensure(changed.length === 1 && changed[0] === process.env.REQUEST_FILE, 'request_commit_scope_invalid:' + changed.join(','));
          ensure(request.mode === 'source_only_crosswalk_rootfix' && request.providerReads === false && request.providerWrites === false, 'source_only_scope_invalid');
          ensure(request.expectedStableCredentialsMapped === 101 && request.expectedStableCredentialsUnmapped === 8, 'stable_crosswalk_reference_invalid');
          ensure(request.expectedPlanRows === 340 && JSON.stringify(request.suffixLengths) === JSON.stringify([4,6,8]), 'plan_or_suffix_contract_invalid');
          for (const key of ['dataWrites','deploy','merge','production','firestoreWrites','authWrites','passwordChanges','passwordResets','membershipWrites','rulesWrites','storageWrites','hrWrites','make','gemini','payments']) {
            ensure(request.safeState?.[key] === false, 'unsafe_' + key);
          }
          NODE

      - name: Apply exact source root fix
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node "$PATCHER_FILE" --apply

      - name: Execute source and static gates
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET_FILE"
          node --check "$PATCHER_FILE"
          node "$PATCHER_FILE" --verify
          node "$TARGET_FILE" --self-test
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync(process.env.TARGET_FILE, 'utf8');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const required = [
            'const STABLE_CREDENTIALS_MAPPED = 101;',
            'const STABLE_CREDENTIALS_UNMAPPED = 8;',
            'propagateLinkedSourceTechKeys(relationIndex, source, shopperId);',
            'const credentialCrosswalkParity =',
            'credentialCrosswalkParity &&',
            'credential_crosswalk_drift:',
            'PASS_CREDENTIAL_CROSSWALK_TECH_KEY_PROPAGATION',
            'PASS_CREDENTIAL_CROSSWALK_PARITY_HARD_STOP'
          ];
          const missing = required.filter(token => !source.includes(token));
          if (missing.length) throw new Error('static_gate_missing:' + missing.join('|'));
          if (request.providerReads !== false || request.providerWrites !== false) throw new Error('provider_scope_changed');
          if (!source.includes('planRows.push({') || !source.includes("suffixLength: row.suffixLength")) throw new Error('plan_or_suffix_schema_missing');
          NODE

      - name: Materialize sanitized source-static evidence and consume request
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const source = fs.readFileSync(process.env.TARGET_FILE, 'utf8');
          const generatedAt = new Date().toISOString();
          const evidence = {
            schemaVersion: 'cxorbia.c6.shopper-deterministic-suffix-crosswalk-rootfix-source-static.v1',
            generatedAt,
            decision: 'PASS_C6_DETERMINISTIC_SUFFIX_CROSSWALK_ROOTFIX_SOURCE_STATIC',
            repository: request.repository,
            branch: request.branch,
            pullRequest: request.pullRequest,
            requestId: request.requestId,
            requestCommitSha: process.env.GITHUB_SHA,
            targetHeadSha: request.targetHeadSha,
            sourceSha256: crypto.createHash('sha256').update(source, 'utf8').digest('hex'),
            rootFix: {
              linkedSourceTechKeysPropagated: true,
              linkedSourceBasisPreserved: true,
              stableCredentialsMapped: 101,
              stableCredentialsUnmapped: 8,
              credentialDriftHardStop: true,
              readyRequiresCrosswalkParity: true,
              expectedPlanRows: 340,
              suffixLengths: [4,6,8]
            },
            checks: [
              'PASS_NODE_SYNTAX',
              'PASS_LINKED_SOURCE_TECH_KEYS_PROPAGATED',
              'PASS_LINKED_SOURCE_BASIS_PRESERVED',
              'PASS_CREDENTIAL_CROSSWALK_FIXTURE',
              'PASS_STABLE_CREDENTIAL_REFERENCE_101_8',
              'PASS_CREDENTIAL_DRIFT_HARD_STOP',
              'PASS_READY_REQUIRES_CROSSWALK_PARITY',
              'PASS_PLAN_340_SCHEMA_PRESERVED',
              'PASS_SUFFIX_POLICY_4_6_8_PRESERVED',
              'PASS_PROVIDER_READS_ZERO'
            ],
            safety: {
              providerReads: 0,
              providerWrites: 0,
              authWrites: 0,
              passwordChanges: 0,
              passwordResets: 0,
              membershipWrites: 0,
              firestoreWrites: 0,
              rulesWrites: 0,
              storageWrites: 0,
              hrWrites: 0,
              hostingDeploys: 0,
              cloudRunDeploys: 0,
              makeCalls: 0,
              geminiCalls: 0,
              paymentWrites: 0,
              merge: false,
              production: false
            },
            nextGate: 'NEW_EXPLICIT_PROVIDER_READONLY_AUTHORIZATION_REQUIRED'
          };
          fs.mkdirSync(require('path').dirname(process.env.EVIDENCE_FILE), { recursive: true });
          fs.writeFileSync(process.env.EVIDENCE_FILE, JSON.stringify(evidence, null, 2) + '\n', 'utf8');
          request.enabled = false;
          request.consumed = true;
          request.status = 'consumed_source_static_pass_no_provider_read';
          request.consumedAt = generatedAt;
          request.result = {
            decision: evidence.decision,
            providerReads: 0,
            providerWrites: 0,
            evidence: process.env.EVIDENCE_FILE
          };
          fs.writeFileSync(process.env.REQUEST_FILE, JSON.stringify(request, null, 2) + '\n', 'utf8');
          const status = execFileSync('git', ['status', '--porcelain=v1'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          const allowed = new Set([process.env.TARGET_FILE, process.env.REQUEST_FILE, process.env.EVIDENCE_FILE]);
          for (const line of status) {
            const file = line.slice(3).trim();
            if (!allowed.has(file)) throw new Error('unexpected_repository_delta:' + file);
          }
          NODE

      - name: Commit source-only root fix directly on live branch
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILE" "$REQUEST_FILE" "$EVIDENCE_FILE"
          git diff --cached --check
          git commit -m 'fix(c6): restore deterministic suffix credential crosswalk parity gate'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish source-static PASS
        if: steps.request.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='success' \
            -f context='cxorbia/c6-shopper-crosswalk-rootfix-source-only/overall' \
            -f description='PASS_C6_CROSSWALK_ROOTFIX_SOURCE_ONLY_NO_PROVIDER_READ' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
