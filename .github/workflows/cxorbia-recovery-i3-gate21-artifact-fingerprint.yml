name: CXOrbia Recovery I3 Gate 21 Artifact Fingerprint

on:
  workflow_call:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: cxorbia-recovery-i3-gate21-artifact-fingerprint-${{ github.run_id }}
  cancel-in-progress: false

env:
  CERTIFICATION_ARTIFACT_NAME: cxorbia-recovery-i3-single-source-certification-${{ github.run_id }}
  OUT_DIR: .gate21

jobs:
  gate21-same-artifact-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Recovery control head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact certification artifact from this same workflow run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CERTIFICATION_ARTIFACT_NAME }}
          path: .gate21/certification

      - name: Resolve release identity only from same-run certification manifest
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT_DIR"
          CERT="$OUT_DIR/certification"
          test -f "$CERT/i3-certification-manifest.json"
          test -f "$CERT/result.json"
          cmp --silent "$CERT/i3-certification-manifest.json" "$CERT/result.json"

          SOURCE_SHA="$(jq -r '.i3CertificationSourceSha // empty' "$CERT/result.json")"
          SOURCE_TREE="$(jq -r '.i3CertificationSourceTree // empty' "$CERT/result.json")"
          CONTROL_HEAD="$(jq -r '.controlHeadSha // empty' "$CERT/result.json")"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROL_HEAD" = "$(git rev-parse HEAD)"

          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --quiet "$SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc tools/hr-source ':(exclude)backend/runtime/hr-live-service/test/**'

          printf '%s\n' "$SOURCE_SHA" > "$OUT_DIR/source-sha.txt"
          printf '%s\n' "$SOURCE_TREE" > "$OUT_DIR/source-tree-sha.txt"
          echo "I3_CERTIFICATION_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "I3_CERTIFICATION_SOURCE_TREE=$SOURCE_TREE" >> "$GITHUB_ENV"

          jq -n -S --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE" --arg control "$CONTROL_HEAD" --arg artifact "$CERTIFICATION_ARTIFACT_NAME"             '{decision:"PASS_GATE21_MANIFEST_DERIVED_RELEASE_IDENTITY",sourceSha:$source,sourceTree:$tree,controlHeadSha:$control,artifactName:$artifact,independentSourceAuthority:false,production:false}'             > "$OUT_DIR/release-identity-handoff.json"

      - name: Verify immutable certification artifact and Gate 20 binding
        run: |
          set -Eeuo pipefail
          CERT="$OUT_DIR/certification"
          test -f "$CERT/i3-certification-manifest.json"
          test -f "$CERT/result.json"
          test -f "$CERT/cxorbia-i3-certified-source.tar"
          test -f "$CERT/cxorbia-i3-certified-source.tar.sha256"
          test -f "$CERT/gate20/gate20-browser-visual.json"
          test -f "$CERT/gate20-semantic-shopper.json"
          test -f "$CERT/full-human-acceptance/human-live-acceptance.json"
          test -f "$CERT/full-human-acceptance/i3-functional-probes.json"
          test -f "$CERT/canonical-route-inventory.json"

          cmp --silent "$CERT/i3-certification-manifest.json" "$CERT/result.json"
          test "$(jq -r '.decision' "$CERT/result.json")" = "PASS_I3_ONE_ARTIFACT_READY_FOR_GATE21"
          test "$(jq -r '.i3CertificationSourceSha' "$CERT/result.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.i3CertificationSourceTree' "$CERT/result.json")" = "$I3_CERTIFICATION_SOURCE_TREE"
          test "$(jq -r '.buildCount' "$CERT/result.json")" = "1"
          test "$(jq -r '.rebuildAfterCertification' "$CERT/result.json")" = "false"
          test "$(jq -r '.production' "$CERT/result.json")" = "false"
          test -f "$CERT/module-truth-matrix.json"
          test "$(jq -r '.moduleTruth.phaseAComplete' "$CERT/result.json")" = "true"
          test "$(jq -r '.moduleTruth.allModulesMatch' "$CERT/result.json")" = "true"
          test "$(jq '[.moduleTruth.modules[] | select(.classification != "MATCH")] | length' "$CERT/result.json")" = "0"
          EXPECTED_MODULE_TRUTH_SHA="$(jq -r '.moduleTruthEvidenceSha256 // empty' "$CERT/result.json")"
          ACTUAL_MODULE_TRUTH_SHA="$(sha256sum "$CERT/module-truth-matrix.json" | awk '{print $1}')"
          test -n "$EXPECTED_MODULE_TRUTH_SHA"
          test "$EXPECTED_MODULE_TRUTH_SHA" = "$ACTUAL_MODULE_TRUTH_SHA"
          test "$(jq -r '.productSource.sha' "$CERT/module-truth-matrix.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.productSource.treeSha' "$CERT/module-truth-matrix.json")" = "$I3_CERTIFICATION_SOURCE_TREE"
          test "$(jq -r '.gate20.decision' "$CERT/result.json")" = "PASS_GATE20_FOCAL_VISUAL_DRIFT"
          test "$(jq -r '.gate20.sourceSha' "$CERT/result.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.decision' "$CERT/gate20/gate20-browser-visual.json")" = "PASS_GATE20_FOCAL_VISUAL_DRIFT"
          test "$(jq -r '.sourceSha' "$CERT/gate20/gate20-browser-visual.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.gate20Semantic.decision' "$CERT/result.json")" = "PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY"
          test "$(jq -r '.gate20Semantic.sourceSha' "$CERT/result.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          test "$(jq -r '.decision' "$CERT/gate20-semantic-shopper.json")" = "PASS_GATE20_SEMANTIC_SHOPPER_PROFILE_HISTORY"
          test "$(jq -r '.sourceSha' "$CERT/gate20-semantic-shopper.json")" = "$I3_CERTIFICATION_SOURCE_SHA"
          EXPECTED_SEMANTIC_SHA="$(jq -r '.gate20Semantic.evidenceSha256' "$CERT/result.json")"
          ACTUAL_SEMANTIC_SHA="$(sha256sum "$CERT/gate20-semantic-shopper.json" | awk '{print $1}')"
          test "$EXPECTED_SEMANTIC_SHA" = "$ACTUAL_SEMANTIC_SHA"

          test "$(jq -r '.atomicP0.decision' "$CERT/result.json")" = "PASS_I3_ATOMIC_P0_SOURCE_CONTRACT"
          test "$(jq -r '.clientMembership.decision' "$CERT/result.json")" = "PASS_C6_CLIENT_AUTH_MEMBERSHIP_READBACK"
          test "$(jq -r '.clientMembership.authUserCreates' "$CERT/result.json")" = "0"
          test "$(jq -r '.clientMembership.passwordChanges' "$CERT/result.json")" = "0"
          test "$(jq -r '.fullHumanAcceptance.decision' "$CERT/result.json")" = "PASS_I3_HUMAN_LIVE_ACCEPTANCE"
          test "$(jq -r '.fullHumanAcceptance.beforeArtifact' "$CERT/result.json")" = "true"
          test "$(jq -r '.fullHumanAcceptance.expectedRoleRouteEntries' "$CERT/result.json")" = "56"
          test "$(jq -r '.decision' "$CERT/full-human-acceptance/human-live-acceptance.json")" = "PASS_I3_HUMAN_LIVE_ACCEPTANCE"
          test "$(jq -r '.decision' "$CERT/full-human-acceptance/i3-functional-probes.json")" = "PASS_I3_ATOMIC_FUNCTIONAL_PROBES"
          test "$(jq -r '.routeInventory.expectedRoleRouteEntries' "$CERT/full-human-acceptance/human-live-acceptance.json")" = "56"
          ACTUAL_FULL_HUMAN_SHA="$(sha256sum "$CERT/full-human-acceptance/human-live-acceptance.json" | awk '{print $1}')"
          ACTUAL_FUNCTIONAL_PROBES_SHA="$(sha256sum "$CERT/full-human-acceptance/i3-functional-probes.json" | awk '{print $1}')"
          ACTUAL_ROUTE_INVENTORY_SHA="$(sha256sum "$CERT/canonical-route-inventory.json" | awk '{print $1}')"
          test "$ACTUAL_FULL_HUMAN_SHA" = "$(jq -r '.fullHumanAcceptance.evidenceSha256' "$CERT/result.json")"
          test "$ACTUAL_FUNCTIONAL_PROBES_SHA" = "$(jq -r '.fullHumanAcceptance.functionalProbesSha256' "$CERT/result.json")"
          test "$ACTUAL_ROUTE_INVENTORY_SHA" = "$(jq -r '.fullHumanAcceptance.routeInventorySha256' "$CERT/result.json")"
          test "$ACTUAL_ROUTE_INVENTORY_SHA" = "ad262dd0165a7159e62076f67a6339b375ce0760dd6b650abc4ee438b04950af"
          test -f "$CERT/atomic-p0-source-contract.json"
          test -f "$CERT/client-membership/readback.json"
          ACTUAL_ATOMIC_P0_SHA="$(sha256sum "$CERT/atomic-p0-source-contract.json" | awk '{print $1}')"
          ACTUAL_CLIENT_MEMBERSHIP_SHA="$(sha256sum "$CERT/client-membership/readback.json" | awk '{print $1}')"
          test "$ACTUAL_ATOMIC_P0_SHA" = "$(jq -r '.atomicP0.evidenceSha256' "$CERT/result.json")"
          test "$ACTUAL_CLIENT_MEMBERSHIP_SHA" = "$(jq -r '.clientMembership.evidenceSha256' "$CERT/result.json")"
          test "$(jq -r '.canonicalDecision' "$CERT/client-membership/readback.json")" = "PASS_C6_CLIENT_AUTH_MEMBERSHIP_READBACK"

          EXPECTED_ARTIFACT_SHA="$(jq -r '.artifactSha256' "$CERT/result.json")"
          ACTUAL_ARTIFACT_SHA="$(sha256sum "$CERT/cxorbia-i3-certified-source.tar" | awk '{print $1}')"
          test "$EXPECTED_ARTIFACT_SHA" = "$ACTUAL_ARTIFACT_SHA"
          test "$(awk '{print $1}' "$CERT/cxorbia-i3-certified-source.tar.sha256")" = "$ACTUAL_ARTIFACT_SHA"

          EXPECTED_GATE20_SHA="$(jq -r '.gate20.evidenceSha256' "$CERT/result.json")"
          ACTUAL_GATE20_SHA="$(sha256sum "$CERT/gate20/gate20-browser-visual.json" | awk '{print $1}')"
          test "$EXPECTED_GATE20_SHA" = "$ACTUAL_GATE20_SHA"

          tar -tf "$CERT/cxorbia-i3-certified-source.tar" > "$OUT_DIR/certified-source-files.txt"
          grep -Fxq './firebase.json' "$OUT_DIR/certified-source-files.txt"
          grep -Fxq './app/modules/shoppers.js' "$OUT_DIR/certified-source-files.txt"
          grep -Fxq './app/modules/finanzas.js' "$OUT_DIR/certified-source-files.txt"
          grep -Fxq './app/modules/operacion-extra.js' "$OUT_DIR/certified-source-files.txt"

          printf '%s\n' "$ACTUAL_ARTIFACT_SHA" > "$OUT_DIR/certified-artifact.sha256"
          printf '%s\n' "$ACTUAL_GATE20_SHA" > "$OUT_DIR/gate20-evidence.sha256"
          echo "PASS_GATE21_SAME_ARTIFACT source=$I3_CERTIFICATION_SOURCE_SHA artifactSha256=$ACTUAL_ARTIFACT_SHA rebuilds=0 deploys=0 production=false"

      - name: Build terminal Gate 21 integrity manifest without rebuild
        run: |
          set -euo pipefail
          CERT="$OUT_DIR/certification"
          ARTIFACT_SHA="$(cat "$OUT_DIR/certified-artifact.sha256")"
          GATE20_SHA="$(cat "$OUT_DIR/gate20-evidence.sha256")"
          FULL_HUMAN_SHA="$(sha256sum "$CERT/full-human-acceptance/human-live-acceptance.json" | awk '{print $1}')"
          ROUTE_INVENTORY_SHA="$(sha256sum "$CERT/canonical-route-inventory.json" | awk '{print $1}')"
          RUNTIME_REVISION="$(jq -r '.devRuntimeRevision' "$CERT/result.json")"
          RUNTIME_DIGEST="$(jq -r '.runtimeImageDigest' "$CERT/result.json")"
          IMMUTABLE_IMAGE="$(jq -r '.immutableRuntimeImage' "$CERT/result.json")"
          HOSTING_RELEASE="$(jq -r '.hostingReleaseName' "$CERT/result.json")"
          HOSTING_VERSION="$(jq -r '.hostingVersionName' "$CERT/result.json")"
          HOSTING_RELEASE_TIME="$(jq -r '.hostingReleaseTime' "$CERT/result.json")"
          CONTROL_HEAD="$(jq -r '.controlHeadSha' "$CERT/result.json")"
          MODULE_TRUTH_SHA="$(jq -r '.moduleTruthEvidenceSha256' "$CERT/result.json")"
          MODULE_COUNT="$(jq -r '.moduleTruth.modules|length' "$CERT/result.json")"

          jq -n -S \
            --arg source "$I3_CERTIFICATION_SOURCE_SHA" \
            --arg tree "$I3_CERTIFICATION_SOURCE_TREE" \
            --arg control "$CONTROL_HEAD" \
            --arg run "$GITHUB_RUN_ID" \
            --arg artifactName "$CERTIFICATION_ARTIFACT_NAME" \
            --arg artifactSha "$ARTIFACT_SHA" \
            --arg gate20Sha "$GATE20_SHA" \
            --arg fullHumanSha "$FULL_HUMAN_SHA" \
            --arg routeInventorySha "$ROUTE_INVENTORY_SHA" \
            --arg moduleTruthSha "$MODULE_TRUTH_SHA" --argjson moduleCount "$MODULE_COUNT" \
            --arg runtimeRevision "$RUNTIME_REVISION" \
            --arg runtimeDigest "$RUNTIME_DIGEST" \
            --arg immutableImage "$IMMUTABLE_IMAGE" \
            --arg hostingRelease "$HOSTING_RELEASE" \
            --arg hostingVersion "$HOSTING_VERSION" \
            --arg hostingReleaseTime "$HOSTING_RELEASE_TIME" \
            '{schemaVersion:"cxorbia.recovery.i3.gate21.same-artifact.v1",gate:21,verdict:"PASS_GATE21_ARTIFACT_FINGERPRINT",production:false,source:{sha:$source,treeSha:$tree,controlHeadSha:$control},certification:{runId:$run,artifactName:$artifactName,artifactSha256:$artifactSha,buildCount:1,rebuildAfterCertification:false},gate20:{sourceSha:$source,evidenceSha256:$gate20Sha},fullHumanAcceptance:{decision:"PASS_I3_HUMAN_LIVE_ACCEPTANCE",evidenceSha256:$fullHumanSha,routeInventorySha256:$routeInventorySha,expectedRoleRouteEntries:56,beforeArtifact:true},moduleTruth:{evidenceSha256:$moduleTruthSha,moduleCount:$moduleCount,allModulesMatch:true},hostingCertifiedArtifact:{releaseName:$hostingRelease,versionName:$hostingVersion,releaseTime:$hostingReleaseTime},runtimeCertifiedArtifact:{revision:$runtimeRevision,imageDigest:$runtimeDigest,immutableImage:$immutableImage},promotion:{noRebuild:true,noRecomposition:true,exactCertifiedArtifactRequired:true,productionAuthorizationRequired:true},writes:{builds:0,hostingDeploys:0,runtimeDeploys:0,providerWrites:0,hrWrites:0,production:false}}' \
            > "$OUT_DIR/GATE21_RELEASE_MANIFEST.json"
          sha256sum "$OUT_DIR/GATE21_RELEASE_MANIFEST.json" > "$OUT_DIR/GATE21_RELEASE_MANIFEST.sha256"

      - name: Upload terminal Gate 21 integrity package
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-recovery-i3-gate21-${{ github.run_id }}
          path: .gate21/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true
