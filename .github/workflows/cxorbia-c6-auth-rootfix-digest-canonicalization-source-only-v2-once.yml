name: CXOrbia C6 Auth Rootfix Digest Canonicalization Source Only V2 Once

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths:
      - 'backend/config/c6-auth-rootfix-digest-canonicalization-source-only-request-v2.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-rootfix-digest-canonicalization-source-only-v2-once
  cancel-in-progress: false

jobs:
  phase1-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUEST_FILE: backend/config/c6-auth-rootfix-digest-canonicalization-source-only-request-v2.json
      FREEZE_FILE: backend/config/c6-shopper-auth-final-freeze-v3.json
      ROOTFIX_TOOL: tools/qa/cxorbia-c6-auth-principal-uniqueness-rootfix-source-only.mjs
      ACTIVATION_TOOL: tools/qa/cxorbia-c6-auth-activation-dev-v2.mjs
      OLD_PLAN_DIR: .tmp/c6-auth-digest-canonicalization-v2/old-plan
      SOURCE_OUT: .tmp/c6-auth-digest-canonicalization-v2/source-out
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate corrected source-only request
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(r.schemaVersion==='cxorbia.c6.auth-rootfix-digest-canonicalization-source-only.request.v1','REQUEST_SCHEMA');
          ok(r.requestId==='c6-auth-rootfix-digest-canonicalization-source-only-20260807-02','REQUEST_ID');
          ok(r.enabled===true&&r.consumed===false&&r.allowedExecutions===1&&r.authorizedBy==='Paula','REQUEST_AUTH');
          ok(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_ONLY_COMMIT');
          ok(r.previousSourceAttempt?.runId===31234567894&&r.previousSourceAttempt?.providerReads===0&&r.previousSourceAttempt?.providerWrites===0,'PREVIOUS_FAIL_CLOSED');
          ok(r.canonicalAnnotation==='TARGET_SPECIFIC_EXISTING_AUTH_CANDIDATE_COUNT_0_AFTER_LINEAGE_PASS','CANONICAL_ANNOTATION');
          console.log('PASS_C6_AUTH_DIGEST_CANONICALIZATION_REQUEST_V2');
          NODE
      - name: Install pinned Firebase Admin SDK for activation self-test only
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Syntax self-tests and static no-loop gate
        run: |
          set -euo pipefail
          node --check "$ROOTFIX_TOOL"
          node --check "$ACTIVATION_TOOL"
          node "$ROOTFIX_TOOL" --self-test | tee /tmp/rootfix-selftest.txt
          grep -q 'PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SELFTEST' /tmp/rootfix-selftest.txt
          node "$ACTIVATION_TOOL" --self-test | tee /tmp/activation-selftest.txt
          grep -q 'PASS_C6_AUTH_ACTIVATION_V2_SELFTEST' /tmp/activation-selftest.txt
          node <<'NODE'
          const fs=require('fs');const rootfix=fs.readFileSync(process.env.ROOTFIX_TOOL,'utf8');const activation=fs.readFileSync(process.env.ACTIVATION_TOOL,'utf8');
          const canonical='TARGET_SPECIFIC_EXISTING_AUTH_CANDIDATE_COUNT_0_AFTER_LINEAGE_PASS';
          if(!rootfix.includes(`target.rootCauseReclassification='${canonical}'`))throw new Error('CANONICAL_ANNOTATION_NOT_MATERIALIZED');
          if(rootfix.includes('TARGET_SPECIFIC_EXISTING_AUTH_CANDIDATE_COUNT_0_AFTER_EXACT_LINEAGE_PASS'))throw new Error('STALE_ANNOTATION_PRESENT');
          for(const x of ['gatherCandidatesTargetSpecific','assertPrincipalOwner','GLOBAL_PRINCIPAL_UID_ALIAS','GLOBAL_PRINCIPAL_CANDIDATE_ALIAS','LEGACY_SHA256_ROUNDS1_SALTLESS_EXACT','PROVIDER_HASH_CONFIG_EXACT'])if(!activation.includes(x))throw new Error('MISSING_NO_LOOP_GUARD:'+x);
          console.log('PASS_C6_AUTH_DIGEST_CANONICALIZATION_STATIC_NO_LOOP_GATE');
          NODE
      - name: Download prior final plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OLD_PLAN_DIR" "$SOURCE_OUT"
          gh run download 31213274602 -n cxorbia-c6-auth-activation-dev-31213274602 -D "$OLD_PLAN_DIR"
          test -f "$OLD_PLAN_DIR/final-plan-source-safe.json"
      - name: Materialize canonical v3 source-only
        run: |
          set -euo pipefail
          CXORBIA_C6_ROOTFIX_OUT="$SOURCE_OUT" node "$ROOTFIX_TOOL" \
            "$OLD_PLAN_DIR/final-plan-source-safe.json" \
            app/docs/evidence/C6-AUTH-TARGET-ADAPTIVE-LINEAGE-ROOT-CAUSE-CROSS-ROW-PRINCIPAL-ALIAS-STOP-RETRY-20260807.json \
            "$FREEZE_FILE"
          node <<'NODE'
          const e=require('./.tmp/c6-auth-digest-canonicalization-v2/source-out/source-phase-evidence.json');
          const p=require('./.tmp/c6-auth-digest-canonicalization-v2/source-out/final-plan-v3-source-safe.json');
          const target=p.rows.find(r=>r.profileFp==='ac93d90d9e41512acdcd');const peer=p.rows.find(r=>r.profileFp==='a8dd7db89a02ff180674');
          if(e.decision!=='PASS_C6_AUTH_PRINCIPAL_UNIQUENESS_ROOTFIX_SOURCE_ONLY')throw new Error('PHASE1_NOT_PASS');
          if(e.providerReads!==0||e.providerWrites!==0||e.authWrites!==0||e.firestoreWrites!==0||e.hrWrites!==0)throw new Error('PROVIDER_BOUNDARY_CROSSED');
          if(p.plan?.rows!==340||p.plan?.uniqueRows!==340)throw new Error('ROWS');
          const c=p.plan.operationCounts,s=p.plan.subchangeCounts;
          if(c.CREATE_AUTH!==82||c.UPDATE_AUTH!==45||c.NO_OP!==81||c.HOLD!==0||c.PRESERVE_NO_AUTH!==132)throw new Error('COUNTS');
          if(s.email!==38||s.password!==13||s.claims!==37)throw new Error('SUBCHANGES');
          if(p.plan.expectedAuthUsersBefore!==110||p.plan.expectedAuthUsersAfter!==192)throw new Error('POPULATION');
          if(p.plan.sourceSafeRowsDigestSha256!=='7b92fa73946e74ec4058bcdcbcfca25fe90e0504db6b6b22e797fbad066bd749')throw new Error('DIGEST');
          if(target?.primary!=='CREATE_AUTH'||target?.rootCauseReclassification!=='TARGET_SPECIFIC_EXISTING_AUTH_CANDIDATE_COUNT_0_AFTER_LINEAGE_PASS')throw new Error('TARGET');
          if(peer?.primary!=='UPDATE_AUTH')throw new Error('PEER');
          console.log(JSON.stringify({decision:e.decision,rows:340,counts:c,subchanges:s,digest:p.plan.sourceSafeRowsDigestSha256,expectedAuthUsersAfter:192,providerReads:0,providerWrites:0}));
          NODE
      - name: Upload source-only PASS evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-rootfix-digest-canonicalization-source-only-v2-${{ github.run_id }}
          path: .tmp/c6-auth-digest-canonicalization-v2/source-out
          if-no-files-found: error
          retention-days: 14
      - name: Publish source-only decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success; DESC='PASS_C6_AUTH_ROOTFIX_DIGEST_CANONICALIZATION_SOURCE_ONLY'
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; DESC='STOP_RETRY_C6_AUTH_ROOTFIX_DIGEST_CANONICALIZATION_SOURCE_ONLY'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-rootfix-digest-canonicalization-source-only-v2' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
