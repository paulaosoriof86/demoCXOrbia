name: CXOrbia C6 Auth Password Rollback Root Fix Source Only

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/c6-auth-password-rollback-rootfix-source-only-request-v1.json'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: cxorbia-c6-auth-password-rollback-rootfix-source-only
  cancel-in-progress: false

jobs:
  rootfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUEST_FILE: backend/config/c6-auth-password-rollback-rootfix-source-only-request-v1.json
      TOOL_FILE: tools/qa/cxorbia-c6-auth-password-rollback-rootfix-source-only.mjs
      SOURCE_DIR: .tmp/c6-auth-password-rollback-rootfix/source
      EXPORT_DIR: .tmp/c6-auth-password-rollback-rootfix/export
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact source-only authorization
        id: gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const ensure=(v,c)=>{if(!v)throw new Error(c)};
          ensure(r.schemaVersion==='cxorbia.c6.auth-password-rollback-rootfix-source-only.request.v1','SCHEMA');
          ensure(r.requestId==='c6-auth-password-rollback-rootfix-source-only-20260807-01','REQUEST_ID');
          ensure(r.authorizedBy==='Paula'&&r.enabled===true&&r.consumed===false&&r.status==='authorized_execute_once'&&Number(r.allowedExecutions)===1,'AUTHORIZATION');
          ensure(r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&Number(r.pullRequest)===7,'LANE');
          ensure(r.targetProfileFingerprint==='ac93d90d9e41512acdcd','TARGET');
          ensure(r.targetHeadSha===parent&&changed.length===1&&changed[0]===process.env.REQUEST_FILE,'REQUEST_SOURCE_LOCK');
          for(const k of ['providerReads','authReads','firestoreReads','hrReads','providerWrites','authWrites','firestoreWrites','hrWrites','rulesWrites','storageWrites','hostingDeploys','cloudRunDeploys','cloudBuilds','makeCalls','geminiCalls','paymentWrites'])ensure(Number(r.safety?.[k])===0,'UNSAFE_'+k);
          ensure(r.safety?.merge===false&&r.safety?.production===false,'RELEASE_SCOPE');
          console.log(JSON.stringify({head,parent,changed,authorized:true}));
          NODE

      - name: Static no-provider/no-network gate
        run: |
          set -euo pipefail
          node --check "$TOOL_FILE"
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.env.TOOL_FILE,'utf8');
          const forbidden=['firebase-admin','admin.initializeApp','fetch(','axios','gcloud ','firebase deploy','curl ','https://','http://'];
          for(const token of forbidden)if(s.includes(token))throw new Error('FORBIDDEN_SOURCE_TOKEN:'+token);
          for(const required of ['PASS_HERMETIC_SELFTEST','STOP_RETRY_C6_AUTH_PASSWORD_ROLLBACK_ROOT_FIX_SOURCE_ONLY_TARGET_PRIOR_PASSWORD_NOT_PROVEN','contractMutationAllowed','providerReads:0','providerWrites:0'])if(!s.includes(required))throw new Error('MISSING_GUARD:'+required);
          console.log('PASS_C6_AUTH_PASSWORD_ROLLBACK_ROOTFIX_STATIC_NO_PROVIDER');
          NODE

      - name: Download frozen source-safe plan artifact from GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          gh run download 31104541809 -n cxorbia-c6-equivalent-universe-provider-v22-31104541809 -D "$SOURCE_DIR"
          test -f "$SOURCE_DIR/plan-340-source-safe.json"

      - name: Execute hermetic source-only root fix assessment
        id: assess
        run: |
          set +e
          CXORBIA_SOURCE_PLAN="$SOURCE_DIR/plan-340-source-safe.json" CXORBIA_ROOTFIX_OUT_DIR="$EXPORT_DIR" node "$TOOL_FILE"
          code=$?
          decision=$(head -n 1 "$EXPORT_DIR/decision.txt" 2>/dev/null || echo HOLD_C6_ROOTFIX_NO_DECISION)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$code" != '0' ] && [ "$code" != '2' ]; then exit "$code"; fi
          exit 0

      - name: Verify no provider contract mutation occurred on STOP_RETRY
        if: steps.assess.outputs.exit_code == '2'
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ HEAD -- backend/contracts/c6-auth-activation-dev-v1.json
          node <<'NODE'
          const e=require('./.tmp/c6-auth-password-rollback-rootfix/export/evidence-source-safe.json');
          if(e.reversibility?.contractMutationAllowed!==false||e.reversibility?.exactRollbackReconstructible!==false)throw new Error('STOP_CONTRACT_INCONSISTENT');
          if(e.safety?.providerReads!==0||e.safety?.authReads!==0||e.safety?.firestoreReads!==0||e.safety?.hrReads!==0)throw new Error('READ_SCOPE_VIOLATION');
          console.log('PASS_STOP_RETRY_CONTRACT_UNMODIFIED');
          NODE

      - name: Upload source-safe terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-auth-password-rollback-rootfix-source-only-${{ github.run_id }}
          path: .tmp/c6-auth-password-rollback-rootfix/export
          if-no-files-found: error
          retention-days: 14

      - name: Publish observable source-only status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.assess.outputs.decision }}
        run: |
          set -euo pipefail
          STATE=success
          DESC="${DECISION:-HOLD_C6_AUTH_PASSWORD_ROLLBACK_ROOTFIX_NO_DECISION}"
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; fi
          DESC=$(printf '%s' "$DESC" | cut -c1-140)
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/c6-auth-password-rollback-rootfix-source-only' -f description="$DESC" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
