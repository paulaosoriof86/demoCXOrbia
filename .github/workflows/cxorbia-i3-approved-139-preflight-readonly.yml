            .tmp/cxorbia-i3-rocio-residual-merge/result.json >/dev/null
          cp .tmp/cxorbia-i3-rocio-residual-merge/result.json .tmp/cxorbia-i3-rocio-residual-merge/preflight.json
      - name: Apply Rocío only through provider with two zero-write replays and historical readback
        run: |
          set -Eeuo pipefail
          CX_I3_RESIDUAL_CASE=ROCIO \
          CX_I3_RESIDUAL_APPROVAL=PAULA_20261105_ROCIO_VILCA_APPROVED_EXACT_HUMAN_DEV_ONCE \
