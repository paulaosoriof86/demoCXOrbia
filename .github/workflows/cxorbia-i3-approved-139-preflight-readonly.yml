name: CXOrbia I3 Approved Shopper Identity Cohort Preflight Readonly
on:
  push:
    branches: [recovery/cxorbia-phase-a-20260831]
    paths:
      - .github/workflows/cxorbia-i3-approved-139-preflight-readonly.yml
      - firebase/auth-dev-tools/cxorbia-i3-approved-139-preflight-readonly.mjs
      - firebase/auth-dev-tools/cxorbia-i3-approved-139-pair-hashes.json
permissions:
  contents: read
concurrency:
  group: cxorbia-i3-approved-139-readonly-preflight
  cancel-in-progress: false
jobs:
  identity-cohort-approved-readonly:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-APPROVED-139-PREFLIGHT-READONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: cxorbia-backend-dev
      GOOGLE_CLOUD_PROJECT: cxorbia-backend-dev
      CX_APPROVED_COHORT_PREFLIGHT: PAULA_CONFIRMED_2026_10_28_139_EXACT_COHORT_PAIRS_READONLY_PREFLIGHT
      CX_APPROVED_COHORT_PREFLIGHT_OUT: .tmp/i3-approved-cohort-preflight
      CX_APPROVED_COHORT_REVISION_DIAGNOSTIC: I3_HR_REVISION_READONLY_DELTA_20261105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact DEV source authority and no functional mutation
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = 'recovery/cxorbia-phase-a-20260831'
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          SOURCE="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          TREE="$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$SOURCE" = '09eed4f012f9ad04e49d53569aabd86bd4c832a9'
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          # No source-change exception is allowed in this current cohort check.
          # All product owners are verified against the unique certified source;
          # historical per-file hashes no longer describe the present candidate.
          git diff --quiet "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules
          node --check firebase/auth-dev-tools/cxorbia-i3-approved-139-preflight-readonly.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Reconcile approved exact pairs against fresh provider and protected Auth
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node firebase/auth-dev-tools/cxorbia-i3-approved-139-preflight-readonly.mjs
          jq -e '(.decision=="PASS_APPROVED_COHORT_PREFLIGHT_READONLY" or (.decision=="HOLD_REVISED_HR_SOURCE_NOT_APPROVED" and .approvedSourceRevisionMatch==false and .observedSourceRevision=="cdc40258e9806b5d0ff1e09dd19b19743b76ee3dd22ac7f849fac538c3340dac")) and .production==false and .authWrites==0 and .firestoreWrites==0 and .hrWrites==0 and .merges==0 and .reconciliation.groups==83 and .reconciliation.approvedWorkbookPairDigest=="ac3e15184316d62aa53942359e857f2c34dec486a2ca41057e529a39f062d872"' "$CX_APPROVED_COHORT_PREFLIGHT_OUT/result.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-approved-139-readonly-${{ github.run_id }}
          path: .tmp/i3-approved-cohort-preflight/result.json
          if-no-files-found: warn
          retention-days: 7

  adjacent-source-tests:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-APPROVED-139-PREFLIGHT-READONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protected shopper provider regression
        run: |
          node backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs
          node tools/qa/cxorbia-i3-shopper-name-collision-normalization.test.mjs
          node tools/qa/cxorbia-i3-shopper-identity-review-rail-notice.test.mjs
          node --test tools/qa/cxorbia-i3-available-visits-active-period-scope.test.mjs
          node tools/qa/cxorbia-i3-dashboard-por-asignar-facets.test.mjs
          node tools/qa/cxorbia-i3-postulaciones-country-options-unified.test.mjs
          node tools/qa/cxorbia-i3-postulaciones-manual-availability-guard.test.mjs
          node tools/qa/cxorbia-i3-shoppers-bridge-authority.test.mjs
          node tools/qa/cxorbia-i3-visitas-effective-availability.test.mjs
          node tools/qa/cxorbia-i3-cert-bank-human-state-labels.test.mjs
