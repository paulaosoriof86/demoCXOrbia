name: CXOrbia I3 Approved Shopper Identity Cohort Preflight and Bounded DEV Batch
on:
  push:
    branches: [recovery/cxorbia-phase-a-20260831]
    paths:
      - .github/workflows/cxorbia-i3-approved-139-preflight-readonly.yml
      - firebase/auth-dev-tools/cxorbia-i3-approved-139-preflight-readonly.mjs
      - firebase/auth-dev-tools/cxorbia-i3-approved-139-batch-dev-once.mjs
      - firebase/auth-dev-tools/cxorbia-i3-approved-14-preflight-readonly.mjs
      - firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
      - firebase/auth-dev-tools/cxorbia-i3-approved-139-pair-hashes.json
permissions:
  contents: read
concurrency:
  group: cxorbia-i3-approved-139-readonly-preflight
  cancel-in-progress: false
jobs:
  # VRM-307 run 42133324561: Jhennypher PASS, Rocío provider rejected with
  # SHOPPER_IDENTITY_EXTERNAL_HR_ANCHOR_NOT_PROFILE_FREE and zero provider writes.
  # Both groups now provider PASS (Rocio run 42135218971); take independent
  # post-success persistence/domain census before final module-certification update.
  residual-post-attempt-receipt-readonly:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-TWO-RESIDUALS-READBACK-ONLY-20261105' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: cxorbia-backend-dev
      GOOGLE_CLOUD_PROJECT: cxorbia-backend-dev
      CXORBIA_PRODUCT_SOURCE_SHA: 3a299715ea2d87ae43c0f6415f44bd23b13a1837
      CX_I3_RESIDUAL_READBACK_ONLY: YES_PAULA_20261105_POST_ATTEMPT
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact unchanged DEV product, no production, no data writes
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          test "$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "$CXORBIA_PRODUCT_SOURCE_SHA"
          git diff --quiet "$CXORBIA_PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules
          node --check firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Install read-only Firestore inspection tools
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
      - name: Independent post-failure status of both authorized groups, receipts and historical references
        run: |
          set -Eeuo pipefail
          CX_I3_RESIDUAL_CASE=MURGA CX_I3_RESIDUAL_APPROVAL=PAULA_20261105_JHENNYPHER_MURGA_APPROVED_EXACT_HUMAN_DEV_ONCE \
            node firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
          CX_I3_RESIDUAL_CASE=ROCIO CX_I3_RESIDUAL_APPROVAL=PAULA_20261105_ROCIO_VILCA_APPROVED_EXACT_HUMAN_DEV_ONCE \
            node firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
          jq -e '.decision=="READONLY_POST_ATTEMPT_RECEIPT_AND_DOMAIN_CENSUS" and .production==false and .directAuthWrites==0 and .directFirestoreWrites==0' \
            .tmp/cxorbia-i3-murga-residual-merge/result.json >/dev/null
          jq -e '.decision=="READONLY_POST_ATTEMPT_RECEIPT_AND_DOMAIN_CENSUS" and .production==false and .directAuthWrites==0 and .directFirestoreWrites==0' \
            .tmp/cxorbia-i3-rocio-residual-merge/result.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-two-residual-receipt-readback-${{ github.run_id }}
          path: |
            .tmp/cxorbia-i3-murga-residual-merge/result.json
            .tmp/cxorbia-i3-rocio-residual-merge/result.json
          retention-days: 30

  two-approved-residual-groups-protected-dev-once:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-VRM307-TWO-APPROVED-GROUPS-PROTECTED-DEV-ONCE-20261105' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GCLOUD_PROJECT: cxorbia-backend-dev
      GOOGLE_CLOUD_PROJECT: cxorbia-backend-dev
      CXORBIA_PRODUCT_SOURCE_SHA: 3a299715ea2d87ae43c0f6415f44bd23b13a1837
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed on source, matrix or continuity divergence
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'recovery/cxorbia-phase-a-20260831'
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          SOURCE="$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          TREE="$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          test "$SOURCE" = "$CXORBIA_PRODUCT_SOURCE_SHA"
          test "$(jq -r '.status' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = HOLD_VRM307_DEV_MATERIALIZED_PROTECTED_GROUP_READBACK_G03
          test "$(jq -r '.postDeployRunSeal.mode' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = CURRENT_SOURCE_SERVING
          test "$(jq -r '.postDeployRunSeal.runId' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = 42132045461
          test "$(jq -r '.postDeployRunSeal.sourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "$SOURCE"
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          git diff --quiet "$SOURCE" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules
          node tools/qa/cxorbia-i3-shock-continuity-guard.mjs
          node --test tools/qa/cxorbia-i3-shock-continuity-guard.test.mjs
          node --check firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
      - name: Execute canonical provider and password-preservation regressions
        run: |
          set -Eeuo pipefail
          node backend/runtime/hr-live-service/test/cxorbia-shopper-command-provider-v1.test.mjs
          node tools/qa/cxorbia-i3-shopper-name-collision-normalization.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Install scoped DEV tooling and protected Chromium
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          ./firebase/auth-dev-tools/node_modules/.bin/playwright install chromium
      - name: Two explicitly approved human clusters, sequential protected provider ACK and independent readback
        run: |
          set -Eeuo pipefail
          CX_I3_RESIDUAL_CASE=MURGA \
          CX_I3_RESIDUAL_APPROVAL=PAULA_20261105_JHENNYPHER_MURGA_APPROVED_EXACT_HUMAN_DEV_ONCE \
          node firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
          jq -e '(.decision=="PASS_RESIDUAL_MURGA_FUSION_AND_NAME_DEV" or
            .decision=="PASS_RESIDUAL_MURGA_FUSION_PROFILE_NAME_PROJECTION_PENDING") and
            .production==false and .providerAck==true and .identityConsolidated==true and
            .idempotentReplays==2 and .keeperLoginPreserved==true and
            .directAuthWrites==0 and .directFirestoreWrites==0 and .hrWrites==0 and
            .credentialResets==0 and .deployments==0 and
            .readback.providerDomainRowsPreserved==([.domainRowsPlanned[]]|add) and
            .readback.aliasesRetired==.aliasCount and .readback.canonicalMemberships==1 and
            .readback.nameMatchesCorrectedHr==true' \
            .tmp/cxorbia-i3-murga-residual-merge/result.json >/dev/null
          CX_I3_RESIDUAL_CASE=ROCIO \
          CX_I3_RESIDUAL_APPROVAL=PAULA_20261105_ROCIO_VILCA_APPROVED_EXACT_HUMAN_DEV_ONCE \
          node firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
          jq -e '(.decision=="PASS_RESIDUAL_ROCIO_FUSION_AND_NAME_DEV" or
            .decision=="PASS_RESIDUAL_ROCIO_FUSION_PROFILE_NAME_PROJECTION_PENDING") and
            .target=="Rocío Vilca" and .keeperLogin=="rocio.vilca" and
            .production==false and .providerAck==true and .identityConsolidated==true and
            .idempotentReplays==2 and .keeperLoginPreserved==true and
            .directAuthWrites==0 and .directFirestoreWrites==0 and .hrWrites==0 and
            .credentialResets==0 and .deployments==0 and
            .approvedRecentSecondarySession=="rocio.vica.3599" and
            .readback.providerDomainRowsPreserved==([.domainRowsPlanned[]]|add) and
            .readback.aliasesRetired==.aliasCount and .readback.canonicalMemberships==1 and
            .readback.nameMatchesCorrectedHr==true' \
            .tmp/cxorbia-i3-rocio-residual-merge/result.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-two-residual-groups-${{ github.run_id }}
          path: |
            .tmp/cxorbia-i3-murga-residual-merge/result.json
            .tmp/cxorbia-i3-rocio-residual-merge/result.json
          if-no-files-found: warn
          retention-days: 30

  rocio-previously-materialized-hr-aliases-protected-dev-once:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-P0-VRM307-ROCIO-MATERIALIZED-HR-ALIAS-PROTECTED-DEV-ONCE-20261106' }}
