          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          test "$(jq -r '.productSourceSha' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = "$CXORBIA_PRODUCT_SOURCE_SHA"
          test "$(jq -r '.postDeployRunSeal.mode' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = CURRENT_SOURCE_SERVING
          test "$(jq -r '.postDeployRunSeal.runId' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)" = 42132045461
          test "$(git rev-parse "$CXORBIA_PRODUCT_SOURCE_SHA^{tree}")" = "$(jq -r '.productTreeAuthority' CXORBIA_I3_CANONICAL_CANDIDATE_DESCRIPTOR_2026-09-24.json)"
          git diff --quiet "$CXORBIA_PRODUCT_SOURCE_SHA" HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules
          jq -e '.gate=="HOLD" and .production==false and .jhennypherMurga.independentPostAttemptReadback.activeMembers==1 and .jhennypherMurga.independentPostAttemptReadback.aliasDomainReferencesRemaining==0' docs/checkpoints/CXORBIA_I3_VRM307_TWO_GROUPS_PROTECTED_RUN36_PARTIAL_20261105.json >/dev/null
          jq -e '.rocioVilca.postAttemptIndependentReadback.activeMembers==2 and .rocioVilca.postAttemptIndependentReadback.supersededProfiles==0 and .rocioVilca.providerWrites==0 and .rocioVilca.providerAck==false' docs/checkpoints/CXORBIA_I3_VRM307_TWO_GROUPS_PROTECTED_RUN36_PARTIAL_20261105.json >/dev/null
          node --check firebase/auth-dev-tools/cxorbia-i3-murga-residual-protected-dev-once.mjs
