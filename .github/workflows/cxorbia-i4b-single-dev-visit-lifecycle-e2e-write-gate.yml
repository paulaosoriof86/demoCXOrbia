name: CXOrbia I4B Single DEV Visit Lifecycle E2E Write Gate

on:
  push:
    branches: [docs-tya-v6-v71-audit]
    paths: [.github/workflows/cxorbia-i4b-single-dev-visit-lifecycle-e2e-write-gate.yml]

permissions:
  contents: read

concurrency:
  group: cxorbia-i4b-single-dev-visit-lifecycle-e2e-write-gate
  cancel-in-progress: false

env:
  REQUEST_FILE: backend/config/i4b-single-dev-visit-lifecycle-e2e-write-gate-request.json
  SHOPPER_REQUEST: backend/config/i4a-dedicated-test-shopper-create-request.json
  OUT_DIR: .tmp/i4b-single-dev-visit-lifecycle-e2e
  PRIVATE_DIR: .tmp/i4b-single-dev-visit-lifecycle-private

jobs:
  synthetic-lifecycle-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}

      - name: Validate exact authorization and lineage
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$PRIVATE_DIR"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const source=cp.execFileSync('git',['rev-parse','HEAD^^'],{encoding:'utf8'}).trim();
          const now=cp.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const prior=cp.execFileSync('git',['diff','--name-only','HEAD^^','HEAD^'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const expectedGate='NEW_AUTH_REQUIRED_I4B_SINGLE_DEV_VISIT_LIFECYCLE_E2E_WRITE_GATE__SYNTHETIC_VISIT_ONLY';
          if(head!==process.env.GITHUB_SHA)throw new Error('HEAD_SHA_MISMATCH');
          if(source!==r.sourceHeadSha||r.sourceHeadSha!=='96988840f74afc6de6b46666cbed897b30118c56')throw new Error('SOURCE_LINEAGE_MISMATCH');
          if(now.length!==1||now[0]!=='.github/workflows/cxorbia-i4b-single-dev-visit-lifecycle-e2e-write-gate.yml')throw new Error('WORKFLOW_COMMIT_SCOPE_INVALID');
          if(prior.length!==1||prior[0]!==process.env.REQUEST_FILE)throw new Error('REQUEST_COMMIT_SCOPE_INVALID');
          const exact=r.schemaVersion==='cxorbia.i4b.visit-lifecycle-write-gate.v1'&&r.gateId===expectedGate&&r.requestId==='cxorbia-i4b-single-dev-visit-lifecycle-e2e-20260819-01'&&r.repository==='paulaosoriof86/demoCXOrbia'&&r.branch==='docs-tya-v6-v71-audit'&&Number(r.pullRequest)===7&&r.firebaseProjectId==='cxorbia-backend-dev'&&r.tenantId==='tya'&&r.projectId==='cinepolis'&&r.enabled===true&&r.consumed===false&&r.status==='authorized_execute_once'&&r.authorizedBy==='Paula'&&r.authorizationText==='autorizado'&&r.allowedExecutions===1&&r.singleConsolidatedGate===true&&r.syntheticVisitOnly===true&&r.historicalShopperAccess===false&&r.realHrVisitMutationAllowed===false&&r.hrWrites===0&&r.rulesWrites===0&&r.storageWrites===0&&r.makeCalls===0&&r.geminiCalls===0&&r.paymentWrites===0&&r.hostingDeploys===0&&r.cloudRunDeploys===0&&r.merge===false&&r.production===false&&r.automaticRetryAllowed===false;
          if(!exact)throw new Error('AUTHORIZATION_CONTRACT_INVALID');
          console.log(JSON.stringify({decision:'PASS_I4B_AUTHORIZATION_LINEAGE',head,parent,sourceHead:r.sourceHeadSha,gateId:r.gateId}));
          NODE

      - name: Verify canonical source truth before provider writes
        env:
          CXORBIA_ALLOW_DETACHED_HEAD: '1'
        run: |
          set -euo pipefail
          node tools/verify-cxorbia-source-truth-sync.mjs > "$OUT_DIR/source-truth.json"
          node -e "const x=require('./$OUT_DIR/source-truth.json');if(x.decision!=='PASS_SOURCE_TRUTH_SYNC')process.exit(1);console.log(x.decision)"
          node tools/verify-cxorbia-i4b-visit-provider-source.mjs > "$OUT_DIR/provider-source.json"
          node -e "const x=require('./$OUT_DIR/provider-source.json');if(x.decision!=='PASS_I4B_VISIT_PROVIDER_SOURCE')process.exit(1);console.log(x.decision)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install transient provider dependency
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 >/dev/null 2>&1

      - name: Prepare DEV provider credential privately
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),raw=process.env.EXISTING_DEV_JSON||'';let x;
          try{x=JSON.parse(raw)}catch{}
          if(!(x&&x.type==='service_account'&&x.project_id==='cxorbia-backend-dev'&&x.client_email&&x.private_key))throw new Error('DEV_SERVICE_ACCOUNT_INVALID');
          fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/${PRIVATE_DIR}/credentials.json" >> "$GITHUB_ENV"

      - name: Execute one synthetic visit lifecycle E2E
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import admin from 'firebase-admin';
          import {createVisitLifecycleProvider,validateExecutionGate} from './backend/runtime/cxorbia-visit-lifecycle-command-provider-v1.mjs';

          const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const sr=JSON.parse(fs.readFileSync(process.env.SHOPPER_REQUEST,'utf8'));
          const sa=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));
          const sha=v=>crypto.createHash('sha256').update(String(v),'utf8').digest('hex');
          const stable=v=>Array.isArray(v)?v.map(stable):(v&&typeof v==='object'?(typeof v.toMillis==='function'?{__ts:v.toMillis()}:Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])]))):v);
          const digestDocs=docs=>sha(JSON.stringify(docs.map(d=>[d.id,stable(d.data())]).sort((a,b)=>a[0].localeCompare(b[0]))));
          const fingerprint=v=>sha('cxorbia-i4b-e2e\0'+String(v)).slice(0,20);
          const gateCheck=validateExecutionGate(r);if(!gateCheck.ok)throw new Error('GATE_VALIDATION_FAILED:'+gateCheck.errors.join(','));
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:r.firebaseProjectId});
          const auth=admin.auth(),db=admin.firestore();
          const tenant=db.collection('tenants').doc(r.tenantId),project=tenant.collection('projects').doc(r.projectId);
          const visits=project.collection('visits'),posts=project.collection('postulations');
          const key=sha(r.requestId).slice(0,24),visitId='visit-i4b-'+key,applicationId='app-i4b-'+key;
          const shopperKey=sha(sr.requestId).slice(0,24),shopperUid='tya-i4a-'+shopperKey,shopperId='shp-i4a-'+shopperKey;
          const visitRef=visits.doc(visitId),appRef=posts.doc(applicationId);
          const evidence={schemaVersion:'cxorbia.i4b.visit-lifecycle-e2e.evidence.v1',generatedAt:new Date().toISOString(),gateId:r.gateId,requestId:r.requestId,workflowRunId:Number(process.env.GITHUB_RUN_ID),workflowCommitSha:process.env.GITHUB_SHA,sourceHeadSha:r.sourceHeadSha,decision:'HOLD_I4B_E2E_NOT_COMPLETED',fixture:{visitIdFingerprint:fingerprint(visitId),applicationIdFingerprint:fingerprint(applicationId),synthetic:true,nonHr:true},actors:{shopperIdFingerprint:fingerprint(shopperId),shopperUidFingerprint:fingerprint(shopperUid),operatorUidFingerprint:null},checks:{},steps:[],safety:{syntheticVisitOnly:true,realHrVisitMutation:false,historicalShopperAccess:false,authCreates:0,authClaimsWrites:0,authPasswordUpdates:0,authPasswordResets:0,authDeletes:0,otherIdentitiesModified:0,hrWrites:0,rulesWrites:0,storageWrites:0,makeCalls:0,geminiCalls:0,paymentWrites:0,hostingDeploys:0,cloudRunDeploys:0,merge:false,production:false},counters:{providerCommandCalls:0,providerCommittedCalls:0,idempotentReplayChecks:0,versionConflictChecks:0,syntheticFixtureCreates:0,syntheticFixtureDeletes:0,providerWritesReported:0,auditDocsObserved:0,receiptDocsObserved:0},errors:[]};
          let beforeVisitDigest='',beforePostDigest='',operator=null,shopperToken='',operatorToken='';
          const writeEvidence=()=>{fs.mkdirSync(process.env.OUT_DIR,{recursive:true});fs.writeFileSync(process.env.OUT_DIR+'/evidence.json',JSON.stringify(evidence,null,2)+'\n');};
          const command=(commandType,entityType,entityId,expectedVersion,payload,actorRole,tag)=>({version:'cxorbia-command-adapter-v1',commandType,entityType,entityId,tenantId:r.tenantId,projectId:r.projectId,actor:{actorId:'provider-verified',role:actorRole,projectIds:[r.projectId],shopperId:actorRole==='shopper'?shopperId:null},expectedVersion,idempotencyKey:`i4b:${r.requestId}:${tag}`,payload,source:'i4b-e2e-gate',requestedAt:new Date().toISOString(),authorization:{providerEnforcementRequired:true},audit:{reason:'I4B synthetic lifecycle E2E',correlationId:r.requestId}});
          const getVersion=async ref=>{const s=await ref.get();if(!s.exists)throw new Error('EXPECTED_ENTITY_MISSING:'+ref.path);return s.data()?.version??'source-current';};
          const exchangeCustomToken=async uid=>{
            const custom=await auth.createCustomToken(uid,{i4bSyntheticE2E:true});
            let config={};
            const init=await fetch('https://cxorbia-backend-dev.web.app/__/firebase/init.json',{cache:'no-store'});
            if(init.ok)config=await init.json();
            if(!config.apiKey)throw new Error('FIREBASE_WEB_API_KEY_UNAVAILABLE');
            const resp=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(config.apiKey),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})});
            const body=await resp.json();if(!resp.ok||!body.idToken)throw new Error('CUSTOM_TOKEN_EXCHANGE_FAILED');return body.idToken;
          };
          const run=async(token,cmd,label)=>{
            evidence.counters.providerCommandCalls++;
            const out=await provider.execute(token,cmd);
            if(!(out?.ok===true&&out?.status==='committed'&&out?.providerAck===true&&out?.successUiAllowed===true))throw new Error('PROVIDER_ACK_FAILED:'+label+':'+String(out?.code||''));
            evidence.counters.providerCommittedCalls++;
            evidence.counters.providerWritesReported+=Number(out.providerWrites||0);
            evidence.steps.push({label,pass:true,providerAck:true,idempotentReplay:out.idempotentReplay===true,providerWrites:Number(out.providerWrites||0)});
            return out;
          };

          try{
            const initialVisitSnap=await visits.get(),initialPostSnap=await posts.get();
            if(initialVisitSnap.docs.some(d=>d.id===visitId)||initialPostSnap.docs.some(d=>d.id===applicationId))throw new Error('SYNTHETIC_FIXTURE_COLLISION');
            beforeVisitDigest=digestDocs(initialVisitSnap.docs);beforePostDigest=digestDocs(initialPostSnap.docs);

            const shopper=await auth.getUser(shopperUid),sc=shopper.customClaims||{};
            const sm=await tenant.collection('users').doc(shopperUid).get();
            if(!(sm.exists&&sm.data()?.active===true&&sc.tenantId===r.tenantId&&sc.role==='shopper'&&sc.authNamespace==='shopper'&&sc.shopperId===shopperId&&Array.isArray(sc.projectIds)&&sc.projectIds.includes(r.projectId)&&sc.synthetic===true&&sc.nonHistorical===true))throw new Error('DEDICATED_SYNTHETIC_SHOPPER_NOT_EXACT');

            const members=await tenant.collection('users').get();
            for(const d of members.docs){
              const m=d.data()||{},role=String(m.role||'');
              if(m.active!==true||!['super','admin'].includes(role)||String(m.authNamespace||'')!=='staff')continue;
              if(role!=='super'&&!(Array.isArray(m.projectIds)&&m.projectIds.includes(r.projectId)))continue;
              try{const u=await auth.getUser(d.id),c=u.customClaims||{};if(c.tenantId===r.tenantId&&c.role===role&&String(c.authNamespace||'staff')==='staff'&&(role==='super'||(Array.isArray(c.projectIds)&&c.projectIds.includes(r.projectId)))){operator={uid:d.id,role};break;}}catch{}
            }
            if(!operator)throw new Error('EXISTING_OPERATOR_ACTOR_NOT_PROVEN');
            evidence.actors.operatorUidFingerprint=fingerprint(operator.uid);
            shopperToken=await exchangeCustomToken(shopperUid);operatorToken=await exchangeCustomToken(operator.uid);

            await visitRef.create({id:visitId,visitId,tenantId:r.tenantId,projectId:r.projectId,estado:'disponible',status:'disponible',shopperId:null,shopper:null,hrRowId:null,source:'i4b-synthetic-e2e',sourceRequestId:r.requestId,synthetic:true,nonHistorical:true,nonHr:true,testFixture:true,version:1,createdAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});
            evidence.counters.syntheticFixtureCreates++;
            const provider=createVisitLifecycleProvider({auth,db,gate:r});

            const appCreate=command('application.create','application',applicationId,'absent',{visitId,shopperId,proposedDate:'2026-08-20',note:'synthetic-e2e'},'shopper','application-create');
            await run(shopperToken,appCreate,'application.create');
            const replay=await run(shopperToken,appCreate,'application.create idempotent replay');
            if(!(replay.idempotentReplay===true&&Number(replay.providerWrites||0)===0))throw new Error('IDEMPOTENT_REPLAY_NOT_PROVEN');
            evidence.counters.idempotentReplayChecks++;

            await run(operatorToken,command('application.status.update','application',applicationId,await getVersion(appRef),{applicationId,visitId,status:'aprobada',reason:'synthetic-e2e'},operator.role,'application-approve'),'application.status.update aprobada');
            await run(shopperToken,command('visit.state.update','visit',visitId,await getVersion(visitRef),{visitId,shopperId,patch:{estado:'agendada',agendada:'2026-08-20'}},'shopper','visit-schedule'),'visit.state.update agendada');
            await run(shopperToken,command('visit.reschedule','visit',visitId,await getVersion(visitRef),{visitId,newDate:'2026-08-21',reason:'synthetic-request',requestedByShopper:true},'shopper','reschedule-request'),'visit.reschedule shopper request');
            await run(operatorToken,command('visit.reschedule','visit',visitId,await getVersion(visitRef),{visitId,newDate:'2026-08-21',reason:'synthetic-approved',decision:'approved'},operator.role,'reschedule-approved'),'visit.reschedule operator approved');
            await run(shopperToken,command('visit.cancel','visit',visitId,await getVersion(visitRef),{visitId,reason:'synthetic-cancel-request',requestOnly:true},'shopper','cancel-request'),'visit.cancel shopper request-only');
            await run(shopperToken,command('visit.state.update','visit',visitId,await getVersion(visitRef),{visitId,shopperId,patch:{estado:'realizada',realizada:'2026-08-21'}},'shopper','visit-realized'),'visit.state.update realizada');
            await run(shopperToken,command('visit.questionnaire.submit','visit',visitId,await getVersion(visitRef),{visitId,shopperId,result:{synthetic:true,score:100},completedAt:'2026-08-21'},'shopper','questionnaire-submit'),'visit.questionnaire.submit');
            await run(operatorToken,command('visit.review.update','visit',visitId,await getVersion(visitRef),{visitId,reviewStatus:'approved_for_submitido',note:'synthetic-e2e'},operator.role,'review-approved'),'visit.review.update');

            const versionBeforeConflict=await getVersion(visitRef);
            let conflict=false;
            try{evidence.counters.providerCommandCalls++;await provider.execute(operatorToken,command('visit.review.update','visit',visitId,1,{visitId,reviewStatus:'in_review',note:'must-conflict'},operator.role,'version-conflict'));}
            catch(e){conflict=String(e?.message||e).includes('I4B_EXPECTED_VERSION_CONFLICT');}
            if(!conflict)throw new Error('EXPECTED_VERSION_CONFLICT_NOT_PROVEN');
            if(String(await getVersion(visitRef))!==String(versionBeforeConflict))throw new Error('VERSION_CONFLICT_MUTATED_VISIT');
            evidence.counters.versionConflictChecks++;
            evidence.steps.push({label:'expectedVersion conflict',pass:true,providerAck:false,blockedBeforeMutation:true});

            const finalVisit=(await visitRef.get()).data()||{},finalApp=(await appRef.get()).data()||{};
            evidence.checks.finalVisitState=finalVisit.estado==='cuestionario';
            evidence.checks.reviewStatus=finalVisit.reviewStatus==='approved_for_submitido';
            evidence.checks.applicationApproved=finalApp.estado==='aprobada';
            evidence.checks.assignmentSource=finalVisit.assignmentSource==='platform';
            evidence.checks.assignmentSyncPending=finalVisit.assignmentSyncStatus==='pending';
            evidence.checks.shopperExact=finalVisit.shopperId===shopperId;
            evidence.checks.cancelRequestOnly=finalVisit.cancelRequest?.status==='pending_review';
            evidence.checks.rescheduleApproved=finalVisit.rescheduleRequest?.status==='approved'&&finalVisit.agendada==='2026-08-21';
            if(Object.values(evidence.checks).some(v=>v!==true))throw new Error('FINAL_STATE_ASSERTION_FAILED');

            const receiptQuery=await tenant.collection('commandReceipts').where('tenantId','==',r.tenantId).where('projectId','==',r.projectId).get();
            const relevantReceipts=receiptQuery.docs.filter(d=>String(d.data()?.commandType||'')&&String(d.data()?.actorUid||'')&&['application.create','application.status.update','visit.state.update','visit.reschedule','visit.cancel','visit.questionnaire.submit','visit.review.update'].includes(String(d.data()?.commandType||''))).filter(d=>String(d.data()?.entityId||'')===visitId||String(d.data()?.entityId||'')===applicationId);
            evidence.counters.receiptDocsObserved=relevantReceipts.length;
            const auditQuery=await tenant.collection('entityAuditTrail').where('projectId','==',r.projectId).get();
            const relevantAudits=auditQuery.docs.filter(d=>[visitId,applicationId].includes(String(d.data()?.entityId||'')));
            evidence.counters.auditDocsObserved=relevantAudits.length;
            if(relevantReceipts.length<9||relevantAudits.length<9)throw new Error('RECEIPT_AUDIT_TRACE_INCOMPLETE');

            evidence.decision='PASS_I4B_SINGLE_DEV_VISIT_LIFECYCLE_E2E_WRITE_GATE__SYNTHETIC_VISIT_ONLY';
          } catch(e){
            evidence.errors.push(String(e?.message||e));
            evidence.decision='HOLD_I4B_SINGLE_DEV_VISIT_LIFECYCLE_E2E_WRITE_GATE__'+String(e?.message||e).replace(/[^A-Za-z0-9_]+/g,'_').slice(0,120);
          } finally {
            try{if((await appRef.get()).exists){await appRef.delete();evidence.counters.syntheticFixtureDeletes++;}}catch(e){evidence.errors.push('APP_CLEANUP:'+String(e?.message||e));}
            try{if((await visitRef.get()).exists){await visitRef.delete();evidence.counters.syntheticFixtureDeletes++;}}catch(e){evidence.errors.push('VISIT_CLEANUP:'+String(e?.message||e));}
            try{
              const afterVisits=await visits.get(),afterPosts=await posts.get();
              evidence.checks.syntheticVisitRemoved=!afterVisits.docs.some(d=>d.id===visitId);
              evidence.checks.syntheticApplicationRemoved=!afterPosts.docs.some(d=>d.id===applicationId);
              evidence.checks.realVisitsUnchanged=beforeVisitDigest?digestDocs(afterVisits.docs)===beforeVisitDigest:false;
              evidence.checks.realPostulationsUnchanged=beforePostDigest?digestDocs(afterPosts.docs)===beforePostDigest:false;
              evidence.safety.realHrVisitMutation=evidence.checks.realVisitsUnchanged!==true;
              if(evidence.checks.syntheticVisitRemoved!==true||evidence.checks.syntheticApplicationRemoved!==true||evidence.checks.realVisitsUnchanged!==true||evidence.checks.realPostulationsUnchanged!==true){evidence.decision='HOLD_I4B_E2E_CLEANUP_OR_REAL_DATA_INVARIANT_FAILED';}
            }catch(e){evidence.errors.push('POST_INVARIANT:'+String(e?.message||e));evidence.decision='HOLD_I4B_E2E_POST_INVARIANT_UNPROVEN';}
            writeEvidence();
          }
          console.log(JSON.stringify({decision:evidence.decision,workflowRunId:evidence.workflowRunId,steps:evidence.steps.length,providerCommandCalls:evidence.counters.providerCommandCalls,providerWritesReported:evidence.counters.providerWritesReported,syntheticFixtureDeletes:evidence.counters.syntheticFixtureDeletes,realVisitsUnchanged:evidence.checks.realVisitsUnchanged,realPostulationsUnchanged:evidence.checks.realPostulationsUnchanged,errors:evidence.errors}));
          if(!evidence.decision.startsWith('PASS_'))process.exit(1);
          NODE

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-i4b-single-dev-visit-lifecycle-e2e-evidence
          path: |
            .tmp/i4b-single-dev-visit-lifecycle-e2e/evidence.json
            .tmp/i4b-single-dev-visit-lifecycle-e2e/source-truth.json
            .tmp/i4b-single-dev-visit-lifecycle-e2e/provider-source.json
          if-no-files-found: error
          retention-days: 14
