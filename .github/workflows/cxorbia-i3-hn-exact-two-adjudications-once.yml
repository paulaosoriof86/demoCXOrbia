name: CXOrbia I3 HN Exact Two DEV Identity Adjudications Once
on:
  push:
    branches: [recovery/cxorbia-phase-a-20260831]
    paths:
      - .github/workflows/cxorbia-i3-hn-exact-two-adjudications-once.yml
      - firebase/auth-dev-tools/cxorbia-i3-hn-exact-two-identity-adjudication-once.mjs
permissions:
  contents: read
concurrency:
  group: cxorbia-i3-hn-exact-two-adjudications-once
  cancel-in-progress: false
jobs:
  exactly-two-hn-provider-adjudications:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'I3-HN-EXACT-TWO-ADJUDICATION-DEV-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDSDK_CORE_PROJECT: cxorbia-backend-dev
      GCLOUD_PROJECT: cxorbia-backend-dev
      GOOGLE_CLOUD_PROJECT: cxorbia-backend-dev
      CX_HN_EXACT_EXECUTION: PAULA_APPROVED_2026-10-28_TWO_EXACT_HN_DEV_IDENTITIES_ONLY
      CX_HN_ADJUDICATION_OUT: .tmp/i3-hn-exact-two-adjudication
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked identity, project, source and production guards
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = 'recovery/cxorbia-phase-a-20260831'
          test "${GITHUB_EVENT_NAME}" = push
          test "$(jq -r '.production' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = DO_NOT_TOUCH
          test "$(jq -r '.authorizationI4' CXORBIA_RECOVERY_EXECUTION_CURRENT.json)" = false
          git merge-base --is-ancestor 6839a669 HEAD
          git diff --quiet 6839a669 HEAD -- app backend firebase.json .firebaserc firestore.rules storage.rules
          node --check firebase/auth-dev-tools/cxorbia-i3-hn-exact-two-identity-adjudication-once.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}'
      - name: Install only established QA dependencies
        run: |
          set -Eeuo pipefail
          npm install --prefix firebase/auth-dev-tools --no-save --no-package-lock --ignore-scripts firebase-admin@13.4.0 playwright@1.56.1 >/dev/null 2>&1
          ./firebase/auth-dev-tools/node_modules/.bin/playwright install --with-deps chromium >/dev/null 2>&1
      - name: Execute bounded provider writes only after BOTH preflights pass
        run: |
          set -Eeuo pipefail
          node firebase/auth-dev-tools/cxorbia-i3-hn-exact-two-identity-adjudication-once.mjs
          test "$(jq -r '.decision' "$CX_HN_ADJUDICATION_OUT/result.json")" = PASS_TWO_EXACT_HN_PROVIDER_ADJUDICATIONS
          test "$(jq -r '.readback' "$CX_HN_ADJUDICATION_OUT/result.json")" = true
          test "$(jq -r '.providerAck' "$CX_HN_ADJUDICATION_OUT/result.json")" = true
          test "$(jq -r '.hrWrites' "$CX_HN_ADJUDICATION_OUT/result.json")" = 0
          test "$(jq -r '.production' "$CX_HN_ADJUDICATION_OUT/result.json")" = false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxorbia-i3-hn-exact-two-adjudications-${{ github.run_id }}
          path: .tmp/i3-hn-exact-two-adjudication/
          if-no-files-found: warn
          retention-days: 30
