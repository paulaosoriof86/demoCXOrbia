name: CXOrbia Canonical Backend Anomaly Probe

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - '.github/cxorbia-firebase-requests/canonical-backend-anomaly-probe.json'

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate request
        run: |
          node <<'NODE'
          const r=require('./.github/cxorbia-firebase-requests/canonical-backend-anomaly-probe.json');
          if(r.enabled!==true||r.mode!=='READ_ONLY_TWO_OVERAGE_PROBE'||r.providerWrites!==0||r.production!==false||r.merge!==false) process.exit(1);
          NODE
      - name: Load canonical DEV credential
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/canonical-anomaly-private
          node <<'NODE'
          const fs=require('fs'); const raw=process.env.EXISTING_DEV_JSON||''; let p=null; try{p=JSON.parse(raw)}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.private_key&&p.client_email)) process.exit(1);
          fs.writeFileSync('.tmp/canonical-anomaly-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/canonical-anomaly-private/credentials.json" >> "$GITHUB_ENV"
      - name: Install transient Firebase Admin
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Run read-only anomaly probe
        run: node tools/qa/cxorbia-canonical-backend-anomaly-probe.mjs
      - name: Commit sanitized evidence on latest branch head
        run: |
          set -euo pipefail
          cp app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.json /tmp/anomaly.json
          cp app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.md /tmp/anomaly.md
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/anomaly.json app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.json
          cp /tmp/anomaly.md app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.json app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.md
          if ! git diff --cached --quiet; then git commit -m 'evidence: probe canonical visit overages'; git push origin HEAD:docs-tya-v6-v71-audit; fi
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=error; DESC='HOLD_CANONICAL_BACKEND_ANOMALY_PROBE'
          if [ -f app/docs/evidence/CANONICAL-BACKEND-ANOMALY-PROBE-LATEST.json ]; then STATE=success; DESC='PASS_READONLY_TWO_OVERAGE_PROBE'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context='cxorbia/canonical-backend-anomaly-probe' -f description="$DESC" >/dev/null
      - name: Cleanup
        if: always()
        run: rm -rf .tmp/canonical-anomaly-private
