name: CXOrbia Corte 6 Credential Continuity Read-Only

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-credential-continuity-readonly-request.json'
      - 'tools/qa/cxorbia-corte6-credential-continuity-readonly.mjs'
      - '.github/workflows/cxorbia-corte6-credential-continuity-readonly.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-corte6-credential-continuity-readonly
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read request
        id: gate
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const r=require('./backend/config/corte6-credential-continuity-readonly-request.json');
          if(r.schemaVersion!=='cxorbia.corte6.credential-continuity-readonly-request.v1') throw new Error('bad_schema');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.firebaseProjectId!=='cxorbia-backend-dev'||r.tenantId!=='tya'||r.projectId!=='cinepolis') throw new Error('target_mismatch');
          for(const k of ['providerWrites','authWrites','passwordChanges','firestoreWrites','rulesDeploys','hostingDeploys','storageWrites','hrWrites','legacyWrites']) if(r[k]!==0) throw new Error('unsafe_write_flag:'+k);
          if(r.production!==false||r.merge!==false||r.piiExported!==false||r.credentialValuesExported!==false||r.secretsExported!==false) throw new Error('unsafe_scope');
          const execute=r.enabled===true&&r.consumed===false&&r.status==='ready';
          console.log('execute='+(execute?'true':'false'));
          NODE

      - name: Setup Node
        if: steps.gate.outputs.execute == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Load canonical DEV credential
        if: steps.gate.outputs.execute == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/corte6-credential-continuity-private
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null; try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key)) throw new Error('credential_invalid');
          fs.writeFileSync('.tmp/corte6-credential-continuity-private/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/corte6-credential-continuity-private/credentials.json" >> "$GITHUB_ENV"

      - name: Run source-safe credential continuity inventory
        id: inventory
        if: steps.gate.outputs.execute == 'true'
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_TENANT_ID: tya
          CXORBIA_PROJECT_ID: cinepolis
          CXORBIA_CREDENTIAL_CONTINUITY_OUT: app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-READONLY-LATEST.json
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node --check tools/qa/cxorbia-corte6-credential-continuity-readonly.mjs
          node tools/qa/cxorbia-corte6-credential-continuity-readonly.mjs

      - name: Persist sanitized evidence and freeze request
        if: steps.gate.outputs.execute == 'true' && steps.inventory.outcome == 'success'
        run: |
          set -euo pipefail
          cp app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-READONLY-LATEST.json /tmp/c6-cred-continuity.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/c6-cred-continuity.json app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-READONLY-LATEST.json
          node <<'NODE'
          const fs=require('fs');
          const p='backend/config/corte6-credential-continuity-readonly-request.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.status='consumed_readonly';
          r.enabled=false;
          r.consumed=true;
          r.consumedAt=new Date().toISOString();
          r.nextGate='DECIDE_CREDENTIAL_CONTINUITY_ADAPTER_WITHOUT_FORCING_EMAIL_LOGIN';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-READONLY-LATEST.json backend/config/corte6-credential-continuity-readonly-request.json
          git commit -m 'evidence: credential continuity read-only inventory'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success
          DESC='PASS_C6_CREDENTIAL_CONTINUITY_READONLY_INACTIVE'
          if [ '${{ steps.gate.outputs.execute }}' = 'true' ]; then DESC='PASS_C6_CREDENTIAL_CONTINUITY_READONLY'; fi
          if [ '${{ job.status }}' != 'success' ]; then STATE=error; DESC='FAIL_C6_CREDENTIAL_CONTINUITY_READONLY'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-credential-continuity/${DESC}" -f description="$DESC" >/dev/null

      - name: Cleanup credential
        if: always()
        run: rm -rf .tmp/corte6-credential-continuity-private
