name: CXOrbia Corte 6 Protected Runtime Hosting DEV

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-credential-continuity-hosting-request.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-corte6-protected-runtime-hosting
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact protected DEV authorization
        id: gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('backend/config/corte6-credential-continuity-hosting-request.json','utf8'));
          if(r.schemaVersion!=='cxorbia.corte6.credential-continuity-hosting-request.v1') throw new Error('schema_mismatch');
          if(r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.firebaseProjectId!=='cxorbia-backend-dev'||r.hostingSite!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.tenantId!=='tya'||r.projectId!=='cinepolis') throw new Error('identity_mismatch');
          if(r.singleHostingDeployMax!==1||r.hostingDeployExecutions!==0||r.createFirebaseProject!==false||r.createHostingSite!==false) throw new Error('one_shot_target_mismatch');
          if(r.enabled!==true||r.status!=='authorized_waiting_execute'||r.consumed!==false||r.authorizedBy!=='Paula'||!r.authorizationText||!r.authorizationId) throw new Error('authorization_missing');
          if(r.scope!=='single_existing_dev_hosting_redeploy_for_protected_runtime_human_visual'||r.protectedRuntimeRequired!==true) throw new Error('protected_scope_mismatch');
          for(const k of ['authWrites','firestoreWrites','rulesDeploys','storageWrites','hrWrites','legacyWrites','paymentsWrites','functionsDeploys','makeWrites','geminiCalls','cloudRunDeploys']) if(Number(r[k]||0)!==0) throw new Error('unsafe:'+k);
          if(r.production!==false||r.merge!==false) throw new Error('unsafe_scope');
          console.log(JSON.stringify({decision:'AUTHORIZED_PROTECTED_HOSTING_EXECUTION_READY',authorizationId:r.authorizationId}));
          NODE

      - name: Static protected runtime contract
        run: |
          set -euo pipefail
          node --check app/core/backend-browser-auth.js
          node --check app/core/backend-config-preview-dev.js
          node --check app/core/backend-protected-dev-mode.js
          node --check app/core/backend-firebase.js
          node --check app/adapters/tya-live-source-refresh-watch.js
          node --check tools/release/cxorbia-corte6-credential-continuity-hosting-prepare.mjs
          node --check tools/release/cxorbia-existing-hosting-dev-direct-deploy.mjs
          grep -q "YES_PAULA_20260730_PROTECTED_DEV" app/core/backend-protected-dev-mode.js
          grep -q "humanVisualSourceSafe:false" app/core/backend-protected-dev-mode.js
          grep -q "enabled:true" app/core/backend-protected-dev-mode.js
          grep -q "readOnly:true" app/core/backend-protected-dev-mode.js
          grep -q "writeMode:'disabled'" app/core/backend-protected-dev-mode.js
          grep -q "backend-protected-dev-mode.js" app/index-backend-dev.html
          grep -q "protectedRequested" app/core/backend-config-preview-dev.js
          grep -q "Carril protegido solicitado" app/core/backend-config-preview-dev.js
          grep -q "SHOPPER_SCOPE_REQUIRED" app/core/backend-browser-auth.js
          grep -q "ctx.shopperId" app/core/backend-browser-auth.js
          grep -q "loadAuthorizedShoppers" app/core/backend-firebase.js
          grep -q "visitsForShopper" app/core/backend-protected-dev-mode.js
          grep -q "submitida" app/core/backend-protected-dev-mode.js
          grep -q "if(!Object.prototype.hasOwnProperty.call(s,'pass')) s.pass=''" app/core/backend-protected-dev-mode.js
          grep -q "humanVisualSourceSafe: true" app/core/backend-config-preview-dev.js
          grep -q "enabled: false" app/core/backend-config-preview-dev.js

      - name: Load canonical DEV service account
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-credential-continuity-hosting
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync('.tmp/c6-credential-continuity-hosting/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-credential-continuity-hosting/credentials.json" >> "$GITHUB_ENV"

      - name: Build exact existing Hosting DEV package
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_EXPECTED_SITE: cxorbia-backend-dev
          CXORBIA_HOSTING_REQUEST: backend/config/corte6-credential-continuity-hosting-request.json
          CXORBIA_IMPORT_EVIDENCE: app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json
          CXORBIA_HOSTING_OUT_DIR: .tmp/corte6-credential-continuity-hosting
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node tools/release/cxorbia-corte6-credential-continuity-hosting-prepare.mjs
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('backend/config/corte6-credential-continuity-hosting-request.json','utf8'));
          const proof={schemaVersion:'cxorbia.corte6-protected-runtime-hosting-proof.v1',generatedAt:new Date().toISOString(),authorizationId:r.authorizationId,environment:'DEV',firebaseProjectId:'cxorbia-backend-dev',hostingSite:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',tenantId:'tya',projectId:'cinepolis',entrypoint:'/index-backend-dev.html?cxBackendPreview=YES_PAULA_20260628_PREVIEW_DEV&cxProjectId=cinepolis&cxProtectedRuntime=YES_PAULA_20260730_PROTECTED_DEV',protectedRuntime:true,authMode:'firebase-auth-custom-claims-rbac',readOnly:true,writeMode:'disabled',firestoreWrites:0,authWrites:0,rulesDeploys:0,cloudRunDeploys:0,storageWrites:0,hrWrites:0,legacyWrites:0,production:false,merge:false};
          fs.writeFileSync('.tmp/corte6-credential-continuity-hosting/site/corte6-protected-runtime-proof.json',JSON.stringify(proof,null,2)+'\n','utf8');
          NODE

      - name: Deploy once through official Firebase Hosting REST API
        id: deploy
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_EXPECTED_SITE: cxorbia-backend-dev
          CXORBIA_HOSTING_OUT_DIR: .tmp/corte6-credential-continuity-hosting
          CXORBIA_HOSTING_SITE_DIR: .tmp/corte6-credential-continuity-hosting/site
          CXORBIA_HOSTING_CONFIG: .tmp/corte6-credential-continuity-hosting/firebase.hosting.json
          CXORBIA_HOSTING_PREFLIGHT: .tmp/corte6-credential-continuity-hosting/preflight.source-safe.json
          CXORBIA_HOSTING_DEPLOY_REPORT: .tmp/corte6-credential-continuity-hosting/direct-deploy.source-safe.json
          CXORBIA_EXECUTE_HOSTING: 'true'
        run: |
          set -euo pipefail
          node tools/release/cxorbia-existing-hosting-dev-direct-deploy.mjs

      - name: Verify remote protected runtime package
        id: remote
        run: |
          set -euo pipefail
          BASE='https://cxorbia-backend-dev.web.app'
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-config-preview-dev.js" -o /tmp/preview.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-protected-dev-mode.js" -o /tmp/protected.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-browser-auth.js" -o /tmp/auth.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-firebase.js" -o /tmp/firebase.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/index-backend-dev.html" -o /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/corte6-protected-runtime-proof.json" -o /tmp/proof.json
          grep -q "YES_PAULA_20260730_PROTECTED_DEV" /tmp/protected.js
          grep -q "humanVisualSourceSafe:false" /tmp/protected.js
          grep -q "writeMode:'disabled'" /tmp/protected.js
          grep -q "visitsForShopper" /tmp/protected.js
          grep -q "submitida" /tmp/protected.js
          grep -q "protectedRequested" /tmp/preview.js
          grep -q "SHOPPER_SCOPE_REQUIRED" /tmp/auth.js
          grep -q "loadAuthorizedShoppers" /tmp/firebase.js
          grep -q "backend-protected-dev-mode.js" /tmp/index.html
          node <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/proof.json','utf8'));
          if(p.schemaVersion!=='cxorbia.corte6-protected-runtime-hosting-proof.v1'||p.firebaseProjectId!=='cxorbia-backend-dev'||p.hostingSite!=='cxorbia-backend-dev'||p.protectedRuntime!==true||p.authMode!=='firebase-auth-custom-claims-rbac'||p.readOnly!==true||p.writeMode!=='disabled'||p.production!==false)throw new Error('remote_proof_mismatch');
          const d=JSON.parse(fs.readFileSync('.tmp/corte6-credential-continuity-hosting/direct-deploy.source-safe.json','utf8'));
          const e={schemaVersion:'cxorbia.corte6-protected-runtime-hosting-deploy.v1',generatedAt:new Date().toISOString(),decision:'PASS_EXISTING_HOSTING_DEV_PROTECTED_RUNTIME_REMOTE_VERIFIED',authorizationId:p.authorizationId,projectId:'cxorbia-backend-dev',hostingSite:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',versionName:d.versionName,releaseName:d.releaseName,hostingDeployExecutions:1,remote:{protectedRuntimeAssets:true,authBridge:true,firestoreAdapter:true,shopperScopeFailClosed:true,profileBridge:true,historyKpiIncludesSubmitted:true,sourceSafeDefaultPreserved:true},safety:{firestoreWrites:0,authWrites:0,rulesDeploys:0,cloudRunDeploys:0,storageWrites:0,hrWrites:0,legacyWrites:0,makeWrites:0,geminiCalls:0,paymentsWrites:0,production:false,merge:false,piiExported:false,secretsExported:false}};
          fs.writeFileSync('/tmp/c6-protected-hosting-evidence.json',JSON.stringify(e,null,2)+'\n','utf8');
          NODE

      - name: Persist sanitized evidence and consume one-shot authorization
        run: |
          set -euo pipefail
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/c6-protected-hosting-evidence.json app/docs/evidence/CORTE6-PROTECTED-RUNTIME-HOSTING-DEPLOY-LATEST.json
          node <<'NODE'
          const fs=require('fs');const p='backend/config/corte6-credential-continuity-hosting-request.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));const e=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-PROTECTED-RUNTIME-HOSTING-DEPLOY-LATEST.json','utf8'));
          if(e.decision!=='PASS_EXISTING_HOSTING_DEV_PROTECTED_RUNTIME_REMOTE_VERIFIED'||e.hostingDeployExecutions!==1)throw new Error('evidence_contract_mismatch');
          r.status='consumed_pass';r.enabled=false;r.consumed=true;r.consumedAt=new Date().toISOString();r.hostingDeployExecutions=1;r.decision=e.decision;r.versionName=e.versionName;r.releaseName=e.releaseName;r.nextGate='HUMAN_VISUAL_ADMIN_SHOPPER_PROTECTED_RUNTIME';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-PROTECTED-RUNTIME-HOSTING-DEPLOY-LATEST.json backend/config/corte6-credential-continuity-hosting-request.json
          git commit -m 'evidence: Corte 6 protected Hosting DEV remote PASS'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=success;DESC='PASS_C6_PROTECTED_RUNTIME_HOSTING'
          if [ '${{ job.status }}' != 'success' ]; then STATE=error;DESC='FAIL_C6_PROTECTED_RUNTIME_HOSTING'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-protected-runtime-hosting/$DESC" -f description="$DESC" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf .tmp/c6-credential-continuity-hosting
