name: CXOrbia Corte 6 Credential Continuity Hosting DEV

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-credential-continuity-hosting-request.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: cxorbia-corte6-credential-continuity-hosting
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate request gate
        id: gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('backend/config/corte6-credential-continuity-hosting-request.json','utf8'));
          if(r.schemaVersion!=='cxorbia.corte6.credential-continuity-hosting-request.v1'||r.repository!=='paulaosoriof86/demoCXOrbia'||r.branch!=='docs-tya-v6-v71-audit'||r.firebaseProjectId!=='cxorbia-backend-dev'||r.hostingSite!=='cxorbia-backend-dev'||r.hostingTarget!=='cxorbia-dev'||r.tenantId!=='tya'||r.projectId!=='cinepolis') throw new Error('identity_mismatch');
          if(r.singleHostingDeployMax!==1||r.createFirebaseProject!==false||r.createHostingSite!==false) throw new Error('one_shot_target_mismatch');
          for(const k of ['authWrites','firestoreWrites','rulesDeploys','storageWrites','hrWrites','legacyWrites','paymentsWrites','functionsDeploys','makeWrites','geminiCalls']) if(r[k]!==0) throw new Error('unsafe:'+k);
          if(r.production!==false||r.merge!==false) throw new Error('unsafe_scope');
          const authorizedWaiting=r.enabled===true&&r.status==='authorized_waiting_execute'&&r.consumed===false&&r.hostingDeployExecutions===0&&r.authorizedBy==='Paula'&&typeof r.authorizationText==='string'&&r.authorizationText.length>10&&typeof r.authorizationId==='string'&&r.authorizationId.length>5;
          const consumedHistorical=r.enabled===false&&r.status==='consumed_pass'&&r.consumed===true&&r.hostingDeployExecutions===1;
          if(!authorizedWaiting&&!consumedHistorical) throw new Error('one_shot_state_mismatch');
          const execute=authorizedWaiting;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`execute=${execute?'true':'false'}\n`);
          console.log(execute?'AUTHORIZED_HOSTING_EXECUTION_READY':'STATIC_REVALIDATION_ONLY_NO_PROVIDER_WRITE');
          NODE
      - name: Static source checks
        run: |
          set -euo pipefail
          node --check app/core/backend-browser-auth.js
          node --check app/core/backend-config-preview-dev.js
          node --check app/core/backend-cxdata-readonly-corte4.js
          node --check app/core/backend-preview-status.js
          node --check tools/release/cxorbia-corte6-credential-continuity-hosting-prepare.mjs
          node --check tools/release/cxorbia-existing-hosting-dev-direct-deploy.mjs
          grep -q 'humanVisualSourceSafe: true' app/core/backend-config-preview-dev.js
          grep -q 'enabled: false' app/core/backend-config-preview-dev.js
          grep -q 'humanCredentialPrompt: false' app/core/backend-config-preview-dev.js
          grep -q "mode: 'provider-gates-separate-from-human-visual'" app/core/backend-config-preview-dev.js
          ! grep -q "mode: 'product-login-session'" app/core/backend-config-preview-dev.js
          ! grep -q "mode: 'interactive-session'" app/core/backend-config-preview-dev.js
          grep -q 'applyHumanSourceSafe' app/core/backend-cxdata-readonly-corte4.js
          grep -q 'backend-source-safe-ready' app/core/backend-cxdata-readonly-corte4.js
          grep -q 'HR source-safe · validación visual' app/core/backend-preview-status.js
          grep -q 'this.selectRole(b.dataset.role)' app/app.js
          ! grep -q 'cxBackendAuthGate' app/core/backend-browser-auth.js
          ! grep -q 'cxBackendAuthNamespace' app/core/backend-browser-auth.js
          ! grep -q 'cxBackendAuthLogin' app/core/backend-browser-auth.js
          node <<'NODE'
          global.window={};
          require('./app/data/tya-hr-source-safe-periods.js');
          const s=window.CX_TYA_HR_SOURCE_SAFE;
          if(!s||s.projectId!=='cinepolis'||!Array.isArray(s.periods)||s.periods.length!==14||!Array.isArray(s.visits)||s.visits.length!==616||s.sourceSafe!==true) throw new Error('source_safe_baseline_mismatch');
          console.log(JSON.stringify({decision:'PASS_HUMAN_VISUAL_SOURCE_SAFE_STATIC',periods:s.periods.length,visits:s.visits.length,projectId:s.projectId,sourceSafe:s.sourceSafe}));
          NODE
      - name: Load canonical DEV service account
        if: steps.gate.outputs.execute == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/c6-credential-continuity-hosting
          node <<'NODE'
          const fs=require('fs');const raw=process.env.EXISTING_DEV_JSON||'';let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync('.tmp/c6-credential-continuity-hosting/credentials.json',raw,{mode:0o600});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GITHUB_WORKSPACE}/.tmp/c6-credential-continuity-hosting/credentials.json" >> "$GITHUB_ENV"
      - name: Build exact existing Hosting DEV package
        if: steps.gate.outputs.execute == 'true'
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_EXPECTED_SITE: cxorbia-backend-dev
          CXORBIA_HOSTING_REQUEST: backend/config/corte6-credential-continuity-hosting-request.json
          CXORBIA_IMPORT_EVIDENCE: app/docs/evidence/CORTE6-CREDENTIAL-IMPORT-LATEST.json
          CXORBIA_HOSTING_OUT_DIR: .tmp/corte6-credential-continuity-hosting
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 >/dev/null 2>&1
          node tools/release/cxorbia-corte6-credential-continuity-hosting-prepare.mjs
      - name: Deploy once through official Firebase Hosting REST API
        id: deploy
        if: steps.gate.outputs.execute == 'true'
        env:
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_EXPECTED_SITE: cxorbia-backend-dev
          CXORBIA_HOSTING_OUT_DIR: .tmp/corte6-credential-continuity-hosting
          CXORBIA_HOSTING_SITE_DIR: .tmp/corte6-credential-continuity-hosting/site
          CXORBIA_HOSTING_CONFIG: .tmp/corte6-credential-continuity-hosting/firebase.hosting.json
          CXORBIA_HOSTING_PREFLIGHT: .tmp/corte6-credential-continuity-hosting/preflight.source-safe.json
          CXORBIA_HOSTING_DEPLOY_REPORT: .tmp/corte6-credential-continuity-hosting/direct-deploy.source-safe.json
          CXORBIA_EXECUTE_HOSTING: 'true'
        run: |
          set -euo pipefail
          node tools/release/cxorbia-existing-hosting-dev-direct-deploy.mjs
      - name: Verify remote prototype auto-entry human visual entrypoint
        id: remote
        if: steps.gate.outputs.execute == 'true' && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          BASE='https://cxorbia-backend-dev.web.app'
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-config-preview-dev.js" -o /tmp/backend-config-preview-dev.remote.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-cxdata-readonly-corte4.js" -o /tmp/backend-cxdata-readonly.remote.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/core/backend-preview-status.js" -o /tmp/backend-preview-status.remote.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/app.js" -o /tmp/app.remote.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/tya-hr-source-safe-periods.js" -o /tmp/tya-source-safe.remote.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/index-backend-dev.html" -o /tmp/index-backend-dev.remote.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/corte6-credential-continuity-proof.json" -o /tmp/c6-proof.remote.json
          grep -q 'humanVisualSourceSafe: true' /tmp/backend-config-preview-dev.remote.js
          grep -q 'enabled: false' /tmp/backend-config-preview-dev.remote.js
          grep -q 'humanCredentialPrompt: false' /tmp/backend-config-preview-dev.remote.js
          grep -q 'applyHumanSourceSafe' /tmp/backend-cxdata-readonly.remote.js
          grep -q 'HR source-safe · validación visual' /tmp/backend-preview-status.remote.js
          grep -q 'this.selectRole(b.dataset.role)' /tmp/app.remote.js
          grep -q 'backend-config-preview-dev.js' /tmp/index-backend-dev.remote.html
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};vm.createContext(sandbox);vm.runInContext(fs.readFileSync('/tmp/tya-source-safe.remote.js','utf8'),sandbox);
          const s=sandbox.window.CX_TYA_HR_SOURCE_SAFE;
          if(!s||s.projectId!=='cinepolis'||s.periods?.length!==14||s.visits?.length!==616||s.sourceSafe!==true)throw new Error('remote_source_safe_baseline_mismatch');
          const p=JSON.parse(fs.readFileSync('/tmp/c6-proof.remote.json','utf8'));
          if(p.schemaVersion!=='cxorbia.corte6-credential-continuity-hosting-proof.v1'||p.firebaseProjectId!=='cxorbia-backend-dev'||p.hostingSite!=='cxorbia-backend-dev'||p.authMode!=='provider-gates-separate-from-human-visual'||p.humanVisualMode!=='prototype-auto-entry-source-safe'||p.humanCredentialPrompt!==false||p.singleVisibleLogin!==true||p.parallelAuthGate!==false||p.sourceSafeVisual!==true||p.firebaseAuthValidatedSeparately!==true||p.preservedLegacyAuthUsers!==91||p.production!==false) throw new Error('remote_proof_mismatch');
          const d=JSON.parse(fs.readFileSync('.tmp/corte6-credential-continuity-hosting/direct-deploy.source-safe.json','utf8'));
          const e={schemaVersion:'cxorbia.corte6-human-visual-hosting-deploy.v1',generatedAt:new Date().toISOString(),decision:'PASS_EXISTING_HOSTING_DEV_PROTOTYPE_AUTO_ENTRY_SOURCE_SAFE_REMOTE_VERIFIED',projectId:'cxorbia-backend-dev',hostingSite:'cxorbia-backend-dev',hostingTarget:'cxorbia-dev',versionName:d.versionName,releaseName:d.releaseName,hostingDeployExecutions:1,remote:{entrypoint:true,prototypeAutoEntry:true,humanCredentialPrompt:false,sourceSafeVisual:true,periods:14,visits:616,projectId:'cinepolis',firebaseAuthValidatedSeparately:true},preservedLegacyAuthUsers:91,safety:{newFirebaseProject:false,newHostingSite:false,authWritesDuringHosting:0,firestoreDataWrites:0,rulesDeploys:0,storageWrites:0,hrWrites:0,legacyWrites:0,payments:0,functionsDeploys:0,production:false,merge:false,piiExported:false,secretsExported:false}};
          fs.writeFileSync('/tmp/c6-hosting-evidence.json',JSON.stringify(e,null,2)+'\n','utf8');
          NODE
      - name: Persist sanitized evidence and consume one-shot Hosting authorization
        if: steps.gate.outputs.execute == 'true' && steps.remote.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          cp /tmp/c6-hosting-evidence.json app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-HOSTING-DEPLOY-LATEST.json
          node <<'NODE'
          const fs=require('fs');const p='backend/config/corte6-credential-continuity-hosting-request.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));const e=JSON.parse(fs.readFileSync('app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-HOSTING-DEPLOY-LATEST.json','utf8'));
          r.status='consumed_pass';r.enabled=false;r.consumed=true;r.consumedAt=new Date().toISOString();r.hostingDeployExecutions=1;r.decision=e.decision;r.versionName=e.versionName;r.releaseName=e.releaseName;r.nextGate='HUMAN_VISUAL_PROTOTYPE_AUTO_ENTRY_SOURCE_SAFE';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add app/docs/evidence/CORTE6-CREDENTIAL-CONTINUITY-HOSTING-DEPLOY-LATEST.json backend/config/corte6-credential-continuity-hosting-request.json
          git commit -m 'evidence: Corte 6 prototype auto-entry human DEV remote PASS'
          git push origin HEAD:docs-tya-v6-v71-audit
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXEC='${{ steps.gate.outputs.execute }}'
          if [ "$EXEC" != 'true' ]; then STATE=success; DESC='PREPARED_C6_PROTOTYPE_AUTO_ENTRY_NO_EXECUTE';
          elif [ '${{ job.status }}' = 'success' ]; then STATE=success; DESC='PASS_C6_PROTOTYPE_AUTO_ENTRY_HOSTING';
          else STATE=error; DESC='FAIL_C6_PROTOTYPE_AUTO_ENTRY_HOSTING'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$STATE" -f context="cxorbia/corte6-credential-continuity-hosting/${DESC}" -f description="$DESC" >/dev/null
      - name: Cleanup
        if: always()
        run: rm -rf .tmp/c6-credential-continuity-hosting
