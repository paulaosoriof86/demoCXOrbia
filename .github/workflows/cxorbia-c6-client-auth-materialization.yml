name: CXOrbia C6 Client Access Repair And Phase A Runtime

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - 'backend/config/corte6-client-auth-materialization-request.json'

permissions:
  contents: write
  statuses: write
  id-token: write

concurrency:
  group: cxorbia-c6-client-access-repair-runtime
  cancel-in-progress: false

jobs:
  repair-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: cxorbia-backend-dev
      ROOT_URL: https://cxorbia-backend-dev.web.app
      REQUEST: backend/config/corte6-client-auth-materialization-request.json
      OUT: .tmp/c6-client-access-repair
      PRIVATE_DIR: .tmp/c6-client-access-private
      PRIVATE_SNAPSHOT: .tmp/c6-client-access-private/private-snapshot.json
      PRIVATE_E2E: .tmp/c6-client-access-private/private-e2e.json

    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          ref: docs-tya-v6-v71-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate existing Firebase DEV project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Install transient provider and browser tooling
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Execute authorized diagnosis repair rollback gate and accumulated runtime
        id: execution
        continue-on-error: true
        run: |
          set +e
          node tools/qa/cxorbia-c6-client-access-runtime-orchestrator.mjs "$REQUEST"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized result and consume one-shot authorization
        if: always()
        run: |
          set -euo pipefail
          test -f "$OUT/result.json"
          cp "$OUT/result.json" /tmp/c6-client-access-result.json
          git fetch origin docs-tya-v6-v71-audit
          git reset --hard origin/docs-tya-v6-v71-audit
          mkdir -p app/docs/evidence
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/c6-client-access-result.json','utf8'));
          const pass=e.decision==='PASS_C6_CLIENT_ACCESS_AND_PHASE_A_RUNTIME';
          const target=pass?'app/docs/evidence/CORTE6-CLIENT-ACCESS-RUNTIME-LATEST.json':'app/docs/evidence/CORTE6-CLIENT-ACCESS-RUNTIME-FAILURE-LATEST.json';
          fs.writeFileSync(target,JSON.stringify(e,null,2)+'\n','utf8');
          const p=process.env.REQUEST,r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.enabled=false;r.consumed=true;r.status=pass?'consumed_pass':'consumed_fail';r.consumedAt=new Date().toISOString();r.decision=e.decision;
          r.nextGate=pass?'AUDIT_CLOUD_V5_AND_APPLY_ONLY_FRONTEND_GO_DELTA':'STOP_RETRY_ROOT_CAUSE_REQUIRED';
          if(!pass)r.failedStage=e.failedStage||null;
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n','utf8');
          fs.writeFileSync('/tmp/c6-evidence-path',target+'\n','utf8');
          NODE
          EVIDENCE_PATH="$(cat /tmp/c6-evidence-path)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REQUEST" "$EVIDENCE_PATH"
          git commit -m 'evidence: C6 Client access and Phase A runtime result'
          git push origin HEAD:docs-tya-v6-v71-audit

      - name: Cleanup private material
        if: always()
        run: rm -rf "$PRIVATE_DIR"

      - name: Enforce final result
        if: always()
        run: test "${{ steps.execution.outputs.exit_code }}" = "0"
