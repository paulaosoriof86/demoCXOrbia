name: CXOrbia C6 Equivalent Universe Provider Readonly v2.2

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - backend/config/corte6-shopper-equivalent-universe-provider-readonly-v22-request.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: cxorbia-c6-equivalent-universe-provider-readonly-v22
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/corte6-shopper-equivalent-universe-provider-readonly-v22-request.json
  PLANNER_FILE: tools/qa/cxorbia-c6-shopper-deterministic-suffix-readonly.mjs
  CLASSIFIER_FILE: tools/qa/cxorbia-c6-shopper-login-collision-classification.mjs
  HELPER_FILE: tools/qa/cxorbia-c6-shopper-equivalent-universe.mjs
  CANONICAL_FILE: tools/qa/cxorbia-c6-shopper-identity-canonical-plan.mjs
  CONTRACT_FILE: backend/contracts/c6-shopper-deterministic-suffix-v1.json
  RAW_DIR: .tmp/c6-equivalent-universe-provider-v22-raw
  PLANNER_OUT_DIR: .tmp/c6-shopper-deterministic-suffix-readonly
  GENERIC_OUT_DIR: .tmp/cxorbia-readonly-post-gates-runner
  PRIVATE_DIR: .tmp/c6-equivalent-universe-provider-v22-private
  EXPORT_DIR: .tmp/c6-equivalent-universe-provider-v22-export
  DEV_ROOT_URL: https://cxorbia-backend-dev.web.app

jobs:
  readonly:
    name: One-shot provider revalidation against equivalent universe v2.2
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 40
          ref: docs-tya-v6-v71-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exclude ephemeral material
        run: printf '%s\n' '.tmp/' 'gha-creds-*.json' >> .git/info/exclude

      - name: Read request state
        id: request
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`enabled=${x.enabled===true?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target=${x.targetHeadSha||''}\n`);
          NODE

      - name: Validate exact one-shot authorization and source lock
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const blob=file=>execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim();
          const lastCommit=file=>execFileSync('git',['log','-1','--format=%H','--',file],{encoding:'utf8'}).trim();
          const ensure=(condition,code)=>{if(!condition)throw new Error(code);};
          ensure(x.schemaVersion==='cxorbia.c6.shopper-equivalent-universe-provider-readonly-v22-request.v1','request_schema_invalid');
          ensure(x.diagnosticContractVersion==='v2.2'&&x.equivalentUniverseVersion==='shopper-equivalent-universe-v1','contract_version_invalid');
          ensure(x.repository==='paulaosoriof86/demoCXOrbia'&&x.branch==='docs-tya-v6-v71-audit'&&Number(x.pullRequest)===7,'lane_invalid');
          ensure(x.enabled===true&&x.consumed===false&&x.status==='authorized_execute_once'&&x.authorizedBy==='Paula','authorization_state_invalid');
          ensure(Number(x.allowedExecutions)===1&&x.automaticRetry===false&&x.stopRetry===true,'one_shot_invalid');
          ensure(x.targetHeadSha===parent&&head!==parent,'target_head_invalid');
          ensure(changed.length===1&&changed[0]===process.env.REQUEST_FILE,'request_commit_scope_invalid:'+changed.join(','));
          ensure(x.sourceIntegrationCommitSha==='8fe5ad6dd185cce5ea3cdac06892f3144e8e5f0f','source_integration_commit_invalid');
          for(const file of [process.env.PLANNER_FILE,process.env.CLASSIFIER_FILE,process.env.HELPER_FILE,process.env.CONTRACT_FILE])ensure(lastCommit(file)===x.sourceIntegrationCommitSha,'source_commit_drift:'+file);
          ensure(blob(process.env.PLANNER_FILE)===x.expectedGitBlobSha.planner,'planner_blob_drift');
          ensure(blob(process.env.CLASSIFIER_FILE)===x.expectedGitBlobSha.classifier,'classifier_blob_drift');
          ensure(blob(process.env.HELPER_FILE)===x.expectedGitBlobSha.helper,'helper_blob_drift');
          ensure(blob(process.env.CONTRACT_FILE)===x.expectedGitBlobSha.contract,'contract_blob_drift');
          ensure(blob(process.env.CANONICAL_FILE)===x.expectedGitBlobSha.canonical,'canonical_blob_drift');
          const contract=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          ensure(contract.schemaVersion==='cxorbia.c6.shopper-deterministic-suffix.v2.2','contract_schema_invalid');
          ensure(contract.collisionReconciliation?.referenceUniverse===contract.collisionReconciliation?.plannerUniverse,'universes_not_equivalent');
          ensure(contract.collisionReconciliation?.equivalentUniverseVersion==='shopper-equivalent-universe-v1','universe_contract_invalid');
          ensure(contract.collisionReconciliation?.deltaOnlyMemberProvenanceExport===true,'delta_only_contract_invalid');
          ensure(contract.multiAuthResolution?.diagnosticVector?.fields?.includes('candidateFingerprint'),'candidate_fingerprint_contract_missing');
          ensure(x.providerReads===true&&x.providerWrites===false,'provider_scope_invalid');
          ensure(Number(x.expectedProfiles)===340&&Number(x.expectedPlanRows)===340,'population_or_plan_invalid');
          ensure(Number(x.expectedStableCredentialsMapped)===101&&Number(x.expectedStableCredentialsUnmapped)===8,'crosswalk_reference_invalid');
          ensure(x.policy==='DETERMINISTIC_TECHNICAL_SUFFIX'&&JSON.stringify(x.suffixLengths)===JSON.stringify([4,6,8]),'suffix_policy_invalid');
          for(const key of ['repositoryWrites','dataWrites','deploy','merge','production','firestoreWrites','authWrites','passwordChanges','passwordResets','membershipWrites','rulesWrites','storageWrites','hrWrites','make','gemini','payments'])ensure(x.safeState?.[key]===false,'unsafe_scope_'+key);
          NODE

      - name: Install transient audit dependency
        if: steps.request.outputs.enabled == 'true'
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-admin@13.4.0

      - name: Execute source and static preflight
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node --check "$PLANNER_FILE"
          node --check "$CLASSIFIER_FILE"
          node --check "$HELPER_FILE"
          node "$HELPER_FILE" --self-test
          node "$PLANNER_FILE" --self-test
          node <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync(process.env.PLANNER_FILE,'utf8');
          const c=fs.readFileSync(process.env.CLASSIFIER_FILE,'utf8');
          const h=fs.readFileSync(process.env.HELPER_FILE,'utf8');
          const k=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const ensure=(v,code)=>{if(!v)throw new Error(code);};
          for(const token of ['resolveEquivalentNames','equivalentActive','reconcileEquivalentGroupSets','buildPlannerMemberVector','stableAuthCandidateFingerprint'])ensure(p.includes(token),'planner_missing:'+token);
          for(const token of ['resolveEquivalentNames','equivalentActive','buildReferenceMemberVector','stableAuthCandidateFingerprint'])ensure(c.includes(token),'classifier_missing:'+token);
          for(const token of ['shopper-equivalent-universe-v1','mergeMemberProvenance','deltaGroups'])ensure(h.includes(token),'helper_missing:'+token);
          ensure(k.schemaVersion==='cxorbia.c6.shopper-deterministic-suffix.v2.2','contract_version');
          ensure(k.collisionReconciliation?.referenceUniverse===k.collisionReconciliation?.plannerUniverse,'universe_mismatch');
          ensure(k.collisionReconciliation?.deltaOnlyMemberProvenanceExport===true,'delta_only_missing');
          NODE

      - name: Prepare existing DEV credential privately
        if: steps.request.outputs.enabled == 'true'
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          mkdir -p "$PRIVATE_DIR" "$RAW_DIR" "$PLANNER_OUT_DIR" "$GENERIC_OUT_DIR" "$EXPORT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id==='cxorbia-backend-dev'&&p.client_email&&p.private_key))throw new Error('credential_invalid');
          fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE

      - name: Materialize ephemeral planner request
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const planner={
            schemaVersion:'cxorbia.c6.shopper-deterministic-suffix-readonly-request.v1',
            requestId:x.requestId,
            enabled:true,
            consumed:false,
            status:'authorized_execute_once',
            authorizedBy:'Paula',
            allowedExecutions:1,
            repository:x.repository,
            branch:x.branch,
            pullRequest:x.pullRequest,
            targetHeadSha:x.targetHeadSha,
            tenantId:'tya',
            projectId:'cinepolis',
            firebaseProjectId:'cxorbia-backend-dev',
            providerReads:true,
            providerWrites:false,
            expectedProfiles:340,
            expectedPlanRows:340,
            policy:'DETERMINISTIC_TECHNICAL_SUFFIX',
            suffixLengths:[4,6,8],
            groupFingerprintNamespace:'shopper-visible-login-group-v1',
            collisionReconciliationPolicy:'fingerprint_set_membership_not_rigid_aggregate_equality',
            safeState:x.safeState
          };
          fs.writeFileSync(process.env.RAW_DIR+'/planner-request.json',JSON.stringify(planner,null,2)+'\n','utf8');
          NODE

      - name: Execute exactly one provider read-only planner
        if: steps.request.outputs.enabled == 'true'
        id: provider
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.tmp/c6-equivalent-universe-provider-v22-private/credentials.json
          CXORBIA_EXPECTED_PROJECT: cxorbia-backend-dev
          CXORBIA_DEV_ROOT_URL: https://cxorbia-backend-dev.web.app
          CXORBIA_AUDIT_TARGET_HEAD: ${{ steps.request.outputs.target }}
        run: |
          set +e
          node "$PLANNER_FILE" "$RAW_DIR/planner-request.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate sanitize and classify STOP_RETRY
        if: always() && steps.request.outputs.enabled == 'true'
        id: validate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const fail=code=>{throw new Error(code);};
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const reportPath=process.env.PLANNER_OUT_DIR+'/report.json';
          const planPath=process.env.PLANNER_OUT_DIR+'/plan-340.json';
          const matrixPath=process.env.PLANNER_OUT_DIR+'/group-matrix.json';
          if(!fs.existsSync(reportPath)||!fs.existsSync(planPath)||!fs.existsSync(matrixPath))fail('provider_artifacts_missing');
          const report=read(reportPath);
          const plan=read(planPath);
          const groups=read(matrixPath);
          const request=read(process.env.REQUEST_FILE);
          const blockers=[];
          const block=(condition,code)=>{if(condition)blockers.push(code);};
          block(report.source?.profiles!==340,'profiles_not_340');
          block(report.source?.credentialsMapped!==101||report.source?.credentialsUnmapped!==8||report.source?.credentialCrosswalkParity!==true,'crosswalk_not_101_8');
          const s=report.surnameCompletion||{};
          block(s.metricIdentityValid!==true||s.preConsensusIncompleteActiveProfiles!==s.completedByConsensus+s.remainingIncompleteActiveProfiles,'metric_identity_invalid');
          block(!Array.isArray(plan)||plan.length!==340||report.plan?.rows!==340,'plan_rows_not_340');
          block(Array.isArray(plan)&&new Set(plan.map(row=>row.profileFp)).size!==340,'plan_profiles_not_unique');
          const eq=report.equivalentUniverse||{};
          block(eq.version!=='shopper-equivalent-universe-v1','equivalent_universe_version_invalid');
          block(eq.populationPredicate!=='same_tenant_shopper_snapshot','population_predicate_invalid');
          block(eq.activityPredicate!=='equivalentActive_v1','activity_predicate_invalid');
          block(eq.linkingPredicate!=='direct_shopper_id_or_exact_unique_technical_anchor','linking_predicate_invalid');
          block(eq.completenessPredicate!=='post_consensus_active_complete','completeness_predicate_invalid');
          const rec=eq.reconciliation;
          block(!rec||rec.universeVersion!=='shopper-equivalent-universe-v1','reconciliation_missing');
          const fields=['memberFingerprint','active','preConsensusComplete','postConsensusComplete','completedByConsensus','sourceSafeSurnameBasis','surnameBasisCount','keeper','suffixApplied','suffixLength','inReferenceSet','inPlannerSet','referenceEligibility','plannerEligibility','linkedSourceResolutionMode'];
          const allowedBasis=new Set(['explicit_or_technical','multi_source_full_name_consensus','unresolved']);
          const allowedModes=new Set(['profile_only','linked_source','direct_shopper_id','exact_technical_anchor']);
          const validMember=v=>v&&typeof v.memberFingerprint==='string'&&/^[a-f0-9]{20}$/.test(v.memberFingerprint)&&fields.every(k=>Object.hasOwn(v,k))&&['active','preConsensusComplete','postConsensusComplete','completedByConsensus','keeper','suffixApplied','inReferenceSet','inPlannerSet','referenceEligibility','plannerEligibility'].every(k=>typeof v[k]==='boolean')&&Number.isInteger(v.surnameBasisCount)&&Number.isInteger(v.suffixLength)&&[0,4,6,8].includes(v.suffixLength)&&allowedBasis.has(v.sourceSafeSurnameBasis)&&allowedModes.has(v.linkedSourceResolutionMode);
          if(rec){
            block(!Array.isArray(rec.added)||!Array.isArray(rec.removed)||!Array.isArray(rec.deltaGroups),'reconciliation_shape_invalid');
            const expectedDelta=new Set([...(rec.added||[]),...(rec.removed||[])]);
            block((rec.deltaGroups||[]).length!==expectedDelta.size,'delta_group_cardinality_invalid');
            for(const group of rec.deltaGroups||[]){
              if(!expectedDelta.has(group.groupFp)||!Array.isArray(group.memberVectors)||group.memberVectors.length===0||!group.memberVectors.every(validMember))blockers.push('delta_member_provenance_incomplete');
            }
            block((rec.added||[]).length>0||(rec.removed||[]).length>0,'equivalent_universe_set_drift');
          }
          const forbiddenKeys=new Set(['uid','email','name','login','password','firstName','lastName','surname']);
          for(const vector of report.multiAuth?.vectors||[]){
            if(typeof vector.profileFp!=='string'||!Array.isArray(vector.candidateVectors))blockers.push('multi_auth_vector_invalid');
            for(const candidate of vector.candidateVectors||[]){
              if(!Number.isInteger(candidate.candidateOrdinal)||typeof candidate.score!=='number'||typeof candidate.candidateFingerprint!=='string'||!/^[a-f0-9]{20}$/.test(candidate.candidateFingerprint))blockers.push('multi_auth_candidate_invalid');
              if(Object.values(candidate.signals||{}).some(value=>typeof value!=='boolean'))blockers.push('multi_auth_signal_not_boolean');
              if(Object.keys(candidate).some(key=>forbiddenKeys.has(key))||Object.keys(candidate.signals||{}).some(key=>forbiddenKeys.has(key)))blockers.push('multi_auth_raw_identity_key');
            }
          }
          const inspectScalar=value=>{
            if(Array.isArray(value))return value.every(inspectScalar);
            if(value&&typeof value==='object')return Object.entries(value).every(([key,val])=>!forbiddenKeys.has(key)&&inspectScalar(val));
            return value===null||['boolean','number','string'].includes(typeof value);
          };
          for(const row of plan.filter(row=>row.primary==='HOLD'))if(!row.diagnostics||!inspectScalar(row.diagnostics))blockers.push('hold_diagnostics_invalid');
          const holdRows=plan.filter(row=>row.primary==='HOLD').length;
          block(holdRows>0,'plan_contains_hold:'+holdRows);
          block(Number(report.multiAuth?.unresolved||0)>0,'multi_auth_tie:'+Number(report.multiAuth?.unresolved||0));
          block(Number(s.remainingIncompleteActiveProfiles||0)>0,'surname_remaining:'+Number(s.remainingIncompleteActiveProfiles||0));
          block(Number(report.disambiguation?.suffixAllocationHolds||0)>0,'suffix_allocation_hold');
          block(Number(report.disambiguation?.targetCollisionHolds||0)>0,'target_login_collision');
          block(report.safety?.providerWrites!==false||report.safety?.authWrites!==0||report.safety?.firestoreWrites!==0||report.safety?.merge!==false||report.safety?.production!==false,'unsafe_report_state');
          block(report.safety?.rawNamesExported!==false||report.safety?.rawLoginsExported!==false||report.safety?.rawEmailsExported!==false||report.safety?.rawPasswordsExported!==false||report.safety?.uidsExported!==false,'raw_identity_export_flag');
          const uniqueBlockers=[...new Set(blockers)];
          const decision=uniqueBlockers.length?'HOLD_C6_EQUIVALENT_UNIVERSE_PROVIDER_REVALIDATION_STOP_RETRY':'PASS_C6_EQUIVALENT_UNIVERSE_PROVIDER_REVALIDATION_READY_READONLY';
          const sanitizedGroups=groups.map(group=>{
            const {memberVectors,...safe}=group;
            return safe;
          });
          const sanitizedReport={...report,decision,blockers:uniqueBlockers,groupMatrix:sanitizedGroups,providerExecutionCount:1,secondAttempt:0,requestId:request.requestId,requestCommitSha:process.env.GITHUB_SHA,targetHeadSha:request.targetHeadSha,safety:{...report.safety,providerReads:true,providerWrites:false}};
          const summary={
            schemaVersion:'cxorbia.c6.equivalent-universe-provider-validation.v1',
            generatedAt:new Date().toISOString(),
            decision,
            blockers:uniqueBlockers,
            providerExecutionCount:1,
            secondAttempt:0,
            providerExitCode:Number('${{ steps.provider.outputs.exit_code }}'||0),
            source:{profiles:report.source?.profiles,credentialsMapped:report.source?.credentialsMapped,credentialsUnmapped:report.source?.credentialsUnmapped,credentialCrosswalkParity:report.source?.credentialCrosswalkParity},
            surnameCompletion:s,
            equivalentUniverse:eq,
            multiAuth:report.multiAuth,
            plan:{rows:report.plan?.rows,operationCounts:report.plan?.operationCounts,subchangeCounts:report.plan?.subchangeCounts,digest:report.plan?.digest,holdRows,readyForAuthRepair:report.plan?.readyForAuthRepair,executable:false,partialExecutionAllowed:false},
            safety:{providerReads:1,providerWrites:0,authWrites:0,passwordChanges:0,passwordResets:0,membershipWrites:0,firestoreWrites:0,rulesWrites:0,storageWrites:0,hrWrites:0,hostingDeploys:0,cloudRunDeploys:0,makeCalls:0,geminiCalls:0,paymentWrites:0,merge:false,production:false,rawIdentityExported:false}
          };
          fs.mkdirSync(process.env.EXPORT_DIR,{recursive:true});
          fs.writeFileSync(path.join(process.env.EXPORT_DIR,'report-source-safe.json'),JSON.stringify(sanitizedReport,null,2)+'\n','utf8');
          fs.writeFileSync(path.join(process.env.EXPORT_DIR,'plan-340-source-safe.json'),JSON.stringify(plan,null,2)+'\n','utf8');
          fs.writeFileSync(path.join(process.env.EXPORT_DIR,'group-matrix-source-safe.json'),JSON.stringify(sanitizedGroups,null,2)+'\n','utf8');
          fs.writeFileSync(path.join(process.env.EXPORT_DIR,'validation-summary-source-safe.json'),JSON.stringify(summary,null,2)+'\n','utf8');
          fs.writeFileSync(path.join(process.env.EXPORT_DIR,'decision.txt'),decision+'\n','utf8');
          const digest=crypto.createHash('sha256').update(JSON.stringify(summary)).digest('hex');
          fs.writeFileSync(path.join(process.env.EXPORT_DIR,'validation-summary.sha256'),digest+'\n','utf8');
          NODE

      - name: Upload source-safe evidence
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-equivalent-universe-provider-v22-${{ github.run_id }}
          path: .tmp/c6-equivalent-universe-provider-v22-export/
          if-no-files-found: error
          retention-days: 14

      - name: Remove private and non-exported raw material
        if: always()
        run: rm -rf "$PRIVATE_DIR" "$RAW_DIR" "$PLANNER_OUT_DIR" "$GENERIC_OUT_DIR"

      - name: Enforce STOP_RETRY result
        if: steps.request.outputs.enabled == 'true'
        run: |
          decision=$(cat "$EXPORT_DIR/decision.txt")
          if [ "$decision" != 'PASS_C6_EQUIVALENT_UNIVERSE_PROVIDER_REVALIDATION_READY_READONLY' ]; then
            echo "$decision"
            exit 1
          fi

      - name: Publish observable status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=success
          DESC='PASS_C6_EQUIVALENT_UNIVERSE_PROVIDER_V22_READONLY'
          if [ '${{ steps.request.outputs.enabled }}' != 'true' ]; then DESC='SKIPPED_DISABLED_REQUEST'; fi
          if [ '${{ job.status }}' != 'success' ]; then STATE=failure; DESC='HOLD_C6_EQUIVALENT_UNIVERSE_PROVIDER_V22_STOP_RETRY'; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context='cxorbia/c6-equivalent-universe-provider-v22/overall' -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
