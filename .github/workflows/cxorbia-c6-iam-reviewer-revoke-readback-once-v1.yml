name: CXOrbia C6 IAM Reviewer Revoke Readback Once V1

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

env:
  REQUEST_FILE: backend/config/c6-iam-reviewer-revoke-readback-request-v1.json
  OUT_DIR: .tmp/c6-iam-reviewer-revoke-readback-v1
  GCP_PROJECT_ID: cxorbia-backend-dev
  TARGET_SA_EMAIL: cxorbia-c6-runner-dev@cxorbia-backend-dev.iam.gserviceaccount.com
  REVIEWER_SA_EMAIL: firebase-adminsdk-fbsvc@cxorbia-backend-dev.iam.gserviceaccount.com
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  readback:
    name: Prove temporary Security Reviewer effective revocation
    if: >-
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'docs-tya-v6-v71-audit' &&
      github.event.pull_request.base.ref == 'release/cxorbia-tya-rc-20260630'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact read-only request
        id: request
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const ok=
            x.schemaVersion==='cxorbia.c6.iam-reviewer-revoke-readback.request.v1' &&
            x.requestId==='c6-iam-reviewer-revoke-readback-20260807-01' &&
            x.enabled===true && x.consumed===false && x.status==='authorized_execute_once' &&
            x.authorizedBy==='Paula' && Number(x.allowedExecutions)===1 &&
            x.repository==='paulaosoriof86/demoCXOrbia' && x.branch==='docs-tya-v6-v71-audit' && Number(x.pullRequest)===7 &&
            x.providerProject===process.env.GCP_PROJECT_ID && x.reviewerServiceAccount===process.env.REVIEWER_SA_EMAIL &&
            x.sourceLockMode==='github.event.pull_request.head.sha' && head===process.env.PR_HEAD_SHA &&
            x.safeState?.iamWrites===false && x.safeState?.deploy===false && x.safeState?.providerReads===false &&
            x.safeState?.skip13Execution===false && x.safeState?.merge===false && x.safeState?.production===false;
          if(!ok) throw new Error('IAM_REVIEWER_REVOKE_READBACK_REQUEST_INVALID');
          fs.writeFileSync(process.env.OUT_DIR+'/request-source-safe.json',JSON.stringify({requestId:x.requestId,sourceLock:head,reviewer:x.reviewerServiceAccount,safeState:x.safeState},null,2)+'\n');
          NODE

      - name: Claim single readback
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses" --paginate --jq '[.[] | select(.context=="cxorbia/c6-iam-reviewer-revoke-readback-v1/claim")] | length')
          if [ "$existing" != '0' ]; then echo 'claimed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state='pending' -f context='cxorbia/c6-iam-reviewer-revoke-readback-v1/claim' \
            -f description='CLAIMED_SINGLE_REVOKE_READBACK' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Stop duplicate before Google Cloud
        if: steps.claim.outputs.claimed != 'true'
        run: exit 2

      - name: Authenticate DEV control-plane identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cxorbia-backend-dev

      - name: Verify temporary reviewer permissions are gone
        run: |
          set -euo pipefail
          active=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          printf '%s\n' "$active" > "$OUT_DIR/active-account.txt"
          test "$active" = "$REVIEWER_SA_EMAIL"
          gcloud iam service-accounts describe "$TARGET_SA_EMAIL" --project "$GCP_PROJECT_ID" --format=json > "$OUT_DIR/target-identity.json"
          token=$(gcloud auth print-access-token)
          curl -sS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions" \
            -d '{"permissions":["resourcemanager.projects.getIamPolicy","iam.serviceAccounts.getIamPolicy","iam.serviceAccountKeys.list"]}' \
            > "$OUT_DIR/test-iam-permissions.json"
          set +e
          gcloud projects get-iam-policy "$GCP_PROJECT_ID" --format=json > "$OUT_DIR/project-policy-unexpected.json" 2> "$OUT_DIR/project-policy-denied.txt"; project_rc=$?
          gcloud iam service-accounts get-iam-policy "$TARGET_SA_EMAIL" --project "$GCP_PROJECT_ID" --format=json > "$OUT_DIR/sa-policy-unexpected.json" 2> "$OUT_DIR/sa-policy-denied.txt"; sa_policy_rc=$?
          gcloud iam service-accounts keys list --iam-account "$TARGET_SA_EMAIL" --project "$GCP_PROJECT_ID" --managed-by=user --format=json > "$OUT_DIR/keys-unexpected.json" 2> "$OUT_DIR/keys-denied.txt"; keys_rc=$?
          set -e
          export project_rc sa_policy_rc keys_rc
          node <<'NODE'
          const fs=require('fs');
          const out=process.env.OUT_DIR;
          const t=JSON.parse(fs.readFileSync(out+'/test-iam-permissions.json','utf8'));
          const granted=Array.isArray(t.permissions)?t.permissions.slice().sort():[];
          const expected=['iam.serviceAccountKeys.list','iam.serviceAccounts.getIamPolicy','resourcemanager.projects.getIamPolicy'];
          const projectRc=Number(process.env.project_rc||0), saRc=Number(process.env.sa_policy_rc||0), keysRc=Number(process.env.keys_rc||0);
          const pass=expected.every(p=>!granted.includes(p)) && projectRc!==0 && saRc!==0 && keysRc!==0;
          const result={schemaVersion:'cxorbia.c6.iam-reviewer-revoke-readback.result.v1',decision:pass?'PASS_TEMP_SECURITY_REVIEWER_EFFECTIVELY_REVOKED':'STOP_RETRY_TEMP_SECURITY_REVIEWER_STILL_EFFECTIVE_OR_UNPROVEN',project:process.env.GCP_PROJECT_ID,reviewer:process.env.REVIEWER_SA_EMAIL,target:process.env.TARGET_SA_EMAIL,effectiveSensitiveIamPermissions:granted,checks:{projectGetIamPolicyReturnCode:projectRc,serviceAccountGetIamPolicyReturnCode:saRc,userManagedKeysListReturnCode:keysRc},temporaryReviewerEffective:false,iamWrites:0,deploys:0,providerReads:0,providerWrites:0,skip13Executed:false,merge:false,production:false};
          fs.writeFileSync(out+'/verification-result.json',JSON.stringify(result,null,2)+'\n');
          fs.writeFileSync(out+'/decision.txt',result.decision+'\n');
          console.log(JSON.stringify(result,null,2));
          if(!pass) process.exit(23);
          NODE

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-c6-iam-reviewer-revoke-readback-v1-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Publish terminal statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; desc='STOP_RETRY_C6_IAM_REVIEWER_REVOKE_READBACK_V1'
          if [ "$JOB_STATE" = 'success' ]; then state=success; desc='PASS_C6_IAM_REVIEWER_REVOKE_READBACK_V1'; fi
          for context in cxorbia/c6-iam-reviewer-revoke-readback-v1/overall cxorbia/c6-iam-reviewer-revoke-readback-v1/claim; do
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
              -f state="$state" -f context="$context" -f description="$desc" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          done
