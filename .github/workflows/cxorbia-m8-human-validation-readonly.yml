name: CXOrbia M9 Provider Precutover Read Only

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - backend/config/m9-provider-precutover-readonly-execute.json

permissions:
  contents: read

concurrency:
  group: cxorbia-m9-provider-precutover-readonly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXECUTE_FILE: backend/config/m9-provider-precutover-readonly-execute.json
  CONTRACT_FILE: backend/contracts/m9-provider-precutover-readiness-v1.json
  PROMOTION_FILE: backend/config/cxorbia-production-promotion-contract.json
  OUT_DIR: .tmp/m9-provider-precutover
  PRIVATE_DIR: .tmp/m9-provider-precutover/private
  M9_ACTION: M9_PROVIDER_PRECUTOVER_READINESS_READONLY
  GCP_PROJECT_ID: cxorbia-backend-dev
  HOSTING_SITE: cxorbia-backend-dev

jobs:
  m9-provider-precutover:
    name: Capture current Hosting release and rollback path, zero production mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact live branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          ref: docs-tya-v6-v71-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exclude ephemeral material
        run: |
          printf '%s\n' '.tmp/' 'node_modules/' '.firebase/' 'firebase-debug.log' 'gha-creds-*.json' >> .git/info/exclude

      - name: Validate exact M9 read-only authorization and commit scope
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.EXECUTE_FILE,'utf8'));
          const c=JSON.parse(fs.readFileSync(process.env.CONTRACT_FILE,'utf8'));
          const p=JSON.parse(fs.readFileSync(process.env.PROMOTION_FILE,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(x.schemaVersion!=='cxorbia.m9.provider-precutover-readonly.request.v1')throw new Error('M9_REQUEST_SCHEMA_INVALID');
          if(x.mode!=='PROVIDER_READONLY_PRECUTOVER_ONCE'||x.action!==process.env.M9_ACTION)throw new Error('M9_REQUEST_MODE_INVALID');
          if(x.repository!=='paulaosoriof86/demoCXOrbia'||x.branch!=='docs-tya-v6-v71-audit'||Number(x.pullRequest)!==7)throw new Error('M9_LANE_INVALID');
          if(x.firebaseProjectId!==process.env.GCP_PROJECT_ID||x.hostingSite!==process.env.HOSTING_SITE)throw new Error('M9_TARGET_INVALID');
          if(x.enabled!==true||x.consumed!==false||x.status!=='authorized_execute_once'||x.authorizedBy!=='Paula')throw new Error('M9_AUTHORIZATION_STATE_INVALID');
          if(x.targetHeadSha!==parent||!x.targetHeadSha||head===parent)throw new Error('M9_TARGET_HEAD_INVALID');
          if(changed.length!==1||changed[0]!==process.env.EXECUTE_FILE)throw new Error('M9_EXECUTE_COMMIT_SCOPE_INVALID:'+changed.join(','));
          if(Number(x.allowedExecutions)!==1||x.productionReadsAllowed!==true||Number(x.maxAuthenticatedHostingGets)!==2)throw new Error('M9_READ_SCOPE_INVALID');
          for(const key of ['hostingDeploys','cloudRunDeploys','firestoreWrites','authWrites','hrWrites','rulesWrites','storageWrites','makeCalls','geminiCalls','paymentWrites'])if(Number(x[key]||0)!==0)throw new Error('M9_UNSAFE_SCOPE_'+key);
          if(x.rollbackExecution!==false||x.productionMutation!==false||x.merge!==false||x.containsPii!==false||x.containsSecrets!==false)throw new Error('M9_UNSAFE_SCOPE');
          if(c.schemaVersion!=='cxorbia.m9.provider-precutover-readiness.v1'||c.milestone!=='M9'||Number(c.points)!==3)throw new Error('M9_CONTRACT_INVALID');
          if(c.providerReadPhase?.passDecision!=='PASS_M9_PROVIDER_PRECUTOVER_READINESS_READONLY'||c.promotionPhase?.explicitNewGateRequired!==true||c.promotionPhase?.authorizedByThisContract!==false)throw new Error('M9_CONTRACT_BOUNDARY_INVALID');
          if(p.strategy!=='PROMOTE_EXISTING_CLEAN_PROJECT'||p.productionProjectId!==process.env.GCP_PROJECT_ID||p.productionHostingSite!==process.env.HOSTING_SITE||p.productionCutoverAuthorizedByThisContract!==false)throw new Error('M9_PROMOTION_CONTRACT_INVALID');
          fs.writeFileSync(process.env.OUT_DIR+'/authorization.json',JSON.stringify({
            schemaVersion:'cxorbia.m9.provider-precutover.authorization.v1',requestId:x.requestId,requestCommitSha:head,targetHeadSha:parent,authorizedBy:x.authorizedBy,authorizationSource:x.authorizationSource,action:x.action,mode:x.mode,
            scope:{productionReadsAllowed:true,maxAuthenticatedHostingGets:2,publicDiscoveryGets:1},
            safety:{hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,hrWrites:0,rulesWrites:0,storageWrites:0,rollbackExecution:false,productionMutation:false,merge:false}
          },null,2)+'\n','utf8');
          NODE

      - name: Validate production target source-only before provider read
        run: |
          set -euo pipefail
          node --check tools/qa/cxorbia-c6-production-target-preflight-source-only.mjs
          node --check tools/qa/tya-m9-provider-precutover-readiness-readonly.mjs
          node tools/qa/cxorbia-c6-production-target-preflight-source-only.mjs --out "$OUT_DIR/source-preflight.json" || true
          node -e "const r=require('./.tmp/m9-provider-precutover/source-preflight.json');if(r.decision!=='PASS_PRODUCTION_PROMOTION_CONTRACT_EXISTING_CLEAN_PROJECT')throw new Error('M9_SOURCE_PREFLIGHT_NOT_PASS:'+r.decision);"

      - name: Materialize existing service account privately for read-only Hosting API
        env:
          EXISTING_DEV_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CXORBIA_BACKEND_DEV }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.EXISTING_DEV_JSON||'';
          let p=null;try{p=JSON.parse(raw);}catch{}
          if(!(p&&p.type==='service_account'&&p.project_id===process.env.GCP_PROJECT_ID&&p.client_email&&p.private_key))throw new Error('M9_CREDENTIAL_SECRET_INVALID');
          fs.writeFileSync(process.env.PRIVATE_DIR+'/credentials.json',raw,{mode:0o600});
          NODE

      - name: Execute M9 provider pre-cutover read-only gate
        id: m9
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.tmp/m9-provider-precutover/private/credentials.json
          CXORBIA_M9_ACTION: ${{ env.M9_ACTION }}
          CXORBIA_M9_CONTRACT: ${{ env.CONTRACT_FILE }}
          CXORBIA_PRODUCTION_PROMOTION_CONTRACT: ${{ env.PROMOTION_FILE }}
          CXORBIA_M9_OUTPUT: .tmp/m9-provider-precutover/report.json
        run: |
          set +e
          node tools/qa/tya-m9-provider-precutover-readiness-readonly.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized M9 summary
        if: always()
        env:
          M9_EXIT_CODE: ${{ steps.m9.outputs.exit_code }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const authorization=read(process.env.OUT_DIR+'/authorization.json');
          const sourcePreflight=read(process.env.OUT_DIR+'/source-preflight.json');
          const provider=read(process.env.OUT_DIR+'/report.json');
          const pass=String(process.env.M9_EXIT_CODE||'1')==='0'
            &&provider?.decision==='PASS_M9_PROVIDER_PRECUTOVER_READINESS_READONLY'
            &&provider?.preCutoverRelease?.versionStatus==='FINALIZED'
            &&provider?.rollbackReadiness?.status==='READY_CAPTURED_FINALIZED_VERSION_PROVIDER_METHOD_VERIFIED'
            &&provider?.rollbackReadiness?.executionAuthorized===false
            &&provider?.safety?.providerWrites===0
            &&provider?.safety?.productionMutation===false
            &&sourcePreflight?.decision==='PASS_PRODUCTION_PROMOTION_CONTRACT_EXISTING_CLEAN_PROJECT';
          const summary={
            schemaVersion:'cxorbia.m9.provider-precutover.final-run.v1',generatedAt:new Date().toISOString(),
            decision:pass?'PASS_M9_PROVIDER_PRECUTOVER_READINESS_READONLY':'FAIL_M9_PROVIDER_PRECUTOVER_READINESS_READONLY',
            authorization,sourcePreflight,provider,
            phaseA:{entryPercent:96,m9PointsCertifiedNow:0,certifiedPercent:96,remainingPercent:4,m9State:pass?'PRECUTOVER_READY_AWAITING_EXPLICIT_PROMOTION_GATE':'PRECUTOVER_NOT_READY'},
            next:pass?'M9_EXPLICIT_CUTOVER_ONE_PRODUCTION_PROMOTION_REQUIRES_NEW_EXPLICIT_GATE':'M9_STOP_BEFORE_PRODUCTION',
            safety:{hostingDeploys:0,cloudRunDeploys:0,firestoreWrites:0,authWrites:0,hrWrites:0,rulesWrites:0,storageWrites:0,rollbackExecution:false,productionMutation:false,merge:false,credentialsExposed:false,tokensExposed:false}
          };
          fs.writeFileSync(process.env.OUT_DIR+'/summary.json',JSON.stringify(summary,null,2)+'\n','utf8');
          NODE

      - name: Remove private credential before artifact
        if: always()
        run: |
          rm -rf "$PRIVATE_DIR"
          test ! -e "$PRIVATE_DIR/credentials.json"

      - name: Capture repository delta evidence
        if: always()
        run: |
          mkdir -p "$OUT_DIR/repository-status"
          git status --porcelain=v1 > "$OUT_DIR/repository-status/status-porcelain.txt"
          git diff --name-status > "$OUT_DIR/repository-status/tracked-delta.txt"
          git ls-files --others --exclude-standard > "$OUT_DIR/repository-status/untracked.txt"

      - name: Upload sanitized M9 pre-cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-m9-provider-precutover-${{ github.run_id }}
          path: |
            .tmp/m9-provider-precutover
          if-no-files-found: error
          retention-days: 14

      - name: Assert M9 provider pre-cutover PASS
        if: always()
        run: |
          node -e "const r=require('./.tmp/m9-provider-precutover/summary.json');if(r.decision!=='PASS_M9_PROVIDER_PRECUTOVER_READINESS_READONLY')throw new Error('M9_PRECUTOVER_NOT_PASS:'+JSON.stringify({decision:r.decision,error:r.provider?.error||null}));console.log(JSON.stringify({decision:r.decision,phaseA:r.phaseA,next:r.next,release:r.provider?.preCutoverRelease?.releaseName,version:r.provider?.preCutoverRelease?.versionName}));"
