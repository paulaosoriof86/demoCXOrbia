name: CXOrbia M9 Production Hosting Entry Source Gate

on:
  push:
    branches:
      - docs-tya-v6-v71-audit
    paths:
      - backend/config/m9-provider-precutover-readonly-execute.json

permissions:
  contents: read

concurrency:
  group: cxorbia-m9-production-hosting-entry-source-gate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXECUTE_FILE: backend/config/m9-provider-precutover-readonly-execute.json
  OUT_DIR: .tmp/m9-production-hosting-entry-source-gate
  ACTION_NAME: M9_PRODUCTION_HOSTING_ENTRY_PARITY_SOURCE_GATE

jobs:
  source-gate:
    name: Verify production Hosting entry semantics, zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 150
          ref: docs-tya-v6-v71-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source-only request and exact trigger scope
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const x=JSON.parse(fs.readFileSync(process.env.EXECUTE_FILE,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=cp.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          if(x.schemaVersion!=='cxorbia.m9.production-hosting-entry-source-gate.request.v1')throw new Error('M9_SOURCE_GATE_REQUEST_SCHEMA_INVALID');
          if(x.action!==process.env.ACTION_NAME||x.mode!=='SOURCE_ONLY_NO_PROVIDER')throw new Error('M9_SOURCE_GATE_ACTION_INVALID');
          if(x.repository!=='paulaosoriof86/demoCXOrbia'||x.branch!=='docs-tya-v6-v71-audit'||Number(x.pullRequest)!==7)throw new Error('M9_SOURCE_GATE_LANE_INVALID');
          if(x.enabled!==true||x.status!=='execute_once_source_only'||x.targetHeadSha!==parent)throw new Error('M9_SOURCE_GATE_TARGET_INVALID');
          if(changed.length!==1||changed[0]!==process.env.EXECUTE_FILE)throw new Error('M9_SOURCE_GATE_TRIGGER_SCOPE_INVALID:'+changed.join(','));
          if(x.productionPromotionsRemaining!==0||x.providerReads!==0||x.providerWrites!==0||x.hostingDeploys!==0||x.productionMutation!==false||x.merge!==false)throw new Error('M9_SOURCE_GATE_NOT_SOURCE_ONLY');
          fs.writeFileSync(process.env.OUT_DIR+'/authorization.json',JSON.stringify({requestId:x.requestId,requestCommitSha:head,targetHeadSha:parent,action:x.action,mode:x.mode,safety:{providerReads:0,providerWrites:0,hostingDeploys:0,productionMutation:false,merge:false}},null,2)+'\n');
          NODE

      - name: Execute Hosting entry parity source gate
        run: |
          set -euo pipefail
          node --check tools/qa/tya-m9-production-hosting-entry-parity-source-gate.mjs
          node tools/qa/tya-m9-production-hosting-entry-parity-source-gate.mjs > "$OUT_DIR/report.json"
          node -e "const r=require('./'+process.env.OUT_DIR+'/report.json');if(r.decision!=='PASS_M9_PRODUCTION_HOSTING_ENTRY_PARITY_SOURCE_GATE')throw new Error('M9_SOURCE_GATE_NOT_PASS:'+JSON.stringify(r));console.log(JSON.stringify({decision:r.decision,classification:r.classification,next:r.next,checks:r.checks}));"

      - name: Capture repository status
        if: always()
        run: |
          git status --porcelain=v1 > "$OUT_DIR/status.txt"

      - name: Upload source-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxorbia-m9-production-hosting-entry-source-${{ github.run_id }}
          path: |
            .tmp/m9-production-hosting-entry-source-gate
          if-no-files-found: error
          retention-days: 30
